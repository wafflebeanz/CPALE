<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CPALE Tax Reviewer</title>
<meta name="description" content="Interactive CPALE Taxation reviewer with Study, Blind Recall and Quiz modes, updated to CMEPA.">
<style>
:root{
  --nav-h:54px;
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#f1efe8; --ink:#1c1c1f; --muted:#67676d; --line:#e2dfd5;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec; --accent2:#4338ca;
  --pct:#1d4ed8; --peso:#047857; --kw:#b42318; --mark-bg:#fde68a; --mark-ink:#3b2f00;
  --c-r:#c62828; --c-g:#1f7a33; --c-b:#1565c0; --c-o:#c2410c; --c-p:#7e22ce;
  --ok:#15803d; --ok-soft:#dcfce7; --bad:#b91c1c; --bad-soft:#fee2e2; --mid:#b45309; --mid-soft:#fef3c7;
  --cover:#e9e6dc; --cover-ink:#8a877c; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
  --grp:#ece9df;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --surface:#1a1c20; --surface2:#22252a; --ink:#ebe9e4; --muted:#a3a19b; --line:#30333a;
    --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123b37; --accent2:#a5b4fc;
    --pct:#93c5fd; --peso:#6ee7b7; --kw:#fca5a5; --mark-bg:#854d0e; --mark-ink:#fff7d6;
    --c-r:#f87171; --c-g:#4ade80; --c-b:#60a5fa; --c-o:#fb923c; --c-p:#c084fc;
    --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3a1717; --mid:#fbbf24; --mid-soft:#3a2c0b;
    --cover:#2a2d33; --cover-ink:#8d8b85; --shadow:0 1px 2px rgba(0,0,0,.4); --grp:#24272d;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --surface:#1a1c20; --surface2:#22252a; --ink:#ebe9e4; --muted:#a3a19b; --line:#30333a;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#123b37; --accent2:#a5b4fc;
  --pct:#93c5fd; --peso:#6ee7b7; --kw:#fca5a5; --mark-bg:#854d0e; --mark-ink:#fff7d6;
  --c-r:#f87171; --c-g:#4ade80; --c-b:#60a5fa; --c-o:#fb923c; --c-p:#c084fc;
  --ok:#4ade80; --ok-soft:#14321f; --bad:#f87171; --bad-soft:#3a1717; --mid:#fbbf24; --mid-soft:#3a2c0b;
  --cover:#2a2d33; --cover-ink:#8d8b85; --shadow:0 1px 2px rgba(0,0,0,.4); --grp:#24272d;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px;flex-wrap:wrap}
.brand{flex:1;min-width:200px}
.brand h1{margin:0;font-size:20px;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.iconbtn{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:7px 11px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{border-color:var(--accent)}
nav.tabs{position:sticky;top:0;z-index:20;background:var(--bg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.modebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.small button{padding:5px 10px;font-size:12.5px}
.tabdesc{color:var(--muted);font-size:13.5px;margin:4px 0 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0 12px}
.toolbar .lbl{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.toolbar .sp{flex:1}
.search{flex:1 1 180px;min-width:150px;border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:7px 10px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:9px;padding:6px 11px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;white-space:nowrap;color:var(--ink);text-decoration:none}
.chip:hover{border-color:var(--accent)}
.chip .gl{color:var(--muted);font-weight:600;margin-right:4px}
.grouph{margin:22px 0 4px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0 16px;box-shadow:var(--shadow);overflow:clip;scroll-margin-top:calc(var(--nav-h) + 10px)}
@supports not (overflow:clip){.sec{overflow:visible}}
.sec-h{display:flex;align-items:center;gap:8px;padding:12px 14px 8px;flex-wrap:wrap}
.sec-h h3{margin:0;font-size:16px;flex:1;min-width:200px}
.sec-h .cnt{font-size:12px;color:var(--muted)}
.note{margin:0 14px 10px;padding:8px 11px;background:var(--surface2);border-left:3px solid var(--accent2);border-radius:6px;font-size:13px}
.tblwrap{overflow:visible}
table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
/* sticky headers: each table's header pins under the tab bar until its table scrolls out of view */
.tbl thead th{position:-webkit-sticky;position:sticky;top:var(--nav-h);z-index:5;background-clip:padding-box;box-shadow:0 2px 4px -2px rgba(0,0,0,.12)}
dialog .tbl thead th{top:0}
.tbl th{background:var(--surface2);text-align:left;padding:7px 10px;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.key{font-weight:500}
.tbl td.idx{white-space:nowrap;color:var(--muted);font-weight:700;width:1%}
.tbl tr.grp td{background:var(--grp);font-weight:700;font-size:12.5px;color:var(--ink);padding:6px 10px}
.tbl tr.repealed td{opacity:.7}
.tbl tr.hit td{background:color-mix(in srgb,var(--mark-bg) 30%,transparent)}
.pct{color:var(--pct);font-weight:700}
.peso{color:var(--peso);font-weight:700}
.kw{color:var(--kw);font-weight:700}
mark{background:var(--mark-bg);color:var(--mark-ink);padding:0 3px;border-radius:3px}
mark .pct,mark .peso{color:inherit}
del{color:var(--c-r);text-decoration-thickness:2px}
.c-r{color:var(--c-r);font-weight:700}.c-g{color:var(--c-g);font-weight:700}.c-b{color:var(--c-b);font-weight:700}.c-o{color:var(--c-o);font-weight:700}.c-p{color:var(--c-p);font-weight:700}
em{color:var(--c-p)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.03em;padding:1px 6px;border-radius:5px;vertical-align:1px;margin-left:3px;white-space:nowrap;font-style:normal}
.b-cmepa{background:#0f766e;color:#fff}.b-upd{background:#1d4ed8;color:#fff}.b-new{background:#7e22ce;color:#fff}.b-rep{background:#b91c1c;color:#fff}.b-eopt{background:#c2410c;color:#fff}.b-rr{background:#475569;color:#fff}.b-add{background:#a16207;color:#fff}
.was{font-size:12px;color:var(--muted);margin-top:3px}
.cnote{font-size:12px;color:var(--muted);font-style:italic;margin-top:3px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
.legend span{display:inline-flex;gap:4px;align-items:center}
/* blind recall */
td.ans.hid .real{display:none}
td.ans.hid .cover{display:flex}
td.ans .cover{display:none;align-items:center;justify-content:center;min-height:30px;background:var(--cover);color:var(--cover-ink);border-radius:7px;font-size:12px;font-weight:600;border:1px dashed color-mix(in srgb,var(--cover-ink) 50%,transparent);cursor:pointer;user-select:none;padding:4px 8px}
td.ans .cover:hover{border-color:var(--accent);color:var(--accent)}
td.ans.shown .real{animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(-2px)}to{opacity:1;transform:none}}
.typebox{display:none;gap:5px;align-items:center}
td.ans.typing .typebox{display:flex}
td.ans.typing .cover{display:none!important}
.typebox input{flex:1;min-width:60px;border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:5px 8px;font-size:13px}
.typebox input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.typebox button{border:1px solid var(--line);background:var(--surface2);border-radius:7px;padding:4px 8px;font-size:12px;font-weight:700}
.verdict{font-size:11.5px;font-weight:800;margin-bottom:3px;display:inline-block;padding:1px 6px;border-radius:5px}
.v-ok{background:var(--ok-soft);color:var(--ok)}.v-mid{background:var(--mid-soft);color:var(--mid)}.v-bad{background:var(--bad-soft);color:var(--bad)}
td.res-ok{box-shadow:inset 3px 0 0 var(--ok)}td.res-mid{box-shadow:inset 3px 0 0 var(--mid)}td.res-bad{box-shadow:inset 3px 0 0 var(--bad)}
.mast{font-size:10px;color:var(--ok);font-weight:800;margin-left:4px}
td.key.hidkey .real{display:none}
td.key.hidkey .cover{display:flex}
td.key .cover{display:none}
.rprog{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:8px 0;margin-top:10px}
.rprog .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;flex:1;min-width:100px;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin:10px 0}
.qmeta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12.5px;flex-wrap:wrap;margin-bottom:8px}
.qprompt{font-size:16.5px;font-weight:600;margin:4px 0 4px}
.qask{font-size:14px;color:var(--muted);margin-bottom:12px}
.qask b{color:var(--accent2)}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:11px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:var(--surface);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.explain{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:13.5px}
.explain table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px}
.explain td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
.explain td:first-child{color:var(--muted);font-weight:700;width:30%;white-space:nowrap}
.qnav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.score{font-weight:800;font-size:15px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.panel h3{margin:0 0 10px;font-size:15px}
.field{margin:10px 0}
.field .lbl{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.secpick{display:flex;flex-wrap:wrap;gap:6px}
.secpick label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--surface2);cursor:pointer}
.secpick input{accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface2);border-radius:10px;padding:8px 10px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600}
.spark{display:flex;gap:4px;align-items:flex-end;height:64px;margin:12px 0 4px;padding:0 2px;border-bottom:1px solid var(--line)}
.spark i{flex:1;background:var(--accent);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.spark i.lo{background:var(--bad)}.spark i.md{background:var(--mid)}
.mastery{margin-top:12px}
.mrow{display:grid;grid-template-columns:1fr 90px 42px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.mrow .bar{height:6px}
.missed{margin-top:12px}
.missed li{margin:6px 0;font-size:13px}
.done-hero{text-align:center;padding:10px 0 4px}
.done-hero .big{font-size:42px;font-weight:800;letter-spacing:-.02em}
.empty{color:var(--muted);font-size:13px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--surface);color:var(--ink);max-width:640px;width:calc(100% - 32px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
footer{color:var(--muted);font-size:12px;padding:20px 0 40px;text-align:center}
@media (max-width:760px){
  body{font-size:14.5px}
  .brand h1{font-size:17px}
  .grid2{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .seg{width:100%}
  .seg button{flex:1;padding:8px 6px}
  .seg.small{width:auto}
  .seg.small button{flex:0 0 auto}
  .iconbtn .t{display:none}
  header.top .wrap{flex-wrap:nowrap}
  .brand{min-width:0}
  .tblwrap{overflow:visible}
  table.tbl, .tbl tbody, .tbl tr, .tbl td{display:block;width:100%}
  .tbl thead{display:none}
  .tbl tr{border-bottom:1px solid var(--line);padding:6px 0;display:flex!important;flex-wrap:wrap}
  .tbl td{flex:1 1 100%}
  .tbl td.short{flex:1 1 28%;min-width:28%}
  .tbl td.idx{flex:0 0 auto}
  .tbl td.key{flex:1 1 75%}
  .tbl td.idx.key, .tbl td.idx{flex:0 0 auto}
  .tbl td.idx + td.key{flex:1 1 75%;min-width:0;padding-left:6px}
  .tbl tr:last-child{border-bottom:0}
  .tbl td{border:0;padding:4px 12px}
  .tbl td[data-label]:not(.key)::before{content:attr(data-label);display:block;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:1px}
  .tbl td.key{font-weight:600}
  .tbl td.idx{width:auto;padding-right:0}
  .tbl tr.grp{display:block!important}
  .tbl tr.grp td{padding:6px 12px}
  .tbl td.empty-cell{display:none}
  .toolbar{padding:8px}
  .qcard{padding:14px}
  .qprompt{font-size:15.5px}
}
@media print{nav.tabs,.modebar,.toolbar,.rprog,header .iconbtn{display:none}.sec{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>CPALE Tax Reviewer</h1><p id="updline"></p></div>
  <button class="iconbtn" id="btnStats" title="Progress across all tabs">📊 <span class="t">Progress</span></button>
  <button class="iconbtn" id="btnTheme" title="Toggle light/dark">🌓 <span class="t">Theme</span></button>
</div></header>
<nav class="tabs" aria-label="Topics"><div class="wrap" id="tabs" role="tablist"></div></nav>
<main class="wrap">
  <div class="modebar">
    <div class="seg" id="modes" role="group" aria-label="Study mode">
      <button data-mode="study">📖 Study</button>
      <button data-mode="recall">🙈 Blind Recall</button>
      <button data-mode="quiz">✅ Quiz Self-Check</button>
    </div>
  </div>
  <div class="tabdesc" id="tabdesc"></div>
  <div id="content"></div>
</main>
<div id="rprog"></div>
<footer>Source: "Updated Tax Reviewer (Ivy altered)" workbook, updated to current law. Progress is saved in this browser only.</footer>
<dialog id="dlg"></dialog>
<script>

const LS_KEY = 'cpaleTaxReviewer.v1';
function loadStore(){ try{ const s = JSON.parse(localStorage.getItem(LS_KEY)); if(s && typeof s === 'object') return Object.assign({tabs:{}, prefs:{}, recall:{}}, s); }catch(e){} return {tabs:{}, prefs:{}, recall:{}}; }
let store = loadStore();
function saveStore(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
const P = store.prefs;
const state = { tab: P.tab || DATA.tabs[0].id, mode: P.mode || 'study', answerStyle: P.answerStyle || 'tap', hide: P.hide || 'answers', search: '', quiz: null };
if(!DATA.tabs.some(t => t.id === state.tab)) state.tab = DATA.tabs[0].id;

/* ---------- formatting ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(src){
  if(src == null) return '';
  let s = esc(src);
  s = s.replace(/(₱\s?[\d,]+(?:\.\d+)?(?:M)?)/g, '<span class="peso">$1</span>');
  s = s.replace(/(\d+\/\d+ of 1%|\d+(?:\.\d+)?%)/g, '<span class="pct">$1</span>');
  s = s.replace(/\b(EXEMPT)\b/g, '<span class="c-g">$1</span>');
  s = s.replace(/\b(NOT|ONLY|EXCEPT|INCLUDED|TAXABLE|REPEALED|PURELY|MIXED|REGULAR|NON-STOCK|NON-PROFIT)\b/g, '<span class="kw">$1</span>');
  s = s.replace(/~~(.+?)~~/g, '<del>$1</del>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/==(.+?)==/g, '<mark>$1</mark>');
  s = s.replace(/__(.+?)__/g, '<em>$1</em>');
  s = s.replace(/\{([rgbop])\|(.+?)\}/g, '<span class="c-$1">$2</span>');
  s = s.replace(/\n/g, '<br>');
  return s;
}
function plain(src){
  if(src == null) return '';
  return String(src).replace(/~~.+?~~/g, '').replace(/\*\*|==|__/g, '').replace(/\{[rgbop]\|(.+?)\}/g, '$1').replace(/\s+/g, ' ').trim();
}
const cv = c => (c && typeof c === 'object') ? c.v : (c == null ? '' : c);
function tagClass(t){
  t = String(t).toUpperCase();
  if(t === 'CMEPA') return 'cmepa'; if(t === 'UPDATED') return 'upd'; if(t === 'NEW') return 'new';
  if(t === 'REPEALED') return 'rep'; if(t === 'EOPT') return 'eopt'; if(t.startsWith('RR')) return 'rr'; return 'add';
}
const badge = t => `<span class="badge b-${tagClass(t)}">${esc(t)}</span>`;
function cellHTML(cell){
  if(cell == null || cell === '') return '';
  if(typeof cell === 'string') return fmt(cell);
  let h = fmt(cell.v);
  if(cell.tag) h += ' ' + badge(cell.tag);
  if(cell.old) h += `<div class="was">was: <del>${fmt(cell.old)}</del></div>`;
  if(cell.note) h += `<div class="cnote">${fmt(cell.note)}</div>`;
  return h;
}
const isBlank = c => { const p = plain(cv(c)); return p === '' || p === '-'; };
const curTab = () => DATA.tabs.find(t => t.id === state.tab);
function shuffle(a){ for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ---------- shell ---------- */
document.getElementById('updline').textContent = DATA.updated;
function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = DATA.tabs.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === state.tab}"><span class="full">${esc(t.title)}</span></button>`).join('');
  el.querySelectorAll('.tab').forEach(b => b.onclick = () => { state.tab = b.dataset.tab; state.quiz = null; state.search = ''; P.tab = state.tab; saveStore(); renderAll(); window.scrollTo({top:0}); });
  const sel = el.querySelector('[aria-selected="true"]'); if(sel) sel.scrollIntoView({block:'nearest', inline:'center'});
}
function renderModes(){
  document.querySelectorAll('#modes button').forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.mode === state.mode);
    b.onclick = () => { state.mode = b.dataset.mode; P.mode = state.mode; saveStore(); renderAll(); };
  });
}
function renderAll(){
  renderTabs(); renderModes();
  const t = curTab();
  document.getElementById('tabdesc').innerHTML = fmt(t.desc || '');
  if(state.mode === 'quiz') renderQuiz(); else renderTables();
}

/* ---------- tables (study + recall) ---------- */
function legendHTML(){
  return `<div class="legend"><span><span class="pct">20%</span> rate</span><span><span class="peso">₱250,000</span> amount</span><span><span class="kw">EXEMPT/NOT</span> key word</span><span><mark>highlight</mark> must-know</span><span>${badge('CMEPA')} ${badge('UPDATED')} ${badge('NEW')} ${badge('REPEALED')} changes</span></div>`;
}
function renderTables(){
  const t = curTab(), recall = state.mode === 'recall';
  let h = '';
  h += `<div class="toolbar"><input class="search" id="q" type="search" placeholder="Search this tab…" value="${esc(state.search)}">`;
  if(recall){
    h += `<span class="lbl">Answer by</span><div class="seg small" id="ansStyle"><button data-v="tap">Tap to reveal</button><button data-v="type">Type to verify</button></div>`;
    h += `<span class="lbl">Hide</span><div class="seg small" id="hideMode"><button data-v="answers">Answers</button><button data-v="all">Everything</button></div>`;
    h += `<button class="btn" id="revealAll">Reveal all</button><button class="btn" id="hideAll">Hide all</button>`;
  }
  h += `</div>`;
  if(!recall) h += legendHTML();
  // jump chips
  h += `<div class="chips">` + t.sections.map(s => `<a class="chip" href="#sec-${s.id}">${s.grp ? `<span class="gl">${esc(s.grp)}</span>` : ''}${esc(s.title.replace(/\s*\(.*?\)\s*$/,''))}</a>`).join('') + `</div>`;
  let lastGrp = null;
  t.sections.forEach(s => {
    if(s.grp && s.grp !== lastGrp){ h += `<div class="grouph">${esc(s.grp)}</div>`; lastGrp = s.grp; }
    h += sectionHTML(s, recall);
  });
  document.getElementById('content').innerHTML = h;
  wireTables(recall);
  applySearch();
  renderRecallBar();
}
function sectionHTML(s, recall){
  const n = s.cols.length, rows = s.rows.filter(r => r.c).length;

function nextQ(){
  const Q = state.quiz; if(Q.picks[Q.i] == null) return;
  if(Q.i < Q.list.length - 1){ Q.i++; renderQuestion(); window.scrollTo({top: document.getElementById('content').offsetTop - 70, behavior: 'smooth'}); }
  else finishQuiz();
}
function finishQuiz(){
  const Q = state.quiz; Q.done = true;
  const n = Q.picks.filter(p => p != null).length, s = Q.picks.filter((p, i) => p != null && Q.list[i].opts[p].ok).length;
  const ts = tabStore(state.tab);
  if(n){ ts.attempts.push({t: Date.now(), s, n}); if(ts.attempts.length > 60) ts.attempts = ts.attempts.slice(-60); saveStore(); }
  renderDone();
}
function renderDone(){
  const Q = state.quiz;
  const n = Q.picks.filter(p => p != null).length, s = Q.picks.filter((p, i) => p != null && Q.list[i].opts[p].ok).length;
  const pct = n ? Math.round(s / n * 100) : 0;
  const missed = Q.list.filter((q, i) => Q.picks[i] != null && !q.opts[Q.picks[i]].ok);
  const msg = pct >= 90 ? 'Board-ready on this set!' : pct >= 75 ? 'Passing. Drill the misses below.' : pct >= 50 ? 'Getting there. Review the misses in Study mode.' : 'Go back to Study mode, then retry.';
  let h = `<div class="qcard"><div class="done-hero"><div class="big" style="color:${pct >= 75 ? 'var(--ok)' : pct >= 50 ? 'var(--mid)' : 'var(--bad)'}">${pct}%</div><div><b>${s}</b> of ${n} correct. ${msg}</div></div>`;
  h += `<div class="qnav" style="justify-content:center"><button class="btn pri" id="again">New quiz</button>${missed.length ? `<button class="btn" id="retry">Retry the ${missed.length} missed</button>` : ''}</div>`;
  if(missed.length){
    h += `<div class="missed"><h3 style="font-size:15px;margin:14px 0 6px">Review what you missed</h3><ol>` + missed.map(q => {
      const right = q.opts.find(o => o.ok);
      const lead = q.kind === 'mem' ? `${fmt(q.secTitle)}` : `${q.promptHTML} <span style="color:var(--muted)">→ ${esc(q.ask)}</span>`;
      return `<li>${lead}<br>✔ ${fmt(right.src)}</li>`;
    }).join('') + `</ol></div>`;
  }
  h += `</div>`;
  document.getElementById('content').innerHTML = h;
  document.getElementById('again').onclick = () => { state.quiz = null; renderQuiz(); };
  const rt = document.getElementById('retry');
  if(rt) rt.onclick = () => startQuiz(missed.map(q => Object.assign({}, q)), 0, 'random', 'retry');
}
function statsPanel(t, all, ts){
  const at = ts.attempts;
  const pcts = at.map(a => Math.round(a.s / a.n * 100));
  const best = pcts.length ? Math.max(...pcts) : null, last = pcts.length ? pcts[pcts.length - 1] : null;
  const recent = pcts.slice(-10), avg = recent.length ? Math.round(recent.reduce((a, b) => a + b, 0) / recent.length) : null;
  const ids = new Set(all.map(q => q.id));
  const mastered = Object.entries(ts.items).filter(([id, it]) => ids.has(id) && it.last === 1).length;
  let h = `<div class="panel"><h3>Your score tracker</h3><div class="stats">
    <div class="stat"><b>${best == null ? '–' : best + '%'}</b><span>Best</span></div>
    <div class="stat"><b>${last == null ? '–' : last + '%'}</b><span>Last</span></div>
    <div class="stat"><b>${avg == null ? '–' : avg + '%'}</b><span>Avg (last 10)</span></div>
    <div class="stat"><b>${at.length}</b><span>Attempts</span></div></div>`;
  if(recent.length){
    h += `<div class="spark" title="Last ${recent.length} attempts">${recent.map(p => `<i class="${p < 50 ? 'lo' : p < 75 ? 'md' : ''}" style="height:${Math.max(4, p)}%" title="${p}%"></i>`).join('')}</div><div class="empty">Last ${recent.length} attempts (oldest → newest)</div>`;
  } else h += `<p class="empty" style="margin-top:12px">No attempts yet. Your scores are saved in this browser.</p>`;
  h += `<div class="mastery"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><b>Mastery by section</b><span class="empty">${mastered}/${all.length} items last answered right</span></div>`;
  const per = {}; all.forEach(q => { const p = per[q.sec] = per[q.sec] || {n: 0, m: 0, title: q.secTitle}; p.n++; const it = ts.items[q.id]; if(it && it.last === 1) p.m++; });
  h += Object.values(per).map(p => { const pc = Math.round(p.m / p.n * 100); return `<div class="mrow"><span>${esc(p.title.replace(/\s*\(.*?\)\s*$/, ''))}</span><div class="bar"><i style="width:${pc}%"></i></div><span style="text-align:right">${pc}%</span></div>`; }).join('');
  h += `</div><div style="margin-top:12px"><button class="btn danger" id="resetTab">Reset this tab's scores</button></div></div>`;
  return h;
}
function wireStatsPanel(t){
  const b = document.getElementById('resetTab');
  if(b) b.onclick = () => { if(confirm(`Reset all quiz scores for "${t.title}"?`)){ delete store.tabs[t.id]; saveStore(); renderQuiz(); } };
}
/* global progress dialog */
document.getElementById('btnStats').onclick = () => {
  const d = document.getElementById('dlg');
  let h = `<h3 style="margin:0 0 10px">Progress across all tabs</h3><div class="tblwrap"><table class="tbl"><thead><tr><th>Tab</th><th>Attempts</th><th>Best</th><th>Last</th><th>Mastered</th></tr></thead><tbody>`;
  DATA.tabs.forEach(t => {
    const ts = store.tabs[t.id] || {attempts: [], items: {}}, all = QCACHE[t.id] || (QCACHE[t.id] = buildQuestions(t)), ids = new Set(all.map(q => q.id));
    const pc = ts.attempts.map(a => Math.round(a.s / a.n * 100));
    const m = Object.entries(ts.items).filter(([id, it]) => ids.has(id) && it.last === 1).length;
    h += `<tr><td class="key" data-label="Tab">${esc(t.title)}</td><td data-label="Attempts">${ts.attempts.length}</td><td data-label="Best">${pc.length ? Math.max(...pc) + '%' : '–'}</td><td data-label="Last">${pc.length ? pc[pc.length - 1] + '%' : '–'}</td><td data-label="Mastered">${m}/${all.length}</td></tr>`;
  });
  h += `</tbody></table></div><div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px"><button class="btn danger" id="resetAll">Reset everything</button><button class="btn pri" id="closeDlg">Close</button></div>`;
  d.innerHTML = h; d.showModal();
  document.getElementById('closeDlg').onclick = () => d.close();
  document.getElementById('resetAll').onclick = () => { if(confirm('Erase all saved scores, mastery marks and settings?')){ store = {tabs: {}, prefs: {}, recall: {}}; saveStore(); location.reload(); } };
};
/* theme */
(function(){
  const root = document.documentElement;
  if(P.theme) root.setAttribute('data-theme', P.theme);
  document.getElementById('btnTheme').onclick = () => {
    const dark = P.theme ? P.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    P.theme = dark ? 'light' : 'dark'; root.setAttribute('data-theme', P.theme); saveStore();
  };
})();
document.addEventListener('keydown', e => {
  if(state.mode !== 'quiz' || !state.quiz || state.quiz.done) return;
  if(e.target.matches('input,textarea')) return;
  const n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){ const q = state.quiz.list[state.quiz.i]; if(n <= q.opts.length) pick(n - 1); }
  else if(e.key === 'Enter'){ nextQ(); }
});
renderAll();
/* keep sticky table headers exactly below the sticky tab bar */
(function(){
  const nav = document.querySelector('nav.tabs');
  const setH = () => document.documentElement.style.setProperty('--nav-h', nav.getBoundingClientRect().height + 'px');
  setH();
  if('ResizeObserver' in window) new ResizeObserver(setH).observe(nav); else addEventListener('resize', setH);
})();
</script>
