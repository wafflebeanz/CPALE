ents. It is classified as:", "opts": [{"l": "a", "t": "a business tax."}, {"l": "b", "t": "a transfer tax."}, {"l": "c", "t": "an excise tax."}, {"l": "d", "t": "a property tax."}], "ans": "c"}, {"n": 183, "p": 38, "stem": "First statement: DSTs are levied independently of the legal status of the transactions giving rise thereto. Second statement: DSTs must be paid upon the issuance of the instruments, without regard to whether the contracts which gave rise to them are rescissible, void, voidable, or unenforceable.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 184, "p": 38, "stem": "First statement: No person shall collect, sell or offer to sell documentary stamps for more than their face value. Second statement: The use of a previously affixed loose documentary stamp for affixture to another taxable document is strictly prohibited. (RR No. 28-2025)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 185, "p": 38, "stem": "The new rate for DST on original issue of shares of stock is: (RR No. 19-2025)", "opts": [{"l": "a", "t": "P2.00 on each P200, or fractional part thereof, of the par value of such shares of stock"}, {"l": "b", "t": "P1.50 on each P200, or fractional part thereof, of the par value of such shares of stock"}, {"l": "c", "t": "50% of 1% on each P200, or fractional part thereof, of the par value of such shares of stock"}, {"l": "d", "t": "75% of 1% on each P200, or fractional part thereof, of the par value of such shares of stock"}], "ans": "d"}, {"n": 186, "p": 38, "stem": "The sale or transfer of assets to the Special Purpose Entity (SPE), including sale or transfer of any and all security interest thereto, made in accordance with the Securitization Plan shall be exempted from: A. Value-Added Tax. B. Documentary stamp tax. (RR No. 2-2025)", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "A only"}, {"l": "c", "t": "B only"}, {"l": "d", "t": "Neither A nor B"}], "ans": "a"}, {"n": 187, "p": 39, "stem": "The original issuance of Asset-Backed Securities (ABS) and other securities related solely to such securitization transaction, such as seller's equity, subordinated debt instruments purchased by the originator, and other related forms of credit enhancement shall be subject to: (RR No. 2-2025)", "opts": [{"l": "a", "t": "VAT."}, {"l": "b", "t": "any other taxes imposed."}, {"l": "c", "t": "DST."}, {"l": "d", "t": "Percentage tax."}], "ans": "c"}]}, {"id": "t8", "title": "Topic 8: Taxation under Local Government", "shortTitle": "8. Local Gov Tax", "itemRange": "Items 188 to 195", "concepts": "<h3>Fundamental principles and collection</h3>\n<p><strong>Fundamental principles (LGC Sec. 130):</strong> uniform within each LGU; equitable and based on ability to pay, for public purposes, not unjust, excessive, oppressive or confiscatory, not contrary to law, public policy, national economic policy or in restraint of trade; collection never left to a private person; revenue inures solely to the LGU levying it; each LGU shall evolve a progressive system of taxation.</p>\n\n<p><strong>Exercise and collection:</strong> the taxing power is exercised by the Sanggunian through an ordinance; taxes are collected by the provincial, city, municipal or barangay treasurer or deputies, and the barangay treasurer may be deputized. Local taxes, fees and charges are paid within the first 20 days of January or of each subsequent quarter. A person operating two or more businesses under Sec. 143 with different rates reports the gross sales of each separately; if subject to the same rate, they may be combined.</p>\n\n<h3>Real property tax computation</h3>\n<p><strong>Formula:</strong> Assessed value = FMV x assessment level; basic RPT = assessed value x rate; SEF = assessed value x 1%.</p>\n\n<table class=\"notes-table\">\n<thead><tr><th>Item</th><th>Assessment level</th><th>Basic RPT rate</th><th>Result</th></tr></thead>\n<tbody>\n<tr><td>Residential land, Metro Manila (item 192, FMV P5,000,000)</td><td>20%</td><td>not exceeding 2%</td><td>P5,000,000 x 20% x 2% = P20,000</td></tr>\n<tr><td>SEF on the same land (item 193)</td><td>20%</td><td>1%</td><td>P10,000</td></tr>\n<tr><td>Agricultural land, province (item 194, FMV P2,000,000)</td><td>40%</td><td>not exceeding 1%</td><td>P2,000,000 x 40% x 1% = P8,000</td></tr>\n</tbody>\n</table>\n\n<p><strong>Assessment levels on land:</strong> residential 20%, agricultural 40%, commercial, industrial and mineral 50%, timberland 20%. <strong>Basic RPT rate ceiling:</strong> 1% in provinces, 2% in cities and Metro Manila municipalities; SEF is an additional 1% everywhere. Under RA 12001 (RPVARA), the Schedule of Market Values follows the Philippine Valuation Standards and is also the FMV reference for the 6% CGT on real property.</p>", "items": [{"n": 188, "p": 40, "stem": "Which of the following fundamental principles shall govern the exercise of the taxing and other revenue-raising powers of local government units? I. Taxation shall be uniform in each local government unit. II. The collection of local taxes, fees, charges and other impositions shall in no case be left to any private person. III. Each local government unit shall, as far as practicable, evolve a progressive system of taxation.", "opts": [{"l": "a", "t": "I, II and III"}, {"l": "b", "t": "I and II only"}, {"l": "c", "t": "II and III only"}, {"l": "d", "t": "III only"}], "ans": "a"}, {"n": 189, "p": 40, "stem": "In cases where a person conducts or operates two (2) or more businesses mentioned in Section 143 of the Local Government Code which are subject to different rates of tax, the gross sales or receipts of each business:", "opts": [{"l": "a", "t": "shall be separately reported for the purpose of computing the tax due from each business."}, {"l": "b", "t": "shall be computed on the combined total gross sales or receipts of the said two (2) or more related businesses."}, {"l": "c", "t": "shall be reported or computed using either choices a or b."}, {"l": "d", "t": "shall be reported or computed using neither choices a nor b."}], "ans": "a"}, {"n": 190, "p": 40, "stem": "The power to impose a tax, fee, or charge or to generate revenue under the Local Government Code shall be exercised by:", "opts": [{"l": "a", "t": "the Sanggunian of the local government unit concerned through an appropriate ordinance."}, {"l": "b", "t": "Office of the Mayor of the local government unit concerned through appropriate executive orders."}, {"l": "c", "t": "Office of the Assessor of the local government unit concerned through appropriate assessments."}, {"l": "d", "t": "Office of the Municipal Administrator of the local government unit concerned through appropriate administrative policies."}], "ans": "a"}, {"n": 191, "p": 40, "stem": "Unless otherwise provided in the Local Government Code, all local taxes, fees, and charges shall be paid when?", "opts": [{"l": "a", "t": "within the first thirty (30) days of January or of each subsequent quarter, as the case may be."}, {"l": "b", "t": "within the first twenty (20) days of January or of each subsequent quarter, as the case may be."}, {"l": "c", "t": "within the first ten (10) days of January or of each subsequent quarter, as the case may be."}, {"l": "d", "t": "within the first five (5) days of January or of each subsequent quarter, as the case may be."}], "ans": "b"}, {"n": 192, "p": 40, "stem": "A residential land is located in Metro Manila. Its fair market value is P5,000,000. How much is the basic real property tax, if any?", "opts": [{"l": "a", "t": "P30,000"}, {"l": "b", "t": "P20,000"}, {"l": "c", "t": "P10,000"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 193, "p": 40, "stem": "How much is the Special Educational Fund (SEF), if any?", "opts": [{"l": "a", "t": "P30,000"}, {"l": "b", "t": "P20,000"}, {"l": "c", "t": "P10,000"}, {"l": "d", "t": "None of the choices"}], "ans": "c"}, {"n": 194, "p": 40, "stem": "An agricultural land is located in the province. Its fair market value is P2,000,000. How much is the basic real property tax, if any?", "opts": [{"l": "a", "t": "P16,000"}, {"l": "b", "t": "P8,000"}, {"l": "c", "t": "P4,000"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 195, "p": 40, "stem": "First statement: All local taxes, fees, and charges shall be collected by the provincial, city, municipal, or Barangay treasurer, or their duly authorized deputies. Second statement: The provincial, city or municipal treasurer may designate the Barangay treasurer as his deputy to collect local taxes, fees, or charges.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}]}, {"id": "t9", "title": "Topic 9: Preferential Taxation", "shortTitle": "9. Preferential Tax", "itemRange": "Items 196 to 217", "concepts": "<h3>Senior citizens and PWDs</h3>\n<p>20% discount and VAT exemption on covered goods and services; 5% discount on basic necessities and prime commodities subject to limits; when a promotional discount exists, the customer gets the higher of the promotional or the SC/PWD discount, never both. They remain subject to final taxes on passive income (20% and 15% EFCDS), 6% CGT, and VAT or percentage taxes if engaged in business; the income tax exemption applies only to minimum wage earners.</p>\n\n<h3>BMBE (RA 9178)</h3>\n<p>Total assets not more than P3,000,000, including those from loans but excluding the land where the office, plant and equipment are situated; engaged in production, processing, manufacturing, agro-processing, trading or services (services of a licensed professional in the exercise of the profession are excluded); registered with DTI (sole proprietors) or SEC (corporations), with the application filed at the DTI Negosyo Center. <em>Incentives:</em> income tax exemption on operations, exemption from the Minimum Wage Law, and access to government credit. BMBEs are not exempt from SSS and PhilHealth contributions. <em>Item 200:</em> P3,500,000 less P500,000 land = P3,000,000, qualified.</p>\n\n<h3>Tax treaties</h3>\n<p>DTAs avoid double taxation and prevent fiscal evasion on income taxes. Treaty provisions generally prevail over domestic law. The UN Model favors source-country (host) taxing rights; the OECD Model favors residence-country rights.</p>\n\n<h3>CREATE and CREATE MORE incentives</h3>\n<p>SCIT is 5% of gross income earned in lieu of all national and local taxes (3% national, 2% directly remitted to the LGU). RBEs under the Enhanced Deduction Regime pay 20% corporate income tax and may claim additional deductions: 50% of direct labor expense (excluding managerial, administrative, indirect labor and support personnel) and 100% of training expenses approved under the Strategic Investment Priority Plan for Filipino employees directly engaged in production (RR 13-2025). Government purchases from RBEs are subject to 12% creditable withholding VAT (RR 9-2025).</p>\n\n<h3>VAT on RBE purchases and sales (RR 9-2025, RR 1-2026)</h3>\n<p>Purchases directly and exclusively used in the registered activity are zero-rated; purchases used in both the registered activity and administration that cannot be allocated are subject to 12% VAT. Domestic Market Enterprises are not entitled to VAT zero-rating on local purchases, and sales to DMEs are subject to 12% VAT, not exempt. All local sales of RBEs are subject to VAT regardless of income tax regime, and location inside or outside an ecozone no longer matters. Under Sec. 295(D), the buyer pays and remits the VAT on B2B local sales of RBEs: per transaction for goods from ecozones or freeports, monthly for services and for all purchases from BOI-registered enterprises; bulk shipments covered by several invoices may be paid in a single payment; BIR Form 0605 is used in the meantime and is presented to the BOC before release of the goods. An RBE under 5% SCIT or GIE may optionally register for VAT on its local sales without losing its incentives, but cannot cancel that registration for 3 years. VAT-registered DMEs that do not qualify for zero-rating are subject to VAT on purchases and importation; to avoid trapped input VAT their local sales are not covered by the buyer-remittance rule, and the RBE-seller files and pays the VAT as a regular VAT taxpayer.</p>", "items": [{"n": 196, "p": 42, "stem": "In the purchase of goods and services which have a promotional discount, the senior citizen or PWD can avail:", "opts": [{"l": "a", "t": "of the promotional discount or the senior citizen/PWD discount, whichever is higher."}, {"l": "b", "t": "of the promotional discount or the senior citizen/PWD discount, whichever is lower."}, {"l": "c", "t": "of both the promotional discount and the senior citizen/PWD discount."}, {"l": "d", "t": "of neither the promotional discount nor the senior citizen/PWD discount."}], "ans": "a"}, {"n": 197, "p": 42, "stem": "Senior citizens and PWDs are not exempted from which of the following taxes? I. 20% final withholding tax on certain passive income. II. 15% final withholding tax on interest from a depository bank under EFCDS. III. VAT or other percentage taxes, if self-employed or engaged in business or practice of profession. IV. 6% capital gains tax on presumed capital gain on sale of real property classified as capital asset.", "opts": [{"l": "a", "t": "I, II, III and IV"}, {"l": "b", "t": "I, II and IV only"}, {"l": "c", "t": "II and IV only"}, {"l": "d", "t": "I and II only"}], "ans": "a"}, {"n": 198, "p": 42, "stem": "Which of the following is not an incentive given to a Barangay Micro Business Enterprise?", "opts": [{"l": "a", "t": "Exemption from income tax for income arising from the operations of the enterprise"}, {"l": "b", "t": "Exemption from the coverage of the Minimum Wage Law"}, {"l": "c", "t": "Exemption from SSS and Philhealth contributions"}, {"l": "d", "t": "Availment of credit services from government financing institutions"}], "ans": "c"}, {"n": 199, "p": 42, "stem": "A person applying to be registered as a BMBE shall meet which of the following qualifications? I. With an asset of not more than Three Million Pesos (P3,000,000) excluding land. II. Engaged in the production, processing or manufacturing of products or commodities, including agro-processing, trading and services. III. Registered with the DTI for sole proprietorships; with the SEC for corporations.", "opts": [{"l": "a", "t": "I, II and III"}, {"l": "b", "t": "I and II only"}, {"l": "c", "t": "I and III only"}, {"l": "d", "t": "I only"}], "ans": "a"}, {"n": 200, "p": 42, "stem": "An individual is operating a trading business enterprise. He is asking you to assist him to register his business under the BMBE so he can avail of the incentives. His total assets including the cash of P300,000 he loaned from a bank amounted to P3,500,000. The total assets also include P500,000 value of the land on which the business entity's office, plant and equipment are situated. Is the individual qualified?", "opts": [{"l": "a", "t": "No. Because he is engaged in a trading business which is specifically excluded from those who can register under BMBE."}, {"l": "b", "t": "Yes. Because his total assets excluding the land on which the particular business entity's office, plant and equipment are situated do not exceed P3,000,000."}, {"l": "c", "t": "No. Because only juridical persons are qualified to register under BMBE."}, {"l": "d", "t": "Yes. Because trading business is automatically qualified regardless of the total assets."}], "ans": "b"}, {"n": 201, "p": 42, "stem": "In order to avail of the privileges under the BMBE Act, the concerned taxpayer shall file an application with:", "opts": [{"l": "a", "t": "Barangay Treasurer"}, {"l": "b", "t": "Municipal Treasurer"}, {"l": "c", "t": "Sangguniang Bayan"}, {"l": "d", "t": "Negosyo Centers established by DTI"}], "ans": "d"}, {"n": 202, "p": 42, "stem": "The nature and purpose of Double Taxation Agreements (DTAs): I. Avoidance of double taxation. II. Prevention of fiscal evasion with respect to taxes on income.", "opts": [{"l": "a", "t": "Both I and II"}, {"l": "b", "t": "Neither I nor II"}, {"l": "c", "t": "I only"}, {"l": "d", "t": "II only"}], "ans": "a"}, {"n": 203, "p": 42, "stem": "In case of conflict between tax treaty and domestic laws:", "opts": [{"l": "a", "t": "the provisions of the tax treaty generally prevail over the provisions of the domestic law."}, {"l": "b", "t": "the provisions of the domestic law generally prevail over the provisions of the tax treaty."}, {"l": "c", "t": "the domestic law of the richer country generally prevails in most cases."}, {"l": "d", "t": "the countries entering into the treaty shall apply their domestic laws."}], "ans": "a"}, {"n": 204, "p": 43, "stem": "If the goods or services are used in both the registered project or activity and administration purposes and the proper allocation could not be determined, the purchase of such goods and services shall be:", "opts": [{"l": "a", "t": "subject to 12% VAT."}, {"l": "b", "t": "subject to 0% VAT."}, {"l": "c", "t": "exempt from VAT."}, {"l": "d", "t": "disregarded."}], "ans": "a"}, {"n": 205, "p": 43, "stem": "First statement: Registered Business Enterprises (RBEs) which are categorized as Domestic Market Enterprises (DME) are not entitled to VAT zero-rating on local purchases. Second statement: Sale of goods or services to a registered domestic market enterprise shall be exempt from VAT.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "c"}, {"n": 206, "p": 43, "stem": "How much discount is granted to senior citizens on their purchase of basic and prime commodities, subject to limitations?", "opts": [{"l": "a", "t": "20%"}, {"l": "b", "t": "15%"}, {"l": "c", "t": "10%"}, {"l": "d", "t": "5%"}], "ans": "d"}, {"n": 207, "p": 43, "stem": "Effective July 1, 2020, Special Corporate Income Tax (SCIT) is:", "opts": [{"l": "a", "t": "5% based on gross income earned, in lieu of all national and local taxes."}, {"l": "b", "t": "10% based on gross income earned, in lieu of all national and local taxes."}, {"l": "c", "t": "15% based on gross income earned, in lieu of all national and local taxes."}, {"l": "d", "t": "20% based on gross income earned, in lieu of all national and local taxes."}], "ans": "a"}, {"n": 208, "p": 43, "stem": "If the goods or services are used in both the registered project or activity and administration purposes and the proper allocation could not be determined, the purchase of such goods and services shall be:", "opts": [{"l": "a", "t": "subject to 12% VAT."}, {"l": "b", "t": "subject to 0% VAT."}, {"l": "c", "t": "exempt from VAT."}, {"l": "d", "t": "disregarded."}], "ans": "a"}, {"n": 209, "p": 43, "stem": "First statement: RBEs which are categorized as Domestic Market Enterprises (DME) are not entitled to VAT zero-rating on local purchases. Second statement: Sale of goods or services to a registered domestic market enterprise shall be exempt from VAT.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "c"}, {"n": 210, "p": 43, "stem": "This model generally favors retention of greater so-called \"source country\" taxing rights under a tax treaty (the taxation rights of the host country of investment) as compared to those of the \"residence country\" of the investor.", "opts": [{"l": "a", "t": "OECD Model Tax Convention"}, {"l": "b", "t": "UN Model Double Taxation Convention"}, {"l": "c", "t": "United States Model Income Tax Convention"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 211, "p": 43, "stem": "Registered export and domestic market enterprises are allowed to deduct: A. Fifty percent (50%) additional deduction on the labor expense incurred in the taxable year. B. One hundred percent (100%) additional deduction on training expense incurred in the taxable year. (RR No. 13-2025)", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "Neither A nor B"}, {"l": "c", "t": "A only"}, {"l": "d", "t": "B only"}], "ans": "a"}, {"n": 212, "p": 44, "stem": "The creditable withholding tax rate on the purchase of goods and services from RBEs of the Philippine Government or any of its political subdivisions, instrumentalities, or agencies, including GOCCs, shall now be amended to: (RR No. 9-2025)", "opts": [{"l": "a", "t": "twenty percent (20%)"}, {"l": "b", "t": "fifteen percent (15%)"}, {"l": "c", "t": "twelve percent (12%)"}, {"l": "d", "t": "ten percent (10%)"}], "ans": "c"}, {"n": 213, "p": 44, "stem": "First statement: All local sales of RBEs shall be subject to VAT regardless of the income tax regime (ITH, 5% GIE/SCIT, EDR, or RCIT). Second statement: The location of the transaction and the RBE, whether inside the ecozone, freeport or customs territory, such as REEs registered with the BOI, are no longer the determining factors in so far as the taxability for local sales of RBEs for VAT purposes is concerned. (RR No. 9-2025)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 214, "p": 44, "stem": "Statement I: For purchase of goods from economic zones or freeports, the filing and payment of the \"VAT on B2B local sales by RBEs\" shall be on a transaction basis using the BIR Form to be prescribed. Statement II: For purchase of services from economic zones or freeports, the filing and payment shall be on a monthly basis using the BIR Form to be prescribed. Statement III: For purchases of goods and/or services from BOI-registered enterprises, the filing and payment shall be on a monthly basis using the BIR Form to be prescribed. (RR No. 9-2025)", "opts": [{"l": "a", "t": "All statements are correct"}, {"l": "b", "t": "All statements are incorrect"}, {"l": "c", "t": "Only Statements I and II are correct"}, {"l": "d", "t": "Only Statement III is correct"}], "ans": "a"}, {"n": 215, "p": 44, "stem": "First statement: The filing and payment of the \"VAT on B2B local sales by RBEs\" shall be on a per transaction basis using the BIR Form to be prescribed. Second statement: In cases where the shipment of the goods purchased in the ecozone or freeport is in bulk (e.g., delivered through a single container truck) and is covered by several invoices, the buyer may opt to pay the VAT due thereon in a single payment. (RR No. 1-2026)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 216, "p": 44, "stem": "First statement: An RBE availing of the 5% SCIT or Gross Income Earned (GIE) regime, and whose registered activities are all under the same income tax incentive, may opt to register as a VAT taxpayer solely for purposes of its local sales. Second statement: Optional VAT registration of an RBE shall not affect its entitlement to its existing fiscal and non-fiscal incentives, including VAT zero-rating on local purchases and VAT exemption on importation, provided these are directly attributable to its registered activities. (RR No. 1-2026)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 217, "p": 44, "stem": "First statement: VAT-registered Domestic Market Enterprises (DMEs) that do not qualify for VAT zero-rating on local purchases or VAT exemption on importation despite being registered with any of the Investment Promotion Agencies are subject to VAT on both their local purchases and importation. Second statement: The application of Section 295(D) of the Tax Code to their local sales mandating the buyer to pay and remit the corresponding VAT to the BIR would result in accumulated unutilized input VAT from local purchases and importations, which are not eligible for refund under Section 112(A). (RR No. 1-2026)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}]}]}</script>
<script>
(function(){
const DATA = JSON.parse(document.getElementById('quizdata').textContent);
const CHAPTERS = DATA.chapters;
const CH = {}, Q = {};
CHAPTERS.forEach(c => {
  CH[c.id] = c;
  c.items.forEach((q, idx) => {
    q.id = c.id + '-' + idx;
    q.ch = c;
    Q[q.id] = q;
  });
});

const KEY = 'tax-preweek-pet-quizzer-v1';
let S = {
  pet: null,
  ans: {},
  flags: {},
  chap: 't1',
  filter: 'all',
  pets: 0,
  activeNotesChap: 't1',
  notes: {},
  editingNote: null
};
try {
  const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (saved) S = Object.assign(S, saved);
} catch(e){}
if (!S.notes) S.notes = {};
if (!CH[S.chap]) S.chap = 't1';
if (!CH[S.activeNotesChap]) S.activeNotesChap = S.chap;

function save(){
  try {
    const toSave = Object.assign({}, S);
    delete toSave.editingNote;
    localStorage.setItem(KEY, JSON.stringify(toSave));
  } catch(e){}
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatNote(str) {
  return escapeHtml(str).replace(/\n/g, '<br>');
}

const $ = s => document.querySelector(s);
const totalQuestions = 217;
$('#sub').textContent = '217 verbatim items • ReSA Batch 51 (May 2026 CPALE) • Concepts to Remember notes included';

function stats(c){
  let pts = 0, answered = 0, scored = c.items.length;
  c.items.forEach(q => {
    const a = S.ans[q.id];
    if (a) {
      answered++;
      if (q.ans === a) pts++;
    }
  });
  return {
    pts,
    answered,
    scored,
    total: c.items.length,
    pct: scored ? (pts / scored) * 100 : 0
  };
}

function mood(pct){
  if (pct <= 20) return 'dying';
  if (pct <= 30) return 'normal';
  if (pct <= 50) return 'happy';
  if (pct <= 75) return 'fat';
  return 'gold';
}

const MOODNAME = {
  dying: 'Very thin & starving (0-20%)',
  normal: 'Normal weight (21-30%)',
  happy: 'Happy & thriving (31-50%)',
  fat: 'Chonk & well-fed (51-75%)',
  gold: 'Golden with Fire Aura! (76%+)'
};

const flagCount = () => Object.keys(S.flags).filter(k => Q[k]).length;

function renderTabs(){
  const fc = flagCount();
  const tabsHtml = CHAPTERS.map(c => {
    const st = stats(c);
    const isSel = (S.chap === c.id);
    return `<button class="doctab" role="tab" data-chap="${c.id}" aria-selected="${isSel}">
      ${c.shortTitle} <span class="cnt">${st.pts}/${st.scored}</span>
    </button>`;
  }).join('') +
  `<button class="doctab" role="tab" data-chap="flagged" aria-selected="${S.chap === 'flagged'}">
    🚩 Flagged <span class="cnt">${fc}</span>
  </button>`;
  $('#doctabs').innerHTML = tabsHtml;
}

function qCard(q, showCtxAlways){
  const a = S.ans[q.id];
  const done = !!a;
  const isFlagged = !!S.flags[q.id];
  const noteText = (S.notes && S.notes[q.id]) ? S.notes[q.id] : '';
  const hasNote = !!(noteText && noteText.trim().length > 0);
  const isEditing = (S.editingNote === q.id);

  let h = `<article class="q${isFlagged ? ' flagged' : ''}" id="${q.id}" data-q="${q.id}">`;
  h += `<div class="qhead">
    <span class="num">${q.n}.</span>
    <span class="pg">PDF page ${q.p}</span>
    <div class="qactions">
      <button class="notebtn${hasNote ? ' has-note' : ''}" data-notetoggle="${q.id}" aria-label="${hasNote ? 'View/edit personal note' : 'Add personal note'}" title="${hasNote ? 'View/edit personal note' : 'Add personal note'}">
        <svg viewBox="0 0 24 24" fill="${hasNote ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        <span>${hasNote ? 'Note' : '+ Note'}</span>
      </button>
      <button class="flag" data-flag="${q.id}" aria-pressed="${isFlagged}">
        <svg viewBox="0 0 24 24" fill="${isFlagged ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round">
          <path d="M6 3h12v18l-6-4-6 4z"/>
        </svg>
        ${isFlagged ? 'Flagged' : 'Flag'}
      </button>
    </div>
  </div>`;

  if (q.ctx) {
    h += `<div class="ctx">
      <span class="ctx-badge">Fact Scenario</span>
      <p>${q.ctx}</p>
    </div>`;
  }

  h += `<div class="stem"><p>${q.stem}</p></div>`;
  h += `<ul class="opts">`;
  q.opts.forEach(o => {
    let cls = 'opt';
    let tag = '';
    if (done) {
      if (o.l === a) cls += ' picked';
      if (o.l === q.ans) {
        cls += ' correct';
        tag = '<span class="tag">Correct Answer</span>';
      } else if (o.l === a) {
        cls += ' wrong';
        tag = '<span class="tag">Your Choice</span>';
      }
    }
    h += `<li>
      <button class="${cls}" data-opt="${o.l}" data-q="${q.id}" ${done ? 'disabled' : ''}>
        <span class="lt">${o.l}.</span>
        <span class="ot"><p>${o.t}</p></span>
        ${tag}
      </button>
    </li>`;
  });
  h += `</ul>`;

  if (done) {
    if (a === q.ans) {
      h += `<p class="verdict ok">✓ Correct! +1 ${S.pet === 'cat' ? '🐟' : '🦴'}</p>`;
    } else {
      const correctOpt = q.opts.find(o => o.l === q.ans);
      const correctLabel = correctOpt ? `${correctOpt.l.toUpperCase()}. ${correctOpt.t}` : q.ans.toUpperCase();
      h += `<p class="verdict no">✗ Incorrect. Suggested answer: <strong>${correctLabel}</strong></p>`;
    }
    h += `<div class="qfoot">
      <span class="pg">Answer key verified verbatim from ReSA Preweek</span>
      <button class="btn redo" data-redo="${q.id}">Reset Item</button>
    </div>`;
  }

  // Personal Note Box (displays saved note or editing form)
  if (hasNote || isEditing) {
    h += `<div class="user-note-card" id="notecard-${q.id}">`;
    if (!isEditing && hasNote) {
      h += `<div class="user-note-view">
        <div class="user-note-meta">
          <span class="user-note-tag">📝 My Note</span>
          <div class="user-note-btns">
            <button class="note-sub-btn" data-noteedit="${q.id}">Edit</button>
            <button class="note-sub-btn note-del" data-notedel="${q.id}">Delete</button>
          </div>
        </div>
        <div class="user-note-body">${formatNote(noteText)}</div>
      </div>`;
    }
    if (isEditing) {
      h += `<div class="user-note-form">
        <div class="user-note-meta">
          <span class="user-note-tag">✏️ ${hasNote ? 'Edit Personal Note' : 'Add Personal Note / Mnemonic'}</span>
        </div>
        <textarea class="note-textarea" id="notetext-${q.id}" data-qid="${q.id}" placeholder="Type your personal note, formula, mnemonic, or reasoning here...">${escapeHtml(noteText)}</textarea>
        <div class="user-note-btns" style="margin-top:8px">
          <button class="btn btn-primary" style="padding:4px 14px;font-size:.84rem" data-notesave="${q.id}">Save Note</button>
          <button class="btn" style="padding:4px 12px;font-size:.84rem" data-notecancel="${q.id}">Cancel</button>
          ${hasNote ? `<button class="btn note-del" style="margin-left:auto;padding:4px 10px;font-size:.84rem;color:var(--bad)" data-notedel="${q.id}">Delete</button>` : ''}
        </div>
      </div>`;
    }
    h += `</div>`;
  }

  h += `</article>`;
  return h;
}

function render(){
  renderTabs();
  const m = $('#main');
  $('#notesBtnBadge').textContent = S.chap === 'flagged' ? 'Notes' : (CH[S.chap] ? CH[S.chap].shortTitle : 'Notes');

  if (S.chap === 'flagged') {
    const flaggedIds = Object.keys(S.flags).filter(k => Q[k]);
    if (!flaggedIds.length) {
      m.innerHTML = `<div class="panel empty">
        <p>🚩 No flagged items yet. Tap <strong>Flag</strong> on any question to bookmark it here for targeted review.</p>
      </div>`;
      updatePet();
      return;
    }
    const grouped = {};
    flaggedIds.forEach(id => {
      const q = Q[id];
      (grouped[q.ch.id] = grouped[q.ch.id] || []).push(q);
    });
    let h = `<div class="panel">
      <h2 class="chtitle">🚩 Flagged Items for Review</h2>
      <p class="chmeta">${flaggedIds.length} items bookmarked across chapters. Answers submitted here count toward your chapter score and pet evolution!</p>
    </div>`;
    CHAPTERS.forEach(c => {
      if (!grouped[c.id]) return;
      grouped[c.id].sort((a,b) => a.n - b.n);
      h += `<h3 class="grouphead" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        ${c.title} (${grouped[c.id].length} items)
        <button class="btn" style="margin-left:auto" data-opennotes="${c.id}">📖 View Notes</button>
      </h3>`;
      h += grouped[c.id].map(q => qCard(q, true)).join('');
    });
    m.innerHTML = h;
    updatePet();
    return;
  }

  const c = CH[S.chap];
  const st = stats(c);
  const md = mood(st.pct);

  let h = '';
  h += `<section class="panel">
    <h2 class="chtitle">${c.title}</h2>
    <p class="chmeta">${c.itemRange} • ${st.total} items • ${st.pts} of ${st.scored} points earned (${Math.round(st.pct)}%), ${st.answered} answered.</p>
    <div class="bowl" aria-hidden="true">
      <div class="fill" style="width:${st.pct.toFixed(1)}%"></div>
      <div class="marks">
        <span style="left:20%" title="20% Threshold"></span>
        <span style="left:30%" title="30% Threshold"></span>
        <span style="left:50%" title="50% Threshold"></span>
        <span style="left:75%" title="75% Golden Threshold"></span>
      </div>
      <div class="pawdot" style="left:${Math.max(3, Math.min(97, st.pct)).toFixed(1)}%">
        ${S.pet === 'cat' ? '🐟' : '🦴'}
      </div>
    </div>
    <div class="stage">
      <span>Thin (0-20%)</span>
      <span>Normal (21-30%)</span>
      <span>Happy (31-50%)</span>
      <span>Chonk (51-75%)</span>
      <span>🔥 Golden (76%+)</span>
    </div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Filter items">
        ${[['all','All'],['open','Unanswered'],['flag','Flagged'],['miss','Missed'],['note','Notes']].map(f => 
          `<button data-filter="${f[0]}" aria-pressed="${S.filter === f[0]}">${f[1]}</button>`
        ).join('')}
      </div>
      <button class="btn btn-primary" data-opennotes="${c.id}">📖 Concepts to Remember</button>
      <label class="jump">Go to # <input type="number" min="${c.items[0].n}" max="${c.items[c.items.length-1].n}" inputmode="numeric" id="jumpin" placeholder="${c.items[0].n}"></label>
      <button class="btn" id="resetChapBtn">Reset Topic</button>
    </div>
  </section>`;

  const filteredItems = c.items.filter(q => {
    const a = S.ans[q.id];
    if (S.filter === 'open') return !a;
    if (S.filter === 'flag') return !!S.flags[q.id];
    if (S.filter === 'miss') return a && (a !== q.ans);
    if (S.filter === 'note') return !!(S.notes && S.notes[q.id] && S.notes[q.id].trim().length > 0);
    return true;
  });

  if (filteredItems.length) {
    h += filteredItems.map(q => qCard(q, S.filter !== 'all')).join('');
  } else {
    h += `<div class="panel empty">
      <p>${S.filter === 'note' ? '📝 No personal notes added in this topic yet. Click "+ Note" on any question to add your comments or study mnemonics.' : 'No questions matching current filter ("' + S.filter + '"). Select another filter to display questions.'}</p>
    </div>`;
  }

  m.innerHTML = h;
  updatePet();
}

/* ---------- Virtual Pet SVG & Animation Engine ---------- */
function petSVG(type, md, uid){
  const G = {
    dying: {bx: 18, by: 20, hr: 22},
    normal: {bx: 26, by: 23, hr: 25},
    happy: {bx: 27, by: 24, hr: 25},
    fat: {bx: 37, by: 30, hr: 28},
    gold: {bx: 35, by: 29, hr: 27}
  }[md];
  const cx = 70, cy = 100 - (md === 'fat' || md === 'gold' ? 2 : 0), hy = md === 'dying' ? 62 : 58;
  const {bx, by, hr} = G;

  let P;
  if (md === 'gold') {
    P = {fur: 'url(#gold'+uid+')', dark: '#C98A07', light: '#FFF5C4', ink: '#5A3A00', inner: '#FFB37A'};
  } else if (md === 'dying') {
    P = type === 'dog' 
      ? {fur: '#CFC4B6', dark: '#A0937F', light: '#EEE8E0', ink: '#4A4252', inner: '#D8C6C6'}
      : {fur: '#C3C3CB', dark: '#94949E', light: '#EDEDF1', ink: '#4A4252', inner: '#D9C9CF'};
  } else {
    P = type === 'dog'
      ? {fur: '#F2BA7A', dark: '#BD7340', light: '#FFF1DC', ink: '#3A2A44', inner: '#FF9CB6'}
      : {fur: '#A9B6CF', dark: '#7684A0', light: '#F5F3FB', ink: '#3A2A44', inner: '#FFB0C6'};
  }
  const happy = (md === 'happy' || md === 'fat' || md === 'gold');

  let s = `<svg viewBox="12 4 116 130" xmlns="http://www.w3.org/2000/svg" class="m-${md}" aria-hidden="true"><defs>
    <radialGradient id="gold${uid}" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FFF3A6"/>
      <stop offset=".55" stop-color="#F9C93C"/>
      <stop offset="1" stop-color="#E09B0E"/>
    </radialGradient>
    <linearGradient id="fireA${uid}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF3D1F"/>
      <stop offset=".6" stop-color="#FF8A1F"/>
      <stop offset="1" stop-color="#FFC23A" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="fireB${uid}" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="1" stop-color="#FFE45C" stop-opacity=".4"/>
    </linearGradient>
    <radialGradient id="glow${uid}">
      <stop offset="0" stop-color="#FFD54A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD54A" stop-opacity="0"/>
    </radialGradient>
  </defs>`;

  if (md === 'gold') {
    s += `<circle cx="70" cy="80" r="66" fill="url(#glow${uid})"/>`;
    s += `<path class="flame" d="M70 -2 C84 22 110 28 118 58 C128 92 112 128 70 130 C28 128 12 92 22 58 C30 28 56 22 70 -2Z" fill="url(#fireA${uid})"/>`;
    s += `<path class="flame f4" d="M24 30 C34 48 22 62 30 84 C16 74 12 50 24 30Z M116 30 C106 48 118 62 110 84 C124 74 128 50 116 30Z" fill="url(#fireA${uid})"/>`;
    s += `<path class="flame f2" d="M70 16 C80 34 100 40 104 62 C110 92 98 124 70 126 C42 124 30 92 36 62 C40 40 60 34 70 16Z" fill="url(#fireB${uid})"/>`;
    s += `<path class="flame f3" d="M70 40 C78 54 92 60 92 78 C92 104 84 122 70 124 C56 122 48 104 48 78 C48 60 62 54 70 40Z" fill="#FFE66D" opacity=".75"/>`;
  }

  s += `<ellipse cx="70" cy="129" rx="${bx+12}" ry="5" fill="#2F2343" opacity=".14"/>`;
  s += `<g class="petbody"><g class="breath">`;

  // Tail
  if (type === 'dog') {
    const tx = cx + bx - 5, ty = cy - 6;
    s += `<path class="tail" d="${md === 'dying' ? 'M'+tx+' '+ty+' q12 6 14 22' : 'M'+tx+' '+ty+' q14 -2 14 -22'}" fill="none" stroke="${P.dark}" stroke-width="${md === 'dying' ? 5 : 8}" stroke-linecap="round"/>`;
  } else {
    const tx = cx + bx - 4, ty = cy + 6;
    s += `<path class="tail" d="${md === 'dying' ? 'M'+tx+' '+ty+' C'+(tx+16)+' '+(ty+2)+' '+(tx+22)+' '+(ty+16)+' '+(tx+30)+' '+(ty+18) : 'M'+tx+' '+ty+' C'+(tx+20)+' '+(ty-2)+' '+(tx+24)+' '+(ty-30)+' '+(tx+10)+' '+(ty-38)}" fill="none" stroke="${P.fur}" stroke-width="${md === 'dying' ? 5 : 7}" stroke-linecap="round"/>`;
    if (md !== 'dying') s += `<path d="M${tx+14} ${ty-14} l6 -2 M${tx+16} ${ty-24} l6 1" stroke="${P.dark}" stroke-width="3" stroke-linecap="round"/>`;
  }

  // Legs
  const lw = md === 'dying' ? 7 : (md === 'fat' || md === 'gold' ? 14 : 11);
  const ly = cy + by - 12;
  [-(bx - 9), -(bx * 0.32), bx * 0.32, bx - 9].forEach((dx, i) => {
    s += `<rect x="${cx + dx - lw/2}" y="${ly}" width="${lw}" height="${md === 'dying' ? 20 : 15}" rx="${lw/2}" fill="${i === 0 || i === 3 ? P.dark : P.fur}"/>`;
  });

  // Body
  s += `<ellipse cx="${cx}" cy="${cy}" rx="${bx}" ry="${by}" fill="${P.fur}"/>`;
  s += `<ellipse cx="${cx}" cy="${cy + 4}" rx="${bx * 0.56}" ry="${by * 0.62}" fill="${P.light}"/>`;
  if (md === 'dying') {
    for (let i = 0; i < 3; i++) {
      const y = cy - 4 + i * 6;
      s += `<path d="M${cx-9} ${y} q4 -3 8 0 M${cx+1} ${y} q4 -3 8 0" fill="none" stroke="${P.dark}" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>`;
    }
  }
  if (type === 'cat' && md !== 'dying') {
    s += `<path d="M${cx-bx+6} ${cy-8} q6 2 9 -2 M${cx-bx+4} ${cy+2} q6 2 9 -2 M${cx+bx-15} ${cy-10} q6 2 9 -2" fill="none" stroke="${P.dark}" stroke-width="3" stroke-linecap="round"/>`;
  }

  // Ears behind (cat)
  if (type === 'cat') {
    const tip = md === 'dying' ? [cx - hr * 1.15, hy - hr + 2] : [cx - hr * 0.8, hy - hr - 13];
    const L = [[cx - hr * 0.95, hy - hr * 0.3], tip, [cx - hr * 0.15, hy - hr * 0.92]];
    const R = L.map(p => [2 * cx - p[0], p[1]]);
    const shrink = (T) => {
      const gx = (T[0][0] + T[1][0] + T[2][0]) / 3;
      const gy = (T[0][1] + T[1][1] + T[2][1]) / 3;
      return T.map(p => [gx + (p[0] - gx) * .55, gy + (p[1] - gy) * .55 + 1]);
    };
    [L, R].forEach(T => {
      s += `<path d="M${T.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}Z" fill="${P.fur}" stroke="${P.fur}" stroke-width="3" stroke-linejoin="round"/>`;
      s += `<path d="M${shrink(T).map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')}Z" fill="${P.inner}"/>`;
    });
  }

  // Head
  s += `<circle cx="${cx}" cy="${hy}" r="${hr}" fill="${P.fur}"/>`;
  if (type === 'cat' && md !== 'dying') {
    s += `<path d="M${cx-6} ${hy-hr+4} l2 6 M${cx} ${hy-hr+3} l0 7 M${cx+6} ${hy-hr+4} l-2 6" stroke="${P.dark}" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  if (type === 'dog') {
    const rot = md === 'dying' ? 8 : 22, ry = md === 'dying' ? 19 : 16;
    s += `<ellipse cx="${cx - hr + 3}" cy="${hy + 2}" rx="9" ry="${ry}" fill="${P.dark}" transform="rotate(${rot} ${cx - hr + 3} ${hy - 10})"/>`;
    s += `<ellipse cx="${cx + hr - 3}" cy="${hy + 2}" rx="9" ry="${ry}" fill="${P.dark}" transform="rotate(${-rot} ${cx + hr - 3} ${hy - 10})"/>`;
    if (md !== 'dying') s += `<ellipse cx="${cx + hr * 0.42}" cy="${hy - 5}" rx="8" ry="7" fill="${P.dark}" opacity=".35"/>`;
  }

  // Eyes
  const ex = hr * 0.38, ey = hy - 3;
  [cx - ex, cx + ex].forEach((x, i) => {
    if (md === 'dying') {
      s += `<path d="M${x-4} ${ey} q4 3.5 8 0" fill="none" stroke="${P.ink}" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M${x-3.5} ${ey+5} q3.5 2 7 0" fill="none" stroke="${P.dark}" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>
            <path d="M${x + (i ? -5 : 5)} ${ey - 7} L${x + (i ? 4 : -4)} ${ey - 5}" stroke="${P.ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    } else if (happy) {
      s += `<path d="M${x-4.5} ${ey+1.5} q4.5 -6 9 0" fill="none" stroke="${P.ink}" stroke-width="2.8" stroke-linecap="round"/>`;
    } else {
      s += `<circle cx="${x}" cy="${ey}" r="3.6" fill="${P.ink}"/><circle cx="${x+1.2}" cy="${ey-1.3}" r="1.2" fill="#fff"/>`;
    }
  });
  if (happy) {
    [cx - hr * 0.62, cx + hr * 0.62].forEach(x => {
      s += `<ellipse cx="${x}" cy="${hy+7}" rx="4.6" ry="2.8" fill="#FF7FA8" opacity=".55"/>`;
    });
  }

  // Muzzle & Mouth
  if (type === 'dog') {
    s += `<ellipse cx="${cx}" cy="${hy+9}" rx="${hr*0.44}" ry="${hr*0.32}" fill="${P.light}"/>`;
    s += `<ellipse cx="${cx}" cy="${hy+4.5}" rx="4.6" ry="3.4" fill="${P.ink}"/>`;
    if (md === 'dying') {
      s += `<path d="M${cx-5} ${hy+15} q5 -4 10 0" fill="none" stroke="${P.ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    } else if (happy) {
      s += `<path d="M${cx-6} ${hy+10} q6 9 12 0Z" fill="#7A2E45"/><ellipse cx="${cx}" cy="${hy+15.5}" rx="3.4" ry="3" fill="#FF8FAE"/>`;
    } else {
      s += `<path d="M${cx-5} ${hy+11} q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="${P.ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    }
  } else {
    s += `<path d="M${cx-3.2} ${hy+4} L${cx+3.2} ${hy+4} L${cx} ${hy+7.5}Z" fill="#FF7FA8"/>`;
    if (md === 'dying') {
      s += `<path d="M${cx-5} ${hy+13} q5 -4 10 0" fill="none" stroke="${P.ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    } else if (happy) {
      s += `<path d="M${cx-5} ${hy+9} q5 7 10 0Z" fill="#7A2E45"/>`;
    } else {
      s += `<path d="M${cx-5} ${hy+9} q2.5 3 5 0 q2.5 3 5 0" fill="none" stroke="${P.ink}" stroke-width="1.8" stroke-linecap="round"/>`;
    }
    [-1, 1].forEach(sg => {
      [[-2,-3], [1,0], [4,3]].forEach(w => {
        s += `<path d="M${cx + sg * 9} ${hy + 6 + w[0] * .6} L${cx + sg * (hr + 6)} ${hy + 3 + w[1] * 1.6}" stroke="${P.dark}" stroke-width="1.2" stroke-linecap="round" opacity=".8"/>`;
      });
    });
  }

  if (md === 'dying') {
    s += `<path class="drop" d="M${cx + hr * 0.7} ${hy - 14} q3 5 0 7 q-3 -2 0 -7Z" fill="#8CC8F2"/>`;
  }
  s += `</g></g>`;

  if (md === 'gold') {
    [[22,30,''], [118,42,' s2'], [30,100,' s3'], [112,104,'']].forEach(p => {
      s += `<path class="spark${p[2]}" d="M${p[0]} ${p[1]-6} L${p[0]+2} ${p[1]-2} L${p[0]+6} ${p[1]} L${p[0]+2} ${p[1]+2} L${p[0]} ${p[1]+6} L${p[0]-2} ${p[1]+2} L${p[0]-6} ${p[1]} L${p[0]-2} ${p[1]-2}Z" fill="#FFF6B0"/>`;
    });
  }
  if (md === 'fat') {
    [[24,40,''], [116,48,' s2']].forEach(p => {
      s += `<text class="spark${p[2]}" x="${p[0]}" y="${p[1]}" font-size="12" text-anchor="middle">💗</text>`;
    });
  }

  s += `</svg>`;
  return s;
}

let lastMood = null, lastPetKey = '', lastMoodChap = null, bubbleLock = false, bubbleTimer = null;

function curChap(){
  return S.chap === 'flagged' ? (CH[S.activeNotesChap] || CH.t1) : CH[S.chap];
}

function updatePet(){
  if (!S.pet) {
    $('#pet').style.display = 'none';
    return;
  }
  $('#pet').style.display = '';
  const c = curChap();
  const st = stats(c);
  const md = mood(st.pct);
  const key = S.pet + md;

  if (key !== lastPetKey) {
    $('#petbtn').innerHTML = petSVG(S.pet, md, 'p');
    lastPetKey = key;
  }
  $('#petbtn').setAttribute('aria-label', `Pet your ${S.pet}. ${MOODNAME[md]}, ${Math.round(st.pct)}% in ${c.shortTitle}`);
  
  if (!bubbleLock) {
    $('#bubble').innerHTML = `${MOODNAME[md]} <small>${Math.round(st.pct)}% in ${c.shortTitle}</small>`;
  }

  if (lastMood && lastMood !== md && lastMoodChap === c.id) {
    const order = ['dying','normal','happy','fat','gold'];
    if (order.indexOf(md) > order.indexOf(lastMood)) {
      toast(`🎉 Wow! Your ${S.pet} evolved to ${MOODNAME[md]}!`);
    }
  }
  lastMood = md;
  lastMoodChap = c.id;
}

function say(t){
  bubbleLock = true;
  $('#bubble').textContent = t;
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(() => {
    bubbleLock = false;
    updatePet();
  }, 1800);
}

function floatText(txt, cls, dx){
  const f = document.createElement('span');
  f.className = 'float ' + (cls || '');
  f.textContent = txt;
  f.style.setProperty('--dx', (dx || 0) + 'px');
  $('#petbtn').appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

function anim(cls){
  const b = $('#petbtn');
  b.classList.remove('jump', 'pat', 'sad');
  void b.offsetWidth;
  b.classList.add(cls);
  setTimeout(() => b.classList.remove(cls), 700);
}

let toastTimer = null;
function toast(t){
  const el = $('#toast');
  el.textContent = t;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 2500);
}

/* ---------- Concepts to Remember Modal / Drawer ---------- */
function openNotes(topicId){
  const tid = topicId || (S.chap === 'flagged' ? S.activeNotesChap : S.chap);
  S.activeNotesChap = tid;
  save();

  // Render navigation tabs inside notes drawer
  const navHtml = CHAPTERS.map(c => {
    const isSel = (c.id === tid);
    return `<button class="notes-nav-tab" data-noteschap="${c.id}" aria-selected="${isSel}">${c.shortTitle}</button>`;
  }).join('');
  $('#notesNav').innerHTML = navHtml;

  renderNotesContent(tid);
  $('#notesBackdrop').classList.add('open');
  $('#notesBackdrop').setAttribute('aria-hidden', 'false');
  $('#notesSearchInput').value = '';
}

function closeNotes(){
  $('#notesBackdrop').classList.remove('open');
  $('#notesBackdrop').setAttribute('aria-hidden', 'true');
}

function safeEscapeRegex(str){
  const specials = ['.', '*', '+', '?', '^', '$', '{', '}', '(', ')', '|', '[', ']', '/', '\\'];
  let res = '';
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (specials.indexOf(ch) !== -1) res += '\\' + ch;
    else res += ch;
  }
  return res;
}

function renderNotesContent(tid, filterText){
  const c = CH[tid];
  if (!c) return;
  $('#notesTitle').innerHTML = `📖 Concepts to Remember <span style="font-size:.85rem;color:var(--muted);font-weight:600">(${c.shortTitle})</span>`;
  let content = c.concepts;

  if (filterText && filterText.trim().length > 1) {
    const query = filterText.trim().toLowerCase();
    try {
      const escaped = safeEscapeRegex(query);
      const regex = new RegExp(`(${escaped})`, 'gi');
      content = content.replace(regex, '<mark style="background:var(--butter);padding:0 2px;border-radius:3px">$1</mark>');
    } catch(e){}
  }

  $('#notesBody').innerHTML = `<div>
    <div style="margin-bottom:14px;padding-bottom:10px;border-bottom:2px dashed var(--line)">
      <span class="badge" style="background:var(--plum);color:#fff;font-weight:700;padding:2px 10px;border-radius:999px;font-size:.8rem">${c.title}</span>
      <span style="font-size:.82rem;color:var(--muted);margin-left:8px">${c.itemRange}</span>
    </div>
    ${content}
  </div>`;
}

function refreshPanel(){
  if (S.chap === 'flagged') return;
  const c = CH[S.chap];
  const st = stats(c);
  const p = document.querySelector('.panel');
  if (!p) return;
  p.querySelector('.chmeta').textContent = `${c.itemRange} • ${st.total} items • ${st.pts} of ${st.scored} points earned (${Math.round(st.pct)}%), ${st.answered} answered.`;
  p.querySelector('.fill').style.width = st.pct.toFixed(1) + '%';
  p.querySelector('.pawdot').style.left = Math.max(3, Math.min(97, st.pct)).toFixed(1) + '%';
}

function openChooser(){
  $('#pvDog').innerHTML = petSVG('dog', 'happy', 'cdog');
  $('#pvCat').innerHTML = petSVG('cat', 'happy', 'ccat');
  $('#chooser').hidden = false;
  const firstPick = $('#chooser .pick');
  if (firstPick) firstPick.focus();
}

function updateCard(qid) {
  const card = document.getElementById(qid);
  if (!card) return;
  const q = Q[qid];
  if (!q) return;
  card.outerHTML = qCard(q, S.chap === 'flagged' || S.filter !== 'all');
  const textarea = document.getElementById('notetext-' + qid);
  if (textarea) {
    textarea.focus();
    textarea.setSelectionRange(textarea.value.length, textarea.value.length);
  }
}

/* ---------- Global Event Listeners ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-chap],[data-opt],[data-flag],[data-filter],[data-redo],[data-opennotes],[data-noteschap],#resetChapBtn,#petbtn,#swap,[data-pet],#notesCloseBtn,#floatingNotesBtn,#notesHeaderBtn,#copyNotesBtn,#themeBtn,[data-notetoggle],[data-noteedit],[data-notesave],[data-notecancel],[data-notedel]');
  if (!t) {
    if (e.target.id === 'notesBackdrop') closeNotes();
    return;
  }

  // Topic Navigation
  if (t.dataset.chap) {
    S.chap = t.dataset.chap;
    if (S.chap !== 'flagged') S.activeNotesChap = S.chap;
    S.filter = 'all';
    S.editingNote = null;
    save();
    render();
    window.scrollTo({top: 0, behavior: 'smooth'});
    return;
  }

  // Answer Selection
  if (t.dataset.opt) {
    const qid = t.dataset.q;
    const q = Q[qid];
    if (S.ans[qid]) return;
    const picked = t.dataset.opt;
    S.ans[qid] = picked;
    save();

    const card = document.getElementById(qid);
    if (card) card.outerHTML = qCard(q, S.chap === 'flagged' || S.filter !== 'all');
    refreshPanel();
    renderTabs();

    if (picked === q.ans) {
      anim('jump');
      floatText('+1 ' + (S.pet === 'cat' ? '🐟' : '🦴'), '', 0);
    } else {
      anim('sad');
    }
    updatePet();
    return;
  }

  // Flag Item
  if (t.dataset.flag) {
    const qid = t.dataset.flag;
    if (S.flags[qid]) delete S.flags[qid];
    else S.flags[qid] = 1;
    save();

    const card = document.getElementById(qid);
    if (card && !(S.chap === 'flagged' || S.filter === 'flag')) {
      card.outerHTML = qCard(Q[qid], S.filter !== 'all');
    } else {
      render();
    }
    renderTabs();
    return;
  }

  // Personal Note Toggle / Add Note
  if (t.dataset.notetoggle) {
    const qid = t.dataset.notetoggle;
    if (S.editingNote === qid) {
      S.editingNote = null;
    } else {
      S.editingNote = qid;
    }
    updateCard(qid);
    return;
  }

  // Personal Note Edit
  if (t.dataset.noteedit) {
    const qid = t.dataset.noteedit;
    S.editingNote = qid;
    updateCard(qid);
    return;
  }

  // Personal Note Save
  if (t.dataset.notesave) {
    const qid = t.dataset.notesave;
    const textarea = document.getElementById('notetext-' + qid);
    const text = textarea ? textarea.value.trim() : '';
    if (text.length > 0) {
      S.notes[qid] = text;
      toast('Note saved!');
    } else {
      delete S.notes[qid];
      toast('Note removed.');
    }
    S.editingNote = null;
    save();
    if (S.filter === 'note') {
      render();
    } else {
      updateCard(qid);
    }
    return;
  }

  // Personal Note Cancel
  if (t.dataset.notecancel) {
    const qid = t.dataset.notecancel;
    S.editingNote = null;
    updateCard(qid);
    return;
  }

  // Personal Note Delete
  if (t.dataset.notedel) {
    const qid = t.dataset.notedel;
    if (confirm('Delete your note for this question?')) {
      delete S.notes[qid];
      S.editingNote = null;
      save();
      if (S.filter === 'note') {
        render();
      } else {
        updateCard(qid);
      }
      toast('Note deleted.');
    }
    return;
  }

  // Filter Buttons
  if (t.dataset.filter) {
    S.filter = t.dataset.filter;
    S.editingNote = null;
    save();
    render();
    return;
  }

  // Redo / Reset Item
  if (t.dataset.redo) {
    const qid = t.dataset.redo;
    delete S.ans[qid];
    save();
    const card = document.getElementById(qid);
    if (S.filter === 'miss' && S.chap !== 'flagged') {
      if (card) card.remove();
    } else if (card) {
      card.outerHTML = qCard(Q[qid], S.chap === 'flagged' || S.filter !== 'all');
    }
    refreshPanel();
    renderTabs();
    updatePet();
    toast(`Item ${Q[qid].n} reset.`);
    return;
  }

  // Reset Topic
  if (t.id === 'resetChapBtn') {
    const c = CH[S.chap];
    if (!confirm(`Reset all answers for ${c.title}? Your flags and personal notes will be kept.`)) return;
    c.items.forEach(q => delete S.ans[q.id]);
    save();
    lastMood = null;
    render();
    toast(`${c.shortTitle} reset.`);
    return;
  }

  // Floating Notes Open / Close
  if (t.id === 'floatingNotesBtn' || t.id === 'notesHeaderBtn') {
    openNotes();
    return;
  }
  if (t.dataset.opennotes) {
    openNotes(t.dataset.opennotes);
    return;
  }
  if (t.id === 'notesCloseBtn') {
    closeNotes();
    return;
  }
  if (t.dataset.noteschap) {
    openNotes(t.dataset.noteschap);
    return;
  }

  // Copy Notes
  if (t.id === 'copyNotesBtn') {
    const bodyText = document.getElementById('notesBody').innerText;
    navigator.clipboard.writeText(bodyText).then(() => {
      toast('Copied Concepts to Remember to clipboard!');
    }).catch(() => {
      toast('Please manually select and copy text.');
    });
    return;
  }

  // Pet Click / Petting
  if (t.id === 'petbtn') {
    S.pets = (S.pets || 0) + 1;
    save();
    anim('pat');
    floatText('♥', 'heart', -18);
    setTimeout(() => floatText('♥', 'heart', 16), 140);
    const dogQuotes = ['Woof! Keep going, CPA!', 'Arf! Tax master!', '*happy tail wag*', 'You got this!', 'Good job!'];
    const catQuotes = ['Purr... Master of NIRC!', 'Mrrp! Future CPA!', '*gentle purr*', '*slow blink of approval*', 'Pawsome!'];
    const lines = S.pet === 'cat' ? catQuotes : dogQuotes;
    say(lines[S.pets % lines.length]);
    return;
  }

  // Pet Swap / Chooser
  if (t.id === 'swap') {
    openChooser();
    return;
  }
  if (t.dataset.pet) {
    S.pet = t.dataset.pet;
    save();
    $('#chooser').hidden = true;
    lastPetKey = '';
    render();
    say(S.pet === 'cat' ? "Mrrp! Ready to conquer Tax!" : "Woof! Let's ace this CPALE!");
    return;
  }

  // Theme Toggle
  if (t.id === 'themeBtn') {
    const curTheme = document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const newTheme = curTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', newTheme);
    toast(`Switched to ${newTheme} theme`);
    return;
  }
});

// Search inside Notes
document.addEventListener('input', e => {
  if (e.target.id === 'notesSearchInput') {
    renderNotesContent(S.activeNotesChap, e.target.value);
  }
});

// Jump to item #
document.addEventListener('change', e => {
  if (e.target.id === 'jumpin') {
    const val = parseInt(e.target.value, 10);
    if (!val) return;
    const c = CH[S.chap];
    const q = c.items.find(x => x.n === val);
    if (!q) {
      toast(`Item ${val} not found in this topic.`);
      return;
    }
    let card = document.getElementById(q.id);
    if (!card) {
      S.filter = 'all';
      render();
      card = document.getElementById(q.id);
    }
    if (card) {
      card.scrollIntoView({behavior: 'smooth', block: 'center'});
      card.style.transition = 'box-shadow .4s';
      card.style.boxShadow = '0 0 0 4px var(--plum)';
      setTimeout(() => { card.style.boxShadow = ''; }, 1500);
    }
  }
});

// Keyboard shortcuts for note textarea (Ctrl+Enter to save, Esc to cancel)
document.addEventListener('keydown', e => {
  if (e.target && e.target.classList.contains('note-textarea')) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      const qid = e.target.dataset.qid;
      const saveBtn = document.querySelector(`[data-notesave="${qid}"]`);
      if (saveBtn) saveBtn.click();
    } else if (e.key === 'Escape') {
      const qid = e.target.dataset.qid;
      const cancelBtn = document.querySelector(`[data-notecancel="${qid}"]`);
      if (cancelBtn) cancelBtn.click();
    }
    return;
  }

  // Escape key to close modal/drawer
  if (e.key === 'Escape') {
    closeNotes();
    if (!$('#chooser').hidden && S.pet) $('#chooser').hidden = true;
  }
});

render();
if (!S.pet) {
  openChooser();
}
})();
</script>
</body>
</html>
