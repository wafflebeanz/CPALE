s is: (RR No. 7-2025)", "opts": [{"l": "a", "t": "deductible from the gross income of the taxpayer."}, {"l": "b", "t": "not deductible from the gross income of the taxpayer."}, {"l": "c", "t": "deductible from output tax of the taxpayer."}, {"l": "d", "t": "refundable by the taxpayer."}], "ans": "a"}, {"n": 77, "p": 15, "stem": "The yield or income from the ABS (Asset-Backed Securities) shall be subject to a: (RR No. 2-2025)", "opts": [{"l": "a", "t": "25% final withholding tax."}, {"l": "b", "t": "20% final withholding tax."}, {"l": "c", "t": "10% final withholding tax."}, {"l": "d", "t": "5% final withholding tax."}], "ans": "b"}, {"n": 78, "p": 15, "ctx": "In 2022, Mr. Kris Manuel owns a nightclub and videoke bar, with gross sales/receipts of P2,500,000. His cost of sales and operating expenses are P1,000,000 and P600,000, respectively.", "stem": "Can the taxpayer avail of the 8% income tax rate?", "opts": [{"l": "a", "t": "Yes. Because his gross receipts do not exceed the VAT threshold."}, {"l": "b", "t": "No. Because he is subject to percentage tax under Sec. 125."}, {"l": "c", "t": "Yes. Because night club and videoke bar owners are always allowed to avail of the 8% income tax rate."}, {"l": "d", "t": "No. Because he did not express his intention to be taxed at 8%."}], "ans": "b"}, {"n": 79, "p": 15, "ctx": "In 2022, Mr. Kris Manuel owns a nightclub and videoke bar, with gross sales/receipts of P2,500,000. His cost of sales and operating expenses are P1,000,000 and P600,000, respectively.", "stem": "How much is the income tax due?", "opts": [{"l": "a", "t": "P200,000"}, {"l": "b", "t": "P198,000"}, {"l": "c", "t": "P190,000"}, {"l": "d", "t": "P160,000"}], "ans": "d"}, {"n": 80, "p": 15, "ctx": "In 2022, Mr. Kris Manuel owns a nightclub and videoke bar, with gross sales/receipts of P2,500,000. His cost of sales and operating expenses are P1,000,000 and P600,000, respectively.", "stem": "How much is the percentage tax due?", "opts": [{"l": "a", "t": "P750,000"}, {"l": "b", "t": "P450,000"}, {"l": "c", "t": "P375,000"}, {"l": "d", "t": "P250,000"}], "ans": "b"}, {"n": 81, "p": 16, "stem": "Foreign nationals or non-Filipino citizens, regardless of their residency, term and class of working or employment permit or visa, who are employed and assigned in the Philippines by an Offshore Gaming Licensee (OGL) or its Accredited Service Provider shall have a TIN and shall be subject to a:", "opts": [{"l": "a", "t": "final withholding tax of 25% on their gross income."}, {"l": "b", "t": "creditable withholding tax of 25% on their gross income."}, {"l": "c", "t": "final withholding tax of 20% on their gross income."}, {"l": "d", "t": "creditable withholding tax of 10% on their gross income."}], "ans": "a"}, {"n": 82, "p": 16, "stem": "One of the following can avail of the 8% income tax rate option:", "opts": [{"l": "a", "t": "VAT-registered seller of goods"}, {"l": "b", "t": "Taxpayer subject to franchise tax under Section 119"}, {"l": "c", "t": "Partners of general professional partnerships"}, {"l": "d", "t": "Taxpayer subject to Percentage Tax on VAT-exempt persons (Sec. 116)"}], "ans": "d"}, {"n": 83, "p": 16, "stem": "The surcharge of 50% on the amount due shall be imposed where there is:", "opts": [{"l": "a", "t": "failure to file any return and pay the tax due thereon."}, {"l": "b", "t": "filing of return with an internal revenue officer other than those with whom the return is required to be filed."}, {"l": "c", "t": "failure to pay the deficiency tax on time as indicated in the notice of assessment."}, {"l": "d", "t": "failure to file a return on time due to willful neglect."}], "ans": "d"}, {"n": 84, "p": 16, "stem": "Under the NIRC, what are the rates of surcharges?", "opts": [{"l": "a", "t": "20%/25%"}, {"l": "b", "t": "25%/50%"}, {"l": "c", "t": "10%/20%/50%"}, {"l": "d", "t": "10%/25%/50%"}], "ans": "d"}, {"n": 85, "p": 16, "stem": "Which of the following statements is the most accurate about the imposition of 10% surcharge?", "opts": [{"l": "a", "t": "This surcharge may be imposed against micro taxpayers on instances where the 25% surcharge would otherwise be imposed."}, {"l": "b", "t": "This surcharge may be imposed against micro and small taxpayers on instances where the 25% surcharge would otherwise be imposed."}, {"l": "c", "t": "This surcharge may be imposed against micro taxpayers on any violations of the NIRC, regardless of whether the surcharge is originally at 25% or 50%."}, {"l": "d", "t": "This surcharge may be imposed against micro and small taxpayers on any violations of the NIRC, regardless of whether the surcharge is originally at 25% or 50%."}], "ans": "b"}, {"n": 86, "p": 16, "stem": "Nippon Corporation, a non-resident corporation organized under the laws of Japan, deposited US$4,000,000 at Bank of the Philippine Islands, Makati City. The interest income from the said deposit shall be subject to:", "opts": [{"l": "a", "t": "25% final withholding tax"}, {"l": "b", "t": "20% final withholding tax"}, {"l": "c", "t": "15% final withholding tax"}, {"l": "d", "t": "0% final withholding tax"}], "ans": "d"}, {"n": 87, "p": 16, "stem": "The \"tax sparing principle\" which entitles the taxpayer to a preferential tax rate of only 15% on the dividends received from a domestic corporation may be applied to:", "opts": [{"l": "a", "t": "domestic corporation"}, {"l": "b", "t": "resident foreign corporation"}, {"l": "c", "t": "non-resident foreign corporation"}, {"l": "d", "t": "non-corporate taxpayers"}], "ans": "c"}, {"n": 88, "p": 16, "stem": "Which of the following de minimis benefits shall no longer be within the purview of a de minimis benefit if it exceeds the limit and shall be treated as other benefits in full?", "opts": [{"l": "a", "t": "Medical benefits given to the employees by the employer"}, {"l": "b", "t": "Benefits received by an employee by virtue of a collective bargaining agreement (CBA) and productivity incentive schemes"}, {"l": "c", "t": "Uniforms and clothing allowance given to employees by the employer"}, {"l": "d", "t": "Gifts given during Christmas and major anniversary celebrations"}], "ans": "b"}, {"n": 89, "p": 16, "stem": "Which of the following revenues constitutes the \"Gross Philippine Billings\" of a resident foreign corporation operating as an international air carrier?", "opts": [{"l": "a", "t": "Revenue on flight from the United States to the Philippines, tickets sold in the Philippines"}, {"l": "b", "t": "Revenue on flight from the Philippines to Japan, tickets sold in Japan"}, {"l": "c", "t": "Revenue on flight from Hongkong to South Korea (flight originated from the Philippines with transshipment at Hongkong), tickets sold in the Philippines"}, {"l": "d", "t": "Revenue on a return flight from Singapore to the Philippines, round-trip ticket sold in the Philippines"}], "ans": "b"}, {"n": 90, "p": 17, "ctx": "Statement of Income and Expenses of ABC Corporation for taxable year 2021: gross profit from sales P800,000; less business expenses P440,000, provision for bad debts P80,000, write-off of inventories lost due to spoilage P20,000 (total P540,000); net income from operations P260,000; add dividend income from a domestic corporation P50,000 and interest on Philippine bank peso deposit P30,000; net income P340,000. Additional information: (1) accounts written off during the year and charged to allowance for bad debts, P50,000; (2) recoveries on accounts receivable previously written off in 2020 and credited to allowance for bad debts: allowed as deduction by BIR P30,000, disallowed as deduction by BIR P20,000.", "stem": "How much is the total non-deductible expenses/taxable other income?", "opts": [{"l": "a", "t": "P410,000"}, {"l": "b", "t": "P130,000"}, {"l": "c", "t": "P110,000"}, {"l": "d", "t": "P100,000"}], "ans": "b"}, {"n": 91, "p": 17, "ctx": "Statement of Income and Expenses of ABC Corporation for taxable year 2021: gross profit from sales P800,000; less business expenses P440,000, provision for bad debts P80,000, write-off of inventories lost due to spoilage P20,000 (total P540,000); net income from operations P260,000; add dividend income from a domestic corporation P50,000 and interest on Philippine bank peso deposit P30,000; net income P340,000. Additional information: (1) accounts written off during the year and charged to allowance for bad debts, P50,000; (2) recoveries on accounts receivable previously written off in 2020 and credited to allowance for bad debts: allowed as deduction by BIR P30,000, disallowed as deduction by BIR P20,000.", "stem": "How much is the non-taxable income and income subject to final tax?", "opts": [{"l": "a", "t": "P130,000"}, {"l": "b", "t": "P100,000"}, {"l": "c", "t": "P80,000"}, {"l": "d", "t": "P30,000"}], "ans": "c"}, {"n": 92, "p": 17, "ctx": "Statement of Income and Expenses of ABC Corporation for taxable year 2021: gross profit from sales P800,000; less business expenses P440,000, provision for bad debts P80,000, write-off of inventories lost due to spoilage P20,000 (total P540,000); net income from operations P260,000; add dividend income from a domestic corporation P50,000 and interest on Philippine bank peso deposit P30,000; net income P340,000. Additional information: (1) accounts written off during the year and charged to allowance for bad debts, P50,000; (2) recoveries on accounts receivable previously written off in 2020 and credited to allowance for bad debts: allowed as deduction by BIR P30,000, disallowed as deduction by BIR P20,000.", "stem": "How much was the taxable net income using Reconciliation of Net Income Per Books Against Taxable Income?", "opts": [{"l": "a", "t": "P340,000"}, {"l": "b", "t": "P370,000"}, {"l": "c", "t": "P390,000"}, {"l": "d", "t": "P440,000"}], "ans": "a"}, {"n": 93, "p": 17, "stem": "GCC Corporation, a domestic corporation, owns 20% of the outstanding shares of BTS Corporation, a non-resident foreign corporation (NRFC), since August 1, 2015. On May 1, 2021, it received dividends amounting to P1,000,000 from the said NRFC. On September 1, 2022, GCC Corporation utilized P800,000 for its dividend payments. On January 1, 2023, it utilized the remaining P200,000 for its working capital. How much is the tax-exempt dividend?", "opts": [{"l": "a", "t": "P1,000,000"}, {"l": "b", "t": "P800,000"}, {"l": "c", "t": "P200,000"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 94, "p": 17, "ctx": "Jose Cruz sold a painting (capital asset) which he purchased in 2020 at a cost of P30,000. He sold the painting to Pedro Santos on the following terms: June 1, 2023 down payment P10,000; August 1, 2023 installment P10,000; October 1, 2023 installment P20,000; October 1, 2024 installment P40,000; October 1, 2025 installment P40,000.", "stem": "For the year 2023, Jose Cruz will report a gross income of:", "opts": [{"l": "a", "t": "P90,000"}, {"l": "b", "t": "P45,000"}, {"l": "c", "t": "P30,000"}, {"l": "d", "t": "P15,000"}], "ans": "b"}, {"n": 95, "p": 17, "ctx": "Jose Cruz sold a painting (capital asset) which he purchased in 2020 at a cost of P30,000. He sold the painting to Pedro Santos on the following terms: June 1, 2023 down payment P10,000; August 1, 2023 installment P10,000; October 1, 2023 installment P20,000; October 1, 2024 installment P40,000; October 1, 2025 installment P40,000.", "stem": "Assuming Jose Cruz is a dealer in paintings, how much will he report as gross income for 2023?", "opts": [{"l": "a", "t": "P15,000"}, {"l": "b", "t": "P30,000"}, {"l": "c", "t": "P45,000"}, {"l": "d", "t": "P90,000"}], "ans": "b"}, {"n": 96, "p": 17, "stem": "A domestic corporation has the following data for three years: 2023 normal income tax P50,000, MCIT P75,000; 2024 normal income tax P60,000, MCIT P100,000; 2025 normal income tax P100,000, MCIT P60,000. How much is the tax payable in 2025?", "opts": [{"l": "a", "t": "P100,000"}, {"l": "b", "t": "P60,000"}, {"l": "c", "t": "P35,000"}, {"l": "d", "t": "Zero"}], "ans": "c"}, {"n": 97, "p": 18, "stem": "With the following data, how much is the deductible pension/retirement plan contribution for 2022? Pension/retirement plan contribution: 2020 P500,000; 2021 P500,000; 2022 P500,000. Breakdown of each P500,000 per actuarial valuation: normal cost P400,000, past service cost P100,000.", "opts": [{"l": "a", "t": "P500,000"}, {"l": "b", "t": "P430,000"}, {"l": "c", "t": "P420,000"}, {"l": "d", "t": "P400,000"}], "ans": "b"}, {"n": 98, "p": 18, "stem": "As a general rule, proceeds of insurance are not taxable because they only constitute a return of what was lost (return of capital). Which of the following are taxable proceeds?", "opts": [{"l": "a", "t": "Proceeds of life insurance"}, {"l": "b", "t": "Proceeds of accident or health insurance"}, {"l": "c", "t": "Proceeds of property insurance"}, {"l": "d", "t": "Proceeds of crop insurance"}], "ans": "d"}, {"n": 99, "p": 18, "stem": "Under Republic Act No. 11976 (Ease of Paying Taxes Act), the repeal of Section 34(K) which is an additional requirement for deductibility of certain payments applies to:", "opts": [{"l": "a", "t": "micro and small taxpayers only."}, {"l": "b", "t": "medium and large taxpayers only."}, {"l": "c", "t": "large taxpayers only."}, {"l": "d", "t": "all taxpayers regardless of classification."}], "ans": "d"}, {"n": 100, "p": 18, "stem": "Under EOPT Act, filing of returns in a wrong venue no longer subjects such violation to 25% surcharge if it involves:", "opts": [{"l": "a", "t": "micro and small taxpayers only."}, {"l": "b", "t": "medium and large taxpayers only."}, {"l": "c", "t": "large taxpayers only."}, {"l": "d", "t": "all taxpayers regardless of the classification."}], "ans": "d"}, {"n": 101, "p": 18, "stem": "Under EOPT Act, the 10% reduced surcharge for micro and small taxpayers does not apply when there is:", "opts": [{"l": "a", "t": "failure to file any return and pay the tax due thereon as required under the provisions of the Tax Code or rules and regulations on the date prescribed."}, {"l": "b", "t": "failure to pay the deficiency tax within the time prescribed for its payment in the notice of assessment."}, {"l": "c", "t": "failure to pay the full or part of the amount of tax shown on any return required to be filed, or the full amount of tax due for which no return is required to be filed, on or before the date prescribed for its payment."}, {"l": "d", "t": "willful neglect to file the return within the period prescribed by the Code."}], "ans": "d"}, {"n": 102, "p": 18, "stem": "When does the obligation to withhold arise?", "opts": [{"l": "a", "t": "at the time an income payment is paid"}, {"l": "b", "t": "at the time an income payment is payable"}, {"l": "c", "t": "at the time an income payment is paid or payable, whichever comes first"}, {"l": "d", "t": "at the time an income payment is paid or payable, or the income payment is accrued or recorded as an expense or asset, whichever is applicable, in the payor's books, whichever comes first"}], "ans": "d"}, {"n": 103, "p": 18, "stem": "La Voix Company paid the salaries of its employee, Kyran, without deducting the corresponding withholding tax. Kyran has no other source of income other than her employment with La Voix Company. Statement 1: La Voix Company cannot deduct the salary paid to Kyran against its gross income. Statement 2: Kyran should file her income tax return to declare the compensation income she received from La Voix Company.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "d"}, {"n": 104, "p": 18, "stem": "How long should books of accounts be kept?", "opts": [{"l": "a", "t": "Five (5) years reckoned from the date of filing or the deadline, whichever is later, in either physical or soft copies."}, {"l": "b", "t": "Five (5) years reckoned from the date of filing or the deadline, whichever is later, in both physical and soft copies."}, {"l": "c", "t": "Ten (10) years reckoned from the date of filing or the deadline, whichever is later, in both physical and soft copies."}], "ans": "a"}, {"n": 105, "p": 18, "stem": "An invoice is required to be issued if the amount of the transaction is at least:", "opts": [{"l": "a", "t": "P10"}, {"l": "b", "t": "P25"}, {"l": "c", "t": "P100"}, {"l": "d", "t": "P500"}], "ans": "d"}, {"n": 106, "p": 19, "stem": "What is the formula to compute capital gains tax on real property?", "opts": [{"l": "a", "t": "6% of the zonal value or assessed value, whichever is higher."}, {"l": "b", "t": "6% of the zonal value, assessed value, or the selling price, whichever is the highest."}, {"l": "c", "t": "6% of the zonal value, appraised value, or the selling price, whichever is the highest."}, {"l": "d", "t": "6% of the fair market value in accordance with the Schedule of Market Values (SMV) or the selling price, whichever is higher."}], "ans": "d"}, {"n": 107, "p": 19, "stem": "On August 11, 2018, an individual taxpayer not engaged in real estate business acquired a parcel of land which would be used as a site for an office building for P3,000,000. The planned office building was not built due to financial problems. The land was idle up to August 11, 2022. The taxpayer presented proof to the BIR that the land had not been used in business since its acquisition. The land was sold for P5,000,000 on September 5, 2022. What was the tax consequence of the sale?", "opts": [{"l": "a", "t": "There was taxable gain of P2,000,000 which would be subject to Section 24(A)."}, {"l": "b", "t": "The sale would be subject to 6% capital gains tax based on the selling price."}, {"l": "c", "t": "The sale would be exempt from tax because the property was not used for business."}, {"l": "d", "t": "The gain of P2,000,000 will be subject to 6% capital gains tax."}], "ans": "b"}, {"n": 108, "p": 19, "stem": "Income payments made by any of the top withholding agents, including non-resident aliens engaged in trade or business in the Philippines, shall be subjected to which of the following withholding tax rates: A. Supplier of goods, one percent (1%). B. Supplier of services, two percent (2%). (RR No. 24-2025)", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "Neither A nor B"}, {"l": "c", "t": "A only"}, {"l": "d", "t": "B only"}], "ans": "a"}, {"n": 109, "p": 19, "stem": "A private entity which enters into an agreement with a public school to provide assistance (Adopting Private Entity) shall be entitled to which of the following tax exemptions and incentives? A. Deduction from gross income of the amount of contribution/donation actually, directly and exclusively incurred for the program, subject to Section 34(H), plus an additional amount equivalent to fifty percent (50%) of such contribution/donation. B. Exemption from donor's tax. (RR No. 13-2025)", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "Neither A nor B"}, {"l": "c", "t": "A only"}, {"l": "d", "t": "B only"}], "ans": "a"}, {"n": 110, "p": 19, "stem": "Which of the following exemptions/incentives are granted to Technical-Vocational Institutions (TVIs) implementing a registered Enterprise-Based Education and Training (EBET) Framework? A. Additional deduction from taxable income equivalent to 50% of actual training expenses from the effectivity of RA No. 12063 up to December 31, 2027. B. Exemption from donor's tax and allowance as deduction from gross income of the donor of the donations, contributions, bequests, subsidies, or financial aid actually paid or made to a TVI implementing theoretical instructions for EBET Programs within the taxable year. (RR No. 13-2025)", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "Neither A nor B"}, {"l": "c", "t": "A only"}, {"l": "d", "t": "B only"}], "ans": "a"}, {"n": 111, "p": 19, "stem": "A Retirement Plan duly approved by the BIR and issued a certificate of tax qualification (\"Tax Qualified Plan\") is entitled to which of the following tax incentives? A. Exemption from income tax and withholding tax of the retirement benefits received by officials and employees of private firms. B. Exemption from income tax and withholding tax of the trust income from investments made by the trustees of an employee's trust under Section 60(B). C. Tax deductibility of the contributions made by employers from its gross income pursuant to Section 34(J). (RR No. 15-2025)", "opts": [{"l": "a", "t": "A, B and C"}, {"l": "b", "t": "A and B only"}, {"l": "c", "t": "A and C only"}, {"l": "d", "t": "A only"}], "ans": "a"}]}, {"id": "t4", "title": "Topic 4: Transfer Taxes", "shortTitle": "4. Transfer Taxes", "itemRange": "Items 112 to 124", "concepts": "<h3>Nature and Compliance</h3>\n<p><strong>Nature:</strong> transfer taxes (estate and donor's) are imposed on the gratuitous transfer of property. Estate tax takes effect at death; donor's tax during the lifetime of the transferor.</p>\n\n<p><strong>Estate tax compliance (TRAIN):</strong> notice of death is no longer required. An estate tax return is required when the estate is subject to tax or when it includes registered or registrable property regardless of value. A CPA-certified statement is required only when the gross estate exceeds P5,000,000 (item 112: at exactly P5,000,000, only the return is required).</p>\n\n<p><strong>Gross estate of a citizen or resident:</strong> all property wherever situated, including the house in Texas, foreign and local bank deposits, and local shares. Property already registered in the name of another person (son's car) is excluded. Life insurance proceeds are included when the beneficiary is the estate, executor or administrator regardless of revocability, or when a third-party beneficiary is designated revocably. Proceeds are excluded only when a third party is irrevocably designated.</p>\n\n<h3>Estate computation (items 113 to 114, conjugal partnership of gains)</h3>\n<table class=\"notes-table\">\n<thead><tr><th>Item</th><th>Exclusive</th><th>Common</th><th>Total</th></tr></thead>\n<tbody>\n<tr><td>Gross estate</td><td>P15,000,000</td><td>P6,000,000</td><td>P21,000,000</td></tr>\n<tr><td>Less ordinary deductions</td><td>(2,000,000)</td><td>(2,000,000)</td><td>(4,000,000)</td></tr>\n<tr><td>Net estate before special deductions</td><td>13,000,000</td><td>4,000,000</td><td>17,000,000</td></tr>\n<tr><td>Family home</td><td></td><td></td><td>(5,200,000)</td></tr>\n<tr><td>Standard deduction</td><td></td><td></td><td>(5,000,000)</td></tr>\n<tr><td>Net estate after special deductions</td><td></td><td></td><td>6,800,000</td></tr>\n<tr><td>Share of surviving spouse (1/2 x 4,000,000)</td><td></td><td></td><td>(2,000,000)</td></tr>\n<tr><td><strong>Net taxable estate</strong></td><td></td><td></td><td><strong>4,800,000</strong></td></tr>\n<tr><td><strong>Estate tax at 6%</strong></td><td></td><td></td><td><strong>288,000</strong></td></tr>\n</tbody>\n</table>\n\n<p><strong>Working notes:</strong> inherited real property P10,000,000 is exclusive; the P200,000 land given inter vivos to the son stays in the gross estate as a transfer in contemplation of death. Common personal property P6,000,000 is conjugal even if the car is for the exclusive use of the wife. Gifts received by the wife (P5,000,000) are her exclusive property and are excluded; the exclusive family home P5,200,000 is included in exclusive property (P10M + P5.2M = P15.2M, less P200,000 under the handout's solution, giving P15,000,000). Funeral, judicial and medical expenses are no longer deductible under TRAIN, so common deductions are P2,600,000 less P600,000 = P2,000,000; the P500,000 mortgage on the wife's exclusive gift is not a deduction of the decedent, so exclusive deductions are P2,500,000 less P500,000 = P2,000,000. Family home deduction is the lower of FMV or P10,000,000 (here the full P5,200,000). Standard deduction is P5,000,000 for citizens and residents (P500,000 for NRAs). The surviving spouse share is one-half of the net conjugal estate after ordinary conjugal deductions. Estate tax is a flat 6%.</p>\n\n<p><strong>Estate tax amnesty notes:</strong> 6% on each decedent's net taxable estate at death, for decedents who died on or before December 31, 2017 (later extended by RA 11956 to deaths on or before May 31, 2022), availment extended until June 2025, minimum amnesty tax P5,000.</p>\n\n<p><strong>Claims against the estate, requisites:</strong> personal obligation of the deceased existing at death; contracted in good faith for adequate consideration; valid and enforceable in court; not condoned and not prescribed; debt instrument duly notarized; if contracted within 3 years before death, a statement of disposition of the loan proceeds is submitted. <em>Claims against insolvent persons:</em> included in the gross estate, deducted to the extent uncollectible, no prior court case needed, and notarization is not a requisite (notarization applies to claims against the estate).</p>\n\n<p><strong>Donor's tax rules:</strong> 6% on total net gifts in excess of P250,000 per calendar year, cumulative within the year, with prior gifts in the same year added back and prior tax paid credited. Real property is valued at the higher of zonal value or assessed value (cost and adjacent lot values are irrelevant). Encumbrances assumed by the donee (mortgage, unpaid realty tax) are deducted; donor's tax assumed by the donee is not deducted. A diminution the donor imposes (10% of the cash gift to the church) reduces the net gift. Dowry exemption is already removed under TRAIN. A sale in the ordinary course of business, bona fide, at arm's length and without donative intent is treated as made for adequate consideration even if below FMV (item 120). A sale of real property subject to CGT below FMV is likewise not a deemed gift.</p>\n\n<p><strong>Donor's tax computation (items 115 to 116):</strong> March 15 gifts P800,000 (P500,000 zonal to sister + P300,000 cash to brother) less diminution P30,000 = P770,000; add prior net gift January 15 (P1,000,000 - P200,000 - P10,000 = P790,000); total net gifts P1,560,000; less exempt P250,000 = P1,310,000 subject to tax; tax due P78,600; less tax paid on prior gift (P790,000 - P250,000) x 6% = P32,400; tax payable P46,200.</p>\n\n<p><em>Item 124:</em> the September 20, 2022 gift stands alone because the 2021 gifts belong to a different calendar year: (P600,000 - P250,000) x 6% = P21,000.</p>\n\n<p><strong>Situs of donation:</strong> a non-resident alien is taxed only on property located in the Philippines. A check sent from Canada by a Canadian resident is a donation made outside the Philippines, so it is not subject to Philippine donor's tax (item 122). Intangibles of an NRA located in the Philippines are taxable subject to reciprocity.</p>", "items": [{"n": 112, "p": 23, "stem": "The gross estate of a decedent consists of registered and registrable properties valued at P5,000,000. Which of the following statements is/are correct? I. The estate is required to submit notice of death. II. The estate is required to file an estate tax return. III. The estate is required to submit a statement certified by a CPA.", "opts": [{"l": "a", "t": "Statements I, II and III"}, {"l": "b", "t": "Statements II and III"}, {"l": "c", "t": "Statement II"}, {"l": "d", "t": "None of the statements"}], "ans": "c"}, {"n": 113, "p": 23, "ctx": "The decedent is a married man with a surviving spouse (conjugal partnership of gains) who died on February 1, 2021. Real properties received by decedent as inheritance during the marriage (including land valued at P200,000 transferred inter vivos by decedent to a son) P10,000,000; personal properties acquired during the marriage using common fund (including a car valued at P1,800,000 acquired for the exclusive use of the surviving spouse) P6,000,000; personal properties received as gift by the surviving spouse during the marriage P5,000,000; exclusive family home P5,200,000; conjugal deductions claimed (including funeral expenses P200,000, judicial expenses P300,000 and medical expenses P100,000) P2,600,000; exclusive deductions claimed (including unpaid mortgage of P500,000 on the personal properties received as gift by the surviving spouse) P2,500,000.", "stem": "What amount shall be reflected as net taxable estate?", "opts": [{"l": "a", "t": "P10,900,000"}, {"l": "b", "t": "P8,800,000"}, {"l": "c", "t": "P6,800,000"}, {"l": "d", "t": "P4,800,000"}], "ans": "d"}, {"n": 114, "p": 23, "ctx": "The decedent is a married man with a surviving spouse (conjugal partnership of gains) who died on February 1, 2021. Real properties received by decedent as inheritance during the marriage (including land valued at P200,000 transferred inter vivos by decedent to a son) P10,000,000; personal properties acquired during the marriage using common fund (including a car valued at P1,800,000 acquired for the exclusive use of the surviving spouse) P6,000,000; personal properties received as gift by the surviving spouse during the marriage P5,000,000; exclusive family home P5,200,000; conjugal deductions claimed (including funeral expenses P200,000, judicial expenses P300,000 and medical expenses P100,000) P2,600,000; exclusive deductions claimed (including unpaid mortgage of P500,000 on the personal properties received as gift by the surviving spouse) P2,500,000.", "stem": "What amount shall be reflected as estate tax due?", "opts": [{"l": "a", "t": "P654,000"}, {"l": "b", "t": "P528,000"}, {"l": "c", "t": "P408,000"}, {"l": "d", "t": "P288,000"}], "ans": "d"}, {"n": 115, "p": 23, "ctx": "On January 15, 2022, Daisy gave a piece of land to her brother-in-law who is getting married on February 14, 2022. The assessed value and zonal value of the land were P750,000 and P1,000,000 respectively. It was acquired by Daisy at a cost of P1,500,000 in 2018. An adjacent lot was valued at P2,000,000. The land had an unpaid mortgage of P200,000 assumed by the donee and an unpaid realty tax of P10,000 also assumed by the donee. The donor and donee agreed that the donee will assume the donor's tax of P33,000. On March 15, 2022, Daisy donated other properties to her sister and brother. Gift to sister had a zonal value of P500,000 and an assessed value of P300,000. Gift to brother was cash P300,000 of which she specially provided that 10% should be given to the church where Daisy was a member.", "stem": "What amount shall be shown as total net gift subject to tax?", "opts": [{"l": "a", "t": "P1,590,000"}, {"l": "b", "t": "P1,560,000"}, {"l": "c", "t": "P1,310,000"}, {"l": "d", "t": "None"}], "ans": "c"}, {"n": 116, "p": 23, "ctx": "On January 15, 2022, Daisy gave a piece of land to her brother-in-law who is getting married on February 14, 2022. The assessed value and zonal value of the land were P750,000 and P1,000,000 respectively. It was acquired by Daisy at a cost of P1,500,000 in 2018. An adjacent lot was valued at P2,000,000. The land had an unpaid mortgage of P200,000 assumed by the donee and an unpaid realty tax of P10,000 also assumed by the donee. The donor and donee agreed that the donee will assume the donor's tax of P33,000. On March 15, 2022, Daisy donated other properties to her sister and brother. Gift to sister had a zonal value of P500,000 and an assessed value of P300,000. Gift to brother was cash P300,000 of which she specially provided that 10% should be given to the church where Daisy was a member.", "stem": "What amount shall be shown as tax payable?", "opts": [{"l": "a", "t": "P95,400"}, {"l": "b", "t": "P93,600"}, {"l": "c", "t": "P78,600"}, {"l": "d", "t": "P46,200"}], "ans": "d"}, {"n": 117, "p": 23, "stem": "Mr. Julian Cruz procured a life insurance upon his own life. He designated his estate's executor as an irrevocable beneficiary. For estate tax purposes, the proceeds of life insurance are:", "opts": [{"l": "a", "t": "included in the gross estate because when the executor of the estate is a beneficiary the proceeds are included in the gross estate regardless of the designation."}, {"l": "b", "t": "not included in the gross estate because the designation of the beneficiary is irrevocable."}, {"l": "c", "t": "included in the gross estate because proceeds of life insurance are always subject to estate tax."}, {"l": "d", "t": "not included in the gross estate because, as a rule, proceeds of life insurance are generally not subject to estate tax."}], "ans": "a"}, {"n": 118, "p": 24, "stem": "The following are the requisites in order for claims against the decedent's estate to be deductible, except which one?", "opts": [{"l": "a", "t": "They must be existing against the estate."}, {"l": "b", "t": "They must be reasonably certain as to amount."}, {"l": "c", "t": "They must have been prescribed."}, {"l": "d", "t": "They must be enforced by the claimant."}], "ans": "c"}, {"n": 119, "p": 24, "stem": "Which of the following statements is incorrect? A claim against an insolvent person, which is not collectible in full:", "opts": [{"l": "a", "t": "is included in the gross estate."}, {"l": "b", "t": "is not included in the taxable net estate."}, {"l": "c", "t": "must be notarized if arising out of a debt instrument of the insolvent."}, {"l": "d", "t": "needs no preliminary filing of a case against the insolvent."}], "ans": "c"}, {"n": 120, "p": 24, "stem": "Kenneth sold a residential lot for P1,500,000. The fair market value of the residential lot at the time of sale was P2,000,000. The sale was made in the ordinary course of business, a bona fide transaction, at arm's length, and free from any donative intent. How much was the donor's tax due?", "opts": [{"l": "a", "t": "P120,000"}, {"l": "b", "t": "P90,000"}, {"l": "c", "t": "P30,000"}, {"l": "d", "t": "None, not subject to donor's tax."}], "ans": "d"}, {"n": 121, "p": 24, "stem": "The common characteristic of transfer taxes is that the transfer of property:", "opts": [{"l": "a", "t": "is onerous."}, {"l": "b", "t": "takes effect during the lifetime of the transferor."}, {"l": "c", "t": "takes effect upon the death of the transferor."}, {"l": "d", "t": "is gratuitous."}], "ans": "d"}, {"n": 122, "p": 24, "stem": "Mr. Bill Morgan, a Canadian citizen and a resident of Scarborough, Ontario, sends a gift check of $20,000 to his future daughter-in-law who is to be married to his only son in the Philippines. Is the donation subject to Philippine donor's tax?", "opts": [{"l": "a", "t": "Yes, but only up to the extent that exceeds the allowable P250,000 exemption for donations."}, {"l": "b", "t": "Yes. There is no showing in the problem that the marriage actually took place within one (1) year from the date of the donation."}, {"l": "c", "t": "No. The donor is a non-resident alien hence he is not subject to the Philippine donor's tax law."}, {"l": "d", "t": "No. The donation took place outside the Philippines hence not subject to the Philippine donor's tax law."}], "ans": "d"}, {"n": 123, "p": 24, "stem": "Mr. Nat Tigok, Filipino citizen, died abroad leaving the following properties: house and lot in Texas, USA; shares of stock in San Miguel Corporation and PHILEX, both local companies; bank deposits in New York City and in the Bank of the Philippine Islands in Makati; a Toyota Camry sedan registered in the name of his son aged 21 years. He was buried in Manila and expenses were incurred to bring the remains home and for his funeral. Which among the above properties should be excluded from his estate tax return?", "opts": [{"l": "a", "t": "The house and lot in Texas, USA"}, {"l": "b", "t": "The shares of stock in San Miguel Corporation"}, {"l": "c", "t": "The bank deposits in New York City"}, {"l": "d", "t": "The Toyota Camry sedan"}], "ans": "d"}, {"n": 124, "p": 24, "stem": "The following donations are made to relatives and strangers: January 30, 2021 P2,000,000; March 30, 2021 P1,000,000; August 15, 2021 P500,000; September 20, 2022 P600,000. How much is the donor's tax payable on the gift made on September 20, 2022?", "opts": [{"l": "a", "t": "P36,000"}, {"l": "b", "t": "P30,000"}, {"l": "c", "t": "P21,000"}, {"l": "d", "t": "P20,000"}], "ans": "c"}]}, {"id": "t5", "title": "Topic 5: Business Taxes", "shortTitle": "5. Business Taxes", "itemRange": "Items 125 to 166", "concepts": "<h3>EOPT invoicing rules</h3>\n<p>The <strong>VAT invoice</strong> is the sole document for both goods and services (official receipts are no longer the VAT evidence). An invoice is required for transactions of P500 or more. For sales of P1,000 or more to a VAT-registered buyer, the buyer's name, address and TIN are shown; <em>business style is no longer required</em>. Gross sales is the VAT base for both goods and services (accrual basis for services). Output VAT credit on uncollected receivables may be claimed once the payment deadline has lapsed, and is reversed on later collection.</p>\n\n<h3>VAT threshold and registration</h3>\n<p><strong>P3,000,000</strong> of VAT-subject sales. Count only VAT-subject sales: <em>item 156</em> basis is grocery P2,000,000 plus sales to ADB P1,500,000 (zero-rated but VAT-subject) = P3,500,000; jeepney receipts (percentage tax) and agricultural products in original state (exempt) are excluded. <em>Item 130:</em> commercial rent of P3,000,000 does not exceed the threshold; residential rent of P15,000 or below per unit per month is exempt regardless of aggregate. A non-VAT taxpayer who breaches P3,000,000 mid-year pays 3% percentage tax (1% from July 1, 2020 to June 30, 2023 under CREATE) on sales up to the breach and 12% VAT after: <em>items 131 and 132</em> show 1% on the first three quarters (P30,000) and 12% on the fourth quarter (P120,000). A taxpayer under the 8% option who breaches the threshold pays percentage tax on the first P3,000,000 without penalty if paid on time the following month (item 142).</p>\n\n<h3>Zero-rated vs. exempt</h3>\n<p><strong>Zero-rated sales</strong> (export sales by a VAT person, sales to PEZA or RBEs for registered activities, sales to entities like ADB or Ramon Magsaysay Awards Foundation under special laws) are taxable at 0% with input VAT creditable or refundable. An export sale by a non-VAT person is exempt, with no input VAT credit. <em>Export-oriented enterprise:</em> export sales exceed 70% of annual production. Excess input VAT at the end of a quarter is carried over as a tax credit to succeeding quarters; refund is available only for zero-rated sales, cancellation of registration, or unused input VAT on capital goods.</p>\n\n<p><strong>Allocation of input VAT (items 157 to 159):</strong> total sales on the return are all sales (P10,000,000); VAT-subject sales are regular plus zero-rated (P7,500,000). Output VAT P720,000 less directly attributable input VAT P400,000 less ratable portion of unallocated input VAT (P6,000,000 / P10,000,000 x P300,000 = P180,000) = P140,000 payable. Input VAT attributable to exempt sales is not credited (it is a cost or an income tax deduction).</p>\n\n<p><strong>VAT on importation:</strong> 12% of total landed cost (customs value plus duties and charges) plus excise tax, payable by the importer whether or not VAT-registered: (P5,000,000 + P1,000,000) x 12% = P720,000. Sale to an RBE for direct and exclusive use in its registered activity is zero-rated.</p>\n\n<p><strong>VAT-exempt items to recall:</strong> milling of palay into rice, corn into grits, sugarcane into raw sugar (not wheat into flour); agricultural products in original state; residential lease of P15,000 or less per unit per month; educational services of accredited institutions, including online courses, and sale of online subscriptions to DepEd, CHED, TESDA and recognized schools; services of banks and non-bank intermediaries through digital platforms, including BSP-registered VASPs classified as NBFIs; indigenous natural gas, aggregated gas (to the extent of the indigenous gas content) and power generated from it (RR 2-2026). A VAT-exempt person who issues a VAT invoice becomes liable for the percentage tax, the VAT, and a 50% surcharge, and the buyer may claim input VAT if the invoice carries the required information.</p>\n\n<p><strong>Digital services (RR 3-2025):</strong> a digital service is supplied over the internet or electronic network and essentially automated; 12% VAT on gross sales of DSPs; services of a nonresident DSP are deemed consumed in the Philippines when the buyer is located here.</p>\n\n<h3>Percentage taxes to memorize</h3>\n<table class=\"notes-table\">\n<thead><tr><th>Transaction</th><th>Rate and base</th></tr></thead>\n<tbody>\n<tr><td>Sec. 116, VAT-exempt persons below threshold</td><td>3% of gross sales (1% July 1, 2020 to June 30, 2023)</td></tr>\n<tr><td>Domestic common carriers by land, passengers (jeepney, bus, taxi, car rental, school bus)</td><td>3% of gross receipts; transport of goods and cargo is VAT or Sec. 116, never carrier's tax</td></tr>\n<tr><td>International carriers (air or sea)</td><td>3% on cargo and mail from the Philippines; passengers are VAT zero-rated under the Tax Code (exempt by RA 10378)</td></tr>\n<tr><td>Franchise: radio/TV with prior-year receipts not over P10M</td><td>3% (may opt for VAT; once VAT-registered, all receipts are subject to 12% VAT, as in item 140)</td></tr>\n<tr><td>Franchise: gas and water utilities</td><td>2% (Maynilad and Manila Water VAT scrapped effective March 21, 2022)</td></tr>\n<tr><td>Overseas communications tax</td><td>10% of payments for overseas calls from the Philippines, paid by the user, collected by the owner of the facility, remitted within 20 days after the end of the quarter (April 20 for Q1)</td></tr>\n<tr><td>Banks, lease of property</td><td>7% gross receipts tax (5% applies to interest income with maturity of 5 years or less)</td></tr>\n<tr><td>Life insurance premiums</td><td>2% premiums tax; income that can be earned independently of the insurance business is subject to VAT or Sec. 116</td></tr>\n<tr><td>Amusement tax: nightclubs, cabarets, videoke bars</td><td>18% of gross receipts</td></tr>\n<tr><td>Amusement tax: boxing exhibitions</td><td>10% of gross receipts; exempt if a world or oriental championship, both contenders are Filipino citizens, and the promoter is a Filipino citizen or a corporation at least 60% Filipino-owned</td></tr>\n<tr><td>Tax on winnings</td><td>10% of winnings (4% on double, forecast, quinella and trifecta); remitted within 20 days from withholding</td></tr>\n<tr><td>Stock transaction tax</td><td>1/10 of 1% of gross selling price under RR 20-2025 (CMEPA reduced the 6/10 of 1% rate) for listed shares traded through a local or foreign exchange, in lieu of CGT</td></tr>\n</tbody>\n</table>\n\n<p><strong>Amusement tax</strong> is on gross receipts, so a net loss is irrelevant (item 150). Percentage tax returns (BIR Form 2551Q) are filed within 25 days after the end of the quarter (April 25, 2022 for Q1 2022). The overseas communications tax is paid by the person who uses the facility and collected by the telephone company; the company itself is liable for VAT on domestic calls (item 147 answer: no to both as worded).</p>\n\n<p><strong>8% option for mixed-income earners with percentage taxes:</strong> a common carrier of passengers is subject to the 3% carrier's tax (not Sec. 116) and therefore cannot avail of the 8% option (item 136). Had the 8% option been available, it would be in lieu of the Sec. 116 tax (item 137).</p>", "items": [{"n": 125, "p": 27, "stem": "Under EOPT, in the case of sales in the amount of P1,000 or more where the sale or transfer is made to a VAT-registered person, which information pertaining to the purchaser, customer or client is no longer required to be shown?", "opts": [{"l": "a", "t": "the name"}, {"l": "b", "t": "business style"}, {"l": "c", "t": "address"}, {"l": "d", "t": "Taxpayer Identification Number (TIN)"}], "ans": "b"}, {"n": 126, "p": 27, "stem": "Under EOPT, a VAT-registered person shall issue for every sale, barter, exchange, or lease of goods or properties, and for every sale, barter or exchange of services:", "opts": [{"l": "a", "t": "VAT invoice"}, {"l": "b", "t": "VAT official receipt"}, {"l": "c", "t": "either a or b"}, {"l": "d", "t": "neither a nor b"}], "ans": "a"}, {"n": 127, "p": 27, "stem": "In order for output VAT credit to be claimed:", "opts": [{"l": "a", "t": "The deadline for the payment of the receivable must have lapsed."}, {"l": "b", "t": "The deadline for the payment of the receivable must have lapsed for 30 days."}, {"l": "c", "t": "The receivable must have been actually ascertained to be worthless and uncollectible."}, {"l": "d", "t": "The receivable must be collectible from a debtor who is declared insolvent."}], "ans": "a"}, {"n": 128, "p": 27, "stem": "Gross sales is the appropriate VAT base for: A. Sale of services. B. Sale of goods.", "opts": [{"l": "a", "t": "Both A and B"}, {"l": "b", "t": "Neither A nor B"}, {"l": "c", "t": "A only"}, {"l": "d", "t": "B only"}], "ans": "a"}, {"n": 129, "p": 27, "stem": "Which of the following milling jobs shall not be exempt from VAT?", "opts": [{"l": "a", "t": "palay into rice"}, {"l": "b", "t": "corn into corn grits"}, {"l": "c", "t": "wheat into flour"}, {"l": "d", "t": "sugarcane into raw sugar"}], "ans": "c"}, {"n": 130, "p": 27, "stem": "A lessor, not VAT-registered, rents his 5 commercial and 20 residential units for monthly rent of P50,000 and P15,000 per unit, respectively. His accumulated gross receipts during the taxable year: rent from 5 commercial units P3,000,000; rent from 20 residential units P3,600,000; aggregate gross receipts P6,500,000. What will be the business tax consequences?", "opts": [{"l": "a", "t": "Both will be subject to VAT because the aggregate gross receipts exceed the VAT threshold."}, {"l": "b", "t": "Both will be exempt from VAT because rent from commercial units did not exceed the VAT threshold and rent from residential units shall be exempt regardless of the gross annual receipts."}, {"l": "c", "t": "Only the rent from commercial units shall be subject to VAT."}, {"l": "d", "t": "Only the rent from residential units shall be subject to VAT because it exceeded the VAT threshold."}], "ans": "b"}, {"n": 131, "p": 27, "ctx": "A taxpayer is engaged in VAT-subject transactions but his annual gross sales do not exceed the VAT threshold. Hence, he did not register under the VAT system. However, during 2022, his quarterly gross sales were P1,000,000 for each of the first, second, third and fourth quarters.", "stem": "How much is the total percentage tax due for the first three (3) quarters?", "opts": [{"l": "a", "t": "P480,000"}, {"l": "b", "t": "P120,000"}, {"l": "c", "t": "P90,000"}, {"l": "d", "t": "P30,000"}], "ans": "d"}, {"n": 132, "p": 27, "ctx": "A taxpayer is engaged in VAT-subject transactions but his annual gross sales do not exceed the VAT threshold. Hence, he did not register under the VAT system. However, during 2022, his quarterly gross sales were P1,000,000 for each of the first, second, third and fourth quarters.", "stem": "How much is the VAT due?", "opts": [{"l": "a", "t": "P480,000"}, {"l": "b", "t": "P120,000"}, {"l": "c", "t": "P90,000"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 133, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "How much is the common carrier's tax?", "opts": [{"l": "a", "t": "P105,000"}, {"l": "b", "t": "P70,000"}, {"l": "c", "t": "P35,000"}, {"l": "d", "t": "None"}], "ans": "a"}, {"n": 134, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "How much is the output VAT?", "opts": [{"l": "a", "t": "P180,000"}, {"l": "b", "t": "P120,000"}, {"l": "c", "t": "P60,000"}, {"l": "d", "t": "Exempt from VAT"}], "ans": "d"}, {"n": 135, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "How much is the percentage tax under Sec. 116?", "opts": [{"l": "a", "t": "P21,000"}, {"l": "b", "t": "P14,000"}, {"l": "c", "t": "P7,000"}, {"l": "d", "t": "None"}], "ans": "c"}, {"n": 136, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "Can the taxpayer avail of the 8% income tax rate?", "opts": [{"l": "a", "t": "Yes. Because his total gross receipts do not exceed the VAT threshold as long as he signifies his intention when he files his first quarter return."}, {"l": "b", "t": "No. Because he is VAT-registered and therefore not qualified to avail of the 8% income tax rate."}, {"l": "c", "t": "Yes. Because taxpayers with various businesses are qualified as long as he signifies his intention when he files his first quarter return."}, {"l": "d", "t": "No. Taxpayers who are subject to Other Percentage Taxes, except those under Section 116, are not qualified to avail of the 8% income tax option."}], "ans": "d"}, {"n": 137, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "If the taxpayer avails of the 8% tax on his gross receipts, how much is the percentage tax under Sec. 116 due and payable for the quarter?", "opts": [{"l": "a", "t": "P21,000"}, {"l": "b", "t": "P14,000"}, {"l": "c", "t": "P7,000"}, {"l": "d", "t": "None"}], "ans": "d"}, {"n": 138, "p": 28, "ctx": "An operator of a domestic common carrier by land, not VAT-registered, presented the following data for the first calendar quarter of 2022. His VAT-subject gross receipts do not exceed the VAT threshold in any given year. Gross receipts, transport of passengers by land P3,500,000; transport of goods P500,000; transport of cargoes P200,000; cost of services, transport of passengers P800,000; cost of services, transport of goods and cargoes P300,000; operating expenses, transport of passengers P100,000; operating expenses, transport of goods and cargoes P50,000.", "stem": "When shall the Percentage Tax Return be filed?", "opts": [{"l": "a", "t": "April 25, 2022"}, {"l": "b", "t": "April 24, 2022"}, {"l": "c", "t": "April 21, 2022"}, {"l": "d", "t": "April 20, 2022"}], "ans": "a"}, {"n": 139, "p": 28, "ctx": "ABS-GMA, VAT-registered, is a radio-TV broadcasting franchise grantee. The previous year, its gross receipts did not exceed P10,000,000. In the first quarter of 2022: gross receipts, sale of airtime P2,000,000; payments received from users of the radio station's communications facilities for overseas communications P500,000; rentals of office spaces P3,500,000; business expenses P700,000.", "stem": "How much was the overseas communications tax?", "opts": [{"l": "a", "t": "P250,000"}, {"l": "b", "t": "P200,000"}, {"l": "c", "t": "P75,000"}, {"l": "d", "t": "P50,000"}], "ans": "d"}, {"n": 140, "p": 28, "ctx": "ABS-GMA, VAT-registered, is a radio-TV broadcasting franchise grantee. The previous year, its gross receipts did not exceed P10,000,000. In the first quarter of 2022: gross receipts, sale of airtime P2,000,000; payments received from users of the radio station's communications facilities for overseas communications P500,000; rentals of office spaces P3,500,000; business expenses P700,000.", "stem": "How much is output VAT, if any?", "opts": [{"l": "a", "t": "P720,000"}, {"l": "b", "t": "P660,000"}, {"l": "c", "t": "P420,000"}, {"l": "d", "t": "None"}], "ans": "b"}, {"n": 141, "p": 29, "stem": "When shall the overseas communications tax be paid?", "opts": [{"l": "a", "t": "April 25, 2022"}, {"l": "b", "t": "April 20, 2022"}, {"l": "c", "t": "April 15, 2022"}, {"l": "d", "t": "Not applicable"}], "ans": "b"}, {"n": 142, "p": 29, "stem": "A non-VAT registered taxpayer who initially opted to avail of the 8% option but has exceeded the VAT threshold during the taxable year shall be subject to: I. 3% percentage tax on the first P3,000,000 under Section 116. II. Without imposition of any penalty if payment is timely made on the following month when the threshold is breached.", "opts": [{"l": "a", "t": "I and II are correct"}, {"l": "b", "t": "Only I is correct"}, {"l": "c", "t": "Only II is correct"}, {"l": "d", "t": "Both I and II are incorrect"}], "ans": "a"}, {"n": 143, "p": 29, "stem": "Which of the following statements is incorrect?", "opts": [{"l": "a", "t": "A zero-rated sale of goods or properties (by a VAT-registered person) is a taxable transaction for VAT purposes, but shall not result in any output tax."}, {"l": "b", "t": "The input tax on purchases of goods, properties or services, related to zero-rated sales, shall be available as tax credit only in accordance with the Regulations."}, {"l": "c", "t": "The input tax on purchases of goods, properties or services, related to such zero-rated sale, shall be available as tax credit or refund in accordance with the Regulations."}, {"l": "d", "t": "Any enterprise whose export sales exceed 70% of the total annual production of the preceding taxable year shall be considered an export-oriented enterprise."}], "ans": "b"}, {"n": 144, "p": 29, "stem": "Which one of the following is VAT-exempt?", "opts": [{"l": "a", "t": "Export sale by a non-VAT person"}, {"l": "b", "t": "Foreign currency denominated sale"}, {"l": "c", "t": "Sale of services to entities duly registered with PEZA"}, {"l": "d", "t": "Sale of services to Ramon Magsaysay Awards Foundation"}], "ans": "a"}, {"n": 145, "p": 29, "stem": "Mr. Juan Cruz, VAT-exempt, issued a VAT invoice to Mr. S. Santos, VAT-registered trader. As a consequence: A. Mr. Juan Cruz would be liable to percentage tax, VAT, and a surcharge of 50%. B. Mr. S. Santos can claim input tax on his purchase provided the requisite information required under the Regulations is shown on the invoice or receipt.", "opts": [{"l": "a", "t": "Both A and B are correct"}, {"l": "b", "t": "Both A and B are incorrect"}, {"l": "c", "t": "Only A is correct"}, {"l": "d", "t": "Only B is correct"}], "ans": "a"}, {"n": 146, "p": 29, "stem": "International carriers doing business in the Philippines are subject to the:", "opts": [{"l": "a", "t": "3% percentage tax on gross receipts derived from the transport of cargo and/or mail from the Philippines to another country."}, {"l": "b", "t": "3% percentage tax on gross receipts derived from the transport of cargo, mail and passengers from the Philippines to another country."}, {"l": "c", "t": "12% value-added tax on their gross receipts derived from the transport of cargo from the Philippines to another country."}, {"l": "d", "t": "0% value-added tax on their gross receipts derived from the transport of cargo and passengers from the Philippines to another country."}], "ans": "a"}, {"n": 147, "p": 29, "stem": "A VAT-registered telephone company provides services for domestic and overseas calls. What business taxes are due from the services offered? I. Value-added tax for domestic calls of which the taxpayer is the person using the communications facilities. II. Overseas communications tax for overseas calls originating from the Philippines of which the taxpayer is the owner of the communications facilities.", "opts": [{"l": "a", "t": "Yes to I and II"}, {"l": "b", "t": "No to I and II"}, {"l": "c", "t": "Yes to I only"}, {"l": "d", "t": "Yes to II only"}], "ans": "b"}, {"n": 148, "p": 29, "stem": "The lease of property, real or personal, by a bank is subject to:", "opts": [{"l": "a", "t": "5% gross receipts tax."}, {"l": "b", "t": "7% gross receipts tax."}, {"l": "c", "t": "12% VAT."}, {"l": "d", "t": "none of the choices."}], "ans": "b"}, {"n": 149, "p": 30, "stem": "Which of the following items is subject to VAT or percentage tax under Sec. 116 when received by a person engaged in life insurance business?", "opts": [{"l": "a", "t": "Investment income realized from the investment of funds obtained from others allowed and approved by the Insurance Commission"}, {"l": "b", "t": "Premium on Health and Accident Insurance"}, {"l": "c", "t": "Re-issuance fees, reinstatement fees, renewal fees as well as penalties paid to the life insurance company which are incidental to or in connection with the insurance policy contracts issued"}, {"l": "d", "t": "Other income earned which can be pursued independently of the insurance business activities"}], "ans": "d"}, {"n": 150, "p": 30, "stem": "A boxing exhibition featuring two (2) Filipino boxers in a Philippine championship is held in a stadium in Pasig. It is promoted by a domestic corporation at least 60% of the stock of which is owned by Filipinos. Gross receipts P5,000,000; cost of services P3,000,000; gross income P2,000,000; expenses P2,500,000; net loss P500,000. How much is the amusement tax?", "opts": [{"l": "a", "t": "None, because the boxing exhibition resulted in a loss."}, {"l": "b", "t": "None, because the boxing exhibition is exempt from the tax."}, {"l": "c", "t": "P500,000"}, {"l": "d", "t": "P200,000"}], "ans": "c"}, {"n": 151, "p": 30, "stem": "Using the same data in the preceding number and assuming it is a world championship, how much is the amusement tax?", "opts": [{"l": "a", "t": "None, because the boxing exhibition resulted in a loss."}, {"l": "b", "t": "None, because the boxing exhibition is exempt from the tax."}, {"l": "c", "t": "P500,000"}, {"l": "d", "t": "P200,000"}], "ans": "b"}, {"n": 152, "p": 30, "stem": "Tax on winnings shall be withheld by the operator, manager or person in charge of the horse races before paying the dividends or prizes and shall be remitted to the BIR within how many days from the date the tax was deducted and withheld?", "opts": [{"l": "a", "t": "30 days"}, {"l": "b", "t": "25 days"}, {"l": "c", "t": "20 days"}, {"l": "d", "t": "15 days"}], "ans": "c"}, {"n": 153, "p": 30, "stem": "IAN Importers, not VAT-registered, imported articles whose customs duties were based on their volume. Total landed cost was determined to be P5,000,000 and excise taxes on the importation amounted to P1,000,000. It eventually sold these articles to a Registered Business Enterprise (RBE), and the RBE used them directly and exclusively in its registered activity. How much is the VAT payable on the importation?", "opts": [{"l": "a", "t": "P960,000"}, {"l": "b", "t": "P720,000"}, {"l": "c", "t": "P800,000"}, {"l": "d", "t": "None, importer is not VAT-registered"}], "ans": "b"}, {"n": 154, "p": 30, "stem": "Using the same data in the preceding number, how much is the VAT on sale to an RBE?", "opts": [{"l": "a", "t": "P960,000"}, {"l": "b", "t": "P720,000"}, {"l": "c", "t": "P800,000"}, {"l": "d", "t": "Zero, sale to RBE is zero-rated"}], "ans": "d"}, {"n": 155, "p": 30, "stem": "Where the input tax exceeds the output tax at the end of any quarter, the excess may be claimed as a:", "opts": [{"l": "a", "t": "tax refund in the succeeding quarter or quarters."}, {"l": "b", "t": "tax credit in the succeeding quarter or quarters."}, {"l": "c", "t": "either a or b."}, {"l": "d", "t": "neither a nor b."}], "ans": "b"}, {"n": 156, "p": 30, "stem": "The sales/receipts of GCC for the year are as follows: from grocery store P2,000,000; from sale of goods to Asian Development Bank P1,500,000; from passengers riding in a jeepney P500,000; from agricultural food products (original state) P600,000. Which of the statements is correct?", "opts": [{"l": "a", "t": "The basis for VAT registration is P4,600,000."}, {"l": "b", "t": "The basis for VAT registration is P3,500,000."}, {"l": "c", "t": "The basis for VAT registration is P3,100,000."}, {"l": "d", "t": "The basis for VAT registration is P3,000,000."}], "ans": "b"}, {"n": 157, "p": 31, "ctx": "A VAT-registered person for a taxable period: regular VAT-subject sales P6,000,000; VAT zero-rated sales P1,500,000; VAT-exempt sales P2,500,000; input tax on regular VAT-subject sales P400,000; input tax that cannot be allocated P300,000.", "stem": "How much shall be declared as total sales under line 19 (BIR Form 2550Q)?", "opts": [{"l": "a", "t": "P10,000,000"}, {"l": "b", "t": "P8,500,000"}, {"l": "c", "t": "P7,500,000"}, {"l": "d", "t": "P6,000,000"}], "ans": "a"}, {"n": 158, "p": 31, "ctx": "A VAT-registered person for a taxable period: regular VAT-subject sales P6,000,000; VAT zero-rated sales P1,500,000; VAT-exempt sales P2,500,000; input tax on regular VAT-subject sales P400,000; input tax that cannot be allocated P300,000.", "stem": "How much shall be the total VAT-subject sales?", "opts": [{"l": "a", "t": "P10,000,000"}, {"l": "b", "t": "P8,500,000"}, {"l": "c", "t": "P7,500,000"}, {"l": "d", "t": "P6,000,000"}], "ans": "c"}, {"n": 159, "p": 31, "ctx": "A VAT-registered person for a taxable period: regular VAT-subject sales P6,000,000; VAT zero-rated sales P1,500,000; VAT-exempt sales P2,500,000; input tax on regular VAT-subject sales P400,000; input tax that cannot be allocated P300,000.", "stem": "How much is the net VAT payable?", "opts": [{"l": "a", "t": "P420,000"}, {"l": "b", "t": "P320,000"}, {"l": "c", "t": "P140,000"}, {"l": "d", "t": "P20,000"}], "ans": "c"}, {"n": 160, "p": 31, "stem": "Which of the following transportation providers is not subject to the 3% percentage tax on domestic carriers?", "opts": [{"l": "a", "t": "School bus operators"}, {"l": "b", "t": "Cargo truck operators"}, {"l": "c", "t": "Passenger jeepney operators"}, {"l": "d", "t": "Car rental business"}], "ans": "b"}, {"n": 161, "p": 31, "stem": "Which of the following franchise grantees shall be subject to 2% percentage tax?", "opts": [{"l": "a", "t": "Radio/TV broadcasting"}, {"l": "b", "t": "Gas and water utilities"}, {"l": "c", "t": "PAGCOR and its licensees and franchisees"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 162, "p": 31, "stem": "It shall refer to any service that is supplied over the internet or other electronic network with the use of information technology and where the supply of the service is essentially automated.", "opts": [{"l": "a", "t": "Automated service"}, {"l": "b", "t": "Online service"}, {"l": "c", "t": "Internet service"}, {"l": "d", "t": "Digital service"}], "ans": "d"}, {"n": 163, "p": 31, "stem": "There shall be levied, assessed and collected on every sale, exchange, or other disposition of shares of stock and other securities listed and traded through a local and foreign stock exchange, other than sale by a dealer in securities, in lieu of capital gains tax, a tax of: (RR No. 20-2025)", "opts": [{"l": "a", "t": "1/10 of 1% of the gross selling price or gross value in money of the shares of stock/other securities sold, exchanged or disposed"}, {"l": "b", "t": "6/10 of 1% of the gross selling price or gross value in money of the shares of stock/other securities sold, exchanged or disposed"}, {"l": "c", "t": "50% of 1% of the gross selling price or gross value in money of the shares of stock/other securities sold, exchanged or disposed"}, {"l": "d", "t": "75% of 1% of the gross selling price or gross value in money of the shares of stock/other securities sold, exchanged or disposed"}], "ans": "a"}, {"n": 164, "p": 31, "stem": "Statement I: Generally, VAT shall be levied, assessed, and collected, equivalent to twelve percent (12%) of the gross sales derived by a Digital Service Provider (DSP) from its sale or exchange of services in the Philippines. Statement II: The phrase \"sale or exchange of services\" includes the supply or delivery of digital services by DSPs in the Philippines. Statement III: Digital services provided by a nonresident DSP shall be considered performed, rendered, supplied, or delivered in the Philippines in the course of trade or business if such digital services are consumed in the Philippines. (RR No. 3-2025)", "opts": [{"l": "a", "t": "All statements are correct"}, {"l": "b", "t": "All statements are incorrect"}, {"l": "c", "t": "Only Statements I and II are correct"}, {"l": "d", "t": "Only Statements I and III are correct"}], "ans": "a"}, {"n": 165, "p": 32, "stem": "Which of the following digital service transactions shall be exempt from VAT? (RR No. 3-2025)", "opts": [{"l": "a", "t": "Educational services, including online courses, seminars and trainings rendered by private educational institutions duly accredited by DepEd, CHED, TESDA, and those rendered by government educational institutions"}, {"l": "b", "t": "Sale of online subscription-based services to DepEd, CHED, TESDA and educational institutions recognized by said government agencies"}, {"l": "c", "t": "Services of banks, non-bank financial intermediaries performing quasi-banking functions, and other non-bank intermediaries that are rendered through different digital platforms"}, {"l": "d", "t": "All of the choices"}], "ans": "d"}, {"n": 166, "p": 32, "stem": "First statement: The purchase and sale of indigenous natural gas, aggregated gas and power generated by generation facilities using indigenous natural gas and aggregated gas shall be exempt from VAT. Second statement: The exemption from VAT for aggregated gas is only to the extent of the amount of indigenous natural gas attributed to be in the aggregated gas. (RR No. 2-2026)", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first statement is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}]}, {"id": "t6", "title": "Topic 6: Excise Taxes", "shortTitle": "6. Excise Taxes", "itemRange": "Items 167 to 179", "concepts": "<h3>Nature and Classification</h3>\n<p><strong>Nature:</strong> excise tax is a tax on production, levied directly on the manufacturer or importer (the seller is statutorily liable) and passed on to the end consumer. It is on top of VAT and forms part of the VAT base. <em>Specific tax</em> is based on weight, volume or physical unit; <em>ad valorem tax</em> is based on selling price or value.</p>\n\n<h3>Alcohol classification and tax type</h3>\n<table class=\"notes-table\">\n<thead><tr><th>Product</th><th>Classification</th><th>Type of excise tax</th></tr></thead>\n<tbody>\n<tr><td>Whiskey, brandy, rum, gin, vodka</td><td>Distilled spirits</td><td>Both ad valorem (20% of net retail price per proof) and specific (P20 per proof liter from 2015, since increased)</td></tr>\n<tr><td>Champagne, sparkling wines</td><td>Wines</td><td>Specific, per liter, higher rate when net retail price per 750 ml bottle exceeds P500</td></tr>\n<tr><td>Still and carbonated wines</td><td>Wines</td><td>Specific, per liter, rate depends on alcohol content (14% or less vs. over 14% to 25%)</td></tr>\n<tr><td>Beer, lager, ale, porter, other fermented liquors</td><td>Fermented liquor</td><td>Specific, per liter</td></tr>\n<tr><td>Tuba, basi, tapuy and similar domestic fermented liquors</td><td>Exempt</td><td>None</td></tr>\n</tbody>\n</table>\n\n<p><strong>Proof liter rule:</strong> a fraction of a proof liter equal to or more than half a liter in a package over one liter is taxed as a full liter and a smaller fraction is exempt; a package under one proof liter is taxed as one liter. Rates on alcohol products increase 4% every year (6% for some products under RA 11467).</p>\n\n<p><strong>Sweetened beverages:</strong> P6 per liter for caloric or non-caloric sweeteners, P12 per liter if using high fructose corn syrup alone or in combination; exempt if using purely coconut sap sugar or purely steviol glycosides. Round volume per the liter rule: 3.5 liters is taxed as 4 liters x P12 = P48. <em>Perfumes and toilet water:</em> 20% of wholesale price (local) or value of importation (imported), net of excise and VAT.</p>\n\n<p><strong>Minerals:</strong> nonmetallic minerals and quarry resources are due on removal from the locality; metallic minerals are returned and paid within 15 days after the end of the calendar quarter with a bond approximating the quarterly tax; imported minerals are paid before removal from customs custody (statement d in item 170 is wrong).</p>\n\n<p><strong>Automobiles (RR 18-2025, RR 1-2025):</strong> exempt removals subject to conditions: export, delivery to tax-exempt persons or entities, delivery and use exclusively within a freeport zone, removal for test run, and purely electric vehicles. Hybrid vehicles pay 50% of the applicable excise tax, so they are not exempt.</p>\n\n<p><strong>Petroleum (RR 6-2025):</strong> exempt when imported directly by international carriers for use outside the Philippines, by exempt entities under tax treaties and international agreements, and by entities exempt by law from direct and indirect taxes.</p>", "items": [{"n": 167, "p": 35, "stem": "Excise taxes are: I. considered taxes on production. II. directly levied upon the manufacturer or importer. III. actually passed on to the end consumer.", "opts": [{"l": "a", "t": "I, II and III are correct"}, {"l": "b", "t": "I, II and III are incorrect"}, {"l": "c", "t": "Only I and II are correct"}, {"l": "d", "t": "Only II and III are correct"}], "ans": "a"}, {"n": 168, "p": 35, "stem": "Who shall be statutorily liable to pay excise tax on locally manufactured or imported goods?", "opts": [{"l": "a", "t": "Buyer"}, {"l": "b", "t": "Seller"}, {"l": "c", "t": "Consumer"}, {"l": "d", "t": "None of the choices"}], "ans": "b"}, {"n": 169, "p": 35, "stem": "First statement: Every fractional part of a proof liter equal to or greater than a half liter in a cask or package containing more than one liter shall be taxed as a liter, and any smaller fractional part shall be exempt. Second statement: Any package of spirits, the total content of which is less than a proof liter, shall be taxed as one liter.", "opts": [{"l": "a", "t": "Both statements are correct"}, {"l": "b", "t": "Both statements are incorrect"}, {"l": "c", "t": "Only the first is correct"}, {"l": "d", "t": "Only the second statement is correct"}], "ans": "a"}, {"n": 170, "p": 35, "stem": "Which of the following statements is incorrect?", "opts": [{"l": "a", "t": "Excise tax on nonmetallic mineral or mineral products, or quarry resources shall be due and payable upon removal of such products from the locality where mined or extracted."}, {"l": "b", "t": "With respect to the excise tax on locally produced or extracted metallic mineral or mineral products, the person liable shall file a return and pay the tax within fifteen (15) days after the end of the calendar quarter."}, {"l": "c", "t": "The taxpayer shall file a bond in an amount which approximates the amount of excise tax due on the removals for the said quarter."}, {"l": "d", "t": "For imported mineral or mineral products, whether metallic or nonmetallic, the excise tax due thereon shall be paid after their removal from customs custody."}], "ans": "d"}, {"n": 171, "p": 35, "stem": "An excise tax of twenty percent (20%) of the net retail price (excluding the excise tax and the value-added tax) per proof on distilled spirits manufactured or produced in the Philippines for domestic sales or consumption is:", "opts": [{"l": "a", "t": "a local tax."}, {"l": "b", "t": "a proportional tax."}, {"l": "c", "t": "a specific tax."}, {"l": "d", "t": "an ad valorem tax."}], "ans": "d"}, {"n": 172, "p": 35, "stem": "With respect to the excise tax on locally produced or extracted metallic mineral or mineral products, the person liable shall file a return and pay the tax within how many days after the end of the calendar quarter when such products were removed?", "opts": [{"l": "a", "t": "Thirty (30) days"}, {"l": "b", "t": "Fifteen (15) days"}, {"l": "c", "t": "Ten (10) days"}, {"l": "d", "t": "Five (5) days"}], "ans": "b"}, {"n": 173, "p": 35, "stem": "One of the following fermented liquors is not subject to excise tax.", "opts": [{"l": "a", "t": "Beer"}, {"l": "b", "t": "Ale"}, {"l": "c", "t": "Porter"}, {"l": "d", "t": "Basi"}], "ans": "d"}, {"n": 174, "p": 35, "stem": "Champagne is classified as:", "opts": [{"l": "a", "t": "Sparkling wine"}, {"l": "b", "t": "Still wine"}, {"l": "c", "t": "Carbonated wine"}, {"l": "d", "t": "Fermented liquor"}], "ans": "a"}, {"n": 175, "p": 36, "stem": "Brandy is classified as:", "opts": [{"l": "a", "t": "Distilled spirit"}, {"l": "b", "t": "Fermented liquor"}, {"l": "c", "t": "Sparkling wine"}, {"l": "d", "t": "Carbonated wine"}], "ans": "a"}, {"n": 176, "p": 36, "stem": "A manufacturer of sweetened beverages using purely high fructose corn syrup or in combination with any caloric or non-caloric sweetener presented the following data: each package contains 3.5 liters; selling price P150 per package. How much is the excise tax using P12 tax per liter?", "opts": [{"l": "a", "t": "P48"}, {"l": "b", "t": "P36"}, {"l": "c", "t": "P12"}, {"l": "d", "t": "Not subject to excise tax"}], "ans": "a"}, {"n": 177, "p": 36, "stem": "Which of the following removals of locally manufactured/assembled or release of imported automobiles from the place of production or from customs custody, respectively, are exempt from the payment of the appropriate excise taxes subject to certain conditions? (RR No. 18-2025)", "opts": [{"l": "a", "t": "Removals for export"}, {"l": "b", "t": "Delivery to tax-exempt persons or entities"}, {"l": "c", "t": "Removals for delivery and use exclusively within the freeport zone"}, {"l": "d", "t": "All the choices"}], "ans": "d"}, {"n": 178, "p": 36, "stem": "Which of the following shall be exempt from excise tax? (RR No. 6-2025)", "opts": [{"l": "a", "t": "International carriers of Philippine or foreign registry directly importing petroleum products, on their use or consumption outside the Philippines."}, {"l": "b", "t": "Exempt entities or agencies covered by tax treaties, conventions and other international agreements for their use or consumption."}, {"l": "c", "t": "Entities which are by law exempt from direct and indirect taxes."}, {"l": "d", "t": "All of the choices."}], "ans": "d"}, {"n": 179, "p": 36, "stem": "Which of the following vehicles shall be exempt from the applicable excise tax prior to the removal of the automobiles from the manufacturing plant or customs custody? A. Purely electric vehicles. B. Hybrid vehicles. (RR No. 1-2025)", "opts": [{"l": "a", "t": "A and B"}, {"l": "b", "t": "A only"}, {"l": "c", "t": "B only"}, {"l": "d", "t": "Neither A nor B"}], "ans": "b"}]}, {"id": "t7", "title": "Topic 7: Documentary Stamp Taxes", "shortTitle": "7. Stamp Taxes", "itemRange": "Items 180 to 187", "concepts": "<h3>Nature and Filing</h3>\n<p><strong>Nature:</strong> DST is an excise tax on the privilege of executing specific instruments, not on the document itself. It is due regardless of the legal status of the underlying contract (void, voidable, rescissible or unenforceable). Failure to stamp does not void the transaction; the effects are that the document cannot be recorded, cannot be used as evidence until stamped and cancelled, and cannot be notarized.</p>\n\n<p><strong>Filing:</strong> the DST return (BIR Form 2000) is filed and the tax paid within 5 days after the close of the month when the document was made, signed, accepted or transferred.</p>\n\n<p><strong>RR 28-2025:</strong> documentary stamps may not be sold above face value; reuse of a previously affixed loose stamp on another document is prohibited.</p>\n\n<p><strong>RR 19-2025 (CMEPA):</strong> DST on original issue of shares is 75% of 1% of par value (previously P2.00 per P200, or 1%), computed on each P200 or fraction. The CMEPA also set the stock transaction tax at 1/10 of 1%.</p>\n\n<p><strong>Securitization (RR 2-2025):</strong> sale or transfer of assets to the SPE under a Securitization Plan is exempt from both VAT and DST; dacion en pago by the obligor to the obligee is not subject to the 6% CGT. The original issuance of ABS and related securities is exempt from VAT and other taxes in lieu thereof but is subject to DST; secondary trades and subsequent transfers of ABS are exempt from both DST and VAT. ABS yield to investors: 20% final tax, except low cost and socialized housing ABS which are exempt.</p>", "items": [{"n": 180, "p": 38, "stem": "Which of the following is not an effect of failure to affix the required DST?", "opts": [{"l": "a", "t": "An instrument, document or paper required by law to be stamped and which has been signed, issued, accepted or transferred without being duly stamped, shall not be recorded."}, {"l": "b", "t": "An instrument, document or paper or any copy thereof or any record of transfer of the same which is required by law to be stamped shall not be admitted or used in evidence in any court until the requisite stamp or stamps are affixed thereto and cancelled."}, {"l": "c", "t": "No notary public or other officer authorized to administer oaths shall add his jurat or acknowledgment to any document subject to documentary stamp tax unless the proper documentary stamps are affixed thereto and cancelled."}, {"l": "d", "t": "An instrument, document or paper required by law to be stamped and which has been signed, issued, accepted or transferred without being duly stamped, shall make the transaction void."}], "ans": "d"}, {"n": 181, "p": 38, "stem": "The Documentary Stamp Tax Return shall be filed within how many days after the close of the month when the taxable document was made, signed, accepted or transferred, and the tax thereon shall be paid at the same time the return is filed?", "opts": [{"l": "a", "t": "Thirty (30) days"}, {"l": "b", "t": "Fifteen (15) days"}, {"l": "c", "t": "Ten (10) days"}, {"l": "d", "t": "Five (5) days"}], "ans": "d"}, {"n": 182, "p": 38, "stem": "DST is levied on the exercise by persons of certain privileges conferred by law for the creation, revision, or termination of specific legal relationships through the execution of specific instrum
