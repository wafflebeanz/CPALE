<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FAR Mindmap: CPA Board Review Study App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #fff7f1;
    --surface: #ffffff;
    --surface-2: #fdeef3;
    --ink: #4b3f5c;
    --muted: #8f829f;
    --line: #f3dfe9;
    --focus: #b48ce8;
    --c-assets: #5fae7a;
    --c-liabilities: #ea6f9a;
    --c-equity: #9b82e3;
    --c-special: #5aa9dc;
    --hub-a: #e7d7ff;
    --hub-b: #ffd9e6;
    --hub-c: #d4f1e3;
    --bounce: cubic-bezier(.34, 1.56, .64, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2a2434; --surface: #352d41; --surface-2: #40364e; --ink: #f6eefb; --muted: #b7a9c8; --line: #4b3f5c; --focus: #d2b8ff;
      --c-assets: #8fd9a6; --c-liabilities: #ff9bbd; --c-equity: #c3b0ff; --c-special: #8fcbf2;
      --hub-a: #5d4a85; --hub-b: #7a4a63; --hub-c: #3f6b58;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2a2434; --surface: #352d41; --surface-2: #40364e; --ink: #f6eefb; --muted: #b7a9c8; --line: #4b3f5c; --focus: #d2b8ff;
    --c-assets: #8fd9a6; --c-liabilities: #ff9bbd; --c-equity: #c3b0ff; --c-special: #8fcbf2;
    --hub-a: #5d4a85; --hub-b: #7a4a63; --hub-c: #3f6b58;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(circle at 12% 8%, color-mix(in srgb, var(--c-equity) 14%, transparent) 0, transparent 30%),
                      radial-gradient(circle at 88% 12%, color-mix(in srgb, var(--c-liabilities) 12%, transparent) 0, transparent 28%),
                      radial-gradient(circle at 50% 95%, color-mix(in srgb, var(--c-assets) 12%, transparent) 0, transparent 30%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15.5px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Quicksand", "Nunito", system-ui, sans-serif; font-weight: 700; }
  button { font: inherit; color: inherit; }
  *:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 999px; }

  .topbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 2px dashed var(--line);
  }
  .input {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 999px;
    color: var(--ink);
    padding: 9px 14px 9px 40px;
    width: 100%;
    box-shadow: 0 6px 16px color-mix(in srgb, var(--c-equity) 12%, transparent);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .input:focus { border-color: var(--c-equity); outline: none; box-shadow: 0 8px 22px color-mix(in srgb, var(--c-equity) 22%, transparent); }
  .input::placeholder { color: var(--muted); }
  .btn {
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13.5px;
    font-weight: 700;
    cursor: pointer;
    transition: transform .25s var(--bounce), box-shadow .25s ease, background-color .2s ease;
  }
  .btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 8px 18px color-mix(in srgb, var(--c-equity) 18%, transparent); }
  .btn:active { transform: scale(.97); }
  .btn-accent { background: var(--acc); border-color: var(--acc); color: #fff; box-shadow: 0 8px 18px color-mix(in srgb, var(--acc) 35%, transparent); }
  .btn-accent:hover { background: var(--acc); filter: brightness(1.06); }

  /* Hub node */
  .hub {
    position: relative;
    background: linear-gradient(135deg, var(--hub-a), var(--hub-b) 55%, var(--hub-c));
    color: var(--ink);
    border: 0;
    border-radius: 36px;
    padding: 26px 34px;
    cursor: pointer;
    text-align: center;
    max-width: 560px;
    margin: 0 auto;
    box-shadow: 0 14px 34px color-mix(in srgb, var(--c-equity) 28%, transparent), 0 4px 0 color-mix(in srgb, var(--c-equity) 25%, var(--surface));
    transition: transform .3s var(--bounce), box-shadow .3s ease;
  }
  .hub:hover { transform: translateY(-5px) scale(1.03) rotate(-.6deg); box-shadow: 0 22px 44px color-mix(in srgb, var(--c-equity) 34%, transparent), 0 4px 0 color-mix(in srgb, var(--c-equity) 25%, var(--surface)); }
  .hub .hub-title { font-size: clamp(26px, 4vw, 40px); line-height: 1.12; letter-spacing: -0.01em; }
  .hub .hub-sub { opacity: .8; font-size: 13.5px; margin-top: 8px; font-weight: 600; }

  /* Branch header node */
  .branch-head {
    width: 100%;
    text-align: left;
    background: color-mix(in srgb, var(--acc) 16%, var(--surface));
    border: 2.5px solid color-mix(in srgb, var(--acc) 55%, var(--surface));
    border-radius: 26px;
    padding: 14px 18px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 10px 22px color-mix(in srgb, var(--acc) 22%, transparent);
    transition: transform .3s var(--bounce), box-shadow .3s ease, background-color .2s ease;
  }
  .branch-head:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 18px 32px color-mix(in srgb, var(--acc) 32%, transparent); }
  .branch-head .bh-title { font-size: 23px; line-height: 1.15; color: color-mix(in srgb, var(--acc) 75%, var(--ink)); }
  .branch-head .bh-meta { font-size: 12.5px; color: var(--muted); margin-top: 3px; font-weight: 600; }
  .branch-head.active { background: color-mix(in srgb, var(--acc) 28%, var(--surface)); }

  /* Topic tree */
  .tree { list-style: none; margin: 0; padding: 12px 0 0 16px; position: relative; }
  .tree::before { content: ""; position: absolute; left: 16px; top: 0; bottom: 20px; width: 3px; border-radius: 3px; background: var(--acc); opacity: .3; }
  .tree li { position: relative; padding-left: 18px; margin-bottom: 10px; }
  .tree li::before { content: ""; position: absolute; left: 0; top: 21px; width: 16px; height: 3px; border-radius: 3px; background: var(--acc); opacity: .3; }
  .topic {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 2px solid var(--line);
    border-radius: 22px;
    padding: 10px 14px 10px 12px;
    cursor: pointer;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    box-shadow: 0 6px 14px color-mix(in srgb, var(--acc) 14%, transparent);
    transition: transform .3s var(--bounce), box-shadow .3s ease, background-color .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .topic:hover { transform: translateX(4px) scale(1.03); background: color-mix(in srgb, var(--acc) 9%, var(--surface)); border-color: color-mix(in srgb, var(--acc) 50%, var(--surface)); box-shadow: 0 12px 24px color-mix(in srgb, var(--acc) 26%, transparent); }
  .topic.active { background: color-mix(in srgb, var(--acc) 16%, var(--surface)); border-color: var(--acc); }
  .topic .t-title { font-size: 16px; line-height: 1.25; font-weight: 700; }
  .topic .t-meta { font-size: 12px; color: var(--muted); margin-top: 3px; font-weight: 600; }
  .topic .t-check {
    flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--line); margin-top: 1px;
    display: grid; place-items: center; color: #fff; background: transparent;
    transition: transform .3s var(--bounce), background-color .2s ease;
  }
  .topic .t-check.done { background: var(--acc); border-color: var(--acc); transform: scale(1.1); }
  .topic.dim { opacity: .3; }

  .pill {
    display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 11px; border-radius: 999px;
    background: color-mix(in srgb, var(--acc) 18%, var(--surface)); color: color-mix(in srgb, var(--acc) 80%, var(--ink));
  }

  /* Connectors */
  .connectors { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .connectors path { fill: none; stroke-width: 3; stroke-linecap: round; opacity: .5; stroke-dasharray: 2 8; }

  /* Detail panel */
  .backdrop { position: fixed; inset: 0; background: color-mix(in srgb, #4b3f5c 40%, transparent); backdrop-filter: blur(2px); z-index: 30; animation: fade .18s ease; }
  .panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: min(1000px, 100%);
    background: var(--surface);
    border-left: 3px solid color-mix(in srgb, var(--acc) 40%, var(--surface));
    border-radius: 32px 0 0 32px;
    z-index: 31;
    display: flex; flex-direction: column;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-shadow: -18px 0 50px color-mix(in srgb, var(--acc) 22%, transparent);
    animation: slide .45s var(--bounce);
  }
  .panel-head { padding: 18px 28px 12px; border-bottom: 2px dashed var(--line); }
  .panel-body { flex: 1; overflow-y: auto; padding: 22px 28px 36px; }
  .panel-foot { border-top: 2px dashed var(--line); padding: 12px 28px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .panel h2 { font-size: 34px; line-height: 1.15; margin: 6px 0 6px; }
  .panel p { margin: 0 0 12px; max-width: 72ch; font-size: 15.5px; line-height: 1.65; }
  .crumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-weight: 600; }
  .crumb b { color: var(--acc); font-weight: 800; }
  .section-title { font-size: 20px; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title .em { font-size: 18px; }

  /* Quick cards: initial measurement + formulas */
  .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 16px 0 6px; }
  @media (max-width: 760px) { .quick { grid-template-columns: 1fr; } }
  .qcard {
    border-radius: 24px;
    padding: 16px 18px 14px;
    background: color-mix(in srgb, var(--acc) 10%, var(--surface));
    border: 2px solid color-mix(in srgb, var(--acc) 30%, var(--surface));
    box-shadow: 0 10px 24px color-mix(in srgb, var(--acc) 16%, transparent);
  }
  .qcard.formulas { background: color-mix(in srgb, var(--c-equity) 10%, var(--surface)); border-color: color-mix(in srgb, var(--c-equity) 32%, var(--surface)); box-shadow: 0 10px 24px color-mix(in srgb, var(--c-equity) 16%, transparent); }
  .qcard h3 { margin: 0 0 10px; font-size: 17px; display: flex; align-items: center; gap: 8px; color: color-mix(in srgb, var(--acc) 80%, var(--ink)); }
  .qcard.formulas h3 { color: color-mix(in srgb, var(--c-equity) 80%, var(--ink)); }
  .qcard h3 .em { font-size: 20px; }
  .qrow { display: grid; grid-template-columns: minmax(110px, 38%) 1fr; gap: 8px; padding: 7px 0; border-top: 1.5px dashed color-mix(in srgb, var(--acc) 28%, var(--surface)); font-size: 14px; line-height: 1.45; }
  .qrow:first-of-type { border-top: 0; }
  .qrow .ql { font-weight: 800; color: color-mix(in srgb, var(--acc) 80%, var(--ink)); }
  .qcard.formulas .qrow { border-top-color: color-mix(in srgb, var(--c-equity) 28%, var(--surface)); grid-template-columns: 1fr; gap: 3px; }
  .qcard.formulas .ql { color: color-mix(in srgb, var(--c-equity) 80%, var(--ink)); font-size: 13px; }
  .qf { display: inline-block; background: var(--surface); border-radius: 14px; padding: 6px 12px; font-weight: 600; font-size: 14.5px; line-height: 1.5; box-shadow: 0 3px 8px color-mix(in srgb, var(--c-equity) 14%, transparent); }

  /* Rich text */
  .kt { color: var(--acc); font-weight: 800; }
  .defn {
    font-style: italic; font-weight: 600; font-size: 17.5px; line-height: 1.5;
    padding: 14px 18px; margin: 4px 0 14px;
    border-radius: 20px;
    background: color-mix(in srgb, var(--acc) 10%, var(--surface));
    border: 2px solid color-mix(in srgb, var(--acc) 22%, var(--surface));
    max-width: 72ch;
  }
  .points { list-style: none; margin: 0; padding: 0; }
  .points li { position: relative; padding-left: 20px; margin: 0 0 7px; font-size: 14.5px; line-height: 1.55; max-width: 70ch; }
  .points li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--acc); opacity: .55; }
  .points li.lead { font-style: italic; font-weight: 600; font-size: 15px; }
  .points li.lead::before { opacity: 1; box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); }

  /* Concepts accordion */
  .concept { border: 2px solid var(--line); border-radius: 18px; margin-bottom: 10px; background: var(--surface); overflow: hidden; transition: border-color .2s ease, box-shadow .2s ease; }
  .concept:hover { border-color: color-mix(in srgb, var(--acc) 45%, var(--surface)); box-shadow: 0 8px 18px color-mix(in srgb, var(--acc) 14%, transparent); }
  .concept.open { border-color: color-mix(in srgb, var(--acc) 50%, var(--surface)); }
  .concept > button { width: 100%; text-align: left; background: transparent; border: 0; padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; font-size: 15px; }
  .concept > button:hover { background: color-mix(in srgb, var(--acc) 6%, var(--surface)); }
  .concept > button .chev { margin-left: auto; transition: transform .3s var(--bounce); color: var(--muted); }
  .concept.open > button .chev { transform: rotate(90deg); }
  .concept .c-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); flex: 0 0 auto; }
  .concept .c-body { padding: 0 16px 14px 36px; color: var(--ink); animation: pop .3s var(--bounce); }

  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 2px solid color-mix(in srgb, var(--acc) 30%, var(--surface));
    background: color-mix(in srgb, var(--acc) 8%, var(--surface));
    border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 700; cursor: pointer; margin: 0 8px 8px 0;
    transition: transform .3s var(--bounce), box-shadow .2s ease;
  }
  .chip:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 8px 16px color-mix(in srgb, var(--acc) 22%, transparent); }

  .progress { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; border: 1.5px solid var(--line); }
  .progress > div { height: 100%; background: linear-gradient(90deg, var(--c-assets), var(--c-equity), var(--c-liabilities)); transition: width .4s var(--bounce); border-radius: 999px; }

  .empty { color: var(--muted); padding: 24px; text-align: center; border: 2px dashed var(--line); border-radius: 24px; font-weight: 600; }

  /* Visual aids */
  .visual { margin: 14px 0 20px; }
  .visual figcaption { font-family: "Quicksand", "Nunito", sans-serif; font-size: 16.5px; font-weight: 700; margin-bottom: 8px; color: color-mix(in srgb, var(--acc) 80%, var(--ink)); }
  .vt-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 18px; }
  .vt { border-collapse: collapse; width: 100%; font-size: 13.5px; line-height: 1.4; }
  .vt th, .vt td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1.5px solid var(--line); }
  .vt thead th { background: color-mix(in srgb, var(--acc) 18%, var(--surface)); color: color-mix(in srgb, var(--acc) 80%, var(--ink)); font-weight: 800; font-size: 12.5px; }
  .vt tbody th { font-weight: 800; width: 32%; background: color-mix(in srgb, var(--acc) 5%, var(--surface)); }
  .vt tbody tr:last-child th, .vt tbody tr:last-child td { border-bottom: 0; }
  .vt td + td, .vt th + td, .vt th + th { border-left: 1.5px solid var(--line); }
  .vsteps { list-style: none; margin: 0; padding: 0; }
  .vsteps li { position: relative; display: flex; gap: 12px; align-items: flex-start; padding: 8px 10px 8px 0; font-size: 14px; line-height: 1.45; font-weight: 600; }
  .vsteps li + li::before { content: ""; position: absolute; left: 12px; top: -8px; height: 16px; width: 3px; border-radius: 3px; background: var(--acc); opacity: .3; }
  .vs-n { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%; background: var(--acc); color: #fff; font-size: 12.5px; font-weight: 800; display: grid; place-items: center; margin-top: 0; box-shadow: 0 4px 10px color-mix(in srgb, var(--acc) 35%, transparent); }
  .dg-wrap { overflow-x: auto; border: 2px solid var(--line); border-radius: 20px; padding: 12px; background: color-mix(in srgb, var(--acc) 4%, var(--surface)); }
  .dg-wrap svg { display: block; font-family: "Nunito", system-ui, sans-serif; }
  .dg-box { fill: var(--surface); stroke: var(--acc); stroke-width: 2; }
  .dg-q { fill: color-mix(in srgb, var(--acc) 16%, var(--surface)); }
  .dg-center { fill: var(--acc); stroke: var(--acc); }
  .dg-text { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .dg-center-text { fill: #fff; font-weight: 800; }
  .dg-leaf-text { font-weight: 700; }
  .dg-sub { fill: var(--muted); font-size: 11px; font-weight: 600; }
  .dg-edge { stroke: var(--acc); stroke-width: 2; fill: none; opacity: .45; }
  .dg-lbl-bg { fill: var(--surface); stroke: var(--acc); stroke-width: 1.5; }
  .dg-lbl { fill: var(--acc); font-size: 10.5px; font-weight: 800; }

  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes slide { from { transform: translateX(40px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0 } to { transform: none; opacity: 1 } }
  @media (max-width: 640px) {
    .panel { width: 100%; border-left: 0; border-radius: 0; }
    .panel-head, .panel-foot { padding-left: 16px; padding-right: 16px; }
    .panel-body { padding: 16px 16px 28px; }
    .hub { padding: 20px 22px; border-radius: 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
window.FAR_BRANCHES = window.FAR_BRANCHES || [];
window.FAR_BRANCHES.push({
  id: "assets",
  title: "Assets",
  color: "var(--c-assets)",
  tag: "Resources the entity controls",
  summary: [
    `The asset side of the statement of financial position covers everything from cash on hand to long-term investments. Each standard follows the same rhythm: define the asset, decide when to recognize it (future economic benefits are probable and cost can be measured reliably), measure it initially at cost or fair value, pick a subsequent measurement model, and derecognize it on disposal.`,
    `The topics group naturally. Cash, receivables and inventories are the working capital assets. PPE, borrowing costs, depletion and government grants describe long-lived operating assets and how their cost is built up. Intangibles and impairment extend the same logic to non-physical assets. The investment topics (equity securities, associates, debt securities, investment property and funds) cover assets held to earn a return rather than to operate.`
  ],
  topics: [
    {
      id: "cash",
      title: "Cash and Cash Equivalents",
      std: "PAS 1, PAS 7",
      summary: [
        `Cash is money and any negotiable instrument payable in money that a bank will accept for deposit and immediate credit. There is no dedicated standard; PAS 1 paragraph 66 treats an item as a current asset if it is cash or a cash equivalent that is not restricted from use for at least 12 months. The test for cash is therefore simple: it must be unrestricted in use. Local currency is carried at face value, foreign currency is translated at the closing rate, and cash in a closed bank is carried at estimated realizable value.`,
        `Cash equivalents (PAS 7) are short-term, highly liquid debt instruments acquired within three months or less of maturity, so their value is barely sensitive to interest rate changes. Equity securities never qualify because they have no maturity date, with one exception: redeemable preference shares with mandatory redemption bought within three months of the redemption date. Time deposits, money market instruments, commercial paper and treasury bills are the standard examples.`
      ],
      concepts: [
        { title: "Composition of cash", text: `Coins, currencies, customer checks, cashier's and traveler's checks, money orders and bank drafts are cash. A check the entity drew but has not delivered, post-dated, or let go stale is still cash; the amount reverts to a payable (or other income for stale checks). Checks received from others that are post-dated or stale are receivables, not cash. Demand and savings deposits are cash, but escrow deposits are long-term investments and time deposits are cash equivalents. An informal compensating balance stays in cash; a formal restricted one becomes a short-term or long-term investment depending on the restriction period.` },
        { title: "Bank overdrafts and cash funds", text: `A bank overdraft is a current liability by default. It may be offset against cash only when the entity has two or more accounts in the same bank or the overdraft is immaterial. Funds follow their purpose: funds for buying a current asset, for operations (payroll, change, petty cash, travel) and for settling current liabilities (interest, dividend, tax funds) are cash; funds for non-current assets or non-current liabilities (pension, insurance, bond sinking funds) are long-term investments.` },
        { title: "Petty cash fund", text: `Under the imprest system, payments out of the fund are memo entries; expenses are recorded only on replenishment (debit expenses, credit cash in bank), and unreplenished year-end payments are accrued by debiting expenses and crediting petty cash. Under the fluctuating system, each payment is recorded immediately against petty cash, and replenishment debits petty cash. Establishment, increase and decrease entries are identical under both systems.` },
        { title: "Fraud and shortages", text: `Lapping hides the theft of one customer's collection with a later collection from another. Window dressing keeps the books open past period-end to record later collections or payments as if made on the last day. Kiting moves cash between banks at month-end to cover a shortage. A shortage discovered is debited to cash short/over; if the cashier is accountable it becomes due from cashier, otherwise a loss. An overage that cannot be traced is other income.` },
        { title: "Bank reconciliation", text: `The adjusted balance method brings both book and bank balances to the correct cash figure. Book side: add credit memos (notes collected, loan proceeds), deduct debit memos (NSF checks, service charges), and fix book errors. Bank side: add deposits in transit, deduct outstanding checks (net of certified checks), and fix bank errors. Errors are corrected on the side of the party that made them: an understated receipt is added and an overstated receipt deducted, while disbursement errors work in reverse.` },
        { title: "Proof of cash", text: `A proof of cash is a four-column reconciliation (beginning balance, receipts, disbursements, ending balance) that also proves the month's receipts and disbursements, which makes it useful for spotting receipts recorded but never deposited. The two outside columns are ordinary reconciliations; the middle columns are analyzed item by item. Deposits in transit at month-end equal beginning deposits in transit plus deposits made by the company less deposits acknowledged by the bank; outstanding checks follow the same logic with checks issued and checks paid. An NSF check returned and redeposited in the same month is deducted from both bank receipts and bank disbursements.` }
      ]
    },
    {
      id: "receivables",
      title: "Receivables",
      std: "PFRS 9",
      summary: [
        `Receivables are financial assets: contractual rights to receive cash or another financial asset. Whatever the label (accounts, notes, loans), the model is the same: initial measurement at fair value plus transaction costs and subsequent measurement at amortized cost, which equals the initial amount less principal repayments, plus or minus cumulative amortization of any difference between initial and maturity amounts, less impairment.`,
        `Trade receivables arise from selling goods and services in the ordinary course and are current when realizable within the normal operating cycle or one year, whichever is longer. Non-trade receivables are current only if due within one year. When the problem is silent, advances to shareholders are non-current, advances to affiliates are long-term investments, advances to suppliers are current, and subscription receivable is a deduction from equity unless collectible within a year. All trade and current non-trade receivables appear as one line, trade and other receivables.`
      ],
      concepts: [
        { title: "Trade AR and discounts", text: `Accounts receivable are recorded at the invoice price, which is the list price less successive trade discounts (a P10,000 list price with 10% and 20% trade discounts gives P7,200). Under the gross method, AR and sales are recorded at P7,200 and sales discounts are recorded only when taken. Under the net method they are recorded at P7,056, and a customer who pays late generates sales discount forfeited of P144. Credit balances in AR are current liabilities, not offsets. Net realizable value is the gross balance less all allowances.` },
        { title: "Allowances and bad debts", text: `Four allowances exist: sales returns, sales discounts, freight charges (FOB destination, freight collect) and doubtful accounts. Only the allowance method for bad debts complies with PFRS; direct write-off is for tax. Under the allowance method, doubtful accounts are expensed when collectibility is doubtful, write-offs reduce the allowance, and recoveries restore the allowance and are then collected. Recoveries do not affect gross AR, net income or working capital. The balance sheet approach (percent of AR or aging) gives the required allowance; the income statement approach (percent of credit sales) gives the expense directly.` },
        { title: "Notes receivable", text: `Short-term notes are carried at face value whether interest-bearing or not (unless discounting is material). Long-term notes are at face value only when interest-bearing at a reasonable rate; at an unreasonable rate or with no interest they are measured at present value. To compute PV, identify the cash flows (principal only, or principal plus nominal interest), their timing, and the right factor (PV of 1 for a lump sum, PV of an ordinary annuity when the first payment is one period later, PV of an annuity due when the first payment is today). Interest income uses the nominal rate for notes at face and the effective rate for notes at PV.` },
        { title: "Loans receivable and impairment", text: `A loan is initially measured at the amount lent plus direct origination costs less any origination fee, then carried at amortized cost. A premium (face above initial amount, nominal rate above effective) amortizes downward; a discount amortizes upward. Impairment requires objective evidence of a loss event such as significant financial difficulty, default, a concession the lender would not otherwise grant or probable bankruptcy. The loss equals the carrying amount including accrued interest less the present value of the recoverable amount discounted at the original effective rate; the new carrying amount is then amortized using that same rate.` },
        { title: "Receivable financing", text: `A pledge uses AR as general collateral with no derecognition and only a disclosure. An assignment transfers rights in specific AR; net proceeds are the loan less charges, and equity in assigned accounts is the carrying amount of the assigned AR less the loan balance. Factoring is a sale, without recourse and on a notification basis if silent; net proceeds are face value less commission and the factor's holdback, and the gain or loss compares selling price (proceeds plus holdback) with the NRV of the AR. Discounting a note computes maturity value, deducts the discount (maturity value times discount rate times unexpired term) and compares net proceeds with the carrying amount including accrued interest. A gain or loss arises only for discounting without recourse or as a conditional sale; secured borrowing records interest expense and a liability instead.` }
      ]
    },
    {
      id: "inventories",
      title: "Inventories",
      std: "PAS 2",
      summary: [
        `Inventories are assets held for sale in the ordinary course of business, in production for such sale, or materials and supplies to be consumed in production or in rendering services. A merchandiser has merchandise inventory; a manufacturer has finished goods, work in process, raw materials and factory supplies; a service entity has work in progress. Financial instruments and biological assets are excluded, and producers of agricultural or mineral products and commodity broker-traders measure inventory at NRV or fair value less costs to sell instead.`,
        `The standard answers three questions: what belongs in inventory (recognition and cut-off), what it costs (purchase, conversion and other costs), and how it is measured afterward (lower of cost and NRV using a cost formula). Estimation techniques, the gross profit method and the retail method, fill in when a physical count is impossible or impractical.`
      ],
      concepts: [
        { title: "Recognition and cut-off", text: `Inventory includes all goods to which the entity has title, wherever located; possession and title usually coincide. Goods in transit belong to the buyer under FOB shipping point and CIF (ownership passes on loading), and to the seller under FOB destination, FAS and ex-ship until delivery. Consigned goods stay with the consignor; freight out to the consignee is inventoriable, but freight on returns and freight to the final customer are not. Goods under a repurchase agreement, pledge or loan stay with the seller, pledgor or borrower; sale or return and installment, bill and hold and special order goods belong to the buyer; sale on trial and lay-away goods belong to the seller. Cut-off checks whether the goods belong in inventory, whether the sale or purchase is recorded, and whether the goods were counted.` },
        { title: "Cost of inventories", text: `Cost is the cost of purchase (invoice price, import duties, irrecoverable taxes, freight, handling, insurance in transit, broker's commission) plus cost of conversion (direct labor and overhead) plus other costs to bring the goods to their present location and condition. Variable overhead is allocated on actual capacity and fixed overhead on normal capacity, with any unallocated fixed overhead expensed. Deferred settlement uses the cash price equivalent and lump-sum purchases are allocated by relative fair value. Recoverable VAT, trade discounts, foreign exchange differences, interest (unless a qualifying asset), abnormal losses, administrative expenses, storage of finished goods and selling costs are excluded.` },
        { title: "Periodic vs perpetual", text: `The periodic system updates inventory only at the physical count, records purchases in a purchases account and derives cost of goods sold as a residual; it suits high-volume, low-value goods. The perpetual system records every movement directly in inventory, records cost of goods sold with each sale (and reverses it on a sales return), and uses the count only to verify the records; it suits low-volume, high-value goods.` },
        { title: "Cost formulas", text: `FIFO assumes the earliest purchases are sold first, so ending inventory consists of the latest purchases and the result is the same under periodic or perpetual systems. Weighted average (periodic) recomputes a single unit cost once a year as total goods available in pesos divided by units; moving average (perpetual) recomputes after every purchase. Specific identification is used for individually identifiable items. During inflation, FIFO reports higher net income, lower COGS and higher ending inventory than LIFO; deflation reverses the pattern.` },
        { title: "Lower of cost and NRV", text: `Inventory is written down when cost exceeds NRV and a prior write-down is reversed when NRV recovers. NRV of finished goods is estimated selling price less costs to sell; work in process also deducts costs to complete; raw materials use current replacement cost and are tested only if the related finished goods are written down. LCNRV is applied item by item. Under the direct method the loss is buried in COGS; under the allowance method inventory stays at cost and a loss is recorded against an allowance whose ending balance equals cost less NRV. Reversals are limited to the allowance balance. A non-cancelable purchase commitment creates a loss and an estimated liability when prices fall, with later gains capped at the loss recognized.` },
        { title: "Estimation methods", text: `The gross profit method assumes a stable gross profit rate: COGS equals net sales times the cost ratio (or net sales divided by the sales ratio when the rate is based on cost), and ending inventory is the squeeze from goods available for sale. Only sales returns are deducted to get net sales. It is acceptable for interim reporting only. The retail method tracks goods at both cost and retail, includes net markups in the cost ratio and treats net markdowns according to the variant: average (TGAS at cost over TGAS at retail), FIFO (excluding beginning inventory from both), and conservative (adding net markdowns back to retail). COGS at retail is gross sales less returns plus employee discounts and normal losses. Casualty loss and inventory shortage are the estimated ending inventory less undamaged goods, damaged goods at LCNRV, or the counted inventory.` }
      ]
    },
    {
      id: "biological",
      title: "Biological Assets",
      std: "PAS 41",
      summary: [
        `PAS 41 applies to biological assets (living animals and plants) except bearer plants, to agricultural produce at the point of harvest, and to unconditional government grants related to biological assets, all within agricultural activity. Agricultural land, bearer plants and their grants, related intangibles and right-of-use assets are handled by PAS 16, PAS 20, PAS 38 and PFRS 16. Agriculture means managing the biological transformation and harvest of living assets; what separates it from ocean fishing or hunting is the management of change, together with the capability to change and the routine measurement of change.`,
        `The defining feature of the standard is fair value measurement: biological assets are carried at fair value less costs to sell at each reporting date, with all gains and losses in profit or loss. Agricultural produce is measured once, at harvest, at fair value less costs to sell, and that amount becomes its deemed cost under PAS 2.`
      ],
      concepts: [
        { title: "Classes and bearer plants", text: `Biological assets are consumable (harvested as produce or sold) or bearer (held to bear produce), and mature or immature. A bearer plant is a living plant used to produce agricultural produce for more than one period with only a remote chance of being sold as produce itself (sugarcane, tea bushes, grape vines, oil palms); it is PPE under PAS 16, but the produce growing on it stays in PAS 41. A dual-use plant that is both cultivated for produce and sold as a plant is a biological asset. Processed produce (cheese, wine, lumber) is inventory under PAS 2.` },
        { title: "Measurement and fair value", text: `Biological assets are measured initially and subsequently at fair value less costs to sell. The presumption that fair value is reliable can be rebutted only on initial recognition; once fair value becomes reliable it must be used until disposal. Fair value follows the PFRS 13 hierarchy: level 1 quoted prices in an active market for identical assets, level 2 observable inputs, level 3 unobservable entity data. The principal market is used, or the most advantageous market if there is none. Costs to sell include broker commissions, regulatory levies and transfer taxes but exclude transport, income taxes and interest. If only a combined market exists, the asset's fair value is the combined fair value less the fair value of the land.` },
        { title: "Gains and losses", text: `On initial recognition a biological asset shows a gain when cash outlay is below fair value less costs to sell and a loss when above; produce usually shows a gain. The fair value change for a period is split for disclosure into a price change (same beginning age, different dates: end price at beginning age less beginning price, times quantity) and a physical change (same year-end date, different ages: end price at end age less end price at beginning age, times quantity, plus the fair value less costs to sell of newborns).` },
        { title: "Government grants under PAS 41", text: `Grants related to biological assets measured at fair value less costs to sell are recognized in profit or loss: unconditional grants when receivable, conditional grants when the conditions are met, and conditional grants that let the entity keep part as time passes on a straight-line basis. Grants related to bearer plants or other PPE fall under PAS 20 instead.` }
      ]
    },
    {
      id: "ppe-cost",
      title: "PPE: Recognition and Cost",
      std: "PAS 16",
      summary: [
        `Property, plant and equipment are tangible assets held for use in production or the supply of goods and services, for rental to others (operating leases of equipment, not land or buildings), or for administration, and expected to be used for more than one year. PPE held for sale, biological assets other than bearer plants, exploration assets and mineral rights are outside the standard, though equipment used to develop those resources is PPE. Recognition follows the usual test: probable future benefits and reliable cost. Spare parts used for more than one period, and safety and environmental equipment needed to obtain benefits from other assets, are PPE.`,
        `Cost has three layers: the purchase price (net of trade discounts and recoverable VAT, including import duties, irrecoverable taxes and freight), directly attributable costs to bring the asset to its location and working condition, and the present value of any obligation to dismantle, remove or restore the site.`
      ],
      concepts: [
        { title: "Cost by means of acquisition", text: `Cash purchases are recorded at invoice price; purchases on account at invoice price less cash discounts whether or not taken; deferred settlement at the cash price equivalent or the present value of future payments. Assets acquired by issuing shares or bonds are measured by the fair value of the asset received, then the fair value of the instruments, then their par or face value. A basket purchase is allocated by fair values. Donations are recorded at fair value, with income credited for an unrelated donor and donated capital for an owner. Self-constructed assets include direct materials, labor, overhead and borrowing costs.` },
        { title: "Exchanges and trade-ins", text: `An exchange has commercial substance when the cash flows of the asset received differ significantly from those given up, or the entity-specific value of the affected operations changes significantly. With commercial substance, cost is the fair value of the asset given plus or minus cash (boot), then the fair value of the asset received, then the carrying amount of the asset given plus or minus boot. Without commercial substance, cost is the carrying amount given plus or minus boot with no gain or loss. A trade-in uses the fair value (trade-in value) of the asset given plus cash paid, then the fair value of the asset received.` },
        { title: "Directly attributable costs", text: `Included: employee benefits from construction or acquisition, site preparation, delivery and handling, installation and assembly, professional fees and testing whether the asset works (proceeds from selling items produced during testing go to profit or loss). Excluded and expensed: opening a new facility, launching a new product (advertising), doing business in a new location (including staff training), administration and overhead, costs while the asset sits idle or below capacity, initial operating losses, relocating operations and income from incidental operations. Savings on self-constructed assets are not recognized at all.` },
        { title: "Land, building and equipment costs", text: `Land cost includes the purchase price, title and legal fees, broker's commission, escrow and registration fees, assumed mortgages and unpaid taxes, surveying, clearing and demolishing an unwanted old building, payments to tenants to vacate, permanent grading and landfill, exercised options and special assessments. Land improvements with limited lives (fences, parking lots, landscaping) are separate unless part of the building blueprint. A purchased building includes legal fees, assumed taxes and liens, tenant payments and renovation for intended use; a self-constructed building adds permits, architect and superintendent fees, excavation, temporary structures, borrowing costs and insurance during construction. Equipment includes freight, insurance in transit, installation, testing, dismantling estimates, consultant fees and safety devices; operator training is expensed.` },
        { title: "Lump-sum land and building", text: `When land and an old building are bought together, cost is allocated by relative fair values at purchase regardless of plans for the building; if the building is unusable, all cost goes to land. Demolition cost is capitalized to the new building, salvage proceeds go to profit or loss, and the allocated cost of a demolished building is a derecognition loss. Moving a machine to increase service potential expenses the old installation's undepreciated cost and capitalizes the new installation; removal cost of an old machine not previously provided for is expensed.` }
      ]
    },
    {
      id: "ppe-subsequent",
      title: "PPE: Depreciation, Revaluation and Derecognition",
      std: "PAS 16",
      summary: [
        `After recognition an entity chooses the cost model or the revaluation model for an entire class of PPE. Under the cost model the asset is carried at cost less accumulated depreciation and impairment. Depreciation is a cost allocation, not a valuation: the depreciable amount (cost less residual value) is spread over the useful life by a method that reflects the pattern of consumption of benefits. It begins when the asset is available for use, continues while the asset is temporarily idle, and stops at the earlier of derecognition and classification as held for sale, or when residual value exceeds carrying amount.`,
        `Residual value and useful life are reviewed annually, and each significant part of an asset is depreciated separately. Revenue-based depreciation methods are prohibited. Any change in method, useful life or residual value is a change in estimate applied prospectively: take the carrying amount at the start of the period of change as the new cost and depreciate it on the revised basis.`
      ],
      concepts: [
        { title: "Depreciation methods", text: `Straight-line charges depreciable amount divided by useful life. Composite (dissimilar items) and group (similar items) methods apply a constant rate (total annual straight-line depreciation over total cost) to total cost, keep one accumulated depreciation account and recognize no gain or loss on individual disposals. Units of production and working hours charge a rate per unit or hour times actual activity, so no use means no depreciation. Sum-of-the-years-digits multiplies depreciable amount by remaining life over the sum of digits (life times (life plus 1) over 2). Declining balance applies a fixed rate (200% or 150% of the straight-line rate) to cost in year one and to carrying amount afterward, ignoring residual value in the rate. Retirement, replacement and inventory methods serve low-value items like tools.` },
        { title: "Revaluation model", text: `The asset is carried at fair value at the revaluation date (or depreciated replacement cost, also called sound value, when fair value is unavailable) less subsequent depreciation and impairment. Revaluations must be frequent enough that carrying amount does not differ materially from fair value (annually for volatile items, every three to five years otherwise), and the whole class is revalued together. Revaluation surplus is the revalued amount less carrying amount, net of tax. Under the proportional method accumulated depreciation is restated in proportion to the change in gross carrying amount; under the elimination method it is netted against the asset first.` },
        { title: "Revaluation surplus accounting", text: `A revaluation increase is credited to revaluation surplus in OCI, except to the extent it reverses a decrease previously expensed, which is income. A decrease is expensed, but first charged against any surplus on the same asset. The surplus may be transferred to retained earnings piecemeal as the asset is depreciated (depreciable PPE only) or in a lump sum on derecognition. On disposal the surplus goes directly to retained earnings and never affects the gain or loss. Disclosures include the revaluation date, whether an independent valuer was used, the methods and assumptions, and the historical cost carrying amount of each revalued class.` },
        { title: "Derecognition and subsequent costs", text: `PPE is derecognized on disposal or when no future benefits are expected; the gain or loss is net disposal proceeds less carrying amount, in profit or loss. Subsequent expenditure is capitalized only when it meets the recognition criteria by extending useful life, increasing capacity or efficiency, or improving safety: additions, improvements, replacements (the replaced part is derecognized, estimated from the new part's cost if not identifiable), major inspections, rearrangements that increase efficiency and major non-recurring repairs. Routine repairs are expensed. Encouraged disclosures cover idle PPE, fully depreciated PPE still in use, PPE retired and held for sale, and fair value under the cost model.` }
      ]
    },
    {
      id: "borrowing-costs",
      title: "Borrowing Costs",
      std: "PAS 23",
      summary: [
        `Interest and other borrowing costs are normally expensed. PAS 23 makes an exception for costs directly attributable to acquiring, constructing or producing a qualifying asset, one that necessarily takes a substantial period to get ready for its intended use or sale: these are capitalized as part of the asset's cost. Inventories that take a long time to produce, PPE and intangibles under construction, and investment property under the cost model qualify. Assets measured at fair value, financial assets, routinely mass-produced inventories and assets already ready for use do not. Borrowing costs include effective interest on financial and lease liabilities and exchange differences treated as interest adjustments, but never the cost of equity.`,
        `Only avoidable borrowing costs are capitalized: those that would not have been incurred without the expenditures on the asset.`
      ],
      concepts: [
        { title: "Capitalization period", text: `Capitalization starts only when all three conditions are met: expenditures are being incurred, borrowing costs are being incurred, and activities to prepare the asset (including technical and administrative work such as permits and plans) are under way. Merely holding land for future development does not qualify. Capitalization is suspended during extended interruptions of active development, but not during substantial technical work or necessary temporary delays. It ceases when substantially all activities are complete, part by part for assets completed in usable stages.` },
        { title: "Specific and general borrowings", text: `For funds borrowed specifically for the asset, the capitalizable amount is actual borrowing costs less investment income earned on temporarily invested proceeds. For general borrowings, it is the lower of actual general borrowing costs and the maximum, which is average accumulated expenditures times the capitalization rate (total interest on general borrowings divided by total general borrowings). Under the traditional mixed method the two amounts are simply added. Under the avoidable interest method, expenditures are first allocated to the specific borrowing and only the excess is averaged and charged to the general rate. Disclose the amount capitalized and the capitalization rate; qualifying assets need not be shown separately.` }
      ]
    },
    {
      id: "depletion",
      title: "Depletion of Natural Resources",
      std: "PFRS 6",
      summary: [
        `Exploration and evaluation assets under PFRS 6 are expenditures incurred after obtaining the legal right to explore and before technical feasibility and commercial viability are demonstrated. The entity sets its own recognition policy without applying the PAS 8 hierarchy, measures the assets at cost (rights, studies, drilling, sampling and directly attributable overhead) and afterward uses the cost or revaluation model. They are classified as tangible or intangible by nature and tested for impairment when the right expires, no further spending is planned, no viable discovery is made, or recovery looks unlikely.`,
        `Wasting assets are natural resources that are consumed physically and cannot be replaced. Depletion is the systematic allocation of the depletable amount over the periods of extraction, normally by the output method; it starts with extraction and ends at the earlier of physical exhaustion and derecognition. Depletion is part of inventory cost and flows to cost of goods sold when the output is sold.`
      ],
      concepts: [
        { title: "Cost of a wasting asset", text: `Cost has four parts. Acquisition cost is the price for the right to search for and extract the resource, with land value treated as the residual value. Exploration costs are capitalized either under successful efforts (only successful exploration, typical of large corporations) or full cost (all exploration, typical of small ones). Development costs for extraction are included only when intangible; tangible development costs such as movable and immovable equipment are PPE. Restoration costs are capitalized at present value only when the obligation exists at acquisition.` },
        { title: "Depletion and changes in estimate", text: `The depletion rate is the depletable amount divided by estimated recoverable units, and depletion for the year is the rate times units extracted. Extraction costs are not part of the wasting asset; they go to inventory. Reserves and residual value are reviewed at each reporting date and revisions are prospective: the carrying amount at the start of the period becomes the new depletable base. Tangible development costs are depreciated by straight-line over the shorter of their own life and the wasting asset's life, except immovable equipment with a life longer than the resource, which uses the output method.` },
        { title: "Shutdown and the wasting asset doctrine", text: `During a shutdown there is no depletion, but depreciation continues because the equipment is still available for use; immovable equipment on the output method switches to straight-line over its remaining life (a change in estimate) and switches back when extraction resumes. A wasting asset corporation may pay dividends up to unappropriated retained earnings plus accumulated depletion, less capital liquidated in prior years and unrealized depletion in ending inventory; the excess over retained earnings is a liquidating dividend, an exception to the trust fund doctrine.` }
      ]
    },
    {
      id: "grants",
      title: "Government Grants",
      std: "PAS 20",
      summary: [
        `Government assistance is any government action giving an economic benefit to a specific entity or class of entities. A government grant is assistance delivered as a transfer of resources in return for past or future compliance with conditions on operating activities. All grants are assistance, but assistance that cannot be reasonably valued (free advice, guarantees, procurement policies) is only disclosed. PAS 20 does not cover tax benefits, government ownership, grants in hyperinflationary economies or PAS 41 grants.`,
        `A grant is recognized only when there is reasonable assurance that the entity will comply with the conditions and the grant will be received; receipt alone is not conclusive. Cash grants are measured at face value, receivables at fair value, forgivable loans at the loan's carrying amount, and below-market loans at the discount on the loan. Non-monetary grants are measured at fair value or at nominal amount plus direct costs.`
      ],
      concepts: [
        { title: "Income recognition", text: `Grant income is recognized in profit or loss on a systematic basis over the periods in which the related costs are expensed (matching). A grant for specific expenses is recognized over the period of those expenses; a grant for a depreciable asset in proportion to depreciation; a grant for a non-depreciable asset with conditions over the periods bearing the cost of meeting them; and a grant for costs already incurred or for immediate support in the period it becomes receivable.` },
        { title: "Presentation", text: `Grants related to assets (the primary condition is to buy, build or acquire long-term assets) are presented gross as deferred income amortized to other income, or net by deducting the grant from the asset's carrying amount so that depreciation is reduced. Grants related to income are shown gross as other income or net against the related expense. Either way the net effect on profit or loss is identical.` },
        { title: "Repayment of grants", text: `A grant that becomes repayable because conditions were not met is a change in accounting estimate handled prospectively. Under approach 1 (income grants, and asset grants presented gross) the repayment first reduces any unamortized deferred income and the excess is expensed. Under approach 2 (asset grants presented net) the asset's carrying amount is increased by the repayment and the cumulative extra depreciation that would have been recognized without the grant is expensed immediately. Disclosures cover the policy, nature and extent of grants and unfulfilled conditions, but not the agency's name or the dates of sanction or receipt.` }
      ]
    },
    {
      id: "intangibles",
      title: "Intangible Assets",
      std: "PAS 38",
      summary: [
        `An intangible asset is an identifiable non-monetary asset without physical substance. Identifiability distinguishes it from goodwill: the asset is either separable (can be sold, licensed or rented on its own or with a related item) or arises from contractual or legal rights. The entity must also control the future economic benefits, usually through legally enforceable rights. Goodwill from a business combination, financial assets, exploration assets, deferred taxes and intangibles held for sale fall under other standards.`,
        `Separately acquired intangibles are measured at purchase price plus directly attributable costs such as employee benefits, professional fees and testing, excluding launch costs, training and overhead. Intangibles acquired in a business combination are recorded at acquisition-date fair value separately from goodwill; those from government grants at fair value or nominal amount plus direct costs; and those from exchanges follow the same commercial substance rules as PPE.`
      ],
      concepts: [
        { title: "Research and development", text: `Internally generated intangibles are capitalized only from the date the recognition criteria are first met. Research costs (searching for new knowledge, evaluating alternatives) are always expensed. Development costs are capitalized only when all six criteria are met: technical feasibility, intention to complete, ability to use or sell, probable future benefits (for example an existing market), adequate resources, and reliable measurement. If the two phases cannot be separated, treat everything as research. R&D equipment with an alternative use is capitalized and depreciated into R&D expense; with no alternative use it is expensed. Internally generated brands, mastheads, publishing titles, customer lists and goodwill are never recognized.` },
        { title: "Subsequent measurement and amortization", text: `Each class uses the cost model or, only where an active market exists, the revaluation model. Finite-life intangibles are amortized over useful life from the date they are available for use, with impairment testing when indicators exist; indefinite-life intangibles are not amortized but tested annually. Residual value is presumed zero unless a third party is committed to buy the asset or an active market will exist at the end of its life. Straight-line applies when the pattern of consumption cannot be determined, and revenue-based amortization is presumed inappropriate. Subsequent costs are generally expensed.` },
        { title: "Marketing, customer and artistic intangibles", text: `A trademark has a 10-year legal life renewable indefinitely under R.A. 8293, so it is not amortized and is tested for impairment annually; litigation costs to defend it are expensed. A masthead or customer list is recognized only when purchased. Website costs are capitalized only for internal sites or external sites that take orders, and only for application, infrastructure and graphical design work; planning, content and operating costs are expensed. A copyright (author's life plus 50 years) is measured at the costs to produce the work and secure the right.` },
        { title: "Contract and technology intangibles", text: `A franchise includes the initial fee plus legal and acquisition costs, amortized over the shorter of useful life and the definite term, or not amortized if perpetual; revenue-based periodic fees are expensed. A leasehold right is amortized over the lease, while leasehold improvements are PPE depreciated over the shorter of lease term and improvement life. A patent (20-year legal life) is amortized over the shorter of legal and useful life; a competing patent bought for protection is amortized over the original's remaining life, and defense costs are expensed even when successful. Software costs before technological feasibility are research; coding, testing and masters afterward are capitalized; copies for resale are inventory; software integral to hardware is PPE.` },
        { title: "Goodwill", text: `Goodwill is the capacity to earn above-normal returns from reputation, staff, location and loyal customers. Only goodwill from a business combination is recognized. Under the residual approach it equals the purchase price less the fair value of identifiable net assets, and a negative result is a gain on bargain purchase in profit or loss. Direct approaches value goodwill by purchasing, capitalizing or discounting excess earnings over normal earnings. Goodwill is not amortized but tested for impairment annually, and goodwill impairment is never reversed.` }
      ]
    },
    {
      id: "impairment",
      title: "Impairment of Assets",
      std: "PAS 36",
      summary: [
        `The core principle is that no asset is carried above its recoverable amount. An asset is impaired when its carrying amount exceeds recoverable amount, the higher of fair value less costs to sell and value in use. PAS 36 covers PPE, investment property under the cost model, intangibles, and investments in associates, joint ventures and subsidiaries. There is no test unless an impairment indicator exists, except indefinite-life intangibles and acquired goodwill, which are tested annually regardless.`,
        `External indicators include a significant decline in market value, adverse technological or market changes, higher interest rates affecting the discount rate, and net assets exceeding market capitalization. Internal indicators include obsolescence or damage, adverse changes in use and worse-than-expected economic performance.`
      ],
      concepts: [
        { title: "Recoverable amount", text: `Fair value less costs to sell is the exit price in an orderly transaction less incremental disposal costs (legal costs, stamp duty, removal and preparation costs) excluding finance costs and income tax. Value in use is the present value of estimated future net cash flows using pre-tax cash flows and a pre-tax rate, including inflows from continuing use, the outflows needed to generate them and net disposal proceeds at the end of life, but excluding uncommitted restructuring, enhancement spending, financing and taxes. Projections are based on recent budgets for up to five years and extrapolated beyond that with a steady or declining growth rate. Both amounts need not be computed if either exceeds carrying amount; a perpetuity (cash flow over discount rate) gives the value in use of an indefinite-life intangible.` },
        { title: "Recognition and cash-generating units", text: `An impairment loss goes to profit or loss, except that for a revalued asset it first reduces the revaluation surplus. Subsequent depreciation allocates the revised carrying amount over the remaining life. When an asset does not generate independent cash inflows, the test is done on its cash-generating unit, the smallest group of assets with largely independent inflows, including only directly attributable or reasonably allocated assets and excluding liabilities unless recoverable amount cannot be determined without them. A CGU loss is allocated first to goodwill and then pro rata to other non-cash assets by carrying amount, but no asset is reduced below the highest of its FVLCS, VIU and zero; the excess is reallocated. Corporate assets such as head office buildings are tested through the CGUs they serve.` },
        { title: "Reversal of impairment", text: `If recoverable amount later rises, the carrying amount is increased to the new recoverable amount with the reversal in profit or loss, but for an individual asset the increase cannot exceed the carrying amount that would have existed had no impairment been recognized. Under the revaluation model, any recovery above that ceiling goes to revaluation surplus. CGU reversals are allocated pro rata by carrying amount subject to the same ceilings. Goodwill impairment is never reversed.` }
      ]
    },
    {
      id: "equity-securities",
      title: "Investments in Equity Securities",
      std: "PFRS 9",
      summary: [
        `Equity securities evidence a residual interest in a corporation; redeemable preference shares, treasury shares and convertible debt are excluded. The accounting depends on the level of ownership of ordinary shares: below 20% the investment is a financial asset under PFRS 9 at fair value or cost, 20% to 50% is an associate under PAS 28 using the equity method, and above 50% is a subsidiary under PFRS 3. Preference shares at any level are PFRS 9 investments.`,
        `Under PFRS 9, equity investments are FVPL unless the entity makes an irrevocable election at initial recognition to present fair value changes in OCI (FVOCI), which is not available for held-for-trading investments. FVPL investments are measured at fair value with transaction costs expensed and shown as current assets; FVOCI investments add transaction costs to cost and are non-current. Equity with no reliable fair value stays at cost less impairment. Fair value excludes a dividend when shares are bought dividend-on.`
      ],
      concepts: [
        { title: "Fair value changes and disposal", text: `Unrealized FVPL gains and losses go to profit or loss; unrealized FVOCI gains and losses go to OCI net of deferred tax, either against the investment account (traditional) or through a fair value adjustment account. On disposal, a FVPL or cost-method investment records a realized gain or loss equal to net proceeds (excluding any dividend sold with the shares) less carrying amount. A FVOCI investment is first remeasured to the selling price with the change in OCI, so there is no realized gain or loss; the cumulative OCI is transferred to retained earnings rather than recycled. Because fair value changes already capture losses, fair value investments are not tested for impairment, and transfers between FVPL and FVOCI are not allowed.` },
        { title: "Dividends", text: `Dividend income is recognized when the right to receive it is established, on the declaration date. Cash and property dividends are income. Share dividends of the same class are memo entries (more shares, lower cost per share); share dividends of a different class require allocating original cost by fair value to a new investment account. Shares received in lieu of cash are income at the fair value of the shares or the cash dividend forgone; cash received in lieu of shares is treated as if the shares were sold. Liquidating dividends are a return of investment.` },
        { title: "Splits, assessments and rights", text: `A share split changes the number of shares and cost per share but not total cost, so it is a memo entry; a special assessment increases cost. Stock rights (one per share, letting the holder subscribe at a set price) are derivatives at FVPL when accounted for separately; their theoretical value is market value right-on less market value ex-right, computed as (market value right-on less subscription price) divided by (rights per share plus 1) while trading right-on, or (market value ex-right less subscription price) divided by rights per share afterward. When not separated, the right is an embedded derivative and the whole contract is classified together.` }
      ]
    },
    {
      id: "associates",
      title: "Investments in Associates",
      std: "PAS 28",
      summary: [
        `An associate is an entity, incorporated or not, over which the investor has significant influence: the power to participate in financial and operating policy decisions without control or joint control. Holding 20% or more of voting power, directly or through subsidiaries, creates a rebuttable presumption of significant influence. Qualitative indicators (PaRE ProMI) are participation in policy-making, representation on the board, provision of essential technical information, material transactions, and interchange of managerial personnel. Currently exercisable potential voting rights count when assessing influence, but the share of income uses present ownership only.`,
        `The equity method treats investor and investee as one economic unit. The investment starts at cost plus transaction costs and moves with the investor's share of changes in the associate's equity; the associate's policies are conformed to the investor's and reporting dates may differ by no more than three months. The investment is a non-current asset tested for impairment under PAS 36.`
      ],
      concepts: [
        { title: "Equity method mechanics", text: `The investment account increases for investment income and the share of the associate's OCI, and decreases for dividends received, the share of OCL and impairment. Investment income is the share of profit or loss adjusted for the amortization of under- and over-valued assets and liabilities identified at acquisition, plus any gain on bargain purchase in the year acquired (cost below the share of fair value of net assets); excess cost is goodwill that is not accounted for separately. The share of profit is reduced by one year of cumulative preference dividends whether declared or not, or by non-cumulative dividends only when declared. If the share of losses reaches the investor's total interest (investment, preference shares and unsecured long-term receivables, charged in that order), the investment is reported at zero, further losses are disclosed, and income is recognized again only after it covers the unrecognized losses.` },
        { title: "Intercompany transactions", text: `Upstream sales (associate to investor) and downstream sales (investor to associate) create unrealized profit that the investor eliminates to the extent of its ownership percentage: the share of profit is reduced by unrealized intercompany profit and increased by profit realized in the current period. Profit on inventory and land is realized when sold to outsiders; profit on depreciable assets is realized through depreciation or fully on sale.` },
        { title: "Changes in ownership", text: `In a step acquisition, PFRS 3 measures the initial cost as the current fair value of the original holding plus the cost of the new shares; U.S. GAAP uses original cost plus new cost, with or without a retrospective catch-up. A deemed sale (dilution) occurs when the associate issues shares to others: the dilution gain or loss compares the investor's share of the issuance proceeds with the carrying amount deemed sold (carrying amount times percentage decrease over original percentage), then recycles the related OCI. When significant influence is lost, the equity method stops, the retained interest is remeasured to fair value as FVPL, FVOCI or a non-marketable investment, and the total gain or loss (realized on shares sold plus unrealized on shares retained, less carrying amount, plus recycled OCI) goes to profit or loss.` }
      ]
    },
    {
      id: "debt-securities",
      title: "Investments in Debt Securities",
      std: "PFRS 9",
      summary: [
        `A debt security is essentially a bond: a formal promise to pay a sum at a determinable future date plus periodic interest at a stated rate, evidenced by a certificate under a bond indenture. Bonds may be term or serial, callable (redeemable early at a premium, with the difference in profit or loss), convertible, registered or coupon, or secured by collateral trust.`,
        `Classification follows the business model. Amortized cost (FAC) applies when the asset is held to collect contractual principal and interest; FVOCI when it is held both to collect and to sell; and FVPL, the residual class, when it is held for short-term profit or designated to remove an accounting mismatch. FVPL assets are measured at fair value with transaction costs expensed, fair value changes in profit or loss, no amortization, nominal-rate interest and current classification. FVOCI and FAC assets add transaction costs, are amortized, earn effective-rate interest and are non-current; FVOCI also carries fair value changes in OCI.`
      ],
      concepts: [
        { title: "Premium, discount and fair value", text: `Fair value excludes accrued interest, so interest bought between payment dates is deducted from the price unless stated as plus accrued interest. If no price is given, fair value is the present value of principal and nominal interest at the prevailing rate. For FVOCI and FAC investments, a price above face is a premium whose amortization decreases both carrying amount and interest income; a discount increases both. The cumulative unrealized FVOCI gain or loss is fair value less amortized cost at year-end, shown as a separate equity line, and the current-year amount is the change in that balance.` },
        { title: "Disposal and reclassification", text: `The realized gain or loss is net proceeds (excluding accrued interest) less carrying amount for FVPL or less amortized cost for FAC and FVOCI, and on a FVOCI disposal the cumulative OCI is reclassified to profit or loss; partial disposals no longer taint the portfolio. Reclassification is allowed only when the business model changes and is applied prospectively from the first day of the next reporting period with no restatement. Moving into amortized cost makes fair value the deemed cost at the prevailing effective rate; FVOCI to amortized cost removes cumulative OCI against the asset without touching profit or loss; FVOCI to FVPL recycles cumulative OCI through profit or loss.` },
        { title: "Impairment and reversal", text: `FVPL investments need no impairment test. For FVOCI the impairment loss is amortized cost less fair value at the balance sheet date; for FAC it is amortized cost less the present value of future cash flows at the original effective rate, the same computation used for loans receivable. On recovery, the reversal credited to profit or loss is limited to the amortized cost had no impairment occurred less the latest amortized cost; for FVOCI, any further recovery of fair value above that amount is an unrealized gain in OCI.` }
      ]
    },
    {
      id: "investment-property",
      title: "Investment Property",
      std: "PAS 40",
      summary: [
        `Investment property is land, a building or part of a building, or both, held by the owner or by a lessee as a right-of-use asset to earn rentals or for capital appreciation or both. Only land and buildings qualify. Its cash flows are largely independent of other assets, unlike owner-occupied property used in production, supply or administration, which is PPE under PAS 16. Land held for long-term appreciation or for an undetermined use, buildings leased out under operating leases, vacant buildings held for lease and property under construction for future investment use are investment property; property for future owner use, employee-occupied property, property held for sale in the ordinary course, property built for third parties and property leased out under a finance lease are not.`,
        `Initial measurement is cost including transaction costs, with start-up costs, initial operating losses and abnormal waste excluded. Acquisition rules mirror PPE: cash price equivalent for deferred settlement, direct costs plus borrowing costs for self-construction, and the commercial substance rules for exchanges.`
      ],
      concepts: [
        { title: "Classification issues", text: `When part of a property is investment and part owner-occupied, the portions are accounted for separately if they can be sold or leased separately; otherwise the whole is investment property only if the owner-occupied portion is insignificant. Ancillary services to occupants make the property owner-occupied only when the services are significant. Property rented to a group member is investment property in the owner's separate statements but owner-occupied in the consolidated statements.` },
        { title: "Fair value model vs cost model", text: `One model is applied to all investment property. Under the fair value model the property is carried at fair value without deducting costs to sell and every change goes to profit or loss; there is no depreciation. Under the cost model it is carried at cost less depreciation and impairment, and fair value is disclosed only. Fair value is presumed reliably determinable; if it is not on first acquisition or change in use, that property uses the cost model with zero residual value until disposal. A lessee's operating lease interest classified as investment property must use the fair value model. A change from cost to fair value is a change in policy applied prospectively with the gain or loss in profit or loss; the reverse change is not allowed.` },
        { title: "Transfers", text: `Transfers occur only on evidence of a change in use: the start of owner occupation (to PPE), the start of development for sale (to inventory), the end of owner occupation (from PPE) or the start of an operating lease (from inventory). Under the cost model all transfers are at carrying amount. Under the fair value model, a transfer to owner-occupied or inventory uses fair value as the new cost with the difference in profit or loss; a transfer from owner-occupied property follows revaluation rules (an increase first reverses prior impairment then goes to revaluation surplus; a decrease first absorbs revaluation surplus then is an impairment loss); and a transfer from inventory records a gain or loss in profit or loss.` }
      ]
    },
    {
      id: "funds",
      title: "Funds and Other Investments",
      std: "Cash surrender value, sinking funds",
      summary: [
        `Cash surrender value (CSV) is the amount an insurer will pay if a whole life policy on an employee is cancelled before death; it accumulates from the savings portion of premiums. It is recognized only for whole life policies where the entity is the beneficiary, and is classified as a non-current investment. Long-term funds such as bond sinking funds, preference share redemption funds, plant expansion funds and contingency funds are set aside to meet specific future obligations and are also non-current, except that a sinking fund follows the classification of the bonds it will settle.`
      ],
      concepts: [
        { title: "Cash surrender value", text: `On first recognition the CSV accumulated over the holding period (usually three years) is split: the current year's share reduces life insurance expense and prior years' share is credited to retained earnings. Later increases reduce the current year's expense, and cash dividends from the insurer also reduce the expense. On the employee's death the CSV is updated to the date of death and the gain is proceeds less the carrying amount of CSV plus the unexpired premium.` },
        { title: "Bond sinking fund", text: `A fund set aside, by contract or voluntarily, to retire bonds payable. When the entity administers it, every transaction is journalized, income is recorded when earned and retained earnings are appropriated for each increase. When a trustee administers it, only contributions, changes in balance and settlements are recorded, with income recognized on receipt of the fund statement and computed as ending balance less beginning balance plus expenses paid less contributions. Required contributions use future value factors: FV of 1 for a lump sum, FV of an ordinary annuity for year-end contributions and FV of an annuity due for contributions starting today.` }
      ]
    }
  ]
});
window.FAR_BRANCHES.push({
  id: "liabilities",
  title: "Liabilities",
  color: "var(--c-liabilities)",
  tag: "Present obligations from past events",
  summary: [
    `A liability is a present obligation to transfer an economic resource as a result of past events. The topics on this side move from the general to the specific: what makes something a liability and when it is current, then the financial liabilities measured at amortized cost (notes, loans, bonds and compound instruments), then the estimated and non-financial obligations where measurement requires judgment (provisions, employee benefits, deferred taxes) and finally leases, which put a right-of-use asset and a lease liability on the lessee's books.`,
