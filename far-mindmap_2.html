    `Two measurement rules recur. Financial liabilities at amortized cost start at fair value less transaction costs and accrue interest at the effective rate, so premiums and discounts amortize through interest expense. Non-financial liabilities are measured at the best estimate of the outflow, discounted when the time value of money is material.`
  ],
  topics: [
    {
      id: "current-liabilities",
      title: "Current Liabilities",
      std: "Conceptual Framework, PAS 1, PAS 32",
      summary: [
        `Under the 2018 Conceptual Framework a liability has three essential characteristics. There must be a present obligation the entity has no practical ability to avoid, and the payee need not be identified. The obligation must have the potential to require a transfer of an economic resource (cash, non-cash assets or future services), which is why stock dividends payable is equity rather than a liability. And the obligation must result from a past event: the entity has already obtained benefits or taken an action that leaves it with no realistic alternative but to settle, whether legally or constructively.`,
        `A liability is current if any PAS 1 criterion is met: it will be settled within the normal operating cycle, it is held for trading, it is due within 12 months, or the entity lacks an unconditional right to defer settlement for at least 12 months. Trade payables, held-for-trading liabilities, the current portion of long-term debt, short-term borrowings, current provisions, current tax, bank overdrafts, credit balances in AR, unearned income realizable within a year, accrued expenses, refundable deposits, payroll taxes, VAT payable and escrow liabilities are typical examples.`
      ],
      concepts: [
        { title: "Financial vs non-financial liabilities", text: `A financial liability (PAS 32) is a contractual obligation to deliver cash or another financial asset, to exchange financial instruments on potentially unfavorable terms, or a contract settled in a variable number of the entity's own equity instruments; accounts, notes, loans and bonds payable and lease liabilities qualify. Non-financial liabilities such as warranty liabilities, customer advances, unearned income and income tax payable are the residual. Financial liabilities at FVPL (by designation or held for trading) are measured at fair value with changes in profit or loss, except that changes from the entity's own credit risk go to OCI; transaction costs are expensed. Financial liabilities at amortized cost start at fair value less transaction costs (fees, commissions, levies, transfer taxes, but not premiums, discounts or internal costs) and accrue interest at the effective rate. Non-financial liabilities are measured at the best estimate of the outflow, discounted if material.` },
        { title: "Refinancing and breach of covenants", text: `A currently maturing obligation is current unless the entity has an unconditional right to refinance it, or, lacking that right, completed the refinancing (by extending maturity or issuing new bonds) on or before the balance sheet date; refinancing after year-end leaves it current. A breach of covenant makes long-term debt immediately demandable and therefore current, unless the creditor granted a grace period of at least 12 months after the balance sheet date and did so on or before that date. A grace period shorter than 12 months or granted after year-end leaves the debt current.` },
        { title: "Trade accounts payable adjustments", text: `To adjust the AP balance, add back post-dated and unreleased checks, debit balances in AP if the balance is shown net, and discounts forfeited under the net method; deduct unrecorded purchase returns and allowances; and apply freight terms. Goods in transit FOB shipping point increase both AP and purchases, while FOB destination goods are ignored until arrival. Freight prepaid by the seller on FOB shipping point terms increases AP; freight collect paid by the buyer on FOB destination terms decreases AP; the other two combinations have no effect.` },
        { title: "Unearned income, deposits and other payables", text: `Unearned revenue is cash received before it is earned, from goods (customer advances), services (subscriptions, service contracts), use of resources (unearned interest or rent) and gift certificates; it is current when realizable within a year. The T-account solves for the earned portion or ending balance: beginning balance plus receipts less earned portion (and, for gift certificates, less redemptions and expirations). Refundable deposits and escrow liabilities follow the same template with deposits returned, applied, cancelled or expired on the debit side. Payroll taxes payable comprise income tax, SSS, PhilHealth and Pag-IBIG amounts withheld from employees until remitted, plus the employer's own SSS contribution.` }
      ]
    },
    {
      id: "notes-payable",
      title: "Notes Payable, Debt Restructuring and Loans Payable",
      std: "PFRS 9",
      summary: [
        `A note payable is evidenced by an unconditional written promise to pay a sum certain on demand or at a fixed future time. Notes at FVPL (held for trading, such as the obligation from a short sale, or designated) are measured at fair value with changes in profit or loss and interest at the nominal rate. Notes at amortized cost are measured at fair value less transaction costs and accrue interest at the effective rate. The fair value of a note at amortized cost depends on its type: short-term notes at face value (unless discounting is material); long-term interest-bearing notes at face value if the rate is reasonable and at present value if not; long-term non-interest-bearing notes at present value.`,
        `Loans payable from banks and other financial institutions are measured initially at face value less origination fees, which the lender treats as unearned interest; subsequent measurement is amortized cost using the effective interest method.`
      ],
      concepts: [
        { title: "Present value and classification", text: `Present value is found in four steps: identify the contractual cash flows (principal only, or nominal interest plus principal), fix their timing, choose the factor (PV of 1 for a lump sum, PV of an ordinary annuity for equal payments starting one period later, PV of an annuity due for payments starting today) and multiply. Subsequent measurement comes from an amortization table. A trade note payable is wholly current. A non-trade note with no principal repayments is non-current unless currently maturing; with installments, the current portion is the principal due within 12 months, less implied interest if the note is carried at present value.` },
        { title: "Asset and equity swaps", text: `In debt restructuring the creditor grants a concession it would not otherwise give because of the debtor's financial difficulty, so the debtor usually records a gain. In an asset swap the liability including accrued interest is derecognized and the gain on extinguishment is the total liability less the carrying amount of the asset given (U.S. GAAP splits this into a gain or loss on exchange, fair value less carrying amount of the asset, and a gain on restructuring, liability less fair value). In an equity swap the gain is the total liability less the initial measurement of the equity issued, taken in order of priority as the fair value of the equity instruments, then the fair value of the liability, then its carrying amount.` },
        { title: "Modification of terms", text: `A modification reduces interest, forgives unpaid interest, grants a moratorium, extends maturity or reduces the amount due. Under PFRS 9 the modification is substantial, and treated as extinguishing the old liability and recognizing a new one, when the present value of the modified cash flows discounted at the original effective rate differs from the carrying amount by at least 10%. If substantial, the new liability is measured at fair value (present value at the prevailing market rate) and the difference from the old carrying amount is a gain or loss in profit or loss, with modification costs included in that gain or loss. If not substantial, the costs are deducted from the carrying amount and amortized.` }
      ]
    },
    {
      id: "bonds-payable",
      title: "Bonds Payable",
      std: "PFRS 9",
      summary: [
        `A bond is a contract of debt in which the issuer borrows from bondholders under a bond indenture that sets out the terms and the parties' rights, with certificates evidencing ownership. Bonds are classified by maturity (term, serial, extendable, retractable), by transfer and interest payment (registered, coupon or bearer, zero-coupon, income, participating), by security (mortgage, collateral trust, debenture, junk) and by redemption (callable by the issuer, convertible by the holder).`,
        `Bonds at amortized cost are measured initially at fair value less bond issue costs, which raises the effective rate; bonds at FVPL expense issue costs and carry fair value changes in profit or loss. Fair value excludes accrued interest, so the issue price between interest dates is fair value less transaction costs plus accrued interest. When the initial measurement differs from face value the difference is a premium or discount.`
      ],
      concepts: [
        { title: "Premium and discount", text: `A premium arises when the initial measurement exceeds face value because the nominal rate is above the effective rate; its amortization is deducted from interest expense, so expense is lower than the interest paid. A discount arises when the initial measurement is below face value because the nominal rate is below the effective rate; its amortization is added, so expense is higher than interest paid. Interest paid always uses the nominal rate on face value and interest expense uses the effective rate on carrying amount.` },
        { title: "Retirement of bonds", text: `Retirement at maturity produces no gain or loss: bonds payable at carrying amount (face value) are debited and cash credited. Retirement before maturity compares the retirement price, excluding any accrued interest paid, with the carrying amount at the retirement date; the difference is a gain or loss in profit or loss. Bond refunding is premature retirement financed by issuing new bonds.` }
      ]
    },
    {
      id: "compound-instruments",
      title: "Compound Financial Instruments",
      std: "PAS 32",
      summary: [
        `PAS 32 paragraph 28 defines a compound financial instrument as one containing both a liability and an equity element from the issuer's perspective; a typical instrument is an asset to one party and either a liability or equity to the other, while a compound instrument is a liability and equity at once. The components are accounted for separately according to the substance of the contract using the residual approach: the fair value of the liability component (the present value of the contractual cash flows of plain bonds) is measured first, and the remainder of the consideration is the equity component.`
      ],
      concepts: [
        { title: "Bonds with share warrants", text: `Warrants give bondholders the right to buy shares at a set price in the future; they may be detachable or not. The bonds and the warrants are independent securities: exercising the warrants does not extinguish the bonds, and retiring the bonds does not kill the warrants. At issuance, cash is debited, bonds payable credited at face with a premium or discount, and the residual credited to ordinary share warrants outstanding (OSWO), which sits within share premium. On exercise, cash at the exercise price plus the OSWO balance is credited to share capital and share premium; on expiration OSWO is transferred to share premium.` },
        { title: "Convertible bonds", text: `Convertible bonds can be exchanged for the issuer's shares, so the issue price is allocated between bonds payable and the bond conversion privilege (BCP), also within share premium. Unlike warrants, the two components are interrelated. On conversion the updated carrying amount of the bonds (face plus unamortized premium or less discount) and the BCP are transferred to share capital and share premium, with no cash involved. On retirement before maturity the price is allocated between the bond and equity components consistent with the original allocation: the bond portion yields a gain or loss in profit or loss, while a gain on the BCP goes to share premium and a loss is charged first to related share premium then retained earnings. At maturity without conversion there is no gain or loss and the BCP balance is credited to share premium, as it is on expiration.` }
      ]
    },
    {
      id: "provisions",
      title: "Provisions and Contingencies",
      std: "PAS 37",
      summary: [
        `A provision is a present obligation of uncertain timing or amount. The uncertainty concerns the amount and timing, not the existence of the obligation, and the payee need not be identifiable. The obligation may be legal (from a contract, legislation or law) or constructive (the entity's past practice, published policy or current statement has created a valid expectation that it will accept the responsibility). A provision is recognized when there is a present obligation from a past event, an outflow of benefits is probable and the amount can be measured reliably.`,
        `The probability scale drives the treatment. A virtually certain or probable outflow (above 50%) is accrued as a provision; a possible outflow (5% to 50%) is a contingent liability disclosed in the notes; a remote outflow is ignored. On the asset side, a virtually certain inflow is accrued, a probable inflow is a contingent asset disclosed in the notes, and anything less is ignored.`
      ],
      concepts: [
        { title: "Measurement rules", text: `A provision is the best estimate of the expenditure needed to settle the obligation at the reporting date, the amount the entity would rationally pay to settle or transfer it. For a single obligation this is the most likely outcome; for a large population it is the expected value; for a continuous range with equally likely points it is the midpoint. Risks are reflected through a risk adjustment factor, and present value is used when the time value of money is material. Future events count only with sufficient objective evidence, gains on expected asset disposals are ignored, and reimbursements are recognized as a separate asset only when virtually certain (though the income may be offset against the expense). Provisions are reviewed at every reporting date. Future operating losses are never provided for, and an onerous contract is provided at the lower of the cost of fulfilling it and the penalty for failing to.` },
        { title: "Premiums and warranties", text: `The general entry debits expense and credits an estimated liability, except that provisions directly attributable to an asset, such as decommissioning or restoration costs, are debited to the asset. Premiums (toys, dishes, cash) are given to customers because of past sales; the expense is accrued on sale as premiums expected to be distributed times net cost (cost less customer reimbursement), and actual distributions reduce the liability. Warranties create a constructive obligation at the point of sale; the expense is accrued on sale and actual repair costs reduce the liability. Before accruing at year-end, confirm the liability is still probable (warranties may have expired). Premiums and warranties are usually current provisions; decommissioning liabilities are non-current.` },
        { title: "Other common provisions", text: `A lawsuit provision arises when the damage is caused; a decommissioning cost when a law or contract imposes it (increases are added to the asset or recorded as impairment, decreases reduce the asset); a guarantee when the guaranteed party defaults. A restructuring provision requires a detailed formal plan and a valid expectation raised by starting to implement it or announcing its main features; it includes only direct expenditures necessarily entailed by the restructuring, such as salaries of employees after operations cease, and excludes retraining or relocating continuing staff, marketing the new image and investing in new systems. Disclosures include a reconciliation for each class and the timing, assumptions, nature, uncertainties and reimbursements.` }
      ]
    },
    {
      id: "employee-benefits",
      title: "Employee Benefits",
      std: "PAS 19",
      summary: [
        `Employee benefits are all forms of consideration given for services rendered or for termination of employment, and employees include directors and management. PAS 19R groups them as SPOT: short-term benefits, post-employment benefits, other long-term benefits and termination benefits. Short-term benefits (salaries, social security contributions, paid leave, bonuses payable within 12 months, non-monetary benefits) involve no actuarial assumptions: unpaid amounts are accrued, advance payments are prepaid, and the cost is expensed unless it belongs in the cost of an asset.`,
        `Post-employment benefits (pensions, lump sums, post-employment insurance and medical care) come from formal or informal plans. In a defined contribution plan the employer commits to fixed contributions and the employee bears the risk of a shortfall, so expense equals the required contribution. In a defined benefit plan the employer promises a definite benefit and bears the risk, so expense is computed through actuarial steps. Plans may also be contributory or non-contributory, funded or unfunded, multi-employer, or insured (defined benefit if the employer retains the obligation to cover any shortfall).`
      ],
      concepts: [
        { title: "Compensated absences and bonuses", text: `Accumulating absences carry forward and are vesting (paid out on leaving) or non-vesting; non-accumulating absences lapse and are automatically non-vesting. A profit sharing or bonus plan creates a constructive obligation when the entity has no realistic alternative but to pay and a reliable estimate exists. With P as profit before bonus and tax, B the bonus rate and T the tax rate: bonus on income before bonus and tax is P times B; bonus on income after bonus but before tax is P less P over (1 plus B); bonus on income after tax but before bonus is P times (1 less T) over ((1 over B) less T); bonus on income after both is P times (1 less T) over ((1 over B) less T plus 1).` },
        { title: "Defined benefit obligation and plan assets", text: `The defined benefit obligation (DBO) is the present value of expected future payments for service to date, built up by the projected unit credit method. It increases for current service cost, past service cost (plan amendments or curtailments, expensed immediately whether vested or not), interest expense (beginning DBO times the discount rate on high-quality corporate bonds) and actuarial losses; it decreases for actuarial gains, benefits paid and settlements. Actuarial gains and losses arise from experience adjustments and changes in demographic and financial assumptions, which must be unbiased and mutually compatible. The fair value of plan assets (FVPA), held by a legally separate fund or qualifying insurance policies beyond the reach of creditors, increases for contributions and actual return (interest income at the same discount rate plus a remeasurement gain) and decreases for benefits paid and settlements.` },
        { title: "Net defined benefit liability and cost", text: `FVPA below DBO is a deficit, reported as a net defined benefit liability (accrued pension); FVPA above DBO is a surplus, reported as a net asset limited to the asset ceiling (the present value of refunds and reductions in future contributions). Only the net amount appears on the balance sheet; DBO and FVPA are memorandum records. Defined benefit cost has three parts: service cost (current and past service cost plus or minus settlement losses and gains) in profit or loss; net interest (interest expense on DBO less interest income on FVPA plus interest on the asset ceiling) in profit or loss; and remeasurements (actuarial gains and losses, the difference between actual return and interest income, and asset ceiling changes) in OCI.` },
        { title: "Other long-term and termination benefits", text: `Other long-term benefits (long service leave, jubilee benefits, long-term disability, deferred compensation) are measured like a defined benefit obligation (present value of the obligation less plan assets), but every component of cost goes to profit or loss. Termination benefits arise from the entity's decision to terminate before normal retirement or the employee's acceptance of an offer; the obligating event is the termination, so the expense and liability are recognized at the earlier of when the offer can no longer be withdrawn and when a related restructuring cost is recognized. They follow short-term rules if settled within 12 months and other long-term rules otherwise.` }
      ]
    },
    {
      id: "income-taxes",
      title: "Income Taxes",
      std: "PAS 12",
      summary: [
        `PAS 12 applies to all entities. Accounting income is computed under PFRS for external reporting; taxable income is computed under tax law to determine tax payable. Permanent differences are items in one measure but never the other: non-taxable income such as interest on government securities, income subject to final tax, and non-deductible expenses such as fines, goodwill impairment, expropriation losses and life insurance premiums where the entity is the beneficiary. They affect only current tax.`,
        `Temporary differences are differences between the carrying amount of an asset or liability and its tax base that reverse in later periods. PAS 12 requires the balance sheet method, which captures all temporary differences, not just timing differences in the income statement. Deferred tax assets and liabilities are not discounted, are always non-current, and are presented separately even though the related expense and benefit are netted into one total income tax expense.`
      ],
      concepts: [
        { title: "Taxable and deductible differences", text: `A taxable temporary difference (TTD) produces future taxable amounts and a deferred tax liability: financial income exceeds taxable income now, an asset's carrying amount exceeds its tax base, or a liability's carrying amount is below its tax base. Examples are installment sales, prepayments, straight-line depreciation for books with accelerated depreciation for tax, and revaluation surplus. A deductible temporary difference (DTD) produces future deductible amounts and a deferred tax asset: financial income is below taxable income, an asset's carrying amount is below its tax base, or a liability's carrying amount exceeds its tax base. Examples are unearned income, accrued expenses, accelerated book depreciation and bad debt expense.` },
        { title: "Tax base and computation", text: `The tax base of an asset is the amount deductible against future taxable profit (cost less tax depreciation; zero if taxable only on collection; carrying amount if no tax consequence). The tax base of a liability is its carrying amount less the amount deductible in the future. The computation starts with accounting income, removes permanent differences to reach profit subject to tax, then adjusts for the increase or decrease in TTDs and DTDs to reach taxable income. Taxable income times the current rate is current tax expense; the movement in TTDs and DTDs times the future enacted rate is the deferred tax expense or benefit. Total income tax expense is current tax plus the net deferred movement. Current tax expense normally equals current tax liability unless quarterly payments and credits reduce it.` },
        { title: "Recognition and allocation", text: `A deferred tax liability is recognized for all TTDs except those from non-deductible goodwill, from the initial recognition of an asset or liability outside a business combination that affects neither accounting nor taxable income, and from undistributed profits of subsidiaries, associates and joint ventures when the investor controls reversal and reversal is not probable. A deferred tax asset is recognized for all DTDs and loss carryforwards when future taxable income is probable. Intraperiod allocation spreads tax expense across continuing operations, discontinued operations, OCI and items in equity; interperiod allocation is the recognition of deferred taxes. Current tax goes in the current section of the balance sheet and deferred tax in the non-current section.` }
      ]
    },
    {
      id: "leases",
      title: "Leases",
      std: "PFRS 16",
      summary: [
        `A lease is a contract, or part of one, that conveys the right to use an identified asset for a period in exchange for consideration. The customer must obtain substantially all the economic benefits from use (such as exclusive use) and direct how and for what purpose the asset is used throughout the period. An asset is identified when specified explicitly or implicitly; a portion counts only if physically distinct or substantially all the capacity, and a supplier's substantive substitution right means there is no identified asset. The lease term is the non-cancellable period plus extension options reasonably certain to be exercised and termination options reasonably certain not to be.`,
        `The lessee follows a single finance lease model: a right-of-use asset and a lease liability are recognized at commencement. Two optional exemptions allow operating lease accounting (expense on a straight-line basis): short-term leases of 12 months or less without a purchase option, elected by class of asset, and low-value leases judged on the asset's value when new (computers, furniture, telephones). Lessors keep the PAS 17 split between operating and finance leases.`
      ],
      concepts: [
        { title: "Lease liability", text: `The lease liability is the present value of unpaid lease payments: fixed payments less incentives receivable, variable payments based on an index or rate, expected residual value guarantee payments, the exercise price of a purchase option that is reasonably certain, and termination penalties when the term reflects termination. Executory costs are expensed. The discount rate is the rate implicit in the lease (which equates the present value of payments plus unguaranteed residual value with the asset's fair value plus the lessor's initial direct costs) or, if not readily determinable, the lessee's incremental borrowing rate. The liability is then carried like an amortized cost financial liability, presented separately or within other liabilities in current and non-current portions.` },
        { title: "Right-of-use asset", text: `The ROU asset's cost is the initial lease liability plus payments made at or before commencement (less incentives received), the lessee's initial direct costs and the present value of dismantling and restoration costs. It is carried under the cost model unless it belongs to a revalued PPE class (revaluation model allowed) or meets the investment property definition under the fair value model. Depreciation starts at commencement and runs over the asset's useful life if ownership transfers or a purchase option is reasonably certain, otherwise over the shorter of useful life and lease term. The asset is non-current, shown separately or within the related asset class with disclosure.` },
        { title: "Other lessee issues", text: `Lease and non-lease components are separated and consideration is allocated by relative stand-alone price. Variable payments tied to an index or rate are included at the commencement level and adjusted when the index changes; payments based on sales or usage are expensed when triggered; in-substance fixed payments are treated as fixed. A residual value guarantee counts for the lessee only when given by the lessee or a related party, and only if the asset reverts to the lessor. A modification is a separate lease when it adds the right to use another asset at a commensurate price.` },
        { title: "Lessor accounting", text: `A lessor classifies a lease as a finance lease when it transfers ownership, contains a bargain purchase option, covers the major part of economic life (75% under U.S. GAAP), or has payments with a present value of substantially all of fair value (90%); specialized assets, lessee-borne cancellation losses, lessee exposure to residual value changes and below-market renewals are supporting indicators. Classification happens at inception (the earlier of the agreement and commitment dates) and recognition at commencement. In a direct financing lease the lessor earns only interest: gross investment (gross rentals plus residual value, guaranteed or not, if the asset reverts) less net investment (asset cost plus initial direct costs) is unearned interest income, with initial direct costs spread over the term. In a sales-type lease the lessor also earns dealer profit: sales equal the lower of net investment (present value of rentals plus residual value) and fair value, cost of sales equals asset cost plus initial direct costs, which are expensed immediately. Under an operating lease the lessor keeps and depreciates the asset, recognizes income on a straight-line basis, amortizes initial direct costs and lease bonuses over the term, and treats refundable deposits as a liability.` },
        { title: "Sale and leaseback", text: `Both parties first determine under PFRS 15 whether the transfer is a sale. If it is, the seller-lessee measures the ROU asset as the proportion of the previous carrying amount relating to the right retained and recognizes only the gain or loss on the rights transferred, while the buyer-lessor accounts for the purchase and then applies lessor accounting. Below-market terms are treated as prepaid lease payments and above-market terms as additional financing, measured by the more determinable of the fair value difference or the present value difference against market rates. If the transfer is not a sale, the seller keeps the asset and records the proceeds as a financial liability, and the buyer records a financial asset.` }
      ]
    }
  ]
});
window.FAR_BRANCHES.push({
  id: "equity",
  title: "Shareholders' Equity",
  color: "var(--c-equity)",
  tag: "Residual interest in net assets",
  summary: [
    `Shareholders' equity is the residual interest in net assets: assets less liabilities. PAS 1 suggests three subdivisions: contributed capital (share capital, subscribed share capital and share premium, less subscriptions receivable), accumulated comprehensive income (unappropriated and appropriated retained earnings plus accumulated OCI) and contra-equity deductions (treasury shares, discount on share capital, capital liquidated).`,
    `The topics cover how equity is created and reduced (issuance, subscriptions, retirement, treasury shares, warrants and conversions), how earnings are retained and distributed (appropriations, cash, property, share, scrip and liquidating dividends, recapitalization and quasi-reorganization), how share-based payments create equity or liabilities, and the two per-share measures the exam loves: book value per share and earnings per share.`
  ],
  topics: [
    {
      id: "she-components",
      title: "Components and Share Transactions",
      std: "PAS 1, PAS 32",
      summary: [
        `Share premium comes from issue prices above par, capital gains on treasury share and retirement transactions, stock dividends issued at market value above par, warrants and options outstanding, donated capital, quasi-reorganization and forfeited subscriptions. Accumulated OCI is shown line by line: cash flow hedges, foreign currency translation, FVOCI fair value changes, revaluation surplus, employee benefit remeasurements and own credit risk changes. Ordinary shares carry residual returns and voting rights and may be no-par; preference shares carry fixed returns, priority in liquidation, no voting rights, must have par value and may be convertible, redeemable or come with warrants.`,
        `Legal capital is the paid-in capital that cannot be returned to shareholders during the corporation's life: share capital, subscribed share capital, share dividends payable and, for no-par shares, share premium in excess of stated value; subscriptions receivable is ignored. Reserves, a PAS 1 minimum line item, are total share premium plus total OCI plus appropriated retained earnings.`
      ],
      concepts: [
        { title: "Issuance and subscriptions", text: `Under the memorandum method (most common) no entry is made at authorization and share capital is a maintained account; under the journal entry method authorized share capital is credited and unissued share capital debited at authorization, so share capital is the residual. A subscription debits subscription receivable and credits subscribed share capital, which moves to share capital on full collection. Subscriptions receivable is deducted from contributed capital unless due within 12 months, when it is a current asset. Shares issued below par create a discount on share capital, a contra-equity account. Par value is fixed in the articles and sets the minimum price; no-par shares have a stated value of at least P5.` },
        { title: "Consideration and issuance costs", text: `Shares issued for cash are recorded at face value; for non-cash assets or services at fair value of the consideration, then fair value of the shares, then par. A lump sum for two classes is split by relative fair value, or by the residual method when only one fair value is known (and always for redeemable preference shares, which take fair value with the residual to ordinary). Share issuance costs (underwriting, commissions, legal and accounting fees, printing, documentary stamps, SEC filing, advertising the issue) are deducted from share premium of prior issuances then retained earnings; listing costs such as road shows are expensed; joint costs are allocated pro rata by number of shares.` },
        { title: "Delinquent subscriptions and retirement", text: `Shares of a subscriber who fails to pay on the due date are sold at public auction to the highest bidder: whoever pays the offer price (balance due, accrued interest and sale costs) for the smallest number of shares; the delinquent subscriber keeps the rest. With no bidder, the corporation may buy the shares as treasury shares if it has enough unrestricted retained earnings. Retiring shares (also subject to the trust fund doctrine) at less than the original issue price (share capital plus related share premium) produces a gain credited to share premium from retirement; a higher price produces a loss charged first to that share premium then to retained earnings.` },
        { title: "Treasury shares", text: `Treasury shares are the entity's own previously issued shares that were reacquired and not cancelled; reacquisition requires adequate unrestricted retained earnings. They are recorded at cost (cash paid or carrying amount of non-cash assets given). On reissuance, the selling price less cost (by specific identification, FIFO if silent, or weighted average) is a gain credited to share premium from treasury shares or a loss charged first to that share premium then retained earnings; treasury shares may be reissued below par without discount liability. Retiring treasury shares compares cost with the original issue price, with gains to share premium and losses charged to share premium from treasury shares then retained earnings. Retained earnings are appropriated to the extent of their cost.` },
        { title: "Preference share features and warrants", text: `Redeemable preference shares (holder's option, mandatory redemption date) are financial liabilities: their dividends are interest expense and redemption gains and losses go to profit or loss. Callable preference shares (issuer's option, indefinite date) are equity, retired like other shares. Rights are issued to existing shareholders to protect proportional interests and are memo entries on issuance and expiration; on exercise, cash at the exercise price goes to share capital and share premium. Warrants attached to preference shares are allocated by relative fair value (or residual), and warrants on bonds by the residual approach; the warrant portion is credited to OSWO within share premium, transferred to share premium on exercise or expiration. Convertible preference shares are retired on conversion: a gain goes to ordinary share premium and a loss to retained earnings. Donations from third parties are other income; from shareholders they are donated capital, and donated shares are a memo entry with proceeds on reissuance credited to donated capital.` }
      ]
    },
    {
      id: "retained-earnings",
      title: "Retained Earnings and Dividends",
      std: "PAS 1, IFRIC 17",
      summary: [
        `Retained earnings are cumulative profits not yet distributed. Unappropriated retained earnings are free for dividends; appropriated retained earnings are restricted by law (treasury shares at cost), by contract (bond or preference share redemption) or voluntarily (plant expansion, contingencies). Appropriations limit dividend declarations without affecting total equity or total retained earnings, and are distinct from funding. A debit balance is a deficit; negative total equity is a capital deficiency. The statement of retained earnings reconciles the beginning balance, prior period error restatements, policy changes, net income, dividends and appropriation movements to the ending unappropriated balance.`,
        `Dividends are distributions of earnings or capital in proportion to shareholdings and cannot legally be paid from a deficit. A liability is recognized on the declaration date (or on shareholder approval if required under IFRIC 17), no entry is made on the record date, and payment settles the liability. Only outstanding shares (issued plus subscribed less treasury) receive dividends.`
      ],
      concepts: [
        { title: "Property dividends (IFRIC 17)", text: `A property dividend creates two accounts. Property dividends payable is debited to retained earnings and always measured at fair value, remeasured at year-end and at settlement with changes adjusting retained earnings. The asset to be distributed is reclassified as a non-current asset held for distribution at the lower of carrying amount and fair value less costs to sell, with any shortfall an impairment loss and later recoveries reversed up to the original carrying amount. On settlement the payable is debited, the asset credited and the difference is a gain or loss on distribution. When shareholders can choose cash or property, the charge to retained earnings is probability-weighted.` },
        { title: "Share, scrip and liquidating dividends", text: `A share dividend capitalizes retained earnings; share dividends payable is equity, not a liability. A large dividend (20% or more of outstanding shares) is capitalized at par or stated value; a small dividend at fair value on the declaration date (par if fair value is lower), with the excess over par credited to share premium from stock dividends. A dividend paid from treasury shares is charged at cost regardless of size. Fractional shares are handled with fractional share rights or cash in lieu. Scrip dividends are deferred cash dividends at face or present value, with any interest charged to interest expense. Liquidating dividends return capital and are legal only on dissolution or for wasting asset corporations.` },
        { title: "Preference share dividend rights", text: `Preference shares have priority in liquidation after creditors and in dividends before ordinary shares. Non-cumulative shares forfeit dividends not declared in a year; cumulative shares accumulate dividends in arrears. Non-participating shares receive only the fixed rate; participating shares also share any excess, fully pro rata with ordinary shares or up to a limit, after ordinary shares first receive the basic preference rate on their par. Absent designation, preference shares are non-cumulative and non-participating, and with two participating classes the lowest rate sets the ordinary basic dividend.` },
        { title: "Recapitalization and quasi-reorganization", text: `Recapitalization changes the capital structure without changing total equity: a change from par to no-par or a reduction of par are recorded as retirement and reissuance, while splits and reverse splits are memo entries. A quasi-reorganization is a permissive fresh-start procedure for a troubled entity that eliminates its deficit by revaluing assets and liabilities and recapitalizing: revaluation surplus and share premium from recapitalization are used to wipe out the deficit. SEC rules require an independent appraisal of PPE credited to revaluation surplus, adjustments to other assets through retained earnings, a restriction on subsequent retained earnings up to the deficit eliminated, no charging of later losses to the remaining surplus, and disclosure for at least three years.` }
      ]
    },
    {
      id: "share-based",
      title: "Share-Based Payments",
      std: "PFRS 2",
      summary: [
        `A share-based payment is a transaction in which the entity acquires goods or services and pays with its own equity instruments (equity-settled) or with cash based on their value (cash-settled), or where either party may choose the form of settlement. PFRS 2 covers all such transactions except those with owners acting as owners, business combinations and derivatives settled in shares. Goods and services are recognized as assets or expenses when received, with a corresponding increase in equity or a liability.`,
        `Equity-settled transactions with non-employees are measured at the fair value of the goods or services received at the date of receipt, falling back to the fair value of the equity instruments. Transactions with employees are measured at the fair value of the equity instruments at the grant date (when both parties agree to the terms, or when approval is obtained), falling back to intrinsic value (share fair value less subscription price).`
      ],
      concepts: [
        { title: "Share options and vesting", text: `Options give key employees the right to buy shares at a set price within a period once conditions are met. Total compensation is the number of employees times options per employee times grant-date fair value (or intrinsic value). Options presumed to vest immediately are expensed in full; otherwise the expense is spread over the vesting period. A service condition requires continued employment; a performance condition is market-based (tied to share price) or non-market. If a non-market condition fails, no further expense is recognized; if a market condition fails, expense continues as if met. Expense already recognized is never reversed; on forfeiture the related share premium is transferred to another share premium account.` },
        { title: "Modifications and cancellation", text: `A modification is accounted for only when it benefits the employee: an increase in total fair value is recognized as additional expense over the remaining vesting period, and a shortened vesting period accelerates the unrecognized expense over the shorter period. Cancellation or settlement during vesting is treated as an acceleration: the remaining expense is recognized immediately and the payment to the employee is a repurchase of equity deducted from share options outstanding, with any excess over the option's fair value expensed.` },
        { title: "Cash-settled and choice of settlement", text: `Share appreciation rights (SARs) pay cash equal to the excess of the share's market value over a predetermined price for a stated number of shares. The liability is measured at the fair value of the SARs (intrinsic value if fair value is unavailable), remeasured at every reporting date until settlement with changes in profit or loss, and expensed in full if vested or over the vesting period if not. When the counterparty can choose cash or shares the arrangement is a compound instrument; when the entity chooses, it is cash-settled if there is a present obligation to pay cash and equity-settled otherwise.` }
      ]
    },
    {
      id: "bvps",
      title: "Book Value per Share",
      std: "Residual equity theory",
      summary: [
        `Book value per share is the amount each share would receive if the entity were liquidated and the amount available to shareholders equaled reported equity. With one class, it is total equity divided by outstanding shares. With two classes, total equity is allocated by the residual equity theory: preference equity is computed first and ordinary equity is what remains. Subscriptions receivable is not deducted, and treasury shares are treated as retired.`
      ],
      concepts: [
        { title: "Allocating equity between classes", text: `Preference equity equals preference share capital plus subscribed preference shares plus its share of the excess over par; ordinary equity is the same for ordinary shares. The excess over par (share premium, retained earnings and accumulated OCI) is allocated considering the liquidation value of preference shares (par if none), dividends in arrears for cumulative shares (only if actually in arrears), and participation rights. The participation balance is split pro rata on aggregate par values after ordinary shares receive the basic preference rate on their par, using the lower rate when two participating classes exist. A deficit is shared pro rata between the classes.` }
      ]
    },
    {
      id: "eps",
      title: "Earnings per Share",
      std: "PAS 33",
      summary: [
        `EPS is a profitability ratio showing profit or loss per ordinary share; preference shares are excluded because their return is fixed. It is required for public entities whose ordinary or potential ordinary shares are publicly traded or being issued publicly, and encouraged for others. Basic and diluted EPS are presented with equal prominence on the face of the income statement for continuing operations; EPS for discontinued operations may be on the face or in the notes, and disclosures are based on consolidated figures when both consolidated and separate statements are presented.`,
        `Basic EPS is profit after tax less preference dividends divided by the weighted average number of ordinary shares outstanding (issued plus subscribed less treasury). Cumulative preference dividends for one year are deducted whether declared or not; non-cumulative dividends only if declared; dividends in arrears are ignored.`
      ],
      concepts: [
        { title: "Weighted average shares", text: `Shares are time-weighted from the date consideration is receivable, usually the issue date. Share dividends and splits add shares without adding resources, so they are treated as outstanding from the start of the earliest period presented and prior EPS is restated. A rights issue below fair value contains a bonus element: shares outstanding before the exercise date are multiplied by the adjustment factor, fair value right-on divided by fair value ex-right, where fair value ex-right is fair value right-on less the theoretical value of one right, computed as (fair value right-on less subscription price) divided by (rights needed for one share plus 1).` },
        { title: "Diluted EPS", text: `Diluted EPS shows the maximum dilution from potential ordinary shares (convertible preference shares, convertible bonds, options, warrants, contingently issuable shares), included only when they reduce EPS or increase loss per share; anti-dilutive securities are ignored and only basic EPS is shown. Conversion or exercise is assumed from the date the potential shares first became outstanding. For convertible bonds, after-tax interest is added back to the numerator and the conversion shares to the denominator. For convertible preference shares, the preference dividend is not deducted and conversion shares are added. Options and warrants are dilutive only when the exercise price is below the average market price; under the treasury share method the assumed proceeds buy back shares at the average price, and the net incremental shares are added, averaged only until the actual exercise date. Contingently issuable shares are included from the date the conditions are met.` },
        { title: "Multiple potential shares", text: `When several potential ordinary shares exist, each is ranked by incremental EPS (the effect on the numerator divided by the shares added): options and warrants have a zero numerator effect and are usually the most dilutive, followed by convertible bonds (after-tax interest over shares) and convertible preference shares (dividends over shares). Starting from basic EPS, securities are added one at a time from most to least dilutive, and the process stops once diluted EPS would rise; the lowest EPS computed is presented.` }
      ]
    }
  ]
});
window.FAR_BRANCHES.push({
  id: "special",
  title: "Special Topics",
  color: "var(--c-special)",
  tag: "Presentation, changes and other reporting",
  summary: [
    `These topics sit above individual asset and liability standards. They govern how the financial statements as a whole are prepared and presented (PAS 1, PAS 7), how changes and mistakes are handled (PAS 8), how incomplete records are converted to the accrual basis, and the additional reporting layers for larger or more complex entities: segments (PFRS 8), assets held for sale and discontinued operations (PFRS 5), subsequent events (PAS 10), related parties (PAS 24), interim reports (PAS 34) and the simplified frameworks for small and medium-sized entities.`,
    `A recurring exam theme is retrospective versus prospective treatment: policy changes and error corrections are retrospective (adjusting opening retained earnings and triggering a third balance sheet), while changes in estimate are prospective.`
  ],
  topics: [
    {
      id: "pas8",
      title: "Accounting Changes and Error Correction",
      std: "PAS 8",
      summary: [
        `PAS 8 sets the criteria for selecting and changing accounting policies and the accounting for changes in policies, changes in estimates and corrections of prior period errors. Accounting policies are the specific principles, bases, conventions, rules and practices applied in preparing financial statements. The hierarchy for selecting one is PFRSs first, then judgment that must consider other PFRSs on similar transactions and the Conceptual Framework, and may consider other standard-setters' pronouncements and industry practice. A policy is changed only when a PFRS requires it or the change gives more relevant and reliable information.`,
        `A change in policy is a change in measurement basis and is applied under any transitional provision, otherwise retrospectively, or prospectively if retrospective application is impracticable; its effect hits the opening balance of retained earnings. A change in estimate reflects new information about expected inflows or outflows and is applied prospectively in the current period or the current and future periods. A prior period error is corrected by retrospective restatement, also through opening retained earnings. When a policy change is hard to distinguish from an estimate change, treat it as a change in estimate.`
      ],
      concepts: [
        { title: "Policy change vs estimate change", text: `Changes in policy include switching from FIFO to average cost, changing the revenue recognition method for long-term contracts, adopting a new PFRS, moving from PFRS for SMEs to full PFRS, first adopting the revaluation model for PPE or intangibles, changing investment property from cost to fair value, and reclassifying financial assets after a business model change. Changes in estimate include the depreciation or amortization method, useful lives, residual values, allowances for impairment and uncollectible accounts, fair value less costs to sell of assets held for sale and biological assets, and exchange rates for foreign currency items.` },
        { title: "Prior period errors", text: `Prior period errors are omissions and misstatements from failing to use, or misusing, reliable information that was available when those statements were authorized and could reasonably have been obtained: mathematical mistakes, misapplied policies, oversights, misinterpretations and fraud. Material errors are corrected in the first statements authorized after discovery by restating the comparatives for the period of the error, or restating opening assets, liabilities and equity of the earliest period presented if the error is older. If the period-specific effect is impracticable to determine, restate opening balances of the earliest practicable period; if the cumulative effect is impracticable, restate prospectively from the earliest practicable date.` },
        { title: "Error analysis", text: `Overstating sales overstates net income; overstating cost of sales or expenses understates it. Within cost of sales, overstated beginning inventory or purchases overstate cost of sales and understate income, while overstated ending inventory understates cost of sales and overstates income. Overstated current assets overstate working capital; overstated current liabilities understate it. Balance sheet errors affect only asset, liability or equity presentation and are reclassified; income statement errors involving two nominal accounts leave net income unaffected and are reclassified or restated. Combined errors affect both statements.` },

        `Single-entry or incomplete records are converted to accrual figures with T-accounts: each account increases on its normal-balance side, both sides must agree, and the missing figure is solved. Withdrawals of inventory or other non-cash assets are debited to drawings at cost, not selling price or fair value.`

        `A complete set comprises the statement of financial position, the statement of profit or loss and OCI, the statement of changes in equity, the statement of cash flows, notes, and a third balance sheet at the beginning of the previous period when the entity applies a policy retrospectively, restates retrospectively or reclassifies items. All statements have equal prominence and other titles may be used.`

        { title: "Current and non-current classification", text: `An asset is current when it will be realized, sold or consumed within the normal operating cycle, realized within 12 months, held for trading, or is cash or a cash equivalent not restricted for at least 12 months. A liability is current when it will be settled within the operating cycle, is held for trading, is due within 12 months, or the entity has no unconditional right to defer settlement for at least 12 months. The operating cycle runs from acquiring assets for processing to realizing cash and is taken as 12 months when not identifiable. A classified presentation is required unless a liquidity presentation (used by banks) is more reliable and relevant. Deferred tax assets and liabilities are always non-current. Format is not prescribed: report form lists assets, liabilities and equity downward; account form places assets on the left.` },

        `The statement of comprehensive income shows performance for a period from selling goods, rendering services, using the entity's resources and disposing of assets. Comprehensive income is the change in equity other than transactions with owners as owners, and comprises profit or loss (income less expenses excluding OCI, the bottom line) and other comprehensive income (items PFRS requires or permits outside profit or loss). It may be presented in a single statement or in two: a statement of profit or loss followed by a statement of comprehensive income that starts with profit or loss. An income statement alone is prohibited and extraordinary items are not allowed anywhere.`,
        `Minimum lines are revenue, gains or losses on derecognizing financial assets at amortized cost, finance cost, share of equity-method profit or loss, income tax, a single amount for discontinued operations, profit or loss, total OCI and comprehensive income, with profit and comprehensive income allocated between owners of the parent and non-controlling interest.`

        { title: "OCI and reclassification", text: `OCI components are changes in revaluation surplus, fair value changes on FVOCI investments, remeasurements of the net defined benefit liability, translation differences of foreign operations, the effective portion of cash flow hedges, own-credit-risk changes on FVPL-designated liabilities, and certain option time value, forward element and currency basis spread changes. OCI is split into items that will and will not be reclassified to profit or loss. Revaluation surplus, defined benefit remeasurements and FVOCI equity instruments are never reclassified; FVOCI debt instruments, translation differences and cash flow hedges are. Reclassification adjustments are amounts moved to profit or loss in the current period that were in OCI in this or earlier periods.` },
        { title: "Presentation of expenses", text: `Under the functional (cost of sales) format, expenses are allocated to cost of sales, distribution and administrative functions, producing gross profit and operating income subtotals; employee benefits, depreciation and amortization must then be disclosed separately. Under the natural format, expenses are aggregated by nature (depreciation, raw materials, changes in inventories, employee benefits, other expenses) with no cost of sales or gross profit line. Both continue through income before tax, tax, income from continuing operations, discontinued operations net of tax, profit or loss, OCI net of tax and comprehensive income.` },

        `Cash flows are classified as operating (the principal revenue-producing activities and items entering net income: receipts from customers, royalties and fees, payments to suppliers and employees, income taxes unless identified with investing or financing, and trading securities), investing (acquiring and disposing of long-term assets and non-cash-equivalent investments, loans to others, and derivatives) and financing (equity and borrowings: share issuances, treasury share purchases, debt proceeds and repayments, finance lease principal payments). Changes in current assets and liabilities are operating; long-term assets and short-term investments are investing; non-current liabilities, short-term bank loans and equity are financing.`

      concepts: [

        `Classification requires that the asset be available for immediate sale in its present condition on usual terms and that the sale be highly probable: management is committed to a plan, an active program to find a buyer has started, the sale is expected within one year (longer only for delays beyond the entity's control), the asset is actively marketed at a reasonable price and the plan is unlikely to change. Abandoned assets never qualify. Assets acquired exclusively for resale qualify at acquisition if the one-year rule is met and the other criteria will be met shortly, usually within three months.`

        `Related parties include the parent, subsidiaries and fellow subsidiaries; associates and venturers in joint ventures, including their subsidiaries; key management personnel (executive and non-executive directors and others with authority over planning, directing and controlling); close family members (spouse, children, children of the spouse and dependents); individuals with voting interests giving significant influence and their close family; and post-employment benefit plans. Not related: two entities sharing a director, two venturers merely sharing a joint venture, finance providers, trade unions, utilities and government agencies in normal dealings, and a single major customer, supplier or franchisor due only to economic dependence.`

        `Under the IASB, SMEs are entities without public accountability that publish general purpose statements for external users. Public accountability exists when debt or equity is traded or being issued in a public market, or when the entity holds assets in a fiduciary capacity as a primary business (banks, credit unions, insurers, brokers, mutual funds). The SEC classifies entities by size: large (assets above P350M or liabilities above P250M), medium (P100M to P350M assets or P100M to P250M liabilities), small (P3M to P100M) and micro (below P3M). Medium and small entities must also not be required to file under SRC Rule 68.1, not be issuing instruments publicly, not hold secondary licenses and not be public utilities.`,
        `Full PFRS is available to all. PFRS for SMEs may be used by medium, small and micro entities; PFRS for Small Entities by small and micro entities; and another acceptable basis such as the income tax or cash basis only by micro entities. An entity may use a higher level of standard but never a lower one. Breaching the ceiling at year-end requires transition to the higher framework the following year; falling below the floor allows a move to a lower basis the next period.`

const KT_RE = new RegExp("(?<![\\w-])(" + KEY_TERMS.slice().sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|") + "|P(?:AS|FRS)\\s\\d+|IFRIC\\s\\d+|R\\.A\\.\\s\\d+)(?![\\w-])", "gi");
const MAX_HITS = 5;

function rich(text) {
  const out = [];
  const seen = new Set();
  let last = 0, hits = 0, m;
  KT_RE.lastIndex = 0;
  while ((m = KT_RE.exec(text)) !== null) {
    const key = m[0].toLowerCase();
    if (hits >= MAX_HITS || seen.has(key)) continue;
    seen.add(key); hits++;
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(<strong className="kt" key={m.index}>{m[0]}</strong>);
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function sentences(text) {
  const protectedText = text.replace(/U\.S\./g, "U§S§").replace(/R\.A\./g, "R§A§");
  return protectedText.split(/(?<=[.!?])\s+(?=[A-Z(])/).map(s => s.replace(/§/g, ".").trim()).filter(Boolean);
}

/* First sentence becomes an italic callout, the rest stays as prose */
function Prose({ paragraphs }) {
  return paragraphs.map((p, i) => {
    if (i === 0) {
      const s = sentences(p);
      const lead = s[0];
      const rest = s.slice(1).join(" ");
      return (
        <React.Fragment key={i}>
          <div className="defn">{rich(lead)}</div>
          {rest && <p>{rich(rest)}</p>}
        </React.Fragment>
      );
    }
    return <p key={i}>{rich(p)}</p>;
  });
}

/* Concept text becomes a scannable list; the first line is the key point */
function Points({ text }) {
  const s = sentences(text);
  return (
    <ul className="points">
      {s.map((line, i) => <li key={i} className={i === 0 ? "lead" : ""}>{rich(line)}</li>)}
    </ul>
  );
}

/* ---------- Visual aids: tables, steps, trees, maps, formulas ---------- */
const VISUALS = window.FAR_VISUALS || {};

function wrapText(text, maxChars) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = "";
  words.forEach(w => {
    if ((cur + " " + w).trim().length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = (cur + " " + w).trim();
  });
  if (cur) lines.push(cur);
  return lines;
}

function SvgText({ x, y, lines, lineH = 15, cls = "" }) {
  const offset = -((lines.length - 1) * lineH) / 2;
  return (
    <text x={x} y={y + offset} textAnchor="middle" dominantBaseline="middle" className={cls}>
      {lines.map((l, i) => <tspan key={i} x={x} dy={i === 0 ? 0 : lineH}>{l}</tspan>)}
    </text>
  );
}

function VTable({ v }) {

}

function VTree({ v }) {
  const NW = 172, GAP = 18, LH = 14, PAD = 9, LEVEL = 64, EDGE_H = 30;
  // measure
  const measure = (n) => {
    n.lines = wrapText(n.t, 25);
    n.h = n.lines.length * LH + PAD * 2;
    if (n.kids && n.kids.length) { n.kids.forEach(k => measure(k.n)); n.leaves = n.kids.reduce((s, k) => s + k.n.leaves, 0); }
    else n.leaves = 1;
  };
  const root = JSON.parse(JSON.stringify(v.root));
  measure(root);
  const levelH = [];
  const collect = (n, d) => { levelH[d] = Math.max(levelH[d] || 0, n.h); (n.kids || []).forEach(k => collect(k.n, d + 1)); };
  collect(root, 0);
  const levelY = [];
  let y = 10;
  levelH.forEach((h, d) => { levelY[d] = y; y += h + LEVEL + EDGE_H; });
  const H = y - LEVEL - EDGE_H + 10;
  const W = root.leaves * (NW + GAP) + GAP;
  const nodes = [], edges = [];
  const place = (n, d, x0) => {
    n.x = x0 + (n.leaves * (NW + GAP)) / 2 + GAP / 2;
    n.y = levelY[d];
    nodes.push({ ...n, d });
    let cx = x0;
    (n.kids || []).forEach(k => {
      place(k.n, d + 1, cx);
      edges.push({ x1: n.x, y1: n.y + n.h, x2: k.n.x, y2: k.n.y, label: k.e });
      cx += k.n.leaves * (NW + GAP);
    });
  };
  place(root, 0, 0);
  return (
    <div className="dg-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: W, maxWidth: "100%", minWidth: Math.min(W, 520), height: "auto" }} role="img" aria-label={v.title}>
        {edges.map((e, i) => {
          const my = (e.y1 + e.y2) / 2;
          const lw = Math.max(28, e.label.length * 6.4 + 12);
          return (
            <g key={i}>
              <path className="dg-edge" d={`M ${e.x1} ${e.y1} C ${e.x1} ${my}, ${e.x2} ${my}, ${e.x2} ${e.y2}`} />
              <rect className="dg-lbl-bg" x={(e.x1 + e.x2) / 2 - lw / 2} y={my - 9} width={lw} height={18} rx={9} />
              <text className="dg-lbl" x={(e.x1 + e.x2) / 2} y={my} textAnchor="middle" dominantBaseline="middle">{e.label}</text>
            </g>
          );
        })}
        {nodes.map((n, i) => (
          <g key={i}>
            <rect className={n.kids && n.kids.length ? "dg-box dg-q" : "dg-box dg-leaf"} x={n.x - NW / 2} y={n.y} width={NW} height={n.h} rx={14} />
            <SvgText x={n.x} y={n.y + n.h / 2} lines={n.lines} lineH={LH} cls={n.kids && n.kids.length ? "dg-text" : "dg-text dg-leaf-text"} />
          </g>
        ))}
      </svg>
    </div>
  );
}

function VMap({ v }) {
  const n = v.nodes.length;
  const NW = 176, LH = 14, SLH = 13, PAD = 9;
  const items = v.nodes.map(nd => {
    const lines = wrapText(nd.t, 24);
    const sub = nd.s ? wrapText(nd.s, 28) : [];
    return { lines, sub, h: lines.length * LH + (sub.length ? sub.length * SLH + 4 : 0) + PAD * 2 };
  });
  const cLines = wrapText(v.center, 20);
  const CW = 170, CH = cLines.length * LH + 22;
  const rx = n <= 3 ? 230 : 260, ry = n <= 4 ? 120 : 150;
  const W = rx * 2 + NW + 40, H = ry * 2 + 110;
  const cx = W / 2, cy = H / 2;
  const pos = items.map((it, i) => {
    const a = -Math.PI / 2 + (2 * Math.PI * i) / n + (n % 2 === 0 ? Math.PI / n : 0);
    return { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
  });
  return (
    <div className="dg-wrap">
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: W, maxWidth: "100%", minWidth: Math.min(W, 520), height: "auto" }} role="img" aria-label={v.title}>
        {pos.map((p, i) => <line key={i} className="dg-edge" x1={cx} y1={cy} x2={p.x} y2={p.y} />)}
        <rect className="dg-box dg-center" x={cx - CW / 2} y={cy - CH / 2} width={CW} height={CH} rx={CH / 2} />
        <SvgText x={cx} y={cy} lines={cLines} lineH={LH} cls="dg-text dg-center-text" />
        {pos.map((p, i) => {
          const it = items[i];
          const top = p.y - it.h / 2;
          return (
            <g key={i}>
              <rect className="dg-box dg-leaf" x={p.x - NW / 2} y={top} width={NW} height={it.h} rx={14} />
              <SvgText x={p.x} y={top + PAD + (it.lines.length * LH) / 2} lines={it.lines} lineH={LH} cls="dg-text dg-leaf-text" />
              {it.sub.length > 0 && <SvgText x={p.x} y={top + PAD + it.lines.length * LH + 4 + (it.sub.length * SLH) / 2} lines={it.sub} lineH={SLH} cls="dg-sub" />}
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function Visuals({ topicId }) {
  const list = (VISUALS[topicId] || []).filter(v => v.type !== "formulas");
  if (!list.length) return null;
  return (
    <>
      <div className="section-title display"><span className="em" aria-hidden="true">🗂️</span>At a glance</div>
      {list.map((v, i) => (
        <figure key={i} className="visual">
          <figcaption>{v.title}</figcaption>
          {v.type === "table" && <VTable v={v} />}
          {v.type === "steps" && <VSteps v={v} />}
          {v.type === "formulas" && <VFormulas v={v} />}
          {v.type === "tree" && <VTree v={v} />}
          {v.type === "map" && <VMap v={v} />}
        </figure>
      ))}
    </>
  );
}

  const q = QUICK[topicId] || {};

        <section className="qcard">

/* Inline icons, lucide-style strokes */
function Icon({ name, size = 16, className = "" }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", className };
  switch (name) {
    case "x": return <svg {...common}><path d="M18 6 6 18M6 6l12 12"/></svg>;
    case "search": return <svg {...common}><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>;
    case "chevron": return <svg {...common}><path d="m9 6 6 6-6 6"/></svg>;
    case "check": return <svg {...common}><path d="M20 6 9 17l-5-5"/></svg>;
    case "left": return <svg {...common}><path d="m15 18-6-6 6-6"/></svg>;
    case "right": return <svg {...common}><path d="m9 18 6-6-6-6"/></svg>;
    case "sun": return <svg {...common}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "moon": return <svg {...common}><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>;
    case "monitor": return <svg {...common}><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>;
    case "layers": return <svg {...common}><path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>;
    default: return null;
  }
}

function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeStorage(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable */ }
}

function BranchColumn({ branch, selection, onOpenBranch, onOpenTopic, query, reviewed, headRef }) {
  const q = query.trim().toLowerCase();
  const matches = (t) => !q || t.title.toLowerCase().includes(q) || t.std.toLowerCase().includes(q) ||
    t.concepts.some(c => c.title.toLowerCase().includes(q) || c.text.toLowerCase().includes(q)) ||
    t.summary.some(s => s.toLowerCase().includes(q));
  const matchCount = branch.topics.filter(matches).length;
  const doneCount = branch.topics.filter(t => reviewed.has(t.id)).length;
  const isActiveBranch = selection && selection.type === "branch" && selection.id === branch.id;

  return (
    <div style={{ "--acc": branch.color }}>
      <button ref={headRef} className={"branch-head " + (isActiveBranch ? "active" : "")} onClick={() => onOpenBranch(branch.id)}>
        <div className="display bh-title">{branch.title}</div>
        <div className="bh-meta">
          {branch.tag}. {branch.topics.length} topics, {doneCount} done{q ? `, ${matchCount} match` : ""}
        </div>
      </button>
      <ul className="tree">
        {branch.topics.map(t => {
          const hit = matches(t);
          const isActive = selection && selection.type === "topic" && selection.id === t.id;
          const done = reviewed.has(t.id);
          return (
            <li key={t.id}>
              <button className={"topic " + (isActive ? "active " : "") + (q && !hit ? "dim" : "")} onClick={() => onOpenTopic(t.id)} aria-current={isActive ? "true" : undefined}>
                <span className={"t-check " + (done ? "done" : "")} aria-hidden="true">{done ? <Icon name="check" size={11} /> : null}</span>
                <span className="min-w-0">
                  <div className="display t-title">{t.title}</div>
                  <div className="t-meta">{t.std}. {t.concepts.length} key concept{t.concepts.length === 1 ? "" : "s"}</div>
                </span>
              </button>
            </li>
          );
        })}
      </ul>
    </div>
  );
}
