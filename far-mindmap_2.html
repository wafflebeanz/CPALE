    content = (
      <>
        <div className="crumb"><button className="underline-offset-2 hover:underline" onClick={() => onOpenBranch(null)}>Overview</button><span>/</span><b>{b.title}</b></div>
        <h2 className="display">{b.title}</h2>
        <div className="mb-3"><span className="pill">{b.tag}</span></div>
        <Prose paragraphs={b.summary} />
        <div className="section-title display">Topics in this branch <span style={{ color: "var(--muted)", fontSize: 14 }}>({done} of {b.topics.length} done)</span></div>
        <div>
          {b.topics.map(t => (
            <button key={t.id} className="chip" onClick={() => onOpenTopic(t.id)}>
              {reviewed.has(t.id) ? <Icon name="check" size={13} /> : null}{t.title}
            </button>
          ))}
        </div>
      </>
    );
  } else {
    const idx = TOPIC_INDEX[selection.id];
    const t = ALL_TOPICS[idx];
    acc = t.color;
    const prev = ALL_TOPICS[idx - 1];
    const next = ALL_TOPICS[idx + 1];
    const allOpen = t.concepts.length > 0 && t.concepts.every((_, i) => openSet.has(i));
    const toggleAll = () => setOpenSet(allOpen ? new Set() : new Set(t.concepts.map((_, i) => i)));
    const done = reviewed.has(t.id);
    content = (
      <>
        <div className="crumb">
          <button className="underline-offset-2 hover:underline" onClick={() => onOpenBranch(null)}>Overview</button><span>/</span>
          <button className="underline-offset-2 hover:underline" onClick={() => onOpenBranch(t.branchId)}><b>{t.branchTitle}</b></button><span>/</span>
          <span>{t.title}</span>
        </div>
        <h2 className="display">{t.title}</h2>
        <div className="mb-3"><span className="pill">{t.std}</span></div>
        <QuickCards topicId={t.id} />
        <div className="section-title display"><span className="em" aria-hidden="true">📖</span>Overview</div>
        <Prose paragraphs={t.summary} />
        <Visuals topicId={t.id} />
        <div className="flex items-baseline justify-between gap-3">
          <div className="section-title display"><span className="em" aria-hidden="true">💡</span>Key concepts</div>
          <button className="text-[13px] hover:underline" style={{ color: "var(--muted)" }} onClick={toggleAll}>{allOpen ? "Collapse all" : "Expand all"}</button>
        </div>
        {t.concepts.map((c, i) => (
          <Concept key={i} concept={c} open={openSet.has(i)} onToggle={() => {
            const n = new Set(openSet);
            n.has(i) ? n.delete(i) : n.add(i);
            setOpenSet(n);
          }} />
        ))}
      </>
    );
    foot = (
      <>
        <button className="btn" disabled={!prev} style={{ opacity: prev ? 1 : .4 }} onClick={() => prev && onOpenTopic(prev.id)} aria-label="Previous topic"><span className="inline-flex items-center gap-1"><Icon name="left" size={14} />Previous</span></button>
        <button className={"btn " + (done ? "" : "btn-accent")} onClick={() => toggleReviewed(t.id)}>
          <span className="inline-flex items-center gap-1">{done ? <><Icon name="check" size={14} />Done!</> : "Mark as done ✓"}</span>
        </button>
        <button className="btn" disabled={!next} style={{ opacity: next ? 1 : .4 }} onClick={() => next && onOpenTopic(next.id)} aria-label="Next topic"><span className="inline-flex items-center gap-1">Next<Icon name="right" size={14} /></span></button>
      </>
    );
  }

  return (
    <>
      <div className="backdrop" onClick={onClose} />
      <aside className="panel" role="dialog" aria-modal="true" style={{ "--acc": acc }}>
        <div className="panel-head flex items-start justify-between gap-3">
          <div className="text-[13px]" style={{ color: "var(--muted)" }}>Press Esc or tap outside to return to the map</div>
          <button className="btn" onClick={onClose} aria-label="Close"><Icon name="x" size={16} /></button>
        </div>
        <div className="panel-body" ref={bodyRef}>{content}</div>
        {foot && <div className="panel-foot">{foot}</div>}
      </aside>
    </>
  );
}

function App() {
  const [selection, setSelection] = useState(null);
  const [query, setQuery] = useState("");
  const [reviewed, setReviewed] = useState(() => new Set(readStorage(STORAGE_KEY, [])));
  const [theme, setTheme] = useState(() => readStorage(THEME_KEY, "system"));
  const [paths, setPaths] = useState([]);

  const mapRef = useRef(null);
  const hubRef = useRef(null);
  const headRefs = useRef({});

  useEffect(() => {
    if (theme === "system") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = theme;
    writeStorage(THEME_KEY, theme);
  }, [theme]);

  const toggleReviewed = useCallback((id) => {
    setReviewed(prev => {
      const n = new Set(prev);
      n.has(id) ? n.delete(id) : n.add(id);
      writeStorage(STORAGE_KEY, Array.from(n));
      return n;
    });
  }, []);

  const draw = useCallback(() => {
    const map = mapRef.current, hub = hubRef.current;
    if (!map || !hub) return;
    const m = map.getBoundingClientRect();
    const h = hub.getBoundingClientRect();
    const x0 = h.left + h.width / 2 - m.left;
    const y0 = h.bottom - m.top;
    const next = BRANCHES.map(b => {
      const el = headRefs.current[b.id];
      if (!el) return null;
      const r = el.getBoundingClientRect();
      const x1 = r.left + r.width / 2 - m.left;
      const y1 = r.top - m.top;
      const dy = Math.max(30, (y1 - y0) * 0.55);
      return { id: b.id, color: b.color, d: `M ${x0} ${y0} C ${x0} ${y0 + dy}, ${x1} ${y1 - dy}, ${x1} ${y1}` };
    }).filter(Boolean);
    setPaths(next);
  }, []);

  useLayoutEffect(() => {
    draw();
    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(() => draw()) : null;
    if (ro && mapRef.current) ro.observe(mapRef.current);
    window.addEventListener("resize", draw);
    const t = setTimeout(draw, 400); // after web fonts settle
    return () => { ro && ro.disconnect(); window.removeEventListener("resize", draw); clearTimeout(t); };
  }, [draw, query]);

  const openTopic = useCallback((id) => setSelection({ type: "topic", id }), []);
  const openBranch = useCallback((id) => setSelection(id ? { type: "branch", id } : { type: "hub" }), []);
  const close = useCallback(() => setSelection(null), []);

  const total = ALL_TOPICS.length;
  const done = reviewed.size;
  const nextTheme = theme === "system" ? "light" : theme === "light" ? "dark" : "system";

  return (
    <div className="min-h-full">
      <header className="topbar">
        <div className="mx-auto max-w-[1400px] px-4 py-3 flex flex-wrap items-center gap-3">
          <div className="flex items-center gap-2 mr-auto">
            <Icon name="layers" size={18} />
            <span className="display text-[19px] font-medium">FAR Mindmap</span>
            <span className="hidden sm:inline text-[13px]" style={{ color: "var(--muted)" }}>CPA board review</span>
          </div>
          <div className="relative w-full sm:w-[300px] order-last sm:order-none">
            <span className="absolute left-3 top-1/2 -translate-y-1/2" style={{ color: "var(--muted)" }}><Icon name="search" size={15} /></span>
            <input className="input" type="search" placeholder="Search topics and concepts" value={query} onChange={e => setQuery(e.target.value)} aria-label="Search topics and concepts" />
          </div>
          <div className="flex items-center gap-2 text-[13px]" style={{ color: "var(--muted)" }}>
            <div className="w-[90px] progress" aria-hidden="true"><div style={{ width: `${(done / total) * 100}%` }}></div></div>
            <span>{done}/{total} done</span>
          </div>
          <button className="btn" onClick={() => setTheme(nextTheme)} aria-label={`Theme: ${theme}. Switch to ${nextTheme}`} title={`Theme: ${theme}`}>
            <Icon name={theme === "light" ? "sun" : theme === "dark" ? "moon" : "monitor"} size={15} />
          </button>
        </div>
      </header>

      <main className="mx-auto max-w-[1400px] px-4 pb-16">
        <div ref={mapRef} className="relative pt-8">
          <Connectors paths={paths} />
          <div className="relative z-[1]">
            <Hub innerRef={hubRef} active={selection && selection.type === "hub"} onOpen={() => openBranch(null)} />
          </div>
          <div className="relative z-[1] grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-x-6 gap-y-10 mt-16">
            {BRANCHES.map(b => (
              <BranchColumn
                key={b.id}
                branch={b}
                selection={selection}
                query={query}
                reviewed={reviewed}
                onOpenBranch={openBranch}
                onOpenTopic={openTopic}
                headRef={el => { headRefs.current[b.id] = el; }}
              />
            ))}
          </div>
        </div>
        {query.trim() && ALL_TOPICS.every(t => {
          const q = query.trim().toLowerCase();
          return !(t.title.toLowerCase().includes(q) || t.std.toLowerCase().includes(q) || t.concepts.some(c => c.title.toLowerCase().includes(q) || c.text.toLowerCase().includes(q)) || t.summary.some(s => s.toLowerCase().includes(q)));
        }) && (
          <div className="empty mt-8">No topic or concept mentions "{query.trim()}". Try a shorter term or a standard number like PAS 16.</div>
        )}
        <p className="mt-12 text-[13px] max-w-[70ch]" style={{ color: "var(--muted)" }}>
          Explanations are synthesized from the reviewer notes you provided (REO-CN Assets, Liabilities, SHE and Special Topics). Done marks are saved in this browser only.
        </p>
      </main>

      <Panel
        selection={selection}
        onClose={close}
        onOpenBranch={openBranch}
        onOpenTopic={openTopic}
        reviewed={reviewed}
        toggleReviewed={toggleReviewed}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body></html>
