pon their taxable income as are imposed upon corporations or associations engaged in similar business, industry, or activity?","opts":["Government Service Insurance System (GSIS)","Social Security System (SSS)","Philippine Amusement and Gaming Corporation (PAGCOR)","Philippine Charity Sweepstakes Office (PCSO)"],"ans":2,"exp":"Sec. 27(C) makes GOCCs taxable like private corporations, except those expressly exempted. PAGCOR's exemption was withdrawn by RA 9337, so it pays corporate income tax. GSIS and SSS remain exempt, together with PhilHealth and local water districts.","notes":["Exempt GOCCs today: GSIS, SSS, PhilHealth and local water districts only.","PAGCOR: exemption removed by RA 9337 (2005).","PCSO: exemption removed by TRAIN (2018)."],"upd":"TRAIN: PCSO deleted from the exempt GOCCs under Sec. 27(C) effective January 1, 2018.","key":"Flawed item: TRAIN also removed PCSO from the list of exempt GOCCs, so PCSO (choice d) is now likewise taxable; only GSIS, SSS, PhilHealth and local water districts remain exempt. C is the key's intended answer (PAGCOR's exemption was withdrawn by RA 9337)."},{"id":"Q07-22","quiz":7,"num":22,"sec":"3.1-CORP","q":"Which of the following shall be exempt from corporate income tax?","opts":["Regional or area headquarters","Regional operating headquarters","Offshore banking units","Partnership engaged in business, no matter how created"],"ans":0,"exp":"Regional or area headquarters of multinational companies are exempt because they act only as supervisory, communications and coordinating centers and may not derive income from Philippine sources. ROHQs have been taxed at the regular 25% rate since January 1, 2022, OBUs lost their preferential treatment under CREATE, and business partnerships are taxable as corporations.","notes":["RHQ: exempt (not allowed to earn income in the Philippines).","ROHQ: 25% RCIT from January 1, 2022 (10% preferential rate ended).","Business partnerships: taxed as corporations; GPPs are not."],"upd":"CREATE: repealed the 10% ROHQ rate (regular rate from January 1, 2022) and the OBU preferential rates.","key":""},{"id":"Q07-23","quiz":7,"num":23,"sec":"3.1-CORP","q":"A taxable partnership may be subject to which of the following taxes?","opts":["Minimum corporate income tax.","Gross income tax.","Improperly accumulated earnings tax.","None of the choices."],"ans":0,"exp":"A taxable (business) partnership is treated as a corporation, so it is subject to RCIT or MCIT, whichever is higher, beginning the 4th taxable year of operations. The 15% optional gross income tax and the 10% improperly accumulated earnings tax were both repealed by CREATE, so b and c no longer apply.","notes":["Taxable partnership: RCIT 25%/20% or MCIT 2%, whichever is higher.","IAET (10%) repealed by CREATE for taxable years beginning July 1, 2020.","15% optional gross income tax removed by CREATE."],"upd":"CREATE: IAET and the 15% optional corporate income tax were repealed.","key":""},{"id":"Q07-24","quiz":7,"num":24,"sec":"3.1-CORP","q":"Statement I: Co-ownership is generally not taxable because the activities of the co-owners are usually limited to the preservation of the property owned in common and collection of the income therefrom.\nStatement II: Co-owners shall report in their respective income tax returns their shares of the income of the co-ownership.\nStatement III: When the income of the co-ownership is invested by the co-owners in business or other income-producing properties, the co-owners will be subject to tax as a corporation because the co-owners have constituted themselves into a partnership.","opts":["Statements I, II and III are correct","Only Statements I and II are correct","Only Statements II and III are correct","Only Statement I is correct"],"ans":0,"exp":"A mere co-ownership limited to preserving the common property and collecting its fruits is not a taxable entity, so each co-owner reports his share of the income. Once the co-owners invest the income in a business or other income-producing properties, they form an unregistered partnership taxable as a corporation (Evangelista v. Collector; Oña v. CIR). All statements are correct.","notes":["Mere co-ownership: not taxable; co-owners report their shares.","Co-owners who reinvest income in business: unregistered partnership taxed as a corporation.","Co-ownership of inherited property is exempt only while the estate is undivided and not reinvested for profit."],"upd":"","key":""},{"id":"Q07-25","quiz":7,"num":25,"sec":"3.1-CORP","q":"A piece of land near a beach was donated to Mr. James Jayme and Mr. Jorge Jayme by their father. The donees decided to improve the property by investing in its development into a beach resort. They earned rentals from the cottages and sale of food to guests. For income taxation, the beach resort would be treated as a:","opts":["co-ownership.","general professional partnership.","joint venture.","corporation."],"ans":3,"exp":"The brothers went beyond preserving the donated property: they pooled resources to develop and operate a resort for profit. This creates an unregistered partnership, which is included in the term 'corporation' under Sec. 22(B) and taxed accordingly. It is not a GPP (no common profession) or an exempt joint venture.","notes":["Investing co-owned property in a business converts the co-ownership into a taxable partnership.","Unregistered partnerships are taxed as corporations.","The partners' shares, once distributed, are treated as dividends (10% final tax for individuals)."],"upd":"","key":""},{"id":"Q07-26","quiz":7,"num":26,"sec":"3.1-CORP","q":"In order for joint ventures undertaking a construction project to be exempt, which of the following requirements shall be satisfied?\nI: The joint venture should involve the joining or pooling of resources by licensed local contractors, licensed as general contractors by the Philippine Contractors Accreditation Board (PCAB) of the Department of Trade and Industry (DTI)\nII: These local contractors are engaged in construction business\nIII: The joint venture itself must likewise be duly licensed by the PCAB of the DTI","opts":["I, II and III","I and II only","II and III only","I and III only"],"ans":0,"exp":"Under RR 10-2012, a joint venture undertaking construction projects is excluded from the term 'corporation' only if it involves the pooling of resources by licensed local general contractors (PCAB/DTI), those contractors are engaged in construction business, and the joint venture itself is licensed by the PCAB. All three requirements must be met; otherwise the JV is taxable as a corporation.","notes":["Exempt JVs: construction projects (RR 10-2012 conditions) and energy operations under government service contracts.","A JV that fails any condition is taxed as a corporation.","Each co-venturer includes its share of the exempt JV's income in its own taxable income."],"upd":"","key":""},{"id":"Q07-27","quiz":7,"num":27,"sec":"3.1-CORP","q":"The share of a corporate co-venturer in the net income of a tax-exempt joint venture is subject to:","opts":["corporate income tax.","final withholding tax.","capital gains tax.","none of the choices."],"ans":0,"exp":"An exempt joint venture is not a taxable entity, so its income flows through to the co-venturers. The corporate co-venturer includes its share in its gross income and pays regular corporate income tax. The intercorporate dividend exemption does not apply because the JV is not a corporation distributing dividends.","notes":["Exempt JV share: included in the co-venturer's taxable income (RCIT).","Share in a taxable JV (treated as corporation) is a dividend, exempt if received by a domestic corporation.","GPP partners are likewise taxed on their distributive shares at their own level."],"upd":"","key":""},{"id":"Q07-28","quiz":7,"num":28,"sec":"3.7","q":"First statement: The corporate quarterly declaration of income tax on a cumulative basis shall be filed, either electronically or manually, not later than 60 days from the close of each of the first three quarters of the taxable year, whether calendar or fiscal year.\nSecond statement: The final adjustment return of the total taxable income for the preceding calendar or fiscal year shall be filed on or before the 15th day of April, or on or before the 15th day of the 4th month following the close of the fiscal year, as the case may be.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":0,"exp":"Sec. 75 and 77(B) require corporations to file cumulative quarterly returns within 60 days after the close of each of the first three quarters, and the final adjustment return on or before the 15th day of the 4th month after the close of the taxable year (April 15 for calendar-year corporations). Both statements are correct.","notes":["Corporate quarterly ITR: within 60 days after each of the first three quarters.","Annual ITR: 15th day of the 4th month after year-end.","EOPT: returns may be filed and taxes paid with any AAB, RDO (through an RCO) or authorized tax software provider."],"upd":"","key":""},{"id":"Q07-29","quiz":7,"num":29,"sec":"3.7","q":"First statement: In case the corporation is entitled to a tax refund or credit of the excess estimated quarterly income taxes paid, the excess amount shown on its final adjustment return may be carried over and credited against the estimated quarterly income tax liabilities for the taxable quarters of the succeeding taxable years.\nSecond statement: Once the option to carry over has been made, such option shall be considered irrevocable for that taxable period and no application for cash refund or issuance of a tax credit certificate shall be allowed.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":0,"exp":"Sec. 76 gives a corporation with excess quarterly payments the choice of refund, tax credit certificate, or carry-over against succeeding years' quarterly tax. Once carry-over is chosen, the option is irrevocable for that period and no refund or TCC may be claimed; the excess may be carried over until fully used (no time limit).","notes":["Options: refund, TCC, or carry-over; carry-over is irrevocable.","The irrevocability rule applies once the carry-over box is chosen (or in effect exercised).","A refund claim must be filed within 2 years from the filing of the final adjustment return."],"upd":"","key":""},{"id":"Q07-30","quiz":7,"num":30,"sec":"3.7","q":"In order to establish its exemption, and thus be relieved of the duty of filing returns of income and paying the tax, it is necessary for every organization claiming exemption to file an affidavit with the Commissioner of Internal Revenue, showing which of the following?","opts":["The character of the organization.","The purpose for which it was organized and its actual activities.","The sources of its income and its distribution.","All of the choices."],"ans":3,"exp":"The regulations require an organization claiming exemption under Sec. 30 to prove its entitlement by showing its character, the purpose for which it was organized, its actual activities, and the sources and disposition of its income. All choices are required, so d is correct.","notes":["Exemption is not presumed; the organization must prove it.","Income from property or profit-seeking activities of exempt organizations is still taxable (Sec. 30, last paragraph).","Exempt organizations still file an annual information return."],"upd":"","key":""},{"id":"Q07-31","quiz":7,"num":31,"sec":"3.7","q":"When shall a tax-exempt organization file its annual information return?","opts":["On or before April 15 of each year.","On or before May 15 of each year.","On or before June 15 of each year.","On or after December 31 of each year."],"ans":0,"exp":"A tax-exempt corporation files its annual information return (BIR Form 1702-EX) on or before the 15th day of the 4th month following the close of its taxable year, which is April 15 for a calendar-year organization. This is the same deadline as the regular annual corporate return.","notes":["Annual information return of exempt organizations: April 15 (calendar year).","Exempt organizations with taxable income from profit activities report it in their returns.","Withholding obligations still apply to exempt organizations as payors."],"upd":"","key":""},{"id":"Q07-32","quiz":7,"num":32,"sec":"3.1-CORP","q":"Notwithstanding the provisions in the preceding paragraphs, the income of whatever kind and character of the tax-exempt organizations under Section 30 of the Tax Code from any of their properties, real or personal, or from any of their activities conducted for profit, regardless of the disposition made of such income, shall be:","opts":["subject to corporation tax.","exempt from corporation tax.","forfeited in favor of the government.","subject to corporation tax if duly reported."],"ans":0,"exp":"The last paragraph of Sec. 30 makes the income of exempt organizations from their properties or from activities conducted for profit taxable, regardless of how the income is used. The exemption covers only income received in their capacity as exempt organizations.","notes":["How the profit income is used does not matter; it remains taxable.","Nonstock, nonprofit educational institutions have a constitutional exemption on income actually, directly and exclusively used for education.","Passive income of exempt organizations may be subject to final tax."],"upd":"","key":""},{"id":"Q07-33","quiz":7,"num":33,"sec":"3.1-CORP","q":"Income derived by a depository bank under the expanded foreign currency deposit system from foreign currency transactions with nonresidents, offshore banking units in the Philippines, and local commercial banks, including branches of foreign banks authorized by the BSP to transact business with foreign currency depository units, shall be:","opts":["subject to 20% final tax.","subject to 15% final tax.","subject to 10% final tax.","exempt from tax."],"ans":3,"exp":"Under Sec. 27(D)(3), income of a depository bank's FCDU from foreign currency transactions with nonresidents, OBUs and other depository banks under the expanded system is exempt from all taxes, except net income from such transactions as may be specified by the Secretary of Finance. Interest on FCDU loans to residents is the item taxed at 10%.","notes":["FCDU income from transactions with nonresidents, OBUs and other depository banks: exempt.","FCDU loans to residents (other than OBUs/depository banks): 10% final tax.","Residents' FCDU deposit interest: 20% under CMEPA."],"upd":"CMEPA: raised FCDU deposit interest of residents to 20%, and the President vetoed the deletion of the exemption for nonresidents' income from FCDU transactions; the rules on depository banks' own FCDU income in this item follow Sec. 27(D)(3).","key":""},{"id":"Q07-34","quiz":7,"num":34,"sec":"3.1-CORP","q":"Interest income from foreign currency loans granted by domestic depository banks under the expanded foreign currency deposit system to residents other than offshore banking units in the Philippines or other depository banks under the expanded system shall be:","opts":["subject to 20% final tax.","subject to 15% final tax.","subject to 10% final tax.","exempt from tax."],"ans":2,"exp":"Sec. 27(D)(3) imposes a 10% final tax on interest income of depository banks from foreign currency loans granted to residents other than OBUs and other depository banks under the expanded system. Transactions with nonresidents and other depository banks are exempt instead.","notes":["FCDU loans to residents: 10% final tax on the bank's interest income.","FCDU transactions with nonresidents/OBUs/depository banks: exempt.","Residents' FCDU deposit interest (depositor side): 20% under CMEPA."],"upd":"CMEPA: raised FCDU deposit interest of residents to 20%, and the President vetoed the deletion of the exemption for nonresidents' income from FCDU transactions; the rules on depository banks' own FCDU income in this item follow Sec. 27(D)(3).","key":""},{"id":"Q07-35","quiz":7,"num":35,"sec":"3.1-CORP","q":"Foreign-sourced dividends received by a domestic corporation are exempt from income tax under CREATE, subject to which of the following conditions?\nI: The dividends actually received or remitted into the Philippines are reinvested in the business operations of the domestic corporation within the next taxable year from the time the foreign-sourced dividends were received or remitted.\nII: The dividends received shall only be used to fund the working capital requirements, capital expenditures, dividend payments, investments in domestic subsidiaries, and infrastructure projects.\nIII: The domestic corporation holds directly at least 20% in value of the outstanding shares of the foreign corporation and has held the shareholdings uninterruptedly for a minimum of 2 years at the time of the dividend distribution.","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"Sec. 27(D)(7), added by CREATE, exempts foreign-sourced dividends received by a domestic corporation only if all three conditions are met: reinvestment within the next taxable year, use limited to the listed purposes, and direct holding of at least 20% of the foreign corporation for at least 2 uninterrupted years at distribution. Failing any condition makes the dividends taxable at the regular rate.","notes":["All three conditions must be met.","Dividends from a domestic corporation to a domestic corporation are exempt (intercorporate dividends).","Dividends from a domestic corporation to an NRFC: 25%, or 15% under the tax-sparing rule."],"upd":"CREATE: introduced the foreign-sourced dividend exemption.","key":""},{"id":"Q07-36","quiz":7,"num":36,"sec":"3.1-CORP","q":"Which of the following taxes are no longer imposed?\nI: Improperly Accumulated Earnings Tax\nII: Optional Corporate Income Tax\nIII: Minimum Corporate Income Tax","opts":["I, II and III","I and II only","II and III only","I and III only"],"ans":1,"exp":"CREATE repealed the 10% improperly accumulated earnings tax and the 15% optional gross income tax on corporations. The minimum corporate income tax remains in force at 2% of gross income, so only I and II are no longer imposed.","notes":["IAET repealed for taxable years beginning July 1, 2020.","15% optional corporate income tax (gross income tax) removed by CREATE.","MCIT still applies at 2% (1% from July 2020 to June 2023)."],"upd":"CREATE: IAET and the 15% optional corporate income tax were repealed.","key":""},{"id":"Q08-01","quiz":8,"num":1,"sec":"3.1-SRC","q":"As to source, the Tax Code classifies income into:","opts":["income derived in full from sources within the Philippines.","income derived in full from sources outside the Philippines.","income derived partly from sources within and partly from sources outside the Philippines.","all of the choices."],"ans":3,"exp":"Sec. 42 classifies income as from sources within the Philippines, from sources without, and partly within and partly without. All three categories are recognized, so the answer is all of the choices.","notes":["Three source categories: within, without, partly within and partly without (Sec. 42).","Source matters for taxpayers taxed only on Philippine income: nonresident citizens, aliens, foreign corporations.","Resident citizens and domestic corporations are taxed on worldwide income."],"upd":"","key":""},{"id":"Q08-02","quiz":8,"num":2,"sec":"3.1-SRC","q":"The source of interest or yield is:","opts":["the residence of the creditor.","the residence of the debtor.","the residence of the debtor or creditor depending on the amount of the debt.","the residence of the bank where the debt was contracted."],"ans":1,"exp":"Under Sec. 42(A)(1), interest is income from Philippine sources when paid by residents, corporate or otherwise, so the source is the residence of the debtor. The residence of the creditor, the amount of the debt and the location of the bank do not control.","notes":["Interest: source is the residence of the DEBTOR.","Interest on bonds, notes or other interest-bearing obligations of residents is income within.","The same test applies whatever the amount of the debt."],"upd":"","key":""},{"id":"Q08-03","quiz":8,"num":3,"sec":"3.1-SRC","q":"Dividends from a domestic corporation are considered:","opts":["income within the Philippines.","income without the Philippines.","income partly within and partly without the Philippines.","income within the Philippines if the domestic corporation is classified as large."],"ans":0,"exp":"Sec. 42(A)(2)(a) treats dividends from a domestic corporation as income from sources within the Philippines, without exception. The taxpayer classification of the corporation (micro to large) is irrelevant to source.","notes":["Dividends from a domestic corporation: always income within.","Dividends to resident or citizen individuals: 10% final tax.","Intercorporate dividends between domestic corporations: exempt."],"upd":"","key":""},{"id":"Q08-04","quiz":8,"num":4,"sec":"3.1-SRC","q":"First statement: Dividends from a foreign corporation are generally classified as income from sources within.\nSecond statement: Dividends from a foreign corporation are classified as income within if less than 50% of the gross income of such foreign corporation for the 3-year period preceding the declaration of such dividends, or for such part of such period as the corporation has been in existence, was derived from sources within the Philippines.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":2,"exp":"Sec. 42(A)(2)(b) lists dividends from a foreign corporation among items of gross income from sources within, which is the basis of the key for the first statement. The second statement reverses the test: dividends are income within (only in the ratable portion) when 50% OR MORE of the foreign corporation's gross income for the preceding 3 years came from Philippine sources, not when less than 50% did.","notes":["Foreign corporation dividends: income within only if 50% or more of its gross income for the 3 preceding years was from Philippine sources.","Even then, only the ratable portion (Philippine gross income / total gross income) is income within.","If less than 50%: the entire dividend is income without."],"upd":"","key":""},{"id":"Q08-05","quiz":8,"num":5,"sec":"3.1-SRC","q":"Dividends from a foreign corporation where less than 50% of the gross income of such foreign corporation for the 3-year period preceding the declaration of such dividends, or for such part of such period as the corporation has been in existence, was derived from sources within the Philippines shall be classified as:","opts":["income purely within.","income purely without.","income partly within and partly without.","neither income within nor income without."],"ans":1,"exp":"Under Sec. 42(A)(2)(b), dividends from a foreign corporation are income within only if 50% or more of its gross income for the preceding 3-year period came from Philippine sources, and then only in the ratable portion. When less than 50% came from Philippine sources, the entire dividend is income without, so it is not partly within and partly without.","notes":["50% or more Philippine-source gross income: ratable portion of the dividend is income within.","Less than 50%: the whole dividend is income without.","Look-back period: 3 years preceding the declaration (or the period of existence, if shorter)."],"upd":"","key":"Source key says C. Under Sec. 42(A)(2)(b), dividends from a foreign corporation are income within only if 50% or more of its gross income for the 3-year period was from Philippine sources (and then only the ratable portion); if less than 50%, the entire dividend is income without."},{"id":"Q08-06","quiz":8,"num":6,"sec":"3.1-SRC","q":"Foreign-sourced dividends received by a domestic corporation are exempt from income tax upon the effectivity of CREATE, subject to which of the following conditions?\nI - The dividends actually received or remitted into the Philippines are reinvested in the business operations of the domestic corporation within the next taxable year from the time the foreign-sourced dividends were received or remitted.\nII - The dividends received shall only be used to fund the working capital requirements, capital expenditures, dividend payments, investments in domestic subsidiaries, and infrastructure projects.\nIII - The domestic corporation holds directly at least 20% in value of the outstanding shares of the foreign corporation and has held the shareholdings uninterruptedly for a minimum of 2 years at the time of the dividend distribution.","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"Sec. 42(A)(7)(d), added by CREATE, exempts foreign-sourced dividends of a domestic corporation only if all three conditions are met: reinvestment in the Philippines within the next taxable year, use of the funds only for the listed purposes, and direct holding of at least 20% of the foreign corporation's outstanding shares for at least 2 uninterrupted years at the time of distribution.","notes":["All three conditions must concur: reinvest within the next taxable year, permitted uses only, at least 20% direct holding for 2 years.","Permitted uses: working capital, capital expenditures, dividend payments, investments in domestic subsidiaries, infrastructure projects.","Failure to meet the conditions: the dividends are taxable at the regular corporate income tax rate."],"upd":"","key":""},{"id":"Q08-07","quiz":8,"num":7,"sec":"3.1-SRC","q":"The source of income from the performance of services is:","opts":["the residence of the service provider.","the residence of the person who contracted the services.","the place of performance of the services.","the place where payment is made for the services."],"ans":2,"exp":"Under Sec. 42(A)(3), compensation for labor or personal services is income from sources within if the services are performed in the Philippines. The residence of either party and the place of payment are irrelevant.","notes":["Services: source is the PLACE OF PERFORMANCE.","Services performed partly within and partly without: allocate (e.g., by days worked in the Philippines).","Place of payment and the parties' residence do not determine source."],"upd":"","key":""},{"id":"Q08-09","quiz":8,"num":9,"sec":"3.1-SRC","q":"The source of rent income and of gain from the sale of real property is:","opts":["the residence of the owner of the real property.","the residence of the lessor of the rented property.","the location of the property.","the place of sale of real property and of lease of rented property."],"ans":2,"exp":"Under Sec. 42(A)(5) and (6), rentals from property located in the Philippines and gains from the sale of real property located in the Philippines are income within. The test is the location of the property, not the residence of the owner or lessor or the place where the contract is signed.","notes":["Rent and gain on sale of real property: source is the LOCATION of the property.","Real property capital assets in the Philippines: 6% CGT on the higher of gross selling price or FMV.","Place of signing the deed or lease is irrelevant."],"upd":"","key":""},{"id":"Q08-10","quiz":8,"num":10,"sec":"3.1-SRC","q":"Income from royalties is considered income within depending on the:\nA - Place of use of the intangibles.\nB - Residence of the owner.","opts":["A and B","A or B","A only","B only"],"ans":2,"exp":"Under Sec. 42(A)(4), royalties are income within when paid for the use of, or the right to use, intangibles (patents, copyrights, trademarks and similar property) in the Philippines. The test is the place of use; the owner's residence does not determine source.","notes":["Royalties: source is the PLACE OF USE of the intangible.","Includes technical services and know-how supplied for use in the Philippines.","Royalties from Philippine sources to residents/citizens: generally 20% final tax (books, literary works, musical compositions: 10%)."],"upd":"","key":""},{"id":"Q08-11","quiz":8,"num":11,"sec":"3.1-SRC","q":"The gain on sale of personal property purchased in one country and sold in another is considered income within depending on the:","opts":["residence of the owner of the personal property.","residence of the buyer of the personal property.","location of the property.","place of sale of the personal property."],"ans":3,"exp":"Under Sec. 42(E), gains from the purchase of personal property within and its sale without the Philippines (or vice versa) are treated as derived entirely from the country where the property is sold. The place of sale controls, not the residence of either party or the location of the goods.","notes":["Personal property purchased in one country and sold in another: source is the PLACE OF SALE.","Personal property produced by the taxpayer in one country and sold in another: partly within, partly without.","Shares of a domestic corporation: always income within, wherever sold."],"upd":"","key":""},{"id":"Q08-12","quiz":8,"num":12,"sec":"3.1-SRC","q":"Income from the sale of personal property produced, in whole or in part, by the taxpayer within and sold without the Philippines shall be classified as:","opts":["income purely within.","income purely without.","income partly within and partly without.","neither income within nor income without."],"ans":2,"exp":"Sec. 42(E) treats gains from the sale of personal property produced (in whole or in part) by the taxpayer within and sold without the Philippines, or produced without and sold within, as income partly within and partly without. The income is allocated between the place of production and the place of sale.","notes":["Produced in one country, sold in another: partly within, partly without.","Merely purchased in one country and sold in another: source is the place of sale.","Allocation follows the rules prescribed by regulations."],"upd":"","key":""},{"id":"Q08-13","quiz":8,"num":13,"sec":"3.1-SRC","q":"Gain on the sale of shares of a domestic corporation is considered:","opts":["income within.","income without.","income partly within and partly without.","income within if the domestic corporation is classified as large."],"ans":0,"exp":"Sec. 42(E) provides that gains from the sale of shares of stock in a domestic corporation are treated as derived entirely from sources within the Philippines, regardless of where the shares are sold. The corporation's size classification is irrelevant.","notes":["Shares of a domestic corporation: income within, wherever sold.","Unlisted shares: 15% capital gains tax on net gain.","Listed shares sold through the exchange: stock transaction tax of 0.1% of gross selling price (CMEPA)."],"upd":"","key":""},{"id":"Q08-14","quiz":8,"num":14,"sec":"3.1-SRC","q":"The test in determining whether interest income is classified as income within or income without is the:","opts":["residence of the creditor.","residence of the debtor.","place where the indebtedness was incurred.","place where the indebtedness is to be paid."],"ans":1,"exp":"Under Sec. 42(A)(1), interest paid by residents, corporate or otherwise, is income within, so the residence of the debtor is the test. The residence of the creditor and the place where the debt was incurred or is payable do not decide the source.","notes":["Interest: residence of the DEBTOR.","Bank deposit interest (CMEPA): uniform 20% final tax; nonresident aliens and foreign corporations: 25%.","Place of contracting or payment is irrelevant."],"upd":"","key":""},{"id":"Q08-15","quiz":8,"num":15,"sec":"3.1-SRC","q":"Resident foreign corporations are allowed to deduct:\nA. Expenses properly allocated to income within.\nB. A ratable portion of unallocated expenses allocated to income within.","opts":["Both A and B","Neither A nor B","A only","B only"],"ans":0,"exp":"A resident foreign corporation is taxed only on Philippine-source net income, so it deducts expenses properly allocable to income within plus a ratable part of expenses that cannot be definitely allocated to any class of income (Sec. 42(B)). The ratable portion is computed by the ratio of Philippine gross income to total gross income.","notes":["RFC deductions: expenses allocable to income within PLUS a ratable share of unallocated expenses.","Ratable share = unallocated expenses x (Philippine gross income / worldwide gross income).","RFC rate: 25% of Philippine-source net taxable income (the 20% rate is for domestic corporations only)."],"upd":"","key":""},{"id":"Q08-16","quiz":8,"num":16,"sec":"3.1-SRC","q":"Which of the following shall be considered income partly within and partly without the Philippines?\nI - Gains, profits and income from the sale of personal property produced (in whole or in part) by the taxpayer within and sold without the Philippines\nII - Gains, profits and income from the sale of personal property produced (in whole or in part) by the taxpayer without and sold within the Philippines\nIII - Income from services performed partly within and partly without the Philippines","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"Sec. 42(E) classifies income from personal property produced by the taxpayer in one place and sold in the other (both directions) as income partly within and partly without. Services performed partly in the Philippines and partly abroad are also partly within and partly without, with the compensation allocated to the place of performance.","notes":["Produced within/sold without, or produced without/sold within: partly within, partly without.","Services performed in both places: allocate by place of performance.","Purchased (not produced) and resold: source is the place of sale."],"upd":"","key":""},{"id":"Q08-17","quiz":8,"num":17,"sec":"3.1-SRC","q":"If the taxpayer is a resident citizen of the Philippines, which of the following is NOT subject to income tax?","opts":["Capital gain on sale of real property in the Philippines","Interest on bank deposits in the Philippines","Rent income from property outside the Philippines","Capital gain on shares of stock of a domestic corporation sold through the local stock exchange"],"ans":3,"exp":"A resident citizen is taxed on worldwide income, so rent from property abroad is subject to income tax. The capital gain on real property (6% CGT) and bank deposit interest (20% final tax) are also income taxes. Gain on listed shares sold through the local stock exchange is subject to the stock transaction tax, a percentage tax, in lieu of income tax.","notes":["Resident citizens: taxed on income from within AND without the Philippines.","Listed shares sold through the exchange: stock transaction tax (percentage tax) in lieu of income tax.","CGT on real property and final tax on bank interest are still income taxes."],"upd":"CMEPA: the stock transaction tax on listed shares was reduced from 6/10 of 1% to 1/10 of 1% (0.1%) of the gross selling price.","key":"Source key says C, but a resident citizen is taxed on worldwide income, so rent from property abroad IS subject to income tax; the gain on listed shares sold through the exchange is subject to the stock transaction tax (a percentage tax) in lieu of income tax."},{"id":"Q09-01","quiz":9,"num":1,"sec":"3.2-GI","q":"The term ____ means the pertinent items of gross income specified in the Tax Code, less the deductions and/or personal and additional exemptions, if any, authorized for such types of income by the Tax Code or other special laws.","opts":["Gross income","Taxable income","Net assets","None of the choices"],"ans":1,"exp":"Sec. 31 defines taxable income as the pertinent items of gross income less the deductions and exemptions authorized by the Tax Code or special laws. Gross income is the starting figure before any deduction, so it is not the term defined. Net assets is a balance sheet concept, not an income tax base.","notes":["Taxable income (Sec. 31) = gross income less allowable deductions.","Gross income (Sec. 32(A)) = all income from whatever source, unless excluded by law.","Exclusions never enter gross income; deductions are subtracted from gross income."],"upd":"TRAIN: personal and additional exemptions were removed starting 2018, so an individual's taxable income is now gross income less allowable deductions only.","key":""},{"id":"Q09-02","quiz":9,"num":2,"sec":"3.2-GI","q":"One of the following is NOT a requisite of a taxable income.","opts":["There must be gain.","The gain must be realized or received.","The gain must not be excluded by law from taxation.","The gain must be that of a resident or nonresident citizen."],"ans":3,"exp":"Income is taxable when there is a gain, the gain is realized or received, and the gain is not excluded by law or treaty. Citizenship or residence is not a requisite of taxable income; it only determines the extent of taxation (worldwide income vs. Philippine-source income only). Aliens and foreign corporations are also taxed on their Philippine-source income.","notes":["Requisites of taxable income: (1) gain, (2) realized or received, (3) not exempt by law or treaty.","Citizenship and residence affect only which income is taxable (situs), not whether income exists.","Unrealized gains (e.g., mere increase in value) are not yet income."],"upd":"","key":""},{"id":"Q09-03","quiz":9,"num":3,"sec":"3.2-GI","q":"This states that for income to exist, it is necessary that the capital be separated from something of exchangeable value.","opts":["Separability or severance test of income","Ability to pay theory","Benefits received theory","Situs of taxation"],"ans":0,"exp":"Under the severance test (Eisner v. Macomber), income arises only when a gain is severed or separated from the capital and received by the taxpayer for his separate use. Ability to pay and benefits received are theories on the basis of taxation, and situs refers to the place of taxation, not to the existence of income.","notes":["Severance test explains why stock dividends are generally not income: no gain is separated from the capital.","Ability to pay theory: tax burden should match the taxpayer's capacity (basis of progressive rates).","Benefits received theory: taxes are paid in exchange for government protection and services."],"upd":"","key":""},{"id":"Q09-04","quiz":9,"num":4,"sec":"3.2-GI","q":"Which of the following is NOT taxable?","opts":["Living quarters or meals furnished to an employee for the convenience of the employer","Tips or gratuities paid directly to an employee by a customer of the employer which are not accounted for by the employee to the employer","Pensions, retirement and separation pay, in general","Fixed or variable transportation, representation and other allowances which are received by a public officer or employee or officer or employee of a private entity, in addition to the regular compensation fixed for his position or office, in general"],"ans":0,"exp":"Under the convenience of the employer rule (RR 2-98), living quarters or meals furnished to an employee primarily because the employer needs the employee on or near the premises are not compensation income, since the benefit mainly serves the employer's business. Tips not accounted for to the employer are still taxable income of the employee (reported by him). Pensions, retirement and separation pay are, in general, taxable compensation unless they meet a specific exclusion under Sec. 32(B)(6). Fixed or variable allowances received on top of regular pay are, in general, taxable compensation.","notes":["Convenience of the employer rule: benefit is not taxable to the employee and is not subject to FBT (Sec. 33(C)).","Retirement pay is excluded only if it meets Sec. 32(B)(6)(a) (reasonable plan, age 50, 10 years, once) or RA 7641.","Separation pay is excluded only if separation is due to death, sickness, disability or causes beyond the employee's control.","Fixed RATA forms part of compensation; allowances subject to liquidation are not compensation."],"upd":"","key":""},{"id":"Q09-05","quiz":9,"num":5,"sec":"3.2-GI","q":"Any amount paid specifically, either as advances or reimbursements for traveling, representation and other bona fide ordinary and necessary expenses incurred or reasonably expected to be incurred by the employee in the performance of his duties, is not compensation subject to withholding if which of the following conditions is satisfied?\nI - It is for ordinary and necessary traveling and representation or entertainment expenses paid or incurred by the employee in the pursuit of the trade, business or profession.\nII - The employee is required to account/liquidate for the foregoing expenses in accordance with the specific requirements of substantiation for each category of expenses pursuant to Sec. 34 of the Code.","opts":["Neither I nor II","Both I and II","I only","II only"],"ans":1,"exp":"RR 2-98 excludes these advances or reimbursements from compensation only when BOTH conditions are met: the expenses are ordinary and necessary business expenses, and the employee must liquidate them with proper substantiation under Sec. 34. Meeting only one condition is not enough. Any excess of advances over the substantiated amount that is not returned to the employer is taxable compensation.","notes":["Both conditions are required (conjunctive), so single-condition choices are wrong.","Unliquidated or unreturned excess of advances is taxable compensation subject to withholding.","Fixed allowances not subject to liquidation are part of compensation."],"upd":"","key":""},{"id":"Q09-06","quiz":9,"num":6,"sec":"3.2-GI","q":"In computing gain or loss from the sale or other disposition of property acquired as gift or donation, the basis of cost shall be the:","opts":["fair market value, date of acquisition.","latest inventory value.","purchase price plus expenses of acquisition.","same as it would be in the hands of the donor."],"ans":3,"exp":"Under Sec. 40(B)(3), property acquired by gift takes the donor's basis (or that of the last preceding owner who did not acquire it by gift), so the donor's gain carries over to the donee. However, for computing a loss, the basis is the donor's basis or the fair market value at the time of the gift, whichever is lower. FMV at acquisition is the rule for inherited property, and purchase price plus acquisition expenses is the rule for purchased property.","notes":["Gift: carryover basis (donor's basis); for loss, lower of donor's basis or FMV at date of gift.","Inheritance: FMV at the time of acquisition (death).","Purchase: cost plus expenses of acquisition; inventory: latest inventory value."],"upd":"","key":""},{"id":"Q09-07","quiz":9,"num":7,"sec":"3.2-GI","q":"In computing gain or loss from the sale or other disposition of property acquired as inheritance, the basis of cost shall be the:","opts":["fair market value, date of acquisition/inheritance.","latest inventory value.","purchase price plus expenses of acquisition.","same as it would be in the hands of the decedent."],"ans":0,"exp":"Sec. 40(B)(2) provides that property acquired by inheritance takes as its basis the fair market value at the time of acquisition (i.e., the value subjected to estate tax). The decedent's basis does not carry over; the carryover rule applies to gifts, not inheritance. Latest inventory value and cost plus acquisition expenses apply to inventory and purchased property, respectively.","notes":["Inherited property: stepped-up basis = FMV at time of death.","Donated property: donor's basis (carryover), lower of donor's basis or FMV for loss.","Property acquired for less than adequate consideration: amount paid by the transferee (Sec. 40(B)(4))."],"upd":"","key":""},{"id":"Q09-08","quiz":9,"num":8,"sec":"3.2-GI","q":"Which of the following is NOT income of the lessor under a lease contract?","opts":["The consideration for the use of the property paid periodically by the lessee to the lessor","Obligations of the lessor to third parties paid by the lessee","Advance rentals in the nature of prepaid rent","Amount received in the nature of security deposit"],"ans":3,"exp":"A security deposit is not income when received because it is held to secure the lessee's performance and must be returned at the end of the lease; it becomes income only when applied to rent or forfeited. Periodic rent, lessor obligations paid by the lessee (e.g., the lessor's real property tax), and advance rentals without restriction are all rental income of the lessor. Advance rentals are income in the year received, regardless of the accounting method (RR 19-86).","notes":["Security deposit: income only upon forfeiture or application to rent.","Advance rentals (prepaid rent): taxable in the year received.","Lessor's obligations paid by the lessee (taxes, insurance, interest) are additional rent.","Leasehold improvements by lessee: lessor reports income by outright method or spread-out method."],"upd":"","key":""},{"id":"Q09-09","quiz":9,"num":9,"sec":"3.2-GI","q":"If an individual performs services for a creditor who, in consideration thereof, cancels the debt, the cancellation of indebtedness may amount to a:","opts":["gift.","capital contribution.","donation inter vivos.","payment of income."],"ans":3,"exp":"When a debt is cancelled in exchange for services rendered, the cancellation is compensation for those services, so it is payment of income to the debtor. A cancellation is a gift (donation) only if the creditor acts out of generosity with no consideration. It is a capital contribution only when a creditor-stockholder cancels a corporation's debt.","notes":["Debt cancelled for services = income (compensation).","Debt cancelled gratuitously = gift, subject to donor's tax on the creditor.","Corporation's debt cancelled by a shareholder = capital contribution."],"upd":"","key":""},{"id":"Q09-10","quiz":9,"num":10,"sec":"3.2-GI","q":"The recovery of an account previously written off would constitute taxable income only if, in the year the account was recognized as worthless, the write-off resulted in a reduction of taxable income. This refers to the:","opts":["Reciprocity rule","Equity of the incumbent rule","Tax benefit rule","Materiality rule"],"ans":2,"exp":"Under the tax benefit rule, a recovery of an item previously deducted (such as a bad debt written off) is included in gross income only to the extent the earlier deduction produced a tax benefit by reducing taxable income. If the write-off gave no tax benefit, the recovery is not taxable. The other rules listed do not govern recoveries of deducted items.","notes":["Applies to recoveries of bad debts, taxes and other amounts previously deducted.","No tax benefit from the prior deduction = recovery is not income.","Income taxes paid (other than those allowed as deduction) recovered are not income."],"upd":"","key":""},{"id":"Q09-11","quiz":9,"num":11,"sec":"3.2-GI","q":"One of the following is considered income for income taxation.","opts":["Advance in the value of the property of a person or a corporation","Increase in book value of real property and other fixed assets of a corporation as a result of their re-appraisal","Net increase in the value of livestock or increase of its inventory","Items of gross income which have been credited or set apart for the taxpayer without restriction"],"ans":3,"exp":"Under the doctrine of constructive receipt, income credited to the taxpayer's account or set apart for him without restriction, so that he may draw on it at any time, is taxable even if not physically received. Mere advances in value, appraisal increases and increases in the value of livestock are unrealized gains, so they are not yet income.","notes":["Constructive receipt: income credited or set apart without restriction is deemed received.","Unrealized appreciation (including revaluation surplus) is not taxable income.","Examples: interest credited to a savings account, matured coupons, dividends credited."],"upd":"","key":""},{"id":"Q09-12","quiz":9,"num":12,"sec":"3.2-GI","q":"If a stockholder receives a taxable stock dividend, what is the measure of income applicable to him?","opts":["Par value of the shares on the date he receives them","Fair market value of the shares on the date of declaration","The adjusted cost of the old shares and the new shares of the corporation","The book value of the shares of the preceding calendar year"],"ans":1,"exp":"When a stock dividend is taxable, the income is measured at the fair market value of the shares, not at par value, cost or book value. Stock dividends are generally not taxable because the shareholder's proportionate interest is unchanged; they become taxable in cases such as a redemption essentially equivalent to a taxable dividend (Sec. 73(B)) or a change in proportionate interests. The adjusted cost allocation in choice c is used for tax-free stock dividends.","notes":["Stock dividends are generally not taxable (Sec. 73(B)); exceptions make them taxable at FMV.","Tax-free stock dividend: allocate the original cost over the old and new shares.","Cash and property dividends from domestic corporations to resident individuals: 10% final tax."],"upd":"","key":""},{"id":"Q09-13","quiz":9,"num":13,"sec":"3.2-GI","q":"Which of the following will constitute taxable income?","opts":["Prize won in an essay contest the recipient joined","The Nobel Peace Prize","Prize won as most valuable amateur player in an international sports competition","Award not exceeding the amount set by law for being a model employee"],"ans":0,"exp":"Under Sec. 32(B)(7)(c), prizes for religious, charitable, scientific, educational, artistic, literary or civic achievement are excluded only if the recipient was selected without any action on his part to enter the contest and is not required to render substantial future services. By joining the essay contest, the recipient took action, so the prize is taxable. The Nobel Peace Prize meets the exclusion, prizes to athletes in sanctioned competitions are excluded under Sec. 32(B)(7)(d), and a model employee award within the de minimis ceiling is exempt.","notes":["Prizes over P10,000 are subject to 20% final tax; P10,000 or less goes to graduated rates.","Athletes' prizes in sports competitions sanctioned by the national sports association are fully excluded.","RR 29-2025: employee achievement awards up to P12,000 per year are de minimis (written, nondiscriminatory plan)."],"upd":"","key":""},{"id":"Q09-14","quiz":9,"num":14,"sec":"3.2-GI","q":"Which of the following damage recoveries is taxable?","opts":["Amount recovered from libel suits","Amount recovered in patent infringement suits","Amount recovered from breach of promise to marry","Amount recovered due to alienation of affection"],"ans":1,"exp":"Damages are taxable when they replace income that would have been taxed, such as lost profits or royalties. Damages for patent infringement compensate the owner for lost profits, so they are taxable. Damages for libel, breach of promise to marry and alienation of affection compensate for personal injury (injury to reputation or feelings), so they are excluded.","notes":["Test: what does the recovery replace? Lost income = taxable; personal injury = excluded.","Sec. 32(B)(4): compensation for personal injuries or sickness plus damages on account of such injuries is excluded.","Damages for lost profits or breach of contract are taxable."],"upd":"","key":""},{"id":"Q09-15","quiz":9,"num":15,"sec":"3.2-GI","q":"First statement: Tax-free income is not to be included in the income tax return unless information regarding it is specifically called for.\nSecond statement: While exclusions are simply not taken into account in determining gross income, deductions are subtracted from gross income to arrive at net income.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements are correct. Exclusions are not part of gross income and need not be reported unless the return specifically asks for the information. Deductions, on the other hand, are items subtracted from gross income to arrive at taxable (net) income.","notes":["Exclusions: flows of wealth not included in gross income (Sec. 32(B)).","Deductions: expenses and losses subtracted from gross income (Sec. 34).","Exemptions: grants of immunity from tax to particular persons or income."],"upd":"","key":""},{"id":"Q09-16","quiz":9,"num":16,"sec":"3.2-GI","q":"First statement: Proceeds of life insurance policies paid to the heirs or beneficiaries upon the death of the insured, whether in a single sum or otherwise, are excluded from gross income.\nSecond statement: If such amounts of the proceeds of life insurance are held by the insurer under an agreement to pay interest thereon, the interest payments shall be included in gross income.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements restate Sec. 32(B)(1). Life insurance proceeds paid upon the death of the insured are excluded from the beneficiary's gross income, whether paid in a lump sum or otherwise. However, if the insurer holds the proceeds under an agreement to pay interest, the interest is income and must be included.","notes":["Life insurance proceeds upon death: excluded from income tax.","Interest earned on proceeds held by the insurer: taxable.","Return of premiums under life insurance, endowment or annuity contracts: excluded (Sec. 32(B)(2))."],"upd":"","key":""},{"id":"Q09-17","quiz":9,"num":17,"sec":"3.2-GI","q":"The widow of your best friend has just been paid P1,000,000 on account of the life insurance policy of her deceased husband. She asks you whether she shall declare the amount for income tax purposes or for estate tax purposes.\nFirst advice: The proceeds of the life insurance paid to the beneficiary upon the death of the insured are exempt from income tax and need not be declared for income tax purposes.\nSecond advice: The proceeds of life insurance will have to be declared for estate tax purposes if the designation of the beneficiary is revocable; otherwise, they need not be declared.","opts":["Both advices are right","First advice right; second advice wrong","Both advices are wrong","First advice wrong; second advice right"],"ans":0,"exp":"Both advices are right. Life insurance proceeds paid upon death are excluded from income tax (Sec. 32(B)(1)). For estate tax, Sec. 85(E) includes proceeds in the gross estate when the beneficiary is the estate, executor or administrator (regardless of revocability), or a third person such as the widow when the designation is revocable. An irrevocable designation of a third-person beneficiary keeps the proceeds out of the gross estate.","notes":["Income tax: life insurance proceeds upon death are excluded.","Estate tax: included if beneficiary is the estate/executor/administrator, or a revocably designated third person.","Irrevocable third-person beneficiary: not part of the gross estate."],"upd":"","key":""},{"id":"Q09-18","quiz":9,"num":18,"sec":"3.2-GI","q":"Mr. Santiago purchased a life annuity for P100,000 which would pay him P10,000 a year. The life expectancy of Mr. Santiago was 12 years. Which of the following would Mr. Santiago be able to exclude from his gross income?","opts":["P120,000","P100,000","P20,000","P10,000"],"ans":1,"exp":"Amounts received under an annuity contract are excluded only as a return of the premium paid, i.e., a return of capital (Sec. 32(B)(2)). Mr. Santiago paid P100,000, so P100,000 of the P120,000 expected receipts (P10,000 x 12 years) is excluded. The P20,000 excess over the premium is income, and P10,000 is merely one year's receipt.","notes":["Exclusion for annuities and endowments = premiums paid (return of capital).","Receipts in excess of total premiums paid are taxable income.","Life insurance proceeds upon death are excluded in full; annuities are not."],"upd":"","key":""},{"id":"Q09-20","quiz":9,"num":20,"sec":"3.2-GI","q":"Mr. Monte was injured in a vehicular accident in 2004. He incurred and paid medical expenses of P20,000 and legal fees of P10,000 during the year. In 2007, he received P70,000 as settlement from the insurance company which insured the car owned by the other party involved in the accident. From the above payments and transactions, the amount of taxable income to Mr. Monte in 2007 was:","opts":["P70,000.","P50,000.","P40,000.","zero."],"ans":3,"exp":"Compensation for personal injuries or sickness, plus damages received on account of such injuries, is excluded from gross income under Sec. 32(B)(4). The entire P70,000 settlement is for Mr. Monte's physical injury, so none of it is taxable, even though it exceeds his medical and legal expenses. Subtracting the expenses (P40,000 or P50,000) wrongly treats the settlement as partly income.","notes":["Personal injury damages and insurance for injury or sickness: fully excluded.","Damages for lost profits or income: taxable (see item 21).","Medical expenses of individuals are not deductible under the NIRC."],"upd":"","key":""},{"id":"Q09-21","quiz":9,"num":21,"sec":"3.2-GI","q":"In a certain civil case, Wilfredo, plaintiff, was awarded by the court P20,000 damages representing profit he failed to realize on account of defendant's failure to comply with his obligation to Wilfredo. Are those damages taxable income of Wilfredo?","opts":["No, because damages are generally not subject to income tax.","Yes, because damages which are excluded from gross income are only those that are paid arising from injuries or sickness.","No, because no criminal case was filed by Wilfredo.","Yes, because damages arising out of a civil case are always taxable under the current provisions of the Tax Code."],"ans":1,"exp":"Only damages received on account of personal injuries or sickness are excluded (Sec. 32(B)(4)). Damages representing unrealized profits replace income that would have been taxed, so they are taxable. Choice a is wrong because damages are not generally exempt, c is irrelevant, and d overstates the rule since civil damages for personal injury are still excluded.","notes":["Damages for lost profits = taxable income.","Damages for personal injury or sickness = excluded.","Whether a criminal case was filed has no bearing on taxability."],"upd":"","key":""},{"id":"Q09-22","quiz":9,"num":22,"sec":"3.2-GI","q":"Which of the following retirement benefits received from private firms is NOT taxable?","opts":["Received from an employer under its reasonable pension plan, employee is 49 years old and has served the company for 12 years","Received from an employer under its reasonable pension plan, employee is 51 years old and has served the company for 9 years","Received from an employer which has no reasonable pension plan, employee is 53 years old and has served the company for 12 years","Received from an employer under its reasonable pension plan, employee is 52 years old and has served the company for 11 years"],"ans":3,"exp":"Under Sec. 32(B)(6)(a), retirement benefits from a private employer are excluded if received under a reasonable private benefit plan, the employee is at least 50 years old, has served the same employer for at least 10 years, and avails of the exclusion only once. Only choice d meets all conditions. Choice a fails the age test, b fails the service test, and c has no reasonable plan (and does not meet the RA 7641 age of 60).","notes":["Sec. 32(B)(6)(a): reasonable plan + at least 50 years old + at least 10 years with the same employer + once only.","RA 7641 (Labor Code) retirement pay when there is no plan: age 60 to 65 with at least 5 years of service, also excluded.","SSS and GSIS benefits are excluded."],"upd":"","key":""},{"id":"Q09-23","quiz":9,"num":23,"sec":"3.2-GI","q":"First statement: The law does not require that the 10-year requirement for tax-exempt retirement benefits should be uninterrupted.\nSecond statement: The tax-exempt retirement benefits shall be availed of by the official or employee only once.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements are correct. Sec. 32(B)(6)(a) and RR 2-98 require at least 10 years of service with the same employer but do not require that the service be continuous. The law also expressly provides that the exclusion may be availed of only once.","notes":["10 years of service with the same employer; need not be uninterrupted.","Retirement exclusion under a reasonable plan: once in a lifetime.","Employee must be at least 50 years old at retirement."],"upd":"","key":""},{"id":"Q09-24","quiz":9,"num":24,"sec":"3.2-GI","q":"Any amount received by an official or employee or by his heirs from the employer as a consequence of separation of such official or employee from the service of the employer shall be excluded from gross income, except if caused by:","opts":["death.","sickness or other physical disability.","any cause beyond the control of the official or employee.","none of the choices."],"ans":3,"exp":"Sec. 32(B)(6)(b) excludes separation pay received because of death, sickness or other physical disability, or any cause beyond the control of the official or employee. All three listed causes are grounds for exclusion, so none of them is an exception. Separation pay is taxable only when the separation is voluntary, i.e., within the employee's control.","notes":["Excluded: separation due to death, sickness, physical disability, or causes beyond the employee's control.","Taxable: voluntary resignation or retirement not meeting Sec. 32(B)(6)(a).","Causes beyond control include redundancy, retrenchment, closure and business reverses; age is irrelevant."],"upd":"","key":""},{"id":"Q09-25","quiz":9,"num":25,"sec":"3.2-GI","q":"Which of the following separation pay is taxable?","opts":["Separation pay received by an employee who resigned to join another company","Separation pay received by an employee whose services were terminated due to business reverses, the employee was 48 years at the time of termination","Separation pay received by an employee who was asked by his employer to resign because his position was declared a redundancy","Separation pay received by an employee who was retrenched by his employer because the latter is leaving the Philippines"],"ans":0,"exp":"Separation pay is excluded only when the separation is due to death, sickness, physical disability or a cause beyond the employee's control (Sec. 32(B)(6)(b)). Resigning to join another company is voluntary, so the separation pay is taxable. Business reverses, redundancy and retrenchment are all beyond the employee's control, and the age requirement applies only to retirement benefits, not separation pay.","notes":["Voluntary separation = taxable separation pay.","Involuntary separation (redundancy, retrenchment, business reverses) = excluded regardless of age or length of service.","A resignation forced by redundancy is still a cause beyond the employee's control."],"upd":"","key":""},{"id":"Q09-26","quiz":9,"num":26,"sec":"3.2-GI","q":"Which of the following shall NOT be subject to income tax?\nI - Pedro Reyes, an official of Corporation X, asked for \"early retirement\" because he was emigrating to Australia. He was paid P2,000,000 as separation pay in recognition of his valuable services to the corporation.\nII - Juan Cruz, another official of the same company, was separated for occupying a redundant position. He was given P500,000 as separation pay.\nIII - Jose Bautista was separated due to his failing eyesight. He was given P500,000 as separation pay.\nAll three were not qualified to retire under the BIR-approved pension plan of the corporation.","opts":["I, II and III","I and II","I only","II and III only"],"ans":3,"exp":"Since none qualified under the pension plan, only the separation pay rule of Sec. 32(B)(6)(b) can apply. Pedro's early retirement to emigrate was voluntary, so his P2,000,000 is taxable. Juan's separation for redundancy is beyond his control, and Jose's separation due to failing eyesight is due to sickness or physical disability, so both amounts are excluded.","notes":["Voluntary early retirement not under a qualified plan = taxable compensation.","Redundancy = cause beyond the employee's control (excluded).","Sickness or physical disability = excluded."],"upd":"","key":""},{"id":"Q09-27","quiz":9,"num":27,"sec":"3.2-GI","q":"First statement: Generally, the income of government entities performing proprietary functions is subject to tax.\nSecond statement: Income derived from any public utility or from the exercise of any essential governmental function accruing to the Government of the Philippines or to any political subdivision is not taxable.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements are true. Government entities engaged in proprietary (business) functions are generally taxable, which is why GOCCs are taxed except those expressly exempt. Sec. 32(B)(7)(b) excludes income derived from any public utility or from the exercise of any essential governmental function accruing to the national government or its political subdivisions.","notes":["Sec. 32(B)(7)(b): income from public utilities or essential governmental functions of the Government or its political subdivisions is excluded.","GOCCs are taxable except GSIS, SSS, PhilHealth and local water districts.","PCSO lost its exemption under TRAIN; PAGCOR under RA 9337."],"upd":"","key":""},{"id":"Q09-28","quiz":9,"num":28,"sec":"3.2-GI","q":"Prizes and awards made primarily in recognition of religious, charitable, scientific, educational, artistic, literary, or civic achievement shall be excluded from gross income, but only if the recipient:\nI - is selected without any action on his part to enter the contest or proceeding.\nII - is not required to render substantial future services as a condition to receiving such prize or award.","opts":["Both I and II are correct","Neither I nor II is correct","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 32(B)(7)(c) requires both conditions: the recipient was selected without any action on his part to enter the contest or proceeding, and he is not required to render substantial future services as a condition to receiving the prize. Failing either condition makes the prize taxable.","notes":["Both conditions must be present for the exclusion.","Joining a contest = action on the recipient's part, so the prize is taxable.","Taxable prizes over P10,000: 20% final tax; P10,000 or less: graduated rates."],"upd":"","key":""},{"id":"Q09-29","quiz":9,"num":29,"sec":"3.2-GI","q":"Conrad \"Smooth\" Ube is an amateur boxer. He is sent to compete in South Korea by the Amateur Boxing Association of the Philippines (ABAP) and wins the gold medal after beating his opponent Oh Ke Bah. He is awarded P500,000 by Good Faith Corp., a domestic Philippine corporation. What is the tax consequence of the award received by Conrad \"Smooth\" Ube?","opts":["Subject to Section 24(A)","Subject to final tax","Not subject to income tax","Subject to amusement tax"],"ans":2,"exp":"Sec. 32(B)(7)(d) excludes all prizes and awards granted to athletes in local and international sports competitions and tournaments, whether held in the Philippines or abroad, sanctioned by their national sports associations. Conrad competed under ABAP, the national sports association for boxing, so the award is excluded whoever the giver is. It is therefore neither subject to graduated rates nor to the 20% final tax on prizes, and amusement tax applies to operators of amusement places, not to athletes.","notes":["Athletes' prizes: excluded if the competition is sanctioned by the national sports association.","Applies to both local and international competitions, in the Philippines or abroad.","Other prizes over P10,000: 20% final tax (Sec. 24(B)(1))."],"upd":"","key":""},{"id":"Q09-30","quiz":9,"num":30,"sec":"3.2-GI","q":"The amount of the informer's reward shall be equivalent to:","opts":["ten percent (10%) of the amount recovered or one million pesos (P1,000,000) per case, whichever is higher.","ten percent (10%) of the amount recovered or one million pesos (P1,000,000) per case, whichever is lower.","fifteen percent (15%) of the amount recovered.","none of the choices."],"ans":1,"exp":"Sec. 282 grants an informer's reward equal to 10% of the revenues, surcharges or fees actually recovered and/or fine or penalty imposed and collected, or P1,000,000 per case, whichever is lower. Choice a uses the wrong comparison (higher), and there is no 15% rate. The reward is subject to 10% final withholding tax.","notes":["Informer's reward: 10% of amount recovered or P1,000,000 per case, whichever is lower.","Subject to 10% final tax (Sec. 24(B)(1)).","Not available to BIR/government employees or their relatives within the sixth degree, or if the information is already known to the BIR."],"upd":"","key":"Source key says D, but Sec. 282 provides a reward of 10% of the revenues, surcharges or fees recovered and/or fine or penalty collected, or P1,000,000 per case, whichever is lower, which matches choice b."},{"id":"Q10-01","quiz":10,"num":1,"sec":"3.2-FBT","q":"How much is the final tax imposed on the grossed-up monetary value of fringe benefits granted by the employer to the employee, except rank and file employees, starting January 1, 2018?","opts":["35%","34%","33%","25%"],"ans":0,"exp":"Sec. 33(A), as amended by TRAIN, imposes a 35% final tax on the grossed-up monetary value of fringe benefits given to managerial and supervisory employees starting January 1, 2018. The grossed-up value is the monetary value divided by 65%. The 25% rate applies only to nonresident aliens not engaged in trade or business (gross-up divisor 75%).","notes":["FBT = monetary value / 65% x 35%.","NRANETB: monetary value / 75% x 25%.","Pre-TRAIN rate was 32% (divisor 68%)."],"upd":"TRAIN: the FBT rate was raised from 32% to 35% effective January 1, 2018, changing the gross-up divisor from 68% to 65%.","key":""},{"id":"Q10-02","quiz":10,"num":2,"sec":"3.2-FBT","q":"When will the fringe benefit tax be paid?","opts":["Not later than the last day of the month following the close of the quarter during which withholding was made","Not later than the 15th day after the end of the fiscal quarter","Not later than the 20th day of the month after the end of the calendar year","Not later than the 25th day after the end of the calendar quarter"],"ans":0,"exp":"The FBT is withheld and remitted by the employer on a calendar quarterly basis. The quarterly return (BIR Form 1603Q) is filed and the tax paid not later than the last day of the month following the close of the quarter in which the withholding was made. The other deadlines belong to other returns or are not provided by law.","notes":["FBT return: BIR Form 1603Q, quarterly (calendar quarter).","Due: last day of the month following the close of the quarter.","EOPT: may be filed and paid with any AAB, RDO (through a Revenue Collection Officer) or authorized tax software provider."],"upd":"","key":""},{"id":"Q10-03","quiz":10,"num":3,"sec":"3.2-FBT","q":"Fringe benefit tax is imposed on:","opts":["managerial and supervisory employees.","rank and file employees.","consultants.","employers."],"ans":0,"exp":"Sec. 33(A) imposes the FBT on the grossed-up monetary value of fringe benefits furnished to employees except rank and file employees, i.e., to managerial and supervisory employees. It is a final income tax on the employee, although the employer withholds and pays it. Fringe benefits of rank and file employees are taxed as compensation under Sec. 24, and consultants are not employees.","notes":["FBT covers managerial and supervisory employees only.","Rank and file benefits: compensation income (subject to the P90,000 exclusion for 13th month and other benefits, and de minimis).","The employer may deduct both the fringe benefit and the FBT paid as a business expense."],"upd":"","key":""},{"id":"Q10-04","quiz":10,"num":4,"sec":"3.2-FBT","q":"The term means all employees who are holding neither managerial nor supervisory positions.","opts":["Contractual employees","Rank and file employees","Minimum wage earners","Ranking employees"],"ans":1,"exp":"RR 3-98, following the Labor Code definition, defines rank and file employees as all employees holding neither managerial nor supervisory positions. Their benefits are not subject to FBT but are taxed as compensation income. Contractual status and minimum wage status describe the employment arrangement or pay level, not the position classification.","notes":["Rank and file = neither managerial nor supervisory.","RR 29-2025 de minimis ceilings (e.g., rice subsidy P2,500 per month, uniform P8,000 per year) apply to all employees.","Excess of de minimis ceilings goes to other benefits (P90,000 exclusion), not FBT, for rank and file."],"upd":"","key":""},{"id":"Q10-05","quiz":10,"num":5,"sec":"3.2-FBT","q":"One who is vested with powers or prerogatives to lay down and execute management policies and/or to hire, transfer, suspend, lay off, recall, discharge, assign or discipline employees.","opts":["Managerial employee","Supervisory employee","Ranking employee","None of the choices"],"ans":0,"exp":"A managerial employee is one vested with powers or prerogatives to lay down and execute management policies and/or to hire, transfer, suspend, lay off, recall, discharge, assign or discipline employees (RR 3-98, Labor Code). A supervisory employee only effectively recommends such actions using independent judgment.","notes":["Managerial: lays down and executes policies; hires and fires.","Supervisory: effectively recommends managerial actions with independent judgment.","Both are subject to FBT."],"upd":"","key":""},{"id":"Q10-06","quiz":10,"num":6,"sec":"3.2-FBT","q":"Those who, in the interest of the employer, effectively recommend such managerial actions, if the exercise of such authority is not merely routinary or clerical in nature but requires the use of independent judgment.","opts":["Managerial employee","Supervisory employee","Ranking employee","None of the choices"],"ans":1,"exp":"Supervisory employees are those who, in the interest of the employer, effectively recommend managerial actions, where the exercise of authority requires independent judgment and is not merely routinary or clerical. Managerial employees, by contrast, have the power to decide and execute such actions themselves.","notes":["Key word for supervisory: 'effectively recommend' with independent judgment.","Key word for managerial: 'lay down and execute' policies.","Routinary or clerical authority does not make one a supervisor."],"upd":"","key":""},{"id":"Q10-07","quiz":10,"num":7,"sec":"3.2-FBT","q":"In general, expenses incurred or paid by the employee but which are paid or reimbursed by his employer shall be treated as taxable fringe benefits, except when:\nI - the expenditures are duly receipted for and in the name of the employer.\nII - the expenditures do not partake of the nature of a personal expense attributable to the employee.","opts":["Both I and II are required for the exception","Neither I nor II is required for the exception","Only I is required for the exception","Only II is required for the exception"],"ans":0,"exp":"Under RR 3-98, expenses of the employee paid or reimbursed by the employer are taxable fringe benefits unless BOTH conditions are met: the expenditures are duly receipted for and in the name of the employer, and they are not personal expenses attributable to the employee. If either condition is missing, the amount is a taxable fringe benefit. Personal expenses (e.g., groceries) are taxable fringe benefits even if receipted in the employer's name.","notes":["Both conditions are required: receipted in the employer's name AND not personal in nature.","Personal expenses paid by the employer are taxable fringe benefits regardless of whose name is on the receipt.","Fixed and regular RATA is compensation (Sec. 24), not a fringe benefit."],"upd":"","key":"Source stem reads 'in the name of the employee'; corrected to 'employer' as RR 3-98 provides, which is what the key (A) assumes. As printed, statement I would not be a requirement."},{"id":"Q10-08","quiz":10,"num":8,"sec":"3.2-FBT","q":"Which of the following fringe benefits shall NOT be subject to the fringe benefit tax?\nI - Fringe benefits required by the nature of, or necessary to, the trade, business or profession of the employer\nII - Fringe benefits for the convenience or advantage of the employer","opts":["I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Sec. 33(C) and RR 3-98 exempt from FBT fringe benefits that are required by the nature of, or necessary to, the employer's trade, business or profession, and those given for the convenience or advantage of the employer. Both are not subject to FBT. Other exempt benefits include those exempted by law, employer contributions to retirement, insurance and hospitalization plans, and de minimis benefits.","notes":["FBT-exempt: required by or necessary to the business; for the employer's convenience; de minimis; retirement/insurance/hospitalization plan contributions; exempt by law.","RR 29-2025 de minimis examples: medical assistance P12,000 per year, laundry P400 per month, Christmas/anniversary gifts P6,000 per year.","Benefits to rank and file are not subject to FBT but to compensation income tax."],"upd":"","key":""},{"id":"Q10-09","quiz":10,"num":9,"sec":"3.2-FBT","q":"In which of the following cases shall the expense account NOT be treated as a taxable fringe benefit but subject to the tax imposed under Section 24 of the Tax Code?","opts":["Expenses incurred by the employee but which are paid by his employer","Expenses paid for by the employee but reimbursed by his employer","Personal expenses of the employee (like purchase of groceries for the personal consumption of the employee and his family members) paid for or reimbursed by the employer to the employee, whether or not the same are duly receipted for in the name of the employer","Representation and transportation allowances which are fixed in amounts and are regularly received by the employees as part of their monthly compensation income"],"ans":3,"exp":"RR 3-98 treats fixed and regularly received representation and transportation allowances (RATA) as part of the employee's compensation, so they are taxed under Sec. 24 and subject to withholding on compensation, not FBT. Expenses of the employee paid or reimbursed by the employer (choices a and b) and personal expenses such as groceries (choice c) are treated as taxable fringe benefits.","notes":["Fixed, regular RATA = compensation income under Sec. 24.","Employee's personal expenses paid by the employer = taxable fringe benefit (FBT for managerial/supervisory).","Liquidated business expenses in the employer's name = not a fringe benefit."],"upd":"","key":""},{"id":"Q10-11","quiz":10,"num":11,"sec":"3.2-FBT","q":"The monetary value of the following housing privileges shall be fifty percent (50%) of the value of the benefit, EXCEPT which of the following?","opts":["If the employer leases a residential property for the use of his employee and the said property is the usual place of residence of the employee","If the employer owns a residential property and the same is assigned for the use of his employee as his usual place
