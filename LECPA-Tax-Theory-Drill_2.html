e is now the primary document for both goods and services.","Below the threshold, invoices may be issued upon request or at the end of the day for the total sales."],"upd":"EOPT (RA 11976): the threshold was raised from P100 to P500 or more, and the invoice replaces the official receipt as the primary sales document for both goods and services.","key":""},{"id":"Q15-25","quiz":15,"num":25,"sec":"3.9","q":"First statement: Where the receipt is issued to cover payment made as rentals, commissions, compensations or fees, receipts or invoices shall be issued which shall show the name and address of the purchaser, customer or client.\nSecond statement: Where the purchaser is a VAT-registered person, in addition to the information herein required, the invoice or receipt shall further show the Taxpayer Identification Number (TIN) of the purchaser.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is incorrect"],"ans":0,"exp":"Both statements reflect Sec. 237. Invoices covering rentals, commissions, compensation or fees must show the name and address of the purchaser, customer or client. If the buyer is VAT-registered, the invoice must also show the buyer's TIN so it can support the buyer's input VAT claim.","notes":["Buyer's TIN is required when the buyer is VAT-registered.","Invoices must be registered with the BIR.","Invoices support the buyer's input VAT and expense claims."],"upd":"EOPT (RA 11976): the invoice replaces the official receipt as the primary sales document, so these details are now shown on the invoice.","key":""},{"id":"Q15-26","quiz":15,"num":26,"sec":"3.9","q":"All persons who print receipts or sales or commercial invoices shall maintain a logbook or register of taxpayers who availed of their printing services. The logbook or register shall contain the following information:\nI. Names and Taxpayer Identification Numbers of the persons or entities for whom the receipts or sales or commercial invoices were printed.\nII. Number of booklets, number of sets per booklet, number of copies per set and the serial numbers of the receipts or invoices in each booklet.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 238 requires printers of receipts and invoices to keep a register of the taxpayers they printed for. It must show the names and TINs of those taxpayers and the number of booklets, sets per booklet, copies per set and serial numbers. Both are required.","notes":["Printers need BIR authority before printing invoices (Authority to Print).","Printer's register: names, TINs, booklets, sets, copies and serial numbers.","Invoices must be serially numbered."],"upd":"","key":""},{"id":"Q15-27","quiz":15,"num":27,"sec":"3.9","q":"Under the TRAIN, corporations, companies, partnerships or persons whose gross annual sales, earnings, receipts or output amount to how much shall have their books of accounts audited and examined yearly by independent Certified Public Accountants and their income tax returns accompanied by a duly accomplished Account Information Form (AIF)?","opts":["Three million pesos (P3,000,000) or less","Three million pesos (P3,000,000) or more","Exceeding Three million pesos (P3,000,000)","Exceeding One hundred fifty thousand pesos (P150,000)"],"ans":2,"exp":"Sec. 232(B), as amended by TRAIN, requires audit by an independent CPA when gross annual sales, earnings, receipts or output EXCEED P3,000,000. Exactly P3,000,000 does not trigger the requirement, which rules out choice b. The old threshold was gross quarterly sales exceeding P150,000.","notes":["CPA-audited FS required: gross annual sales exceeding P3,000,000.","Pre-TRAIN: gross quarterly sales exceeding P150,000.","P3,000,000 is also the VAT threshold and the 8% option ceiling."],"upd":"","key":""},{"id":"Q15-28","quiz":15,"num":28,"sec":"3.9","q":"The books of account may be kept in the following languages, except:","opts":["Native language.","Spanish.","English.","Chinese or Japanese."],"ans":3,"exp":"Sec. 234 requires books of accounts to be kept in a native language, English or Spanish. Books kept in any other language, such as Chinese or Japanese, must be accompanied by a true and complete translation in a native language, English or Spanish.","notes":["Allowed languages: native language, English or Spanish.","Other languages: must keep a true and complete translation.","Books must be kept in the Philippines."],"upd":"","key":""},{"id":"Q15-29","quiz":15,"num":29,"sec":"3.9","q":"All taxpayers are required to preserve their books of accounts, including subsidiary books and other accounting records, for a period of how many years, for the taxable year when the last entry was made in the books of accounts?","opts":["Five (5) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return.","Ten (10) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return.","Fifteen (15) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return.","Twenty (20) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return."],"ans":0,"exp":"Sec. 235, as amended by EOPT, and RR 7-2024 require books of accounts and accounting records to be preserved for five years, reckoned from the day after the filing deadline or, if filed late, from the actual filing date. The 10-year rule of RR 17-2013, as amended by RR 5-2014, no longer applies, so 10, 15 and 20 years are wrong.","notes":["Preservation period: 5 years (EOPT, RR 7-2024).","Reckoned from the day after the filing deadline, or from actual filing if late.","Books related to a pending protest or refund claim are kept until the case is resolved."],"upd":"EOPT (RA 11976, RR 7-2024): preservation period is 5 years; RR 17-2013 as amended by RR 5-2014 previously required 10 years (hardcopies for the first 5).","key":""},{"id":"Q15-30","quiz":15,"num":30,"sec":"3.9","q":"The taxpayer shall retain hardcopies of the books of accounts, including subsidiary books and other accounting records, within how many years, for the taxable year when the last entry was made in the books of accounts?","opts":["The first five (5) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return","The first ten (10) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return","The first fifteen (15) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return","The first twenty (20) years reckoned from the day following the deadline in filing a return, or if filed after the deadline, from the date of the filing of the return"],"ans":0,"exp":"Hardcopies of the books and accounting records are retained for the first five years, reckoned from the day after the filing deadline or from the actual filing date if late. Under EOPT, five years is also the whole preservation period, so manual books are kept in hardcopy for that period and computerized books may be kept electronically.","notes":["Hardcopies: first 5 years.","Manual or loose-leaf books: hardcopy; computerized books: electronic copies (RR 7-2024).","Total preservation period under EOPT: 5 years."],"upd":"EOPT (RA 11976, RR 7-2024): the total preservation period is now 5 years; under RR 5-2014 hardcopies were kept for the first 5 of 10 years, with electronic copies allowed after that.","key":""},{"id":"Q15-31","quiz":15,"num":31,"sec":"3.9","q":"Unless a longer period of retention is required under the NIRC or other relevant laws, the independent Certified Public Accountant (CPA) who audited the records and certified the financial statements of the taxpayer, equally as the taxpayer, has the responsibility to maintain and preserve electronic copies of the audited and certified financial statements including the audit working papers for a period of how many years?","opts":["Five (5) years from the due date of filing the annual income tax return or the actual date of filing thereof, whichever comes later.","Ten (10) years from the due date of filing the annual income tax return or the actual date of filing thereof, whichever comes later.","Fifteen (15) years from the due date of filing the annual income tax return or the actual date of filing thereof, whichever comes later.","Twenty (20) years from the due date of filing the annual income tax return or the actual date of filing thereof, whichever comes later."],"ans":0,"exp":"The independent CPA, like the taxpayer, must keep electronic copies of the audited financial statements and audit working papers for five years from the due date of the annual ITR or its actual filing, whichever is later (RR 7-2024). The longer periods in the other choices are not the rule.","notes":["CPA retention of AFS and working papers: 5 years, electronic copies.","Reckoned from the ITR due date or actual filing, whichever is later.","A longer period applies if required by other laws."],"upd":"EOPT (RA 11976, RR 7-2024): 5-year preservation; the pre-EOPT rule under RR 17-2013 as amended by RR 5-2014 was 10 years.","key":""},{"id":"Q15-32","quiz":15,"num":32,"sec":"3.8","q":"Under this system, the amount of income tax withheld by the withholding agent is constituted as a full and final payment of the income tax due from the payee on the said income.","opts":["Creditable withholding tax","Final withholding tax","Global tax system","Schedular tax system"],"ans":1,"exp":"Under the final withholding tax system, the tax withheld is the full and final payment of the payee's income tax on that income; the payee no longer reports it in the ITR. The liability for the tax rests primarily on the withholding agent. Creditable withholding only approximates the tax and is credited against the payee's tax due.","notes":["Final tax: payee does not report the income again; no further tax.","Liability for final tax is primarily on the withholding agent.","Examples: interest on deposits, dividends, prizes, royalties, FBT."],"upd":"","key":""},{"id":"Q15-33","quiz":15,"num":33,"sec":"3.8","q":"Under this system, taxes withheld on certain income payments are intended to equal or at least approximate the tax due of the payee on said income.","opts":["Creditable withholding tax","Final withholding tax","Global tax system","Schedular tax system"],"ans":0,"exp":"Creditable withholding tax is intended to equal or approximate the payee's tax due. The payee still reports the income in the ITR and credits the tax withheld against the tax due. Final withholding, by contrast, fully settles the tax on the income.","notes":["CWT is credited against the payee's income tax due.","Includes withholding on compensation and expanded withholding tax.","Proof of CWT: BIR Form 2307 (or 2316 for employees)."],"upd":"","key":""},{"id":"Q15-34","quiz":15,"num":34,"sec":"3.8","q":"First statement: The obligation of the payor to deduct and withhold the tax under Section 2.57 of Revenue Regulations No. 2-98 arises at the time an income payment is paid or payable.\nSecond statement: Where an income is not yet paid or payable but the same has been recorded as an expense or asset, whichever is applicable, in the payor's books, the obligation to withhold shall arise in the last month of the return period in which the same is claimed as an expense or amortized for tax purposes.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"The first statement is correct: the obligation to withhold arises when the income is paid or becomes payable. The second statement is outdated. Under EOPT, the obligation arises when the income becomes payable, which the IRR treats as when it is accrued or recorded as an expense or asset, or when the seller issues the invoice, whichever comes first.","notes":["EOPT: withhold when income becomes payable.","Payable: accrued or recorded as expense/asset, or invoice issued, whichever comes first.","Withholding agent is liable for taxes it fails to withhold."],"upd":"EOPT (RA 11976): the obligation to withhold arises when the income becomes payable (IRR: when accrued/recorded or when the seller issues the invoice, whichever comes first); the older \"last month of the return period\" rule in the second statement no longer applies.","key":""},{"id":"Q15-35","quiz":15,"num":35,"sec":"3.8","q":"Which of the following income payments shall NOT be exempted from the requirement of withholding tax on compensation, but may be subject to income tax depending on the nature or sources of income earned by the individual recipient?","opts":["Thirteenth month pay and other benefits (P90,000)","GSIS, SSS, Medicare and other contributions","Compensation income of Minimum Wage Earners (MWEs) who work in the private sector and are paid the Statutory Minimum Wage (SMW)","Compensation during the year exceeding Two hundred fifty thousand pesos (P250,000)"],"ans":3,"exp":"The revenue regulations exempt from withholding on compensation the 13th month pay and other benefits up to P90,000, mandatory GSIS, SSS, PhilHealth (Medicare) and Pag-IBIG contributions, and the SMW of minimum wage earners. Compensation exceeding P250,000 for the year is taxable and subject to withholding, so it is the one NOT exempted.","notes":["Exempt from withholding: 13th month and other benefits up to P90,000.","Mandatory contributions (GSIS, SSS, PhilHealth, Pag-IBIG) are excluded.","MWEs: SMW, holiday, overtime, night shift and hazard pay are exempt."],"upd":"","key":""},{"id":"Q15-36","quiz":15,"num":36,"sec":"3.8","q":"First statement: Taxpayers mandated to electronically file and pay shall use the BIR's electronic system, while those not mandated have the option to either use the said electronic system, or file with the Authorized Agent Banks (AABs) under the jurisdiction of the Revenue District Office where they are registered.\nSecond statement: For withholding agents located in municipalities where there is no AAB, the returns shall be filed with the Revenue Collection Officer assigned in the said municipality.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements describe valid filing options. Mandated taxpayers must use the electronic system, while others may file electronically or manually with an AAB; where there is no AAB, the return may be filed with the Revenue Collection Officer. Under EOPT these options are no longer limited to the taxpayer's own RDO.","notes":["Mandated e-filers must use the BIR's electronic systems.","Non-mandated: electronic or manual filing with an AAB.","No AAB in the area: file with the Revenue Collection Officer."],"upd":"EOPT (RA 11976): file anywhere; manual returns may be filed with any AAB or with any RDO through its Revenue Collection Officer, not only those of the RDO where the taxpayer is registered.","key":""},{"id":"Q15-37","quiz":15,"num":37,"sec":"3.8","q":"The filing of the withholding tax returns (BIR Form No. 1601EQ for creditable withholding tax and Form Nos. 1602Q for final tax on interest on bank deposits, 1603Q for final tax withheld on fringe benefits, and 1601FQ for all other final withholding taxes) and payment of the taxes withheld at source shall be made:","opts":["Not later than the last day of the month following the close of the quarter during which the withholding was made.","Not later than the 20th day of the month following the close of the quarter during which the withholding was made.","Not later than the 25th day of the month following the close of the quarter during which the withholding was made.","Not later than the first day of the month following the close of the quarter during which the withholding was made."],"ans":0,"exp":"Quarterly withholding returns (1601EQ, 1602Q, 1603Q, 1601FQ) are filed and the taxes paid not later than the last day of the month following the close of the quarter (RR 11-2018). The 25th day is the deadline of the quarterly percentage tax and VAT returns, not of withholding returns.","notes":["Quarterly withholding returns: last day of the month after the quarter.","Monthly remittance (0619E/0619F): 10th day of the following month (15th for EFPS).","Compensation withholding (1601C): monthly, 10th day of the following month."],"upd":"","key":""},{"id":"Q15-38","quiz":15,"num":38,"sec":"3.8","q":"Which of the following statements is/are incorrect?\nStatement I: Considering that taxes withheld by the withholding agents are held in trust for the government and their availability is an imperious necessity to ensure sufficient cash inflow to the National Treasury, withholding agents shall file BIR Monthly Remittance Form (BIR Form No. 0619E and/or 0619F) every tenth (10th) day of the following month when the withholding is made, regardless of the amount withheld.\nStatement II: For withholding agents using the EFPS facility, the due date is on the fifteenth (15th) day of the following month.\nStatement III: Withholding agents with zero remittance are not required to use and file the same form.","opts":["Statements I, II and III","Statements I and III","Statement II","Statement III"],"ans":3,"exp":"Statements I and II are correct: the monthly remittance forms (0619E/0619F) are due on the 10th day of the following month (15th for EFPS filers), regardless of the amount withheld. Statement III is incorrect because RR 11-2018 requires withholding agents with zero remittance to still file the same form.","notes":["0619E/0619F: 10th day of the following month; EFPS: 15th day.","Zero remittance: form must still be filed.","Monthly remittances cover the first two months of each quarter."],"upd":"","key":""},{"id":"Q15-39","quiz":15,"num":39,"sec":"3.8","q":"First statement: On or before the end of the calendar year but prior to the payment of the compensation for the last payroll period, the employer shall determine the tax due from each employee on taxable compensation income for the entire taxable year in accordance with Section 24(A).\nSecond statement: The difference between the tax due from the employee for the entire year and the sum of taxes withheld from January to November shall either be withheld from his salary in December of the current calendar year or refunded to the employee not later than January 25 of the succeeding year.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements describe the year-end adjustment (annualization) under RR 2-98. Before paying the last payroll of the year, the employer computes the employee's annual tax due. Any deficiency is withheld from the December salary, and any excess withheld is refunded not later than January 25 of the following year.","notes":["Year-end adjustment: done before the last payroll of the year.","Under-withholding: deduct from December salary.","Over-withholding: refund not later than January 25 of the following year."],"upd":"","key":""},{"id":"Q15-40","quiz":15,"num":40,"sec":"3.8","q":"First statement: On or before the end of the calendar year but prior to the payment of the compensation for the last payroll period, the employer shall determine the tax due from each employee on taxable compensation income for the entire taxable year in accordance with Section 24(A).\nSecond statement: The difference between the tax due from the employee for the entire year and the sum of taxes withheld from January to November shall either be withheld from his salary in December of the current calendar year or refunded to the employee not later than January 25 of the succeeding year.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements describe the year-end adjustment under RR 2-98. The employer computes the annual tax due before the last payroll of the year; a deficiency is withheld from the December salary, and an excess is refunded not later than January 25 of the following year.","notes":["Year-end adjustment: done before the last payroll of the year.","Under-withholding: deduct from December salary.","Over-withholding: refund not later than January 25 of the following year."],"upd":"","key":"Repeat of item 39 in the source quiz."},{"id":"Q16-01","quiz":16,"num":1,"sec":"6","q":"A tax on documents, instruments, loan agreements, and papers evidencing the acceptance, assignment, sale or transfer of an obligation, right or property incident thereto.","opts":["Documentary stamp tax","Excise tax","Value-added tax","Other percentage tax"],"ans":0,"exp":"Sec. 173 imposes documentary stamp tax (DST) on documents, instruments, loan agreements and papers evidencing the acceptance, assignment, sale or transfer of an obligation, right or property. Excise tax is on goods and certain services, while VAT and percentage taxes are business taxes on sales or receipts.","notes":["DST is imposed on the document or the transaction it evidences (Sec. 173).","Liable: the person making, signing, issuing, accepting or transferring the document.","Electronic documents are also subject to DST."],"upd":"","key":""},{"id":"Q16-02","quiz":16,"num":2,"sec":"6","q":"First statement: The DST rates shall be applicable to all documents not otherwise expressly exempted by law, notwithstanding the fact that they are in electronic form.\nSecond statement: Under R.A. 8792, otherwise known as the Electronic Commerce Act, electronic documents are the functional equivalent of a written document under existing laws, and the issuance thereof is therefore tantamount to the issuance of a written document, and therefore subject to DST.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. The Electronic Commerce Act (RA 8792) treats electronic documents as the functional equivalent of written documents, so issuing one is the same as issuing a paper document and DST applies unless the document is expressly exempt.","notes":["Electronic documents are subject to DST just like paper documents.","Basis: RA 8792 (functional equivalence of electronic documents).","Only documents expressly exempted by law escape DST."],"upd":"","key":""},{"id":"Q16-03","quiz":16,"num":3,"sec":"6","q":"First statement: DST is in the nature of an excise tax levied on the exercise by persons of certain privileges conferred by law for the creation, revision, or termination of specific legal relationships through the execution of specific instruments.\nSecond statement: In general, DST may be imposed on the transaction itself or upon the document underlying such act.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. DST is an excise on the privilege of entering into certain transactions through specific instruments, and it may attach to the transaction itself or to the document that evidences it.","notes":["DST is an excise tax on the privilege of executing certain instruments.","It may be imposed on the transaction or on the underlying document.","The tax attaches upon the making, signing, issuance, acceptance or transfer of the document."],"upd":"","key":""},{"id":"Q16-04","quiz":16,"num":4,"sec":"6","q":"First statement: DSTs are levied independently of the legal status of the transactions giving rise thereto.\nSecond statement: DSTs must be paid upon the issuance of the instruments only when the contracts which gave rise to them are valid.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"DST is levied independently of the legal status of the underlying transaction, so the first statement is correct. The second is wrong: DST must be paid upon issuance of the instrument whether the contract is valid, rescissible, void, voidable or unenforceable.","notes":["DST is due regardless of whether the contract is valid, void, voidable, rescissible or unenforceable.","The taxable event is the issuance of the instrument.","Later rescission or nullity does not make DST refundable on that ground alone."],"upd":"","key":""},{"id":"Q16-05","quiz":16,"num":5,"sec":"6","q":"Which of the following statements is incorrect?","opts":["DST is a tax on certain transactions and is imposed against the person making, signing, issuing, accepting or transferring the document or facility evidencing the transaction.","In general, DST may be imposed on the transaction itself or upon the document underlying such act.","Any of the parties may agree on who shall be liable or how they may share in the cost of the DST.","Whenever one of the parties to the taxable transaction is exempt from the DST, both parties shall be proportionately liable for the tax."],"ans":3,"exp":"Choice d is incorrect: under Sec. 173, when one party to the taxable transaction is exempt, the other party who is not exempt is directly liable for the full tax, not a proportionate share. The other choices are correct statements: DST is imposed on the person making, signing, issuing, accepting or transferring the document, it may attach to the transaction or the document, and the parties may agree among themselves on who bears the cost.","notes":["If one party is exempt, the non-exempt party is directly liable for the whole DST (Sec. 173).","Any party to the document is liable for the full DST; the parties may agree on sharing the cost between themselves.","DST attaches to the person making, signing, issuing, accepting or transferring the document."],"upd":"","key":""},{"id":"Q16-06","quiz":16,"num":6,"sec":"6","q":"The documentary stamp tax return shall be filed and the tax paid:","opts":["within twenty-five (25) days after the close of the month when the taxable document was made, signed, accepted or transferred.","within twenty (20) days after the close of the month when the taxable document was made, signed, accepted or transferred.","within fifteen (15) days after the close of the month when the taxable document was made, signed, accepted or transferred.","within five (5) days after the close of the month when the taxable document was made, signed, accepted or transferred."],"ans":3,"exp":"Sec. 200(B), as amended by TRAIN, requires the DST return (BIR Form 2000) to be filed and the tax paid within five days after the close of the month when the taxable document was made, signed, issued, accepted or transferred. The 25-, 20- and 15-day periods belong to other returns.","notes":["DST return (BIR Form 2000): within 5 days after the close of the month.","Pre-TRAIN rule was 10 days after the close of the month.","Tax is paid at the same time the return is filed."],"upd":"TRAIN: shortened the DST filing and payment period from 10 days to 5 days after the close of the month (Sec. 200(B)); the source solution quotes the old 10-day text, but its key (D) reflects the current rule.","key":""},{"id":"Q16-07","quiz":16,"num":7,"sec":"6","q":"Except in cases where the Commissioner otherwise permits, the DST return shall be filed, either electronically or manually, and the tax due paid, either electronically or manually, through:","opts":["an authorized agent bank.","the Revenue District Office through a Revenue Collection Officer.","an authorized tax software provider.","any of the above."],"ans":3,"exp":"Under the EOPT Act's \"file anywhere\" rule, returns may be filed and taxes paid electronically or manually with any authorized agent bank, the Revenue District Office through a Revenue Collection Officer, or an authorized tax software provider. Each option is valid, so the answer is any of the above.","notes":["EOPT: file and pay with any AAB, RDO through an RCO, or authorized tax software provider.","Filing and payment are no longer tied to the taxpayer's own RDO.","Filing may be electronic or manual."],"upd":"EOPT (RA 11976): introduced the \"file anywhere\" rule allowing filing and payment with any AAB, RDO through an RCO, or authorized tax software provider.","key":""},{"id":"Q16-08","quiz":16,"num":8,"sec":"6","q":"In lieu of filing the DST return (BIR Form No. 2000), the tax may be paid through:\nI - Purchase and actual affixture\nII - Imprinting the stamps through a documentary stamp metering machine on the taxable document\nIII - On-line electronic DST imprinting machine","opts":["I, II and III are correct","I and II are correct","I and III are correct","Only I is correct"],"ans":0,"exp":"Sec. 200(D) allows DST to be paid by purchase and actual affixture of stamps, or by imprinting stamps through a documentary stamp metering machine; the on-line electronic DST (eDST) imprinting machine is also an authorized mode. All three are valid alternatives to filing BIR Form 2000.","notes":["Modes: loose stamps (affixture), DST metering machine, and on-line eDST imprinting.","Certain taxpayers (banks, insurers, shipping and airline firms, pre-need and educational institutions) must use eDST.","Unstamped documents cannot be recorded or admitted in evidence."],"upd":"","key":""},{"id":"Q16-09","quiz":16,"num":9,"sec":"6","q":"Unless expressly exempted by the Commissioner on meritorious grounds, which of the following classes of taxpayers shall use the on-line electronic DST imprinting machine in the payment and remittance of DST?\nI - Banks, quasi-banks or non-bank financial intermediaries, finance companies, or insurance, surety, fidelity, or annuity companies\nII - Shipping and airline companies\nIII - Pre-need companies on sale of pre-need plans\nIV - Educational institutions with respect to the issuance of taxable certificates (e.g., diplomas, transcripts of records, and other documents taxable as certificates)","opts":["I, II, III and IV","I, II and III only","I and IV only","II, III and IV only"],"ans":0,"exp":"All four classes are required to use the on-line electronic DST imprinting machine unless the Commissioner exempts them on meritorious grounds. These taxpayers issue high volumes of taxable documents (loans, insurance policies, bills of lading and tickets, pre-need plans, certificates), which is why eDST is mandatory for them.","notes":["Mandatory eDST users: banks and financial intermediaries, insurers, shipping and airline companies, pre-need companies, educational institutions for certificates.","The Commissioner may exempt a taxpayer on meritorious grounds.","Diplomas and transcripts are taxable as certificates."],"upd":"","key":""},{"id":"Q16-10","quiz":16,"num":10,"sec":"6","q":"Which of the following is NOT an effect of failure to affix the required DST?","opts":["An instrument, document or paper which is required by law to be stamped and which has been signed, issued, accepted or transferred without being duly stamped shall not be recorded.","An instrument, document or paper, or any copy thereof or any record of transfer of the same, which is required by law to be stamped shall not be admitted or used in evidence in any court until the requisite stamp or stamps are affixed thereto and cancelled.","No notary public or other officer authorized to administer oaths shall add his jurat or acknowledgment to any document subject to DST unless the proper documentary stamps are affixed thereto and cancelled.","An instrument, document or paper which is required by law to be stamped and which has been signed, issued, accepted or transferred without being duly stamped shall make the transaction void."],"ans":3,"exp":"Under Sec. 201, an unstamped document cannot be recorded, cannot be admitted in evidence until the stamps are affixed and cancelled, and cannot be notarized. Failure to stamp does not make the transaction void; the contract stays valid between the parties, which is why d is the odd one out.","notes":["Unstamped documents: not recordable, not admissible in evidence, not notarizable (Sec. 201).","Failure to pay DST does NOT void the transaction.","Admissibility is restored once the stamps are affixed and cancelled."],"upd":"","key":""},{"id":"Q16-11","quiz":16,"num":11,"sec":"6","q":"The tax base on every original issue, whether on organization, reorganization or for any lawful purpose, of shares of stock by any association, company or corporation is:","opts":["each two hundred pesos (P200), or fractional part thereof, of the par value of such shares of stock","the actual consideration for the issuance of such shares of stock","the actual value represented by each share","fifty percent (50%) of the documentary stamp tax paid upon the original issue of said stock"],"ans":0,"exp":"Sec. 174 bases DST on the original issue of par value shares on each P200, or fractional part, of the par value. The actual consideration is the base for no-par shares, the actual value represented by each share is the base for stock dividends, and 50% of the DST paid on original issue is the rule for later transfers of no-par shares (Sec. 175).","notes":["Original issue, par value shares: per P200 of PAR value.","No-par shares on original issue: actual consideration received.","Stock dividends: actual value represented by each share.","Rate on original issue (CMEPA): P1.50 per P200 (0.75%)."],"upd":"CMEPA: DST on the original issue of shares, including stock dividends, was reduced from P2.00 to P1.50 per P200 (0.75%).","key":""},{"id":"Q16-12","quiz":16,"num":12,"sec":"6","q":"In the case of stock dividends, a DST of P1.50 is based on:","opts":["each two hundred pesos (P200), or fractional part thereof, of the par value of such shares of stock","the actual consideration for the issuance of such shares of stock","the actual value represented by each share","fifty percent (50%) of the documentary stamp tax paid upon the original issue of said stock"],"ans":2,"exp":"Sec. 174 provides that for stock dividends, the DST is computed on the actual value represented by each share. Par value is the base for ordinary original issues, actual consideration is for no-par shares, and 50% of the DST paid on original issue applies to transfers of no-par shares.","notes":["Stock dividends: DST on the actual value represented by each share.","Rate (CMEPA): P1.50 per P200, the same as other original issues.","Stock dividends are treated as an original issue of shares for DST purposes."],"upd":"CMEPA: DST on the original issue of shares, including stock dividends, was reduced from P2.00 to P1.50 per P200 (0.75%); the source stem read \"P2.00\".","key":""},{"id":"Q16-13","quiz":16,"num":13,"sec":"6","q":"A DST of P3.00 shall be imposed on:\nA - Each bank check, draft, or certificate of deposit not drawing interest.\nB - Each order for the payment of any sum of money drawn upon or issued by any bank, trust company, or any person or persons, companies or corporations, at sight or on demand.","opts":["Yes to A and B","No to A and B","Yes to A only","Yes to B only"],"ans":0,"exp":"Sec. 178, as amended by TRAIN, imposes a DST of P3.00 on each bank check, draft, certificate of deposit not drawing interest, or order for the payment of money drawn upon or issued by any bank, trust company or any person, at sight or on demand. Both A and B are covered.","notes":["P3.00 per bank check, draft, non-interest-bearing certificate of deposit or sight/demand order (Sec. 178).","Interest-bearing deposit instruments with a fixed term are taxed as debt instruments instead.","Bank deposit accounts without a fixed term or maturity are exempt (Sec. 199)."],"upd":"","key":""},{"id":"Q16-14","quiz":16,"num":14,"sec":"6","q":"A DST of P1.50 on debt instruments with terms of less than one (1) year is based on:","opts":["a proportional amount in accordance with the ratio of its term in number of days to three hundred sixty-five (365) days.","each two hundred pesos (P200), or fractional part thereof, of the issue price of such debt instrument.","the actual value represented by the instrument.","the actual consideration for the issuance of the instrument."],"ans":0,"exp":"Under Sec. 179, DST on debt instruments is P1.50 on each P200 of the issue price, but for instruments with a term of less than one year, the tax is prorated by the ratio of the term in days to 365 days. The per-P200 base in choice b is the general rule, not the special rule for short-term instruments the item asks about.","notes":["Debt instruments: P1.50 per P200 of issue price (Sec. 179).","Term under 1 year: DST prorated by days/365.","Only one DST on a loan agreement and the instruments securing it."],"upd":"","key":""},{"id":"Q16-15","quiz":16,"num":15,"sec":"6","q":"First statement: Only one tax shall be collected on each sale or transfer of stock from one person to another, regardless of whether or not a certificate of stock is issued, indorsed, or delivered in pursuance of such sale or transfer.\nSecond statement: Only one documentary stamp tax shall be imposed on either the loan agreement or the promissory notes issued to secure the loan.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. Sec. 175 provides that only one DST is collected per sale or transfer of stock regardless of whether a certificate is issued, indorsed or delivered, and Sec. 179 provides that only one DST is imposed on either the loan agreement or the promissory notes issued to secure the loan.","notes":["Sale/transfer of shares: one DST per transfer, P1.50 per P200 of par value (Sec. 175).","Loan agreement plus promissory note: only one DST (Sec. 179).","Listed shares sold through the stock exchange are exempt from DST."],"upd":"CMEPA: only one DST is imposed on the loan agreement and the promissory note, mortgage, pledge or other security issued to secure it.","key":""},{"id":"Q16-16","quiz":16,"num":16,"sec":"6","q":"Which of the following DSTs is NOT based on each two hundred pesos (P200), or fractional part thereof, of the value or price?","opts":["On every original issue, whether on organization, reorganization or for any lawful purpose, of shares of stock by any association, company or corporation","On sales, agreements to sell, memoranda of sales, deliveries or transfers of shares or certificates of stock","On every original issue of debt instruments","On stock dividends"],"ans":3,"exp":"For stock dividends, Sec. 174 bases the DST on the actual value represented by each share, not on each P200 of par value or price. Original issues of par value shares (per P200 of par value), transfers of shares (per P200 of par value) and debt instruments (per P200 of issue price) all use the P200 base.","notes":["Per P200 of par value: original issue of shares; sale or transfer of shares.","Per P200 of issue price: debt instruments.","Stock dividends: actual value represented by each share."],"upd":"","key":""},{"id":"Q16-17","quiz":16,"num":17,"sec":"6","q":"Which of the following shall be exempt from documentary stamp tax (DST)?","opts":["Every original issue of debt instruments","All sales, agreements to sell, memoranda of sale, deliveries, or transfers of shares or certificates of stock in any association, company, or corporation","Stock dividends","Transfers exempt from donor's tax"],"ans":3,"exp":"Sec. 199 lists transfers exempt from donor's tax among the documents exempt from DST. Debt instruments (Sec. 179), transfers of shares (Sec. 175) and stock dividends (Sec. 174) are all taxable.","notes":["DST-exempt (Sec. 199): transfers exempt from donor's tax, bank deposits without fixed term, interbranch advances, among others.","Listed shares traded in the stock exchange are exempt from DST on transfer.","CMEPA: issuance and redemption of mutual fund and UITF units are exempt."],"upd":"","key":""},{"id":"Q17-01","quiz":17,"num":1,"sec":"2.1-ADD","q":"It is the failure of the taxpayer to pay the tax due on the date fixed by law or indicated in the assessment notice or letter of demand.","opts":["Delinquency","Deficiency","Willful neglect","Fraud"],"ans":0,"exp":"Delinquency is the failure to pay on time: either the tax due per return on the statutory due date, or an assessed deficiency on the date stated in the notice and demand. Deficiency is the amount found still due after audit, willful neglect is a knowing failure to file, and fraud involves intentional deception.","notes":["Delinquency = late payment of tax that is due (per return or per assessment).","Deficiency = additional tax found due upon audit or investigation.","Delinquency interest runs from the due date until full payment (Sec. 249(C))."],"upd":"","key":""},{"id":"Q17-02","quiz":17,"num":2,"sec":"2.1-ADD","q":"It is the amount still due and collectible from a taxpayer upon audit or investigation.","opts":["Delinquency","Deficiency","Willful neglect","Fraud"],"ans":1,"exp":"A deficiency is the excess of the tax found due upon audit or investigation over the amount shown on the return (or the full tax due if no return was filed). Delinquency refers to late payment, not to the amount discovered on audit.","notes":["Deficiency tax arises from audit; it is assessed through the PAN/FAN process.","Deficiency interest: from the original due date until full payment or the notice and demand (FAN/FLD), whichever comes earlier (Sec. 249(B)).","If the deficiency is not paid by the FAN/FLD due date, delinquency interest applies from then on."],"upd":"","key":""},{"id":"Q17-03","quiz":17,"num":3,"sec":"2.1-ADD","q":"It is a civil penalty imposed by law as an addition to the main tax required to be paid.","opts":["Interest","Surcharge","Compromise penalty","None of the choices"],"ans":1,"exp":"A surcharge is the civil penalty added to the basic tax (Sec. 248): 25% for ordinary cases, 50% for willful neglect or fraud. Interest compensates the government for the delay in payment, while a compromise penalty is paid in lieu of criminal prosecution.","notes":["Surcharge: 25% (ordinary) or 50% (willful neglect to file, false or fraudulent return).","Interest: 12% per annum (double the legal rate) under Sec. 249.","Compromise penalty: amount paid in lieu of criminal prosecution; it is voluntary."],"upd":"EOPT (RA 11976): micro and small taxpayers pay a reduced 10% surcharge instead of 25%.","key":""},{"id":"Q17-04","quiz":17,"num":4,"sec":"2.1-ADD","q":"If the taxpayer knowingly delays the filing of the tax return, there is:","opts":["simple neglect.","willful neglect.","fraud.","deficiency."],"ans":1,"exp":"Willful neglect is a deliberate or knowing failure to file the return within the prescribed period; it carries the 50% surcharge (Sec. 248(B)). Simple neglect is mere carelessness, and late filing by itself is not fraud, which requires intentional deception on the return.","notes":["Willful neglect to file: 50% surcharge.","Voluntary late filing without notice from the BIR is generally treated as simple late filing (25%), not willful neglect.","The 10% reduced surcharge for micro and small taxpayers does not apply to the 50% cases."],"upd":"","key":""},{"id":"Q17-05","quiz":17,"num":5,"sec":"2.1-ADD","q":"Which of the following shall constitute prima facie evidence of a false or fraudulent return?\nA: Substantial underdeclaration of taxable sales, receipts or income (e.g. failure to report sales, receipts or income in an amount exceeding 30% of that declared per return)\nB: Substantial overstatement of deductions (e.g. a claim of deductions in an amount exceeding 30% of actual deductions)\nC: Recurrence of understatement of income or overstatement of deductions for more than one taxable year","opts":["A, B and C","A and B only","B and C only","A only"],"ans":0,"exp":"Sec. 248(B) makes a substantial underdeclaration of sales, receipts or income, or a substantial overstatement of deductions, prima facie evidence of a false or fraudulent return; underreporting by more than 30% of what was declared, or claiming deductions more than 30% above actual, is substantial. A recurring understatement or overstatement over more than one year shows a pattern rather than an honest mistake and is likewise treated as evidence of fraud.","notes":["30% test: unreported income over 30% of declared, or deductions over 30% of actual.","Prima facie evidence is rebuttable; the taxpayer may prove good faith.","Consequence: 50% surcharge and the 10-year assessment period from discovery."],"upd":"","key":""},{"id":"Q17-06","quiz":17,"num":6,"sec":"2.1-ADD","q":"There shall be imposed, in addition to the basic tax required to be paid, a penalty equivalent to twenty-five percent (25%) thereof, in which of the following cases?\nI: Failure to file any return and pay the tax due thereon as required under the Tax Code or rules and regulations on the date prescribed\nII: Failure to pay the deficiency tax within the time prescribed for its payment in the notice of assessment\nIII: Failure to pay the full or part of the amount of tax shown on any return required to be filed, or the full amount of tax due for which no return is required to be filed, on or before the date prescribed for its payment","opts":["I, II and III","I and II only","I and III only","I only"],"ans":0,"exp":"All three are grounds for the 25% surcharge under Sec. 248(A): failure to file and pay on time, failure to pay a deficiency within the period in the notice of assessment, and failure to pay all or part of the tax shown on the return (or tax due where no return is required) on or before the due date.","notes":["25% surcharge: late filing/payment, unpaid deficiency after FAN due date, underpayment of tax per return.","Filing with the wrong office (wrong venue) is no longer a ground since EOPT.","Micro and small taxpayers: 10% instead of 25%."],"upd":"EOPT (RA 11976): deleted the old ground of filing a return with an unauthorized office (wrong venue) because returns may now be filed anywhere, and reduced the surcharge to 10% for micro and small taxpayers.","key":""},{"id":"Q17-07","quiz":17,"num":7,"sec":"2.1-ADD","q":"In which of the following cases shall the 50% surcharge be imposed?\nI: In case of willful neglect to file the return within the period prescribed by the Code\nII: In case a false or fraudulent return is willfully made\nIII: In case a person who is not VAT-registered issues an invoice showing his TIN, followed by the word \"VAT\"","opts":["I, II and III","I and II only","I and III only","I only"],"ans":0,"exp":"Sec. 248(B) imposes the 50% surcharge for willful neglect to file and for a willfully false or fraudulent return. Sec. 113(D) separately makes a non-VAT-registered person who issues an invoice showing his TIN followed by \"VAT\" liable for the VAT (without input tax credit) plus the 50% surcharge under Sec. 248(B), on top of any percentage tax.","notes":["50% surcharge: willful neglect to file, false or fraudulent return, non-VAT person issuing a VAT invoice.","The 50% surcharge is not reduced for micro and small taxpayers.","Non-VAT person issuing a VAT invoice: liable for VAT without input tax credit plus the 50% surcharge (Sec. 113(D))."],"upd":"EOPT (RA 11976): the invoice is now the primary sales document; the Sec. 113(D) rule refers to invoices rather than receipts.","key":""},{"id":"Q17-08","quiz":17,"num":8,"sec":"2.1-ADD","q":"The civil penalty imposed on micro and small taxpayers for failure to file any return and pay the tax due thereon as required under the Tax Code or rules and regulations on the date prescribed, among others, shall be:","opts":["50%","25%","20%","10%"],"ans":3,"exp":"Under EOPT and RR 6-2024, micro and small taxpayers pay a reduced surcharge of 10% (instead of 25%) for the Sec. 248(A) cases, such as late filing and payment. The reduction does not cover the 50% surcharge for willful neglect or fraud.","notes":["Micro: gross sales below P3M; small: P3M to below P20M (RR 8-2024).","Reduced surcharge: 10% (regular 25%).","No reduction for the 50% surcharge (willful neglect, fraud)."],"upd":"EOPT (RA 11976), RR 6-2024: reduced 10% surcharge for micro and small taxpayers.","key":""},{"id":"Q17-09","quiz":17,"num":9,"sec":"2.1-ADD","q":"First statement: For micro and small taxpayers, no penalty shall be imposed on an amendment of a tax return if the covered taxpayer filed the initial tax return and paid the tax due thereon on or before the prescribed due date for filing.\nSecond statement: For micro and small taxpayers, in case of a deficiency tax assessment as a result of a tax audit, a penalty shall be imposed on the tax deficiency if the particular tax return being audited was found to have been filed beyond the prescribed period or due date.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are true under RR 6-2024. A micro or small taxpayer who filed and paid on time is not penalized for later amending the return. On audit, however, the penalty is imposed on the deficiency when the audited return itself was filed late.","notes":["Timely initial filing and payment: no penalty on amendment (micro/small).","Audit deficiency: penalty applies if the audited return was filed late.","Applies only to taxpayers classified as micro or small."],"upd":"EOPT (RA 11976), RR 6-2024: special penalty rules for micro and small taxpayers.","key":""},{"id":"Q17-10","quiz":17,"num":10,"sec":"2.1-ADD","q":"There shall be assessed and collected on any unpaid amount of tax, interest from the date prescribed for payment until the amount is fully paid at the rate of:","opts":["50%","25%","12%","6%"],"ans":2,"exp":"Under Sec. 249(A) as amended by TRAIN, interest is double the legal interest rate for loans or forbearance of money set by the BSP. With the legal rate at 6%, the interest rate is 12% per annum.","notes":["Interest rate: 12% per annum (2 x 6% BSP legal rate).","Types: deficiency, delinquency, and interest on extended payment.","Deficiency and delinquency interest are not imposed simultaneously."],"upd":"TRAIN: replaced the old 20% interest with double the legal rate (now 12%). EOPT: 6% for micro and small taxpayers.","key":""},{"id":"Q17-11","quiz":17,"num":11,"sec":"2.1-ADD","q":"For micro and small taxpayers, there shall be assessed and collected on any unpaid amount of tax, interest at the reduced rate of:","opts":["50%","25%","12%","6%"],"ans":3,"exp":"EOPT sets the interest for micro and small taxpayers at 50% of the regular Sec. 249 rate. Since the regular rate is 12% per annum, the reduced rate is 6% per annum.","notes":["Regular interest: 12% per annum.","Micro and small taxpayers: 50% of the regular rate = 6% per annum.","The reduced surcharge (10%) and reduced interest (6%) apply together."],"upd":"EOPT (RA 11976), RR 6-2024: interest for micro and small taxpayers is 50% of the regular rate.","key":"Source key says A (50%). But 50% is the fraction of the regular rate, not the rate itself; the reduced rate is 6% per annum, which the source also uses in item 29, so D is keyed."},{"id":"Q17-12","quiz":17,"num":12,"sec":"2.1-ADD","q":"Which of the following interests is incorrect?","opts":["Interest on deficiency","Interest on delinquency","Interest on extended payment","Interest on surcharge"],"ans":3,"exp":"Sec. 249 as amended by TRAIN provides three kinds of interest: deficiency interest, delinquency interest, and interest on extended payment. There is no separate \"interest on surcharge\"; an unpaid surcharge only becomes part of the base for delinquency interest once the notice and demand is not paid on time.","notes":["Three kinds of interest: deficiency, delinquency, extended payment (Sec. 249).","Extended payment interest: when an extension is granted (e.g. estate tax) or the second installment is paid late.","Rate: 12% per annum (6% for micro and small)."],"upd":"","key":""},{"id":"Q17-13","quiz":17,"num":13,"sec":"2.1-ADD","q":"A delinquency interest shall be imposed in which of the following failures to pay?\nI: Failure to pay the amount of the tax due on any return required to be filed\nII: Failure to pay the amount of the tax for which no return is required\nIII: Failure to pay a deficiency tax, or any surcharge or interest thereon, on the due date appearing in the notice and demand of the Commissioner","opts":["I, II and III","I and II only","I and III only","I only"],"ans":0,"exp":"All three are delinquency cases under Sec. 249(C). Delinquency interest runs from the due date until full payment, and the unpaid amount (including surcharge and deficiency interest in case III) becomes part of the base.","notes":["Delinquency interest: late payment of tax per return, of tax with no return, or of the amount in the FAN/FLD.","Runs from the due date until full payment.","Deficiency and delinquency interest are never imposed on the same amount for the same period."],"upd":"","key":""},{"id":"Q17-14","quiz":17,"num":14,"sec":"2.1-ADD","q":"First statement: The additions to the tax or deficiency tax prescribed shall apply to all taxes, fees and charges imposed under the Tax Code.\nSecond statement: The amounts so added to the tax shall be collected at the same time, in the same manner and as part of the tax.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both restate Sec. 247(a). Additions to tax (surcharge and interest) apply to all taxes, fees and charges under the Tax Code, and they are collected together with, and as part of, the tax.","notes":["Additions to tax: surcharge and interest (Secs. 248 and 249).","They apply to all national internal revenue taxes, fees and charges.","Collected at the same time, in the same manner and as part of the tax."],"upd":"","key":""},{"id":"Q17-15","quiz":17,"num":15,"sec":"2.1-ADD","q":"(Phil. CPA) For filing a false and fraudulent return, a surcharge is imposed. Which of the following is correct?","opts":["50% administrative penalty","50% criminal penalty","25% plus 50%","25% criminal penalty"],"ans":0,"exp":"The surcharge for a false or fraudulent return is 50% (Sec. 248(B)), and it is a civil (administrative) penalty imposed without need of a criminal case. It is not added to the 25% surcharge, and criminal penalties are separate (fines and imprisonment).","notes":["False or fraudulent return: 50% surcharge (civil/administrative).","The 25% and 50% surcharges are not imposed together.","Criminal liability is separate and may still be pursued."],"upd":"","key":""},{"id":"Q17-16","quiz":17,"num":16,"sec":"2.1-ADD","q":"In which of the following cases is a return filed NOT false or fraudulent?","opts":["There is intentional substantial underdeclaration of income or overstatement of deductions.","There is intentional underdeclaration of selling price and overvaluation of cost of property sold.","There is recurrence of the understatement of income or overstatement of deductions for more than one taxable year.","Filing of the return has been delayed for a considerable length of time."],"ans":3,"exp":"Fraud requires intentional deception in the contents of the return, as in choices a to c. Filing late, even after a long delay, concerns the timeliness of the return rather than its truthfulness; it results in late-filing penalties (or willful neglect if knowingly delayed), not fraud.","notes":["Fraud goes to the content of the return (intentional falsehood).","Late filing: 25% surcharge; knowing delay: willful neglect (50%).","Fraud is never presumed; it must be proven, but substantial underdeclaration is prima facie evidence."],"upd":"","key":""},{"id":"Q17-17","quiz":17,"num":17,"sec":"2.1-ADD","q":"(Phil. CPA) Which of the following violations cannot be subject to compromise?","opts":["Failure to keep or preserve books of accounts and accounting records","Failure to keep books of accounts or records in a native language or English","Failure to have books of accounts audited and have financial statements attached to the income tax return certified by an independent CPA","Keeping of two sets of books of accounts or records"],"ans":3,"exp":"Criminal violations involving fraud are not subject to compromise. Keeping two sets of books is an act of fraud meant to hide true income, so it is excluded from compromise. The other choices are ordinary bookkeeping violations listed in the schedule of compromise penalties (RMO 7-2015).","notes":["Not compromisable: criminal violations involving fraud, and those already filed in court.","Keeping two sets of books signals fraud.","Compromise penalties are voluntary; the taxpayer may refuse and face prosecution."],"upd":"","key":""},{"id":"Q17-18","quiz":17,"num":18,"sec":"2.1-ADD","q":"For each failure to file an information return, statement or list, or keep any record, or supply any information required by the Tax Code or by the Commissioner on the date prescribed, unless it is shown that such failure is due to reasonable cause and not to willful neglect, the penalty is:","opts":["P3,000 for each failure","P2,000 for each failure","P1,000 for each failure","P500 for each failure"],"ans":2,"exp":"Sec. 250 imposes P1,000 for each failure, with an aggregate cap of P25,000 for all failures during a calendar year. The penalty does not apply if the failure is due to reasonable cause and not willful neglect.","notes":["Regular: P1,000 per failure, max P25,000 per calendar year (Sec. 250).","Micro and small taxpayers: P500 per failure, max P12,500.","Defense: reasonable cause and not willful neglect."],"upd":"","key":""},{"id":"Q17-19","quiz":17,"num":19,"sec":"2.1-ADD","q":"For micro and small taxpayers, each failure to file an information return, statement or list, or keep any record, or supply any information required by the Tax Code or by the Commissioner on the date prescribed, unless it is shown that such failure is due to reasonable cause and not to willful neglect, shall result in a penalty of:","opts":["P3,000 for each failure","P2,000 for each failure","P1,000 for each failure","P500 for each failure"],"ans":3,"exp":"EOPT reduced the Sec. 250 penalty for micro and small taxpayers by half: P500 for each failure (instead of P1,000), with an annual aggregate cap of P12,500 (instead of P25,000).","notes":["Micro and small: P500 per failure, max P12,500 per year.","Regular: P1,000 per failure, max P25,000 per year.","Micro < P3M gross sales; small P3M to < P20M."],"upd":"EOPT (RA 11976), RR 6-2024: halved the information-return penalty for micro and small taxpayers.","key":""},{"id":"Q17-20","quiz":17,"num":20,"sec":"2.1-ADD","q":"First statement: The schedule of compromise penalties shall not prevent the Commissioner or his duly authorized representative from accepting a compromise amount higher than what is provided in the schedule.\nSecond statement: In case of criminal violation by micro and small taxpayers, not involving fraud, a reduced compromise penalty rate of 50% of the applicable rate or amount of compromise under RMO 7-2015 and its subsequent amendments, if any, shall be applied.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are true. The schedule in RMO 7-2015 is only a guide, so the BIR may accept a higher compromise amount. Under EOPT and RR 6-2024, micro and small taxpayers pay 50% of the scheduled compromise penalty for criminal violations not involving fraud.","notes":["Schedule of compromise penalties: RMO 7-2015 (a guide, not a ceiling).","Micro and small: 50% of the scheduled compromise, if no fraud.","Fraud cases are not compromised."],"upd":"EOPT (RA 11976), RR 6-2024: 50% reduced compromise penalties for micro and small taxpayers.","key":""},{"id":"Q18-01","quiz":18,"num":1,"sec":"2.1","q":"The civil remedies for the collection of internal revenue taxes, fees or charges, and any increment thereto resulting from delinquency shall be:\nI - By distraint and by levy\nII - By civil or criminal action","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Sec. 205 lists two civil remedies for collecting delinquent taxes: (a) distraint of personal property and levy on real property (summary administrative remedies), and (b) civil or criminal action (judicial remedies). Both are therefore correct.","notes":["Sec. 205: distraint/levy (administrative) and civil/criminal action (judicial).","Distraint = personal property; levy = real property.","Either or both remedies may be pursued, at the discretion of the collecting authorities."],"upd":"","key":""},{"id":"Q18-02","quiz":18,"num":2,"sec":"2.1","q":"Which of the following statements is incorrect?","opts":["If a taxpayer is acquitted in a criminal violation of the Tax Code, this acquittal does not exonerate him from his civil liability to pay the taxes.","A conviction of tax evasion is not a bar for collection of unpaid taxes.","A tax assessment is necessary to a criminal prosecution for willful attempt to defeat and evade payment of taxes.","Criminal proceedings under the Tax Code are now a mode of collection of internal revenue taxes, fees and charges."],"ans":2,"exp":"Choice C is the incorrect statement: a prior assessment is not a precondition to a criminal prosecution for willful attempt to evade tax (Ungab v. Cusi); the crime is complete once the evasion is committed. The rest are true: the tax liability arises from law, so acquittal or conviction does not extinguish it, and under Sec. 205 the judgment in the criminal case also orders payment of the tax, making criminal action a mode of collection.","notes":["No assessment needed before filing a criminal case for tax evasion (Ungab v. Cusi).","Conviction or acquittal does not extinguish the civil liability to pay the tax.","Sec. 205: the criminal judgment also orders payment of the taxes as finally decided by the CIR."],"upd":"","key":""},{"id":"Q18-03","quiz":18,"num":3,"sec":"2.1","q":"A taxpayer is complaining of harassment because the BIR pursues both summary and judicial proceedings simultaneously. Is his complaint valid?","opts":["Yes. Because the BIR can only pursue summary proceedings after judicial proceedings are finally resolved.","Yes. Because the BIR can only pursue judicial proceedings after summary proceedings are finally resolved.","No. Because either of the summary or judicial proceedings or both simultaneously may be pursued in the discretion of the authorities charged with the collection of such taxes.","No. Because the BIR is presumed to have acted in good faith when it pursues both summary and judicial proceedings."],"ans":2,"exp":"Sec. 205 expressly allows either remedy, or both simultaneously, at the discretion of the collecting authorities. There is no required sequence, so A and B are wrong; D reaches the right conclusion for the wrong reason, since the basis is the express grant in Sec. 205, not a presumption of good faith.","notes":["Summary (distraint/levy) and judicial (civil/criminal) remedies may be pursued simultaneously (Sec. 205).","No need to exhaust one remedy before using the other.","Collection must still be within the prescriptive period (5 years from assessment)."],"upd":"","key":""},{"id":"Q18-04","quiz":18,"num":4,"sec":"2.1","q":"The remedies of distraint and levy shall not be availed of where the amount of tax involved is:","opts":["not more than One hundred pesos (P100).","more than One hundred pesos (P100).","not more than One thousand pesos (P1,000).","more than One thousand pesos (P1,000)."],"ans":0,"exp":"Under the last paragraph of Sec. 205, distraint and levy may not be used where the tax involved is not more than P100. For such small amounts the government uses judicial action instead.","notes":["Distraint/levy not allowed if tax is P100 or less (Sec. 205).","P1,000,000 is the threshold for who issues the warrant of distraint (Sec. 207), not for availability of the remedy.","Small amounts may still be collected by civil action."],"upd":"","key":""},{"id":"Q18-05","quiz":18,"num":5,"sec":"2.1","q":"First statement: The judgment in the criminal case shall not only impose the penalty but shall also order payment of the taxes subject of the criminal case as finally decided by the Commissioner.\nSecond statement: The Bureau of Internal Revenue shall advance the amounts needed to defray costs of collection by means of civil or criminal action, including the preservation or transportation of personal property distrained and the advertisement and sale thereof, as well as of real property and improvements thereon.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. The first is the last paragraph of Sec. 205 (as amended by RA 9282): the criminal judgment also orders payment of the tax. The second is Sec. 216, which requires the BIR to advance the costs of collection, including preservation, transportation, advertisement and sale of distrained or levied property.","notes":["Sec. 205: criminal judgment includes an order to pay the tax.","Sec. 216: BIR advances the costs of collection.","Costs of distraint and sale are later recovered from the proceeds of the sale."],"upd":"","key":""},{"id":"Q18-06","quiz":18,"num":6,"sec":"2.1","q":"The property of a delinquent taxpayer or any taxpayer may be placed under constructive distraint in the following instances, except when:","opts":["The taxpayer is retiring from any business subject to tax.","The taxpayer is intending to leave the Philippines or to remove his property therefrom.","The taxpayer is intending to hide or conceal his property or to perform any act tending to obstruct the proceedings for collecting the tax due or which may be due from him.","The taxpayer is already delinquent in payment of his taxes."],"ans":3,"exp":"Constructive distraint (Sec. 206) is a preventive measure used to protect the government's interest when the taxpayer is retiring from business, intends to leave the Philippines or remove his property, or intends to hide or conceal property or obstruct collection. It does not require delinquency. Being already delinquent is the ground for actual distraint, so D is the exception.","notes":["Constructive distraint: property is not physically taken; the taxpayer is required to hold it and not dispose of it without CIR approval.","Grounds (Sec. 206): retiring from business, leaving the Philippines or removing property, hiding property or obstructing collection.","Actual distraint requires delinquency; the property is seized and sold."],"upd":"","key":""},{"id":"Q18-07","quiz":18,"num":7,"sec":"2.1","q":"Who shall order the distraint of personal property if the amount of delinquent tax or delinquent revenue is in excess of P1,000,000?","opts":["Secretary of Finance","Commissioner of Internal Revenue exclusively","Commissioner of Internal Revenue or his duly authorized representative","Revenue District Officer"],"ans":2,"exp":"Under Sec. 207(A), the warrant of distraint is issued by the Commissioner or his duly authorized representative if the amount involved exceeds P1,000,000, and by the Revenue District Officer if the amount is P1,000,000 or less. The power is not exclusive to the CIR, and the Secretary of Finance has no role here.","notes":["Over P1,000,000: CIR or duly authorized representative.","P1,000,000 or less: Revenue District Officer.","Same thresholds apply to levy on real property (Sec. 207(B))."],"upd":"","key":""},{"id":"Q18-08","quiz":18,"num":8,"sec":"2.1","q":"Who has the power to lift the order of distraint?","opts":["Secretary of Finance","Commissioner of Internal Revenue exclusively","Commissioner of Internal Revenue or his duly authorized representative","Revenue District Officer"],"ans":2,"exp":"Sec. 207(A) gives the Commissioner or his duly authorized representative, subject to rules promulgated by the Secretary of Finance upon the CIR's recommendation, the power to lift an order of distraint. The Secretary of Finance only issues the rules, and the RDO is not granted this power.","notes":["Lifting of distraint: CIR or duly authorized representative (Sec. 207(A)).","Subject to rules of the Secretary of Finance upon CIR recommendation.","The CIR may require a consolidated report from the Revenue Regional Director."],"upd":"","key":""},{"id":"Q18-09","quiz":18,"num":9,"sec":"2.1","q":"A taxpayer is complaining of harassment because the BIR levies on real property and at the same time distrains personal property to collect the deficiency or delinquency revenue. Is his complaint valid?","opts":["Yes. Because the BIR can only levy real property after distraint of personal property.","Yes. Because the BIR can only distrain personal property after levy of real property is resorted to.","No. Because real property may be levied upon, before, simultaneously with or after the distraint of personal property belonging to the delinquent taxpayer.","No. Because the BIR is presumed to have acted in good faith when it pursues both levy of real property and distraint of personal property."],"ans":2,"exp":"Sec. 207(B) provides that real property may be levied upon before, simultaneously with, or after the distraint of personal property. There is no required order, so the complaint is not valid, and the basis is the express provision, not a presumption of good faith.","notes":["Levy may come before, with, or after distraint (Sec. 207(B)).","Levy is on real property; distraint is on personal property.","The CIR may also collect through civil or criminal action at the same time."],"upd":"","key":""},{"id":"Q18-10","quiz":18,"num":10,"sec":"2.1","q":"To whom shall the written notice of the levy be mailed or served?\nI - Register of Deeds for the province or city where the property is located\nII - The delinquent taxpayer, or if he be absent from the Philippines, his agent or the manager of the business which incurred the liability\nIII - The occupant of the property in question, if the delinquent taxpayer has no agent or manager","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Sec. 207(B) requires written notice of the levy to be mailed to or served on the Register of Deeds where the property is located and on the delinquent taxpayer; if he is absent from the Philippines, on his agent or the manager of the business, and if there is none, on the occupant of the property. All three are proper recipients.","notes":["Notice of levy goes to the Register of Deeds and the taxpayer (or agent/manager, or occupant).","The levy is annotated with the Register of Deeds and operates with the force of a legal execution.","Levy threshold for issuing officer: over P1,000,000 CIR; P1,000,000 or less RDO."],"upd":"","key":""},{"id":"Q18-11","quiz":18,"num":11,"sec":"2.1","q":"First statement: Under distraint of personal property, if at any time prior to the consummation of the sale all proper charges are paid to the officer conducting the sale, the goods or effects distrained shall be restored to the owner.\nSecond statement: Under levy of real property, the owner shall not be deprived of the possession of the property sold and shall be entitled to the rents and other income thereof until the expiration of the time allowed for redemption.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. Sec. 209 requires release of distrained goods if all proper charges are paid before the sale is consummated. Sec. 214 lets the owner of real property sold keep possession and collect rents and other income until the one-year redemption period expires.","notes":["Sec. 209: payment before consummation of sale releases the distrained property.","Sec. 214: owner keeps possession and income during the 1-year redemption period.","Redemption price: taxes, penalties and interest, plus 15% per annum interest on the purchase price."],"upd":"","key":""},{"id":"Q18-12","quiz":18,"num":12,"sec":"2.1","q":"Within what period shall the owner of the property sold redeem such property?","opts":["Within one (1) year from the date of sale","Within two (2) years from the date of sale","Within three (3) years from the date of sale","Within five (5) years from the date of sale"],"ans":0,"exp":"Sec. 214 gives the delinquent taxpayer, or anyone for him, one year from the date of sale to redeem real property sold for taxes by paying the taxes, penalties and interest, plus interest on the purchase price at 15% per annum from purchase to redemption.","notes":["Redemption period: 1 year from date of sale (Sec. 214).","Interest on purchase price: 15% per annum.","If not redeemed, a final deed is issued to the purchaser (Sec. 215)."],"upd":"","key":""},{"id":"Q18-13","quiz":18,"num":13,"sec":"2.1","q":"Warrant of levy as distinguished from warrant of distraint:","opts":["It is on real property owned by and in possession of the taxpayer.","It is on personal property owned by and in possession of the taxpayer.","It is on property owned by the taxpayer but in the possession of a third party.","It does not require advertisement."],"ans":0,"exp":"A warrant of levy covers real property (and interests in it) owned by the taxpayer. Personal property in the taxpayer's possession is the subject of distraint, and personal property held by a third party is reached by garnishment. D is wrong because a levy sale must be advertised (posting and publication once a week for three weeks, Sec. 213).","notes":["Levy: real property. Distraint: personal property in taxpayer's hands. Garnishment: taxpayer's property held by a third party (e.g., bank deposits).","Levy sale: advertised, including publication once a week for three weeks.","Real property with no bidder is forfeited to the government (Sec. 215)."],"upd":"","key":""},{"id":"Q18-14","quiz":18,"num":14,"sec":"2.1","q":"Warrant of distraint as distinguished from warrant of garnishment:","opts":["It is on real property owned by and in possession of the taxpayer.","It is on personal property owned by and in possession of the taxpayer.","It is on property owned by the taxpayer but in the possession of a third party.","It requires advertisement once a week for three weeks."],"ans":1,"exp":"Distraint reaches personal property owned by and in the possession of the taxpayer, while garnishment reaches the taxpayer's property held by a third party, such as bank deposits or receivables. Real property is levied upon, and publication once a week for three weeks is a feature of the levy sale, not of distraint.","notes":["Distraint: personal property in the taxpayer's possession.","Garnishment: taxpayer's property or credits in a third party's hands.","Publication once a week for three weeks applies to sale of levied real property."],"upd":"","key":""},{"id":"Q18-15","quiz":18,"num":15,"sec":"2.2","q":"Which of the following statements is/are correct?\nStatement I - No court shall have the authority to grant an injunction to restrain the collection of any national internal revenue tax, fee or charge imposed by the Tax Code.\nStatement II - The Court of Tax Appeals (CTA) can issue injunctions while in the exercise of its appellate jurisdiction in cases pending before it.\nStatement III - The Court of Tax Appeals (CTA) may enjoin collection of taxes if in its opinion the same may jeopardize the interest of the government and/or the taxpayer.","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Statement I is the general rule in Sec. 218 (lifeblood doctrine). Statements II and III state the exception under Sec. 11 of RA 1125, as amended by RA 9282: the CTA, in cases on appeal before it, may suspend or restrain collection when collection may jeopardize the interest of the government and/or the taxpayer. All three are correct.","notes":["General rule: no injunction against collection of national internal revenue taxes (Sec. 218).","Exception: the CTA may suspend collection while an appeal is pending (RA 1125, Sec. 11).","The CTA may require a cash deposit or surety bond of not more than double the amount claimed."],"upd":"","key":""},{"id":"Q18-16","quiz":18,"num":16,"sec":"2.1","q":"Except for the provision in Section 222, internal revenue taxes shall be assessed within how many years after the last day prescribed by law for the filing of the return?","opts":["Five (5) years","Four (4) years","Three (3) years","Two (2) years"],"ans":2,"exp":"Sec. 203 sets the ordinary period of assessment at three years counted from the last day prescribed for filing the return, or from actual filing if the return was filed late. A return filed before the deadline is deemed filed on the last day. The exceptions (fraud, no return, waivers) are in Sec. 222.","notes":["Ordinary assessment period: 3 years (Sec. 203).","Counted from the deadline, or actual filing date if filed late.","False/fraudulent return or no return: 10 years from discovery (Sec. 222(a))."],"upd":"","key":""},{"id":"Q18-17","quiz":18,"num":17,"sec":"2.1","q":"A decedent dies on January 1, 2018. The estate tax return is filed on September 1, 2019. When is the last day to make a valid assessment?","opts":["January 1, 2021","July 1, 2021","July 1, 2022","September 1, 2022"],"ans":3,"exp":"Under TRAIN the estate tax return is due within one year from death, so it was due January 1, 2019. Because it was filed late on September 1, 2019, the three-year period under Sec. 203 runs from actual filing, ending September 1, 2022.","notes":["Estate tax return: within 1 year from death (TRAIN; previously 6 months).","Late return: 3-year period runs from actual filing.","Early or timely return: period runs from the last day for filing."],"upd":"TRAIN: the estate tax return deadline became one year from death (from six months), which fixes the due date at January 1, 2019.","key":""},{"id":"Q18-18","quiz":18,"num":18,"sec":"2.1","q":"A donation was made on March 14, 2018. The donor's tax return was filed on March 31, 2018. When is the last day to make a valid assessment?","opts":["March 14, 2021","April 13, 2021","April 14, 2021","September 14, 2021"],"ans":1,"exp":"The donor's tax return is due within 30 days after the gift is made, so it was due April 13, 2018. A return filed before the deadline is deemed filed on the last day (Sec. 203), so the three-year period ends April 13, 2021.","notes":["Donor's tax return: within 30 days after the date of donation.","Return filed early is deemed filed on the due date.","Assessment period: 3 years from the due date (or actual late filing)."],"upd":"","key":""},{"id":"Q18-19","quiz":18,"num":19,"sec":"2.1","q":"If the return filed was false or fraudulent with intent to evade tax or no return was filed, assessment shall be made at any time within how many years after discovery of the falsity, fraud or omission?","opts":["2 years","3 years","5 years","10 years"],"ans":3,"exp":"Sec. 222(a) allows assessment, or a court action for collection without assessment, at any time within 10 years after discovery of the falsity, fraud or omission. The 3-year period of Se
