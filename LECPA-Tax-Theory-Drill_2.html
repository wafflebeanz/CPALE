qualify, so the exempt gift is zero and the whole P1,000,000 is taxable. The 30% administration test applies to private charitable donees, not government entities, so it is irrelevant here.","notes":["Exempt: gifts to the National Government, its non-profit entities and political subdivisions.","Government entities conducted for profit are not exempt donees.","Corporations are also liable for donor's tax on their gifts."],"upd":"","key":""},{"id":"Q02-19","quiz":2,"num":19,"sec":"4.2","q":"Mr. J. Santos donated P500,000 to AST Foundation, a philanthropic organization. The organization's total administrative expenses amounted to P5,000,000 out of its total expenses of P20,000,000. How much was the exempt gift to the philanthropic organization?","opts":["P6,000,000","P5,000,000","P500,000","None"],"ans":2,"exp":"Gifts to a philanthropic organization are exempt under Sec. 101(A)(3) if not more than 30% of the gifts is used for administration. Administrative expenses are 25% of total expenses (P5,000,000 / P20,000,000), within the 30% limit, so the whole P500,000 gift is exempt. P5,000,000 and P6,000,000 confuse the donee's expenses with the gift.","notes":["30% test: not more than 30% of the gifts used by the donee for administration.","Qualified donees: non-profit educational, charitable, religious, cultural or social welfare institutions, accredited NGOs, trusts, philanthropic or research organizations.","Exempt gifts are excluded first; the P250,000 annual exemption then applies to the remaining net gifts."],"upd":"","key":""},{"id":"Q02-20","quiz":2,"num":20,"sec":"4.2","q":"The computation of the donor's tax is on a cumulative basis over a period of:","opts":["one calendar year.","one fiscal year.","one calendar year or fiscal year, as the case may be.","one taxable year."],"ans":0,"exp":"Sec. 99(A) computes donor's tax on the total net gifts made during the calendar year in excess of P250,000, so gifts are cumulated within one calendar year only. Fiscal and taxable years are irrelevant, even for a corporate donor on a fiscal year.","notes":["Each later gift in the same calendar year: compute the tax on cumulative net gifts, then deduct the tax paid on prior gifts.","The P250,000 exemption is per calendar year, not per donee or per gift.","Gifts of previous years are not added."],"upd":"","key":""},{"id":"Q02-21","quiz":2,"num":21,"sec":"4.2","q":"A client asked you whether or not to add the gifts made in the previous year to the gifts made in the current year. What would your answer be?","opts":["The gifts made in the previous year should not be added to the gifts made in the current year because the computation of the taxable net gifts is on a cumulative basis over a period of one calendar year.","The gifts made in the previous year should be added to the gifts made in the current year because the computation of the taxable net gifts is on a cumulative basis over several calendar years.","The gifts made in the previous year should not be added to the gifts made in the current year because the BIR would have no way of knowing them anyway.","The gifts made in the previous year should be added to the gifts made in the current year so that the progressive effect of donor's tax will be felt."],"ans":0,"exp":"Donor's tax is cumulated only within the same calendar year (Sec. 99(A)), so prior-year gifts are never added and each year gets its own P250,000 exemption. Choice b misstates the period, choice c gives an improper reason, and choice d is wrong because the tax is now a flat 6% with no progressive effect.","notes":["Prior-year gifts are never added; each calendar year starts fresh.","Within the same year, gifts are cumulated and prior tax paid is credited.","Donor's tax has been a flat 6% since 2018."],"upd":"TRAIN: donor's tax became a flat 6% on net gifts over P250,000, so there is no longer any progressive effect (choice d).","key":""},{"id":"Q02-22","quiz":2,"num":22,"sec":"4.2","q":"Mr. Gerardo Ireneo transferred inter vivos a personal property to his son on March 15, 2016. His son, who lives in another province, let his father know that he was accepting the gift on March 31, 2016. The personal property was delivered and received on April 15, 2016. When is the last day to file the donor's tax return and pay the donor's tax?","opts":["April 14, 2016","April 30, 2016","May 15, 2016","None of the choices"],"ans":2,"exp":"The donor's tax return is due within 30 days after the gift is made (Sec. 103(A)), and a gift is made when it is completed by delivery (RR 2-2003, Sec. 11). Delivery took place on April 15, 2016, so the deadline is May 15, 2016. March 15 is merely the offer, and March 31 is perfection (acceptance), not completion.","notes":["Perfection: donor knows of the acceptance. Completion: delivery.","Donor's tax return (BIR Form 1800): within 30 days after the gift is completed.","The law in force at completion governs; a 2016 gift is taxed under the pre-TRAIN graduated rates."],"upd":"","key":""},{"id":"Q02-23","quiz":2,"num":23,"sec":"4.2","q":"First statement: A donation with an unpaid donor's tax is not a valid donation.\nSecond statement: The title to the donated real property cannot be transferred to the donee in the Register of Deeds unless the donor's tax on the donation has been paid.","opts":["True, True","False, False","True, False","False, True"],"ans":3,"exp":"The validity of a donation depends on Civil Code requirements (capacity, intent, form, acceptance, delivery), not on payment of the tax, so the first statement is false. Under Sec. 95, the Register of Deeds shall not register a transfer of real property by gift unless the BIR certifies that the donor's tax has been paid (now through the eCAR), so the second statement is true.","notes":["Nonpayment of donor's tax does not void a donation; it exposes the donor to penalties and blocks registration.","An eCAR is required before the Register of Deeds transfers title.","The donor, not the donee, is liable for the tax."],"upd":"","key":""},{"id":"Q02-24","quiz":2,"num":24,"sec":"4.2","q":"A resident citizen has a property in Quezon City. His legal residence is in Masbate City. While in Cebu City on a business trip, he donated his property in Quezon City to a relative who is a long-time resident of Cebu City. Where will the donor file the donor's tax return?","opts":["Quezon City","Cebu City","Masbate City","Any of the three cities"],"ans":3,"exp":"Under Sec. 103(B) as amended by EOPT (RA 11976), the donor's tax return may be filed and the tax paid, electronically or manually, with any authorized agent bank, any RDO through a Revenue Collection Officer, or an authorized tax software provider, so the donor may file in any of the three cities (indeed anywhere). Before EOPT the answer would have been Masbate City, the RDO covering the donor's domicile; the location of the property (Quezon City) or of the donation (Cebu City) never controlled.","notes":["EOPT file anywhere: any AAB, any RDO through a Revenue Collection Officer, or an authorized tax software provider.","The same rule applies to estate tax returns (Sec. 90(D)).","The donor's tax return is due within 30 days after the gift is completed."],"upd":"EOPT: the file-anywhere rule replaced the old rule requiring the return to be filed with the RDO where the donor was domiciled (Masbate City in this item).","key":""},{"id":"Q02-25","quiz":2,"num":25,"sec":"4.2","q":"First statement: When a donor's tax return filed is found by the BIR to have errors resulting in deficiency donor's tax, the donor may be required to pay the deficiency although he no longer possesses or owns the property.\nSecond statement: The Government is not bound by any agreement between the donor and the donee that the latter shall pay the donor's tax instead of the former.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Donor's tax is a personal obligation of the donor that arises once the gift is completed, so the donor remains liable for any deficiency later assessed even though he no longer owns the property. An agreement that the donee will pay the tax binds only the parties; the Government may still collect from the donor, who is the person liable under Sec. 98.","notes":["The donor is the taxpayer; the donee's assumption of the tax is a private arrangement.","Donor's tax assumed by the donee is not a deduction from gross gifts.","Deficiency assessments follow the 3-year prescriptive period (10 years from discovery if fraud or no return)."],"upd":"","key":""},{"id":"Q03-01","quiz":3,"num":1,"sec":"5.1","q":"Which of the following shall NOT be subject to value-added tax?","opts":["Sales, barters, exchanges of goods and properties in the course of trade or business","Sales of services and lease of properties in the course of trade or business","Importation of goods not in the course of trade or business","Sales, barters, exchanges of goods not in the course of trade or business"],"ans":3,"exp":"Under Sec. 105, VAT on sales of goods, services and leases applies only when made in the course of trade or business, so an isolated sale not in the course of business (e.g., an employee selling his personal car) is outside VAT. Importation is different: VAT on importation (Sec. 107) applies whether or not the importation is in the course of business. Choices a and b are the standard VAT transactions.","notes":["VAT on importation applies regardless of whether the importer is in business.","\"In the course of trade or business\" means the regular conduct or pursuit of a commercial or economic activity, including incidental transactions, even by nonstock, nonprofit entities or government.","Services rendered in the Philippines by nonresident persons are deemed made in the course of trade or business."],"upd":"","key":""},{"id":"Q03-02","quiz":3,"num":2,"sec":"5.1","q":"First statement: For VAT purposes, a taxable person is any person liable to pay the VAT, whether registered or registrable in accordance with the Tax Code.\nSecond statement: The status of a \"VAT-registered person\" as a VAT-registered person shall continue until the cancellation of such registration.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":0,"exp":"Both are correct under the VAT regulations (RR 16-2005). A taxable person is anyone liable for VAT, whether already registered or merely required to register. Once registered, a person keeps VAT-registered status (and must charge and report VAT) until the registration is actually cancelled, even if sales later fall below the threshold.","notes":["VAT threshold: gross sales exceeding P3,000,000 in any 12-month period requires VAT registration.","A VAT-registered person stays VAT-registered until cancellation; dropping below the threshold does not end the status automatically.","Cancellation may be requested if gross sales have not exceeded the threshold for the past 3 years (or on cessation of business)."],"upd":"","key":""},{"id":"Q03-03","quiz":3,"num":3,"sec":"5.1","q":"Your client's gross annual sales exceed the VAT threshold but the client failed to register under the VAT system. What will be the consequences for VAT purposes?","opts":["Subject to VAT at zero percent","Not subject to VAT","Subject to VAT at 12% but cannot claim input tax credit","Subject to VAT at 12% and can claim input tax credit"],"ans":2,"exp":"A person whose sales exceed the P3,000,000 threshold is liable to VAT even without registering. Under Sec. 236(G), a person required to register who fails to do so is liable to 12% VAT as if VAT-registered, but without the benefit of input tax credit for the period of nonregistration. Choice b ignores that liability arises from exceeding the threshold, and choice d gives a benefit the law denies.","notes":["Failure to register when required: 12% output VAT, no input tax credit, plus penalties.","Threshold: P3,000,000 (P10,000,000 option for radio/TV franchise grantees).","Registration must be made within 30 days after the end of the month the threshold was exceeded (RR 16-2005)."],"upd":"","key":""},{"id":"Q03-04","quiz":3,"num":4,"sec":"5.1","q":"Who shall be statutorily liable to pay the tax on sale of goods or properties and sale of services and lease of properties?","opts":["Buyer","Seller","Consumer","None of the choices"],"ans":1,"exp":"VAT is an indirect tax: the seller (or lessor/service provider) is the person statutorily liable to pay it under Secs. 106 and 108, even though the economic burden is shifted to the buyer. The buyer or consumer bears the tax only as part of the price and is not the taxpayer the BIR collects from.","notes":["Statutory taxpayer: seller. Economic burden: buyer/consumer.","On importation, the importer is the one liable to pay VAT (Sec. 107).","Because VAT is indirect, a seller's tax exemption does not extend to its buyers, and vice versa."],"upd":"","key":""},{"id":"Q03-05","quiz":3,"num":5,"sec":"5.1","q":"Value-added tax is NOT:","opts":["a business tax.","an indirect tax.","a local tax.","an excise tax."],"ans":2,"exp":"VAT is a national internal revenue tax imposed under the NIRC and collected by the BIR, so it is not a local tax. It is a business tax (imposed on sellers in the course of business), an indirect tax (burden shifted to the buyer), and in the Philippine sense an excise tax because it is imposed on the privilege of engaging in the sale of goods, services and leases.","notes":["VAT: national, indirect, business, privilege (excise-type) tax on consumption.","Rate: 12% on gross selling price or gross sales; 0% on zero-rated sales.","LGUs cannot impose VAT; it is reserved to the national government."],"upd":"","key":""},{"id":"Q03-06","quiz":3,"num":6,"sec":"5.1","q":"A VAT-registered owner of a shoe store wants to replace the old display cabinets in the store. He decides to sell them. He asks whether or not the sale of display cabinets used in his store is subject to VAT. What answer will you give him?","opts":["No, the sale of display cabinets used in the shoe store is not subject to VAT because it is not considered his regular conduct or pursuit of commercial or economic activity.","Yes, the sale of display cabinets used in the shoe store is subject to VAT because it is considered an incidental transaction to his regular conduct or pursuit of commercial or economic activity.","No, the sale of display cabinets used in the shoe store is not subject to VAT because he is not a dealer of display cabinets.","Yes, the sale of display cabinets used in the shoe store is subject to VAT because, as a rule, such sale is always subject to VAT."],"ans":1,"exp":"Sec. 105 treats transactions incidental to the regular conduct of business as made in the course of trade or business. Selling used store fixtures (property used in the business) by a VAT-registered seller is incidental to his shoe business, so it is subject to 12% VAT. Choices a and c wrongly require that he be a dealer of the item, while d is wrong because such sales are not \"always\" taxable (e.g., if the seller were not engaged in business or not VAT-liable).","notes":["Incidental transactions (sale of used fixtures, equipment, scrap) of a VAT-registered person are subject to VAT.","The seller need not be a dealer in the specific item sold.","An isolated sale by a person not engaged in business is not subject to VAT."],"upd":"","key":""},{"id":"Q03-07","quiz":3,"num":7,"sec":"5.1","q":"Sale of real property, the initial payments of which exceed twenty-five percent (25%) of the gross selling price in the year of sale.","opts":["Sale of real property by a real estate dealer on a deferred payment basis","Sale of real property on installment plan","Initial payments","None of the choices"],"ans":0,"exp":"Under RR 16-2005 (Sec. 4.106-3), a sale of real property where initial payments in the year of sale exceed 25% of the gross selling price is a sale on a deferred payment basis, treated like a cash sale: VAT is due on the entire selling price in the month of sale. An installment plan (choice b) is one where initial payments do NOT exceed 25%, and VAT is reported on each installment collected. Choice c names the payments themselves, not the type of sale.","notes":["Installment plan: initial payments not exceeding 25% of GSP; VAT on each collection.","Deferred payment: initial payments exceeding 25%; VAT on the whole selling price upon sale.","Initial payments = down payment plus installments received in the year of sale (excluding mortgage assumed, except its excess over cost)."],"upd":"","key":""},{"id":"Q03-08","quiz":3,"num":8,"sec":"5.1","q":"Which of the following statements is incorrect?","opts":["A zero-rated sale of goods or properties (by a VAT-registered person) is a taxable transaction for VAT purposes, but shall not result in any output tax.","The input tax on purchases of goods, properties or services, related to zero-rated sales, shall be available as tax credit only in accordance with the Regulations.","The input tax on purchases of goods, properties or services, related to such zero-rated sale, shall be available as tax credit or refund in accordance with the Regulations.","Any enterprise whose export sales is at least 70% of the total annual production of the preceding taxable year shall be considered an export-oriented enterprise."],"ans":1,"exp":"Input tax attributable to zero-rated sales may be claimed as a tax credit OR as a refund (Secs. 106(A)(2) and 112(A)), so choice b is incorrect because it says \"only\" tax credit. Choice c states the rule correctly, and choice a is correct because zero-rated sales are taxable at 0%, producing no output tax. Choice d paraphrases the export-oriented enterprise definition.","notes":["Zero-rated: taxable at 0%; input VAT creditable or refundable (Sec. 112).","Exempt: not taxable; input VAT neither creditable nor refundable.","Refund claims for zero-rated sales: filed within 2 years after the close of the quarter the sales were made."],"upd":"TRAIN made the 70% export-oriented enterprise zero-rating subject to 12% VAT once the enhanced VAT refund system conditions are met; CREATE MORE allows zero-rating of local purchases by registered export enterprises of goods and services directly attributable to the registered project (replacing CREATE's 'directly and exclusively used' test).","key":"Keeps key B. Minor flaw: choice d says \"at least 70%\" while the Tax Code says export sales must \"exceed\" 70%; B is still the clearly intended incorrect statement."},{"id":"Q03-09","quiz":3,"num":9,"sec":"5.1","q":"The sale and actual shipment of goods from the Philippines to a foreign country, irrespective of any shipping arrangement that may be agreed upon which may influence or determine the transfer of ownership of the goods so exported, is an export sale if:\nI. paid for in acceptable foreign currency or its equivalent in goods or services.\nII. accounted for in accordance with the rules and regulations of the Bangko Sentral ng Pilipinas (BSP).","opts":["Only I is correct","Only II is correct","Both I and II are correct","Neither I nor II is correct"],"ans":2,"exp":"Sec. 106(A)(2)(a)(1) zero-rates the sale and actual shipment of goods abroad when paid for in acceptable foreign currency or its equivalent in goods or services AND accounted for under BSP rules. Both conditions are required, so both I and II are correct.","notes":["Direct export sale: actual shipment abroad + payment in acceptable foreign currency + accounted for under BSP rules.","The shipping arrangement (FOB, CIF, etc.) does not matter.","Zero-rating applies only to VAT-registered sellers; a non-VAT seller's export sale is exempt."],"upd":"","key":""},{"id":"Q03-10","quiz":3,"num":10,"sec":"5.1","q":"First statement: Sales of metallic minerals to persons and entities are subject to twelve percent (12%) value-added tax if the value thereof exceeds the threshold set by the Tax Code and existing issuances.\nSecond statement: Sales of gold to the Bangko Sentral ng Pilipinas are subject to value-added tax at the rate of zero percent (0%) if the seller is a VAT-registered taxpayer.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":1,"exp":"The first statement is incorrect because the 12% VAT on sales of goods does not hinge on the value of a particular sale exceeding a threshold: the P3,000,000 threshold refers to the seller's annual gross sales, and a VAT-registered seller charges VAT on every taxable sale regardless of its amount. The second statement is incorrect because the sale of gold to the BSP is no longer zero-rated; it is now VAT-exempt under Sec. 109(1)(Z). Both statements are therefore incorrect.","notes":["The P3,000,000 VAT threshold tests the seller's annual gross sales, not the value of each sale.","Sale of gold to the BSP: VAT-exempt (Sec. 109(1)(Z)), not zero-rated.","Exempt means no output VAT and no input tax credit or refund on related purchases."],"upd":"TRAIN: moved the sale of gold to the BSP from zero-rated (old Sec. 106(A)(2)(a)(4)) to VAT-exempt under Sec. 109(1)(Z).","key":""},{"id":"Q03-11","quiz":3,"num":11,"sec":"5.1","q":"Transfer, use or consumption not in the course of business of goods or properties originally intended for sale or for use in the course of business is an example of:","opts":["actual sale of goods or properties.","effectively zero-rated sale of goods or properties.","deemed sale of goods or properties.","none of the choices."],"ans":2,"exp":"Sec. 106(B) lists this as a transaction deemed sale: no actual sale occurs, but VAT is imposed because the goods (on which input VAT may have been claimed) are diverted from business use. It is not an actual sale (no buyer or consideration) and not zero-rated.","notes":["Deemed sales: (1) transfer, use or consumption not in the course of business; (2) distribution to shareholders or creditors in payment of debt; (3) consignment not sold within 60 days; (4) retirement or cessation of business (inventory on hand).","Deemed sale output VAT is based on market value, except retirement/cessation (lower of cost or market)."],"upd":"","key":""},{"id":"Q03-12","quiz":3,"num":12,"sec":"5.1","q":"For deemed sale transactions, other than retirement or cessation of business, the output tax shall be based on the:","opts":["selling price of the goods deemed sold as of the time of the occurrence of the transactions.","market value of the goods deemed sold as of the time of the occurrence of the transactions.","acquisition cost of the goods deemed sold.","acquisition cost or the current market price of the goods, whichever is lower."],"ans":1,"exp":"Under RR 16-2005 (Sec. 4.106-7), the output tax on deemed sales is based on the market value of the goods at the time of the transaction. The lower of acquisition cost or current market price (choice d) applies only to retirement or cessation of business. There is no actual selling price in a deemed sale, so choice a does not fit.","notes":["Deemed sale base: market value at time of occurrence.","Retirement/cessation: lower of acquisition cost or current market price.","Change of ownership where the business continues (e.g., change of control) is not a cessation, so no deemed sale."],"upd":"","key":""},{"id":"Q03-13","quiz":3,"num":13,"sec":"5.1","q":"Which of the following goods when sold or imported shall NOT be exempt from VAT?","opts":["Agricultural and marine food products in their original state.","Livestock and poultry of a kind generally used as, or yielding or producing foods for human consumption.","Breeding stock and genetic materials therefor.","Processed or manufactured agricultural and marine food products."],"ans":3,"exp":"Sec. 109(1)(A) exempts agricultural and marine food products in their original state, livestock and poultry used for or producing food for human consumption, and breeding stock and genetic materials. Food products that have been processed or manufactured beyond simple preparation or preservation (e.g., canned or cooked goods) are subject to 12% VAT.","notes":["Simple processes (freezing, drying, salting, broiling, roasting, smoking, stripping, vacuum packing) keep products in their original state.","Polished/husked rice, corn grits, raw cane sugar, molasses, ordinary salt and copra are considered in their original state.","Canning and cooking are processing; the products become VATable."],"upd":"","key":""},{"id":"Q03-14","quiz":3,"num":14,"sec":"5.1","q":"Which of the following is NOT deductible from \"gross selling price\"?","opts":["Discounts determined and granted at the time of sale, which are expressly indicated in the invoice, the amount thereof forming part of the gross sales duly recorded in the books of accounts","Discount determined and granted after the agreed sales quota is met by the buyer","Sales discount indicated in the invoice at the time of sale, the grant of which is not dependent upon the happening of a future event, deductible within the same month or quarter given","Sales returns and allowances for which a proper credit or refund was made during the month or quarter to the buyer for sales previously recorded as taxable sales"],"ans":1,"exp":"Only discounts granted at the time of sale, shown on the invoice, and not dependent on a future event may reduce gross selling price (Sec. 106(D)). A volume or quota discount granted only after the buyer meets a sales quota depends on a future event, so it is not deductible. Choices a and c describe qualifying discounts, and d describes allowable sales returns and allowances.","notes":["Deductible: invoice-indicated discounts not contingent on a future event; sales returns and allowances with proper credit or refund.","Not deductible: discounts contingent on future events (quota, prompt payment later determined).","Gross selling price excludes the VAT but includes excise tax, if any."],"upd":"","key":""},{"id":"Q03-15","quiz":3,"num":15,"sec":"5.1","q":"Which of the following statements is incorrect?","opts":["In case the valuation used by the Bureau of Customs in computing customs duties is based on volume or quantity of the imported goods, the landed cost shall be the basis for computing VAT.","Landed cost consists of the invoice amount, customs duties, freight, insurance and other charges.","If the goods imported are subject to excise tax, the excise tax shall not form part of the tax base.","The same valuation rule applies to technical importation of goods sold by a person located in a Special Economic Zone to a customer located in a customs territory."],"ans":2,"exp":"Under Sec. 107(A), the VAT base on importation is the value used by the BOC for customs duties plus customs duties, excise taxes (if any) and other charges before release from customs custody. So excise tax DOES form part of the base, making choice c incorrect. The landed cost rule for volume-based duties (a and b) and the application to technical importations from SEZs (d) are correct.","notes":["VAT on importation base: dutiable value + customs duties + excise tax + other charges prior to release.","Volume/quantity-based duties: use landed cost (invoice amount + duties + freight + insurance + other charges).","Sales from an ecozone to the customs territory are treated as technical importations."],"upd":"","key":""},{"id":"Q03-16","quiz":3,"num":16,"sec":"5.1","q":"Which one is NOT included in the tax base of VAT on importation?","opts":["Value used by Bureau of Customs in determining tariff and customs duties","Customs duties","Excise tax","Facilitation fee"],"ans":3,"exp":"The Sec. 107(A) base consists of the dutiable value, customs duties, excise taxes and other legitimate charges prior to release of the goods from customs custody. A \"facilitation fee\" is not a charge imposed by law on the importation, so it is excluded. Choices a, b and c are expressly part of the base.","notes":["Base: dutiable value + customs duties + excise taxes + other charges before release.","VAT on importation is paid before release from customs custody.","Importer's VAT paid is creditable input tax if the goods are for business use."],"upd":"","key":""},{"id":"Q03-17","quiz":3,"num":17,"sec":"5.1","q":"Who of the following shall be considered an importer for value-added tax purposes?\nI. Any person who brings goods into the Philippines, whether or not made in the course of his trade or business\nII. Non-exempt persons or entities who acquire tax-free imported goods from exempt persons, entities or agencies","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Under RR 16-2005 (Sec. 4.107-1), an importer is any person who brings goods into the Philippines, whether or not in the course of trade or business. Where tax-free imported goods are later sold or transferred to non-exempt persons, the purchaser or transferee is considered the importer and is liable for the VAT. Both are importers.","notes":["VAT on importation applies even to personal (non-business) importations.","A non-exempt buyer of tax-free imported goods from an exempt entity is liable for the VAT as importer.","Technical importation: goods from an ecozone brought into the customs territory."],"upd":"","key":""},{"id":"Q03-18","quiz":3,"num":18,"sec":"5.1","q":"Which of the following advance payments by the lessee may be subject to VAT?","opts":["A loan to the lessor from the lessee","An option money for the property","A security deposit to insure the faithful performance of certain obligations of the lessee to the lessor","Pre-paid rental"],"ans":3,"exp":"Prepaid rental is consideration for the lease and is subject to VAT. A loan to the lessor is a liability, option money pays for the right to buy the property (not rent), and a security deposit is returnable and only secures the lessee's obligations; none of these is rent unless later applied to rental.","notes":["Advance rentals are VATable; refundable security deposits are not, until applied to rent.","Lease of residential units with monthly rent not exceeding P15,000 per unit is VAT-exempt.","Lease of property is a sale of service under Sec. 108."],"upd":"","key":""},{"id":"Q03-19","quiz":3,"num":19,"sec":"5.1","q":"If the input tax, inclusive of input tax carried over from the previous quarter, exceeds the output tax, the excess input tax shall be:","opts":["credited in every quarter but not to exceed seventy percent (70%) of the output tax.","carried over to the succeeding quarter or quarters.","disregarded because carry-over is no longer allowed under the new regulations.","deducted from income tax due."],"ans":1,"exp":"Under Sec. 110(B), excess input tax is carried over to the succeeding quarter or quarters. The 70% cap in choice a was introduced by RA 9337 but removed by RA 9361, so input tax may now be credited in full against output tax. Excess input tax cannot be credited against income tax (d), and carry-over remains allowed (c).","notes":["Excess input VAT: carried over to succeeding quarters; no 70% cap.","Refund of excess input VAT: only for zero-rated/effectively zero-rated sales or upon cancellation of registration (Sec. 112).","Input VAT on capital goods is now claimed in full in the period of purchase (the 60-month amortization for capital goods over P1M ended Jan 1, 2022 under TRAIN)."],"upd":"RA 9361 (2006): removed the 70% cap on input tax credit that RA 9337 had imposed; excess input tax is carried over.","key":""},{"id":"Q03-20","quiz":3,"num":20,"sec":"5.1","q":"This refers to the sale of goods or properties and/or services and the use or lease of properties that is not subject to VAT (output tax) and the seller is not allowed any tax credit of VAT (input tax) on purchases.","opts":["VAT-exempt sales","Zero-rated sales","Deemed sales","Taxable sales"],"ans":0,"exp":"An exempt transaction carries no output VAT, and the input VAT on related purchases is not creditable (it becomes part of cost). A zero-rated sale also has no output tax, but the seller may claim input VAT as credit or refund, which is the key difference. Deemed and regular taxable sales carry 12% output VAT.","notes":["Exempt: no output VAT, no input credit.","Zero-rated: 0% output VAT, input VAT creditable/refundable.","Exempt transactions of a non-VAT person may be subject to percentage tax (e.g., 3% under Sec. 116)."],"upd":"","key":""},{"id":"Q03-21","quiz":3,"num":21,"sec":"5.1","q":"Which of the following shall NOT be considered livestock for VAT-exempt transaction purposes?","opts":["Cows","Bulls and calves","Sheep","Race horses"],"ans":3,"exp":"Under RR 16-2005, livestock includes cows, bulls and calves, pigs, sheep, goats and rabbits, which are raised for food. Race horses, like fighting cocks, zoo animals and pets, are not food animals, so their sale is subject to VAT.","notes":["Livestock: cows, bulls and calves, pigs, sheep, goats, rabbits.","Poultry: fowls, ducks, geese, turkey.","Excluded: fighting cocks, race horses, zoo animals and animals generally considered pets."],"upd":"","key":""},{"id":"Q03-22","quiz":3,"num":22,"sec":"5.1","q":"Which of the following shall NOT be considered as poultry for VAT-exempt transaction purposes?","opts":["Fowls","Ducks and geese","Fighting cocks","Turkey"],"ans":2,"exp":"Poultry for VAT exemption covers fowls, ducks, geese and turkey, which are raised for food. Fighting cocks are not food animals, so they are excluded and their sale is subject to VAT.","notes":["Poultry: fowls, ducks, geese, turkey.","Fighting cocks, race horses, zoo animals and pets are not covered by the exemption.","The test is whether the animal is of a kind generally used for, or producing, food for human consumption."],"upd":"","key":""},{"id":"Q03-23","quiz":3,"num":23,"sec":"5.1","q":"Sale of orchids and other ornamental plants is:","opts":["subject to 12% VAT.","subject to 0% VAT.","exempt from VAT.","none of the choices"],"ans":0,"exp":"The Sec. 109(1)(A) exemption covers agricultural and marine FOOD products in their original state. Orchids and ornamental plants are agricultural but non-food products, so their sale is subject to 12% VAT. They are not zero-rated either.","notes":["Exemption is limited to food products (and breeding stock, fertilizers, seeds, feeds, etc. specifically listed).","Ornamental plants, flowers and other non-food agricultural products: 12% VAT.","Seeds, seedlings, fingerlings and fertilizers used in agriculture are VAT-exempt."],"upd":"","key":""},{"id":"Q03-24","quiz":3,"num":24,"sec":"5.1","q":"Meat, fruit, fish, vegetables and other agricultural and marine food products shall be considered in their original state even if they have undergone the simple processes of preparation or preservation for the market. Which of the following shall NOT be considered a simple process of preparation or preservation for the market?","opts":["Freezing","Drying","Roasting","Canning"],"ans":3,"exp":"RR 16-2005 lists freezing, drying, salting, broiling, roasting, smoking and stripping (and advanced packaging like shrink wrapping or vacuum packing) as simple processes that keep a product in its original state. Canning transforms the product into a processed food, so canned goods are subject to 12% VAT.","notes":["Simple processes: freezing, drying, salting, broiling, roasting, smoking, stripping.","Advanced packaging (shrink wrap, vacuum pack, tetra pack) does not remove original-state status.","Canning and cooking: processed; subject to VAT."],"upd":"","key":""},{"id":"Q03-25","quiz":3,"num":25,"sec":"5.1","q":"Which of the following is subject to value-added tax?","opts":["Medical, dental, hospital and veterinary services","Laboratory services","Sale of drugs and medicine in the hospital's pharmacy or drug store","Medicines administered to a patient confined in the hospital"],"ans":2,"exp":"Medical, dental, hospital and veterinary services (except those rendered by professionals) are VAT-exempt under Sec. 109(1)(G), and this includes laboratory services and medicines administered to confined patients as part of hospital services. A sale of drugs and medicines by the hospital's pharmacy or drug store is a separate sale of goods, so it is generally subject to 12% VAT.","notes":["Hospital services, including lab services and medicines used on confined patients: VAT-exempt.","Hospital pharmacy sales to the public: 12% VAT unless the medicine itself is exempt.","Professional services of doctors (professionals) are not covered by the medical services exemption."],"upd":"TRAIN and CREATE: sales of prescription drugs and medicines for diabetes, high cholesterol, hypertension, cancer, mental illness, tuberculosis and kidney diseases are VAT-exempt (Sec. 109(1)(AA)), so choice c holds only for other medicines.","key":""},{"id":"Q03-26","quiz":3,"num":26,"sec":"5.1","q":"Beginning January 1, 2021, the VAT exemption shall only apply to the following, except:","opts":["sale of real properties not primarily held for sale to customers or held for lease in the ordinary course of trade or business","sale of real property utilized for socialized housing","sale of house and lot, and other residential dwellings with selling price of not more than three million six hundred thousand pesos (P3,600,000)","sale of real property utilized for low-cost housing"],"ans":3,"exp":"Under Sec. 109(1)(P) as amended by TRAIN, starting January 1, 2021 the real property exemptions are limited to: property not primarily held for sale or lease (capital assets), property for socialized housing, and house and lot/residential dwellings within the CPI-adjusted threshold (now P3,600,000). The exemption for low-cost housing ended on December 31, 2020, so choice d is the exception.","notes":["Low-cost housing exemption ended Dec 31, 2020; socialized housing remains exempt.","Residential house and lot exemption threshold: P3,600,000 (RR 1-2024, CPI-adjusted).","Residential lot-only exemption (old P1,919,500 threshold) was also removed by TRAIN."],"upd":"TRAIN: removed the low-cost housing and residential lot exemptions beginning 2021; RR 1-2024 adjusted the house and lot threshold to P3,600,000.","key":""},{"id":"Q03-27","quiz":3,"num":27,"sec":"5.1","q":"All of the following cooperatives enjoy VAT exemption on their sales or receipts, except:","opts":["agricultural cooperatives.","credit and multi-purpose cooperatives.","non-agricultural, non-electric and non-credit cooperatives.","electric cooperatives."],"ans":3,"exp":"Sec. 109(1)(L), (M) and (N) exempt sales by CDA-registered agricultural cooperatives (to members and of their produce), lending by credit or multipurpose cooperatives to members, and sales by non-agricultural, non-electric and non-credit cooperatives (with each member's share capital not exceeding P15,000). Electric cooperatives are expressly excluded, so their sales are subject to VAT.","notes":["Electric cooperatives: not VAT-exempt.","Non-agricultural, non-electric, non-credit cooperatives: exempt only if each member's share capital contribution does not exceed P15,000.","Cooperatives must be duly registered with the Cooperative Development Authority."],"upd":"","key":""},{"id":"Q03-28","quiz":3,"num":28,"sec":"5.1","q":"Which of the following sales of real properties shall NOT be exempt from VAT?","opts":["Sale of real properties not primarily held for sale to customers or held for lease in the ordinary course of trade or business.","Sale of real properties utilized for socialized housing.","Sale of real properties primarily held for sale to be utilized for commercial purposes.","Sale of house and lot and other residential dwellings valued at P3,600,000 and below."],"ans":2,"exp":"Real property held primarily for sale (ordinary asset of a dealer) and used for commercial purposes is not covered by any Sec. 109(1)(P) exemption, so it is subject to 12% VAT. Choices a, b and d are the three remaining real property exemptions after 2020.","notes":["Exempt: capital assets (not held for sale/lease), socialized housing, residential house and lot up to P3,600,000.","Commercial real property sold by a dealer: 12% VAT.","Sale of a capital asset real property is subject to 6% capital gains tax instead."],"upd":"","key":""},{"id":"Q03-29","quiz":3,"num":29,"sec":"5.1","q":"Your client leases residential units for P15,000 per month per unit. His total gross annual sales amount to P3,500,000. What will be the consequence for VAT purposes?","opts":["Exempt from VAT and not subject to the 3% other percentage tax for VAT-exempt persons","Exempt from VAT and subject to the 3% other percentage tax for VAT-exempt persons","Subject to VAT at 12% and the 3% other percentage tax for VAT-exempt persons","Subject to VAT at 0% and not subject to the 3% other percentage tax for VAT-exempt persons"],"ans":0,"exp":"Under Sec. 109(1)(Q) as amended by TRAIN, lease of a residential unit with monthly rental not exceeding P15,000 per unit is VAT-exempt regardless of the lessor's aggregate annual rentals. Sec. 116 likewise excludes such leases from the 3% percentage tax. The P3,500,000 total is irrelevant because the test is per unit per month.","notes":["Residential rent up to P15,000 per unit per month: VAT-exempt and not subject to 3% OPT, regardless of aggregate.","Residential rent above P15,000 per unit: VAT if aggregate exceeds P3,000,000; otherwise 3% OPT.","Commercial leases do not get this exemption."],"upd":"","key":""},{"id":"Q03-30","quiz":3,"num":30,"sec":"5.3","q":"Which of the following sales to senior citizens shall NOT be exempt from VAT?","opts":["Sale of food, drinks, dessert and other consumable items served by the establishments, including value meals and promotional meals, offered for consumption of the general public","Sale of single serving seat meals with beverage for an individual senior citizen","Bulk orders which are within the context of pre-contracted or pre-arranged group meals or packages","Sale of medicines from drug stores, hospital pharmacies, medical and optical clinics and similar establishments including non-traditional outlets dispensing medicines"],"ans":2,"exp":"RA 9994 grants senior citizens a 20% discount and VAT exemption on purchases for their exclusive use, including restaurant food and drinks (value and promo meals included), individual meals, and medicines. Bulk orders or pre-arranged group meals and packages are not for the senior citizen's exclusive personal consumption, so the discount and VAT exemption do not apply.","notes":["Senior citizen privileges (RA 9994): 20% discount + VAT exemption on qualified purchases for exclusive use.","Not covered: bulk orders, group meals and packages, purchases not for the senior citizen's own use.","The seller may deduct the 20% discount from gross income; the VAT exemption applies to the sale itself."],"upd":"","key":""},{"id":"Q03-31","quiz":3,"num":31,"sec":"5.1","q":"During a particular year, the husband's gross receipts from his practice of profession subject to VAT is P2,000,000. His wife has gross sales of P1,920,000 from her VATable transactions. For VAT purposes, assuming they are not VAT-registered, will they be subject to VAT?","opts":["Yes, they are subject to VAT because their aggregate receipts or sales exceed the VAT threshold amount.","No, they are not subject to VAT because for purposes of the VAT threshold amount, the husband and the wife shall be considered separate taxpayers and neither one of them exceeded the said threshold amount.","Yes, they are subject to VAT because their transactions are VATable.","Answer not given."],"ans":1,"exp":"For the VAT threshold, husband and wife are treated as separate taxpayers (RR 16-2005), so their sales are not combined. Each spouse's own sales (P2,000,000 and P1,920,000) are below the P3,000,000 threshold, so neither is liable to VAT; each would instead pay 3% percentage tax under Sec. 116 (unless the 8% income tax option is elected). Choice a wrongly aggregates the spouses' sales, and c ignores the threshold.","notes":["Spouses are separate taxpayers for the VAT threshold; no aggregation between them.","Aggregation does apply to each spouse's own multiple businesses.","Below-threshold, non-VAT sellers: 3% percentage tax (Sec. 116) or 8% income tax option in lieu of it."],"upd":"EOPT: VAT on services is now based on gross sales (invoice-based), no longer gross receipts; the invoice replaces the official receipt as the primary sales document.","key":""},{"id":"Q03-32","quiz":3,"num":32,"sec":"5.1","q":"Any input tax on the purchases or importation of goods in the course of trade or business shall be creditable against the output tax if:\nI. evidenced by a VAT invoice.\nII. issued by a VAT-registered person.","opts":["I and II are correct","Neither I nor II is correct","Only I is correct","Only II is correct"],"ans":0,"exp":"Under Sec. 110(A), creditable input tax must be evidenced by a VAT invoice issued in accordance with Sec. 113, and only VAT-registered persons may issue VAT invoices showing VAT. Both requisites must be met.","notes":["Input VAT must be supported by a valid VAT invoice (or import entry and proof of payment for importations).","Purchases from non-VAT sellers give no input tax.","Input VAT is claimed only on purchases for business use."],"upd":"EOPT: the invoice is now the sole document supporting input VAT for both goods and services; official receipts are no longer the basis for claiming input tax.","key":""},{"id":"Q03-33","quiz":3,"num":33,"sec":"5.1","q":"Mr. Juan Cruz, VAT-exempt, issued a VAT invoice to Mr. S. Santos, a VAT-registered trader. As a consequence:\nStatement A: Mr. Juan Cruz would be liable to percentage tax, VAT, and a surcharge of 50%.\nStatement B: Mr. S. Santos can claim input tax on his purchase provided the requisite information required under the Regulations is shown on the invoice.","opts":["Both A and B are correct","Both A and B are incorrect","Only A is correct","Only B is correct"],"ans":0,"exp":"Under Sec. 113(D) and RR 16-2005, a non-VAT person who issues a VAT invoice is liable to the percentage tax on his transactions, VAT as if VAT-registered without input tax credit, and a 50% surcharge. The VAT shown is recognized as input tax of the purchaser if the invoice contains the other required information. Both statements are correct.","notes":["Non-VAT person issuing a VAT invoice: percentage tax + VAT (no input credit) + 50% surcharge.","Buyer may still claim the input VAT if the invoice has the required information.","A VAT-registered person issuing a non-VAT-compliant invoice risks disallowance of the buyer's input tax."],"upd":"EOPT: the invoice is now the primary sales document for goods and services, so references to a VAT \"receipt\" no longer apply.","key":""},{"id":"Q03-34","quiz":3,"num":34,"sec":"5.1","q":"A VAT-registered domestic carrier operating air, land and sea transport equipment acquired vehicles for use in its operation to transport goods and cargoes. The domestic carrier:","opts":["can claim input taxes on the said acquisitions.","cannot claim input taxes on the said acquisitions.","can claim input taxes only on the acquisitions of air and sea transport vehicles.","can claim input taxes only on the acquisition of land transport vehicles."],"ans":0,"exp":"Domestic transport of goods or cargoes by land, air or sea is a VATable service under Sec. 108. Since the vehicles are used in that VATable business, the input VAT on their purchase is creditable, whatever the mode of transport. The limitation in choices c and d has no basis.","notes":["Domestic transport of goods/cargo (land, air, sea): 12% VAT.","Domestic land transport of passengers: 3% common carrier's tax (Sec. 117), not VAT.","Input VAT on capital goods used in VATable operations is creditable in full in the period of purchase."],"upd":"","key":""},{"id":"Q03-35","quiz":3,"num":35,"sec":"5.1","q":"When may a VAT-registered person claim input taxes as an allowable deduction from his income tax return?","opts":["Input tax from zero-rated sales","Input taxes from capital goods","Input tax from exempt sales","Input taxes from export sales"],"ans":2,"exp":"Input tax attributable to VAT-exempt sales cannot be credited against output tax, so it is treated as part of cost or expense and is deductible for income tax. Input taxes on zero-rated or export sales (a, d) and on capital goods used in VATable operations (b) are creditable or refundable, so they cannot also be deducted for income tax.","notes":["Input VAT on exempt sales: not creditable; charge to cost or expense.","Mixed transactions: allocate input VAT based on the volume of sales.","A tax credit and an income tax deduction cannot both be claimed on the same input VAT."],"upd":"","key":""},{"id":"Q03-36","quiz":3,"num":36,"sec":"5.1","q":"Which of the following statements is incorrect?","opts":["In all cases where the basis for computing the output tax is the gross selling price, but the amount of VAT is erroneously billed in the invoice, the total invoice amount shall be presumed to be comprised of the gross selling price plus the correct amount of VAT.","The output tax, in case where the amount of VAT is erroneously billed, shall be computed by multiplying the total invoice amount by a fraction using the rate of VAT as numerator and one hundred percent (100%) plus rate of VAT as denominator.","The input tax that can be claimed by the buyer shall be the corrected amount of VAT computed in accordance with the formula in letter b above.","The buyer cannot claim input tax because the erroneous VAT is considered illegally collected."],"ans":3,"exp":"When VAT is erroneously billed, RR 16-2005 presumes the total invoice amount is gross selling price plus the correct VAT, so output tax is total invoice amount x 12/112, and the buyer may claim that corrected amount as input tax. The erroneous billing does not wipe out the buyer's input tax, so choice d is incorrect.","notes":["Erroneous VAT billing: output VAT = total invoice amount x 12/112.","Buyer claims the corrected (recomputed) VAT as input tax.","Same fraction applies whenever an invoice is VAT-inclusive."],"upd":"","key":""},{"id":"Q03-37","quiz":3,"num":37,"sec":"5.1","q":"Which of the following shall be entitled to transitional input tax credits on beginning inventories?\nI. Taxpayers who became VAT-registered persons upon exceeding the minimum turnover of P3,000,000 in any 12-month period\nII. Taxpayers who voluntarily register even if their turnover does not exceed P3,000,000 (except franchise grantees of radio and television broadcasting whose threshold is P10,000,000)","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Sec. 111(A) grants transitional input tax to any person who becomes liable to VAT or who elects to be VAT-registered. Both mandatory registrants (I) and voluntary registrants (II) may claim it on their beginning inventory.","notes":["Transitional input tax: 2% of beginning inventory or actual VAT paid, whichever is higher.","Base: beginning inventory of goods, materials and supplies on hand at the start of VAT registration.","Available to both mandatory and voluntary VAT registrants."],"upd":"","key":""},{"id":"Q03-38","quiz":3,"num":38,"sec":"5.1","q":"Presumptive input tax is equivalent to:","opts":["ten percent (10%) of the gross value in money of the purchases of primary agricultural products used as inputs to the production.","five percent (5%) of the gross value in money of the purchases of primary agricultural products used as inputs to the production.","four percent (4%) of the gross value in money of the purchases of primary agricultural products used as inputs to the production.","two percent (2%) of the gross value in money of the purchases of primary agricultural products used as inputs to the production."],"ans":2,"exp":"Sec. 111(B) allows qualified processors and manufacturers a presumptive input tax of 4% of the gross value in money of their purchases of primary agricultural products used as inputs. The 2% rate belongs to transitional input tax, not presumptive input tax.","notes":["Presumptive input tax: 4% of purchases of primary agricultural products used as inputs.","Transitional input tax: 2% of beginning inventory or actual VAT paid, whichever is higher.","The exempt agricultural purchases carry no actual VAT, which is why a presumed credit is given."],"upd":"","key":""},{"id":"Q03-39","quiz":3,"num":39,"sec":"5.1","q":"Which of the following shall NOT be allowed presumptive input tax?","opts":["Persons or firms engaged in the processing of sardines, mackerel and milk","Persons or firms engaged in the processing of canned fruits and vegetables","Persons or firms manufacturing refined sugar and cooking oil","Persons or firms manufacturing packed noodle-based instant meals"],"ans":1,"exp":"Sec. 111(B) limits presumptive input tax to persons processing sardines, mackerel and milk, and those manufacturing refined sugar, cooking oil and packed noodle-based instant meals. Processing of canned fruits and vegetables is not on the list, so it gets no presumptive input tax.","notes":["Presumptive input tax list: sardines, mackerel, milk, refined sugar, cooking oil, packed noodle-based instant meals.","The list is exclusive; other food processors do not qualify."],"upd":"","key":""},{"id":"Q03-40","quiz":3,"num":40,"sec":"5.1","q":"First statement: Only VAT-registered persons are required to print their TIN followed by the word \"VAT\" in their invoice.\nSecond statement: All purchases covered by invoices other than a VAT invoice shall not give rise to any input tax.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":0,"exp":"Only VAT-registered persons may issue VAT invoices showing their VAT registration and TIN, so a non-VAT person must not print \"VAT\" on its invoices. Under RR 16-2005, purchases covered by invoices other than VAT invoices do not give rise to input tax, since input VAT must be evidenced by a VAT invoice (Sec. 110(A)). Both statements are correct.","notes":["VAT invoice must show that the seller is VAT-registered and its TIN, plus the VAT separately stated.","No VAT invoice, no input tax credit.","Invoices are required for each sale or transfer valued at P500 or more (Sec. 237, as amended by EOPT)."],"upd":"EOPT: the invoice is now the sole basis for input VAT on both goods and services; the former VAT official receipt for services is replaced by the invoice.","key":""},{"id":"Q04-01","quiz":4,"num":1,"sec":"5.2","q":"A business tax that is based on a given ratio between the gross sales or receipts and the burden imposed upon the taxpayer, which is based on a set ratio between the volume of sales and the amount of the tax.","opts":["Percentage tax","Income tax","Donor's tax","Documentary stamp tax"],"ans":0,"exp":"A percentage tax is a business tax computed as a fixed percentage of gross sales or receipts, so the tax moves in a set ratio with sales volume. Income tax is based on net income, donor's tax on gratuitous transfers, and DST on documents and transactions.","notes":["Percentage taxes are imposed on gross sales or receipts, with no deduction for costs.","They are business taxes, generally imposed on persons not subject to VAT.","Main percentage taxes: Secs. 116 to 127 of the NIRC."],"upd":"","key":""},{"id":"Q04-02","quiz":4,"num":2,"sec":"5.2","q":"Which of the following is incorrect? The percentage tax is:","opts":["a tax on sale of services.","imposed on a sale of goods.","imposed together with the value-added tax.","imposed together with the excise tax."],"ans":2,"exp":"As a rule, a transaction is subject either to VAT or to percentage tax, not both, since percentage taxes generally apply to transactions exempt from VAT. It covers sales of goods and services (a, b), and can coexist with excise tax (d), e.g., a non-VAT seller of excisable goods pays excise tax plus 3% percentage tax.","notes":["General rule: VAT and percentage tax are alternative, not cumulative, on the same transaction.","Percentage tax and excise tax may apply together.","Different lines can differ, e.g., a VAT-registered telco pays VAT on domestic calls and collects OCT on overseas calls."],"upd":"","key":""},{"id":"Q04-03","quiz":4,"num":3,"sec":"5.2","q":"A seller of goods is not VAT-registered. His annual gross sales amount to P3,000,000 (VAT threshold amount). To what business tax is he liable?","opts":["3% tax on VAT-exempt persons","12% value-added tax","3% common carrier's tax","Not subject to any percentage tax"],"ans":0,"exp":"VAT is required only when gross sales EXCEED P3,000,000; sales of exactly P3,000,000 do not exceed the threshold. A non-VAT-registered seller at or below the threshold pays the 3% percentage tax under Sec. 116. The common carrier's tax applies only to carriers.","notes":["Sec. 116: 3% of gross quarterly sales or receipts (the 1% CREATE rate ended June 30, 2023).","\"Exceeding P3,000,000\" means P3,000,000 exactly is still below the VAT threshold.","Self-employed individuals and professionals who elect the 8% income tax are exempt from the 3% percentage tax."],"upd":"","key":""},{"id":"Q04-04","quiz":4,"num":4,"sec":"5.2","q":"Which of the following is NOT subject to the 3% common carrier's tax?","opts":["Cars for rent or hire driven by the lessee","Transportation contractors, including persons who transport passengers for hire","Owners of animal-drawn two-wheeled vehicles","Domestic carriers by land for the transport of passengers"],"ans":2,"exp":"Sec. 117 imposes 3% on domestic carriers and keepers of garages for land transport of passengers, cars for rent or hire driven by the lessee, and transportation contractors, but expressly excepts owners of bancas and owners of animal-drawn two-wheeled vehicles. Choices a, b and d are all covered.","notes":["Sec. 117: 3% of quarterly gross receipts from land transport of passengers.","Exempt: owners of bancas and animal-drawn two-wheeled vehicles.","Domestic transport of goods/cargo (any mode) and domestic sea/air passenger transport are subject to VAT."],"upd":"EOPT: removed the minimum quarterly gross receipts rule for domestic carriers under Sec. 117; the tax is now on actual gross receipts.","key":""},{"id":"Q04-05","quiz":4,"num":5,"sec":"5.2","q":"Which of the following is subject to the 3% common carrier's tax?","opts":["Domestic carriers by air for the transport of goods or cargoes whose gross sales exceed P3,000,000","Domestic carriers by sea for the transport of goods or cargoes whose gross sales do not exceed P3,000,000 but registered under the VAT system","Domestic carriers by land for the transport of passengers whose gross sales exceed P3,000,000","Transportation contractors on their transport of goods or cargoes whose gross sales exceed P3,000,000 but failed to register under the VAT system"],"ans":2,"exp":"Domestic land transport of passengers is subject to the 3% common carrier's tax under Sec. 117 regardless of the amount of gross receipts, and it is exempt from VAT. Transport of goods or cargoes (a, b, d) is a VATable service: a and d exceed the threshold (d pays VAT without input credit for failing to register), and b is VAT-registered.","notes":["Land transport of passengers: 3% OPT, regardless of amount.","Transport of goods/cargo by land, sea or air: 12% VAT if VAT-registered or over P3,000,000.","Domestic sea and air transport of passengers: VAT."],"upd":"","key":""},{"id":"Q04-06","quiz":4,"num":6,"sec":"5.2","q":"The EOPT removed the provision regarding the minimum quarterly gross receipts on which tax?","opts":["Franchise tax","Common carrier's tax on domestic carriers","Common carrier's tax on international carriers","Stock transaction tax"],"ans":1,"exp":"Before EOPT, Sec. 117 required domestic carriers of passengers by land to pay 3% on actual gross receipts but not less than prescribed minimum quarterly gross receipts per vehicle type. RA 11976 (EOPT) deleted this minimum, so the tax is now simply 3% of actual gross receipts.","notes":["Sec. 117 (post-EOPT): 3% of actual quarterly gross receipts; no more presumptive minimum.","International carriers pay 3% under Sec. 118 on cargo and mail receipts."],"upd":"EOPT (RA 11976): deleted the minimum quarterly gross receipts for domestic carriers under Sec. 117.","key":""},{"id":"Q04-07","quiz":4,"num":7,"sec":"5.2","q":"International carriers doing business in the Philippines are subject to the:","opts":["3% percentage tax on gross receipts derived from the transport of cargo and/or mail from the Philippines to another country.","3% percentage tax on gross receipts derived from the transport of cargo, mail and passengers from the Philippines to another country.","12% value-added tax on their gross receipts derived from the transport of cargo from the Philippines to another country.","0% value-added tax on their gross receipts derived from the transport of cargo and passengers from the Philippines to another country."],"ans":0,"exp":"Sec. 118, as amended by RA 10378, imposes 3% on the quarterly gross receipts of international air and shipping carriers from transport of cargo and/or mail from the Philippines to another country. Passenger receipts were removed from Sec. 118 and are exempt from VAT and percentage tax, so choice b is wrong. Their outgoing cargo receipts are not subject to VAT (c, d).","notes":["International carriers: 3% on outgoing cargo and mail (Sec. 118).","Outgoing passenger receipts: exempt from percentage tax and VAT (RA 10378).","Income tax: 2.5% on Gross Philippine Billings (Sec. 28(A)(3)), subject to reciprocity/treaty relief."],"upd":"","key":""},{"id":"Q04-08","quiz":4,"num":8,"sec":"5.2","q":"Which of the following franchise grantees is subject to the 2% percentage tax on franchise?","opts":["Franchise on radio and/or television broadcasting companies whose gross annual receipts in the preceding year do not exceed P10,000,000","Franchise on gas and water utilities","Franchise on toll road operations","PAGCOR and its licensees and franchisees"],"ans":1,"exp":"Sec. 119 imposes 2% franchise tax on gas and water utilities. Radio and TV broadcasting companies with annual gross receipts not exceeding P10,000,000 pay 3% (unless they opt for VAT). Toll road operators are subject to VAT, and PAGCOR and its licensees are governed by PAGCOR's charter (5% franchise tax in lieu of other taxes).","notes":["Franchise tax: gas and water utilities 2%; radio/TV (not over P10,000,000) 3%.","Other franchise grantees (electricity, telecommunications, toll roads): 12% VAT.","Radio/TV grantees below P10,000,000 may opt for VAT; the option is irrevocable."],"upd":"","key":""},{"id":"Q04-09","quiz":4,"num":9,"sec":"5.2","q":"A VAT-registered telephone company provides services for domestic and overseas calls. What business taxes are due from the services offered?\nI. Value-added tax for domestic calls\nII. Overseas communications tax for overseas calls originating from the Philippines","opts":["Yes to I and II","No to I and II","Yes to I only","Yes to II only"],"ans":0,"exp":"Telecommunication services are VATable, so domestic calls are subject to 12% VAT. Overseas calls originating from the Philippines are subject to the 10% overseas communications tax under Sec. 120, paid by the person making the call and collected by the telephone company. Both taxes apply.","notes":["OCT: 10% on the amount paid for overseas dispatch, message or conversation originating from the Philippines.","OCT is paid by the person making the call; the telco collects and remits it.","Exempt from OCT: government, diplomatic services, international organizations, news services."],"upd":"","key":""},{"id":"Q04-10","quiz":4,"num":10,"sec":"5.2","q":"First statement: Radio and television broadcasting companies whose annual gross receipts of the preceding year do not exceed P10,000,000 shall have the option to be registered as a value-added taxpayer and pay the tax due thereon.\nSecond statement: Once radio and television broadcasting companies qualified to optionally register exercise the option, said option shall be revocable within three (3) years from date of registration.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"Sec. 119 gives radio and TV broadcasting companies with annual gross receipts not exceeding P10,000,000 the option to register for VAT instead of paying the 3% franchise tax, so the first statement is correct. Once exercised, the option is irrevocable, so the second statement is wrong.","notes":["Radio/TV franchise tax: 3% if annual gross receipts do not exceed P10,000,000.","Option to register as VAT taxpayer: irrevocable once exercised.","Above P10,000,000: 12% VAT."],"upd":"","key":""},{"id":"Q04-11","quiz":4,"num":11,"sec":"5.2","q":"How much tax shall be collected upon every overseas dispatch, message or conversation transmitted from the Philippines by telephone, telegraph, telewriter exchange, wireless and other communication equipment service?","opts":["3% on gross receipts","5% on gross receipts","10% on the amount billed for the services","12% on the amount paid for the services"],"ans":2,"exp":"Sec. 120 imposes a 10% overseas communications tax on the amount paid for each overseas dispatch, message or conversation originating from the Philippines. Choice c carries the correct rate (the law's exact phrase is \"amount paid\"); 12% is the VAT rate and 3%/5% have no basis here.","notes":["OCT rate: 10% of the amount paid for the service.","Only communications originating from the Philippines are taxed.","The payer is liable; the service provider collects and remits."],"upd":"","key":""},{"id":"Q04-12","quiz":4,"num":12,"sec":"5.2","q":"One of the following statements is incorrect.","opts":["Overseas communications tax is imposed on overseas communications originating from the Philippines.","The person liable to overseas communications tax may or may not be engaged in any trade or business.","The overseas communications tax is imposed whether the overseas communications are made in the course of trade or business or not.","The overseas communications tax is imposed on the owner of the communications facilities used to make overseas communications."],"ans":3,"exp":"OCT is imposed on the person who makes the overseas communication and pays for it, not on the owner of the communications facilities, who only collects and remits the tax. The tax applies to communications originating from the Philippines whether or not the caller is in business, so a, b and c are correct.","notes":["OCT is a tax on the person paying for the overseas communication.","No trade or business requirement: private individuals' calls are covered.","Facility owners/operators act as collecting agents."],"upd":"","key":""},{"id":"Q04-13","quiz":4,"num":13,"sec":"5.2","q":"When is the tax on overseas dispatch, message or conversation originating from the Philippines paid?","opts":["Thirty (30) days after the end of the month","Twenty (20) days after the end of the month","Twenty (20) days after the end of the quarter","Five (5) days after the end of the quarter"],"ans":2,"exp":"Sec. 120 requires the person collecting the OCT to pay it within 20 days after the end of each quarter. The monthly deadlines in a and b and the 5-day deadline in d have no basis.","notes":["Sec. 120 OCT: remitted within 20 days after the end of each quarter.","Quarterly percentage tax return (2551Q) under EOPT: 25 days after the end of the quarter.","OCT rate: 10% of the amount paid."],"upd":"EOPT: the quarterly percentage tax return (BIR Form 2551Q) is generally due within 25 days after the end of the quarter (Sec. 128), while Secs. 120 and 125 still say 20 days after the end of the quarter; know both.","key":""},{"id":"Q04-14","quiz":4,"num":14,"sec":"5.2","q":"Agence France Presse, a news service, used communication facilities to send its news to its head office in Paris, France. During the current month, it paid a total of P500,000 for its overseas communications originating from the Philippines. How much is the overseas communications tax due?","opts":["P60,000","P50,000","P25,000","None"],"ans":3,"exp":"Sec. 120(C) exempts from OCT messages of news services dealing exclusively with the collection or dissemination of news through the press, radio, television or newsticker service. Since the messages were sent by a news service, no OCT is due. Choice b (P50,000) is the trap: it applies the 10% rate without the exemption.","notes":["Exempt from OCT: government, diplomatic services, international organizations, news services.","Without an exemption, OCT = 10% of the amount paid.","The news exemption requires that the messages deal exclusively with news."],"upd":"","key":""},{"id":"Q04-15","quiz":4,"num":15,"sec":"5.2","q":"The lease of property, real or personal, by a bank is subject to:","opts":["5% gross receipts tax.","7% gross receipts tax.","12% VAT.","0% VAT."],"ans":1,"exp":"Banks are subject to gross receipts tax under Sec. 121 instead of VAT. Royalties, rentals of property (real or personal), profits from exchange and all other items treated as gross income are taxed at 7%. The 5% rate applies to interest, commissions and discounts from lending with remaining maturity of 5 years or less.","notes":["Bank GRT (Sec. 121): lending income 5% (maturity 5 years or less) or 1% (over 5 years); dividends 0%; rentals, royalties and other income 7%; net trading gains 7%.","Banks and non-bank financial intermediaries performing quasi-banking are not subject to VAT on these receipts."],"upd":"","key":""},{"id":"Q04-16","quiz":4,"num":16,"sec":"5.2","q":"Which of the following is subject to the 0% gross receipts tax?","opts":["Gross receipts on interest, commissions and discounts from lending activities and income from financial leasing","Dividends and equity shares in net income of subsidiaries","Royalties, rentals of property, real or personal, profits from exchange and all other items treated as gross income in the Tax Code","Net trading gains within the taxable year on foreign currency, debt securities, derivatives and other similar financial instruments"],"ans":1,"exp":"Under Sec. 121, dividends and equity shares in the net income of subsidiaries are taxed at 0% GRT. Lending income is 5% or 1% depending on remaining maturity, while royalties, rentals and other gross income items and net trading gains are 7%.","notes":["0% GRT: dividends and equity shares in net income of subsidiaries.","5%/1% GRT: interest, commissions, discounts and financial leasing income (5 years or less / over 5 years remaining maturity).","7% GRT: rentals, royalties, other income, net trading gains."],"upd":"","key":""},{"id":"Q04-17","quiz":4,"num":17,"sec":"5.2","q":"The tax on life insurance premiums based upon the total premiums collected in the Philippines, whether such premiums are paid in money, notes, credits or any substitute for money, is:","opts":["12%.","10%.","7%.","2%."],"ans":3,"exp":"Sec. 123, as amended by RA 10001, imposes a 2% tax on total premiums collected by persons doing life insurance business in the Philippines. Nonlife insurance premiums are subject to VAT instead.","notes":["Life insurance premium tax: 2% of total premiums collected.","Excluded: premiums refunded within 6 months after issuance for rejected risks, reinsurance premiums, and premiums on life insurance of nonresidents abroad; purely cooperative companies are exempt.","Nonlife insurance premiums: 12% VAT."],"upd":"","key":""},{"id":"Q04-18","quiz":4,"num":18,"sec":"5.2","q":"Every fire, marine or miscellaneous insurance agent authorized under the Insurance Code to procure policies of insurance as he may have previously been legally authorized to transact on risks located in the Philippines for companies not authorized to transact business in the Philippines shall pay a tax equal to:","opts":["12% of the total premiums collected.","10% of the total premiums collected.","4% of the total premiums collected.","None of the choices."],"ans":2,"exp":"Sec. 124(A) imposes a 4% tax on premiums collected by agents of foreign insurance companies not authorized to transact business in the Philippines. This is different from Sec. 124(B), where owners of property who insure directly with such foreign insurers pay 5%.","notes":["Agents of unauthorized foreign insurers: 4% of premiums (Sec. 124(A)).","Owners insuring directly with foreign insurers not authorized in the Philippines: 5% (Sec. 124(B)).","Reinsurance premiums are excluded."],"upd":"","key":""},{"id":"Q04-19","quiz":4,"num":19,"sec":"5.2","q":"Who shall be liable to the amusement taxes under Section 125?","opts":["Patrons of amusement places","Lessors of amusement places","Proprietors, lessees, or operators of amusement places","None of the choices"],"ans":2,"exp":"Sec. 125 imposes the amusement tax on the gross receipts of the proprietor, lessee or operator of cockpits, cabarets, night or day clubs, boxing exhibitions, professional basketball games, jai alai and racetracks. Patrons only bear the cost through admission or other charges, and a mere lessor of the premises is not the operator.","notes":["Amusement tax rates: cockpits, cabarets, night/day clubs, jai alai, racetracks 18%; boxing 10%; professional basketball 15%.","Gross receipts include all receipts of the operator from the amusement place (admission, food and drink, rentals), excluding the amusement tax itself.","Other amusements (cinemas, concerts) are under LGU amusement tax, not Sec. 125."],"upd":"","key":""},{"id":"Q04-20","quiz":4,"num":20,"sec":"5.2","q":"First statement: All boxing exhibitions held in the Philippines shall be subject to amusement tax.\nSecond statement: Admission charges to amusement places are required for the imposition of amusement tax.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":1,"exp":"The first statement is incorrect because Sec. 125 exempts boxing exhibitions for world or oriental championships in any division if at least one contender is a Filipino citizen and the exhibition is promoted by a Filipino citizen or a corporation at least 60% Filipino-owned. The second is incorrect because the tax is on the operator's gross receipts from the amusement place, whether or not an admission fee is charged (e.g., receipts from food, drinks and stall rentals).","notes":["Boxing exhibitions: 10%, but world/oriental championship with a Filipino contender and Filipino promoter is exempt.","Tax base: gross receipts of the operator, not limited to admission charges.","Professional basketball: 15%; cockpits, cabarets, clubs, jai alai, racetracks: 18%."],"upd":"","key":""},{"id":"Q04-22","quiz":4,"num":22,"sec":"5.2","q":"When are the amusement taxes under Section 125 payable?","opts":["Thirty (30) days after the end of the month","Twenty (20) days after the end of the month","Twenty (20) days after the end of the quarter","Five (5) days after the end of the quarter"],"ans":2,"exp":"Sec. 125 requires the amusement tax to be paid within 20 days after the end of each quarter. The monthly deadlines in a and b and the 5-day deadline in d are not the Sec. 125 rule.","notes":["Sec. 125 amusement tax: paid within 20 days after the end of each quarter.","Quarterly percentage tax return (2551Q) under EOPT: 25 days after the end of the quarter.","The operator (proprietor, lessee or operator) is liable."],"upd":"EOPT: the quarterly percentage tax return (BIR Form 2551Q) is generally due within 25 days after the end of the quarter (Sec. 128), while Secs. 120 and 125 still say 20 days after the end of the quarter; know both.","key":""},{"id":"Q04-23","quiz":4,"num":23,"sec":"5.2","q":"Who of the following is NOT subject to tax on winnings under Section 126?","opts":["Persons who win in horse races","Winners from double, forecast/quinella and trifecta bets","Winners in cockfighting","Owners of winning race horses"],"ans":2,"exp":"Sec. 126 covers only horse race winnings: 10% on winnings of bettors, 4% on double, forecast/quinella and trifecta winnings, and 10% on prizes of owners of winning race horses. Cockfighting winnings are not covered by Sec. 126.","notes":["Horse race winnings: 10%; double, forecast/quinella, trifecta: 4%; owners of winning race horses: 10% of prizes.","Tax base for bettors: winnings less the cost of the ticket.","Operators withhold the tax."],"upd":"","key":""},{"id":"Q04-24","quiz":4,"num":24,"sec":"5.2","q":"When is the tax on horse race winnings under Section 126 payable?","opts":["Thirty (30) days after the end of the month","Twenty (20) days after the end of the month","Twenty (20) days from the date the tax was deducted and withheld","Five (5) days after the end of the quarter"],"ans":2,"exp":"Under Sec. 126, the operator of the race track deducts and withholds the tax on winnings and pays it within 20 days from the date the tax was deducted and withheld. The other choices are not the Sec. 126 rule.","notes":["Sec. 126 tax is withheld by the operator of the race track.","Remittance: within 20 days from the date of withholding.","Rates: 10% general winnings; 4% double, forecast/quinella, trifecta."],"upd":"","key":""},{"id":"Q04-25","quiz":4,"num":25,"sec":"5.2","q":"Shares of stock held as investment listed and sold through the local stock exchange shall be subject to:","opts":["1/10 of 1% (0.1%) stock transaction tax based on gross selling price or gross value in money","12% VAT based on gross income.","capital gains tax of 5% on first P100,000 capital gain; 10% on excess of P100,000.","4%; 2%; 1% percentage tax based on gross selling price or gross value in money."],"ans":0,"exp":"Sales of listed shares through the local stock exchange by non-dealers are subject to the stock transaction tax under Sec. 127(A), now 1/10 of 1% of the gross selling price, in lieu of capital gains tax. VAT on gross income (b) applies to dealers in securities, the 5%/10% CGT (c) is the old rule for unlisted shares (now 15%), and the 4%/2%/1% IPO tax (d) was repealed by CMEPA.","notes":["STT: 0.1% of gross selling price on listed shares sold through the exchange (CMEPA).","Unlisted shares: 15% capital gains tax on net gain (CMEPA).","IPO tax (4%/2%/1%) repealed by CMEPA."],"upd":"CMEPA: reduced the stock transaction tax from 6/10 of 1% (the original choice a) to 1/10 of 1% effective July 1, 2025.","key":""},{"id":"Q04-26","quiz":4,"num":26,"sec":"5.2","q":"Who shall be liable to the 1/10 of 1% stock transaction tax on sale, barter or exchange of shares of stock listed and traded through the local stock exchange?","opts":["Stockbroker","Seller or transferor","Buyer or transferee","Dealer in securities"],"ans":1,"exp":"The stock transaction tax under Sec. 127(A) is imposed on the seller or transferor of the listed shares. The stockbroker only collects the tax and remits it, and the buyer is not liable.","notes":["STT taxpayer: seller or transferor; stockbroker is the collecting agent.","Rate: 0.1% of gross selling price (CMEPA).","Dealers in securities are subject to VAT on gross income, not STT, for shares held as inventory."],"upd":"CMEPA: the stock transaction tax was reduced from 6/10 of 1% (the original stem) to 1/10 of 1% effective July 1, 2025.","key":""},{"id":"Q04-27","quiz":4,"num":27,"sec":"5.2","q":"It shall be the duty of every stockbroker who effected the sale subject to the tax imposed under Section 127(A) to collect the tax and remit the same within:","opts":["twenty (20) days after the end of the quarter.","ten (10) working days after the end of the month.","five (5) days from the d
