l cover the tax consequence."],"ans":1,"exp":"Transferring the properties to a corporation in exchange for its shares, where he gains control (at least 51% of the voting stock, alone or with up to four others), is a tax-free exchange under Sec. 40(C)(2), so no gain is recognized on the properties. He then transfers only the shares to his son, a single transfer that can be spread over several years to use the P250,000 annual donor's tax exemption, instead of taxable transfers of each property. Selling (A) triggers capital gains or income tax and DST, and a sale below fair market value is a deemed gift (Sec. 100); C requires disposing of the properties first to fund the insurance, and D only pays the tax without reducing it.","notes":["Sec. 40(C)(2): property for shares with control (51% by up to 5 transferors) = no gain or loss recognized.","Donor's tax: 6% of net gifts in excess of P250,000 per calendar year.","Sale for less than adequate consideration: the difference is a deemed gift (Sec. 100), except bona fide sales at arm's length.","Life insurance proceeds are excluded from the gross estate only if the beneficiary is designated as irrevocable (Sec. 85(E))."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-33","quiz":99,"num":33,"sec":"3.7","q":"When will a self-employed individual on the calendar year file his 1st quarter income tax return?","opts":["May 15 of the current year","May 31 of the current year","July 15 of the current year","July 30 of the current year"],"ans":0,"exp":"Under Sec. 74(A), as amended by TRAIN, individuals earning business or professional income file quarterly returns (BIR Form 1701Q) on or before May 15, August 15 and November 15 of the current year, and the final adjustment return on or before April 15 of the following year. The first quarter return is therefore due May 15.","notes":["1701Q: May 15 (Q1), August 15 (Q2), November 15 (Q3).","Annual ITR (1701/1701A): April 15 of the following year.","Corporations: quarterly returns within 60 days after the close of each quarter."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-34","quiz":99,"num":34,"sec":"3.1-SRC","q":"In 2024, Caruso, a resident Filipino citizen, received dividend income from a U.S.-based corporation which owns a chain of Filipino restaurants in the West Coast, U.S.A. The dividend remitted to Caruso is subject to U.S. withholding tax applicable to nonresident aliens like Caruso. The dividend is subject to:","opts":["Final tax","Net income tax","Capital gains tax","Exempt from tax"],"ans":1,"exp":"A resident citizen is taxed on income from all sources within and without the Philippines. The 10% final tax on dividends applies only to cash or property dividends from domestic corporations (and certain entities under Sec. 24(B)(2)); dividends from a foreign corporation earning its income abroad are foreign-source income included in the ITR and taxed at the graduated (net income) rates. The U.S. tax withheld may be claimed as a foreign tax credit or deduction (Sec. 34(C)).","notes":["Resident citizens: taxable on worldwide income.","Dividends from domestic corporations to individuals: 10% final tax.","Foreign dividends of individuals: graduated rates, with foreign tax credit.","The CREATE foreign-dividend exemption (Sec. 27(D)(7)) applies only to domestic corporations meeting the reinvestment conditions."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-35","quiz":99,"num":35,"sec":"3.9","q":"Jose was employed by Timberland Inc. Within how many days must Jose obtain a Taxpayer Identification Number from the BIR?","opts":["1st day of employment","10th day of employment","1st month of employment","1st year of employment"],"ans":1,"exp":"Under the BIR registration rules, an individual earning purely compensation income must register and secure a TIN (BIR Form 1902, usually processed by the employer) within 10 days from the date of employment. The employer needs the TIN to report the employee's compensation and withholding tax.","notes":["Employees: register within 10 days from date of employment (BIR Form 1902).","Self-employed and businesses: register on or before commencement of business (BIR Form 1901).","One TIN per taxpayer; multiple TINs are penalized."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-36","quiz":99,"num":36,"sec":"3.1-IND","q":"Coco Martin, an actor, owns 5,000 shares of JANAH Co., Inc., a domestic corporation. During the taxable year, he received from JANAH 1,000 shares of JINAH Co. with a par value of P100 per share, as dividends. At the date of declaration, the FMV of the JINAH shares was P1,000 per share, but when he received the dividend, the FMV had decreased to P800 per share. The dividend is:","opts":["Subject to final tax","Exempt from income tax","Part of taxable income in the ITR","A stock dividend"],"ans":0,"exp":"Shares of ANOTHER corporation distributed as dividends are property dividends, not stock dividends. Cash or property dividends received by a resident citizen from a domestic corporation are subject to a 10% final tax (Sec. 24(B)(2)), so they are not reported in the ITR. A stock dividend (D) refers to the declaring corporation's own shares, which is generally not taxable.","notes":["Dividends from domestic corporations to resident/nonresident citizens and resident aliens: 10% final tax.","Property dividend = shares or property of another entity; stock dividend = the issuer's own shares.","Property dividends are valued at fair market value."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-38","quiz":99,"num":38,"sec":"3.1-CG","q":"Albert Martinez, a resident citizen, is a 30% partner in a general professional partnership organized in 2020. In 2026 the partnership was dissolved, and Albert received P3,600,000 upon the liquidation of his partnership interest, realizing a gain over his basis. What is the tax consequence of the gain recognized by Albert?","opts":["Subject to the CGT of 15%","Exempt from income tax","Included in the computation of net capital gains, to be included as other income in Albert's ITR.","Included as his share in the net income of a general professional partnership in Albert's ITR."],"ans":2,"exp":"A partner's interest in a partnership is a capital asset, and the amount received on liquidation in excess of his basis (capital contribution plus share in undistributed income) is a capital gain. It is not a sale of shares of stock, so the 15% final CGT does not apply; it goes into net capital gain, with only 50% recognized if held more than 12 months (Sec. 39(B)), and is reported as other income in the ITR subject to graduated rates. It is not a share in GPP net income, which refers to his distributive share of the partnership's profits.","notes":["Gain on liquidation of a partnership interest: ordinary capital gain in the ITR, not final CGT.","Holding period rule (individuals only): 100% if held 12 months or less, 50% if more than 12 months.","15% final CGT applies to shares of domestic corporations not traded in the stock exchange."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-41","quiz":99,"num":41,"sec":"1.A","q":"Which of the following statements is wrong?","opts":["The power of taxation may be exercised by the government, its political subdivisions and public utilities.","The money contributed as tax becomes part of the public funds.","The power of the State to tax is subject to constitutional limitations.","Generally, there is no limit on the amount of tax that may be imposed."],"ans":0,"exp":"Taxation may be exercised only by the government and its political subdivisions (LGUs, by constitutional grant); public utilities cannot tax. Public utilities may, however, be delegated the power of eminent domain. The other statements are correct: taxes become public funds, the power is subject to constitutional limits, and generally there is no limit on the amount of tax.","notes":["Taxation: exercised only by the government or its political subdivisions.","Eminent domain: may be delegated to public utilities and private entities for public use.","Police power: exercised only by the government."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-51","quiz":99,"num":51,"sec":"3.3","q":"Statement 1: Beginning 2024, a business expense is still allowed as a deduction even if the corresponding creditable withholding tax has not been withheld and remitted to the BIR.\nStatement 2: OSD cannot be disallowed due to non-withholding of the expanded or creditable withholding tax pursuant to Section 34(K) of the Tax Code.","opts":["Both are true.","Both are false.","Statement 1 is true. Statement 2 is false.","Statement 1 is false. Statement 2 is true."],"ans":0,"exp":"The EOPT Act removed the Sec. 34(K) rule that made deductibility of an income payment conditional on showing that the required withholding tax was paid, so from 2024 an otherwise deductible expense is allowed even if the CWT was not withheld; the payor remains liable as withholding agent for the tax, surcharge and interest. The OSD is a standard deduction in lieu of itemized deductions and does not depend on substantiation or withholding, so it cannot be disallowed for non-withholding. Both statements are true.","notes":["EOPT: non-withholding is no longer a ground to disallow an expense, but the withholding agent is still liable for the tax and penalties.","OSD: 40% of gross sales/receipts (individuals) or 40% of gross income (corporations); no substantiation needed.","Failure to withhold may still result in penalties under Secs. 251 and 255."],"upd":"EOPT (RA 11976, eff. Jan. 22, 2024): the withholding requirement for deductibility under Sec. 34(K) was removed; before 2024, an expense on which the required tax was not withheld and remitted was disallowed.","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-52","quiz":99,"num":52,"sec":"3.8","q":"Statement 1: All income payments received by an LGU are exempt from withholding tax.\nStatement 2: Payments made to the SSS, GSIS, Pag-IBIG, PhilHealth, and local water districts are not subject to withholding tax.","opts":["Only Statement 1 is true.","Only Statement 2 is true.","Both statements are true.","Both statements are false."],"ans":1,"exp":"Income payments to LGUs are exempt from withholding only when received in the exercise of governmental functions; payments received in the performance of proprietary functions are subject to withholding tax (RMC 89-2024). Payments to the SSS, GSIS, Pag-IBIG (HDMF), PhilHealth and local water districts, which are exempt from income tax, are not subject to withholding. Only the second statement is true.","notes":["LGU income from governmental functions: exempt; from proprietary functions: subject to withholding (RMC 89-2024).","Income-tax-exempt GOCCs: GSIS, SSS, PhilHealth, local water districts; HDMF (Pag-IBIG) exempt under its charter.","Other GOCCs (e.g., PCSO, PAGCOR) are taxable."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-53","quiz":99,"num":53,"sec":"3.8","q":"First Investors, Inc., a domestic corporation, invested its excess funds in money market placements with BDC Bank, a local bank. The interest income on the placements was not subjected to final withholding tax by the bank. The BIR contends that First Investors should have included the interest income in its ITR and assessed it for deficiency income tax. Is First Investors liable?","opts":["First Investors is liable for the deficiency tax in its ITR; otherwise, it would escape tax on its interest income, which is taxable.","First Investors is not liable for any deficiency income tax; it is the payor, BDC, which is mandated by law to withhold the final tax on such passive income and remit it to the BIR.","Both are liable and shall share in the payment of the income tax liability.","None of the above."],"ans":1,"exp":"Interest on money market placements (deposit substitutes) is passive income subject to final withholding tax, which the payor bank is required to withhold and remit. Under the final withholding system, the liability for the tax rests primarily on the withholding agent, and the income is not included in the recipient's ITR; the BIR's remedy is against the payor (CIR v. First Philippine Utilities Corporation, CTA EB Case No. 2500, May 24, 2023).","notes":["Final withholding: tax withheld is the full and final payment; income excluded from the ITR.","Liability for a final tax rests primarily on the withholding agent (payor).","Interest on deposit substitutes and bank deposits: 20% final tax (uniform under CMEPA)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-54","quiz":99,"num":54,"sec":"3.2-GI","q":"Wilfredo, a resident citizen, was employed by WBC TV, a domestic corporation, for 15 years. When he reached the compulsory retirement age of 65, he became entitled to retirement benefits under R.A. No. 7641 since WBC TV did not have a tax-qualified retirement plan. After receiving the benefits, WBC TV continued to employ him for 5 more years, and he finally retired at age 70. What is the tax treatment?","opts":["Both the retirement benefits and the income and benefits received beyond age 65 are subject to income tax and withholding tax.","Both the retirement benefits and the income and benefits received beyond age 65 are exempt from income tax and withholding tax.","Only the retirement benefits are subject to income tax and withholding tax.","Only the income and benefits received beyond age 65 are subject to income tax and withholding tax."],"ans":3,"exp":"Retirement benefits under RA 7641 (Labor Code) received by an employee at least 60 but not more than 65 years old with at least 5 years of service are excluded from gross income (Sec. 32(B)(6)(a)). Once retired, compensation and benefits received upon re-employment beyond age 65 are ordinary taxable compensation subject to income tax and withholding (RMC 13-2024). Hence only the post-65 income is taxable.","notes":["RA 7641 exemption: age 60 to 65, at least 5 years of service, employer has no retirement plan.","RA 4917 exemption: reasonable private benefit plan, at least 10 years of service, at least 50 years old, availed once.","Post-retirement re-employment pay is taxable compensation."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-57","quiz":99,"num":57,"sec":"3.2-FBT","q":"Mariotte Hotel Corporation operates a hotel in Taguig. Single rooms cost P8,500 per night and suite rooms P15,000 per night. Pat, the manager, was asked by the CEO to occupy one of the suite rooms to avoid traffic and to immediately respond to any problems that may arise in the hotel. Pat, single, gladly accepted since he could also entertain friends in the suite after work. Compute the daily FBT to be paid by Mariotte Hotel Corporation.","opts":["P4,577","P8,077","P4,038","None of the above"],"ans":3,"exp":"Housing inside or adjacent to (within 50 meters of) the perimeter of the business premises, furnished for the convenience of the employer, is not a taxable fringe benefit (RR 3-98). Pat occupies the suite so that he can respond immediately to problems in the hotel, which is primarily for the employer's benefit; his incidental personal use does not change this. No FBT is due, so none of the computed amounts is correct.","notes":["Not subject to FBT: benefits required by the nature of or necessary to the business, or for the convenience of the employer.","Housing inside or within 50 meters of the business premises: not a taxable fringe benefit.","Taxable housing: MV is 50% of the rent (leased) or 50% of 5% of the higher of FMV or zonal value (employer-owned)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-70","quiz":99,"num":70,"sec":"3.2-GI","q":"The following are requirements for retirement benefits under R.A. No. 7641 to be exempt from income tax, EXCEPT:","opts":["There must be a reasonable private benefit plan approved by the BIR.","The employee must be at least 60 but not more than 65 years old.","The retiree must have served the same employer for at least 5 years.","None of the above."],"ans":0,"exp":"RA 7641 retirement pay applies precisely when there is no retirement plan (or the plan gives less than the law), so a BIR-approved reasonable private benefit plan is not a requisite; that requirement belongs to RA 4917 retirement benefits. The RA 7641 exemption requires that the retiree be at least 60 but not more than 65 years old and have served at least 5 years (Sec. 32(B)(6)(a)). Choices B and C are genuine requisites.","notes":["RA 7641: age 60 to 65, at least 5 years of service.","RA 4917: BIR-approved plan, at least 10 years of service, at least 50 years old, availed only once.","Separation pay due to death, sickness, disability or causes beyond the employee's control is also excluded."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB98-F-01","quiz":98,"num":1,"sec":"4.1","q":"The gift tax paid on a donation mortis causa, if any:","opts":["Exempts the property from estate tax.","Has no effect since the gift will still be subject to another gift tax.","Shall form as a tax credit to be deducted from the estate tax due.","Is invalid; however, it may be refunded."],"ans":3,"exp":"A donation mortis causa takes effect only upon the donor's death, so it is a testamentary transfer included in the gross estate (Sec. 85(B)) and subject to estate tax, not donor's tax. Any donor's tax paid on it was not due, so it is an erroneous payment that may be recovered through a claim for refund within 2 years from payment. It does not exempt the property from estate tax, and the NIRC gives no credit of donor's tax against estate tax.","notes":["Donation inter vivos: donor's tax. Donation mortis causa: estate tax (part of the gross estate).","Transfers in contemplation of death, revocable transfers and those with retained life interest are also included in the gross estate.","Erroneously paid tax: written claim and suit within 2 years from payment (Secs. 204(C) and 229)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-02","quiz":98,"num":2,"sec":"4.1","q":"Which shall not form part of the gross estate of a decedent?","opts":["Intangible personal property in the Philippines of a nonresident alien decedent whose country has no reciprocity law.","Revocable transfer.","Transfer under a special power of appointment.","Life insurance proceeds where the executor is the beneficiary and the designation is irrevocable."],"ans":2,"exp":"Only property passing under a GENERAL power of appointment is included in the gross estate (Sec. 85(D)); property passing under a special (limited) power is excluded. Intangibles of a nonresident alien are excluded only if reciprocity exists, so without reciprocity they are included. Revocable transfers are included (Sec. 85(C)), and life insurance payable to the estate, executor or administrator is included whether the designation is revocable or irrevocable (Sec. 85(E)).","notes":["General power of appointment: included. Special power: excluded.","Life insurance to estate/executor/administrator: always included; to a third-party beneficiary: included only if revocable.","Reciprocity exempts a nonresident alien's Philippine intangibles (Sec. 104)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-03","quiz":98,"num":3,"sec":"4.1","q":"All of the following are considered intangible personal properties situated in the Philippines, except:","opts":["Franchise which must be exercised in the Philippines.","Shares, obligations or bonds issued by any corporation or sociedad anonima organized or constituted in the Philippines in accordance with its laws.","Shares, obligations or bonds issued by any foreign corporation doing business in the Philippines.","Shares or rights in any partnership, business or industry established in the Philippines."],"ans":2,"exp":"Under Sec. 104, shares of a foreign corporation have Philippine situs only if at least 85% of its business is located in the Philippines, or if the shares have acquired a business situs here (used in the furtherance of its business in the Philippines). Merely doing business in the Philippines is not enough. Choices a, b and d are all listed in Sec. 104 as intangibles with Philippine situs.","notes":["Foreign corporation shares: Philippine situs only if 85% of business is in the Philippines or business situs acquired.","Franchises exercisable in the Philippines and shares of domestic corporations: Philippine situs.","Reciprocity may exempt a nonresident alien's Philippine intangibles."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-04","quiz":98,"num":4,"sec":"4.2","q":"The Congregation of the Mary Immaculate donated a land and a dormitory building located along Espana Street in favor of the Sisters of the Holy Cross, a group of nuns operating a free clinic and a high school teaching basic spiritual values. Is the donation subject to donor's tax?","opts":["Yes, the donation is subject to donor's tax because the donee is a stranger.","Yes, the donation is subject to donor's tax because it failed to mention whether the donee used a maximum of 30% of the amount or property donated for administrative purposes.","No, the donation is not subject to donor's tax because the donee is a non-stock, non-profit organization engaged principally for religious and educational vocation.","No, the donation is exempt from all taxes."],"ans":1,"exp":"Gifts to non-stock, non-profit educational, charitable or religious institutions are exempt only if not more than 30% of the gifts is used by the donee for administration purposes (Sec. 101(A)(3)). Because the facts do not show that this condition is met, the exemption cannot be claimed and the donation remains subject to donor's tax. Choice c is tempting but omits the 30% condition, and choice a is wrong because the stranger distinction was removed by TRAIN.","notes":["Sec. 101(A)(3): exempt if donee is non-stock, non-profit and uses not more than 30% of gifts for administration.","TRAIN removed the stranger rate; all donees are taxed at a flat 6% over P250,000 per calendar year.","The Constitution's exemption of religious property (Art. VI, Sec. 28(3)) covers real property tax, not donor's tax."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-05","quiz":98,"num":5,"sec":"4.1","q":"Remedios, a resident citizen, died on November 10, 2022, leaving three condominium units in Quezon City valued at P5 Million each. Rodolfo, her only heir, filed the estate tax return on March 30, 2023. Because he needed to sell one unit to pay the estate tax, he asked the Commissioner of Internal Revenue to give him one year to pay. The Commissioner approved, provided that the estate tax be computed on the value of the property at the time of payment. Does the Commissioner have the power to extend the payment of estate tax?","opts":["Yes, the Commissioner of Internal Revenue may extend the payment of estate tax for a maximum period of 30 days for meritorious cases.","Yes, the Commissioner of Internal Revenue may extend the payment of tax for 2 years in case of extrajudicial and for 5 years in case of judicial settlement.","No, the Commissioner of Internal Revenue has no power to extend payment of a tax under all conditions.","No, the Commissioner of Internal Revenue has no power to extend payment of a tax, otherwise it will be an encroachment upon exclusive legislative authority."],"ans":1,"exp":"Sec. 91(B) allows the CIR, when payment on the due date would impose undue hardship on the estate or heirs, to extend payment for up to 5 years (judicial settlement) or 2 years (extrajudicial settlement). The 30-day extension in choice a refers to the FILING of the return in meritorious cases (Sec. 90(C)). The CIR's condition is invalid, however: the estate is valued at fair market value at the time of death (Sec. 88), not at the time of payment.","notes":["Filing: within 1 year from death; CIR may extend filing up to 30 days.","Payment extension: up to 5 years (judicial) or 2 years (extrajudicial); no civil penalty but interest applies.","Installment within 2 years from the statutory due date without civil penalty and interest if cash is insufficient.","Valuation: FMV at the time of death."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-06","quiz":98,"num":6,"sec":"4.2","q":"First statement: Renunciation of one's share in the legitime is a taxable gift.\nSecond statement: Gift splitting is a form of tax evasion.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"A general renunciation by an heir (including the surviving spouse) of his share in the hereditary estate is not subject to donor's tax; only a renunciation specifically and categorically made in favor of identified heirs, to the exclusion of other co-heirs, is a taxable gift (RR 12-2018). Gift splitting (spreading gifts over time or among donees to use the exemption) is a legal tax avoidance scheme, not tax evasion. Both statements are therefore incorrect.","notes":["General renunciation of inheritance: not a taxable gift.","Specific renunciation in favor of identified heirs: taxable gift.","Tax avoidance (legal) vs tax evasion (illegal, with intent to defraud)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-07","quiz":98,"num":7,"sec":"4.2","q":"Three of the following are exempt or excluded from the donor's tax. Which is the exception?","opts":["P300,000 cash in the Philippines given by a nonresident alien donor to his legitimate son who is getting married in the Philippines to a Filipina.","P250,000 cash given by a resident alien donor to his legitimate son who is getting married in the Philippines (his only gift for the year).","Donation of a condominium in Hong Kong to a Filipina by a British national residing in London.","P1,000,000 donation to the International Rice Research Institute."],"ans":0,"exp":"Donor's tax is 6% of total net gifts in excess of P250,000 per calendar year (Sec. 99(A)), and the dowry exemption was removed by TRAIN. A nonresident alien is taxed only on gifts of property situated in the Philippines, so P300,000 of Philippine cash exceeds the P250,000 exemption by P50,000 and is taxable. The P250,000 gift in choice b falls entirely within the exemption, the Hong Kong condominium of a nonresident alien is foreign-situs property, and gifts to IRRI are exempt under its charter.","notes":["First P250,000 of total net gifts per calendar year: exempt, for every donor.","Nonresident alien donor: taxed only on Philippine-situs property.","TRAIN removed the P10,000 dowry exemption and the stranger rate."],"upd":"","key":"Source key says B. Under TRAIN a P250,000 gift is fully covered by the P250,000 annual exemption, so it is not the taxable one; choice a (and choice b) were minimally updated: a now states the cash is in the Philippines and b that it is the donor's only gift for the year (originally 'P300,000 cash given by a nonresident alien donor...' and 'P250,000 cash given by a resident alien donor...').","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-08","quiz":98,"num":8,"sec":"4.2","q":"Donor's tax as distinguished from estate tax.\nFirst distinction: The rates for donor's tax are lower than those for estate tax.\nSecond distinction: In donor's tax, the exemption is P250,000 while in estate tax there is none.","opts":["Both distinctions are correct.","Both distinctions are wrong.","First distinction is correct, the second is wrong.","First distinction is wrong, the second is correct."],"ans":3,"exp":"Since TRAIN, both estate tax and donor's tax are imposed at a flat 6%, so the first distinction is wrong. Donor's tax applies only to total net gifts in excess of P250,000 per calendar year, while estate tax has no exempt bracket; the estate instead claims deductions such as the P5,000,000 standard deduction. The second distinction is correct.","notes":["Estate tax and donor's tax: both 6% flat (TRAIN).","Donor's tax: first P250,000 of net gifts per year exempt.","Estate tax: no exempt bracket, but a P5,000,000 standard deduction (P500,000 for nonresident aliens)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-09","quiz":98,"num":9,"sec":"4.2","q":"First statement: Any contribution in cash or in kind to any candidate, political party or coalition of parties for campaign purposes shall be governed by the Election Code and not the Tax Code.\nSecond statement: Partial renunciation of legitime or specific renunciation of properties of the estate is exempt from donor's tax.","opts":["True; False","True; True","False; True","False; False"],"ans":0,"exp":"Sec. 99(C) provides that campaign contributions to candidates, political parties or coalitions are governed by the Election Code, so the first statement is true. Only a general renunciation of an inheritance is not subject to donor's tax; a renunciation specifically and categorically made in favor of identified heirs to the exclusion of other co-heirs is a taxable donation (RR 12-2018), so the second statement is false.","notes":["Campaign contributions: governed by the Election Code (Sec. 99(C)).","General renunciation: not a gift. Specific renunciation in favor of identified heirs: taxable gift.","Sale for less than adequate consideration: the excess of FMV over the price is a deemed gift (Sec. 100), except in a bona fide, arm's length, ordinary-course transaction."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-10","quiz":98,"num":10,"sec":"5.1","q":"Royal Mining is a VAT-registered domestic mining entity. One of its products is gold sold to the Bangko Sentral ng Pilipinas. It filed a claim for tax refund on the ground that under Section 106 of the NIRC, sales of precious metals to the BSP are considered export sales subject to zero-rated VAT. Is Royal Mining's claim for refund meritorious?","opts":["Yes, sale of precious gold to Bangko Sentral ng Pilipinas is a deemed zero-rated transaction.","Yes, sale of precious gold to Bangko Sentral ng Pilipinas is deemed an export sale; hence, input VAT thereon may be credited or refunded.","No, sale of gold to Bangko Sentral ng Pilipinas is exempt; hence, input VAT is deemed expense and cannot be refunded.","No, sale of gold to Bangko Sentral ng Pilipinas is VATable; hence, input VAT is creditable, not refundable."],"ans":2,"exp":"TRAIN removed the sale of gold to the BSP from the list of export sales in Sec. 106(A)(2) and made it VAT-exempt under Sec. 109(1). Since the sale is exempt, no input VAT refund is available: only zero-rated or effectively zero-rated sales give rise to a refund under Sec. 112, and input VAT on exempt sales becomes part of cost or expense.","notes":["Sale of gold to BSP: VAT-exempt (no longer zero-rated) since TRAIN.","Refund of input VAT (Sec. 112) is only for zero-rated or effectively zero-rated sales.","Input VAT attributable to exempt sales is charged to cost or expense."],"upd":"TRAIN: sale of gold to the BSP moved from zero-rated export sales to VAT-exempt transactions.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-11","quiz":98,"num":11,"sec":"5.2","q":"Congress enacts a law imposing a 5% tax on gross receipts of common carriers. The law does not define the term \"gross receipts.\" Express Transport, Inc., a bus company plying the Manila-Baguio route, has time deposits with ABC Bank. In 2005, it earned P1 million interest, after deducting the 20% final withholding tax. The BIR wants to collect the 5% gross receipts tax on the interest income without deducting the 20% final withholding tax. Is the BIR correct?","opts":["Yes, gross receipts mean cash collected, whether actually or constructively, without any deductions.","Yes, gross receipts mean all cash collections actually received without any deductions.","No, gross receipts mean actual receipts after deducting withholding tax.","No, gross receipts mean actual receipts derived from business."],"ans":3,"exp":"A gross receipts tax on common carriers reaches only receipts derived from the business of transporting passengers or goods. Interest on time deposits is passive income already subjected to final tax and is not derived from the carrier's business, so it is not part of the tax base at all. Choices a and b state the bank rule (gross receipts include the final tax withheld), which applies to banks whose interest income is business income.","notes":["Common carrier's tax (Sec. 117): 3% of quarterly gross receipts from transport of passengers.","Passive income subjected to final tax is not part of a carrier's business gross receipts.","For banks, gross receipts include the final tax withheld on interest (CIR v. Solidbank)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-12","quiz":98,"num":12,"sec":"5.1","q":"Lily's Fashion, Inc. is a garment manufacturer located and registered as a Subic Bay Freeport Enterprise under Republic Act No. 7227 and a non-VAT taxpayer. As such, it is exempt from payment of all local and national internal revenue taxes. It purchased various supplies and materials necessary in its manufacturing business, and the suppliers shifted to it the 12% VAT on the purchases amounting to P500,000. What is the proper remedy of Lily's Fashion, Inc.?","opts":["Lily's Fashion, Inc. may use the P500,000 as tax credit.","Lily's Fashion, Inc. may ask for a refund of the P500,000.","Lily's Fashion, Inc. may convert the P500,000 into tax warrants.","Lily's Fashion, Inc. may charge it to cost or expense."],"ans":1,"exp":"Sales of goods to a freeport or ecozone enterprise are effectively zero-rated, so the suppliers should not have passed on VAT. Because Lily's Fashion is VAT-exempt and has no output tax, it cannot use the amount as input tax credit; its remedy is to seek a refund of the VAT erroneously passed on, recovered from the suppliers, who as statutory taxpayers are the proper parties to claim from the BIR (Contex Corp. v. CIR; Coral Bay Nickel v. CIR).","notes":["Sales to freeport/ecozone registered export enterprises: effectively zero-rated.","A VAT-exempt buyer has no output tax, so it cannot claim input tax credit.","CREATE MORE: zero-rating covers local purchases directly attributable to the registered project or activity, backed by the IPA's VAT zero-rating certificate."],"upd":"CREATE MORE: local purchases of registered export enterprises are zero-rated if directly attributable to the registered project or activity (including those incidental to and reasonably necessary for it), with the IPA's VAT zero-rating certificate as the primary document.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-13","quiz":98,"num":13,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Medical services such as dental and veterinary services rendered by professionals.","Legal services.","Services arising from employee-employer relationship.","Services rendered by domestic air transport companies."],"ans":2,"exp":"Services rendered under an employer-employee relationship are not rendered in the course of trade or business and are VAT-exempt (Sec. 109(1)(H)). Medical, dental and veterinary services are exempt only when not rendered by professionals, so professional services are VATable. Legal services and domestic air transport of passengers and cargo are also subject to VAT.","notes":["Compensation income from employment: not subject to VAT.","Medical, dental, hospital and veterinary services: exempt, EXCEPT those rendered by professionals.","International air/sea carriers: VAT-exempt; domestic carriers of passengers by air/sea: 12% VAT."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-14","quiz":98,"num":14,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Sale of non-food agricultural products in their original state.","Sale of non-food marine and forest products in their original state.","Sale of cotton and cotton seeds.","Sale of agricultural food products in their original state."],"ans":3,"exp":"Sec. 109(1)(A) exempts the sale or importation of agricultural and marine FOOD products in their original state, livestock and poultry used as food, and breeding stock. Non-food agricultural, marine and forest products are VATable, and the old exemption of cotton and cotton seeds is no longer in the law.","notes":["Agricultural and marine food products in original state: VAT-exempt.","Simple processes (freezing, drying, salting, broiling, roasting, smoking, stripping) keep the original state.","Non-food agricultural products (e.g., rubber, cotton): VATable."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-15","quiz":98,"num":15,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Sale of books, newspapers and magazines.","Sale of works of art.","Sale of literary works.","Sale of musical compositions."],"ans":0,"exp":"Sec. 109(1)(R) exempts the sale, importation, printing or publication of books and any newspaper, magazine, journal, review or bulletin (and similar educational reading material covered by the UNESCO Florence Agreement), including their digital or electronic format, provided they are not devoted principally to paid advertisements. Sales of works of art, literary works and musical compositions are subject to VAT.","notes":["Books, newspapers, magazines (print or digital): VAT-exempt.","Not exempt if devoted principally to the publication of paid advertisements.","Original works of art, literary works and musical compositions: VATable."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-16","quiz":98,"num":16,"sec":"5.1","q":"Which of the following transactions is subject to value-added tax?","opts":["Services subject to other percentage tax.","Educational services duly approved by the Department of Education, CHED and TESDA or those operated by the Government.","Sale of coal and natural gas.","Lending activities by credit cooperatives."],"ans":2,"exp":"The VAT exemption for coal and natural gas was removed by RA 9337, so their sale is subject to 12% VAT. Services subject to other percentage taxes, accredited educational services and lending by duly registered credit cooperatives are all VAT-exempt under Sec. 109(1).","notes":["Coal, natural gas and petroleum products: VATable (RA 9337).","Transactions subject to percentage tax under Secs. 116 to 126: VAT-exempt.","Private educational institutions duly accredited by DepEd, CHED or TESDA: VAT-exempt."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-17","quiz":98,"num":17,"sec":"5.1","q":"Which of the following transactions is subject to value-added tax?","opts":["Sale of petroleum products.","Sale of fertilizers and seeds, including their ingredients.","Sale by agricultural contract growers.","Sale of goods, services or importation, where annual gross sales do not exceed P3,000,000."],"ans":0,"exp":"Sale of petroleum products is subject to 12% VAT (and excise tax). Fertilizers, seeds, seedlings, fingerlings and feeds including their ingredients (Sec. 109(1)(B)), services of agricultural contract growers (Sec. 109(1)(F)), and sales of non-VAT-registered persons with annual gross sales not exceeding P3,000,000 are VAT-exempt.","notes":["Petroleum products: VAT plus excise tax.","VAT threshold: P3,000,000 annual gross sales.","Agricultural contract growers and milling of palay, corn and sugar cane: VAT-exempt."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-18","quiz":98,"num":18,"sec":"5.1","q":"Which of the following transactions is subject to zero-rated value-added tax?","opts":["Services rendered to persons engaged in international shipping or air transport operations.","Services rendered by banks and non-bank financial intermediaries.","Generation, transmission and distribution of electricity.","Services rendered by professionals such as CPAs, physicians and lawyers."],"ans":0,"exp":"Services rendered to persons engaged in international shipping or international air transport operations, including leases of property for their use, are zero-rated under Sec. 108(B)(4), provided they are exclusively for those operations. Banks and NBFIs pay gross receipts tax and are VAT-exempt; electricity generation, transmission and distribution are generally subject to 12% VAT (only generation from renewable sources is zero-rated); and professional services are subject to 12% VAT.","notes":["Zero-rated services include those to international shipping/air transport, export services paid in acceptable foreign currency, and power from renewable sources.","Banks and NBFIs: gross receipts tax, not VAT.","Professionals with gross receipts over P3,000,000 or VAT-registered: 12% VAT."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-19","quiz":98,"num":19,"sec":"5.1","q":"Which of the following is not exempt from VAT?","opts":["Services rendered by schools duly accredited by the Philippine Government.","Sale of digital or electronic books as well as journals covered by UNESCO.","Sale of medicines for cancer, mental illness, tuberculosis and kidney disease.","Sale of capital equipment for COVID response."],"ans":3,"exp":"CREATE exempted the sale or importation of capital equipment, spare parts and raw materials for the production of COVID-19 personal protective equipment only from January 1, 2021 to December 31, 2023, so that exemption has lapsed and such sales are now VATable. Accredited educational services, books and journals in digital or electronic form, and prescription medicines for cancer, mental illness, tuberculosis and kidney disease remain VAT-exempt.","notes":["CREATE's COVID-19 exemptions (PPE capital equipment, COVID drugs, vaccines and devices): January 1, 2021 to December 31, 2023 only.","Prescription drugs for diabetes, high cholesterol, hypertension, cancer, mental illness, tuberculosis and kidney diseases: VAT-exempt.","Books and journals, including digital or electronic format: VAT-exempt (as amended by CREATE)."],"upd":"CREATE: the VAT exemption for COVID-19 capital equipment applied only until December 31, 2023.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-20","quiz":98,"num":20,"sec":"5.1","q":"Which of the following transactions is subject to zero-rated value-added tax?","opts":["Services by regional or area headquarters of multinational corporations.","Sale to Philippine Economic Zone Authority.","Sales by non-agricultural, non-electric, non-credit cooperatives.","Importation of professional instruments and implements by settlers in the Philippines."],"ans":1,"exp":"Choice b refers to sales to PEZA-registered (ecozone) export enterprises, which are effectively zero-rated under Secs. 106(A)(2) and 108(B) because ecozones are treated as separate customs territory. Services of regional or area headquarters that do not earn income in the Philippines, sales by qualified non-agricultural, non-electric and non-credit cooperatives, and importation of professional instruments by settlers are VAT-exempt, not zero-rated.","notes":["Sales to ecozone/freeport registered export enterprises: effectively zero-rated.","CREATE MORE: only purchases directly attributable to the registered project or activity, backed by the IPA's VAT zero-rating certificate.","Exempt transactions give no input VAT refund; zero-rated ones do."],"upd":"CREATE MORE: zero-rating of local purchases by registered export enterprises covers goods and services directly attributable to the registered project or activity (CREATE required them to be directly and exclusively used).","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-21","quiz":98,"num":21,"sec":"5.1","q":"Which of the following businesses is allowed a presumptive input value-added tax?","opts":["Manufacturer of canned goods.","Manufacturer of packed juices.","Manufacturer of packed noodles.","Manufacturer of dried fish."],"ans":2,"exp":"Sec. 111(B) grants a presumptive input tax of 4% of the gross value of purchases of primary agricultural products used as inputs to persons engaged in processing sardines, mackerel and milk, and in manufacturing refined sugar, cooking oil and packed noodle-based instant meals. Canned goods in general, packed juices and dried fish are not in the list.","notes":["Presumptive input tax: 4% of purchases of primary agricultural products used as inputs.","Covered: sardines, mackerel, milk, refined sugar, cooking oil, packed noodle-based instant meals.","Transitional input tax: 2% of beginning inventory or actual VAT paid, whichever is higher."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-22","quiz":98,"num":22,"sec":"5.1","q":"First statement: The term \"goods\" for value-added tax purposes shall mean all tangible and intangible objects which are capable of pecuniary estimation and shall include, but not be limited to, radio, television, satellite transmission and cable television time.\nSecond statement: The term \"export sales\" for VAT purposes shall include, but not be limited to, sale of gold to the Bangko Sentral ng Pilipinas.","opts":["True; False","True; True","False; True","False; False"],"ans":0,"exp":"Sec. 106(A)(1) defines goods to include radio, television, satellite transmission and cable television time, so the first statement is true. TRAIN removed the sale of gold to the BSP from export sales and made it VAT-exempt, so the second statement is false.","notes":["Goods include tangible and intangible objects: real property, IP rights, equipment use rights, radio/TV/satellite/cable time.","Sale of gold to BSP: VAT-exempt since TRAIN (formerly zero-rated).","Export sales remain zero-rated under Sec. 106(A)(2)."],"upd":"TRAIN: sale of gold to the BSP is no longer an export sale; it is VAT-exempt.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-23","quiz":98,"num":23,"sec":"5.1","q":"First statement: Any VAT-registered person whose sales are zero-rated or effectively zero-rated may, within two (2) years after the close of the taxable year when the sales were made, apply for the issuance of a tax credit certificate or refund of creditable input tax due or paid attributable to such sales.\nSecond statement: A claim for VAT refund shall be decided by the BIR within a period of 90 days from submission of the complete supporting documents.","opts":["True; False","True; True","False; True","False; False"],"ans":2,"exp":"Sec. 112(A) reckons the 2-year period from the close of the taxable QUARTER when the zero-rated sales were made, not the taxable year, so the first statement is false. Under Sec. 112(C), as amended by TRAIN and EOPT, the CIR must decide within 90 days from the submission of the invoices and other supporting documents, so the second statement is true.","notes":["VAT refund claim: within 2 years after the close of the taxable QUARTER of the zero-rated sales.","CIR decides within 90 days from submission of complete documents; appeal to CTA within 30 days from denial or lapse of the 90 days.","CREATE MORE: VAT refund claims classified as low, medium or high risk."],"upd":"EOPT and CREATE MORE kept the 90-day period for deciding VAT refunds and introduced risk-based classification of claims.","key":"Source key says B (both true). The first statement is false because Sec. 112(A) counts the 2 years from the close of the taxable quarter, not the taxable year. The second statement was lightly reworded ('from substantiation') to match Sec. 112(C).","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-24","quiz":98,"num":24,"sec":"7","q":"First statement: Excise taxes imposed and based on weight or volume capacity or any other physical unit of measurement shall be referred to as ad valorem tax.\nSecond statement: Excise taxes imposed and based on selling price or other specified value of the goods shall be referred to as specific tax.","opts":["True; False","True; True","False; True","False; False"],"ans":3,"exp":"Sec. 129 is the reverse of both statements: an excise tax based on weight, volume capacity or other physical unit of measurement is a SPECIFIC tax, while one based on selling price or other specified value is an AD VALOREM tax. Both statements are false.","notes":["Specific tax: based on physical units (per liter, per kilo, per pack).","Ad valorem tax: based on value (selling price, net retail price).","Some products carry both (e.g., cigars, automobiles are ad valorem; fuels are specific)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-25","quiz":98,"num":25,"sec":"9","q":"Which corporation may avail of the 5% SCIT?","opts":["Offshore Banking Units.","Regional Operating Headquarters of multinational corporations.","Registered Business Enterprises.","Philippine Amusement and Gaming Corporation."],"ans":2,"exp":"The 5% special corporate income tax on gross income earned, in lieu of all national and local taxes, is an incentive available only to qualified registered business enterprises (export enterprises and, under CREATE MORE, certain highly desirable projects) under Title XIII of the NIRC. CREATE repealed the preferential rates of OBUs and ROHQs, which now pay the regular corporate rates, and PAGCOR is subject to its own franchise and income tax rules.","notes":["SCIT: 5% of gross income earned, in lieu of all national and local taxes (3% national, 2% LGU).","CREATE repealed the 10% ROHQ rate and OBU preferential rates.","RBEs choose SCIT or Enhanced Deductions after the ITH."],"upd":"CREATE MORE: SCIT remains 5% of gross income earned; RBEs under the Enhanced Deductions regime pay 20% RCIT.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-26","quiz":98,"num":26,"sec":"9","q":"How long may a pioneer ecozone enterprise avail of the income tax holiday (ITH) within a metropolitan area?","opts":["4 to 6 years","6 to 9 years","5 to 7 years","8 to 10 years"],"ans":2,"exp":"Under CREATE (retained by CREATE MORE), the ITH of 4 to 7 years depends on the industry tier and location: NCR 4, 5 and 6 years (Tiers I, II, III); metropolitan areas or areas contiguous and adjacent to NCR 5, 6 and 7 years; all other areas 6, 7 and 7 years. An enterprise in a metropolitan area therefore gets 5 to 7 years.","notes":["ITH: 4 to 7 years depending on tier and location.","NCR 4-6; metropolitan/adjacent areas 5-7; other areas 6-7.","CREATE MORE: +3 years ITH for relocation from NCR; +2 years for areas recovering from armed conflict or major disaster."],"upd":"CREATE: the pioneer/non-pioneer classification was replaced by the SIPP tier system; ITH is 4 to 7 years by tier and location.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-27","quiz":98,"num":27,"sec":"3.10","q":"Barangay Micro Business Enterprises are those whose:","opts":["assets, including those arising from loans but exclusive of the land on which the particular business entity's office, plant and equipment are situated, shall not be more than Three Million Pesos (P3,000,000.00).","assets, excluding those arising from loans but exclusive of the land on which the particular business entity's office, plant and equipment are situated, shall not be more than Three Million Pesos (P3,000,000.00).","assets, including those arising from loans but exclusive of the land on which the particular business entity's office, plant and equipment are situated, shall not be more than Five Million Pesos (P5,000,000.00).","assets, excluding those arising from loans but exclusive of the land on which the particular business entity's office, plant and equipment are situated, shall not be more than Five Million Pesos (P5,000,000.00)."],"ans":0,"exp":"RA 9178, Sec. 3(a), defines a BMBE as a business entity whose total assets, INCLUDING those arising from loans but EXCLUSIVE of the land on which its office, plant and equipment are situated, do not exceed P3,000,000. The asset ceiling is P3,000,000, not P5,000,000, and loan-financed assets are counted.","notes":["BMBE total assets: not more than P3,000,000, including assets from loans, excluding land.","BMBEs are exempt from income tax on income from operations.","Register with the Office of the Municipal/City Treasurer (Negosyo Center) to avail of benefits."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-28","quiz":98,"num":28,"sec":"9","q":"Under CREATE MORE, for how many years may Registered Business Enterprises carry over NOLCO (under the Enhanced Deductions regime) and, at the maximum, avail of the SCIT, respectively?","opts":["5 years and 20 years, respectively","3 years and 10 years, respectively","5 years and 27 years, respectively","10 years and 20 years, respectively"],"ans":0,"exp":"Under the Enhanced Deductions regime, NOLCO may be carried over for the next 5 taxable years. CREATE MORE allows the SCIT or ED period to run up to 20 years (for FIRB-approved projects above P15 billion; IPA-approved projects get 10 years) after the 4 to 7-year ITH. The 27 years in choice c is the maximum TOTAL incentive period (7-year ITH plus 20 years), not the SCIT period alone.","notes":["NOLCO under ED: carried over 5 years.","SCIT/ED after ITH: 10 years (IPA-approved) or up to 20 years (FIRB-approved, above P15 billion).","Maximum total incentive period under CREATE MORE: 27 years."],"upd":"CREATE MORE: SCIT/ED period may reach 20 years for FIRB-approved projects (total incentive period up to 27 years); CREATE originally allowed 10 years.","key":"Stem clarified (originally: 'Registered Business Enterprises may credit NOLCO and avail SCIT for the next?') to make clear that 20 years is the maximum SCIT period; source key A kept.","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-29","quiz":98,"num":29,"sec":"3.1-CORP","q":"Statement 1: Domestic corporations may avail of a reduced 20% corporate income tax if their taxable income is not more than 5 million pesos and total net assets are not more than 100 million pesos, excluding land.\nStatement 2: A foreign corporation may avail of the reduced 20% corporate income tax if it is a registered business enterprise under the enhanced deductions regime.","opts":["Both are false.","Both are correct.","Only the 1st statement is correct.","Only the 2nd statement is correct."],"ans":1,"exp":"Under CREATE (Sec. 27(A)), domestic corporations with net taxable income not exceeding P5,000,000 and total assets not exceeding P100,000,000 (excluding the land on which the office, plant and equipment are situated) pay 20% RCIT. CREATE MORE provides a 20% RCIT for RBEs under the Enhanced Deductions regime, including resident foreign corporations registered with an IPA. Both statements are correct.","notes":["20% RCIT for small domestic corporations: NTI up to P5M AND total assets up to P100M (excluding land).","RFCs are otherwise always at 25%.","CREATE MORE: RBEs under the ED regime pay 20% RCIT."],"upd":"CREATE MORE: 20% RCIT for RBEs under the Enhanced Deductions regime.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-30","quiz":98,"num":30,"sec":"1.A","q":"Mr. Compton sells shoes in Makati through a retail store. He pays the VAT on his gross sales to the BIR and the municipal license tax based on the same gross sales to the City of Makati. He thinks he is being subjected to double taxation. What advice will you give him?","opts":["Yes, there is double taxation and it is progressive.","The City of Makati has no taxing power.","Yes, there is double taxation and this is illegal in the Philippines.","Double taxation is permissible where one tax is imposed by the national government and the other by the local government."],"ans":3,"exp":"Direct (prohibited) double taxation requires that both taxes be imposed by the same taxing authority, for the same purpose, in the same period, on the same subject. VAT is a national tax, while the business tax is imposed by the city under its own constitutionally granted taxing power (LGC, Sec. 143), so this is indirect double taxation, which is valid. There is also no constitutional prohibition against double taxation as such.","notes":["Direct duplicate taxation: same subject, same purpose, same taxing authority, same jurisdiction, same period, same kind.","National tax plus local tax on the same base: indirect double taxation, allowed.","LGUs have direct taxing power under Art. X, Sec. 5 of the Constitution."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-31","quiz":98,"num":31,"sec":"1.A","q":"The Municipality of Icawat passed an ordinance imposing a tax on installation managers. At that time, there was only one installation manager in the municipality, so only he would be liable for the tax. Is the ordinance constitutional?","opts":["It is unconstitutional because it clearly discriminates against this person.","It is unconstitutional for lack of legal basis.","It is constitutional as it applies to all persons in that class.","It is constitutional because the power to tax is the power to destroy."],"ans":2,"exp":"Uniformity and equal protection require only that the tax apply equally to all persons, firms or corporations placed in similar situations. A tax on a reasonable class is valid even if only one person happens to belong to the class at the moment, as long as it applies to all future members as well (Shell Co. v. Vano). The 'power to destroy' maxim does not justify an otherwise invalid tax.","notes":["Uniformity: equal operation on all persons in the same class.","Valid classification: substantial distinctions, germane to the law, not limited to existing conditions, applies to all members of the class.","A class of one is valid if the classification is reasonable and open to future members."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-32","quiz":98,"num":32,"sec":"8","q":"Philtele is a power generation and distribution company operating mainly in the City of Makati. It owns electric poles which it also rents out to telephone and cable companies. Makati passed an ordinance imposing a fee equivalent to 1% of the annual rental for these poles. Philtele questioned the ordinance on the ground that it imposes an income tax, which local government units are prohibited from imposing. Rule on the validity of the ordinance.","opts":["The ordinance is void; the fee is based on rental income and is therefore a tax on income.","The ordinance is valid as a legitimate exercise of police power to regulate electric poles.","The ordinance is void; 1% of annual rental is excessive and oppressive.","The ordinance is valid; an LGU may impose income tax."],"ans":1,"exp":"A fee is not converted into an income tax merely because the rental income is used as the measure; what matters is the purpose of the imposition. A charge imposed to regulate the use of poles within the city is a regulatory fee under police power (Progressive Development Corp. v. Quezon City). LGUs may not levy income tax (LGC, Sec. 133(a)), so choice d is wrong, and 1% is not shown to be unreasonable.","notes":["Purpose test: regulation = license fee (police power); revenue = tax.","Gross receipts may serve as the measure of a regulatory fee.","LGC Sec. 133(a): LGUs cannot levy income tax, except on banks and other financial institutions."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-33","quiz":98,"num":33,"sec":"8","q":"Which of the following properties are subject to real property taxes?","opts":["DPWH flood control projects.","Monuments and statues.","Machineries for pollution control.","Real property owned by cooperatives."],"ans":1,"exp":"Privately owned monuments and statues are improvements on land and are subject to real property tax. The other choices are exempt under LGC Sec. 234: property owned by the Republic (DPWH flood control projects), machinery and equipment used for pollution control and environmental protection, and real property owned by duly registered cooperatives.","notes":["LGC Sec. 234 exemptions: government-owned property (unless beneficial use given to a taxable person), charitable/religious/educational property used actually, directly and exclusively, water and electric machinery of GOCCs, cooperatives, pollution control machinery.","RPT basic rate: up to 1% (province), up to 2% (city or Metro Manila municipality); SEF 1%.","Exemption depends on use and ownership, not on the nature of the property alone."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-34","quiz":98,"num":34,"sec":"3.10","q":"The following are non-tax incentives given to barangay micro business enterprises, except:","opts":["Income tax exemption from all income arising from the operations of the enterprise.","Exemption from the coverage of the Minimum Wage Law (employees still receive the same social security and health care benefits as other employees).","Priority to a special credit window set up specifically for the financing requirements of BMBEs.","Technology transfer, production and management training, and marketing assistance programs for BMBE beneficiaries."],"ans":0,"exp":"The income tax exemption on income from operations (RA 9178, Sec. 7) is a TAX incentive, so it is the exception. Exemption from the Minimum Wage Law, the special credit window, and technology, training and marketing assistance are non-tax incentives under RA 9178.","notes":["BMBE tax incentive: income tax exemption on income from operations.","Non-tax: minimum wage exemption, special credit window, technology/training/marketing assistance.","BMBEs are not exempt from VAT or percentage tax unless otherwise qualified."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-35","quiz":98,"num":35,"sec":"9","q":"The Fiscal Incentives Review Board shall be composed of:","opts":["Chaired by the Secretary of Finance (DOF), with members from the Department of Trade and Industry (DTI), National Economic and Development Authority (NEDA) and Department of Budget and Management (DBM).","Chaired by the Secretary of Trade and Industry (DTI), with members from the Department of Finance (DOF), National Economic and Development Authority (NEDA) and Department of Budget and Management (DBM).","Chaired by the Secretary of NEDA, with members from the Department of Trade and Industry (DTI), Department of Finance (DOF) and Department of Budget and Management (DBM).","Chaired by the Secretary of Budget and Management (DBM), with members from the Department of Trade and Industry (DTI), National Economic and Development Authority (NEDA) and Department of Finance (DOF)."],"ans":0,"exp":"Under CREATE, the FIRB is chaired by the Secretary of Finance, with the Secretary of Trade and Industry as co-chair, and the Executive Secretary, the Secretary of Budget and Management and the NEDA Director-General (Secretary of Economy, Planning and Development) as members. Choice a is the only one with the DOF Secretary as chair.","notes":["FIRB chair: Secretary of Finance; co-chair: Secretary of Trade and Industry.","Members: Executive Secretary, DBM Secretary, NEDA Director-General.","CREATE MORE: FIRB approves incentives for investments above P15 billion; IPAs approve P15 billion and below."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-36","quiz":98,"num":36,"sec":"3.3","q":"Which of the following tax-related payments is considered a deductible expense when computing taxable income?","opts":["Interest imposed on a taxpayer for failure to pay tax on time.","Fines and penalties imposed for late payment of taxes.","Philippine income tax paid for the year.","The stock transaction tax under Section 127 of the Tax Code."],"ans":0,"exp":"Interest on delinquent taxes is deductible as interest expense because it is compensation for the use of money (RR 13-2000), provided the other requisites for deducting interest are met. Fines, surcharges and compromise penalties are not deductible since allowing them would frustrate public policy, and Philippine income tax is expressly non-deductible under Sec. 34(C)(1). The stock transaction tax on listed shares is a tax in lieu of the capital gains tax on the sale, so it is not a deductible business expense of the seller.","notes":["Deductible: interest on delinquent taxes (RR 13-2000).","Not deductible: surcharges, fines, penalties, compromise penalties; income tax; estate and donor's taxes; special assessments.","Stock transaction tax (CMEPA: 0.1% of gross selling price) is in lieu of capital gains tax."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-37","quiz":98,"num":37,"sec":"3.3","q":"A corporation may carry over its net operating loss (NOLCO) if there has been no substantial change in its ownership. What is the minimum percentage of ownership that must be maintained by the same persons for the corporation to avail of the NOLCO?","opts":["Greater than 50%","At least 75%","At least 25%","100%"],"ans":1,"exp":"Sec. 34(D)(3) allows NOLCO of a corporation only if there is no substantial change in ownership, meaning that not less than 75% in nominal value of outstanding issued shares (or of paid-up capital, if not a stock corporation) is held by or on behalf of the same persons.","notes":["No substantial change: at least 75% of nominal value of outstanding shares or paid-up capital held by the same persons.","NOLCO: 3 years (5 years for 2020 and 2021 losses under Bayanihan II).","Not available to taxpayers under the 8% option, OSD users, or while exempt from income tax (e.g., during ITH)."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-38","quiz":98,"num":38,"sec":"3.9","q":"For what minimum period must all books of accounts and other accounting records be preserved, starting from the day after the tax return filing deadline or the date of actual filing, whichever is later?","opts":["10 years","5 years","3 years","Until the audit is completed."],"ans":1,"exp":"Sec. 235 as amended by EOPT (RR 7-2024) requires books of accounts and accounting records to be preserved for 5 years, reckoned from the day following the deadline for filing the return or, if filed late, from the date of actual filing. The former 10-year rule under RR 17-2013 (as amended by RR 5-2014) no longer applies.","notes":["Preservation period: 5 years (EOPT).","Reckoned from the day after the filing deadline, or from actual filing if late.","Assessment period: 3 years; 10 years for false/fraudulent returns or non-filing."],"upd":"EOPT (RA 11976, RR 7-2024): preservation period is 5 years; previously 10 years under RR 17-2013 as amended by RR 5-2014.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-40","quiz":98,"num":40,"sec":"3.1-IND","q":"When two or more trusts are created by the same grantor for the benefit of the same beneficiary, how is their income tax liability determined?","opts":["Each trust is treated as a separate taxable entity and files its own return.","The income is taxed directly to the beneficiary, and the trusts are ignored for tax purposes.","Only the trust that was established first is required to pay income tax.","The taxable incomes of all such trusts are consolidated, and a single tax is computed which shall be proportionately paid by each trust."],"ans":3,"exp":"The NIRC provides that where two or more trusts have the same creator and the same beneficiary, their taxable incomes are consolidated, the tax is computed on the consolidated income, and the tax is proportionately assessed against each trust. This prevents splitting income among several trusts to stay in lower brackets.","notes":["Same grantor + same beneficiary: consolidate the trusts' taxable income.","Tax on consolidated income is apportioned among the trusts.","Estates and trusts are taxed like individuals (graduated rates); revocable trusts are taxed to the grantor."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-42","quiz":98,"num":42,"sec":"3.2-FBT","q":"Ms. Dimayuga, a resident citizen and managerial employee, exercised her equity-settled stock option on December 1, 2024. The exercise price was P100 per share, the book value of the underlying shares was P150, and the fair market value was P160 on that date. How should the income realized be treated for tax purposes, and what is the amount of additional compensation income per share?","opts":["Taxable as fringe benefit subject to final FBT; P60 income.","Taxable as compensation subject to CWT; P50 income.","Taxable as compensation subject to CWT; P60 income.","Taxable as fringe benefit subject to final FBT; P50 income."],"ans":2,"exp":"Under RR 13-2022, equity-based compensation is taxable upon exercise as compensation income subject to withholding tax on compensation, whether the employee is rank-and-file or managerial/supervisory, so it is no longer treated as a fringe benefit. The income is the excess of the higher of the book value or fair market value of the shares at exercise over the exercise price: P160 less P100 = P60.","notes":["Equity-based compensation: taxable at exercise, as compensation income subject to CWT, for all employees (RR 13-2022; CMEPA).","Measure: higher of BV or FMV at exercise, less exercise price.","Before RR 13-2022, stock options of managerial/supervisory employees were treated as fringe benefits subject to FBT."],"upd":"CMEPA (RA 12214): codifies that equity-based compensation is taxable upon exercise; RR 13-2022 had earlier made it compensation income subject to CWT for all employees.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-64","quiz":98,"num":64,"sec":"5.1","q":"XYZ Corporation made a sale on account on June 30, 2024, with a 90-day credit term expiring on September 28, 2024, and declared the output VAT in its 2nd quarter VAT return. The receivable remained uncollected, so XYZ claimed the output VAT as a credit in its 4th quarter VAT return ending December 31, 2024. The receivable was still uncollected as of March 31, 2025. Can XYZ claim another output VAT credit in the 1st quarter VAT return ending March 31, 2025?","opts":["YES","NO","It depends.","None of the above"],"ans":1,"exp":"Sec. 110(D), added by EOPT, allows the seller to deduct the output VAT on an uncollected receivable only in the quarter following the lapse of the agreed period to pay, and the claim may be made only once (RR 3-2024; RMC 65-2024). Having claimed it in the 4th quarter of 2024, XYZ cannot claim it again even though the receivable remains uncollected.","notes":["Output VAT credit on uncollected receivables: claim in the quarter after the lapse of the agreed period to pay.","Claim only once; the receivable must still be uncollected in that quarter.","Applies to sales made after RR 3-2024 took effect (April 27, 2024)."],"upd":"EOPT (RA 11976, Sec. 110(D); RR 3-2024; RMC 65-2024): new output VAT credit for uncollected receivables.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-65","quiz":98,"num":65,"sec":"5.1","q":"XYZ Corporation made a sale on account on June 30, 2024, with a 90-day credit term expiring on September 28, 2024, and declared the output VAT in its 2nd quarter VAT return. It failed to claim an output VAT credit in its 4th quarter VAT return ending December 31, 2024. However, it agreed to extend the buyer's period to pay until December 31, 2024. Can it now claim the output VAT credit in the 1st quarter VAT return ending March 31, 2025, since the receivable remains uncollected in that quarter?","opts":["YES","NO","I do not know.","None of the above."],"ans":0,"exp":"When the seller and buyer agree to extend the period to pay, the lapse of the agreed period is reckoned from the extended date. Since the extended period lapsed on December 31, 2024, the quarter following the lapse is the 1st quarter of 2025, so XYZ may claim the output VAT credit in that return (RMC 65-2024).","notes":["Extension of the period to pay moves the claim to the quarter after the extended period lapses.","Without an extension, a missed claim in the quarter after the lapse is lost.","Claim once only; recovered amounts are added back to output VAT when collected."],"upd":"EOPT (RA 11976, Sec. 110(D); RMC 65-2024): extended payment terms move the quarter in which the output VAT credit may be claimed.","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-66","quiz":98,"num":66,"sec":"5.1","q":"XYZ Corporation made a sale on account on June 30, 2024 (90-day term), declared the output VAT in its 2nd quarter VAT return, and claimed the output VAT as a credit in its 4th quarter VAT return ending December 31, 2024 because the receivable remained uncollected. If the sale plus VAT is collected on February 14, 2025, what must the taxpayer do?","opts":["The taxpayer must declare the recovered output VAT in the 1st quarter VAT return ending March 31, 2025.","The taxpayer must file an amended 4th quarter VAT return ending December 31, 2024 and declare the recovered output VAT therein."],"ans":0,"exp":"Under Sec. 110(D), if the uncollected receivable is later recovered, in whole or in part, the corresponding output VAT is added to the output VAT of the seller in the period of recovery. Collection on February 14, 2025 falls in the 1st quarter of 2025, so the recovered output VAT is declared in that return; no amendment of the earlier return is needed.","notes":["Recovery after claiming the credit: add the output VAT back in the quarter of recovery.","No amended return for the quarter in which the credit was claimed.","The buyer who claimed input VAT on the unpaid purchase must deduct it from its input VAT in the corresponding quarter."],"upd":"EOPT (RA 11976, Sec. 110(D); RR 3-2024).","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-67","quiz":98,"num":67,"sec":"5.1","q":"Alpha Corp., a registered export enterprise (REE) with an Investment Promotion Agency (IPA), maintains its 70% export sales threshold and received the required VAT zero-rating certificate from its IPA for its local purchases. Alpha purchased P5 Million worth of goods from a local supplier for use in its registered activity, receiving a valid VAT invoice without the P600,000 VAT, and paid only the P5 Million price. If the IPA determines, three months later, that the purchase was not directly attributable to the registered export activity (neither used in it nor incidental to and reasonably necessary for it), what is the tax consequence?","opts":["The purchase remains zero-rated, provided Alpha still meets the 70% export threshold.","The purchase remains zero-rated, as zero-rating incentives are irrevocable.","Alpha must pay the corresponding output VAT of P600,000 and apply for a tax refund.","The sale is retroactively deemed subject to 12% VAT, and the local supplier becomes liable for the deficiency VAT, penalty and interest."],"ans":3,"exp":"CREATE MORE limits VAT zero-rating of local purchases by REEs to goods and services directly attributable to the registered project or activity, as certified by the IPA. If the IPA finds the purchase not directly attributable, the sale does not qualify and is subject to 12% VAT; since VAT is a tax on the seller, the local supplier is the statutory taxpayer liable for the deficiency VAT with penalties and interest, and it may seek to recover the VAT from Alpha. Meeting the 70% export threshold does not make every purchase zero-rated, and Alpha, as buyer, does not pay output VAT.","notes":["CREATE MORE: zero-rating for purchases directly attributable to the registered activity, including those incidental to and reasonably necessary for it (e.g., janitorial, security, administrative services).","The seller is statutorily liable for VAT; the buyer's liability is only contractual (passed-on VAT).","An REE must have at least 70% of total sales from exports."],"upd":"CREATE MORE (RA 12066): replaced CREATE's 'directly and exclusively used' test with 'directly attributable' (which includes purchases incidental to and reasonably necessary for the registered activity), and made the IPA's VAT zero-rating certificate the primary document.","key":"Stem updated: it originally said the IPA found the purchase 'merely incidental (and not directly attributable)'; under CREATE MORE, incidental and reasonably necessary purchases ARE directly attributable, so the finding was restated as simply not directly attributable. Source key D kept.","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-68","quiz":98,"num":68,"sec":"7","q":"Which of the following items is subject to excise tax?","opts":["Purely electric vehicles.","Buses, trucks and cargo vans.","Hybrid vehicles, subject to a reduced rate.","Naphtha used as raw material in the production of petrochemical products."],"ans":2,"exp":"Under Sec. 149 as amended by TRAIN, hybrid vehicles are subject to excise tax at 50% of the rates applicable to automobiles. Purely electric vehicles are exempt, and buses, trucks, cargo vans, jeepneys and special-purpose vehicles are not considered automobiles for excise tax purposes. Naphtha used as raw material in producing petrochemical products is exempt under Sec. 148.","notes":["Automobiles: ad valorem excise based on net manufacturer's/importer's price (4% to 50%).","Hybrid vehicles: 50% of the applicable rates; purely electric vehicles: exempt.","Buses, trucks, cargo vans, jeepneys, special-purpose vehicles: not automobiles, so not subject."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB98-F-69","quiz":98,"num":69,"sec":"5.1","q":"Statement 1: Donation by a VAT-registered person of property classified as an ordinary asset shall be considered a transaction deemed sale, hence subject to VAT.\nStatement 2: If the donor is a VAT-registered person, the donation of real property used in business is subject to VAT. If the donor is not VAT-registered, the donation is exempt from VAT.","opts":["Both are true.","Both are false.","Statement 1 is true.","Statement 2 is true."],"ans":0,"exp":"Under Sec. 106(B) and RR 16-2005, the transfer of goods originally intended for sale or for use in the course of business not in the ordinary course, such as a donation, is a transaction deemed sale subject to output VAT when made by a VAT-registered person. Real property used in business is an ordinary asset, so its donation by a VAT-registered person is subject to VAT, while a donor who is not VAT-registered (and not required to register) has no VAT liability on it. Both statements are true; the donation is also subject to donor's tax.","notes":["Deemed sale (Sec. 106(B)): personal use, distribution to shareholders/creditors, consignment not sold in 60 days, retirement/cessation of business.","Donation of ordinary assets by a VAT-registered person: VAT on FMV plus donor's tax.","Output VAT on deemed sales is based on the market value of the goods."],"upd":"","key":"","src":"CPAR B98 Final Preboard (Oct 2025)"},{"id":"PB97-F-03","quiz":97,"num":3,"sec":"8","q":"Ka Tato owns a parcel of land in San Jose, Batangas declared for real property taxation as agricultural. In 2010, he used the land for a poultry feed processing plant but continued to declare the property as agricultural. In March 2021, the local assessor discovered the change in use and informed
