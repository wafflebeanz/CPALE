of residence","If the employer purchases a residential property on installment basis and allows his employee to use the same as his usual place of residence","None of the choices"],"ans":3,"exp":"Under RR 3-98, all three housing arrangements use the 50% factor: leased property (rental x 50%), employer-owned property (5% of the higher of FMV or zonal value x 50%), and property purchased on installment (5% of acquisition cost, excluding interest, x 50%). None of them is an exception, so the answer is 'None of the choices.' The full (100%) value applies only when ownership is transferred to the employee.","notes":["Lease: rent x 50%. Owned: 5% of FMV/zonal (higher) x 50%. Installment: 5% of cost (excluding interest) x 50%.","Transfer of ownership to the employee: full value, no 50% factor.","Not taxable: housing within 50 meters of the business premises, temporary housing of 3 months or less, military housing."],"upd":"","key":""},{"id":"Q10-12","quiz":10,"num":12,"sec":"3.2-FBT","q":"In which of the following cases shall the monetary value be the entire value of the benefit?\nI - If the employer purchases a residential property and transfers ownership of the said property in the name of the employee\nII - If the employer purchases a residential property and transfers ownership of the said property to his employee for the latter's residential use, at a price less than the employer's acquisition cost","opts":["Both I and II","I only","Neither I nor II","II only"],"ans":0,"exp":"When ownership of the residential property passes to the employee, the 50% factor does not apply. In case I, the monetary value is the employer's acquisition cost or zonal value, whichever is higher. In case II, the value is the difference between the fair market value (higher of zonal or assessor's value) and the price paid by the employee, taken in full.","notes":["Transfer in employee's name: higher of acquisition cost or zonal value, 100%.","Sale to employee below employer's cost: FMV minus employee's price, 100%.","Sale at or above employer's cost: no taxable fringe benefit, even if below zonal value."],"upd":"","key":""},{"id":"Q10-14","quiz":10,"num":14,"sec":"3.2-FBT","q":"CPL, Inc. purchased a residential house and lot for P1,800,000 (zonal value P2,550,000) and sold it to its CFO for P2,000,000 for the CFO's residential use. Is the transfer subject to fringe benefit tax?","opts":["P892,500","P700,000","P296,154","Not subject to fringe benefits tax"],"ans":3,"exp":"Under RR 3-98, a sale of residential property to an employee produces a taxable fringe benefit only when the price is less than the employer's acquisition cost. CPL sold at P2,000,000, which exceeds its P1,800,000 cost, so there is no taxable fringe benefit even though the price is below the zonal value. P296,154 is the trap: it computes (P2,550,000 - P2,000,000) / 65% x 35% without first applying the cost test.","notes":["Cost test first: price below employer's acquisition cost? If not, no FBT.","If below cost: FBT base = FMV (higher of zonal or assessor's value) minus employee's price, grossed up by 65%.","If the property is transferred in the employee's name for free: higher of cost or zonal value / 65% x 35%."],"upd":"","key":"Stem rewritten to be self-contained because the source item relied on the data of item 13 (excluded); original peso choices kept, key D."},{"id":"Q10-16","quiz":10,"num":16,"sec":"3.2-FBT","q":"First statement: The fringe benefit tax shall be treated as a final income tax on the employee which shall be withheld and paid by the employer on a calendar quarterly basis as provided under the Tax Code.\nSecond statement: The grossed-up monetary value of the fringe benefit represents the whole amount of income realized by the employee, which includes the net amount of money or monetary value of property which has been received plus the amount of fringe benefit tax thereon otherwise due from the employee but paid by the employer for and in behalf of his employee.","opts":["Only the first statement is correct","Only the second statement is correct","Both statements are correct","Both statements are incorrect"],"ans":2,"exp":"Both statements restate Sec. 33(A) and RR 3-98. The FBT is a final income tax on the employee, withheld and paid by the employer quarterly. The grossed-up monetary value represents the whole income realized by the employee: the net benefit received plus the FBT the employer paid on the employee's behalf, which is why the value is divided by 65%.","notes":["FBT is a final tax on the employee, withheld and remitted by the employer.","Grossed-up value = monetary value / 65% (includes the FBT itself).","Filed quarterly via BIR Form 1603Q."],"upd":"","key":""},{"id":"Q10-18","quiz":10,"num":18,"sec":"3.2-FBT","q":"In which one of the following cases involving motor vehicles shall the monetary value be fifty percent (50%) of the value of the benefit?","opts":["If the employer purchases the motor vehicle in the name of the employee","If the employer provides the employee with cash for the purchase of a motor vehicle, the ownership of which is placed in the name of the employee","If the employer purchases the car on installment, the ownership of which is placed in the name of the employee","If the employer owns and maintains a fleet of motor vehicles for the use of the business and the employees"],"ans":3,"exp":"Under RR 3-98, when the employer owns and maintains a fleet of motor vehicles for the use of the business and the employees, the value is the acquisition cost of the vehicles not normally used for sales, freight, delivery and other non-personal use, divided by 5 years, multiplied by 50%. In choices a, b and c, ownership is in the employee's name, so the entire value is the benefit (acquisition cost, cash given, or acquisition cost excluding interest divided by 5 years).","notes":["Car in employee's name (purchased or cash given): full acquisition cost / cash.","Installment in employee's name: cost excluding interest / 5 years, 100%.","Fleet owned (cost / 5 years) or leased (rentals) for business and employees: x 50%.","Use of vehicle for sales, freight, delivery and other non-personal purposes is not a fringe benefit."],"upd":"","key":""},{"id":"Q10-20","quiz":10,"num":20,"sec":"3.2-FBT","q":"Which of the following shall be treated as a taxable fringe benefit?\nI - The interest foregone if the employer lends money to his employees free of interest\nII - The interest foregone if the employer lends money to his employees at a rate lower than twelve percent (12%)","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"RR 3-98 provides that if the employer lends money to an employee free of interest or at a rate lower than 12%, the interest foregone is a taxable fringe benefit. The benefit is measured as the difference between the 12% benchmark rate and the rate actually charged. Both cases therefore give rise to a taxable fringe benefit.","notes":["Interest-free or below-12% loans to employees: interest foregone is a fringe benefit.","Value = (12% - actual rate) x loan balance for the period.","Other taxable fringe benefits: housing, vehicles, household personnel, club memberships, foreign travel, educational assistance to dependents."],"upd":"","key":""},{"id":"Q11-01","quiz":11,"num":1,"sec":"3.1-CG","q":"The term \"capital asset\" includes:","opts":["stock in trade or other property included in the taxpayer's inventory.","real property not used in the trade or business of the taxpayer.","property primarily for sale to customers in the ordinary course of his trade or business.","property used in the trade or business of the taxpayer and subject to depreciation."],"ans":1,"exp":"Sec. 39(A)(1) defines capital assets negatively: all property held by the taxpayer except stock in trade or inventory, property held primarily for sale to customers, depreciable property used in the business, and real property used in the trade or business. Real property not used in the business is therefore a capital asset. Choices a, c and d are the listed exclusions, i.e., ordinary assets.","notes":["Ordinary assets: inventory, property held for sale, depreciable business property, real property used in business.","Everything else held by the taxpayer is a capital asset.","Real property capital asset: 6% CGT on the higher of gross selling price or FMV."],"upd":"","key":""},{"id":"Q11-02","quiz":11,"num":2,"sec":"3.1-CG","q":"A feature of ordinary gains as distinguished from capital gains:","opts":["Gains from sales of assets not stock in trade","May or may not be taxable in full","Sources are capital assets","No holding period"],"ans":3,"exp":"Ordinary gains arise from ordinary assets and are always taken into account in full, so the holding period is irrelevant. Capital gains of individuals are subject to the holding period rule of Sec. 39(B) (100% if held 12 months or less, 50% if more than 12 months). Choices a, b and c describe capital gains, not ordinary gains.","notes":["Ordinary gain: 100% taxable, no holding period.","Individuals' capital gains: 100% if held 12 months or less; 50% if held more than 12 months.","Corporations: capital gains and losses always 100%, no holding period."],"upd":"","key":""},{"id":"Q11-03","quiz":11,"num":3,"sec":"3.1-CG","q":"Under the Tax Code, how much of a P100,000 gain realized by a corporate taxpayer from the sale or exchange of capital assets (other than real properties and shares of stock) held for more than twelve months shall be taken into account in computing net income?","opts":["P100,000","P50,000","P5,000","None, there is no capital loss"],"ans":0,"exp":"The holding period percentages of Sec. 39(B) apply only to taxpayers other than corporations. For a corporation, 100% of the capital gain or loss is taken into account regardless of how long the asset was held, so the full P100,000 is included. The 50% figure applies only to individuals holding capital assets for more than 12 months.","notes":["Corporations: 100% of capital gains/losses, holding period irrelevant; no net capital loss carry-over.","Capital losses of any taxpayer are deductible only to the extent of capital gains (Sec. 39(C)); an individual's net capital loss cannot offset ordinary income.","Real property (6% CGT) and unlisted shares (15% CGT) are taxed separately under final CGT rules."],"upd":"","key":""},{"id":"Q11-04","quiz":11,"num":4,"sec":"3.1-CG","q":"First statement: Net capital loss carry-over is allowed to taxpayers other than corporations, and this is carried over to the succeeding year as a short-term loss.\nSecond statement: The amount of net capital loss carry-over is the net capital loss or the net income in the year the net capital loss is sustained, whichever is lower.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements restate Sec. 39(D). Only taxpayers other than corporations may carry over a net capital loss, and it is treated as a short-term capital loss (100% taken into account) in the next taxable year. The carry-over is limited to the net income of the year the loss was sustained, so it is the lower of the net capital loss or that year's net income.","notes":["Net capital loss carry-over: individuals only, one succeeding year.","Treated as short-term (100%) capital loss in the succeeding year.","Limit: lower of net capital loss or net income in the year of loss."],"upd":"","key":""},{"id":"Q11-05","quiz":11,"num":5,"sec":"3.1-CG","q":"Jose Josue's 2022 taxable income was P200,000 exclusive of capital gains and losses. Mr. Josue had a net long-term capital loss of P8,000 in 2022. What amount of this capital loss could Mr. Josue offset against the 2022 ordinary income?","opts":["Zero","P3,000","P4,000","P8,000"],"ans":0,"exp":"Under Sec. 39(C), losses from sales or exchanges of capital assets are allowed only to the extent of gains from such sales or exchanges. An individual's net capital loss therefore cannot be deducted from ordinary income; instead, the loss taken into account (P4,000, being 50% of a long-term loss) may be carried over to 2023 as a short-term capital loss. P3,000 is the old US-style offset, which the NIRC does not allow. The same limitation applies to corporations, which take capital losses at 100% but cannot carry them over.","notes":["Capital losses offset only capital gains, never ordinary income.","Individuals: long-term capital loss taken at 50%; carry-over to the next year as short-term loss, up to net income of the loss year.","Corporations: 100% rule, no holding period, no carry-over."],"upd":"TRAIN: the source stem said Mr. Josue qualified as head of a household for 2021; that status (and personal exemptions) no longer exists and does not affect the answer, so it was dropped.","key":""},{"id":"Q11-06","quiz":11,"num":6,"sec":"3.1-CG","q":"On September 1, 2021, X Corporation invested P1,000,000 in Y Corporation common shares (Y is not an affiliate of X). The Y Corporation common shares became worthless on August 1, 2022. For income tax purposes, how much loss shall be recognized?","opts":["P1,000,000 ordinary loss","P1,000,000 capital loss","P500,000 capital loss","Neither ordinary loss nor capital loss"],"ans":1,"exp":"Under Sec. 34(D)(4), securities that are capital assets and become worthless are treated as a loss from the sale or exchange of capital assets on the last day of the taxable year (except for banks and trust companies). For a corporation, the holding period rules do not apply, so 100% of the P1,000,000 is recognized as a capital loss. It is not an ordinary loss, and it is deductible only against capital gains.","notes":["Worthless securities (capital assets): capital loss, deemed sold on the last day of the taxable year.","Corporations: 100% recognized regardless of holding period.","Exception: banks and trust companies treat worthless securities as ordinary losses."],"upd":"","key":""},{"id":"Q11-07","quiz":11,"num":7,"sec":"3.1-CG","q":"On September 1, 2021, Mr. X, an individual taxpayer, invested P1,000,000 in Y Corporation common shares held as capital assets. The Y Corporation shares became worthless on August 1, 2022. For income tax purposes, how much loss shall be recognized?","opts":["P1,000,000 ordinary loss","P1,000,000 capital loss","P500,000 capital loss","Neither ordinary loss nor capital loss"],"ans":2,"exp":"Sec. 34(D)(4) treats worthless securities that are capital assets as sold or exchanged on the LAST DAY of the taxable year, not on the date they became worthless. The shares acquired September 1, 2021 are thus deemed sold on December 31, 2022, a holding period of about 16 months. For an individual, only 50% of a capital loss on assets held more than 12 months is taken into account (Sec. 39(B)), so the recognized capital loss is P500,000.","notes":["Deemed sale date for worthless securities: last day of the taxable year (Dec 31 for calendar year).","Individuals: held more than 12 months = 50%; 12 months or less = 100%.","Trap: counting to the worthlessness date (Aug 1, 2022) gives less than 12 months and a wrong 100% answer."],"upd":"","key":""},{"id":"Q11-08","quiz":11,"num":8,"sec":"3.1-CG","q":"The tax base and the tax rates of the capital gains tax on the sale of shares of stock not traded in the stock exchange shall be:\nI - the net capital gain.\nII - 5% on the first P100,000; 10% on the excess of P100,000.","opts":["Both I and II are correct","Neither I nor II is correct","Only I is correct","Only II is correct"],"ans":2,"exp":"The capital gains tax on shares not traded in the stock exchange is imposed on the net capital gain realized during the taxable year, so statement I is correct. Statement II is wrong because the 5%/10% schedule was replaced by TRAIN with a flat 15% on net capital gains beginning 2018 (Sec. 24(C), 25, 27(D)(2), 28).","notes":["Unlisted shares: 15% final tax on net capital gains (individuals and corporations).","Listed shares sold through the exchange: stock transaction tax of 0.1% of gross selling price (CMEPA), not CGT.","Net capital gain = selling price less cost and selling expenses."],"upd":"TRAIN replaced the 5%/10% rates with a flat 15% on net capital gains; CMEPA extended the 15% CGT to shares of foreign corporations.","key":""},{"id":"Q11-09","quiz":11,"num":9,"sec":"3.1-CG","q":"When is the capital gains tax return filed by a natural or juridical person, resident or nonresident, who is not exempt under existing laws, for the sale, barter, exchange or other onerous disposition intended to transfer ownership of shares of stock in a domestic corporation classified as capital assets, not traded through the local stock exchange?\nI - Within thirty (30) days after each cash sale, barter, exchange or other disposition of shares of stock not traded through the local stock exchange\nII - In case of installment sale, the return shall be filed within thirty (30) days following the receipt of the first down payment and within thirty (30) days following each subsequent installment payment","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Both statements are correct. The transactional CGT return (BIR Form 1707) is filed within 30 days after each sale, barter, exchange or other disposition. For installment sales, a return is filed within 30 days after receipt of the first down payment and within 30 days after each subsequent installment.","notes":["Transactional CGT return on unlisted shares: BIR Form 1707, within 30 days after each sale.","Installment sale: within 30 days after the down payment and each installment.","Annual consolidated return: BIR Form 1707-A, on or before April 15 of the following year."],"upd":"","key":""},{"id":"Q11-10","quiz":11,"num":10,"sec":"3.1-CG","q":"When is the annual capital gains tax return for onerous transfers of shares of stock not traded through the local stock exchange, covering all transactions of the preceding taxable year, filed?","opts":["Within thirty (30) days after the end of the taxable year","On or before the fifteenth (15th) day of the fourth (4th) month following the close of the taxable year","On or before the fifteenth (15th) day of the third (3rd) month following the close of the taxable year","Within fifteen (15) days after the end of the taxable year"],"ans":1,"exp":"The annual CGT return (BIR Form 1707-A) covering all sales of unlisted shares during the year is filed on or before the 15th day of the 4th month following the close of the taxable year (April 15 for calendar-year taxpayers). It consolidates the transactional returns and settles the net capital gain for the year. The other deadlines are not provided for this return.","notes":["BIR Form 1707-A: annual, 15th day of the 4th month after year end.","Required when there are two or more transactions during the year (to compute the net capital gain).","Transactional Form 1707: within 30 days after each sale."],"upd":"","key":""},{"id":"Q11-11","quiz":11,"num":11,"sec":"3.1-CG","q":"In the case of a cash sale of shares of stock not traded through the local stock exchange, the selling price shall be the:","opts":["total consideration per deed of sale.","sum of money and the fair market value of the property received.","fair market value of the property received.","none of the choices."],"ans":0,"exp":"Under RR 6-2008, in a cash sale of unlisted shares, the selling price is the total consideration stated in the deed of sale. The sum of money plus FMV of property applies when the consideration is partly money and partly property, and FMV of property received applies to exchanges. If the FMV of the shares exceeds the consideration, the excess is a deemed gift subject to donor's tax (Sec. 100), unless the sale is in the ordinary course of business.","notes":["Cash sale: total consideration per deed of sale.","Exchange for property: FMV of property received; mixed: money plus FMV of property.","Sale below FMV: excess of FMV over price is subject to 6% donor's tax."],"upd":"","key":""},{"id":"Q11-12","quiz":11,"num":12,"sec":"3.1-CG","q":"In the case of an exchange of shares for property, the selling price of the shares shall be the:","opts":["total consideration per deed of sale.","sum of money and the fair market value of the property received.","fair market value of the property received.","none of the choices."],"ans":2,"exp":"When shares are exchanged for property, the selling price is the fair market value of the property received (RR 6-2008). If the consideration consists of both money and property, the selling price is the sum of the money and the FMV of the property. The deed of sale consideration applies to cash sales.","notes":["Exchange for property: FMV of property received.","Money and property: sum of money plus FMV of property.","Tax-free exchanges under Sec. 40(C)(2) (e.g., transfer to a controlled corporation) do not recognize gain."],"upd":"","key":""},{"id":"Q11-13","quiz":11,"num":13,"sec":"3.1-CG","q":"In the case of shares of stock not listed and traded in the local stock exchanges, what shall be considered as the fair market value?","opts":["The closing price on the day when the shares are sold, transferred, or exchanged","The book value of the shares of stock as shown in the financial statements duly certified by an independent certified public accountant nearest to the date of sale","The acquisition cost of the shares sold, transferred or exchanged","The selling price or the bid price nearest to the date of sale as published in any newspaper or publication of general circulation, whichever is higher"],"ans":1,"exp":"For unlisted shares, FMV is based on the latest audited financial statements (certified by an independent CPA) nearest to the date of sale, which is the basis of choice b. Under RR 20-2020, however, this book value is adjusted using the adjusted net asset method, where assets (including real property at the higher of zonal or assessor's value) and liabilities are restated to fair market value. Closing and published prices apply to listed shares, and acquisition cost is the basis for computing gain, not FMV.","notes":["Unlisted shares FMV: adjusted net asset method (RR 20-2020), based on audited FS nearest the date of sale.","Listed shares: closing price on the date of sale (or published price for sales outside the exchange).","The FMV is used to test for a deemed gift and for donor's and estate tax purposes."],"upd":"RR 20-2020: FMV of unlisted shares is determined under the adjusted net asset method (book value adjusted for the FMV of real property and other assets), not plain book value; choice b remains the best answer.","key":""},{"id":"Q11-17","quiz":11,"num":17,"sec":"3.1-CG","q":"How much final tax is imposed upon capital gains presumed to have been realized from the sale, exchange, or other disposition of real property located in the Philippines, classified as capital assets?","opts":["10% capital gains tax","6% capital gains tax","5% capital gains tax","4% capital gains tax"],"ans":1,"exp":"Sec. 24(D)(1) imposes a 6% final capital gains tax on the presumed gain from the sale of real property in the Philippines classified as a capital asset, based on the higher of the gross selling price or FMV (zonal or assessor's value). Domestic corporations pay the same 6% on lands and buildings held as capital assets (Sec. 27(D)(5)). The gain is presumed, so actual gain or loss is irrelevant.","notes":["6% of the higher of gross selling price or FMV (zonal or assessor's).","CGT return (BIR Form 1706): within 30 days after the sale.","Also applies to domestic corporations' land and buildings held as capital assets."],"upd":"","key":""},{"id":"Q11-18","quiz":11,"num":18,"sec":"3.1-CG","q":"A real property classified as a capital asset was sold for P5,000,000. It was acquired at a cost of P3,000,000. Its fair market value at the time of sale was P6,000,000. What was the tax base of the capital gains tax on the sale of real property classified as a capital asset?","opts":["P6,000,000","P5,000,000","P3,000,000","P2,000,000"],"ans":0,"exp":"The 6% CGT on real property capital assets is imposed on the gross selling price or the fair market value at the time of sale, whichever is higher. Since the FMV of P6,000,000 exceeds the P5,000,000 selling price, the tax base is P6,000,000. Cost and actual gain (P2,000,000) are irrelevant because the gain is presumed.","notes":["Tax base: higher of gross selling price or FMV (zonal value or assessor's FMV).","CGT = 6% x P6,000,000 = P360,000.","Actual gain or loss does not matter; gain is presumed."],"upd":"","key":""},{"id":"Q11-19","quiz":11,"num":19,"sec":"3.1-CG","q":"If real property classified as a capital asset is sold to the government or any of its political subdivisions or agencies or GOCCs, the tax shall be:\nOption I - 6% capital gains tax.\nOption II - Section 24(A).","opts":["Both options are correct","Neither of the options is correct","Only I is correct","Only II is correct"],"ans":0,"exp":"Under the proviso of Sec. 24(D)(1), an individual who sells real property capital assets to the government, its political subdivisions or agencies, or GOCCs may choose between the 6% final CGT and the graduated income tax rates under Sec. 24(A). Both options are therefore correct. The option is available only to individuals and only for sales to the government.","notes":["Sale to government by individuals: option of 6% CGT or graduated rates (Sec. 24(A)).","Option is not available to corporations.","Other sales of real property capital assets: 6% CGT only."],"upd":"","key":""},{"id":"Q11-20","quiz":11,"num":20,"sec":"3.1-CG","q":"Capital gains presumed to have been realized from the sale or disposition of their principal residence by natural persons, the proceeds of which are fully utilized in acquiring or constructing a new principal residence within eighteen (18) calendar months from the date of sale or disposition, shall be:","opts":["subject to the 6% capital gains tax.","subject to the 5% capital gains tax.","exempt from the capital gains tax.","none of the choices."],"ans":2,"exp":"Sec. 24(D)(2) exempts from CGT the sale of a principal residence by a natural person if the proceeds are fully used to acquire or build a new principal residence within 18 calendar months. The seller must notify the CIR within 30 days of the sale, and the exemption may be availed of only once every 10 years. The historical cost of the old residence carries over to the new one.","notes":["Conditions: proceeds fully used within 18 months, notice to CIR within 30 days, once every 10 years.","Partial use: CGT on the unused portion of the proceeds.","The 6% CGT is placed in escrow until proof of use is presented."],"upd":"","key":""},{"id":"Q12-01","quiz":12,"num":1,"sec":"3.3","q":"It refers to the pertinent items of gross income less the deductions and/or personal and additional exemptions, if any, authorized for such types of income by the Tax Code or other special laws.","opts":["Taxable income","Business income","Professional income","Compensation income"],"ans":0,"exp":"This is the Sec. 31 definition of taxable income: gross income less the deductions authorized by the Tax Code or special laws. Business, professional and compensation income are kinds of gross income, not the net base on which tax is computed.","notes":["Taxable income = gross income less allowable deductions (Sec. 31).","Personal and additional exemptions were removed by TRAIN; the P250,000 zero bracket replaced them.","Purely compensation earners get no deductions other than exclusions (e.g., 13th month and other benefits up to P90,000)."],"upd":"TRAIN: personal and additional exemptions were repealed effective Jan 1, 2018, so the 'exemptions' in the definition no longer apply to individuals.","key":""},{"id":"Q12-02","quiz":12,"num":2,"sec":"3.3","q":"First statement: Exclusions are receipts which are excluded from the gross income, hence, do not form part of the gross income.\nSecond statement: Deductions are allowable items or amounts that can be subtracted from the gross income to arrive at the taxable income.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements are true. Exclusions (Sec. 32(B)) never enter gross income at all, while deductions (Sec. 34) are subtracted from gross income to arrive at taxable income.","notes":["Exclusions: flows that are not counted in gross income (e.g., life insurance proceeds, gifts, retirement benefits under Sec. 32(B)).","Deductions: subtracted from gross income (Sec. 34); exemptions: subtracted from net income (repealed for individuals).","Exclusions are applied before deductions."],"upd":"","key":""},{"id":"Q12-03","quiz":12,"num":3,"sec":"3.3","q":"First statement: A taxpayer can deduct an item or amount from the gross income only if there is a law authorizing such a deduction.\nSecond statement: For income tax purposes, a taxpayer is free to deduct from the gross income the full amount or a lesser amount of the deduction allowed or not claim any deduction at all.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both are true. Deductions are a matter of legislative grace, so there must be a law allowing them. Because a deduction is a privilege, the taxpayer may claim all of it, part of it or none of it.","notes":["Deductions are privileges granted by law, not rights.","No law, no deduction: the taxpayer bears the burden of proving entitlement.","Deductions are construed strictly against the taxpayer."],"upd":"","key":""},{"id":"Q12-04","quiz":12,"num":4,"sec":"3.3","q":"First statement: A taxpayer can deduct an item or amount from the gross income only if there is a law authorizing such a deduction.\nSecond statement: For income tax purposes, a taxpayer is free to deduct from the gross income the full amount or a lesser amount of the deduction allowed or not claim any deduction at all.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both are true. Deductions exist only by express provision of law (legislative grace), and since they are privileges the taxpayer may claim the full amount, a lesser amount or nothing.","notes":["Deductions are privileges granted by law, not rights.","The taxpayer must prove entitlement to every deduction claimed.","Deductions are construed strictly against the taxpayer."],"upd":"","key":"Repeat of item 3 in the source quiz."},{"id":"Q12-05","quiz":12,"num":5,"sec":"3.3","q":"(Phil. CPA) In cases of deductions and exemptions on income tax returns, doubts shall be resolved:","opts":["strictly against the taxpayer.","strictly against the government.","liberally in favor of the taxpayer.","liberally in favor of the employer."],"ans":0,"exp":"Deductions and exemptions are in the nature of tax exemptions and are construed strictissimi juris against the taxpayer. The liberal rule in favor of the taxpayer applies to the interpretation of tax impositions (tax laws), not to deductions or exemptions.","notes":["Tax laws (impositions): doubts resolved in favor of the taxpayer.","Exemptions and deductions: construed strictly against the taxpayer.","Exception: exemptions in favor of the government or its political subdivisions are construed liberally."],"upd":"","key":""},{"id":"Q12-06","quiz":12,"num":6,"sec":"3.3","q":"Which of the following losses is deductible for income tax purposes?","opts":["Loss from illegal transactions","Loss incurred in selling used delivery truck to an uncle","Loss from a business receivable from a customer which is doubtful in collection","Loss from \"wash sale\""],"ans":1,"exp":"Sec. 36(B) disallows losses only on sales between certain related parties: members of a family (brothers and sisters, whether of whole or half blood, spouse, ancestors and lineal descendants), an individual and a corporation more than 50% owned by him, and specified trust and corporate relationships. An uncle is a collateral relative outside that list, so the loss is deductible. Losses from illegal transactions are against public policy, a merely doubtful receivable is not yet worthless (no reserve method), and wash sale losses are disallowed by Sec. 38.","notes":["Sec. 36(B) family: brothers and sisters, spouse, ancestors, lineal descendants only (uncles, aunts, cousins, in-laws are not covered).","Individual and corporation: disallowed if the individual owns more than 50% of outstanding stock.","Bad debts must be actually worthless and charged off; doubtful accounts (allowance method) are not deductible.","Wash sale losses are not deductible unless the taxpayer is a dealer in securities (Sec. 38)."],"upd":"","key":""},{"id":"Q12-07","quiz":12,"num":7,"sec":"3.3","q":"One of the following is not a requisite for the deductibility of business expenses.","opts":["The expenses are ordinary and necessary.","The expenses are paid or incurred during the taxable year.","The expenses are directly attributable to the development, management, operation and/or conduct of the trade, business or exercise of profession.","As long as business related, the expenses do not necessarily have to be substantiated with sufficient evidence, such as official receipts or other adequate records."],"ans":3,"exp":"Choice D is false: Sec. 34(A)(1)(b) requires business expenses to be substantiated with sufficient evidence (invoices or other adequate records) showing the amount and its direct connection to the business. The other choices are statutory requisites.","notes":["Requisites: ordinary and necessary, paid or incurred during the year, connected with the business, substantiated, and subject to withholding when required.","Not contrary to law, morals, public policy or public order; not a bribe, kickback or similar payment.","EOPT: the invoice is now the primary supporting document for both goods and services."],"upd":"EOPT (RA 11976): the invoice replaced the official receipt as the primary sales document, so substantiation is now by invoice.","key":""},{"id":"Q12-08","quiz":12,"num":8,"sec":"3.3","q":"(Phil. CPA) The following are examples of corporate expenses deductible from gross income, except:","opts":["representation expenses designated to promote business.","contribution to drum up business, like contributions of soft drinks to barrio fiesta.","expenses paid to an advertising firm in order to create a favorable image for the corporation.","premiums on life insurance covering the life of an employee if the beneficiary is the heirs."],"ans":1,"exp":"A contribution or donation for a barrio fiesta is a gift, not an ordinary and necessary business expense, and it is not a deductible charitable contribution unless given to a qualified donee under Sec. 34(H). Representation expenses (within the EAR ceiling) and image-building advertising are ordinary business expenses. Premiums on employee life insurance where the heirs, not the employer, are the beneficiaries are deductible as part of compensation; Sec. 36(A)(4) disallows premiums only when the taxpayer is directly or indirectly a beneficiary.","notes":["Life insurance premiums: not deductible if the employer/taxpayer is a beneficiary (Sec. 36(A)(4)); deductible as compensation if heirs are beneficiaries.","Charitable contributions must go to a qualified donee (government, accredited NGO, etc.) to be deductible.","Representation expenses fall under entertainment, amusement and recreation (EAR) and are capped at 0.5% of net sales or 1% of net revenue."],"upd":"","key":""},{"id":"Q12-09","quiz":12,"num":9,"sec":"3.3","q":"One of the following is not deductible from the gross income.","opts":["Amounts paid as pensions to retired employees or their families or others dependent upon them, or on account of injuries received by employees and lump-sum amounts paid or accrued as compensation for injuries, not compensated for by insurance or otherwise","Amount of the salary of an officer or employee paid to his widow or heirs for a limited period after his death, in recognition of the services rendered by the officer or employee","Salaries paid by employers to employees who are absent because they are in the military, naval or other service in the government, but who intend to return at the conclusion of such service","Ostensible salary paid by a corporation which is actually a distribution of dividends or part payment for a property"],"ans":3,"exp":"A so-called salary that is really a dividend or payment for property is not compensation for services, so it is not deductible (dividends come out of after-tax earnings; payment for property is a capital outlay). Pensions and injury compensation not covered by insurance, salary continued to a deceased employee's widow or heirs for a limited period, and salaries of employees on government service leave are allowed by the regulations as ordinary and necessary expenses.","notes":["Compensation is deductible only if reasonable and for services actually rendered.","Disguised dividends are not deductible by the corporation.","Payments to a deceased employee's heirs for a limited period, in recognition of services, are deductible."],"upd":"","key":""},{"id":"Q12-10","quiz":12,"num":10,"sec":"3.3","q":"Which of the following is not a requisite for the deductibility of salaries, wages and other forms of compensation including the grossed-up monetary value of fringe benefit furnished or granted by the employer to the employee?","opts":["Reasonable","Services are actually rendered","Withholding tax has been paid","Not related to the taxpayer by consanguinity"],"ans":3,"exp":"Compensation is deductible if reasonable, for personal services actually rendered, and the required withholding tax has been withheld and remitted (Sec. 34(K)). Kinship is not a bar: salary paid to a relative who actually works and is reasonably paid is deductible.","notes":["Requisites: reasonable, services actually rendered, paid or incurred in the year, and withholding tax withheld and remitted.","Fringe benefits are deductible at their grossed-up monetary value (FBT is also deductible by the employer).","Compensation to relatives is deductible if reasonable and for actual services."],"upd":"","key":""},{"id":"Q12-11","quiz":12,"num":11,"sec":"3.3","q":"Which of the following is not a requisite for the deductibility of travel expenses, here and abroad?","opts":["Reasonable","Incurred or paid while away from home","Incurred or paid in the pursuit of trade, business or profession","Incurred or paid in the pursuit of trade, business or profession in the Philippines only"],"ans":3,"exp":"Sec. 34(A)(1)(a)(ii) allows travel expenses 'here and abroad' that are reasonable, incurred while away from home and in the pursuit of trade, business or profession. Limiting them to business in the Philippines only contradicts the phrase 'here and abroad'.","notes":["Travel expenses include transportation, meals and lodging while away from home.","'Here and abroad': foreign travel is deductible if business related.","Commuting between home and the regular place of business is personal and not deductible."],"upd":"","key":""},{"id":"Q12-12","quiz":12,"num":12,"sec":"3.3","q":"A business partnership leased a condominium unit in Makati for use as its office. The contract was properly classified as a capital lease. It paid P50,000 monthly to the condominium owner. For income taxation, the monthly payment was:","opts":["deductible as rent expense.","deductible as payment of amortization.","not deductible because the taxpayer was taking title and would become the owner of the condominium unit.","not deductible because the payment was not reasonable."],"ans":2,"exp":"Rent is deductible only if the taxpayer is not taking title to or does not have equity in the property (Sec. 34(A)(1)(a)(iii)). Under a capital lease the lessee is in substance buying the unit, so the payments are part of its cost, not rent; the taxpayer recovers the cost through depreciation instead.","notes":["Rental is deductible only if the lessee is not taking title and has no equity in the property.","Capital lease payments are capital expenditures; claim depreciation instead.","Improvements by the lessee: deduct over the remaining lease term or the life of the improvement, whichever is shorter."],"upd":"","key":""},{"id":"Q12-13","quiz":12,"num":13,"sec":"3.3","q":"Which of the following is not a requisite for the deductibility of entertainment, amusement and recreation expenses during the taxable year?","opts":["Paid or incurred during the taxable year","Directly connected to the development, management and operation of the trade, business or profession of the taxpayer or related to or in furtherance of the conduct of his trade, business or exercise of a profession","Not contrary to law, morals, public policy or public order","Invoices must be in the name of the officials or members who paid or incurred entertainment, amusement and recreation expenses"],"ans":3,"exp":"Under RR 10-2002, EAR expenses must be substantiated by invoices issued in the name of the taxpayer claiming the deduction, not in the name of its officers or members. The other choices are actual requisites.","notes":["EAR ceiling: 0.5% of net sales (sellers of goods) or 1% of net revenue (sellers of services).","Supporting invoices must be in the name of the taxpayer (RR 10-2002).","Not bribes or kickbacks, and not contrary to law, morals or public policy."],"upd":"","key":""},{"id":"Q12-14","quiz":12,"num":14,"sec":"3.3","q":"There shall be allowed a deduction from gross income for entertainment, amusement and recreation expense in an amount equivalent to the actual entertainment, amusement and recreation expense paid or incurred within the taxable year by the taxpayer, but in no case shall such deduction exceed:\nI. 0.50% of net sales (gross sales less sales returns or allowances and sales discounts) for taxpayers engaged in sale of goods or properties.\nII. 1% of net revenue (gross revenue less discounts) for taxpayers engaged in sale of services, including exercise of profession and use or lease of properties.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Both are the RR 10-2002 ceilings: 0.5% of net sales for sellers of goods and 1% of net revenue for sellers of services, including professionals and lessors. The deductible amount is the lower of actual EAR or the ceiling.","notes":["Goods: 0.5% of net sales; services (including lease): 1% of net revenue.","If engaged in both, the ceiling is apportioned based on sales or revenue, or on expense allocation.","EAR excess over the ceiling is not deductible and cannot be carried over."],"upd":"","key":""},{"id":"Q12-15","quiz":12,"num":15,"sec":"3.3","q":"One of the following is not deductible from the gross income of the employer.","opts":["De minimis benefits given to employees","Fringe benefits given to rank and file","SSS, GSIS, Philhealth, HDMF and other contributions","Cost of advertising to influence legislation"],"ans":3,"exp":"Expenditures to promote or defeat legislation (lobbying or political advertising) are not ordinary and necessary business expenses and are not deductible. De minimis benefits, fringe benefits to rank-and-file employees (as compensation) and mandatory employer contributions are deductible.","notes":["Fringe benefits of rank and file are compensation (subject to withholding on wages, not FBT) and deductible.","FBT (35% of grossed-up value) applies only to managerial or supervisory employees.","De minimis ceilings follow RR 29-2025 (e.g., rice subsidy P2,500 per month, uniform P8,000 per year)."],"upd":"RR 29-2025: de minimis ceilings were increased (e.g., rice P2,500 per month, uniform P8,000 per year, Christmas gifts P6,000 per year).","key":""},{"id":"Q12-16","quiz":12,"num":16,"sec":"3.3","q":"A private educational institution had capital outlays of depreciable assets for expansion of school facilities. For income taxation, the private educational institution may:","opts":["deduct the capital outlays as expenses during the year.","depreciate the cost over the estimated useful life.","deduct the capital outlays as expense during the year or depreciate them over the estimated useful life at its option.","deduct the capital outlays as expense during the year or depreciate them over the estimated useful life at the option of the BIR."],"ans":2,"exp":"Sec. 34(A)(2) lets a private educational institution, at its option, either deduct expenditures for the expansion of school facilities as expense in the year incurred or depreciate them. The option belongs to the institution, not the BIR.","notes":["Special rule for proprietary educational institutions: expense or depreciate, at their option.","Proprietary educational institutions pay 10% RCIT (if gross income from unrelated activities does not exceed 50%).","Non-stock, non-profit educational institutions are exempt on revenues actually, directly and exclusively used for educational purposes."],"upd":"","key":""},{"id":"Q12-17","quiz":12,"num":17,"sec":"3.3","q":"Which of the following is not deductible from the gross income of a professional?","opts":["Tuition, travel, board and lodging expenses incurred while attending a continuing professional education","Cost of subscription of technical books used by the professional in the practice of his profession or those that may enhance his technical knowledge in the management of a corporation under him","Amount spent for books of a permanent character","Insurance premiums against fire, storm, theft, accident or other similar losses in the practice of his profession"],"ans":2,"exp":"Books, furniture and professional equipment of a permanent character are capital expenditures, so their cost is not deductible outright (it is recovered through depreciation). CPE costs, subscriptions to technical publications and business insurance premiums are ordinary and necessary expenses of a professional.","notes":["Capital expenditures of a permanent character: depreciate, do not expense.","Professionals may choose itemized deductions, 40% OSD of gross receipts/sales, or the 8% option if gross sales do not exceed P3M and not VAT-registered.","Business insurance premiums are deductible; personal life insurance premiums are not."],"upd":"","key":""},{"id":"Q12-18","quiz":12,"num":18,"sec":"3.3","q":"First statement: As a rule, the interest must be on an indebtedness of the taxpayer, otherwise, it is not deductible.\nSecond statement: Interest paid by the taxpayer on a mortgage upon real estate of which he is the legal or equitable owner, even if he is not directly liable upon the bond or note secured by such mortgage, may be deducted as interest on his indebtedness.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both are true. Interest is deductible only if it is on the taxpayer's own indebtedness (Sec. 34(B)). The regulations allow an owner (legal or equitable) of mortgaged real estate to deduct interest he pays on the mortgage even if he is not personally liable on the note.","notes":["Requisites: indebtedness of the taxpayer, connected with trade or business, valid and demandable, paid or incurred during the year, not between related parties under Sec. 36(B).","Interest paid for another person's debt (e.g., as guarantor before default) is generally not deductible.","Interest on loans for personal purposes is not deductible."],"upd":"","key":""},{"id":"Q12-19","quiz":12,"num":19,"sec":"3.3","q":"The taxpayer's otherwise allowable deduction for interest expense shall be reduced by how much starting July 1, 2020?","opts":["Forty-five percent (45%) of the interest income subjected to final tax","Forty-two percent (42%) of the interest income subjected to final tax","Twenty-five percent (25%) of the interest income subjected to final tax","Twenty percent (20%) of the interest income subjected to final tax"],"ans":3,"exp":"Under Sec. 34(B)(1) as amended by CREATE, allowable interest expense is reduced by 20% of the interest income subjected to final tax, effective July 1, 2020. This interest arbitrage rule was 33% under TRAIN (and 42% earlier when RCIT was 35%).","notes":["Interest arbitrage: reduce interest expense by 20% of interest income subjected to final tax (CREATE).","History: 42% (RCIT 35%), 33% (RCIT 30%, TRAIN), 20% (RCIT 25%, CREATE).","The reduction does not apply to interest on unpaid business-related taxes."],"upd":"CREATE: the arbitrage rate dropped from 33% (TRAIN) to 20% effective July 1, 2020.","key":""},{"id":"Q12-20","quiz":12,"num":20,"sec":"3.3","q":"At the option of the taxpayer, interest incurred to acquire property used in trade or business or exercise of profession may be:\nI. allowed as a deduction.\nII. treated as a capital expenditure.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 34(B)(3) gives the taxpayer the option to deduct interest on indebtedness incurred to acquire property used in trade, business or profession, or to capitalize it as part of the cost of the property.","notes":["Option: deduct or capitalize interest on loans to acquire business property (Sec. 34(B)(3)).","Prepaid interest by an individual on cash basis is deductible when the indebtedness is paid (proportionately if paid in installments).","Interest between related parties under Sec. 36(B) is not deductible."],"upd":"","key":""},{"id":"Q12-21","quiz":12,"num":21,"sec":"3.3","q":"Interest incurred or paid by the taxpayer on all unpaid business-related taxes:\nI. shall be fully deductible from the gross income.\nII. shall not be subject to reduction by an amount equal to certain percentage of the interest income subject to final tax.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"RR 13-2000 provides that interest on unpaid business-related taxes is fully deductible and is not subject to the interest arbitrage reduction. Surcharges and compromise penalties on those taxes remain non-deductible.","notes":["Interest on delinquent business taxes: fully deductible, no arbitrage reduction.","Surcharges and compromise penalties are not deductible.","The taxes must be connected with the trade or business; the tax itself follows the Sec. 34(C) rules."],"upd":"","key":""},{"id":"Q12-23","quiz":12,"num":23,"sec":"3.3","q":"Which of the following taxes paid or incurred within the taxable year in connection with the taxpayer's profession, trade or business, shall be allowed as deduction?","opts":["Philippine income tax","Foreign income tax claimed as tax credit","Estate and donor's taxes","Local taxes"],"ans":3,"exp":"Business-connected local taxes (e.g., business tax, real property tax on business property) are deductible under Sec. 34(C)(1). The same section excludes Philippine income tax, foreign income tax if claimed as a credit, estate and donor's taxes, and special assessments.","notes":["Non-deductible taxes: Philippine income tax, foreign income tax claimed as credit, estate and donor's taxes, special assessments on benefited property.","Deductible: business-related taxes such as percentage tax, excise, DST, local business and real property taxes.","Foreign income tax: deduction OR credit, not both."],"upd":"","key":""},{"id":"Q12-24","quiz":12,"num":24,"sec":"3.6","q":"Which of the following shall not be allowed tax credit for foreign income tax?","opts":["Resident citizen","Domestic corporation","Partnerships and estates","Alien individual and a foreign corporation"],"ans":3,"exp":"Only taxpayers taxed on worldwide income can claim the foreign tax credit: resident citizens and domestic corporations (Sec. 34(C)(3)), and members of a GPP or beneficiaries of an estate or trust for their proportionate share. Alien individuals and foreign corporations are taxed only on Philippine-source income, so they have no foreign tax to credit (they may deduct it instead, if connected with Philippine income).","notes":["Foreign tax credit: resident citizens and domestic corporations only (plus proportionate share of GPP partners and estate/trust beneficiaries).","Limit: per-country and overall limitations under Sec. 34(C)(4).","Nonresident citizens, OCWs and aliens are taxed only on Philippine-source income, so no credit."],"upd":"","key":""},{"id":"Q12-25","quiz":12,"num":25,"sec":"3.6","q":"The credits against income tax for taxes of foreign countries shall, at the option of the taxpayer, be taken in the year which the taxes of the foreign country were:","opts":["incurred irrespective of the method of accounting employed in keeping his books.","paid if the taxpayer uses cash method in keeping his books.","incurred if the taxpayer uses accrual method in keeping his books.","none of the choices."],"ans":0,"exp":"Sec. 34(C)(6) allows the credit, at the taxpayer's option and irrespective of the method of accounting, to be taken in the year the foreign taxes were incurred (accrued). Choices B and C wrongly tie the timing to the accounting method.","notes":["Foreign tax credit may be claimed in the year incurred regardless of accounting method.","If foreign tax paid differs from the amount claimed, the Philippine tax is redetermined.","The taxpayer may elect a credit or a deduction for foreign income taxes, not both."],"upd":"","key":""},{"id":"Q12-26","quiz":12,"num":26,"sec":"3.3","q":"First statement: The term \"taxes\" means taxes proper and no deductions should be allowed for amounts representing interest, surcharge, or penalties incident to delinquency.\nSecond statement: Taxes are deductible as such only by the person upon whom they are imposed.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct under the regulations. As a tax deduction, only the tax proper counts; surcharges and penalties are not deductible, and interest on delinquent taxes is claimed as interest expense (not as tax). A tax is deductible only by the person on whom the law imposes it.","notes":["Tax deduction covers the tax proper only.","Interest on delinquent business taxes is deductible as interest (RR 13-2000); surcharges and compromise penalties are never deductible.","A tax passed on to a buyer is part of the buyer's cost, not a tax deduction."],"upd":"","key":""},{"id":"Q12-27","quiz":12,"num":27,"sec":"3.3","q":"Which of the following is correct?\nFirst statement: The percentage tax imposed by law upon sales is not deductible by the individual purchaser, even though the tax may be billed to him as a separate item.\nSecond statement: In computing the net income of an individual, no deduction is allowed for the taxes imposed upon his interest as shareholder of a bank or other corporation, which are paid by the corporation without reimbursement from the taxpayer.","opts":["Both statements are correct","Neither statement is correct","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both follow from the rule that a tax is deductible only by the person on whom it is imposed. The percentage tax is imposed on the seller, so the buyer cannot deduct it as a tax. Taxes on a shareholder's interest paid by the corporation without reimbursement are not paid by the shareholder, so he cannot deduct them.","notes":["Deductible only by the person on whom the tax is imposed.","Percentage tax and VAT shifted to a buyer are part of the buyer's cost or input tax, not a tax deduction.","Taxes paid by a corporation on behalf of shareholders without reimbursement are deductible by the corporation, not the shareholders."],"upd":"","key":""},{"id":"Q12-28","quiz":12,"num":28,"sec":"3.3","q":"One of these is not a requisite for deductibility of loss.","opts":["The loss must be that of the taxpayer.","The loss must be actually sustained and charged off within the taxable year.","The loss must be evidenced by a closed and completed transaction.","The loss must be compensated for by insurance or other form of indemnity."],"ans":3,"exp":"Sec. 34(D)(1) allows losses 'not compensated for by insurance or otherwise.' A loss covered by insurance is not a loss to that extent. The other choices are actual requisites.","notes":["Requisites: loss of the taxpayer, actually sustained and charged off in the year, closed and completed transaction, connected with business, not compensated by insurance.","Casualty/theft: file a sworn declaration of loss within 45 days after the event (RR 12-77).","Not claimed as a deduction for estate tax purposes."],"upd":"","key":""},{"id":"Q12-29","quiz":12,"num":29,"sec":"3.3","q":"First statement: The term \"losses\" implies an unintentional parting with something of value.\nSecond statement: No loss shall be allowed as a deduction from gross income if at the time of the filing of the return, such loss has been claimed as a deduction for estate tax purposes in the estate tax return.","opts":["Only the first statement is correct","Only the second statement is correct","Both statements are correct","Both statements are incorrect"],"ans":2,"exp":"Both are correct. A loss is an involuntary or unintentional parting with value. Sec. 34(D)(1) also bars claiming the same loss as an income tax deduction if it was already claimed in the estate tax return, preventing a double deduction.","notes":["No double deduction: a loss claimed for estate tax cannot also be claimed for income tax.","Casualty losses during settlement of the estate remain deductible from the gross estate under TRAIN.","Losses must be evidenced by a closed and completed transaction."],"upd":"","key":""},{"id":"Q12-30","quiz":12,"num":30,"sec":"3.3","q":"It denotes an accident, a mishap, some sudden invasion by a hostile agency, and excludes the progressive deterioration of property through a steadily operating cause.","opts":["Casualty","Business","Abandonment","Wager"],"ans":0,"exp":"This is the definition of casualty: a sudden, unexpected event such as fire, storm or shipwreck. Gradual deterioration (e.g., termites, rust) is not a casualty but is recovered through depreciation.","notes":["Casualty = sudden, unexpected, unusual event.","Progressive deterioration is covered by depreciation, not casualty loss.","Sworn declaration of loss within 45 days from the casualty (RR 12-77)."],"upd":"","key":""},{"id":"Q12-31","quiz":12,"num":31,"sec":"3.3","q":"Statement I: If the loss is sustained due to partial destruction the deductible amount is the lower between the book value and the cost to restore.\nStatement II: If the cost to restore is greater than the book value, the excess of cost to restore is capitalized.\nStatement III: If the loss is sustained due to total or complete destruction, the deductible amount is the book value of the property destroyed.\nStatement IV: In both cases (partial or total destruction), salvage value and insurance recovery are offset against the deductible loss.","opts":["All statements are correct","All statements are incorrect","Only statements I, II and III are correct","Only statements I and II are correct"],"ans":0,"exp":"All four reflect RR 12-77. Partial destruction: the loss is the lower of book value or cost to restore, and any excess of restoration cost over book value is capitalized. Total destruction: the loss is the book value. In both cases salvage value and insurance recoveries reduce the deductible loss.","notes":["Partial: lower of book value or restoration cost; total: book value.","Less: insurance recovery and salvage value.","The deductible loss can never exceed the unrecovered cost (book value)."],"upd":"","key":""},{"id":"Q12-32","quiz":12,"num":32,"sec":"3.3","q":"A coconut plantation in Masbate was destroyed by cadang-cadang infestation starting 2007. By the end of that year, more than 3/4 of the plantation was worthless. Towards the middle of 2008, the plantation was totally destroyed. When should the loss be deducted?","opts":["2007","2008","Any year as the taxpayer chooses","Cannot be deducted in any year"],"ans":1,"exp":"A loss is deductible only when it is evidenced by a closed and completed transaction and actually sustained. Partial worthlessness in 2007 did not close the transaction; the loss became fixed when the plantation was totally destroyed in 2008. The taxpayer cannot pick the year.","notes":["Loss is deductible in the year actually sustained and fixed by identifiable events.","Partial worthlessness from disease or gradual causes is not a closed transaction.","The taxpayer has no option on the year of deduction."],"upd":"","key":""},{"id":"Q12-33","quiz":12,"num":33,"sec":"3.3","q":"Which of the following statements is correct?\nI. A loss from theft or embezzlement occurring in one year and discovered in another is ordinarily deductible for the year in which it was sustained.\nII. The allowable deduction for losses is limited to the un-recovered cost (book value) of the property lost or destroyed.\nIII. The rule is that loss deduction will be denied if there is a reasonable right to compensate for the loss.","opts":["I, II and III","I and II only","II and III only","I only"],"ans":0,"exp":"All three restate the regulations (RR 2). A theft or embezzlement loss is ordinarily deductible in the year sustained, the deduction cannot exceed the property's unrecovered cost, and no loss is allowed while there is a reasonable prospect of recovery from insurance or otherwise.","notes":["Loss limited to book value (unrecovered cost) less insurance and salvage.","No deduction while a reasonable prospect of reimbursement exists.","Casualty and theft losses require a sworn declaration within 45 days (RR 12-77)."],"upd":"","key":""},{"id":"Q12-34","quiz":12,"num":34,"sec":"3.3","q":"Which of these losses due to demolition of an old building is deductible from gross income?","opts":["The old building is demolished because it became unsafe.","The land with an existing old building was bought with the intention of demolishing the old building in order to construct a new one.","Both a and b","Neither a nor b"],"ans":0,"exp":"Demolition of a building that became unsafe (or for a business reason arising after acquisition) produces a deductible loss equal to its unrecovered cost. If land with a building was bought intending to demolish it, no loss is allowed; the whole price is treated as the cost of the land.","notes":["Unsafe building demolished: loss = book value less salvage.","Bought with intent to demolish: no loss; cost of building and demolition goes to the land.","Demolition of a leased building by the lessee to build a new one: unrecovered cost amortized over the lease term."],"upd":"","key":""},{"id":"Q12-35","quiz":12,"num":35,"sec":"3.3","q":"The net operating loss of the business or enterprise for any taxable year immediately preceding the current taxable year, which had not been previously offset as deduction from gross income shall be carried over as a deduction from gross income for:","opts":["the next three (3) consecutive taxable years immediately following the year of such loss.","the next five (5) consecutive taxable years immediately following the year of such loss.","any 3-year period not necessarily consecutive taxable years immediately following the year of such loss.","None of the choices."],"ans":0,"exp":"Under Sec. 34(D)(3), NOLCO is carried over as a deduction for the next three consecutive taxable years following the year of loss. The five-year period applies only by special law (Bayanihan II for 2020 and 2021 losses, and RBEs under the Enhanced Deductions Regime).","notes":["General rule: 3 consecutive years, FIFO basis.","Bayanihan II: net operating losses of 2020 and 2021 may be carried over for 5 consecutive years.","CREATE MORE: RBEs under the Enhanced Deductions Regime may carry over NOLCO for 5 years.","Mines other than oil and gas wells: NOLCO in the first 10 years of operation may be carried over 5 years."],"upd":"Bayanihan II (RA 11494): NOLCO for taxable years 2020 and 2021 may be carried over for 5 years. CREATE MORE: RBEs under the Enhanced Deductions Regime may carry over NOLCO for 5 years.","key":""},{"id":"Q12-36","quiz":12,"num":36,"sec":"3.3","q":"First statement: Any net loss incurred in a taxable year during which the taxpayer was exempt from income tax shall not be allowed as a net operating loss carryover deduction.\nSecond statement: Net operating loss carry-over shall be allowed only if there has been no substantial change in the ownership of the business or enterprise.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is incorrect"],"ans":0,"exp":"Both are provisos of Sec. 34(D)(3). Losses incurred while exempt cannot be carried over, and NOLCO is allowed only if there is no substantial change in ownership, meaning at least 75% of the nominal value of outstanding shares or paid-up capital is held by or on behalf of the same persons.","notes":["Substantial change: less than 75% of shares or paid-up capital retained by the same persons.","Losses incurred during an income tax holiday (exempt years) are not carried over.","NOLCO is not allowed while the taxpayer uses OSD, but the 3-year period keeps running."],"upd":"","key":""},{"id":"Q12-37","quiz":12,"num":37,"sec":"3.3","q":"The allowance for deduction of net operating loss carry over (NOLCO) shall be limited only to net operating losses accumulated beginning:","opts":["January 1, 1998.","January 1, 1999.","January 1, 2000.","January 1, 2009."],"ans":0,"exp":"NOLCO was introduced by the Tax Reform Act of 1997 (RA 8424), effective January 1, 1998. RR 14-2001 limits the deduction to net operating losses accumulated beginning that date.","notes":["NOLCO: RA 8424, effective Jan 1, 1998; implemented by RR 14-2001.","Carryover of 3 years (5 years for 2020/2021 losses and for RBEs under the ED regime).","Applied on a first-in, first-out basis."],"upd":"","key":""},{"id":"Q12-38","quiz":12,"num":38,"sec":"3.3","q":"Which of the following statements is correct?\nI. An individual (including estate and trust) engaged in trade or business or in the exercise of profession, and a domestic corporation or resident foreign corporation may be allowed to claim deduction of his/its corresponding NOLCO.\nII. A taxpayer who claims the optional standard deduction shall not simultaneously avail of the deduction of the NOLCO.\nIII. The three-year reglementary period shall continue to run notwithstanding the fact that certain taxpayers availed of the optional standard deduction during the said period.","opts":["I, II and III","I and II only","II and III only","None of the three"],"ans":0,"exp":"All three are from RR 14-2001 and RR 16-2008. Individuals in business or practice of profession (including estates and trusts), domestic corporations and resident foreign corporations may claim NOLCO. A taxpayer on OSD cannot also deduct NOLCO, but the three-year period keeps running during OSD years.","notes":["NOLCO available to individuals in business (including estates/trusts), DCs and RFCs; not to NRFCs taxed on gross.","OSD and NOLCO cannot be used together; OSD years still count toward the 3 years.","Losses from exempt years cannot be carried over."],"upd":"","key":""},{"id":"Q12-39","quiz":12,"num":39,"sec":"3.3","q":"NOLCO shall be availed of on a:","opts":["\"first-in, first-out\" basis.","\"last-in, first-out\" basis.","\"weighted average\" basis.","none of the choices."],"ans":0,"exp":"RR 14-2001 requires NOLCO to be applied on a first-in, first-out basis: the oldest loss is deducted first so it is used before it expires.","notes":["NOLCO is applied FIFO: oldest loss first.","Unused NOLCO expires at the end of its carryover period.","The carryover period runs even in years of MCIT or OSD."],"upd":"","key":""},{"id":"Q12-40","quiz":12,"num":40,"sec":"3.3","q":"First statement: Domestic and resident foreign corporations cannot enjoy the benefit of NOLCO for as long as it is subject to minimum corporate income tax (MCIT) in any taxable year (i.e., MCIT is greater than the normal corporate income tax).\nSecond statement: The running of the three-year period for the expiry of NOLCO is not interrupted by the fact that such corporation is subject to MCIT in any taxable year during such three-year period.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct under RR 14-2001. In a year the corporation pays MCIT (because MCIT exceeds RCIT), NOLCO gives no benefit, yet the three-year period still runs, so the NOLCO for that year is effectively used up.","notes":["MCIT: 2% of gross income starting the 4th taxable year after commencement of operations (1% from July 2020 to June 2023).","NOLCO is deemed used in MCIT years; the 3-year period is not suspended.","Excess MCIT over RCIT may be carried forward and credited for 3 years."],"upd":"","key":""},{"id":"Q12-41","quiz":12,"num":41,"sec":"3.3","q":"It is a sale of securities where substantially identical securities are acquired or purchased within a 61-day period beginning 30 days before the sale and ending 30 days after the sale.","opts":["Wash sale","Bargain sale","Discounted sale","Garage sale"],"ans":0,"exp":"Sec. 38 defines a wash sale: a sale of stock or securities at a loss where substantially identical securities are acquired within 30 days before or after the sale (a 61-day window). The loss is disallowed except for dealers in securities in the ordinary course of business.","notes":["Wash sale window: 30 days before to 30 days after the sale (61 days).","Disallowed loss is added to the cost of the replacement shares.","Wash sale rule does not apply to dealers in securities."],"upd":"","key":""},{"id":"Q12-42","quiz":12,"num":42,"sec":"3.3","q":"\"Substantially identical\" means that the stock must be of the same class, or in case of bonds, the terms thereof must be the same. One of these is substantially identical.","opts":["Common stock and the preferred stock of the same corporation","Non-voting stock and a stock with voting power","Two series of bonds where one is secured by a mortgage and the other is not; or which differ as to interest rates","Two series of bonds with the same interest rates but with different dates of maturity"],"ans":3,"exp":"The regulations list as NOT substantially identical: common versus preferred stock, voting versus non-voting stock, and bonds that differ in security or interest rate. Choices A to C are those listed examples, so D (same interest rate, differing only in maturity) is the one treated as substantially identical in the source.","notes":["Not substantially identical: common vs. preferred; voting vs. non-voting; secured vs. unsecured bonds; bonds with different interest rates.","Answer by elimination: the listed exceptions are the non-identical ones.","Wash sale loss is disallowed only if substantially identical securities are acquired within the 61-day window."],"upd":"","key":""},{"id":"Q12-43","quiz":12,"num":43,"sec":"3.3","q":"The wash sale provision does not apply to:\nI. dealers in securities.\nII. short sale transactions.","opts":["Yes to I and II","No to I and II","Yes to I only","Yes to II only"],"ans":0,"exp":"Sec. 38 expressly exempts dealers in securities for transactions in the ordinary course of business. Under the regulations, the wash sale rule also does not apply to short sales, since the taxpayer does not own the securities sold.","notes":["Dealers in securities: wash sale losses are ordinary and deductible.","Short sales are outside the wash sale rule.","Gains on wash sales are always taxable; only losses are disallowed."],"upd":"","key":""},{"id":"Q12-44","quiz":12,"num":44,"sec":"3.3","q":"First statement: In case a producing well is subsequently abandoned, the unamortized costs thereof, as well as the undepreciated costs of equipment directly used therein, shall be allowed as a deduction in the year such well, equipment or facility is abandoned by the contractor.\nSecond statement: If the abandoned well is reentered and production is resumed, or if such equipment or facility is restored into service, the said costs shall be included as part of gross income in the year of resumption or restoration and shall be amortized or depreciated, as the case may be.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both restate Sec. 34(D)(7)(a) on abandonment losses in petroleum operations. The unamortized costs of an abandoned producing well and undepreciated equipment are deductible in the year of abandonment; if the well is reentered or equipment restored, those costs are included in gross income in that year and then amortized or depreciated again.","notes":["Petroleum abandonment losses: deductible in the year of abandonment (Sec. 34(D)(7)).","Contract area abandoned: accumulated exploration and development expenditures are deductible.","Resumption or restoration: previously deducted costs are recaptured in gross income."],"upd":"","key":""},{"id":"Q12-45","quiz":12,"num":45,"sec":"3.3","q":"In which of the following shall no gain or loss be recognized in pursuance of a plan of merger or consolidation?","opts":["A corporation, which is a party to a merger or consolidation, exchanges property solely for stock in a corporation, which is a party to the merger or consolidation","A shareholder exchanges stock in a corporation, which is a party to the merger or consolidation, solely for the stock of another corporation also a party to the merger or consolidation","A security holder of a corporation, which is a party to the merger or consolidation, exchanges his securities in such corporation, solely for stock or securities in such corporation, a party to the merger or consolidation","All of the choices"],"ans":3,"exp":"Sec. 40(C)(2) lists all three as tax-free exchanges when made pursuant to a plan of merger or consolidation: the corporation exchanging property solely for stock, the shareholder exchanging stock solely for stock, and the security holder exchanging securities solely for stock or securities of a party to the merger.","notes":["Tax-free exchanges under Sec. 40(C)(2): merger/consolidation and transfer to a controlled corporation.","Boot (money or other property) received is taxable to the extent of gain.","The substituted basis rule applies to property and shares received."],"upd":"","key":""},{"id":"Q12-46","quiz":12,"num":46,"sec":"3.3","q":"(Phil. CPA) Mr. Juan de la Cruz transferred his commercial land with a cost of P500,000 but with a fair market value of P750,000 to JDC Corporation in exchange of the stocks of the corporation with a par value of P1,000,000. As a result of the transfer, he became the majority stockholder of the corporation. As a result of the transfer:","opts":["The recognized gain is the difference between the fair market value of the shares of stocks and the cost of the land.","The recognized gain is the difference between the par value of the stocks and the fair market value of the land.","There is no recognized gain because the land was in exchange of purely stocks and Mr. de la Cruz became the majority stockholder.","There is no recognized gain because the land was in exchange of stocks of the corporation."],"ans":2,"exp":"Under Sec. 40(C)(2), no gain or loss is recognized when property is transferred to a corporation solely in exchange for its shares and, as a result, the transferor (alone or with not more than four others) gains control (at least 51% of voting power). Both conditions are met here. Choice D is incomplete because an exchange for shares alone, without attaining control, is taxable.","notes":["Two conditions: solely for stock, and transferor(s) (up to 5 persons) gain at least 51% control.","Transferor's basis in the shares: substituted basis (cost of land, P500,000).","Corporation's basis in the land: transferor's original cost, P500,000."],"upd":"CREATE: no prior BIR ruling or confirmation is required to avail of the tax-free exchange under Sec. 40(C)(2).","key":""},{"id":"Q13-01","quiz":13,"num":1,"sec":"3.3","q":"It refers to the amounts due the taxpayer whether as money lent or uncollected income from goods or services rendered but have become worthless or uncollectible, in part or in whole.","opts":["Bad debts","Securities","Liabilities","Restructured debts"],"ans":0,"exp":"Bad debts are debts due to the taxpayer (loans or uncollected income from sales or services) that have become worthless in whole or in part. Sec. 34(E) allows them as a deduction when actually ascertained worthless and charged off within the taxable year.","notes":["Bad debts are deductible under Sec. 34(E) only if actually worthless and charged off within the year.","Allowance (reserve) method is not allowed; only the direct write-off method.","Recovery of a bad debt previously deducted is income to the extent of the prior tax benefit (tax benefit rule)."],"upd":"","key":""},{"id":"Q13-02","quiz":13,"num":2,"sec":"3.3","q":"Which of the following statements is correct?\nI. In general, a debt is not worthless simply because it is of doubtful value or difficult to collect.\nII. A taxpayer may not postpone a bad debt deduction on the basis of a mere hope of ultimate collection or because of a continuance of attempts to collect notes which have long become overdue, and where there is no showing that the surrounding circumstances differ from those relating to other notes which were charged off in a prior year.\nIII. Accounts receivable, the amount of which is insignificant and the collection of which through court action may be more costly to the taxpayer, may be written off as bad debts even without conclusive evidence that taxpayer's receivable from a debtor has definitely become worthless.","opts":["I, II and III","I and II only","II and III","I only"],"ans":0,"exp":"All three are rules under RR 5-99 (as amended by RR 25-2002). Doubtful collectibility alone does not make a debt worthless; once worthless, the deduction cannot be delayed by a mere hope of collection; and small receivables that would cost more to collect through the courts may be written off without conclusive proof of worthlessness.","notes":["Worthlessness must be ascertained as of the end of the taxable year.","The deduction must be claimed in the year the debt becomes worthless; it cannot be deferred.","Insignificant accounts costlier to collect than their value may be written off."],"upd":"","key":""},{"id":"Q13-03","quiz":13,"num":3,"sec":"3.3","q":"The phrase \"actually charged off from the taxpayer's books of accounts\" means that:\nI. The amount of money lent by the taxpayer (in the course of his business, trade or profession) to his debtor\nII. Had been recorded in his books of account as a receivable has actually become worthless as of the end of the taxable year\nIII. The said receivable has been cancelled and written off from the said taxpayer's books of account.","opts":["I, II and III are correct","Only I and II are correct","Only I and III are correct","Only III is correct"],"ans":0,"exp":"The three parts together form the RR 5-99 definition: money lent in the course of business, recorded as a receivable that has become worthless by year end, and then cancelled and written off from the books. All three are required.","notes":["Charge-off: the receivable is cancelled and written off the books.","A mere allowance for doubtful accounts is not a charge-off.","Write-off must be made within the taxable year the debt became worthless."],"upd":"","key":""},{"id":"Q13
