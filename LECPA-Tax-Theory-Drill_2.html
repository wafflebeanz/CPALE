the local treasurer, who demanded payment of deficiency real property taxes from 2010 to 2021. Has the action prescribed?","opts":["No. The deficiency taxes may be collected within five years from when they fell due.","No. The deficiency taxes for the period 2010 to 2021 may still be collected within 10 years from discovery.","Yes. More than 10 years had lapsed for the period 2010 up to 2020, hence the right to collect the deficiency taxes has prescribed.","Yes. More than 5 years had lapsed for the period 2010 up to 2015."],"ans":1,"exp":"Under Sec. 270 of the Local Government Code, real property tax must be collected within 5 years from the date it becomes due, but in case of fraud or intent to evade payment, the action may be instituted within 10 years from discovery of the fraud or intent to evade. Continuing to declare the land as agricultural after converting it to industrial use shows intent to evade the higher tax, so the 10-year period from the March 2021 discovery applies and all the deficiency taxes from 2010 can still be collected. Choice D would be correct only if no fraud were present.","notes":["RPT collection: 5 years from the date the tax became due (LGC Sec. 270).","Fraud or intent to evade: 10 years from discovery.","Prescription is suspended when the treasurer is legally prevented from collecting, when the taxpayer requests reinvestigation and executes a waiver, or when the taxpayer is out of the country or cannot be located."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Mildly ambiguous: B assumes the continued agricultural declaration shows intent to evade; if fraud were not established, the 5-year rule would apply and taxes due 2010 to 2015 would have prescribed (choice D).","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-06","quiz":97,"num":6,"sec":"8","q":"Under the Local Government Code, what is the maximum interest (penalty) that may be imposed on unpaid local taxes?","opts":["12%","24%","36%","72%"],"ans":3,"exp":"Unpaid local taxes bear interest at not more than 2% per month until fully paid, but the total interest may not exceed 36 months (LGC Sec. 168; the same rule applies to delinquent real property tax under Sec. 255). The ceiling is therefore 2% x 36 months = 72%. The 36% choice confuses the 36-month cap with the rate.","notes":["Local tax surcharge: not more than 25% of the unpaid tax (LGC Sec. 168).","Interest: not more than 2% per month, for a maximum of 36 months (72%).","Delinquent RPT: same 2% per month, maximum 36 months (LGC Sec. 255)."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. The original stem asked for the 'maximum penalty'; reworded to 'maximum interest (penalty)' because the 25% surcharge is imposed separately on top of the 72% interest cap.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-09","quiz":97,"num":9,"sec":"3.10","q":"All of the following are benefits granted to Barangay Micro Business Enterprises (BMBEs) under RA 9178. Which one is a TAX incentive?","opts":["Income tax exemption on income arising from the operations of the enterprise.","Exemption from the coverage of the Minimum Wage Law (employees still receive the same social security and health care benefits as other employees).","Priority to a special credit window set up specifically for the financing requirements of BMBEs.","Technology transfer, production and management training, and marketing assistance programs for BMBE beneficiaries."],"ans":0,"exp":"RA 9178 exempts BMBEs from income tax on income arising from their operations; this is the only tax incentive in the list. The Minimum Wage Law exemption, the special credit window, and the technology, training and marketing assistance programs are non-tax incentives under the same law. Note that the income tax exemption does not cover other taxes such as VAT or percentage tax.","notes":["BMBE: total assets not exceeding P3,000,000, excluding the land on which the office or plant stands.","Tax incentive: exemption from income tax on income from operations only; LGUs are encouraged to reduce or waive local taxes and fees.","BMBE employees are excluded from the Minimum Wage Law but keep SSS and PhilHealth benefits."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. The original stem asked which were 'tax incentives ... except', but all four choices are RA 9178 benefits, so no choice fit; the stem was reworded to ask which one is the tax incentive.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-10","quiz":97,"num":10,"sec":"4.1","q":"For estate tax purposes, which are allowable deductions of a nonresident alien decedent?\nI. Claims, losses, indebtedness and taxes\nII. Transfer for public use\nIII. Property previously taxed\nIV. Family home\nV. Standard deduction\nVI. Medical expenses\nVII. Amounts received under RA 4917 (death benefits)\nVIII. Share of the surviving spouse","opts":["I, II, III and VIII","I, II, III, V and VIII","I, II, III, IV, V and VIII","All of the above"],"ans":1,"exp":"Under Sec. 86(B) as amended by TRAIN, a nonresident alien's estate may deduct the P500,000 standard deduction, a proportionate share of claims, losses, indebtedness and taxes, property previously taxed, and transfers for public use; the share of the surviving spouse in the conjugal or community property is also excluded under Sec. 86(C). The family home and RA 4917 benefits are allowed only to citizens and residents, and medical expenses were removed as a deduction by TRAIN.","notes":["NRA standard deduction: P500,000 (citizens and residents: P5,000,000).","Ordinary deductions of an NRA are prorated: Philippine gross estate over world gross estate, so the world estate must be disclosed.","No family home, RA 4917 or medical expense deduction for an NRA estate."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-11","quiz":97,"num":11,"sec":"4.1","q":"For estate tax purposes, which are allowable deductions of a resident citizen decedent?\nI. Funeral expenses\nII. Judicial expenses\nIII. Claims against the estate, claims against insolvent persons, unpaid mortgages, taxes and losses\nIV. Transfer for public use\nV. Property previously taxed\nVI. Family home\nVII. Standard deduction\nVIII. Medical expenses\nIX. Amounts received under RA 4917 (death benefits)\nX. Share of the surviving spouse","opts":["I, II, III, IV and VIII","I, II, III, IV, V and VIII","I, II, III, IV, V, VI, VII and VIII","III, IV, V, VI, VII, IX and X"],"ans":3,"exp":"TRAIN (RA 10963) removed funeral, judicial and medical expenses as estate tax deductions for decedents dying on or after January 1, 2018. The remaining deductions for a citizen or resident are: claims, claims against insolvent persons, unpaid mortgages, taxes and losses; transfers for public use; property previously taxed (vanishing deduction); family home up to P10,000,000; standard deduction of P5,000,000; RA 4917 benefits; and the share of the surviving spouse. Every other choice includes at least one repealed deduction.","notes":["Funeral, judicial and medical expenses: no longer deductible (TRAIN).","Standard deduction P5,000,000; family home up to P10,000,000 (only the decedent's share if conjugal or community).","RA 4917 retirement benefits are deductible only if included in the gross estate."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. In the source, choices b and c were identical (I, II, III, IV, V and VIII); choice c was changed to 'I, II, III, IV, V, VI, VII and VIII' so every choice is distinct.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-13","quiz":97,"num":13,"sec":"4.2","q":"The Congregation of the Mary Immaculate donated a land and a dormitory building located along Espana Street in favor of the Sisters of the Holy Cross, a group of nuns operating a free clinic and a high school teaching basic spiritual values. Is the donation subject to donor's tax?","opts":["Yes, the donation is subject to donor's tax because the donee is a stranger.","Yes, the donation is subject to donor's tax because it failed to mention whether the donee used a maximum of 30% of the amount or property donated for administrative purposes.","No, the donation is not subject to donor's tax because the donee is a non-stock, non-profit organization engaged principally in religious and educational activities.","No, the donation is exempt from all taxes."],"ans":2,"exp":"Sec. 101(A)(3) exempts gifts to non-stock, non-profit educational, charitable, religious, cultural or social welfare corporations or institutions, provided not more than 30% of the gift is used for administration purposes. The donee is such an institution, so the gift is exempt from donor's tax. Choice A is wrong because TRAIN removed the stranger rate, and choice D overstates the exemption, which covers donor's tax only.","notes":["Donor's tax: 6% of total net gifts in excess of P250,000 per calendar year.","Exempt donees under Sec. 101(A)(3): non-stock, non-profit educational, charitable, religious, cultural, social welfare institutions and accredited NGOs; not more than 30% for administration.","Gifts to the national government or its non-profit agencies and to political subdivisions are also exempt (Sec. 101(A)(2))."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-14","quiz":97,"num":14,"sec":"5.1","q":"Royal Mining, a VAT-registered domestic mining entity, sells gold to the Bangko Sentral ng Pilipinas (BSP). It filed a claim for refund of input VAT on the ground that sales of precious metals to the BSP are considered export sales subject to zero-rated VAT. Is Royal Mining's claim meritorious?","opts":["Yes, sale of gold to the BSP is a deemed zero-rated transaction.","Yes, sale of gold to the BSP is deemed an export sale; hence, the input VAT thereon may be credited or refunded.","No, sale of gold to the BSP is exempt; hence, the input VAT is treated as cost or expense and cannot be refunded.","No, sale of gold to the BSP is VATable; hence, the input VAT is creditable but not refundable."],"ans":2,"exp":"TRAIN removed the sale of gold to the BSP from the list of export sales subject to 0% VAT and made it VAT-exempt under Sec. 109(1)(Z). Input VAT attributable to exempt sales cannot be credited or refunded; it forms part of the cost or expense. Only zero-rated or effectively zero-rated sales give rise to a refund claim under Sec. 112.","notes":["Sale of gold to the BSP: VAT-exempt (TRAIN), no longer zero-rated.","Input VAT on exempt sales: not creditable, not refundable; charge to cost or expense.","Refund of input VAT (Sec. 112) is available only for zero-rated or effectively zero-rated sales: claim within 2 years after the close of the quarter of the sale."],"upd":"TRAIN: sale of gold to the BSP became VAT-exempt; before TRAIN it was treated as an export sale subject to 0% VAT, which is the premise of the claim in the stem.","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-15","quiz":97,"num":15,"sec":"5.2","q":"Congress enacts a law imposing a 5% tax on gross receipts of common carriers. The law does not define 'gross receipts.' Express Transport, Inc., a bus company plying the Manila to Baguio route, has time deposits with ABC Bank and earned P1,000,000 interest, net of the 20% final withholding tax. The BIR wants to collect the 5% gross receipts tax on the interest income without deducting the 20% final withholding tax. Is the BIR correct?","opts":["Yes, gross receipts mean cash collected, whether actually or constructively, without any deductions.","Yes, gross receipts mean all cash collections actually received without any deductions.","No, gross receipts mean actual receipts after deducting the withholding tax.","No, gross receipts mean actual receipts derived from business operations."],"ans":3,"exp":"A gross receipts tax on common carriers is a business tax on receipts derived from the carrier's business of transporting passengers or goods. Interest on time deposits is passive income already subject to final tax and is not derived from the bus company's transport operations, so it is not part of the base at all. Choices A and B state the rule that would apply if the income were part of the business (for banks, interest is operating income and the gross receipts tax base includes the final tax withheld).","notes":["Common carrier's tax (Sec. 117): 3% of quarterly gross receipts of domestic land carriers of passengers; EOPT removed the minimum quarterly gross receipts rule.","For banks (Sec. 121), interest is operating income and the GRT base includes the 20% final tax withheld.","Passive income subject to final tax is not part of a common carrier's gross receipts from operations."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-16","quiz":97,"num":16,"sec":"5.1","q":"Lily's Fashion, Inc. is a garment manufacturer registered as a Subic Bay Freeport Enterprise under RA 7227 and is a non-VAT taxpayer exempt from all local and national internal revenue taxes. Its suppliers of supplies and materials passed on to it 12% VAT amounting to P500,000. What is the proper remedy of Lily's Fashion, Inc.?","opts":["Use the P500,000 as a tax credit.","Ask for a refund of the P500,000.","Convert the P500,000 into tax warrants.","Charge the P500,000 to cost or expense."],"ans":3,"exp":"VAT is an indirect tax: the statutory taxpayer is the seller, and the buyer merely bears the economic burden. A non-VAT, tax-exempt buyer has no output VAT against which to credit input VAT, and it cannot claim a refund because only the statutory taxpayer may do so (Silkair (Singapore) Pte. Ltd. v. CIR; Contex Corp. v. CIR). The VAT passed on therefore forms part of its cost; the proper course was for the supplier to treat the sale as effectively zero-rated.","notes":["Tax exemption of the buyer does not shift the refund right to it; the proper claimant for indirect taxes is the statutory taxpayer (seller).","Local sales of goods and services to ecozone or freeport registered export enterprises may be zero-rated if directly attributable to the registered project or activity (CREATE MORE).","Input VAT that cannot be credited or refunded is charged to cost or expense."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Some argue the exempt buyer may claim a refund (choice B), but prevailing jurisprudence holds that only the statutory taxpayer (the supplier) may claim it, so D is the best answer.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-17","quiz":97,"num":17,"sec":"1.9","q":"The Commissioner or his authorized representative is empowered to suspend the business operations and temporarily close the business establishment of any person (Oplan Kandado) for:","opts":["Failure of a VAT-registered person to issue receipts or invoices.","Failure of a VAT-registered person to file a VAT return as required by the Tax Code.","Understatement of taxable sales or receipts by 30% or more of the correct taxable sales or receipts for the taxable quarter.","All of the above"],"ans":3,"exp":"Sec. 115 authorizes the CIR or his authorized representative to suspend business operations and temporarily close an establishment for not less than 5 days in the case of a VAT-registered person who fails to issue receipts or invoices, fails to file a VAT return, or understates taxable sales or receipts by 30% or more for the quarter. Failure of any person to register as required under Sec. 236 is also a ground.","notes":["Closure: not less than 5 days, lifted only upon compliance with the requirements in the closure order.","Grounds: failure to issue invoices, failure to file the VAT return, understatement of 30% or more, failure to register.","EOPT: the invoice is now the primary sales document; the official receipt is only supplementary."],"upd":"EOPT: the invoice replaced the official receipt as the primary document for sales of goods and services.","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-18","quiz":97,"num":18,"sec":"1.9","q":"First statement: Failure of any person to register as required by the Tax Code shall result in his being temporarily closed for not less than five (5) days, and the closure shall be lifted only upon compliance with whatever requirements are prescribed by the Commissioner in the closure order.\nSecond statement: The period to register as a VAT taxpayer with the appropriate Revenue District Office is within ten (10) days from date of employment.","opts":["True; False","True; True","False; True","False; False"],"ans":0,"exp":"The first statement restates Sec. 115(b): failure to register under Sec. 236 is a ground for suspension and temporary closure of not less than 5 days, lifted upon compliance with the closure order. The second statement is false: the 10-days-from-employment period applies to employees securing their registration (TIN), not to VAT registration, which is required of persons whose gross sales exceed the P3,000,000 threshold or who opt to register.","notes":["Employees: register within 10 days from the date of employment.","Businesses: register before the start of business; VAT registration is mandatory once gross sales exceed P3,000,000 in any 12-month period.","Failure to register is a ground for temporary closure under Sec. 115(b)."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-22","quiz":97,"num":22,"sec":"5.1","q":"The VAT on goods:","opts":["Is a selling expense of the trader.","Is imposed on goods for domestic consumption.","Is not based on net sales.","May be due even if there is no actual sale of the goods."],"ans":3,"exp":"VAT may be due without an actual sale in the transactions deemed sale under Sec. 106(B): transfer, use or consumption not in the course of business, distribution to shareholders or creditors, consignment not sold within 60 days, and retirement or cessation of business. Choice A is wrong because VAT is passed on to the buyer, not an expense of the seller. Choice B describes the destination principle, but it is imprecise because export sales of goods are still within the VAT system at 0%, and choice C is wrong because the base is the gross selling price net of returns, allowances and discounts.","notes":["Deemed sale: VAT due without an actual sale (Sec. 106(B)).","Destination principle: goods consumed in the Philippines are taxed; exports are zero-rated.","VAT is an indirect tax passed on to the buyer; it is not an expense of the seller."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Ambiguous: choice B (destination principle) is also defensible; D was chosen because it is unqualifiedly true, while B overlooks that export sales of goods are still subject to VAT at 0%.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-23","quiz":97,"num":23,"sec":"5.1","q":"Value-added tax is an example of:","opts":["Graduated tax","Progressive tax","Proportional tax","Regressive tax"],"ans":2,"exp":"As to rate, VAT is a proportional tax: a single flat rate (12%, or 0% for zero-rated sales) applies regardless of the amount of the tax base. It is sometimes described as regressive in effect because the burden weighs heavier on lower-income consumers, but it is not graduated or progressive, since the rate does not rise as the base increases.","notes":["Proportional: flat rate regardless of base (VAT, percentage taxes).","Progressive or graduated: rate increases as the base increases (individual income tax).","Tolentino v. Secretary of Finance: the Constitution does not prohibit regressive taxes; it only directs Congress to evolve a progressive system of taxation."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Ambiguous: VAT is proportional as to rate but regressive in effect, so choice D is defensible if the item refers to impact; C was chosen because tax classification by rate is the usual basis.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-24","quiz":97,"num":24,"sec":"5.1","q":"Any person who, in the course of trade or business, sells, barters, exchanges or leases goods or properties, renders services, and any person who imports goods shall be subject to:","opts":["Business tax","VAT","Other percentage tax","Excise tax"],"ans":1,"exp":"The stem restates Sec. 105, which defines the persons liable to value-added tax. Although VAT is a business tax, choice B is the specific tax the provision imposes. Other percentage taxes apply to specific businesses or to non-VAT persons, and excise taxes apply only to specific goods such as alcohol, tobacco, petroleum, vehicles and minerals.","notes":["Sec. 105: VAT applies to sale, barter, exchange or lease of goods or properties, sale of services, and importation.","The importer is liable to VAT even if not in business.","'In the course of trade or business' includes transactions incidental to the business and those of nonstock, nonprofit entities."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-25","quiz":97,"num":25,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Medical services such as dental and veterinary services rendered by professionals.","Legal services.","Services arising from an employer-employee relationship.","Services rendered by domestic air transport companies."],"ans":2,"exp":"Services rendered by individuals under an employer-employee relationship are exempt from VAT (Sec. 109(1)(I)); compensation is subject to income tax only. Medical, dental, hospital and veterinary services are exempt except those rendered by professionals (Sec. 109(1)(G)), so choice A is VATable. Legal services and domestic air transport of passengers or cargo are subject to 12% VAT.","notes":["Medical, dental, hospital, veterinary services: exempt EXCEPT those rendered by professionals.","Employer-employee services: exempt from VAT.","International air and shipping carriers: exempt from VAT, subject to the 3% percentage tax on outgoing transport (Sec. 118)."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-26","quiz":97,"num":26,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Sale of non-food agricultural products in their original state.","Sale of non-food marine and forest products in their original state.","Sale of cotton and cotton seeds.","Sale of agricultural food products in their original state."],"ans":3,"exp":"Sec. 109(1)(A) exempts the sale or importation of agricultural and marine FOOD products in their original state, livestock and poultry generally used for human food, and breeding stock and genetic materials. Non-food agricultural, marine and forest products are VATable, and the exemption of cotton and cotton seeds was removed, so choices A to C are subject to VAT.","notes":["Original state includes simple processes: freezing, drying, salting, broiling, roasting, smoking, stripping; also polished or husked rice, corn grits, raw cane sugar, molasses, ordinary salt, copra.","Non-food agricultural products (ornamental plants, cotton): VATable.","Fertilizers, seeds, seedlings, fingerlings and feeds (except for specialty animals such as race horses and fighting cocks): exempt (Sec. 109(1)(B))."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-27","quiz":97,"num":27,"sec":"5.1","q":"Which of the following transactions is exempt from value-added tax?","opts":["Sale of books, newspapers and magazines.","Sale of works of art.","Sale of literary works.","Sale of musical compositions."],"ans":0,"exp":"Sec. 109(1)(R) exempts the importation, printing, publication or sale of books and of newspapers, magazines, journals, reviews or bulletins that appear at regular intervals with fixed prices and are not devoted principally to paid advertisements; CREATE extended this to their digital or electronic format. Works of art, literary works and musical compositions are not among the Sec. 109 exemptions, so their sale is subject to VAT if the seller is VAT-registered or exceeds the threshold.","notes":["Books and periodicals: exempt, including digital or electronic format (CREATE).","Periodicals must appear at regular intervals, have fixed prices, and not be devoted principally to paid advertisements.","Transactions not in Sec. 109 follow the general rule: VAT if over P3,000,000 or VAT-registered; otherwise 3% percentage tax."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-28","quiz":97,"num":28,"sec":"5.1","q":"Which of the following transactions is subject to value-added tax?","opts":["Services subject to other percentage tax.","Educational services duly approved by DepEd, CHED and TESDA, or those operated by the government.","Sale of coal and natural gas.","Lending activities by credit cooperatives."],"ans":2,"exp":"The sale of coal and natural gas is subject to 12% VAT; RA 9337 removed their former exemption (petroleum products are likewise VATable, on top of excise tax). Services subject to percentage tax, accredited educational services, and lending by credit cooperatives are all exempt under Sec. 109(1)(E), (H) and (M).","notes":["Coal, natural gas and petroleum products: VATable (RA 9337).","Private educational services must be accredited by DepEd, CHED or TESDA to be exempt.","Credit cooperatives: exempt on lending activities to members; agricultural cooperatives exempt on sales of their members' produce."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-31","quiz":97,"num":31,"sec":"5.1","q":"Which of the following transactions is subject to value-added tax?","opts":["Sale of petroleum products.","Sale of fertilizers and seeds, including their ingredients.","Sale by agricultural contract growers.","Sale of goods, services or importation where annual gross receipts do not exceed P3,000,000."],"ans":0,"exp":"Petroleum products are subject to 12% VAT in addition to excise tax. Fertilizers and seeds (Sec. 109(1)(B)) and services of agricultural contract growers (Sec. 109(1)(F)) are exempt, and sales by persons whose annual gross sales do not exceed P3,000,000 are exempt under Sec. 109(1)(V), subject to the 3% percentage tax unless they opt for VAT.","notes":["Petroleum products: VAT plus excise tax.","Agricultural contract growers (raising poultry or livestock for others): exempt.","VAT threshold: P3,000,000 of annual gross sales; below it, 3% percentage tax (or 8% income tax option)."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-32","quiz":97,"num":32,"sec":"5.1","q":"Which of the following transactions is subject to zero-rated value-added tax?","opts":["Services rendered to persons engaged in international shipping or air transport operations.","Services rendered by banks and non-bank financial intermediaries.","Generation, transmission and distribution of electricity.","Services rendered by professionals such as CPAs, physicians and lawyers."],"ans":0,"exp":"Services rendered to persons engaged in international shipping or international air transport operations, including leases of property for their use, are zero-rated under Sec. 108(B)(4), provided they are exclusively for international shipping or air transport operations. Banks and NBFIs are VAT-exempt and pay gross receipts tax; sale of electricity is generally subject to 12% VAT (only power from renewable sources is zero-rated); and professional services are subject to 12% VAT.","notes":["Sec. 108(B)(4): services to international carriers are zero-rated only if used exclusively for international operations.","Banks and NBFIs: exempt from VAT, subject to gross receipts tax (Sec. 121).","Sale of power or fuel generated through renewable sources: zero-rated."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-33","quiz":97,"num":33,"sec":"5.1","q":"Which of the following is NOT exempt from VAT?","opts":["Services rendered by schools duly accredited by the Philippine government.","Sale of digital or electronic books, as well as journals covered by UNESCO.","Sale of prescription medicines for cancer, mental illness, tuberculosis and kidney disease.","Sale of capital equipment for COVID-19 response."],"ans":3,"exp":"The VAT exemption for capital equipment, spare parts and raw materials for producing COVID-19 personal protective equipment, and for COVID-19 drugs, vaccines and medical devices, applied only from January 1, 2021 to December 31, 2023 (CREATE), so it no longer exists. Accredited educational services (Sec. 109(1)(H)), books and journals including their digital or electronic format (Sec. 109(1)(R)), and prescription drugs for cancer, mental illness, tuberculosis and kidney disease (CREATE) remain exempt.","notes":["COVID-19 VAT exemptions expired on December 31, 2023.","Prescription drugs for diabetes, high cholesterol, hypertension, cancer, mental illness, tuberculosis and kidney disease: VAT-exempt.","Books, newspapers and journals: exempt, including digital or electronic formats (CREATE)."],"upd":"CREATE: the COVID-19 capital equipment exemption was temporary (January 1, 2021 to December 31, 2023) and is no longer in effect.","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-34","quiz":97,"num":34,"sec":"5.1","q":"Which of the following transactions is subject to zero-rated value-added tax?","opts":["Services by regional or area headquarters of multinational corporations.","Sale of goods and services to a PEZA-registered export enterprise, directly attributable to its registered project or activity.","Sales by non-agricultural, non-electric, non-credit cooperatives.","Importation of professional instruments and implements by settlers in the Philippines."],"ans":1,"exp":"Sales to ecozone or freeport registered export enterprises are effectively zero-rated under the cross-border doctrine, and CREATE MORE allows zero-rating of local purchases of goods and services directly attributable to the registered project or activity (including those incidental to and reasonably necessary for it). Services by regional or area headquarters (Sec. 109(1)(J)), sales by non-agricultural, non-electric, non-credit cooperatives (Sec. 109(1)(N)) and importation of professional instruments by settlers (Sec. 109(1)(D)) are VAT-exempt, not zero-rated.","notes":["Zero-rated local purchases of registered export enterprises: goods and services directly attributable to the registered project, including incidental and reasonably necessary ones (CREATE MORE).","RHQ services: VAT-exempt; RHQs may not derive income in the Philippines.","Cooperative exemption (non-agricultural, non-electric, non-credit): share capital contribution of each member not exceeding P15,000."],"upd":"CREATE MORE: zero-rating of local purchases by registered export enterprises now covers goods and services directly attributable to the registered project or activity (CREATE's test was 'directly and exclusively used'). The original choice read 'Sale to Philippine Economic Zone Authority.'","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-35","quiz":97,"num":35,"sec":"5.1","q":"Which of the following businesses is allowed a presumptive input VAT?","opts":["Manufacturer of canned goods.","Manufacturer of packed juices.","Manufacturer of packed noodles.","Manufacturer of dried fish."],"ans":2,"exp":"Under Sec. 111(B), persons engaged in processing sardines, mackerel and milk, and in manufacturing refined sugar, cooking oil and packed noodle-based instant meals, are allowed a presumptive input tax of 4% of the gross value in money of their purchases of primary agricultural products used as inputs. Canned goods and packed juices are not in the list, and dried fish is a marine food product in its original state (drying is a simple process), so its sale is exempt.","notes":["Presumptive input VAT: 4% of purchases of primary agricultural products used as inputs.","Covered: sardines, mackerel, milk, refined sugar, cooking oil, packed noodle-based instant meals.","Transitional input VAT (2% of beginning inventory or actual VAT paid, whichever is higher) is a different credit."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-36","quiz":97,"num":36,"sec":"4.1","q":"The following are included in the gross estate of a decedent, EXCEPT:","opts":["Inter vivos donations of the decedent not in contemplation of death.","Revocable transfers made by the decedent prior to death.","Conjugal or community properties, whether under the ACP or the CPG.","Proceeds of life insurance where the designation of the third-party beneficiary is revocable."],"ans":0,"exp":"A completed donation inter vivos not made in contemplation of death is already subject to donor's tax and is no longer owned by the decedent, so it is excluded from the gross estate. Revocable transfers (Sec. 85(C)) and life insurance with a revocable beneficiary (Sec. 85(E)) are included, and the entire conjugal or community property is included in the gross estate, with the surviving spouse's one-half share then deducted under Sec. 86(C).","notes":["Included: transfers in contemplation of death, revocable transfers, property under a general power of appointment, transfers for insufficient consideration (excess of FMV over consideration).","Life insurance: included if the beneficiary is the estate, executor or administrator, or a third person designated revocably.","Community or conjugal property is included in full; the surviving spouse's share is deducted."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-48","quiz":97,"num":48,"sec":"3.7","q":"A few weeks after filing his 2024 annual income tax return, an individual taxpayer discovered deductible business expenses that he failed to claim. Can he still file an amended 2024 annual ITR?","opts":["Yes. He has 3 years from the time he filed his 2024 ITR to file an amended return, provided no notice for audit or investigation of such return has, in the meantime, been actually served upon him.","Yes. He has 5 years from the time he filed his 2024 ITR to file an amended return, provided no notice for audit or investigation of such return has, in the meantime, been actually served upon him.","Yes. He has 3 years from the time he filed his 2024 ITR to file an amended return, regardless of any notice for audit or investigation of such return that has been served upon him.","Yes. He has 5 years from the time he filed his 2024 ITR to file an amended return, regardless of any notice for audit or investigation of such return that has been served upon him."],"ans":0,"exp":"Sec. 6(A) allows a return to be modified, changed or amended within three years from the date of filing, provided no notice for audit or investigation of the return (such as a Letter of Authority) has in the meantime been actually served upon the taxpayer. The 3-year period matches the ordinary period to assess, and the 5-year period in B and D is the period to collect. Once an audit notice is served, the taxpayer can no longer amend.","notes":["Amendment: within 3 years from filing, only before a notice of audit or investigation is actually served (Sec. 6(A)).","A substantially amended return may reset the 3-year assessment period, counted from its filing (CIR v. Phoenix Assurance).","Assessment: 3 years from the deadline or actual filing, whichever is later; collection: 5 years from assessment."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-50","quiz":97,"num":50,"sec":"4.2","q":"The taxability of a property transferred as a donation subject to donor's tax primarily depends on:","opts":["The relationship between the transferor and the transferee and the market value of the property.","Whether the transfer results in an economic benefit to the transferee, regardless of the transferor's intent.","Whether the transfer is gratuitous, meaning it is made without adequate consideration between living persons with donative intent.","Whether the property transferred will form part of the gross estate of the transferor upon death."],"ans":2,"exp":"Donor's tax is an excise on the privilege of gratuitously transferring property between living persons (Sec. 98), so taxability depends on whether the transfer is a gift: gratuitous, inter vivos, and generally with donative intent. Choice A is wrong because TRAIN removed the relative/stranger distinction and imposes a flat 6% rate. Choice D describes the estate tax concept, not the donor's tax.","notes":["Donor's tax: 6% of net gifts in excess of P250,000 per calendar year; return within 30 days after the gift.","Relationship no longer matters (TRAIN): no more stranger rate.","Sec. 100: transfer for less than adequate consideration is a deemed gift even without donative intent, except a sale in the ordinary course of business (bona fide, arm's length, free of donative intent)."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Choice B is partly defensible because Sec. 100 taxes transfers for insufficient consideration without regard to donative intent, but C states the general basis of a taxable gift and is the best answer.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-51","quiz":97,"num":51,"sec":"4.2","q":"In which of the following situations involving a transfer of property for less than fair market value between living persons is a taxable gift most likely to occur?","opts":["A sale of perishable goods between unrelated parties at a slightly discounted price due to market conditions.","An exchange of dissimilar properties between corporations as part of a business reorganization.","A parent sells a valuable piece of jewelry to his or her adult child at a price significantly below its appraised value, without any apparent business motive.","An employer provides a below-market loan to an employee as part of a compensation package."],"ans":2,"exp":"Under Sec. 100, when property (other than real property subject to capital gains tax) is transferred for less than adequate and full consideration, the excess of FMV over the consideration is a deemed gift. The parent-to-child sale far below appraised value with no business motive fits this rule. A market-driven discount is a sale in the ordinary course of business (bona fide, at arm's length, free of donative intent); a reorganization exchange is a business transaction; and a below-market employee loan is compensation or a fringe benefit, not a gift.","notes":["Deemed gift = FMV minus consideration received (Sec. 100).","Exception: sale in the ordinary course of business, bona fide, at arm's length and free from donative intent (RR 12-2018).","Real property that is a capital asset sold below FMV is subject to 6% CGT on the higher value instead, not donor's tax."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-52","quiz":97,"num":52,"sec":"5.1","q":"Ready Wear Go Corporation, a VAT-registered t-shirt manufacturer, sold two fully depreciated cars used by its executives, one to its manager and the other to its CFO, and charged no VAT on either sale. Which statement is correct?","opts":["Both sales are exempt from VAT because the corporation's primary business is the sale of t-shirts, not cars.","Both sales are subject to VAT as they are transactions incidental to the pursuit of a commercial activity or business.","The sale to the manager is subject to VAT, while the sale to the CFO is exempt as it is considered a transfer within the company.","Neither sale is subject to VAT because the cars were fully depreciated and are considered to have no market value."],"ans":1,"exp":"Under Sec. 105, transactions 'in the course of trade or business' include those incidental to the regular business. The sale by a VAT-registered person of assets used in its business, such as company cars, is incidental and subject to 12% VAT even if the assets are fully depreciated (Mindanao II Geothermal Partnership v. CIR). The identity of the buyer does not matter, and full depreciation affects only the book value, not taxability.","notes":["Incidental transactions of a VAT-registered person are subject to VAT (Sec. 105).","Fully depreciated assets sold remain subject to VAT on the selling price.","An isolated sale by a person not in business, or of personal (non-business) property, is not subject to VAT."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-66","quiz":97,"num":66,"sec":"4.1","q":"Which of the following does NOT escape the estate tax?","opts":["Devise of real property in favor of St. Francis Church.","Merger of the usufruct in the owner of the naked title to the property.","Transmission via a special power of appointment of personal property to the City of Manila.","Legacy transmitted by the fiduciary heir to the second heir in a fideicommissary substitution."],"ans":0,"exp":"Sec. 87 exempts the merger of usufruct in the owner of the naked title (87(A)), the transmission from the fiduciary heir to the fideicommissary (87(B)), and bequests or devises to social welfare, cultural and charitable institutions meeting the 30% administration limit (87(D)). A transfer to the City of Manila is deductible as a transfer for public use, and property passing under a special (not general) power of appointment is not included in the holder's gross estate. A devise to a church is not among the Sec. 87 exemptions (which, unlike Sec. 101 for donor's tax, do not name religious institutions), and the constitutional exemption for religious property covers only property taxes, so it does not escape the estate tax.","notes":["Sec. 87 exempt transfers: merger of usufruct, fideicommissary transmission, transfer to another beneficiary per the predecessor's wish, bequests to social welfare, cultural and charitable institutions.","Transfers for public use: to the government or its political subdivisions, deductible from the gross estate.","Only property passing under a GENERAL power of appointment is included in the gross estate (Sec. 85(D))."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law. Ambiguous: if the church were shown to be a charitable institution meeting the Sec. 87(D) conditions, the devise would also be exempt; A was chosen because Sec. 87(D) does not list religious institutions while every other choice clearly escapes the tax.","src":"CPAR B97 Final Preboard (May 2025)"},{"id":"PB97-F-67","quiz":97,"num":67,"sec":"4.2","q":"A domestic corporation engaged in financial consultancy, through its Board of Directors, decided to donate P1,500,000 to the campaign of a senatorial candidate in the May 2025 elections. Which statement is correct?","opts":["The donation is subject to donor's tax, but it can be used as a deduction in the corporation's ITR.","The donation is not subject to donor's tax, but it cannot be used as a deduction in the corporation's ITR.","The donation is not subject to donor's tax, and it can be used as a deduction in the corporation's ITR.","The corporation and its owners should be reprimanded for supporting the candidate."],"ans":1,"exp":"Under Sec. 99(C) as amended by TRAIN, contributions to candidates, political parties or coalitions for campaign purposes are governed by the Election Code, under which contributions duly reported to COMELEC are not subject to donor's tax. However, political contributions are not deductible from gross income: they are neither ordinary and necessary business expenses nor qualified charitable contributions under Sec. 34(H).","notes":["Campaign contributions duly reported to COMELEC: exempt from donor's tax.","Political contributions: not deductible for income tax purposes.","Unutilized or excess campaign funds of a candidate are subject to income tax."],"upd":"","key":"No Taxation answer key was provided (the uploaded key is for RFBT); answer determined under current law.","src":"CPAR B97 Final Preboard (May 2025)"}];

function shortSrc(q){return q.src?q.src.replace(/^CPAR /,"").replace(/ \(.*\)$/,""):"Q"+q.quiz}

const app = document.getElementById("app");

function fmtStem(q){
  return q.split("\n").map((l,i)=>`<p class="${i>0?"st":""}">${esc(l)}</p>`).join("");
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function itemsIn(secId){return POOL().filter(q=>q.sec===secId)}
function stats(list){let c=0,w=0;list.forEach(q=>{if(hist[q.id]===1)c++;else if(hist[q.id]===0)w++});return {c,w,n:list.length}}
function sortSyl(list){return list.slice().sort((a,b)=>(ORDER[a.sec]-ORDER[b.sec])||(a.quiz-b.quiz)||(a.num-b.num))}

/* ---------- HOME ---------- */
function renderHome(){
  S=null;
  const BANK=POOL();

  const all=stats(BANK);

  const upds=BANK.filter(q=>q.upd);
  const flags=BANK.filter(q=>q.key);
  let h=`<header class="mast">

    <button class="qbtn" data-q="missed" ${missed.length?"":"disabled"}><b>Review missed</b><small>${missed.length} answered wrong last time</small></button>

  SYL.forEach(p=>{
    const items=BANK.filter(q=>p.subs.some(s=>s.id===q.sec));

    } else {

        const list=itemsIn(s.id); if(!list.length) return;

        const gw=(st.c/st.n*100).toFixed(1), rw=(st.w/st.n*100).toFixed(1);
        const quizzes=[...new Set(list.slice().sort((a,b)=>a.quiz-b.quiz).map(shortSrc))].join(", ");
        h+=`<div class="row">
          <input type="checkbox" id="sel-${s.id}" data-sec="${s.id}" ${selected.has(s.id)?"checked":""}>
          <div class="t"><label for="sel-${s.id}"><span class="sc">${s.code}</span>${esc(s.name)}</label>
            <div class="meta"><span>${list.length} items</span><span>from ${quizzes}</span><span class="bar" title="${st.c} right, ${st.w} wrong"><i class="g" style="width:${gw}%"></i><i class="r" style="width:${rw}%"></i></span><span>${st.c}/${st.n} right</span></div></div>
          <button class="go" data-go="${s.id}">Drill</button>
        </div>`;
      });
    }
    h+=`</section>`;
  });
  h+=cp?`<p class="srcnote">Source: CPA Review School of the Philippines (CPAR) Taxation preboard examinations. Computational problems are left out. Where a key was outdated or wrong under current law, the answer here follows current law and the item's answer key note says what the source had. The B97 final preboard came with an RFBT key, so its answers were set under current law; each B97 item says so. Your progress is saved in this browser only.</p>`:`<p class="srcnote">Source: ReSA, The Review School of Accountancy, CPA Review Batch 51 TAX quizzes 1 to 23 (prepared by A. Tamayo and TeamTax). Computational and situational problems are left out; single-rule items with numbers are kept. Where the source key conflicts with current law, the answer here follows current law and the item says so. Your progress is saved in this browser only.</p>`;
  app.innerHTML=h;
  startbar.hidden=false; updSel();
  app.querySelectorAll("[data-sec]").forEach(cb=>cb.addEventListener("change",()=>{cb.checked?selected.add(cb.dataset.sec):selected.delete(cb.dataset.sec);updSel()}));
  app.querySelectorAll("[data-go]").forEach(b=>b.addEventListener("click",()=>{const s=b.dataset.go;start(sortSyl(itemsIn(s)),SUBNAME[s].code+" "+SUBNAME[s].name)}));
  app.querySelector("#selall").onclick=()=>{SYL.forEach(p=>p.subs.forEach(s=>{if(itemsIn(s.id).length)selected.add(s.id)}));renderHome()};
  app.querySelector("#selnone").onclick=()=>{selected.clear();renderHome()};
  const rs=app.querySelector("#reset");
  if(rs) rs.onclick=()=>{
    if(rs.dataset.armed){hist={};saveHist();renderHome();}
    else{rs.dataset.armed="1";rs.textContent="Tap again to erase progress";setTimeout(()=>{if(rs.isConnected){delete rs.dataset.armed;rs.textContent="Reset my progress"}},4000)}
  };
  app.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.tab===tab)return;tab=b.dataset.tab;try{localStorage.setItem(LS_KEY+"-tab",tab)}catch(e){}selected.clear();renderHome();}));
  app.querySelectorAll("[data-exam]").forEach(b=>b.addEventListener("click",()=>{const e=EXAMS[+b.dataset.exam];start(BANK.filter(q=>q.src===e).sort((a,c)=>a.num-c.num),e)}));
  app.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>{
    const k=b.dataset.q;
    if(k==="mixed") start(shuffle(BANK).slice(0,25),"Mixed drill");
    if(k==="unseen") start(shuffle(unseen).slice(0,25),"New items");
    if(k==="missed") start(shuffle(missed),"Review missed");
    if(k==="upd") start(sortSyl(upds),"Law updates");
    if(k==="flag") start(sortSyl(flags),"Answer key notes");
  }));
}
function updSel(){
  const n=[...selected].reduce((a,s)=>a+itemsIn(s).length,0);
  document.getElementById("selsum").innerHTML=selected.size?`<b>${n}</b> items in ${selected.size} topic${selected.size>1?"s":""}`:`Tick topics below to build a custom drill`;
  document.getElementById("startsel").disabled=!selected.size;
}
document.getElementById("startsel").addEventListener("click",()=>{
  let list=POOL().filter(q=>selected.has(q.sec));
  const ord=document.getElementById("ord").value, len=+document.getElementById("len").value;
  list = ord==="shuffle"?shuffle(list):sortSyl(list);
  if(len) list=list.slice(0,len);
  start(list,"Custom drill");
});

/* ---------- QUIZ ---------- */
function start(list,title){
  if(!list.length) return;
  S={list,title,i:0,picks:{},score:0,streak:0,best:0};
  startbar.hidden=true; window.scrollTo(0,0); renderQ();
}
function renderQ(){
  const q=S.list[S.i]; const pick=S.picks[q.id];
  const done=pick!==undefined;
  const sub=SUBNAME[q.sec];
  const L="abcde";
  let h=`<div class="qtop">
    <div class="l1"><button class="back" id="quit">Topics</button><span class="where">${esc(S.title)} &middot; ${esc(sub.code+" "+sub.name)}</span>
      <span class="chips"><span class="chip">${S.i+1}/${S.list.length}</span><span class="chip">Score ${S.score}</span><span class="chip ${S.streak>=3?"hot":""}">Streak ${S.streak}</span></span></div>
    <div class="prog"><i style="width:${(S.i+(done?1:0))/S.list.length*100}%"></i></div>
  </div>
  <article class="card" aria-live="polite">
    <div class="hdr"><span class="itm">${q.id}</span><span>${q.src?esc(q.src):"Quiz "+q.quiz+": "+esc(QUIZNAMES[q.quiz])}, item ${q.num}</span>${q.upd?'<span class="tag">Law update</span>':''}${q.key?'<span class="tag flag">Key note</span>':''}${done?`<span class="stamp ${pick===q.ans?"ok":"no"}">${pick===q.ans?"Correct":"Review"}</span>`:""}</div>
    <div class="stem">${fmtStem(q.q)}</div>
    <div class="opts">`;
  q.opts.forEach((o,k)=>{
    let cls="", mk="";
    if(done){ if(k===q.ans){cls="correct";mk="ANSWER"} else if(k===pick){cls="wrong";mk="YOUR PICK"} else cls="dim"; }
    h+=`<button class="opt ${cls}" data-k="${k}" ${done?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o)}</span><span class="mk">${mk}</span></button>`;
  });
  h+=`</div>`;
  if(done){
    h+=`<div class="reveal">
      <div class="exp"><h4>Why ${L[q.ans]} is correct</h4><p>${esc(q.exp)}</p></div>
      <div class="notes"><h4>Remember</h4><ul>${q.notes.map(n=>`<li><span>${esc(n)}</span></li>`).join("")}</ul></div>
      ${q.upd?`<div class="box"><h4>Law update</h4>${esc(q.upd)}</div>`:""}
      ${q.key?`<div class="box flag"><h4>Answer key note</h4>${esc(q.key)}</div>`:""}
    </div>`;
  }
  h+=`</article>
  <div class="nav"><span class="hint">${done?"Enter or → for next":"Press a to "+L[q.opts.length-1]+" or 1 to "+q.opts.length}</span>
    <div style="display:flex;gap:8px">${done?"":`<button class="btn ghost" id="skip">Skip</button>`}<button class="btn" id="next" ${done?"":"hidden"}>${S.i+1<S.list.length?"Next item":"See results"}</button></div></div>`;
  app.innerHTML=h;
  app.querySelector("#quit").onclick=()=>{ if(Object.keys(S.picks).length) renderResults(); else renderHome(); };
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
  const nx=app.querySelector("#next"); if(nx) nx.onclick=next;
  const sk=app.querySelector("#skip"); if(sk) sk.onclick=next;
  if(done){ nx.focus({preventScroll:true}); const r=app.querySelector(".reveal"); if(r && r.getBoundingClientRect().top>window.innerHeight*0.8) r.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"}); }
}
function answer(k){
  const q=S.list[S.i]; if(S.picks[q.id]!==undefined) return;
  S.picks[q.id]=k;
  if(k===q.ans){S.score++;S.streak++;S.best=Math.max(S.best,S.streak);hist[q.id]=1}
  else{S.streak=0;hist[q.id]=0}
  saveHist(); renderQ();
}
function next(){
  if(S.i+1<S.list.length){S.i++;renderQ();window.scrollTo(0,0)} else renderResults();
}
document.addEventListener("keydown",e=>{
  if(!S || app.querySelector(".res")) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const q=S.list[S.i]; const done=S.picks[q.id]!==undefined;
  const key=e.key.toLowerCase();
  if(!done){
    let k=-1;
    if(/^[1-5]$/.test(key)) k=+key-1;
    else if(/^[a-e]$/.test(key)) k=key.charCodeAt(0)-97;
    if(k>=0 && k<q.opts.length){e.preventDefault();answer(k)}
  } else if(key==="enter"||key==="arrowright"){ if(document.activeElement && document.activeElement.id==="next" && key==="enter") return; e.preventDefault(); next(); }
});

/* ---------- RESULTS ---------- */
function renderResults(){
  const answered=S.list.filter(q=>S.picks[q.id]!==undefined);
  const right=answered.filter(q=>S.picks[q.id]===q.ans);
  const wrong=answered.filter(q=>S.picks[q.id]!==q.ans);
  const pct=answered.length?Math.round(right.length/answered.length*100):0;
  const bySec={};
  answered.forEach(q=>{(bySec[q.sec]=bySec[q.sec]||{n:0,c:0}).n++; if(S.picks[q.id]===q.ans) bySec[q.sec].c++;});
  const L="abcde";
  let h=`<div class="res">
    <div class="score"><div><div class="mono" style="font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase">${esc(S.title)}</div><div class="big">${pct}%</div></div>
      <div class="of">${right.length} right out of ${answered.length} answered${answered.length<S.list.length?` (${S.list.length-answered.length} skipped)`:""}<br>Best streak: ${S.best}</div></div>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>Syllabus topic</th><th>Right</th><th>Rate</th></tr></thead><tbody>`;
  Object.keys(bySec).sort((a,b)=>ORDER[a]-ORDER[b]).forEach(s=>{const v=bySec[s];h+=`<tr><td><span class="mono" style="color:var(--ink-3);font-size:12px">${SUBNAME[s].code}</span> ${esc(SUBNAME[s].name)}</td><td class="n">${v.c}/${v.n}</td><td class="n">${Math.round(v.c/v.n*100)}%</td></tr>`});
  h+=`</tbody></table></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">${wrong.length?`<button class="btn" id="retry">Retry the ${wrong.length} missed</button>`:""}<button class="btn ghost" id="home">Back to topics</button></div>`;
  if(wrong.length){
    h+=`<div><h2 style="font-size:22px;text-transform:uppercase;margin-bottom:8px">Items to review</h2>`;
    wrong.forEach(q=>{h+=`<details class="miss"><summary><span class="mono">${q.id}</span>${esc(q.q.split("\n")[0].slice(0,140))}${q.q.length>140?"...":""}</summary>
      <div class="body"><div>Your pick: ${L[S.picks[q.id]]}. ${esc(q.opts[S.picks[q.id]])}</div><div><b>Answer: ${L[q.ans]}. ${esc(q.opts[q.ans])}</b></div><div>${esc(q.exp)}</div></div></details>`});
    h+=`</div>`;
  } else if(answered.length){ h+=`<div class="empty-msg">No misses in this drill.</div>`; }
  h+=`</div>`;
  app.innerHTML=h; window.scrollTo(0,0);
  const rt=app.querySelector("#retry"); if(rt) rt.onclick=()=>start(wrong,"Retry missed");
  app.querySelector("#home").onclick=renderHome;
  const snapshotTitle=S.title; S={...S,done:true};
}

renderHome();
</script>
