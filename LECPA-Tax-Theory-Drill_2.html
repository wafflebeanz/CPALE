c. 203 applies only to ordinary cases.","notes":["Fraud or no return: 10 years from discovery (Sec. 222(a)).","Fraud must be proven clearly; it is never presumed.","In fraud cases, a court action may be filed even without an assessment."],"upd":"","key":""},{"id":"Q18-20","quiz":18,"num":20,"sec":"2.1","q":"If the return filed was false or fraudulent with intent to evade tax or no return was filed, collection either by summary proceedings or judicial proceedings shall be made within how many years from the date of assessment?","opts":["2 years","3 years","5 years","10 years"],"ans":2,"exp":"Under Sec. 222(c), any tax assessed within the applicable period may be collected by distraint, levy or court proceeding within five years following the assessment. The 10-year period in Sec. 222(a) is for making the assessment in fraud or non-filing cases, not for collection after assessment.","notes":["Collection: 5 years from assessment (Sec. 222(c)).","Applies whether the assessment was ordinary (3-year) or fraud (10-year).","The period may be suspended under Sec. 223."],"upd":"","key":""},{"id":"Q18-21","quiz":18,"num":21,"sec":"2.1","q":"Under which of the following is the running of the period for making an assessment and for beginning distraint, levy or a court proceeding for collection suspended for the period during which the Commissioner is prohibited from doing so and for 60 days thereafter?\nI - When the taxpayer requests a reinvestigation which is granted by the Commissioner\nII - When the taxpayer cannot be located at the address given by him in the return filed upon which a tax is being assessed or collected\nIII - When the warrant of distraint or levy is duly served upon the taxpayer, his authorized representative, or a member of his household with sufficient discretion, and no property could be located\nIV - When the taxpayer is out of the Philippines","opts":["I, II, III, IV","I, II and III","I, III, IV","I and IV"],"ans":0,"exp":"All four are grounds for suspending the prescriptive periods under Sec. 223. A reinvestigation must be requested and granted by the CIR to suspend the period; a mere request does not. The address ground does not apply if the taxpayer informed the CIR of a change of address.","notes":["Sec. 223 grounds: CIR prohibited (plus 60 days), reinvestigation granted, taxpayer cannot be located, no property found on service of warrant, taxpayer out of the Philippines.","Reinvestigation suspends only if the CIR grants it.","A valid waiver of the statute of limitations also extends the period (Sec. 222(b))."],"upd":"","key":""},{"id":"Q18-22","quiz":18,"num":22,"sec":"2.1","q":"First statement: Assessment is the official action of an officer authorized by law in ascertaining the amount of tax due under the law from a taxpayer.\nSecond statement: Assessment notice is a formal demand sent to the taxpayer requiring payment within a specified time of the tax due from him including interest and civil penalties.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both definitions are correct. An assessment is the authorized officer's determination of the tax due, and the assessment notice (FLD/FAN) communicates it with a demand for payment of the tax, interest and penalties within a stated period. The CIR's power to assess may be delegated to subordinate officials.","notes":["Assessment: official determination of tax due by an authorized officer.","The FLD/FAN must state the facts and law on which it is based, or it is void (Sec. 228).","The power to assess may be delegated by the CIR."],"upd":"","key":""},{"id":"Q18-23","quiz":18,"num":23,"sec":"2.1","q":"A Preliminary Assessment Notice shall not be required in the following cases, except when:","opts":["the finding for any deficiency tax is the result of mathematical error in the computation of the tax as appearing on the face of the return.","a discrepancy has been determined between the tax withheld and the amount actually remitted by the withholding agent.","the taxpayer who opted to claim a refund or tax credit of excess creditable tax for a taxable period was determined to have carried over and automatically applied the same amount claimed against the estimated tax liabilities for the taxable quarters of the succeeding taxable year.","the taxpayer failed to pay the correct income tax."],"ans":3,"exp":"Sec. 228 lists the cases where a PAN is not required and the FAN is issued directly: mathematical error on the face of the return, discrepancy between tax withheld and remitted, carry-over of excess credits after opting for refund, unpaid excise tax on excisable articles, and sale of exempt imported or purchased articles to non-exempt persons. An ordinary income tax deficiency is not on the list, so a PAN is required.","notes":["PAN not required (Sec. 228): math error, withheld vs. remitted discrepancy, refund/carry-over conflict, unpaid excise tax, exempt articles transferred to non-exempt persons.","In all other cases, a PAN must precede the FAN.","Taxpayer responds to the PAN within 15 days from receipt."],"upd":"","key":""},{"id":"Q18-24","quiz":18,"num":24,"sec":"2.1","q":"An official document that empowers a Revenue Officer to examine and scrutinize a taxpayer's books of accounts and other accounting records in order to determine the taxpayer's correct internal revenue tax liabilities.","opts":["Notice of Informal Conference","Preliminary Assessment Notice","Letter of Authority","Formal Assessment Notice"],"ans":2,"exp":"The Letter of Authority (LA) is the document that authorizes a Revenue Officer to examine a taxpayer's books and records. An assessment made without a valid LA is void (CIR v. Sony Phils.). The PAN and FAN communicate proposed and final assessments, not authority to audit.","notes":["An audit without a valid LA makes the assessment void.","LA issued by the CIR or duly authorized representative (National Office) or the Regional Director.","An LA should generally cover one taxable year; other periods must be specifically stated."],"upd":"","key":""},{"id":"Q18-25","quiz":18,"num":25,"sec":"2.1","q":"If the taxpayer is found to be liable for deficiency tax or taxes in the course of an investigation conducted by a Revenue Officer, the taxpayer shall be informed through:","opts":["Notice of Informal Conference","Preliminary Assessment Notice","Final Assessment Notice","Notice of Discrepancy"],"ans":3,"exp":"Under RR 12-99 as amended by RR 22-2020, the taxpayer is first informed of audit findings through a Notice of Discrepancy (NOD), which opens the Discussion of Discrepancy. The PAN and FAN come later. The Notice of Informal Conference is the old procedure, no longer used.","notes":["Sequence: LA, audit, NOD (Discussion of Discrepancy), PAN, FLD/FAN, FDDA.","NOD gives the taxpayer a chance to explain before any assessment is proposed.","The NIC was removed by RR 18-2013; RR 22-2020 introduced the NOD."],"upd":"RR 22-2020: the Notice of Discrepancy now serves the purpose of the old Notice of Informal Conference.","key":""},{"id":"Q18-26","quiz":18,"num":26,"sec":"2.1","q":"A Notice for Informal Conference shall be responded to within:","opts":["fifteen (15) days after receipt of the notice.","thirty (30) days after receipt of the notice.","two (2) months after the receipt of the notice.","six (6) months after the receipt of the notice."],"ans":0,"exp":"Under the original RR 12-99, the taxpayer had 15 days from receipt of the Notice of Informal Conference to respond; otherwise he was considered in default and the case was endorsed for issuance of a PAN. That step no longer exists: under RR 22-2020 the taxpayer gets a Notice of Discrepancy, and the Discussion of Discrepancy may not extend beyond 30 days from its receipt.","notes":["Old rule: respond to NIC within 15 days (RR 12-99).","Current: Discussion of Discrepancy not beyond 30 days from receipt of NOD (RR 22-2020).","PAN response: 15 days; FAN protest: 30 days."],"upd":"RR 18-2013 and RR 22-2020: the Notice of Informal Conference has been removed; the current first step is the Notice of Discrepancy, with a 30-day Discussion of Discrepancy.","key":"The item tests a procedure that no longer exists; the source key (15 days) is kept as the rule under the original RR 12-99."},{"id":"Q18-27","quiz":18,"num":27,"sec":"2.1","q":"First statement: The Notice of Discrepancy (NOD) aims to fully afford the taxpayer an opportunity to present and explain his side on the discrepancies found.\nSecond statement: The Revenue Officer who audited the taxpayer's records shall, among others, state in the initial report of investigation his findings of discrepancies.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct under RR 22-2020. The RO reports the discrepancies found in his report of investigation, and based on that report the taxpayer is informed in writing through the NOD so he can explain and submit documents during the Discussion of Discrepancy.","notes":["NOD purpose: due process before a PAN is issued.","Findings of discrepancy come from the RO's report of investigation.","Taxpayer may submit supporting documents during or after the discussion, within 30 days from NOD receipt."],"upd":"","key":""},{"id":"Q18-28","quiz":18,"num":28,"sec":"2.1","q":"The Discussion of Discrepancy shall in no case extend beyond how many days from receipt of the Notice of Discrepancy?","opts":["Ten (10) days","Twenty (20) days","Twenty-five (25) days","Thirty (30) days"],"ans":3,"exp":"Under RR 22-2020, the Discussion of Discrepancy may not extend beyond 30 days from the taxpayer's receipt of the NOD. Within that period the taxpayer must present his explanation and all supporting documents.","notes":["Discussion of Discrepancy: maximum 30 days from receipt of the NOD.","Documents may be submitted after the discussion but within the 30 days.","If unresolved, the case is endorsed for issuance of a PAN within 10 days."],"upd":"","key":""},{"id":"Q18-29","quiz":18,"num":29,"sec":"2.1","q":"If after the Discussion of Discrepancy the taxpayer is still found liable for deficiency tax and does not pay or does not agree with the findings, the investigating office shall endorse the case to the reviewing office and approving official in the National Office or the Revenue Regional Office for issuance of a deficiency tax assessment in the form of a Preliminary Assessment Notice within how many days from the conclusion of the Discussion?","opts":["Ten (10) days","Twenty (20) days","Twenty-five (25) days","Thirty (30) days"],"ans":0,"exp":"RR 22-2020 requires the investigating office to endorse the case for issuance of a PAN within 10 days from the conclusion of the Discussion of Discrepancy. Revenue Officers who fail to observe these periods may be penalized.","notes":["Endorsement for PAN: within 10 days after the Discussion of Discrepancy.","Discussion of Discrepancy: up to 30 days from NOD receipt.","RO noncompliance with the periods is subject to penalties."],"upd":"","key":""},{"id":"Q18-30","quiz":18,"num":30,"sec":"2.1","q":"If after review and evaluation by the Commissioner or his duly authorized representative it is determined that there exists sufficient basis to assess the taxpayer for any deficiency tax or taxes, the said Office shall issue to the taxpayer a:","opts":["Notice of Informal Conference","Preliminary Assessment Notice","Letter of Authority","Formal Assessment Notice"],"ans":1,"exp":"When review finds sufficient basis to assess, the office issues a Preliminary Assessment Notice (PAN) for the proposed assessment, stating in detail the facts and the law on which it is based. The FAN follows only after the taxpayer's response or default.","notes":["PAN: proposed assessment stating facts and law.","Taxpayer replies to the PAN within 15 days.","FLD/FAN follows if the taxpayer disagrees or defaults."],"upd":"","key":""},{"id":"Q18-31","quiz":18,"num":31,"sec":"2.1","q":"The Preliminary Assessment Notice (PAN) may be sent to the taxpayer at least by registered mail. The PAN shall be responded to within:","opts":["fifteen (15) days after receipt of the notice.","thirty (30) days after receipt of the notice.","two (2) months after the receipt of the notice.","six (6) months after the receipt of the notice."],"ans":0,"exp":"The taxpayer must respond to the PAN within 15 days from receipt. If he fails to respond, he is considered in default and the FLD/FAN is issued. The 30-day period applies to the protest against the FAN, not the PAN.","notes":["PAN response: 15 days from receipt.","No response: default, and FLD/FAN issued.","FAN protest: 30 days from receipt (Sec. 228)."],"upd":"","key":""},{"id":"Q18-32","quiz":18,"num":32,"sec":"2.1","q":"If the taxpayer fails to respond within fifteen (15) days from date of receipt of the PAN, he shall be considered in default, in which case what shall be issued calling for payment of the taxpayer's deficiency tax liability, inclusive of the applicable penalties?","opts":["Formal Letter of Demand and Final Assessment Notice (FLD/FAN)","Preliminary Assessment Notice (PAN) for the proposed assessment","Notice of Informal Conference","Letter of Authority"],"ans":0,"exp":"On default after the PAN, the BIR issues the Formal Letter of Demand and Final Assessment Notice (FLD/FAN) demanding payment of the deficiency tax with penalties. The FLD/FAN must state the facts and law on which it is based, otherwise the assessment is void, and it is served by registered mail or personal delivery.","notes":["Default on PAN leads to FLD/FAN.","FLD/FAN without factual and legal bases is void (Sec. 228).","The taxpayer may still protest the FLD/FAN within 30 days."],"upd":"","key":""},{"id":"Q18-33","quiz":18,"num":33,"sec":"2.2","q":"The taxpayer or his duly authorized representative may protest administratively by filing a request for reconsideration or reinvestigation within how many days from the date of receipt of the formal notice of assessment?","opts":["Sixty (60) days","Thirty (30) days","Twenty (20) days","Ten (10) days"],"ans":1,"exp":"Sec. 228 gives the taxpayer 30 days from receipt of the FLD/FAN to file a protest (request for reconsideration or reinvestigation). Failure to protest within that period makes the assessment final, executory and demandable. The 60-day period is for submitting supporting documents after a request for reinvestigation.","notes":["FAN protest: 30 days from receipt (Sec. 228).","Supporting documents (reinvestigation): 60 days from filing of protest.","No timely protest: assessment becomes final, executory and demandable."],"upd":"","key":""},{"id":"Q18-34","quiz":18,"num":34,"sec":"2.2","q":"First statement: Request for reconsideration refers to a plea of re-evaluation of an assessment on the basis of existing records without need of additional evidence. It may involve a question of fact or of law or both.\nSecond statement: Request for reinvestigation refers to a plea of re-evaluation of an assessment on the basis of newly discovered or additional evidence that a taxpayer intends to present in the reinvestigation. It may also involve a question of fact or of law or both.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both definitions are from RR 12-99 as amended and are correct. The difference is evidence: reconsideration relies on existing records, reinvestigation on new or additional evidence. Only a granted reinvestigation suspends the prescriptive period (Sec. 223), and the 60-day document rule applies only to reinvestigation.","notes":["Reconsideration: existing records, no new evidence.","Reinvestigation: new or additional evidence; documents due within 60 days.","Only a reinvestigation granted by the CIR suspends prescription."],"upd":"","key":""},{"id":"Q18-35","quiz":18,"num":35,"sec":"2.2","q":"The following are administrative remedies available to a taxpayer in connection with collection of taxes, except:","opts":["filing of claim for tax refund or credit.","filing a petition for reconsideration or reinvestigation.","filing a criminal complaint against erring BIR officials or employees.","entering into a compromise."],"ans":2,"exp":"The taxpayer's administrative remedies before the BIR include protest (reconsideration or reinvestigation), claim for refund or credit, compromise and abatement. Filing a criminal complaint against erring BIR personnel is not a remedy against the tax itself; it is a separate criminal action and does not dispute the assessment or recover the tax.","notes":["Taxpayer's administrative remedies: protest, refund/credit, compromise, abatement.","Judicial remedies: appeal to the CTA, civil action.","Compromise: minimum 10% (financial incapacity) or 40% (doubtful validity) of basic tax."],"upd":"","key":""},{"id":"Q18-36","quiz":18,"num":36,"sec":"2.2","q":"For requests for reinvestigation, the taxpayer shall submit all relevant supporting documents in support of his protest within how many days from the date of filing of his letter of protest, otherwise the assessment shall become final?","opts":["Sixty (60) days","Thirty (30) days","Twenty (20) days","Ten (10) days"],"ans":0,"exp":"Sec. 228 requires all relevant supporting documents to be submitted within 60 days from the filing of the protest; otherwise the assessment becomes final. Per the regulations, this means the taxpayer can no longer dispute the assessment with new evidence. The 60-day rule does not apply to requests for reconsideration.","notes":["Reinvestigation documents: within 60 days from filing the protest.","Not applicable to requests for reconsideration.","The taxpayer decides which documents are relevant."],"upd":"","key":""},{"id":"Q18-37","quiz":18,"num":37,"sec":"2.2","q":"If the protest is denied, in whole or in part, by the Commissioner's duly authorized representative, the taxpayer may:\nI - Appeal to the Court of Tax Appeals (CTA) within thirty (30) days from date of receipt of the said decision\nII - Elevate his protest through request for reconsideration to the Commissioner within thirty (30) days from date of receipt of the said decision","opts":["Either I or II","Neither I nor II","I only","II only"],"ans":0,"exp":"Under RR 12-99 as amended by RR 18-2013 and RR 22-2020, a denial by the CIR's authorized representative may be either appealed to the CTA within 30 days from receipt or elevated to the CIR through a request for reconsideration within 30 days. No reinvestigation is allowed at the administrative appeal level, and only issues raised in the representative's decision are considered.","notes":["Denial by authorized representative: appeal to CTA or elevate to CIR, each within 30 days.","Administrative appeal to the CIR: request for reconsideration only, no reinvestigation.","Denial by the CIR: appeal to CTA within 30 days from receipt."],"upd":"","key":""},{"id":"Q18-38","quiz":18,"num":38,"sec":"2.2","q":"If the protest is not acted upon by the Commissioner's duly authorized representative within one hundred eighty (180) days counted from the date of filing of the protest in case of a request for reconsideration, or from the date of submission of the required documents within sixty (60) days from filing of the protest in case of a request for reinvestigation, the taxpayer may:\nI - Appeal to the CTA within thirty (30) days after the expiration of the 180-day period\nII - Await the final decision of the Commissioner's duly authorized representative on the disputed assessment","opts":["Either I or II","Neither I nor II","I only","II only"],"ans":0,"exp":"On inaction within 180 days, the taxpayer may either appeal to the CTA within 30 days after the 180-day period lapses, or wait for the final decision and appeal within 30 days from its receipt. The options are mutually exclusive: choosing one bars the other (Lascona Land; RCBC v. CIR).","notes":["180 days to decide: from filing (reconsideration) or from submission of documents (reinvestigation).","Inaction: appeal within 30 days after the lapse, or wait for the decision.","The two options are mutually exclusive."],"upd":"","key":""},{"id":"Q18-39","quiz":18,"num":39,"sec":"2.2","q":"If the protest is denied in whole or in part, or is not acted upon within one hundred eighty (180) days from submission of documents, the taxpayer adversely affected by the decision or inaction may appeal to the Court of Tax Appeals (in Division) within how many days from receipt of the said decision, or from the lapse of the 180-day period?","opts":["Sixty (60) days","Thirty (30) days","Twenty (20) days","Fifteen (15) days"],"ans":1,"exp":"Sec. 228 and RA 1125 (as amended by RA 9282) give the taxpayer 30 days from receipt of the decision, or from the lapse of the 180-day period, to appeal to the CTA Division. A motion for reconsideration of the CIR's denial does not toll this period.","notes":["Appeal to CTA Division: 30 days from receipt of denial or lapse of 180 days.","A motion for reconsideration of the CIR's final denial does not toll the 30 days.","Protest and reconsideration are administrative; appeal is judicial."],"upd":"","key":""},{"id":"Q18-40","quiz":18,"num":40,"sec":"2.2","q":"When shall an assessment become final, executory and demandable?\nI - When relevant supporting documents are not submitted within sixty (60) days from filing the protest against the formal notice of assessment\nII - When the formal notice of assessment is not responded to within thirty (30) days after receipt\nIII - When no appeal to the Court of Tax Appeals is filed within thirty (30) days from receipt of the adverse decision of the Commissioner, or from the lapse of the 180-day period after submitting the required documents in support of the protest against a formal assessment","opts":["I, II, III","I and III","I and II","I only"],"ans":0,"exp":"Sec. 228 makes the assessment final when the FAN is not protested within 30 days, when supporting documents are not submitted within 60 days from filing the protest, and when no appeal to the CTA is made within 30 days from the CIR's denial or the lapse of the 180-day period. All three are correct.","notes":["No protest within 30 days: final, executory and demandable.","No documents within 60 days: assessment becomes final (no new evidence allowed).","No CTA appeal within 30 days: final, executory and demandable."],"upd":"","key":""},{"id":"Q18-41","quiz":18,"num":41,"sec":"2.2","q":"(Phil. CPA) The following are related to the tax assessment of a taxpayer:\nDate when assessment was received: October 1, 1999\nPetition for reconsideration was filed with BIR: October 9, 1999\nBIR decision of denial was received: July 2, 2000\nSecond request for reconsideration was filed with the BIR: July 15, 2000\nDate revised assessment was received: July 5, 2001\nThe last day to appeal to the Court of Tax Appeals is on:","opts":["July 15, 2001","August 6, 2001","August 4, 2001","September 5, 2001"],"ans":2,"exp":"The revised assessment received on July 5, 2001 is the final decision on the disputed assessment, so the 30-day period to appeal to the CTA runs from its receipt: July 5 plus 30 days is August 4, 2001. Under current rules the July 15, 2000 filing works as a timely elevation of the protest to the CIR (within 30 days from the July 2 denial), and the CIR's decision on it is what is appealed.","notes":["Appeal to CTA: 30 days from receipt of the final decision.","A revised assessment on the protest is the final decision that starts the 30 days.","Elevation to the CIR must be within 30 days from the representative's denial."],"upd":"","key":""},{"id":"Q18-42","quiz":18,"num":42,"sec":"2.2","q":"The following are related to the tax assessment of a taxpayer:\nAssessment received: January 5, 2008\nPetition for reinvestigation filed with BIR: February 1, 2008\nDocuments supporting the petition filed with BIR: February 7, 2008\nDecision of Commissioner's duly authorized representative denying the petition received by the taxpayer: March 22, 2008\nProtest elevated through request for reconsideration to the Commissioner: March 30, 2008\nDecision of final denial of request for reconsideration received: April 12, 2008\nLast day to appeal to the Court of Tax Appeals is on:","opts":["May 12, 2008","July 4, 2008","May 4, 2008","June 4, 2008"],"ans":0,"exp":"Under RR 12-99 as amended by RR 18-2013 and RR 22-2020, the taxpayer elevated the representative's denial to the CIR within 30 days (March 30). When the CIR denies the administrative appeal, the taxpayer may appeal to the CTA within 30 days from receipt of that decision: April 12 plus 30 days is May 12, 2008. The administrative appeal is a separate remedy with its own full 30-day window; it does not merely suspend the first period.","notes":["Denial by CIR on administrative appeal: appeal to CTA within 30 days from receipt.","The elevation to the CIR must itself be filed within 30 days from the representative's denial.","A motion for reconsideration of the CIR's own final denial does not toll the period."],"upd":"","key":"Source key says C (May 4, 2008), counting only the 22 days left after the elevation. Overridden: under RR 18-2013 and RR 22-2020, the CTA appeal runs a full 30 days from receipt of the CIR's decision on the administrative appeal."},{"id":"Q18-43","quiz":18,"num":43,"sec":"2.2","q":"Which of the following may be the subject of a claim for refund?\nI - National internal revenue tax hereafter alleged to have been erroneously or illegally assessed or collected\nII - Any penalty claimed to have been collected without authority\nIII - Sum alleged to have been excessively or in any manner wrongfully collected without authority","opts":["I, II, III","I and II","I and III","III only"],"ans":0,"exp":"Sec. 229 covers all three: taxes erroneously or illegally assessed or collected, penalties collected without authority, and sums excessively or wrongfully collected. A claim must first be filed with the CIR before any court action, and payment under protest is not required.","notes":["Sec. 229 covers erroneous/illegal taxes, unauthorized penalties and excessive collections.","An administrative claim with the CIR must precede the judicial claim.","Payment under protest is not required."],"upd":"","key":""},{"id":"Q18-44","quiz":18,"num":44,"sec":"2.2","q":"A refund check or warrant issued in accordance with the Tax Code which remains unclaimed or uncashed shall be forfeited in favor of the government, and the amount shall revert to the general fund, within how many years from the date the warrant or check was mailed or delivered?","opts":["Ten (10) years","Five (5) years","Three (3) years","Two (2) years"],"ans":1,"exp":"Sec. 230(A) forfeits a refund check or warrant that remains unclaimed or uncashed within five years from the date it was mailed or delivered; the amount reverts to the general fund.","notes":["Unclaimed/uncashed refund check: forfeited after 5 years (Sec. 230(A)).","Unutilized tax credit certificate: invalid after 5 years from issue unless revalidated (Sec. 230(B)).","Refund claim itself: within 2 years from payment."],"upd":"","key":""},{"id":"Q18-45","quiz":18,"num":45,"sec":"2.2","q":"A Tax Credit Certificate issued in accordance with the Tax Code which remains unutilized shall, unless revalidated, be considered invalid and shall not be allowed as payment for internal revenue tax liabilities, and the amount shall revert to the general fund, after how many years from the date of issue?","opts":["Ten (10) years","Five (5) years","Three (3) years","Two (2) years"],"ans":1,"exp":"Sec. 230(B) provides that an unutilized tax credit certificate becomes invalid after five years from the date of issue unless revalidated, and the amount reverts to the general fund.","notes":["Unutilized TCC: invalid after 5 years from issue unless revalidated (Sec. 230(B)).","Refund check: forfeited if uncashed within 5 years from mailing/delivery.","A TCC may be used to pay internal revenue taxes while valid."],"upd":"","key":""},{"id":"Q18-46","quiz":18,"num":46,"sec":"2.2","q":"First statement: No credit/refund of taxes or penalties shall be allowed unless the taxpayer files in writing with the Commissioner a claim for credit or refund within two (2) years after the payment of the tax or penalty.\nSecond statement: A return filed showing an overpayment shall be considered as a written claim for credit/refund.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct and come from Sec. 204(C). A written claim within two years from payment is required, and a return showing an overpayment is itself treated as a written claim. The CIR may also refund without a written claim where the payment is clearly erroneous on the face of the return (Sec. 229).","notes":["Written claim within 2 years from payment (Sec. 204(C)).","A return showing overpayment counts as a written claim.","EOPT: the CIR decides within 180 days from submission of complete documents."],"upd":"","key":""},{"id":"Q18-47","quiz":18,"num":47,"sec":"2.2","q":"For purposes of the 180-day processing period of the claim for refund:\nI - The counting shall begin upon submission of complete documents in support of the application that will be prescribed by the BIR for this purpose.\nII - The claim must be filed within the 2-year prescriptive period.","opts":["I and II are true","I and II are not true","Only I is true","Only II is true"],"ans":0,"exp":"Under Sec. 204(C) as amended by EOPT and RR 5-2024, the CIR must decide a refund claim within 180 days counted from submission of the complete supporting documents, and the claim itself must be filed within two years from payment. Both are true.","notes":["EOPT: CIR decides non-VAT refund claims within 180 days from complete documents.","Administrative claim: within 2 years from payment.","VAT refund: decided within 90 days."],"upd":"EOPT (RA 11976) and RR 5-2024: introduced the 180-day period for the CIR to decide claims under Secs. 204(C) and 229.","key":""},{"id":"Q18-48","quiz":18,"num":48,"sec":"2.2","q":"Claims for tax credit/refund under Sections 204(C) and 229 of the Tax Code must conform with which essential requisites?\nI - The tax credit/refund claim pertains to erroneously or illegally received or collected taxes or penalties imposed without authority.\nII - Filing of a claim for tax credit/refund must be done within two (2) years after payment of the tax or penalty.\nIII - The erroneously or illegally received or collected taxes must be supported with a copy of the duly filed tax return with the corresponding payment remitted to the BIR.","opts":["I, II and III","I and II only","II and III only","I only"],"ans":0,"exp":"All three are requisites under RR 5-2024 for refunds of erroneously or illegally collected taxes: the claim must involve erroneous or illegal collection, be filed within two years from payment, and be supported by proof of filing and payment. The taxpayer bears the burden of proving entitlement.","notes":["Requisites: erroneous/illegal payment, 2-year filing, proof of return and payment.","Refunds are construed strictly against the claimant.","Excess creditable withholding tax of corporations follows the irrevocability rule of Sec. 76."],"upd":"RR 5-2024 (implementing EOPT): lists these requisites for claims under Secs. 204(C) and 229.","key":""},{"id":"Q18-49","quiz":18,"num":49,"sec":"2.2","q":"In case the tax refund/credit claim is not acted upon by the Commissioner within the 180-day period, the taxpayer-claimant may opt to:\nOption I - Appeal to the CTA within the 30-day period after the expiration of the 180 days required by law to process the claim\nOption II - Forego the judicial remedy and await the final decision of the Commissioner on the application for VAT refund claim","opts":["Both options","Neither option","Option I only","Option II only"],"ans":2,"exp":"Under EOPT and RR 5-2024, inaction within 180 days lets the claimant appeal to the CTA within 30 days after the period lapses. Waiting indefinitely is not a recognized option for refunds: once the 30-day window passes, the judicial remedy is lost. This differs from protested assessments, where the taxpayer may wait for the decision.","notes":["Refund inaction: appeal to CTA within 30 days after the 180 days lapse.","Protested assessment inaction: appeal or wait (mutually exclusive options).","VAT refund: 90 days to decide, then 30 days to appeal."],"upd":"EOPT (RA 11976) and RR 5-2024: set the 180-day decision period and the 30-day appeal after denial or inaction for refund claims.","key":"Option II mentions a VAT refund claim, but the 180-day period is for non-VAT refunds (VAT refunds are decided within 90 days). The source key C is kept under the non-VAT refund rule."},{"id":"Q18-50","quiz":18,"num":50,"sec":"2.2","q":"A claim for refund of erroneously collected tax must be filed with the Court of Tax Appeals within:\nI - Two (2) years from the date of erroneous payment\nII - Thirty (30) days from the lapse of the 180-day period for the BIR to decide\nIII - Thirty (30) days from receipt of the BIR decision denying the claim for refund","opts":["I, II and III","I and II","II and III","I only"],"ans":2,"exp":"Under EOPT and RR 5-2024, the judicial claim is filed with the CTA within 30 days from receipt of the denial or from lapse of the 180-day period. The two-year period now governs the administrative claim with the BIR, not the CTA appeal.","notes":["CTA appeal: 30 days from denial or lapse of 180 days.","Administrative claim: 2 years from payment.","Old rule (pre-EOPT): both administrative and judicial claims within 2 years from payment."],"upd":"EOPT (RA 11976): previously both the BIR claim and the CTA suit had to be filed within 2 years from payment; now the CTA appeal follows the 30-day windows after the 180-day administrative period.","key":""},{"id":"Q19-01","quiz":19,"num":1,"sec":"1.9","q":"The Commissioner of Internal Revenue has the authority to do all of the following, except:","opts":["Compromise the payment of any internal revenue tax","Cancel or abate tax liability","Credit or refund tax","Review the decisions of the Court of Tax Appeals"],"ans":3,"exp":"Sec. 204 empowers the CIR to compromise, abate or cancel, and credit or refund taxes. The CIR cannot review CTA decisions; it is the reverse, since CIR decisions on disputed assessments and refunds are appealable to the CTA (Sec. 4), and CTA decisions go to the CTA en banc and then the Supreme Court.","notes":["Sec. 204 powers: (A) compromise, (B) abate or cancel, (C) credit or refund.","CIR decisions are subject to the exclusive appellate jurisdiction of the CTA.","CTA division decisions: motion for reconsideration, then CTA en banc, then Supreme Court (Rule 45)."],"upd":"","key":""},{"id":"Q19-02","quiz":19,"num":2,"sec":"1.9","q":"The Commissioner may compromise the payment of any internal revenue tax when:\nI - there is a reasonable doubt as to the validity of the claim against the taxpayer.\nII - the financial position of the taxpayer demonstrates a clear inability to pay the assessed tax.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 204(A) allows compromise on only two grounds: reasonable doubt as to the validity of the assessment, and financial incapacity (clear inability to pay). Both statements state these grounds.","notes":["Two grounds only: doubtful validity and financial incapacity.","Minimum compromise: 40% of basic assessed tax (doubtful validity); 10% (financial incapacity).","Power to compromise is non-delegable except to the Evaluation Boards (Sec. 7(C))."],"upd":"","key":""},{"id":"Q19-03","quiz":19,"num":3,"sec":"1.9","q":"(Phil. CPA) The Commissioner of Internal Revenue cannot:","opts":["Abate or cancel tax liability","Compromise payment of internal revenue taxes","Credit or refund taxes erroneously or illegally collected","Compromise the criminal aspect of tax violations already filed in court"],"ans":3,"exp":"Under Sec. 204(A), the CIR may compromise criminal violations except those already filed in court and those involving fraud. Abatement, compromise of the tax, and refund of erroneously or illegally collected taxes are all Sec. 204 powers.","notes":["Criminal violations may be compromised EXCEPT: already filed in court, or involving fraud.","Compromise of a criminal violation is made before the case is filed in court.","Abatement, compromise and refund are all under Sec. 204."],"upd":"","key":""},{"id":"Q19-04","quiz":19,"num":4,"sec":"1.9","q":"Which of the following cases may not be compromised?","opts":["Delinquent accounts","Cases under administrative protest after issuance of the Final Notice of Assessment to the taxpayer still pending in the BIR","Civil tax cases being disputed before the courts","Criminal violations involving criminal tax fraud"],"ans":3,"exp":"RR 30-2002 allows compromise of delinquent accounts, cases under administrative protest after the FAN, civil tax cases disputed in court, collection cases filed in court, and criminal violations other than those already filed in court or involving criminal tax fraud. Criminal tax fraud is expressly excluded.","notes":["Compromisable: delinquent accounts, protested cases after FAN, civil tax cases in court, collection cases in court, minor criminal violations.","Not compromisable: criminal tax fraud and criminal cases already filed in court.","Governing rule: Sec. 204(A) and RR 30-2002 (as amended by RR 8-2004)."],"upd":"","key":""},{"id":"Q19-05","quiz":19,"num":5,"sec":"1.9","q":"Which of the following cases may be compromised?","opts":["Withholding tax cases","Delinquent accounts with duly approved schedule of installment payments","Estate tax cases where compromise is requested on the ground of financial incapacity of the taxpayer","Collection cases filed in courts"],"ans":3,"exp":"Collection cases filed in courts are among the cases that may be compromised under RR 30-2002. The other choices are listed exceptions: withholding tax cases (unless the taxpayer invokes a law casting doubt on the duty to withhold), delinquent accounts with an approved installment schedule, and estate tax cases compromised on the ground of financial incapacity.","notes":["Exceptions include withholding tax cases, criminal tax fraud, criminal cases filed in court, and accounts with approved installment plans.","Also excluded: final and executory cases (on doubtful validity ground) and estate tax cases on financial incapacity ground.","Withholding tax cases may be compromised only if the taxpayer invokes a law that casts doubt on the obligation to withhold."],"upd":"","key":""},{"id":"Q19-06","quiz":19,"num":6,"sec":"1.9","q":"Which of the following offers to compromise a disputed assessment may not be accepted on the ground of reasonable doubt as to the validity of the assessment?","opts":["Jeopardy assessment","Arbitrary assessment based on presumption","Assessment issued on or after January 1, 1998 where the demand notice allegedly failed to comply with formalities prescribed in the Tax Code","Taxpayer is suffering from surplus or earnings deficit resulting in impairment in the original capital by at least 50%"],"ans":3,"exp":"Capital impairment of at least 50% is a ground for compromise based on financial incapacity, not doubtful validity. Jeopardy assessments, arbitrary assessments based on presumption, and assessments whose demand notice allegedly failed to meet Tax Code formalities are listed doubtful-validity grounds in RR 30-2002.","notes":["Doubtful validity grounds also include best-evidence assessments, questioned waivers, and failure to protest or appeal where the assessment lacks legal or factual basis.","Capital impairment of at least 50% is a financial incapacity ground (40% minimum rate under RR 30-2002).","Doubtful validity minimum compromise: 40% of the basic assessed tax."],"upd":"","key":""},{"id":"Q19-07","quiz":19,"num":7,"sec":"2.1","q":"What is the technical term for a tax assessment made by an authorized Revenue Officer (RO) without the benefit of complete or partial audit, in light of the RO's belief that the assessment and collection of a deficiency tax will be jeopardized by delay caused by the taxpayer's failure to comply with audit and investigation requirements to present his books of accounts and/or pertinent records, or to substantiate all or any of the deductions, exemptions or credits claimed in his return?","opts":["Jeopardy assessment","Arbitrary assessment based on presumption","Assessment issued on or after January 1, 1998 where the demand notice allegedly failed to comply with formalities prescribed in the Tax Code","Assessment made based on the \"Best Evidence Obtainable Rule\""],"ans":0,"exp":"This is the definition of a jeopardy assessment in RR 30-2002: made without a complete or partial audit because delay caused by the taxpayer's noncompliance would jeopardize collection. A best-evidence assessment is based on the best available information when the taxpayer fails to submit records (Sec. 6(B)), but it follows an examination.","notes":["Jeopardy assessment: no complete or partial audit; collection is jeopardized by the taxpayer's delay.","Because it is made without full audit, a jeopardy assessment may be compromised on the ground of doubtful validity.","No PAN is required when the RO finds that collection is jeopardized (RR 12-99, as amended)."],"upd":"","key":""},{"id":"Q19-08","quiz":19,"num":8,"sec":"1.9","q":"The offer to compromise based on financial incapacity may be accepted upon showing the following, except when:","opts":["The corporation ceases operation or is already dissolved","The taxpayer is suffering from surplus or earnings deficit resulting in impairment in the original capital by 50%","The taxpayer is a compensation income earner with no other source of income and the family's gross monthly compensation income does not exceed P10,500, if single, or P21,000, if married","The taxpayer does not waive in writing his privilege of the secrecy of bank deposits"],"ans":3,"exp":"A written waiver of bank secrecy is required for a compromise on the ground of financial incapacity; without it, the CIR will not consider the offer. The other choices are recognized financial incapacity grounds under RR 30-2002.","notes":["Waiver of bank secrecy (RA 1405) is a condition for a financial incapacity compromise (Sec. 6(F)).","Not considered: taxpayer with a TCC on hand, pending refund claim, or agreements that increase equity, or no bank secrecy waiver.","The waiver authorizes the CIR to inquire into the taxpayer's bank deposits."],"upd":"","key":""},{"id":"Q19-09","quiz":19,"num":9,"sec":"1.9","q":"What is the prescribed minimum percentage of compromise in case of doubtful validity of the assessment?","opts":["40% of the basic assessed tax","30% of the basic assessed tax","20% of the basic assessed tax","10% of the basic assessed tax"],"ans":0,"exp":"Sec. 204(A) sets the minimum compromise rate at 40% of the basic assessed tax for doubtful validity and 10% for financial incapacity. Offers below these rates need Evaluation Board approval.","notes":["Doubtful validity: 40% of basic assessed tax.","Financial incapacity: 10% of basic assessed tax (RR 30-2002 uses 10%, 20% or 40% depending on the case).","The rate is applied to the basic tax only, not to surcharge and interest."],"upd":"","key":""},{"id":"Q19-10","quiz":19,"num":10,"sec":"1.9","q":"For cases involving financial incapacity, which of the following is not subject to the 10% compromise rate based on the basic assessed tax?","opts":["Taxpayer is an individual whose sole source of income is from employment, and whose monthly salary is P10,500 or less, if single, and P21,000 or less, if married","Taxpayer is an individual without any source of income","Taxpayer has a zero net worth or negative net worth","Taxpayer is suffering from surplus or earnings deficit resulting in impairment in the original capital by at least 50%"],"ans":3,"exp":"Under RR 30-2002 (as amended by RR 8-2004), capital impairment of at least 50% carries a 40% minimum compromise rate. Low-salary compensation earners, individuals without income, taxpayers with zero or negative net worth, and companies non-operating for 3 years or more are at 10%.","notes":["10%: low-salary employees, no income, zero or negative net worth, non-operating 3 years or more.","20%: dissolved corporations, non-operating less than 3 years, declared insolvent or bankrupt.","40%: capital impairment of at least 50%."],"upd":"","key":""},{"id":"Q19-11","quiz":19,"num":11,"sec":"1.9","q":"First statement: Offers of compromise of assessments issued by the Regional Office involving basic deficiency taxes of P500,000 or less, and for minor criminal violations discovered by the Regional and District Offices, shall be subject to the approval of the Regional Evaluation Board.\nSecond statement: If the offer of compromise is less than the prescribed minimum percentage of compromise settlement, the same shall be subject to the approval of the National Evaluation Board.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. Sec. 204(A) and Sec. 7(C) allow delegation of compromise to the Regional Evaluation Board for regional assessments with basic deficiency tax of P500,000 or less and minor criminal violations. Compromises where the basic tax exceeds P1,000,000 or the offer is below the minimum rates require approval of the National Evaluation Board (the CIR and four deputy commissioners).","notes":["Regional Evaluation Board: regional assessments with basic deficiency tax of P500,000 or less, and minor criminal violations.","National Evaluation Board: basic tax over P1,000,000, or offer below the minimum rates.","NEB decisions favorable to the taxpayer need the CIR's concurrence."],"upd":"","key":""},{"id":"Q19-12","quiz":19,"num":12,"sec":"1.9","q":"The Commissioner of Internal Revenue may abate or cancel a tax liability when:\nI - the tax or any portion thereof appears to be unjustly or excessively assessed.\nII - the administration and collection costs involved do not justify the collection of the amount due.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 204(B) gives exactly these two grounds for abatement or cancellation: unjust or excessive assessment, and collection costs that do not justify collecting the amount due.","notes":["Abatement grounds: (1) unjust or excessive assessment; (2) cost of collection not justified.","Compromise grounds differ: doubtful validity and financial incapacity.","Power to abate is non-delegable except to the Evaluation Boards (Sec. 7)."],"upd":"","key":""},{"id":"Q19-13","quiz":19,"num":13,"sec":"1.9","q":"The following are instances when penalties and/or interest imposed on the taxpayer may be abated or cancelled on the ground that the imposition thereof is unjust and excessive, except when the:","opts":["Filing of the return or payment of the tax is made at the wrong venue","Taxpayer's mistake in payment of his tax is due to erroneous written official advice of a revenue officer","Assessment is brought about or a result of the taxpayer's non-compliance with the law due to a difficult interpretation of the said law","Taxpayer is declared insolvent or bankrupt"],"ans":3,"exp":"Insolvency or bankruptcy is a ground for compromise based on financial incapacity, not for abatement. RR 13-2001 lists wrong venue, erroneous written official advice, and difficult interpretation of the law as instances where penalties may be abated as unjust and excessive.","notes":["Unjust and excessive instances (RR 13-2001): wrong venue, erroneous written advice, substantial losses, difficult interpretation, circumstances beyond control, meritorious late payment.","Insolvency or bankruptcy supports a compromise (financial incapacity), not abatement.","For substantial losses and circumstances beyond control, abatement covers surcharge and compromise penalty only, not interest."],"upd":"EOPT (RA 11976): with file anywhere, filing or paying at the wrong venue is no longer penalized, so choice a is now largely moot; it remains in RR 13-2001.","key":""},{"id":"Q19-14","quiz":19,"num":14,"sec":"1.9","q":"Which of the following is not an instance of substantial losses (from prolonged labor dispute, force majeure or legitimate business reverses) under which penalties may be abated or cancelled on the ground that the imposition is unjust and excessive?","opts":["Labor strike for more than 6 months, which has caused the temporary shutdown of business","Public turmoil","Natural calamity such as lightning, earthquake, storm, flood and the like","Incompetence of public officials"],"ans":3,"exp":"RR 13-2001 lists labor strikes over 6 months causing temporary shutdown, public turmoil, natural calamities, armed conflicts, losses from fire, robbery, theft or embezzlement, continuous heavy losses for the last 2 years, and liquidity problems for the last 3 years. Incompetence of public officials is not on the list.","notes":["Also on the list: armed conflict, fire, robbery, theft, embezzlement, heavy losses for 2 years, liquidity problem for 3 years.","Abatement under this ground covers surcharge and compromise penalty, NOT interest.","The CIR may add analogous instances."],"upd":"","key":"Source stem asks when \"the interest imposed may not be abated\"; since interest is never abated under this ground (RR 13-2001), the stem was reworded to ask which is not a qualifying instance. Answer unchanged."},{"id":"Q19-15","quiz":19,"num":15,"sec":"1.9","q":"In which of the following instances may the penalties and/or interest imposed not be abated or cancelled on the ground that the imposition is unjust and excessive due to meritorious circumstances?","opts":["One day late filing and remittance due to failure to beat bank cut-off time","Use of wrong tax form but correct amount of tax was remitted","Surcharge erroneously imposed","All of the choices"],"ans":0,"exp":"Failure to beat the bank cut-off time is not a listed meritorious circumstance; it is the taxpayer's own lateness. RR 13-2001 lists use of the wrong form with the correct tax remitted and an erroneously imposed surcharge as meritorious circumstances, so \"all of the choices\" is wrong.","notes":["Meritorious circumstances include wrong form with correct tax, erroneous surcharge, offsetting overpayments of the same tax, and wrong use of a TCC.","Amended return under meritorious circumstances and late withholding on expatriates: abatement covers penalties only, not interest.","Late filing due to unresolved real property classification or valuation issue (e.g., CGT) is meritorious."],"upd":"","key":""},{"id":"Q19-16","quiz":19,"num":16,"sec":"1.9","q":"In which of the following instances shall the abatement not cover the interest, even if the imposition of penalties is unjust and excessive?\nI - When the taxpayer fails to file a return and pay the tax on time due to substantial losses from prolonged labor dispute, force majeure, or legitimate business reverses\nII - When the taxpayer fails to file the return and pay the correct tax on time due to circumstances beyond his control\nIII - Late remittance of withholding tax on compensation of expatriates for services rendered in the Philippines pending the issuance by the SEC of the license to the Philippine branch office or subsidiary\nIV - Filing an amended return under meritorious circumstances","opts":["I, II, III and IV","I, II and III","I and II only","I and III only"],"ans":0,"exp":"RR 13-2001 limits abatement to the surcharge and compromise penalty, and not the interest, in all four instances: substantial losses, circumstances beyond the taxpayer's control, late withholding on expatriates' compensation pending SEC license, and amended returns under meritorious circumstances.","notes":["Interest is NOT abated in these four cases; only surcharge and compromise penalty are.","Interest compensates the government for the use of money, so it is abated only in limited cases.","Interest rate: 12% per annum (double the legal rate, TRAIN); 6% for micro and small taxpayers (EOPT)."],"upd":"","key":"Source stem says \"compromise\"; the explanation and RR 13-2001 refer to abatement, so the stem was corrected to \"abatement\". Answer unchanged."},{"id":"Q19-17","quiz":19,"num":17,"sec":"1.9","q":"The following are instances when the tax liabilities, penalties and/or interest imposed on the taxpayer may be abated or cancelled on the ground that the administration and collection costs are more than the amount sought to be collected, except:","opts":["Assessment confirmed by lower court but appealed by the taxpayer to a higher court","Withholding tax assessment under meritorious circumstances","Delayed installment payment under meritorious circumstances","When the assessment is brought about or the result of the taxpayer's non-compliance with the law due to a difficult interpretation of the said law"],"ans":3,"exp":"Difficult interpretation of the law is an instance of unjust and excessive imposition, not of collection costs exceeding the amount due. RR 13-2001 lists, for the cost-of-collection ground: assessment confirmed by a lower court but appealed, withholding tax assessment under meritorious circumstances, delayed installment payment under meritorious circumstances, and assessment reduced after reinvestigation but still contested.","notes":["Cost-of-collection instances: lower-court-confirmed assessment on appeal, meritorious withholding tax case, meritorious delayed installment, reduced assessment still contested.","Abatement of surcharge and compromise penalty here requires a written application to pay the basic tax (and interest, if applicable).","Difficult interpretation of law falls under unjust and excessive imposition."],"upd":"","key":"Source choice b reads \"withholding tax assessment and on delayed installment payment under meritorious cases\", which overlaps choice c; cleaned up to match RR 13-2001. Answer unchanged."},{"id":"Q19-18","quiz":19,"num":18,"sec":"1.9","q":"The Commissioner of Internal Revenue has the authority to credit or refund which of the following?\nI - Taxes erroneously or illegally received or penalties imposed without authority.\nII - The value of internal revenue stamps when returned in good condition by the purchaser.\nIII - The value, upon proof of destruction, of unused stamps that are unfit for use.","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Sec. 204(C) authorizes the CIR to credit or refund taxes erroneously or illegally received or penalties imposed without authority, to refund the value of internal revenue stamps returned in good condition, and, in his discretion, to redeem or change unused stamps unfit for use and refund their value upon proof of destruction.","notes":["Sec. 204(C) covers taxes, penalties, and internal revenue stamps.","Claim must be in writing and filed within 2 years after payment.","EOPT: the CIR must decide non-VAT refund claims within 180 days; appeal to the CTA within 30 days from denial or lapse."],"upd":"","key":""},{"id":"Q19-19","quiz":19,"num":19,"sec":"2.2","q":"First statement: No credit or refund of taxes or penalties shall be allowed unless the taxpayer files in writing with the Commissioner a claim for credit or refund within two (2) years after the payment of the tax or penalty.\nSecond statement: A return filed showing an overpayment shall be considered as a written claim for credit or refund.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct under Sec. 204(C). The written claim must be filed within 2 years after payment, and a return showing an overpayment is itself treated as a written claim for credit or refund. Under Sec. 229, the judicial claim must also be filed within the same 2-year period.","notes":["Administrative and judicial claims both within 2 years from payment (Secs. 204(C) and 229).","A return showing overpayment counts as a written claim.","Income tax: once the carry-over option is chosen, it is irrevocable (Sec. 76)."],"upd":"EOPT (RA 11976): the CIR must decide non-VAT refund claims within 180 days from submission of complete documents; the taxpayer may appeal to the CTA within 30 days from denial or lapse of that period.","key":""},{"id":"Q19-20","quiz":19,"num":20,"sec":"2.2","q":"First statement: Tax refund refers to the actual reimbursement of the erroneously or illegally collected taxes.\nSecond statement: Tax credit refers to the issuance of a Tax Credit Certificate (TCC) which may be utilized in the payment of internal revenue taxes, excluding withholding taxes, for which the taxpayer is directly liable.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. A refund is the actual return of the tax erroneously or illegally collected, while a tax credit is granted through a TCC that the taxpayer may apply against internal revenue taxes for which it is directly liable. A TCC cannot be used for withholding taxes, since the withholding agent holds those in trust for the government.","notes":["Refund: cash reimbursement. Credit: TCC applied against future internal revenue taxes.","A TCC cannot pay withholding taxes.","Both require a written claim within 2 years from payment."],"upd":"","key":""},{"id":"Q19-21","quiz":19,"num":21,"sec":"1.9","q":"The power to interpret the provisions of the Tax Code and other tax laws shall be under the exclusive and original jurisdiction of the Commissioner of Internal Revenue, subject to review by the:","opts":["Secretary of Finance","Court of Tax Appeals","Court of Appeals","Municipal Courts"],"ans":0,"exp":"Sec. 4 gives the CIR exclusive and original jurisdiction to interpret the Tax Code and other tax laws, subject to review by the Secretary of Finance. The CTA reviews CIR decisions on disputed assessments and refunds, not the CIR's interpretive rulings as such.","notes":["Power to interpret: CIR, subject to review by the Secretary of Finance (Sec. 4).","Power to decide disputed assessments and refunds: CIR, subject to CTA appellate jurisdiction.","Rulings of first impression and reversal of existing rulings are non-delegable (Sec. 7)."],"upd":"","key":""},{"id":"Q19-22","quiz":19,"num":22,"sec":"1.9","q":"The power to decide disputed assessments, refunds of internal revenue taxes, fees or other charges, penalties imposed in relation thereto, or other matters administered by the BIR is vested in the Commissioner of Internal Revenue, subject to the exclusive appellate jurisdiction of the:","opts":["Secretary of Finance","Court of Tax Appeals","Court of Appeals","Municipal Courts"],"ans":1,"exp":"Sec. 4 subjects the CIR's decisions on disputed assessments, refunds and other BIR matters to the exclusive appellate jurisdiction of the CTA. The Secretary of Finance reviews the CIR's interpretations of tax law, not these decisions.","notes":["Appeal to the CTA within 30 days from receipt of the adverse decision or lapse of the period to decide.","Disputed assessments: CIR decides within 180 days from submission of documents.","Do not confuse: interpretation (Secretary of Finance) vs. decisions (CTA)."],"upd":"","key":""},{"id":"Q19-23","quiz":19,"num":23,"sec":"1.9","q":"In ascertaining the correctness of any return, or in making a return when none has been made, or in determining the liability of any person for any internal revenue tax, or in collecting any such liability, or in evaluating tax compliance, the Commissioner is authorized to do the following, except:","opts":["To examine any book, paper, record, or other data which may be relevant or material to such inquiry","To summon the person liable for tax or required to file a return, or any officer or employee of such person, or any person having possession, custody, or care of the books of accounts and other accounting records containing entries relating to the business of the person liable for tax, or any other person, to appear before the Commissioner or his duly authorized representative at a time and place specified in the summons and to produce such books, papers, records, or other data, and to give testimony","To inquire into bank deposits of taxpayers under investigation for violations of the Tax Code","None of the choices"],"ans":2,"exp":"Sec. 5 allows the CIR to examine books and records and to summon persons to produce records and testify. The CIR may inquire into bank deposits only in the cases in Sec. 6(F): a decedent's deposits (to determine the gross estate), a taxpayer applying for compromise on financial incapacity who waives bank secrecy, and a specific taxpayer subject of a tax treaty exchange-of-information request. Being under investigation for a Tax Code violation is not one of them.","notes":["Sec. 5 powers: examine records, obtain information from third parties, summon, take testimony, canvass districts.","Bank inquiry (Sec. 6(F)): decedent, financial incapacity compromise with waiver, treaty exchange of information.","Bank secrecy (RA 1405) otherwise protects deposits from BIR inquiry."],"upd":"","key":""},{"id":"Q19-24","quiz":19,"num":24,"sec":"1.9","q":"Which of the following is within the power of the Commissioner to obtain information, and to summon, examine and take testimony of persons?\nI - To obtain on a regular basis from any person other than the person whose internal revenue tax liability is subject to audit or investigation\nII - To take such testimony of the persons concerned, under oath, as may be relevant or material to such inquiry\nIII - To cause revenue officers to make a canvass from time to time of any revenue district or region and inquire after and concerning all persons therein who may be liable to pay any internal revenue tax, and all persons owning or having the care, management or possession of any object with respect to which a tax is imposed","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"All three are Sec. 5 powers: obtaining information from third parties on a regular basis (Sec. 5(B)), taking testimony under oath (Sec. 5(D)), and causing revenue officers to canvass revenue districts or regions (Sec. 5(E)).","notes":["Sec. 5(A) examine; (B) obtain third-party information; (C) summon; (D) take testimony; (E) canvass.","Third parties include government offices, GOCCs and private persons.","Failure to obey a summons is punishable (Sec. 266)."],"upd":"","key":""},{"id":"Q19-25","quiz":19,"num":25,"sec":"1.9","q":"Which of the following statements is incorrect?","opts":["After a return has been filed as required under the provisions of the Tax Code, the Commissioner or his duly authorized representative may authorize the examination of any taxpayer and the assessment of the correct amount of tax","Failure to file a return shall prevent the Commissioner from authorizing the examination of any taxpayer","The tax or any deficiency tax so assessed shall be paid upon notice and demand from the Commissioner or from his duly authorized representative","Any return, statement or declaration filed in any office authorized to receive the same shall not be withdrawn"],"ans":1,"exp":"Sec. 6(A) expressly states that failure to file a return shall NOT prevent the Commissioner from authorizing the examination of any taxpayer. The other statements follow Sec. 6(A): examination after filing, payment upon notice and demand, and no withdrawal of filed returns.","notes":["Non-filing does not bar examination; the CIR may assess based on the best evidence obtainable (Sec. 6(B)).","Filed returns cannot be withdrawn, but may be amended within 3 years if no audit notice has been served.","Deficiency tax is payable upon notice and demand."],"upd":"","key":""},{"id":"Q19-26","quiz":19,"num":26,"sec":"1.9","q":"First statement: Within three (3) years from the date of filing of any return, statement or declaration, the same may be modified, changed, or amended.\nSecond statement: The modification, change or amendment of any return, statement or declaration filed is allowed if no notice for audit or investigation of such return, statement or declaration has in the meantime been actually served upon the taxpayer.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are correct. Sec. 6(A) allows a filed return to be modified, changed or amended within 3 years from filing, provided no notice for audit or investigation has in the meantime been actually served on the taxpayer.","notes":["Amendment window: 3 years from filing.","Condition: no audit notice (e.g., LOA) actually served yet.","A substantially amended return may restart the 3-year assessment period."],"upd":"","key":""},{"id":"Q19-27","quiz":19,"num":27,"sec":"1.9","q":"The Commissioner, after taking into account the sales, receipts, income or other taxable base of other persons engaged in similar businesses under similar situations or circumstances, or after considering other relevant information, may prescribe a minimum amount of such gross receipts, sales and taxable base, and such amount so prescribed shall be prima facie correct for purposes of determining the internal revenue tax liabilities of such person when:\nI - it is found that a person has failed to issue receipts and invoices in violation of the requirements of Sections 113 and 237 of the Tax Code.\nII - there is reason to believe that the books of accounts or other records do not correctly reflect the declarations made or to be made in a return required to be filed under the provisions of the Tax Code.","opts":["Either I or II","Neither I nor II","I only","II only"],"ans":0,"exp":"Sec. 6(C) allows the CIR to prescribe presumptive gross sales or receipts, which are prima facie correct, when a person fails to issue required invoices under Secs. 113 and 237, or when there is reason to believe the books or records do not correctly reflect the declarations in a return. Either ground is enough.","notes":["Sec. 6(C) also allows inventory-taking and surveillance (placing the business under observation).","Presumptive amounts are prima facie correct; the taxpayer may rebut them.","Invoices are required for each sale or transfer of P500 or more (Sec. 237)."],"upd":"EOPT (RA 11976): the invoice is now the primary sales document for both goods and services under Secs. 113 and 237; official receipts no longer serve that role.","key":""},{"id":"Q19-28","quiz":19,"num":28,"sec":"1.9","q":"The fair market value of real properties located in each zone or area shall be subject to automatic adjustment once every how many years through rules and regulations issued by the Secretary of Finance based on the current Philippine valuation standards?","opts":["3 years","5 years","7 years","10 years"],"ans":0,"exp":"Sec. 6(E), as amended by TRAIN, requires the zonal values to be automatically adjusted once every 3 years through regulations issued by the Secretary of Finance based on current Philippine valuation standards. For tax purposes the higher of zonal value or the assessor's FMV applies.","notes":["Zonal value revision: once every 3 years (TRAIN).","Tax base for real property: higher of zonal value, assessor's FMV, or gross selling price (e.g., 6% CGT).","The CIR may divide the country into zones and prescribe real property values (Sec. 6(E))."],"upd":"RA 12001 (Real Property Valuation and Assessment Reform Act, 2024): the Schedule of Market Values prepared by assessors and approved by the Secretary of Finance (revised every 3 years) is meant to become the single valuation base for real property taxation, including internal revenue taxes.","key":""},{"id":"Q19-29","quiz":19,"num":29,"sec":"1.9","q":"Notwithstanding any contrary provision of R.A. No. 1405 and other general or special laws, the Commissioner of Internal Revenue is authorized to inquire into bank deposits:\nCase 1: of a decedent to determine his gross estate.\nCase 2: of any taxpayer who has filed an application for compromise of his tax liability by reason of financial incapacity, provided there is a waiver of his privilege under R.A. No. 1405 or under other general or special laws.","opts":["True in both cases","False in both cases","True only in the first case","True only in the second case"],"ans":0,"exp":"Both are allowed under Sec. 6(F). The CIR may inquire into a decedent's bank deposits to determine the gross estate, and into the deposits of a taxpayer applying for compromise on financial incapacity who has waived bank secrecy in writing. The waiver is a condition for the second case only.","notes":["Sec. 6(F) cases: decedent, financial incapacity compromise (with waiver), treaty exchange-of-information request.","Waiver of RA 1405 is required only in the compromise case.","TRAIN (Sec. 97): banks may allow withdrawal from a decedent's deposit subject to a 6% final withholding tax."],"upd":"","key":""},{"id":"Q19-30","quiz":19,"num":30,"sec":"1.9","q":"First statement: The Commissioner may prescribe the manner of compliance with any documentary or procedural requirement in connection with the submission or preparation of financial statements accompanying the tax returns.\nSecond statement: The Commissioner may delegate the power to recommend the promulgation of rules and regulations by the Secretary of Finance.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"The first statement is correct under Sec. 6(H). The second is wrong: Sec. 7 makes the power to recommend the promulgation of rules and regulations to the Secretary of Finance non-delegable.","notes":["Non-delegable (Sec. 7): recommend rules and regulations; issue rulings of first impression or reverse, revoke or modify existing rulings.","Also non-delegable: compromise or abate tax liability (except via Evaluation Boards), and assign or reassign officers to excise establishments.","Rules and regulations are promulgated by the Secretary of Finance upon the CIR's recommendation (Sec. 244)."],"upd":"","key":""},{"id":"Q20-01","quiz":20,"num":1,"sec":"1.A","q":"It is the act of laying a tax, i.e., the process or means by which the sovereign, through its lawmaking body, raises income to defray the necessary expenses of government.","opts":["Taxation","Power of eminent domain","Police power","None of the choices"],"ans":0,"exp":"This is the classic definition of taxation: the power of the sovereign, exercised through the legislature, to raise revenue for the expenses of government. Eminent domain takes private property for public use with just compensation, and police power regulates persons and property for the general welfare; neither is primarily a means of raising revenue.","notes":["Taxation: raises revenue to support the government.","The power is exercised by the lawmaking body (legislative in character).","Taxation is inherent in sovereignty; it exists even without a constitutional grant."],"upd":"","key":""},{"id":"Q20-02","quiz":20,"num":2,"sec":"1.A","q":"It is the power of the State, or those to whom the power has been delegated, to take private property for public use upon paying the owner just compensation to be ascertained according to law.","opts":["Taxation","Power of eminent domain","Police power","None of the choices"],"ans":1,"exp":"Eminent domain is the power to take private property for public use upon payment of just compensation (Art. III, Sec. 9, Constitution). The key markers are the taking of specific property, public use, and just compensation. Taxation and police power do not involve a taking of particular property for public use.","notes":["Elements of eminent domain: taking of private property, for public use, with just compensation.","It may be delegated to LGUs and even to public utilities or public service companies.","Compensation is the full and fair equivalent (market value) of the property taken."],"upd":"","key":""},{"id":"Q20-03","quiz":20,"num":3,"sec":"1.A","q":"It is the power of the State to enact such laws in relation to persons and property as may promote public health, public morals, public safety and the general welfare of the people.","opts":["Taxation","Power of eminent domain","Police power","None of the choices"],"ans":2,"exp":"Police power is the power to regulate liberty and property to promote public health, morals, safety and general welfare. It is the broadest of the three inherent powers. Taxation raises revenue, while eminent domain takes property for public use with just compensation.","notes":["Police power regulates both liberty and property.","It is the most pervasive of the inherent powers.","The compensation is intangible: the altruistic feeling of contributing to the general welfare."],"upd":"","key":""},{"id":"Q20-04","quiz":20,"num":4,"sec":"1.A","q":"The following are common to the inherent power of taxation, power of eminent domain and police power, except:","opts":["They are necessary attributes of sovereignty.","They interfere with private rights and property.","They affect all persons or the public.","They are legislative in implementation."],"ans":2,"exp":"Only taxation and police power generally operate on a community or class of persons. Eminent domain affects only the particular owner whose property is taken, so \"they affect all persons or the public\" is the odd one. The three powers are all inherent attributes of sovereignty, all interfere with private rights and property, and all are legislative in nature.","notes":["Common to all three: inherent in the State, exist independently of the Constitution, interfere with private rights and property, legislative in character, presuppose equivalent compensation.","Eminent domain operates on a particular property owner, not the public at large.","Taxation and police power apply to a community or class of individuals."],"upd":"","key":""},{"id":"Q20-05","quiz":20,"num":5,"sec":"1.A","q":"The power of taxation proceeds upon what theory?","opts":["Government is a necessity theory","Benefits received theory","Ability to pay","Severance test"],"ans":0,"exp":"The power of taxation proceeds upon the theory that the existence of government is a necessity: it cannot continue without means to pay its expenses, so it has the right to compel citizens and property within its limits to contribute. The benefits received theory is the basis of taxation (reciprocal duties), ability to pay is a canon of equality, and the severance test relates to stock dividends.","notes":["Theory (why the power exists): necessity of government.","Basis (justification): benefits received, the reciprocal duties of protection and support.","Ability to pay is the principle of equality or theoretical justice."],"upd":"","key":""},{"id":"Q20-06","quiz":20,"num":6,"sec":"1.A","q":"The government's ability to serve the people depends on taxation. Since taxes are collected for their benefit, taxes may be imposed even in the absence of a constitutional grant, and collection of taxes cannot be stopped. This describes:","opts":["Government is a necessity theory","Benefits received theory","Ability to pay","Lifeblood theory"],"ans":3,"exp":"Under the lifeblood doctrine, taxes are the lifeblood of the government and their prompt and certain availability is an imperious need. Its manifestations include imposition of tax even without a constitutional grant, the right to select objects of taxation, and the rule that no injunction lies to restrain tax collection. The other theories explain why or on what basis taxes are levied, not these consequences.","notes":["Lifeblood manifestations: tax without constitutional grant, right to select objects, no injunction against collection.","No court may enjoin collection of national internal revenue taxes (Sec. 218, NIRC); the CTA may suspend collection only in limited cases.","The lifeblood doctrine also underlies the strict construction of tax exemptions against the taxpayer."],"upd":"","key":""},{"id":"Q20-07","quiz":20,"num":7,"sec":"1.A","q":"Taxation is based on the principle of reciprocal duties of protection and support between the State and its inhabitants. This describes:","opts":["Government is a necessity theory","Benefits received theory","Ability to pay","Lifeblood theory"],"ans":1,"exp":"The benefits received (benefit-protection) theory holds that the State collects taxes so it can perform its functions, while the people pay taxes to enjoy the benefits of organized society. This reciprocity is the basis of taxation. The necessity theory explains the existence of the power, and ability to pay concerns equity in distributing the burden.","notes":["Basis of taxation: reciprocal duties of protection (by the State) and support (by the people).","A taxpayer cannot refuse to pay by claiming no direct benefit was received.","The benefit need not be direct or measurable; it is the general benefit of organized society."],"upd":"","key":""},{"id":"Q20-08","quiz":20,"num":8,"sec":"1.A","q":"First statement: In the exercise of the power of taxation, the State can tax anything, at any time, and at any amount.\nSecond statement: Taxes may be imposed not only to raise revenue, but also to provide incentives and disincentives to certain activities within the State.","opts":["Both statements are correct.","Both statements are incorrect.","The first statement is correct, the second is incorrect.","The first statement is incorrect, the second is correct."],"ans":0,"exp":"The power of taxation is comprehensive, plenary, unlimited and supreme, so the first statement describes its breadth (subject only to inherent and constitutional limitations). The second statement is also correct: besides revenue, taxes serve regulatory (sumptuary) purposes, such as incentives for desired activities and disincentives like sin taxes and protective tariffs.","notes":["Taxation is plenary, comprehensive and supreme, but subject to inherent and constitutional limitations.","Legislature determines the subject, purpose (public), amount or rate, and manner of collection.","Purposes of taxation: revenue (primary) and regulatory or sumptuary (secondary)."],"upd":"","key":""},{"id":"Q20-09","quiz":20,"num":9,"sec":"1.A","q":"Which one of the following is not a characteristic of the State's power to tax?","opts":["It is inherent in sovereignty.","It is legislative in character.","It is based on the ability to pay.","It is subject to constitutional and inherent limitations."],"ans":2,"exp":"The characteristics of the power to tax are that it is inherent in sovereignty, legislative in character, and subject to constitutional and inherent limitations. Ability to pay is a canon of a sound tax system (equality), not a characteristic of the power itself; a tax is valid even if not perfectly aligned with ability to pay.","notes":["Nature of the power: inherent, legislative, subject to limitations.","Inherent: may be exercised even without an express constitutional grant.","Ability to pay belongs to the canons of taxation (equality or theore
