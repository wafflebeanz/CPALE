tical justice)."],"upd":"","key":""},{"id":"Q20-10","quiz":20,"num":10,"sec":"1.A","q":"Which of the following is not one of the canons of a sound tax system?","opts":["Quantifiability","Equality","Certainty","Convenience"],"ans":0,"exp":"Adam Smith's canons are equality, certainty, convenience and economy, and the Philippine formulation lists fiscal adequacy, equality (theoretical justice) and administrative feasibility. Quantifiability is not a recognized canon. Equality, certainty and convenience all appear in the classic canons.","notes":["Philippine principles: fiscal adequacy, equality or theoretical justice, administrative feasibility.","Adam Smith's canons: equality, certainty, convenience, economy.","Violating a canon does not by itself make a tax invalid, unless it also violates the Constitution."],"upd":"","key":""},{"id":"Q20-11","quiz":20,"num":11,"sec":"1.A","q":"Which of the inherent powers may be exercised not only by the government but also by public service companies and public utilities?","opts":["Taxation","Eminent domain","Taxation and police power","Police power"],"ans":1,"exp":"Eminent domain may be delegated by law to public service companies and public utilities (e.g., power and railroad companies) for their public purposes. Taxation and police power may be delegated only to government units, such as LGUs, and never to private entities.","notes":["Eminent domain: may be exercised by the State, LGUs and public utilities or public service companies when authorized by law.","Taxation: exercised only by the government (Congress, and LGUs under Art. X, Sec. 5).","Police power: exercised only by the government and its political subdivisions."],"upd":"","key":""},{"id":"Q20-12","quiz":20,"num":12,"sec":"1.A","q":"Which of the inherent powers has no direct and immediate benefit, only such as may arise from the maintenance of a healthy economic standard of society (damnum absque injuria, or damage without injury)?","opts":["Taxation","Eminent domain","Taxation and police power","Police power"],"ans":3,"exp":"In police power, the compensation is only the intangible benefit of living in a healthy, orderly society; any loss suffered is damnum absque injuria. Taxation gives the protection and benefits of government in return, and eminent domain gives just compensation for the property taken.","notes":["Police power compensation: the altruistic feeling of contributing to the general welfare.","Taxation compensation: protection and benefits from the government.","Eminent domain compensation: just compensation (full and fair equivalent)."],"upd":"","key":""},{"id":"Q20-13","quiz":20,"num":13,"sec":"1.A","q":"Which of the inherent powers has no limit as to the amount of imposition?","opts":["Taxation","Eminent domain","Taxation and police power","Police power"],"ans":0,"exp":"Taxation has no limit on the amount that may be imposed; the legislature fixes the rate, subject only to constitutional limits (\"the power to tax is the power to destroy\"). Police power exactions (license fees) must be limited to the cost of regulation, and eminent domain is limited to paying just compensation for the property taken.","notes":["Taxation: no limit on amount, rate fixed by the legislature.","Police power license fees: limited to the cost of regulation, inspection and surveillance.","Eminent domain: the State pays, it does not collect; payment equals just compensation."],"upd":"","key":""},{"id":"Q20-14","quiz":20,"num":14,"sec":"1.A","q":"Which of the inherent powers is superior to the non-impairment of obligations clause of the Constitution?","opts":["Taxation","Eminent domain","Taxation and police power","Police power"],"ans":3,"exp":"Police power is superior to the non-impairment clause: contracts may be impaired by valid police measures because all contracts are deemed subject to the State's regulatory power. Taxation, by contrast, is subject to the non-impairment clause (a contractual tax exemption granted for valuable consideration cannot be unilaterally revoked), and eminent domain requires just compensation.","notes":["Police power: superior to the non-impairment clause.","Taxation and eminent domain: inferior to (subject to) the non-impairment clause.","Franchises are an exception: they are always subject to amendment, alteration or repeal by Congress (Art. XII, Sec. 11)."],"upd":"","key":""},{"id":"Q20-15","quiz":20,"num":15,"sec":"1.A","q":"Which of the inherent powers leads to transfer of the right to property, either ownership or a lesser right?","opts":["Taxation","Eminent domain","Taxation and police power","Police power"],"ans":1,"exp":"Eminent domain involves a taking: ownership or a lesser right (such as an easement) is transferred to the State or its delegate. Taxation takes money as a contribution but does not transfer a specific property right, and police power only restricts use or destroys noxious property without a transfer of title.","notes":["Eminent domain: transfer of the right to property (full ownership or lesser right such as an easement).","Police power: regulation or restraint of use; noxious property may be destroyed, not taken for use.","Taxation: a contribution in money, not a transfer of a particular property."],"upd":"","key":""},{"id":"Q20-16","quiz":20,"num":16,"sec":"1.A","q":"These are part and parcel of the power of taxation and originate from the very nature of taxation.","opts":["Inherent limitations","Constitutional limitations","Basic principles of a sound tax system","None of the choices"],"ans":0,"exp":"Inherent limitations arise from the very nature of the taxing power and exist even without being written in the Constitution. Constitutional limitations are those expressly imposed by the Constitution, and the canons of a sound tax system are policy guides, not legal limits.","notes":["Inherent limitations: public purpose, non-delegation, territoriality, exemption of government entities, international comity.","Some authors add double taxation as a sixth; the majority count only five.","Inherent limitations exist even without constitutional text."],"upd":"","key":""},{"id":"Q20-17","quiz":20,"num":17,"sec":"1.A","q":"These are restrictions imposed by the Constitution.","opts":["Inherent limitations","Constitutional limitations","Basic principles of a sound tax system","None of the choices"],"ans":1,"exp":"Constitutional limitations are the express restrictions written into the Constitution, such as due process, equal protection, uniformity, non-impairment of contracts, no imprisonment for non-payment of poll tax, and the exemptions for religious, charitable and educational property. Inherent limitations come from the nature of taxation itself.","notes":["Examples: due process, equal protection, uniformity and equity, non-impairment, non-imprisonment for poll tax.","Revenue bills must originate exclusively in the House of Representatives (Art. VI, Sec. 24).","Tax exemption laws need a majority vote of all members of Congress (Art. VI, Sec. 28(4))."],"upd":"","key":""},{"id":"Q20-18","quiz":20,"num":18,"sec":"1.A","q":"The proceeds of the tax must be used for the support of the State or for some recognized objects of government, or directly promote the welfare of the community. This describes:","opts":["The tax imposed should be for public purpose.","There should be no improper delegation of the taxing power.","The power to tax is limited to the territorial jurisdiction of the taxing government.","Exemption of government entities from taxation."],"ans":0,"exp":"This is the public purpose limitation: taxes may be levied only for a public purpose, meaning the proceeds must support the government or its recognized objects or promote community welfare. The other choices refer to non-delegation, territoriality and the exemption of government entities, which concern who may tax, where, and whom.","notes":["Public purpose is tested by the use of proceeds, not the immediate recipients.","Incidental benefit to private persons does not defeat a public purpose.","A tax for a purely private purpose is invalid as a taking without due process."],"upd":"","key":""},{"id":"Q20-19","quiz":20,"num":19,"sec":"1.A","q":"A tax does not meet the public purpose limitation if it:","opts":["is for the welfare of the nation or greater portion of the population.","affects the area as a community rather than as individuals.","is for the benefit principally of limited subjects or objects.","is designed to support the services of government for some of its recognized objects."],"ans":2,"exp":"A tax whose proceeds principally benefit limited subjects or private objects fails the public purpose test. The other choices describe what a public purpose is: the welfare of the nation or the greater portion of the population, benefit to the community as a whole, and support of recognized government objects.","notes":["Public purpose tests: welfare of the nation or greater portion of the population; the community as a whole; recognized objects of government.","Principal benefit to a few private persons makes the tax invalid.","The legislature's determination of public purpose is given great weight by the courts."],"upd":"","key":""},{"id":"Q20-20","quiz":20,"num":20,"sec":"1.A","q":"The principle of separation of powers ordains that each of the three branches of government has exclusive cognizance of and is supreme in matters falling within its own constitutionally allocated sphere. This is the basis of which limitation?","opts":["The tax imposed should be for public purpose.","There should be no improper delegation of the taxing power.","The power to tax is limited to the territorial jurisdiction of the taxing government.","Exemption of government entities from taxation."],"ans":1,"exp":"The non-delegation of the taxing power rests on separation of powers: taxation is a legislative power, so Congress may not delegate the power to tax to the executive or judiciary. Exceptions are delegation to LGUs (Art. X, Sec. 5), to the President on tariff matters (Art. VI, Sec. 28(2)), and to administrative agencies on matters of detail (e.g., fixing values).","notes":["Taxing power is legislative, so it generally cannot be delegated.","Exceptions: LGUs, the President (flexible tariff clause), administrative agencies on details of implementation.","Delegata potestas non potest delegari: delegated power may not be re-delegated."],"upd":"","key":""},{"id":"Q20-21","quiz":20,"num":21,"sec":"1.A","q":"This stems from the principle that we pay taxes for the protection and services provided by the taxing authority, which could not be provided outside the territorial boundaries of the taxing state.","opts":["The tax imposed should be for public purpose.","There should be no improper delegation of the taxing power.","The power to tax is limited to the territorial jurisdiction of the taxing government.","Exemption of government entities from taxation."],"ans":2,"exp":"Territoriality holds that the State may tax only persons, property and transactions within its jurisdiction, because the protection and benefits for which taxes are paid cannot be extended beyond its borders. It flows from the benefits received theory.","notes":["Territoriality: taxes are imposed only within the jurisdiction of the taxing authority.","Exceptions exist where the taxpayer remains within the State's jurisdiction, such as resident citizens taxed on worldwide income.","Situs rules implement territoriality."],"upd":"","key":""},{"id":"Q20-22","quiz":20,"num":22,"sec":"1.A","q":"The place or authority that has the right to impose and collect taxes.","opts":["Situs of taxation","Sources of taxable income","Scope of taxation","None of the choices"],"ans":0,"exp":"Situs of taxation is the place of taxation, the State or authority with jurisdiction to impose and collect the tax. It applies the territoriality principle. Sources of income and scope of taxation are different concepts.","notes":["Situs of real property: where it is located (lex rei sitae).","Situs of income from services: where the services are performed.","Situs of personal property: generally follows the owner (mobilia sequuntur personam), subject to exceptions."],"upd":"","key":""},{"id":"Q20-23","quiz":20,"num":23,"sec":"1.A","q":"Government agencies performing governmental functions are exempt from tax unless expressly taxed, while those performing proprietary functions are subject to tax unless expressly exempted. This describes:","opts":["The tax imposed should be for public purpose.","There should be no improper delegation of the taxing power.","The power to tax is limited to the territorial jurisdiction of the taxing government.","Exemption of government entities from taxation."],"ans":3,"exp":"This is the inherent limitation on exemption of government entities: taxing itself would merely move money from one pocket to another, so agencies performing governmental functions are exempt unless expressly taxed. Entities performing proprietary functions, such as most GOCCs, are taxable unless expressly exempted.","notes":["Governmental function: exempt unless expressly taxed; proprietary function: taxable unless expressly exempted.","GOCCs are taxable except GSIS, SSS, PhilHealth and local water districts (Sec. 27(C), NIRC).","PAGCOR and PCSO are no longer on the Sec. 27(C) exempt list."],"upd":"","key":""},{"id":"Q20-24","quiz":20,"num":24,"sec":"1.A","q":"A fundamental rule in taxation is that the property of one country may not be taxed by another country. This is known as:","opts":["international law.","international comity.","reciprocity.","international inhibition."],"ans":1,"exp":"International comity is the courtesy or respect that sovereign states observe toward one another; a State will not tax the property of another sovereign, as this would be inconsistent with sovereign equality. Reciprocity is a separate device (e.g., for exempting intangibles of nonresident aliens) and requires mutual treatment.","notes":["International comity: sovereign equality of states; par in parem non habet imperium.","Property of a foreign government used for diplomatic purposes is not taxed.","Reciprocity: Sec. 104 NIRC exemption of intangible personal property of nonresident alien decedents."],"upd":"","key":""},{"id":"Q20-25","quiz":20,"num":25,"sec":"1.A","q":"Which of the following is not an element of double taxation?","opts":["Two taxes","Same subject matter","Same year","Same amount"],"ans":3,"exp":"Direct double taxation means taxing twice by the same taxing authority, within the same jurisdiction, for the same purpose, in the same taxing period, on the same subject. The amount of the two taxes need not be the same. Two taxes, same subject matter and same year are all elements.","notes":["Elements of direct double taxation: same subject, same purpose, same taxing authority, same jurisdiction, same period, same kind of tax.","Double taxation is not prohibited by the Constitution unless it violates equal protection or uniformity.","Remedies for international double taxation: tax treaties, tax credits, deductions, exemptions."],"upd":"","key":""},{"id":"Q20-26","quiz":20,"num":26,"sec":"1.A","q":"Compliance with procedural requirements must be followed strictly to avoid a collision course between the State's power to tax and the individual's recognized rights. This refers to:","opts":["Due process of law","Equity in taxation","Non-infringement of religious freedom","Non-impairment of obligation of contracts"],"ans":0,"exp":"Due process (Art. III, Sec. 1) requires that the tax be imposed under a valid law and collected through fair and reasonable procedures, such as proper notice and opportunity to be heard in assessments. Strict compliance with procedure (e.g., issuing a PAN and FAN) protects the taxpayer's rights.","notes":["Substantive due process: valid law, public purpose, not arbitrary or confiscatory.","Procedural due process: notice and hearing (e.g., informing the taxpayer of the factual and legal bases of an assessment, Sec. 228).","An assessment issued without due process is void."],"upd":"","key":""},{"id":"Q20-27","quiz":20,"num":27,"sec":"1.A","q":"There is due process if the deprivation of life, liberty or property is done:\nI. under the authority of a law that is valid or of the Constitution itself.\nII. after compliance with fair and reasonable methods of procedure prescribed by law.","opts":["Both I and II are correct","Only I is correct","Both I and II are incorrect","Only II is correct"],"ans":0,"exp":"Due process has two aspects: substantive (the deprivation must be under a valid law) and procedural (it must follow fair and reasonable procedure). Both statements are correct and together make up due process under Art. III, Sec. 1 of the Constitution.","notes":["Statement I is substantive due process; Statement II is procedural due process.","No person shall be deprived of life, liberty or property without due process of law (Art. III, Sec. 1).","Equal protection is a separate guarantee in the same section."],"upd":"","key":""},{"id":"Q20-28","quiz":20,"num":28,"sec":"1.A","q":"The City Council of Masbate passed an ordinance imposing an occupation tax on air-conditioning technicians. Antonio is the only person with that occupation in the city. He challenged the ordinance as discriminatory since he is the only one adversely affected. Which is correct?","opts":["The contention of Antonio is tenable.","The ordinance is unconstitutional because Antonio is denied his right to equal protection of the law.","The contention of Antonio is not justified, because the rule on uniformity is not violated considering that the ordinance would also apply to all air-conditioning technicians who may come within the jurisdiction of the city.","The issue on the validity or invalidity of the ordinance should be set aside."],"ans":2,"exp":"Uniformity requires that all subjects of the same class be taxed alike. The tax applies to the whole class of air-conditioning technicians, present and future, so it is not discriminatory merely because only one person currently belongs to the class. A valid classification does not violate uniformity or equal protection.","notes":["Uniformity: persons or things belonging to the same class are taxed at the same rate.","A tax is uniform even if only one person currently falls within the class, as long as it applies to all who may later join it.","Valid classification: substantial distinctions, germane to the purpose, not limited to existing conditions, applies equally to all members."],"upd":"","key":""},{"id":"Q20-29","quiz":20,"num":29,"sec":"1.A","q":"A fixed license fee on the sale of Bibles and other religious literature is a violation of:","opts":["non-infringement of religious freedom.","no appropriation for religious purposes.","exemption of religious, charitable or educational entities, non-profit cemeteries and churches from property taxation.","exemption of revenues and assets of non-stock, non-profit educational institutions and donations for educational purposes from taxes and duties."],"ans":0,"exp":"A fixed license fee imposed as a condition for the sale of religious literature restrains the free exercise of religion (Art. III, Sec. 5), as held in American Bible Society v. City of Manila. The other choices deal with appropriation of public money and property tax exemptions, which are not involved.","notes":["A license fee on the free exercise of religion is unconstitutional (American Bible Society v. City of Manila).","But a tax on income or property of a religious group from non-religious activity is valid.","VAT on sale of religious articles is valid if not a prior restraint (Tolentino v. Secretary of Finance)."],"upd":"","key":""},{"id":"Q20-30","quiz":20,"num":30,"sec":"1.A","q":"Congress granted a franchise to Ruthie Shipping Lines to operate a passenger and freight service between Manila and Cebu City on the condition that it carry government mail free of charge. It was then exempted from the payment of franchise tax. A later law removed the exemption because the government needed funds for its projects. Was the law valid?","opts":["Yes, because the government has the power to remove exemptions if the need for public funds arose.","Yes, because Congress has the sole prerogative to enact laws, including the removal of exemptions.","No, because the grant of the franchise tax exemption was for valid consideration, which may be considered a contract. To remove the tax exemption would impair the obligation of contract.","No, because Congress can only enact laws. It cannot remove or withdraw exemptions."],"ans":1,"exp":"A franchise is granted only on the condition that it is subject to amendment, alteration or repeal by Congress when the common good so requires (Art. XII, Sec. 11). A tax exemption in a franchise is therefore not protected by the non-impairment clause, even if the grantee gives consideration such as carrying mail free, and Congress may withdraw it (Tolentino v. Secretary of Finance). Choice c states the rule for ordinary contractual exemptions, which does not apply to franchises; choice d is wrong because the power to grant exemptions includes the power to revoke them.","notes":["Franchises are always subject to amendment, alteration or repeal by Congress (Art. XII, Sec. 11).","Contractual tax exemptions (for valuable consideration) outside franchises cannot be revoked unilaterally.","Tax exemptions are construed strictly against the taxpayer."],"upd":"","key":"Source key says C (non-impairment). Overridden to B: under Art. XII, Sec. 11 and settled rulings (Tolentino v. Secretary of Finance), franchise tax exemptions may be withdrawn by Congress; A is also arguable, but B states the proper basis."},{"id":"Q20-31","quiz":20,"num":31,"sec":"1.A","q":"No person shall be imprisoned for non-payment of this.","opts":["Property tax","Excise tax","Poll tax","Income tax"],"ans":2,"exp":"Art. III, Sec. 20 of the Constitution provides that no person shall be imprisoned for debt or non-payment of a poll tax. A poll tax (e.g., community tax) is a fixed tax on persons regardless of property or occupation. Failure to pay other taxes such as income tax can lead to imprisonment for tax crimes.","notes":["Poll or capitation tax: e.g., the community tax (cedula).","Non-imprisonment applies only to the non-payment itself; fraud or falsification can still be punished.","Imprisonment may be imposed for violations of the NIRC such as willful failure to pay income tax."],"upd":"","key":""},{"id":"Q20-32","quiz":20,"num":32,"sec":"1.A","q":"Which statement is wrong? A revenue bill:","opts":["must originate from the House of Representatives, and on the same bill the Senate may propose amendments.","may originate from the Senate, and on the same bill the House of Representatives may propose amendments.","may have a House version and a Senate version approved separately.","may be recommended by the President to Congress."],"ans":1,"exp":"Appropriation, revenue and tariff bills, bills authorizing an increase of the public debt, bills of local application and private bills must originate exclusively in the House of Representatives, though the Senate may propose or concur with amendments (Art. VI, Sec. 24). A revenue bill cannot originate from the Senate, so choice b is wrong. The Senate may still pass its own version (Tolentino v. Secretary of Finance), and the President may recommend bills.","notes":["Revenue, tariff and appropriation bills originate exclusively in the House (Art. VI, Sec. 24).","The Senate may propose amendments, even a substitute bill, and its version may be approved separately.","What must originate in the House is the revenue bill, not the law itself."],"upd":"","key":""},{"id":"Q20-33","quiz":20,"num":33,"sec":"1.A","q":"First statement: The President shall have the power to veto any particular item or items in an appropriation, revenue, or tariff bill, but the veto shall not affect the item or items to which he does not object.\nSecond statement: The President shall have the power to veto any particular item or items in a bill that penalizes crimes, but the veto shall not affect the item or items to which he does not object.","opts":["The first statement is correct, the second is wrong.","The first statement is wrong, the second is correct.","Both statements are wrong.","Both statements are correct."],"ans":0,"exp":"The item veto applies only to appropriation, revenue and tariff bills (Art. VI, Sec. 27(2)). For all other bills, including penal laws, the President must approve or veto the bill as a whole. So the first statement is correct and the second is wrong.","notes":["Item veto: appropriation, revenue and tariff bills only.","Other bills: all-or-nothing approval or veto.","Congress may override a veto by a two-thirds vote of all members of each House."],"upd":"","key":""},{"id":"Q20-34","quiz":20,"num":34,"sec":"1.A","q":"This requires that all subjects or objects of taxation, similarly situated, are to be treated alike or put on equal footing both in privileges and liabilities.","opts":["Due process","Uniformity","Progressive taxation","None of the choices"],"ans":1,"exp":"Uniformity (Art. VI, Sec. 28(1)) means all taxable articles or persons of the same class are taxed at the same rate, and those similarly situated are treated alike in privileges and liabilities. Progressive taxation refers to rates increasing with the tax base, and due process concerns valid law and fair procedure.","notes":["The rule of taxation shall be uniform and equitable (Art. VI, Sec. 28(1)).","Congress shall evolve a progressive system of taxation (a directive, not a limitation).","Uniformity allows reasonable classification."],"upd":"","key":""},{"id":"Q20-35","quiz":20,"num":35,"sec":"1.A","q":"Congress may, by law, authorize the President to fix within specified limits, and subject to such limitations and restrictions as it may impose, the following, except:","opts":["tariff rates, import and export quotas.","tonnage and wharfage dues.","other duties or imposts.","none of the choices."],"ans":3,"exp":"Under the flexible tariff clause (Art. VI, Sec. 28(2)), Congress may authorize the President to fix tariff rates, import and export quotas, tonnage and wharfage dues, and other duties or imposts within the framework of the national development program. All of choices a to c may be delegated, so none is an exception.","notes":["Flexible tariff clause: Art. VI, Sec. 28(2); implemented through the Customs Modernization and Tariff Act.","It is an exception to the non-delegation of the taxing power.","The delegation must be by law and within specified limits."],"upd":"","key":""},{"id":"Q20-36","quiz":20,"num":36,"sec":"1.A","q":"The basis or test of exemption of real properties owned by religious or charitable entities from real property taxes is:","opts":["use of the real property.","ownership of the real property.","location of the real property.","ownership or location of the real property at the option of the government."],"ans":0,"exp":"The constitutional exemption (Art. VI, Sec. 28(3)) covers lands, buildings and improvements actually, directly and exclusively used for religious, charitable or educational purposes. The test is use, not ownership: property owned by a church but leased for commercial purposes is taxable (Abra Valley College v. Aquino; Lung Center v. Quezon City).","notes":["Test: actual, direct and exclusive use for religious, charitable or educational purposes.","Portions leased or used commercially are taxable.","The exemption covers only real property taxes, not income taxes."],"upd":"","key":""},{"id":"Q20-37","quiz":20,"num":37,"sec":"1.A","q":"A hospital, put up primarily as a charitable institution, has admitted pay patients. The hospital devotes the income from paying patients to the improvement of the charity wards, which represent 2/3 of the bed capacity, aside from out-charity patients who come only for consultation. Which is correct as regards the hospital?","opts":["The hospital is subject to income tax because it is now engaged in an income-oriented activity.","The hospital is exempt from income tax because it is exclusively using the income for charitable purposes.","The hospital is subject to income tax because, as a rule, hospitals are subject to income tax.","The hospital is exempt from income tax because the majority of its patients are in the charity ward."],"ans":0,"exp":"Income from activities conducted for profit (pay patients) is taxable regardless of how the income is disposed of (last paragraph of Sec. 30, NIRC). In CIR v. St. Luke's Medical Center, the Supreme Court held such a hospital liable for income tax on income from paying patients, at the 10% preferential rate for non-profit hospitals under Sec. 27(B). Use of the income for charity or a majority of charity patients does not make it exempt.","notes":["Income of charitable institutions from activities conducted for profit is taxable regardless of its disposition.","Proprietary educational institutions and non-profit hospitals: 10% (Sec. 27(B)), unless gross income from unrelated activities exceeds 50%.","For real property tax, portions used for pay patients are taxable (Lung Center v. Quezon City)."],"upd":"","key":""},{"id":"Q20-38","quiz":20,"num":38,"sec":"1.A","q":"No law granting any tax exemption shall be passed without the concurrence of a majority of all the:","opts":["members of the Congress.","members of the majority party of the Congress.","members of Congress present during the deliberation of the tax exemption bill.","members of the Ways and Means Committee of the Congress."],"ans":0,"exp":"Art. VI, Sec. 28(4) requires the concurrence of a majority of all the members of Congress to pass a law granting a tax exemption. It is an absolute majority of the entire membership, not merely of those present or of a party or committee. Withdrawal of an exemption needs only an ordinary majority (quorum voting).","notes":["Granting a tax exemption: absolute majority of all members of Congress.","Revoking an exemption: ordinary majority is enough.","Tax exemptions are construed strictissimi juris against the taxpayer."],"upd":"","key":""},{"id":"Q20-39","quiz":20,"num":39,"sec":"1.A","q":"Which of the following statements is/are correct?\nI. All revenues and assets of non-stock, non-profit educational institutions used actually, directly, and exclusively for educational purposes shall be exempt from taxes and duties.\nII. Upon the dissolution or cessation of the corporate existence of such non-stock, non-profit educational institutions, their assets shall be disposed of in the manner provided by law.\nIII. Proprietary educational institutions, including those cooperatively owned, may likewise be entitled to such exemptions subject to the limitations provided by law, including restrictions on dividends and provisions for reinvestment.","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"All three statements are taken directly from Art. XIV, Sec. 4(3) of the Constitution. Non-stock, non-profit educational institutions are exempt on revenues and assets used actually, directly and exclusively for educational purposes; their assets on dissolution are disposed of as the law provides; and proprietary institutions may be granted similar exemptions by law.","notes":["The exemption of non-stock, non-profit educational institutions is self-executing and covers revenues and assets.","Proprietary educational institutions are not automatically exempt; they pay 10% under Sec. 27(B) unless a law grants exemption.","The test is use, not source: even rental income is exempt if proven used actually, directly and exclusively for educational purposes (CIR v. De La Salle University, 2016)."],"upd":"","key":""},{"id":"Q20-40","quiz":20,"num":40,"sec":"1.A","q":"Which of the following statements is correct?\nI. Subject to conditions prescribed by law, all grants, endowments, donations, or contributions used actually, directly, and exclusively for educational purposes shall be exempt from tax.\nII. Congress may provide for incentives, including tax deductions, to encourage private participation in programs of basic and applied scientific research.\nIII. Scholarships, grants-in-aid, or other forms of incentives shall be provided to deserving science students, researchers, scientists, inventors, technologists, and specially gifted citizens.","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Statement I is Art. XIV, Sec. 4(4), and statements II and III come from Art. XIV, Sec. 11 of the Constitution. All three are correct.","notes":["Donations used exclusively for educational purposes: constitutionally exempt, subject to conditions prescribed by law.","Donations to accredited non-profit educational institutions are exempt from donor's tax (Sec. 101(A)(3)) if not more than 30% is used for administration.","Congress may grant tax incentives for scientific research (Art. XIV, Sec. 11)."],"upd":"","key":""},{"id":"Q21-01","quiz":21,"num":1,"sec":"1.B","q":"It is an enforced contribution levied by the state by virtue of its sovereignty on persons and property within its jurisdiction for the support of the government and all public needs.","opts":["Tax","Toll","Special assessment","License"],"ans":0,"exp":"This is the classic definition of a tax: an enforced, proportionate contribution levied by the lawmaking body on persons and property within its jurisdiction for public purposes. A toll is a charge for the use of property, a special assessment is levied on land specially benefited by an improvement, and a license fee is a regulatory charge under police power.","notes":["Tax: enforced contribution, levied by the legislature, for public purpose.","Toll: demand of proprietorship; special assessment: land only, based on special benefit.","License fee: police power, limited to cost of regulation."],"upd":"","key":""},{"id":"Q21-02","quiz":21,"num":2,"sec":"1.B","q":"(Phil. CPA) One of the following is not a characteristic or an element of a tax:","opts":["It is levied by the legislature.","It is payable in money or in kind.","It is proportionate in character.","It is an enforced contribution."],"ans":1,"exp":"A tax is generally payable in money, not in kind. The other choices are true elements: a tax is an enforced contribution, levied by the legislature, and proportionate in character (based on ability to pay).","notes":["Elements: enforced, legislative, proportionate, payable in money, within jurisdiction, for public purpose.","Commonly (not always) paid at regular intervals.","Debt, unlike tax, may be paid in kind."],"upd":"","key":""},{"id":"Q21-03","quiz":21,"num":3,"sec":"1.B","q":"One of the following is not a national tax:","opts":["Income tax","Value-added tax","Documentary stamp tax","Community tax"],"ans":3,"exp":"Community tax is a local tax imposed by cities and municipalities under the Local Government Code (RA 7160). Income tax, VAT and DST are national internal revenue taxes under the NIRC.","notes":["National taxes: income, estate, donor's, VAT, percentage, excise, DST.","Local taxes: real property tax, community tax, local business taxes.","Customs duties are also national taxes (imposed under the CMTA)."],"upd":"","key":""},{"id":"Q21-04","quiz":21,"num":4,"sec":"1.B","q":"(Phil. CPA) A tax on business is:","opts":["a direct tax.","an indirect tax.","a property tax.","a poll tax."],"ans":1,"exp":"Business taxes such as VAT and percentage taxes are indirect: the seller pays them but can shift the burden to the buyer through the price. Direct taxes (e.g. income tax) cannot be shifted, a property tax is on property, and a poll tax is a fixed amount on persons.","notes":["Indirect tax: burden can be shifted (VAT, percentage taxes, excise).","Direct tax: burden stays with the taxpayer (income, estate, donor's).","Business taxes are also excise taxes as to subject matter."],"upd":"","key":""},{"id":"Q21-05","quiz":21,"num":5,"sec":"1.B","q":"(Phil. CPA) The basic community tax of P5.00 of an individual is:","opts":["a property tax.","a direct tax.","a national tax.","an ad valorem tax."],"ans":1,"exp":"The basic community tax is paid by the person on whom it is imposed and cannot be shifted, so it is a direct tax. It is also a personal (poll) tax, a local tax and a specific (fixed amount) tax, which rules out the other choices.","notes":["Basic community tax: P5.00 for individuals (LGC); P500 for corporations.","Classified as direct, personal/poll, local and specific.","No imprisonment for non-payment of poll tax (Constitution)."],"upd":"","key":""},{"id":"Q21-06","quiz":21,"num":6,"sec":"1.B","q":"(Phil. CPA) A tax of fixed proportion to the value of the property with respect to which the tax is assessed, which requires the intervention of assessors or appraisers to estimate the value of such property before the amount due from each taxpayer can be determined, is known as:","opts":["specific.","special or regulatory.","ad valorem.","fiscal."],"ans":2,"exp":"An ad valorem tax is a fixed proportion of the value of the thing taxed, so the value must first be determined by assessors or appraisers. A specific tax is a fixed amount per unit, weight or measure. Special/regulatory and fiscal refer to the purpose of the tax, not how the amount is determined.","notes":["Ad valorem: based on value (e.g. real property tax, VAT, estate tax).","Specific: fixed amount per unit (e.g. excise on cigarettes and liquor).","As to purpose: fiscal/general vs special/regulatory."],"upd":"","key":""},{"id":"Q21-07","quiz":21,"num":7,"sec":"1.B","q":"(Phil. CPA) One of the following is not a general or revenue tax:","opts":["Income tax","Donor's tax","Customs duty","None of the choices"],"ans":2,"exp":"Customs duties (tariffs) are traditionally classified as special or regulatory taxes because they are used to protect local industries and regulate imports, not solely to raise revenue. Income tax and donor's tax are imposed for the general purpose of raising revenue.","notes":["General/fiscal: raises revenue for general government purposes.","Special/regulatory: achieves social or economic ends (e.g. tariffs, protective duties).","A regulatory tax is valid even if it raises little revenue."],"upd":"","key":""},{"id":"Q21-08","quiz":21,"num":8,"sec":"1.B","q":"(Phil. CPA) Which of the following is not an example of an excise tax?","opts":["Transfer tax","Sales tax (now value-added tax)","Real property tax","Income tax"],"ans":2,"exp":"As to subject matter, an excise tax is any tax that is neither a poll tax nor a property tax; it is a tax on the exercise of a right or privilege. Transfer taxes, VAT and income tax are excises in this sense. Real property tax is a property tax.","notes":["Poll tax: on persons (community tax).","Property tax: on property (real property tax).","Excise (broad sense): on rights or privileges; not the same as the NIRC excise tax on sin and mineral products."],"upd":"","key":""},{"id":"Q21-09","quiz":21,"num":9,"sec":"1.B","q":"(Phil. CPA) A kind of tax system where the rate increases as the tax base increases.","opts":["Digressive tax","Proportional tax","Regressive tax","Progressive tax"],"ans":3,"exp":"A progressive tax has rates that rise as the tax base increases, like the graduated income tax on individuals. A proportional tax uses one fixed rate, and a regressive tax has rates that fall as the base rises.","notes":["Progressive: graduated income tax of individuals (0% to 35%).","Proportional: flat rate (e.g. 12% VAT, 6% estate and donor's tax under TRAIN).","The Constitution requires Congress to evolve a progressive system of taxation."],"upd":"TRAIN: estate and donor's taxes are now a flat 6%, so they are proportional rather than progressive as older reviewers state.","key":""},{"id":"Q21-10","quiz":21,"num":10,"sec":"1.B","q":"(Phil. CPA) Toll as distinguished from tax:","opts":["Demand of sovereignty","Imposed by government only","Amount is based on the cost of construction of the public improvement used","Paid for the support of the Government"],"ans":2,"exp":"The amount of a toll depends on the cost of construction or maintenance of the improvement used, while a tax depends on the needs of the State. The other choices describe a tax: it is a demand of sovereignty, imposed only by the government, and paid for the support of the government.","notes":["Toll: demand of proprietorship; may be imposed by government or private entities.","Tax: demand of sovereignty; imposed only by government.","Toll: paid for use of another's property."],"upd":"","key":""},{"id":"Q21-11","quiz":21,"num":11,"sec":"1.B","q":"Special assessment as distinguished from tax:","opts":["Levied on persons, property or the exercise of privilege","Personal liability of the person taxed","Has general application","Exceptional both as to time and place"],"ans":3,"exp":"A special assessment is exceptional as to time and place: it is levied only on land specially benefited by a particular public improvement. The other choices describe a tax, which is levied on persons, property or privileges, is a personal liability, and has general application.","notes":["Special assessment: levied on land only, based on special benefit.","Not a personal liability; it attaches to the land.","Exemption from tax does not include exemption from special assessment."],"upd":"","key":""},{"id":"Q21-12","quiz":21,"num":12,"sec":"1.B","q":"(Phil. CPA) The distinction of a tax from a permit or license is that a tax is:","opts":["imposed for regulation.","one which involves an exercise of police power.","one in which there is generally no limit on the amount that may be imposed.","imposed through the provisions of the Constitution."],"ans":2,"exp":"The amount of a tax is generally unlimited because it depends on the needs of government, while a license fee is limited to the necessary cost of regulation. Choices a and b describe a license fee (regulation, police power), and taxes are imposed by the legislature, not by the Constitution itself.","notes":["License fee: police power, for regulation, limited to cost of regulation.","Tax: taxing power, for revenue, generally unlimited in amount.","Nonpayment of a license fee makes the business illegal; nonpayment of tax does not."],"upd":"","key":""},{"id":"Q21-13","quiz":21,"num":13,"sec":"1.B","q":"Debt as distinguished from tax:","opts":["Based on law","May be paid in kind","Does not draw interest except when delinquent","Generally not subject to set-off or compensation"],"ans":1,"exp":"A debt may be paid in kind, while a tax is generally payable in money. The other choices describe a tax: it is based on law (debt is based on contract), draws interest only when delinquent, and is generally not subject to set-off or compensation.","notes":["Debt: based on contract, assignable, may be paid in kind, may be set off.","Tax: based on law, not assignable, payable in money, generally not set off.","No imprisonment for debt; imprisonment possible for nonpayment of tax (except poll tax)."],"upd":"","key":""},{"id":"Q21-14","quiz":21,"num":14,"sec":"1.B","q":"Which of the following is designed to regulate conduct?","opts":["Tax","Toll","Penalty","Special assessment"],"ans":2,"exp":"A penalty is a sanction designed to regulate conduct and may be imposed by government or private entities. A tax is primarily for revenue, a toll is payment for use of property, and a special assessment is based on special benefits to land.","notes":["Penalty: regulates conduct; may be imposed by government or private entities.","Tax: primarily raises revenue; imposed by government only.","Regulatory taxes exist, but the defining purpose of a penalty is to regulate conduct."],"upd":"","key":""},{"id":"Q21-15","quiz":21,"num":15,"sec":"1.B","q":"In case of deductions and exemptions on income tax returns, doubts shall be resolved:","opts":["liberally in favor of the taxpayer.","liberally in favor of the employer.","strictly against the government.","strictly against the taxpayer."],"ans":3,"exp":"Deductions and exemptions are matters of legislative grace, so they are construed strictly against the taxpayer claiming them (strictissimi juris); the taxpayer must prove a clear legal basis. By contrast, doubts in the imposition of a tax (tax laws in general) are resolved in favor of the taxpayer.","notes":["Tax laws (imposition): construed against the government.","Exemptions and deductions: construed strictly against the taxpayer.","Exemptions for government agencies and charitable institutions may be construed liberally in their favor."],"upd":"","key":""},{"id":"Q21-16","quiz":21,"num":16,"sec":"1.B","q":"Which of the following is not a legal way of not paying tax?","opts":["Tax avoidance","Tax evasion","Tax exemption","None of the choices"],"ans":1,"exp":"Tax evasion (tax dodging) uses illegal means, such as underdeclaring income or falsifying records, to defeat or reduce tax, and is punishable. Tax avoidance uses legally permissible methods to minimize tax, and tax exemption is an immunity granted by law.","notes":["Tax avoidance: legal (tax minimization).","Tax evasion: illegal (tax dodging); elements include intent and an unlawful act.","Exemption: grant of immunity, strictly construed against the claimant."],"upd":"","key":""},{"id":"Q21-17","quiz":21,"num":17,"sec":"1.B","q":"(Phil. CPA) Which of the following is not a scheme of shifting the incidence of taxation?","opts":["The manufacturer transfers the tax to the consumer by adding the tax to the selling price of the goods sold","The purchaser asks for a discount or refuses to buy at regular prices unless it is reduced by the amount equal to the tax he will pay","Changing the terms of the sale like FOB shipping point in the Philippines to FOB destination abroad, so that the title passes abroad instead of in the Philippines","The manufacturer transfers the sales tax to the distributor, then in turn to the wholesaler, to the retailer and finally to the consumer"],"ans":2,"exp":"Shifting is the transfer of the tax burden to another person. Choice a is forward shifting, choice b is backward shifting, and choice d is onward shifting. Changing the terms of sale so that title passes abroad does not transfer the burden to anyone; it is a way of avoiding the tax altogether.","notes":["Forward shifting: producer to consumer.","Backward shifting: consumer or purchaser back to producer.","Onward shifting: shifted two or more times, forward or backward."],"upd":"","key":""},{"id":"Q21-18","quiz":21,"num":18,"sec":"1.B","q":"(Phil. CPA) In case of conflict between tax laws and generally accepted accounting principles (GAAP):","opts":["both tax laws and GAAP shall be enforced.","GAAP shall prevail over tax laws.","tax laws shall prevail over GAAP.","the issue shall be resolved by the court."],"ans":2,"exp":"Tax laws prevail over GAAP. GAAP are accounting standards and are not law; for tax purposes, taxable income and deductions must follow the Tax Code and its regulations, even if they differ from financial reporting rules.","notes":["Tax law prevails over GAAP for tax purposes.","Differences are reconciled in the income tax return (book vs tax income).","Accounting methods are allowed only if they clearly reflect income (Sec. 43)."],"upd":"","key":""},{"id":"Q21-19","quiz":21,"num":19,"sec":"1.B","q":"(Phil. CPA) \"Schedular system of income taxation\" means:","opts":["all types of income are added together to arrive at gross income.","separate graduated rates are imposed on different types of income.","capital gains are excluded in determining gross income.","compensation income and business/professional income are added together in arriving at gross income."],"ans":1,"exp":"Under a schedular system, different types of income are taxed separately at different rates. Choices a and d describe the global system, where all income is combined and taxed under one rate schedule. The Philippines uses a partly schedular, partly global system (e.g. passive income and capital gains taxed separately).","notes":["Schedular: different types of income, different tax treatment and rates.","Global: all income combined and taxed under one schedule.","Philippine system: semi-schedular/semi-global."],"upd":"","key":""},{"id":"Q21-20","quiz":21,"num":20,"sec":"1.B","q":"The least source of our tax laws.","opts":["Statutes","Court decisions","Constitution","BIR rulings"],"ans":3,"exp":"BIR rulings are administrative interpretations issued to a specific taxpayer on specific facts; they carry the least weight and do not bind the courts. The Constitution, statutes (such as the NIRC) and court decisions (especially Supreme Court decisions, which form part of the law of the land) rank above them.","notes":["Sources: Constitution, statutes, presidential decrees/executive orders, court decisions, revenue regulations, BIR rulings, treaties.","BIR rulings apply only to the requesting taxpayer and the facts stated.","Revenue regulations are issued by the Secretary of Finance upon CIR recommendation (Sec. 244)."],"upd":"","key":""},{"id":"Q22-01","quiz":22,"num":1,"sec":"8","q":"Which of the following fundamental principles governing the exercise of the taxing and other revenue-raising powers of local government units is incorrect?","opts":["Taxation shall be uniform in each local government unit.","The collection of local taxes, fees, charges and other impositions shall in no case be left to any private person.","The revenue collected shall inure solely to the benefit of, and be subject to disposition by, the local government unit levying the tax, fee, charge or other imposition, unless otherwise specifically provided by the Code.","Each local government unit shall, as far as practicable, evolve a proportional system of taxation."],"ans":3,"exp":"Sec. 130 of the LGC requires each LGU, as far as practicable, to evolve a PROGRESSIVE system of taxation, not a proportional one, so choice d is incorrect. Uniformity within each LGU, the prohibition on leaving collection to private persons, and the rule that revenue inures solely to the levying LGU are all fundamental principles under Sec. 130.","notes":["Sec. 130: taxation uniform in each LGU; equitable and based on ability to pay; for public purposes; not unjust, excessive, oppressive or confiscatory; not contrary to law or in restraint of trade.","Collection of local taxes shall never be left to a private person.","LGUs shall evolve a progressive (not proportional) system of taxation."],"upd":"","key":""},{"id":"Q22-02","quiz":22,"num":2,"sec":"8","q":"The power to impose a tax, fee, or charge or to generate revenue under the Local Government Code shall be exercised by:","opts":["the Sanggunian of the local government unit concerned through an appropriate ordinance.","the executive branch of the local government unit concerned through appropriate orders.","the treasurer of the local government unit concerned through appropriate issuances.","any of the three mentioned above."],"ans":0,"exp":"Under Sec. 132 of the LGC, the local taxing power is exercised only by the sanggunian (the local legislative body) through an appropriate ordinance. The mayor or governor and the treasurer implement and collect but cannot levy taxes, because taxation is legislative in character.","notes":["Local taxing power: sanggunian, by ordinance (Sec. 132).","A public hearing is required before enacting a tax ordinance (Sec. 187).","The source of LGU taxing power is the Constitution itself (Art. X, Sec. 5), subject to guidelines set by Congress."],"upd":"","key":""},{"id":"Q22-03","quiz":22,"num":3,"sec":"8","q":"The province may impose a tax on the sale, donation, barter, or any other mode of transferring ownership or title of real property at a rate of not more than fifty percent (50%) of one percent (1%) of:","opts":["the total consideration involved in the acquisition of the property or the fair market value in case the monetary consideration involved in the transfer is not substantial, whichever is higher.","the total consideration involved in the acquisition of the property or the fair market value in case the monetary consideration involved in the transfer is not substantial, whichever is lower.","the total consideration involved in the acquisition of the property.","the fair market value in case the monetary consideration involved in the transfer is not substantial."],"ans":0,"exp":"Sec. 135(a) of the LGC sets the provincial transfer tax at not more than 50% of 1% of the total consideration or the fair market value where the monetary consideration is not substantial, whichever is higher. Using only one base, or the lower of the two, would understate the tax.","notes":["Provincial transfer tax: up to 0.5% (50% of 1%) of the higher of consideration or FMV.","Cities may exceed the provincial rate by up to 50% (Sec. 151), so up to 0.75%.","FMV is the value in the schedule of market values of the province or city."],"upd":"","key":""},{"id":"Q22-04","quiz":22,"num":4,"sec":"8","q":"Notaries public shall furnish the provincial treasurer with a copy of any deed transferring ownership or title to any real property within:","opts":["forty (40) days from the date of notarization.","thirty (30) days from the date of notarization.","twenty-five (25) days from the date of notarization.","twenty (20) days from the date of notarization."],"ans":1,"exp":"Sec. 135(b) of the LGC requires notaries public to furnish the provincial treasurer a copy of any deed transferring ownership or title to real property within 30 days from notarization. This is separate from the 60-day period for the transferor to pay the transfer tax.","notes":["Notary public: furnish copy of the deed within 30 days from notarization.","Payment of transfer tax: within 60 days from execution of the deed or from the decedent's death.","Register of Deeds requires proof of payment before registering the deed."],"upd":"","key":""},{"id":"Q22-05","quiz":22,"num":5,"sec":"8","q":"It shall be the duty of the seller, donor, transferor, executor or administrator to pay the tax on transfer of real property ownership within:","opts":["twenty (20) days from the date of the execution of the deed or from the date of the decedent's death.","thirty (30) days from the date of the execution of the deed or from the date of the decedent's death.","forty (40) days from the date of the execution of the deed or from the date of the decedent's death.","sixty (60) days from the date of the execution of the deed or from the date of the decedent's death."],"ans":3,"exp":"Sec. 135(c) of the LGC places the duty to pay the transfer tax on the seller, donor, transferor, executor or administrator within 60 days from the execution of the deed or from the date of the decedent's death. The 30-day period applies to the notary public's duty to furnish a copy of the deed.","notes":["Transfer tax due within 60 days from execution of deed or decedent's death.","Liable persons: seller, donor, transferor, executor or administrator (not the buyer).","Do not confuse with the national CGT/DST deadlines (30 days / 5 days after close of the month)."],"upd":"","key":""},{"id":"Q22-06","quiz":22,"num":6,"sec":"8","q":"Statement I: The sale, transfer or other disposition of real property pursuant to R.A. No. 6657 (Comprehensive Agrarian Reform Law of 1988) shall be exempt from the tax on transfer of real property ownership.\nStatement II: For purposes of this tax, the Register of Deeds of the province concerned shall, before registering any deed, require the presentation of the evidence of payment of the tax.\nStatement III: The provincial assessor shall likewise make the same requirement before canceling an old tax declaration and issuing a new one in its place.","opts":["All statements are correct","All statements are incorrect","Only statements I and II are correct","Only statement I is correct"],"ans":0,"exp":"All three come from Sec. 135 of the LGC. Transfers under the Comprehensive Agrarian Reform Law are exempt from the transfer tax (Sec. 135(a)); the Register of Deeds must require proof of payment before registering a deed, and the provincial assessor must require the same before canceling an old tax declaration and issuing a new one (Sec. 135(d)).","notes":["CARP (RA 6657) transfers are exempt from the local transfer tax.","Proof of payment is required by the Register of Deeds and the assessor.","Payment of the transfer tax is due within 60 days from execution of the deed or the decedent's death."],"upd":"","key":""},{"id":"Q22-07","quiz":22,"num":7,"sec":"8","q":"Which of the following taxes may not be imposed by a province?","opts":["Tax on transfer of real property ownership","Franchise tax","Professional tax","Travel tax"],"ans":3,"exp":"Travel tax is a national tax (collected by TIEZA under PD 1183 as amended), not a local tax. Provinces may impose the tax on transfer of real property ownership (Sec. 135), franchise tax (Sec. 137) and professional tax (Sec. 139), among others.","notes":["Provincial taxes: transfer of real property, printing and publication, franchise, sand and gravel, professional, amusement, annual fixed tax on delivery trucks or vans.","Professional tax: up to P300 per year, payable to the province where the professional practices.","LGUs cannot levy taxes reserved to the national government (Sec. 133)."],"upd":"","key":""},{"id":"Q22-08","quiz":22,"num":8,"sec":"8","q":"Which of the following taxes may not be imposed by a municipality?","opts":["Tax on business","Fees for sealing and licensing of weights and measures","Fishery rentals, fees and charges","Documentary stamp tax"],"ans":3,"exp":"Documentary stamp tax is a national internal revenue tax under the NIRC, and Sec. 133(a) and (i) bar LGUs from levying taxes like DST, except as otherwise provided. Municipalities may impose business taxes (Sec. 143), fees for sealing and licensing of weights and measures (Sec. 148), and fishery rentals, fees and charges (Sec. 149).","notes":["Municipal taxes: business taxes, fees for weights and measures, fishery rentals, community tax.","Common limitations (Sec. 133) bar LGUs from levying income tax (except on banks and financial institutions), DST, estate and donor's taxes, customs duties, and excise taxes on NIRC articles.","DST, estate and donor's tax remain national taxes."],"upd":"","key":""},{"id":"Q22-10","quiz":22,"num":10,"sec":"8","q":"Municipalities within the Metropolitan Manila Area may levy taxes at rates which shall not exceed by:","opts":["fifty percent (50%) the maximum rates imposed by municipalities.","thirty percent (30%) the maximum rates imposed by municipalities.","twenty percent (20%) the maximum rates imposed by municipalities.","ten percent (10%) the maximum rates imposed by municipalities."],"ans":0,"exp":"Under Sec. 144 of the LGC, municipalities within Metro Manila may levy business taxes at rates exceeding the maximum rates prescribed for municipalities by not more than 50%. The same 50% ceiling applies to cities in relation to provincial and municipal rates (Sec. 151), except the rates of professional and amusement taxes.","notes":["Metro Manila municipalities: up to 50% higher than the maximum municipal business tax rates (Sec. 144).","Cities: up to 50% higher than provincial or municipal rates, except professional and amusement taxes (Sec. 151).","Rate adjustments are allowed not oftener than once every 5 years, by not more than 10% (Sec. 191)."],"upd":"","key":""},{"id":"Q22-11","quiz":22,"num":11,"sec":"8","q":"First statement: A business subject to local business tax shall, upon termination thereof, submit a sworn statement of its gross sales or receipts for the current year.\nSecond statement: If the tax paid during the year is less than the tax due on the gross sales or receipts of the current year, the difference shall be paid before the business is considered officially retired.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Sec. 145 of the LGC requires a business, upon its termination, to submit a sworn statement of its gross sales or receipts for the current year, and any deficiency in the tax paid must be settled before the business is considered officially retired. Both statements are correct.","notes":["Retirement of business: sworn statement of current year gross sales or receipts.","Deficiency must be paid before the business is officially retired.","Business tax is normally based on gross sales or receipts of the preceding calendar year."],"upd":"","key":""},{"id":"Q22-12","quiz":22,"num":12,"sec":"8","q":"Which of the following statements is/are correct?\nI. The business taxes imposed under Section 143 of the LGC shall be payable for every separate or distinct establishment or place where business subject to the tax is conducted.\nII. One line of business does not become exempt by being conducted with some other business for which such tax has been paid.\nIII. The tax on a business must be paid by the person conducting the same.","opts":["I, II and III","I and II only","II and III only","III only"],"ans":0,"exp":"All three statements restate Sec. 146 of the LGC. The business tax is payable for every separate or distinct establishment, a line of business is not exempted merely because it is conducted with another taxed business, and the tax is paid by the person conducting the business.","notes":["Business tax is due for each separate or distinct establishment or place of business.","Each line of business is taxed separately.","Liability rests on the person conducting the business."],"upd":"","key":""},{"id":"Q22-13","quiz":22,"num":13,"sec":"8","q":"Statement I: Where a person conducts or operates two (2) or more of the businesses mentioned in Section 143 of the LGC which are subject to the same rate of tax, the tax shall be computed on the combined total gross sales or receipts of the two or more related businesses.\nStatement II: Where a person conducts or operates two (2) or more businesses mentioned in Section 143 which are subject to different rates of tax, the gross sales or receipts of each business shall be separately reported for the purpose of computing the tax due from each business.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements restate Sec. 146 of the LGC. Businesses with the same rate are taxed on their combined gross sales or receipts, while businesses subject to different rates must report gross sales or receipts separately so each is taxed at its own rate.","notes":["Same rate: combine gross sales or receipts.","Different rates: report separately and compute the tax per business.","Situs of business tax: 30% to the principal office, 70% to the plant or factory location, for manufacturers with a factory (Sec. 150)."],"upd":"","key":""},{"id":"Q22-14","quiz":22,"num":14,"sec":"8","q":"First statement: Except as otherwise provided in the Local Government Code, the city may levy the taxes, fees, and charges which the province or municipality may impose.\nSecond statement: The taxes, fees and charges levied and collected by highly urbanized and independent component cities shall accrue to them and be distributed in accordance with the provisions of the Local Government Code.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Sec. 151 of the LGC allows cities to levy the taxes, fees and charges that provinces or municipalities may impose, at rates up to 50% higher, except professional and amusement taxes. It also provides that taxes collected by highly urbanized and independent component cities accrue to them and are distributed per the Code. Both statements are correct.","notes":["Cities may levy both provincial and municipal taxes (Sec. 151).","City rates may exceed provincial or municipal maximums by up to 50%, except professional and amusement taxes.","Highly urbanized and independent component cities keep the taxes they collect."],"upd":"","key":""},{"id":"Q22-15","quiz":22,"num":15,"sec":"8","q":"Barangays may levy taxes, at a rate not exceeding one percent (1%), which shall exclusively accrue to them, on stores or retailers with fixed business establishments:\nI. in the case of cities, with gross sales or receipts of the preceding calendar year of P50,000 or less.\nII. in the case of municipalities, with gross sales or receipts of the preceding calendar year of P30,000 or less.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 152(a) of the LGC allows barangays to tax stores or retailers with fixed business establishments with gross sales or receipts for the preceding calendar year of P50,000 or less (in cities) and P30,000 or less (in municipalities), at a rate not exceeding 1% of such gross sales or receipts. Both statements are correct.","notes":["Barangay tax on small retailers: up to 1% of gross sales; P50,000 or less (cities), P30,000 or less (municipalities).","Barangays may also collect service fees, barangay clearance fees, and fees on cockpits, places of recreation and billboards.","Barangay clearance must be acted on within 7 working days; otherwise the city or municipality may issue the permit."],"upd":"","key":"No answer given in the source key; under Sec. 152(a) of the LGC both thresholds are correct, so the answer is A."},{"id":"Q22-16","quiz":22,"num":16,"sec":"8","q":"All local taxes, fees, and charges shall be collected by:","opts":["the provincial, city, municipal, or barangay treasurer, or their duly authorized deputies.","the provincial, city, municipal, or barangay treasurer only.","the provincial, city, or municipal treasurer only.","the office of the governor or mayor or their duly authorized deputies."],"ans":0,"exp":"Sec. 170 of the LGC provides that local taxes, fees and charges are collected by the provincial, city, municipal or barangay treasurer, or their duly authorized deputies. Deputies are allowed, so choices b and c are too narrow, and the local chief executive is not the collecting officer.","notes":["Collectors: local treasurers or their duly authorized deputies (Sec. 170).","The provincial, city or municipal treasurer may designate the barangay treasurer as deputy.","Collection can never be left to a private person (Sec. 130)."],"upd":"","key":""},{"id":"Q22-17","quiz":22,"num":17,"sec":"8","q":"Unless otherwise provided in the Local Government Code, all local taxes, fees, and charges shall be paid:","opts":["within the first twenty (20) days of January or of each subsequent quarter, as the case may be.","within the first fifteen (15) days of January or of each subsequent quarter, as the case may be.","within the first ten (10) days of January or of each subsequent quarter, as the case may be.","within the first five (5) days of January or of each subsequent quarter, as the case may be."],"ans":0,"exp":"Sec. 167 of the LGC requires payment of local taxes, fees and charges within the first 20 days of January or of each subsequent quarter, as the case may be. The sanggunian may extend the period for justifiable cause.","notes":["Payment: first 20 days of January or of each subsequent quarter.","Extension by the sanggunian: not exceeding 6 months, without surcharge or penalty.","Surcharge for late payment: up to 25%; interest up to 2% per month, not exceeding 36 months (Sec. 168)."],"upd":"","key":""},{"id":"Q22-18","quiz":22,"num":18,"sec":"8","q":"The Sanggunian concerned may, for a justifiable reason or cause, extend the time of payment of local taxes, fees, or charges without surcharges or penalties, but only for a period not exceeding:","opts":["three (3) months.","five (5) months.","six (6) months.","twelve (12) months."],"ans":2,"exp":"Under Sec. 167 of the LGC, the sanggunian may, for justifiable reason or cause, extend the time of payment without surcharges or penalties for a period not exceeding six months.","notes":["Extension of payment: sanggunian, up to 6 months, no surcharge or penalty.","Regular payment: first 20 days of January or each subsequent quarter.","Local taxes may be paid in quarterly installments."],"upd":"","key":""},{"id":"Q22-19","quiz":22,"num":19,"sec":"8","q":"Which of the following statements is/are correct?\nI. All local taxes, fees, and charges shall be collected by the provincial, city, municipal, or barangay treasurer, or their duly authorized deputies.\nII. The provincial, city or municipal treasurer may designate the barangay treasurer as his deputy to collect local taxes, fees, or charges.\nIII. In case a bond is required for the purpose, the provincial, city or municipal government shall pay the premiums thereon in addition to the premiums of bond that may be required under the Code.","opts":["I, II and III","I and II only","I and III only","I only"],"ans":0,"exp":"All three statements are from Sec. 170 of the LGC. Collection is by the local treasurers or their deputies; the provincial, city or municipal treasurer may deputize the barangay treasurer; and if a bond is required, the provincial, city or municipal government pays the premiums.","notes":["Barangay treasurer may be deputized to collect local taxes.","Bond premiums for the deputy are paid by the provincial, city or municipal government.","Local treasurers are the proper collecting officers."],"upd":"","key":""},{"id":"Q22-20","quiz":22,"num":20,"sec":"8","q":"Unless otherwise provided in the Local Government Code, the tax period of all local taxes, fees and charges shall be the:","opts":["calendar year.","fiscal year.","either fiscal or calendar year.","both calendar and fiscal year."],"ans":0,"exp":"Sec. 165 of the LGC sets the tax period of all local taxes, fees and charges at the calendar year, although they may be paid in quarterly installments. Unlike the income tax, there is no fiscal year option.","notes":["Local tax period: calendar year (Sec. 165).","Payment may be in quarterly installments.","Accrual: January 1 of each year (Sec. 166)."],"upd":"","key":""},{"id":"Q22-21","quiz":22,"num":21,"sec":"8","q":"First statement: Unless otherwise provided in the Code, all local taxes, fees, and charges shall accrue on the first (1st) day of January of each year.\nSecond statement: New taxes, fees or charges, or changes in their rates, shall accrue on the first (1st) day of the quarter next following the effectivity of the ordinance imposing the new levies or rates.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements restate Sec. 166 of the LGC. Local taxes accrue on January 1 of each year, while new taxes or changes in rates accrue on the first day of the quarter following the effectivity of the ordinance.","notes":["Accrual of local taxes: January 1 each year.","New taxes or rate changes: first day of the quarter after the ordinance takes effect.","Tax ordinances must be published in full for 3 consecutive days in a newspaper of local circulation, or posted in at least 2 conspicuous places where there is none (Sec. 188)."],"upd":"","key":""},{"id":"Q23-01","quiz":23,"num":1,"sec":"3.10","q":"(Senior citizens) Who of the following shall NOT qualify as a senior citizen?","opts":["Resident Filipino citizen, 60 years old","Filipino citizen with dual citizenship, 60 years old, 6 months residency in the Philippines","Resident alien, 65 years old","None of the choices"],"ans":2,"exp":"Under RA 9994, a senior citizen is any resident citizen of the Philippines at least 60 years old. Dual citizens qualify if they prove Filipino citizenship and have at least 6 months residency in the Philippines. A resident alien, whatever his age, is not a Filipino citizen and does not qualify.","notes":["Senior citizen: Filipino citizen, resident of the Philippines, 60 years old and above (RA 9994).","Dual citizens qualify with proof of Filipino citizenship and at least 6 months Philippine residency.","Aliens never qualify, even if resident and older than 60."],"upd":"","key":""},{"id":"Q23-02","quiz":23,"num":2,"sec":"3.10","q":"All establishments supplying certain goods and services for the exclusive use, enjoyment or availment of senior citizens and PWDs shall give a discount of:","opts":["20%","30%","40%","50%"],"ans":0,"exp":"RA 9994 (senior citizens) and RA 10754 (PWDs) both grant a 20% discount, plus VAT exemption, on covered goods and services for the exclusive use of the beneficiary. A senior citizen who is also a PWD may claim only one discount.","notes":["Senior citizen and PWD discount: 20% plus VAT exemption on covered sales.","A senior citizen who is also a PWD gets only one 20% discount (no double availment).","Utilities (water/electricity) carry a separate 5% senior discount."],"upd":"","key":""},{"id":"Q23-03","quiz":23,"num":3,"sec":"3.10","q":"Only the actual amount of the discount granted, or a sales discount not less than the statutory rate, whichever is higher, based on the gross selling price, can be:\nI - deducted from gross income, net of value-added tax, if applicable, for income tax purposes\nII - deducted from gross sales or gross receipts of the business enterprise concerned, for VAT or other percentage tax purposes","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"RR 7-2010 (senior citizens) and the PWD rules allow the establishment to claim the discount (the actual discount or the statutory 20%, whichever is higher) as a deduction from gross income, net of VAT, for income tax, and as a deduction from gross sales or receipts for VAT or percentage tax. Both statements restate the rule.","notes":["The discount is a deduction from gross income, not a tax credit (the RA 7432 tax credit was replaced by RA 9257 and kept by RA 9994).","Deduction is computed net of VAT for income tax purposes.","Also deductible from gross sales or receipts for VAT/OPT purposes."],"upd":"","key":""},{"id":"Q23-04","quiz":23,"num":4,"sec":"3.10","q":"The monthly utilization of water and electricity by a senior citizen supplied by public utilities will be subject to a 5% discount provided which of the following conditions are satisfied?\nI - The individual meters for the utilities are registered in the name of the senior citizen residing therein\nII - The monthly consumption does not exceed one hundred kilowatt hours (100 kWh) of electricity and thirty cubic meters (30 m3) of water\nIII - The privilege is granted per household regardless of the number of senior citizens residing therein","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"RA 9994 grants seniors a 5% discount on monthly water and electricity use only if all three conditions are met: the meters are in the senior citizen's name, consumption does not exceed 100 kWh and 30 cubic meters, and the discount is given per household regardless of how many seniors live there.","notes":["Utilities discount: 5%, not 20%.","Caps: 100 kWh electricity and 30 cubic meters water per month.","One discount per household; meter must be in the senior citizen's name."],"upd":"","key":""},{"id":"Q23-05","quiz":23,"num":5,"sec":"3.10","q":"In the purchase of goods and services which have a promotional discount, the senior citizen or PWD can avail of:","opts":["the promotional discount or the senior citizen/PWD discount, whichever is higher.","the promotional discount or the senior citizen/PWD discount, whichever is lower.","the promotional discount only.","both the promotional discount and the senior citizen/PWD discount."],"ans":0,"exp":"The discounts cannot be combined. The senior citizen or PWD chooses the promotional discount or the statutory 20% discount, whichever is higher. Claiming both, or being limited to the lower or to the promo only, is not the rule.","notes":["No double discount: promo or 20%, whichever is higher.","The same no-stacking rule applies when a senior is also a PWD (one discount only)."],"upd":"","key":""},{"id":"Q23-06","quiz":23,"num":6,"sec":"3.10","q":"As proof to avail of the exemption and discount, a senior citizen may submit:\nI - ID issued by the Office of the Senior Citizen Affairs (OSCA) of the place where the senior citizen resides\nII - Passport of the senior citizen concerned\nIII - Other documents that establish that the senior citizen is a citizen of the Republic and is at least sixty (60) years of age","opts":["Any of I, II and III","All of I, II and III","Any of I and III","Any of I and II"],"ans":0,"exp":"RA 9994 accepts any one of these as proof of entitlement: the OSCA ID, the passport, or other documents showing Filipino citizenship and age of at least 60. Presenting all of them is not required.","notes":["Any one proof suffices: OSCA ID, passport, or other proof of citizenship and age.","The OSCA ID is honored nationwide, not only in the issuing city or municipality."],"upd":"","key":""},{"id":"Q23-07","quiz":23,"num":7,"sec":"3.10","q":"As proof to avail of the exemption and discount, a person with disability may submit:\nI - ID issued by the city or municipal mayor or the barangay captain of the place of residence\nII - Passport of the person with disability concerned\nIII - Transportation discount fare ID issued by the National Council for the Welfare of Disabled Persons (NCWDP)","opts":["Any of I, II and III","All of I, II and III","Any of I and III","Any of I and II"],"ans":0,"exp":"Under RA 7277 as amended (RA 9442, RA 10754), a PWD may present any one of: the PWD ID issued by the city or municipal mayor or barangay captain, the passport, or the transportation discount fare ID issued by the NCWDP. Only one is needed.","notes":["Any one proof suffices for PWD discounts and VAT exemption.","NCWDP is now the National Council on Disability Affairs (NCDA).","PWD ID is issued by the mayor (through the PDAO) or barangay captain of the place of residence."],"upd":"","key":""},{"id":"Q23-08","quiz":23,"num":8,"sec":"3.10","q":"(Person with disability) A company that hires a PWD shall be allowed, subject to certain conditions:","opts":["Ten percent (10%) of the total amount paid as salaries and wages to PWDs as additional deduction.","Fifteen percent (15%) of the total amount paid as salaries and wages to PWDs as additional deduction.","Twenty-five percent (25%) of the total amount paid as salaries and wages to PWDs as additional deduction.","Thirty percent (30%) of the total amount paid as salaries and wages to PWDs as additional deduction."],"ans":2,"exp":"The Magna Carta for Disabled Persons (RA 7277, Sec. 8) gives private employers of PWDs an additional deduction from gross income of 25% of the salaries and wages paid to them. Conditions: DOLE-certified proof that PWDs are employed, and the PWD employee is accredited with DOLE and DOH as to disability, skills and qualifications. 15% is the senior citizen rate.","notes":["PWD employees: additional 25% deduction of their salaries and wages.","Senior citizen employees: additional 15% (compare item 9).","Also: additional 50% deduction of cost of improvements to facilities for PWDs (reasonable accommodation)."],"upd":"","key":"The source choices say 'to senior citizens' in this PWD item; corrected to PWDs as an obvious typo."},{"id":"Q23-09","quiz":23,"num":9,"sec":"3.10","q":"(Senior citizen) A company that hires senior citizens shall be allowed, subject to certain conditions:","opts":["Ten percent (10%) of the total amount paid as salaries and wages to senior citizens as additio
