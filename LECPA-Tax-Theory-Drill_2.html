nal deduction.","Fifteen percent (15%) of the total amount paid as salaries and wages to senior citizens as additional deduction.","Twenty-five percent (25%) of the total amount paid as salaries and wages to senior citizens as additional deduction.","Thirty percent (30%) of the total amount paid as salaries and wages to senior citizens as additional deduction."],"ans":1,"exp":"RA 9994 allows private employers of senior citizens an additional deduction from gross income of 15% of the salaries and wages paid to them, provided the employment continues for at least 6 months and the senior's annual taxable income does not exceed the poverty level. 25% is the PWD rate.","notes":["Senior citizen employees: additional 15% deduction.","Conditions: employment of at least 6 months; senior's annual income within the poverty threshold.","PWD employees: 25% (compare item 8)."],"upd":"","key":""},{"id":"Q23-10","quiz":23,"num":10,"sec":"3.10","q":"A senior citizen and a PWD shall NOT be exempt from:\nI - 20% final withholding tax on certain passive income\nII - 6% and 15% capital gains tax\nIII - 6% donor's tax\nIV - 6% estate tax","opts":["I, II, III and IV","I and II only","III and IV only","IV only"],"ans":0,"exp":"The senior citizen and PWD privileges cover the 20% discount and VAT exemption on covered purchases, and income tax exemption only for seniors who are minimum wage earners. They do not exempt the person from final tax on passive income, capital gains tax, donor's tax or estate tax, so all four remain payable.","notes":["Only senior citizens who are minimum wage earners are exempt from income tax.","Passive income final taxes, CGT, donor's and estate taxes still apply.","A senior or PWD in business or profession is still subject to VAT or percentage tax on his own sales."],"upd":"CMEPA: the 20% final tax now applies uniformly to interest on peso and FCDU deposits, deposit substitutes and trust funds; the principle that seniors and PWDs are not exempt is unchanged.","key":""},{"id":"Q23-11","quiz":23,"num":11,"sec":"3.10","q":"(BMBE) Which of the following is NOT qualified to register as a Barangay Micro Business Enterprise (BMBE)?","opts":["Bakery with total assets not exceeding P3,000,000","Motor shop with total assets not exceeding P3,000,000","A CPA practitioner with total assets not exceeding P3,000,000","Farm producing agricultural products with total assets not exceeding P3,000,000"],"ans":2,"exp":"A BMBE is an enterprise engaged in production, processing or manufacturing (including agro-processing), trading or services, with total assets not exceeding P3,000,000 excluding land. 'Services' exclude those rendered by persons licensed after passing a government licensure exam, in the exercise of their profession, so a CPA practitioner cannot register. The bakery, motor shop and farm qualify.","notes":["BMBE asset cap: P3,000,000, including assets from loans but excluding the land where the office, plant and equipment stand.","Licensed professionals (CPAs, lawyers, doctors) practicing their profession are excluded.","Law: RA 9178 (BMBE Act of 2002), as amended by RA 10644 (Go Negosyo Act)."],"upd":"","key":""},{"id":"Q23-12","quiz":23,"num":12,"sec":"3.10","q":"First statement: The Office of the Mayor of each city or municipality shall register BMBEs and issue a Certificate of Authority (CA) to enable the BMBE to avail of incentives.\nSecond statement: Only one Certificate of Authority shall be issued for each BMBE and only by the Office of the Treasurer of the city or municipality that has jurisdiction over the residence of the owner of the business registered as a BMBE.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":1,"exp":"Under RA 9178, it is the Office of the Treasurer (not the Mayor) of each city or municipality that registers BMBEs and issues the Certificate of Authority, so the first statement is wrong. Only one CA is issued per BMBE, by the treasurer of the place of the BMBE's principal place of business (not the owner's residence), so the second statement is also wrong.","notes":["CA issued by the city or municipal treasurer under RA 9178; the Go Negosyo Act (RA 10644) lets DTI Negosyo Centers handle BMBE registration.","One CA per BMBE; venue is the principal place of business, not the owner's residence.","The CA is effective for 2 years, renewable for 2-year periods."],"upd":"","key":""},{"id":"Q23-13","quiz":23,"num":13,"sec":"3.10","q":"A person applying to be registered as a BMBE shall meet which of the following qualifications?\nI - Assets of not more than Three Million Pesos (P3,000,000) excluding land\nII - Engaged in the production, processing or manufacturing of products or commodities, including agro-processing, trading and services\nIII - Registered with the Department of Trade and Industry (DTI) for sole proprietorships or, for juridical persons, with the Securities and Exchange Commission (SEC) for corporations","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"All three are qualifications: total assets of not more than P3,000,000 excluding land, engagement in production, processing, manufacturing, trading or services, and prior registration of the business (DTI for sole proprietorships, SEC for partnerships and corporations, CDA for cooperatives).","notes":["Asset test: not more than P3,000,000, land excluded.","Business must be duly registered (DTI, SEC or CDA) before BMBE registration.","Excluded services: those of licensed professionals practicing their profession."],"upd":"","key":""},{"id":"Q23-14","quiz":23,"num":14,"sec":"3.10","q":"(BMBE) BMBEs shall be exempt from:","opts":["Income tax","SSS contribution","PhilHealth contribution","None of the choices"],"ans":0,"exp":"RA 9178 exempts BMBEs from income tax on income arising from their operations. They are exempt from the Minimum Wage Law, but their employees remain entitled to social security and health care benefits, so SSS and PhilHealth contributions are not exempted.","notes":["BMBE incentive: income tax exemption on income from operations only.","BMBEs remain liable for VAT or percentage tax, and for withholding taxes.","Exempt from the Minimum Wage Law, but SSS and PhilHealth coverage continues; LGUs are encouraged to reduce or waive local taxes and fees."],"upd":"","key":""},{"id":"Q23-15","quiz":23,"num":15,"sec":"9","q":"Which of the following is NOT a relief from double taxation?","opts":["Tax credit","Allowance of deduction for foreign taxes","Tax treaties","Not reporting income or transactions in foreign countries"],"ans":3,"exp":"Relief from double taxation is given through foreign tax credits, deduction of foreign taxes, exemptions, reciprocity and tax treaties. Not reporting foreign income is not a relief; it is tax evasion by a taxpayer taxable on worldwide income.","notes":["Reliefs: tax credit (Sec. 34(C)), deduction of foreign taxes, exemption, reciprocity, tax treaties.","Credit and deduction are alternatives: a taxpayer claims one or the other for the same foreign tax.","Tax credit is available only to resident citizens and domestic corporations (taxed on worldwide income)."],"upd":"","key":""},{"id":"Q23-16","quiz":23,"num":16,"sec":"9","q":"First statement: To avail of tax treaty benefits, the taxpayer must secure a ruling from the Bureau of Internal Revenue (BIR) through the International Tax Affairs Division (ITAD) that he may avail himself of preferential rates under existing tax treaties.\nSecond statement: In case of conflict between the provisions of a tax treaty and domestic law, the provisions of the tax treaty generally prevail over the provisions of the domestic law.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Treaty benefits are availed through the BIR's ITAD, which confirms or rules on the taxpayer's entitlement to preferential treaty rates. A tax treaty is an international obligation, so it generally prevails over conflicting domestic law (pacta sunt servanda). Both statements follow the source.","notes":["Treaty relief is processed by ITAD (RMO 14-2021 procedures).","Treaty prevails over domestic law in case of conflict; treaty rates are ceilings.","Deutsche Bank v. CIR (2013): failure to file a prior treaty relief application does not forfeit treaty benefits."],"upd":"","key":"Source key A kept, but flag: under RMO 14-2021 no prior ITAD ruling is needed for dividends, interest and royalties (the treaty rate is applied on the CORTT form and confirmed later), and Deutsche Bank (2013) held prior application is not a condition, so a strict reader could answer D."},{"id":"Q23-17","quiz":23,"num":17,"sec":"9","q":"First statement: In the exemption method, the income or capital which is taxable in the state of source or situs is exempted in the state of residence, although in some instances it may be taken into account in determining the rate of tax applicable to the taxpayer's remaining income or capital.\nSecond statement: In the credit method, although the income or capital which is taxed in the state of source is still taxable in the state of residence, the tax paid in the former is credited against the tax levied in the latter.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements correctly describe the two methods of relief under tax treaties (CIR v. S.C. Johnson and Son). The exemption method focuses on the income or capital, which the residence state exempts; the credit method focuses on the tax, which the residence state credits.","notes":["Exemption method: focus on the income or capital.","Credit method: focus on the tax paid to the source state.","Exempted income may still be considered in setting the rate on remaining income (exemption with progression)."],"upd":"","key":""},{"id":"Q23-18","quiz":23,"num":18,"sec":"9","q":"Which of the following statements is/are correct?\nI - As a general rule, the provisions of the Philippine Tax Code (domestic law) shall apply to the income, gain or profit of any person liable to income tax.\nII - In case of conflict between the provisions of a tax treaty and domestic law, the provisions of the tax treaty generally prevail over the provisions of the domestic law.\nIII - Where the rate of tax imposed under the domestic law is lower than the rate imposed under the tax treaty, the lower tax rate under the domestic law shall prevail.","opts":["I, II and III","I and II only","I and III only","II and III only"],"ans":0,"exp":"The NIRC applies as a rule; a treaty generally prevails when it conflicts with domestic law; and because treaty rates are maximum rates meant to relieve taxpayers, a lower domestic rate applies when it is more favorable. All three statements are correct.","notes":["Treaty rates are ceilings: apply the lower of the domestic or treaty rate.","Treaty prevails over conflicting domestic law.","Absent a treaty provision, the NIRC applies."],"upd":"","key":""},{"id":"Q23-19","quiz":23,"num":19,"sec":"9","q":"This is a model for countries concluding bilateral tax conventions and plays a crucial role in removing tax-related barriers to cross-border trade and investment.","opts":["OECD Model Tax Convention","UN Model Double Taxation Convention","United States Model Income Tax Convention","None of the choices"],"ans":0,"exp":"The OECD Model Tax Convention on Income and on Capital is the basis for most bilateral tax treaties and is described by the OECD as removing tax-related barriers to cross-border trade and investment. It tends to favor residence-country taxation, while the UN Model favors source-country taxation.","notes":["OECD Model: basis of most bilateral treaties; favors the residence country.","UN Model: favors the source (host) country; used by developing countries.","The Philippines uses both models in negotiating its treaties."],"upd":"","key":""},{"id":"Q23-20","quiz":23,"num":20,"sec":"9","q":"This model generally favors retention of greater so-called 'source country' taxing rights under a tax treaty (the taxation rights of the host country of investment) as compared to those of the 'residence country' of the investor.","opts":["OECD Model Tax Convention","UN Model Double Taxation Convention","United States Model Income Tax Convention","None of the choices"],"ans":1,"exp":"The UN Model Double Taxation Convention between Developed and Developing Countries favors source-country (host country) taxing rights, which suits capital-importing developing countries. The OECD Model leans toward the residence country.","notes":["UN Model: source-country bias (capital-importing countries).","OECD Model: residence-country bias (capital-exporting countries)."],"upd":"","key":""},{"id":"Q23-21","quiz":23,"num":21,"sec":"9","q":"Which of the following shall be allowed as incentives to Registered Business Enterprises (RBEs)?\nI - Income Tax Holiday (ITH)\nII - Special Corporate Income Tax (SCIT)\nIII - Enhanced Deductions (ED)","opts":["I, II and III","I and II","I and III","II and III"],"ans":0,"exp":"Under Title XIII of the NIRC (CREATE, as amended by CREATE MORE), RBE incentives include the ITH, the 5% SCIT and Enhanced Deductions, plus duty exemption on imported capital equipment and raw materials and VAT exemption on importation and zero-rating on local purchases. The ITH is followed by either SCIT or ED.","notes":["Income-based incentives: ITH, then SCIT or ED (never both at the same time).","Other incentives: customs duty exemption; VAT exemption on importation and VAT zero-rating on local purchases.","Incentives are granted by IPAs (PEZA, BOI, etc.) under the Strategic Investment Priority Plan (SIPP)."],"upd":"CREATE MORE: an RBE may now choose ITH followed by SCIT or ED, or go straight to SCIT or ED from the start of commercial operations; ED-regime RBEs pay a 20% RCIT and the total incentive period can reach up to 27 years for FIRB-approved projects.","key":""},{"id":"Q23-22","quiz":23,"num":22,"sec":"9","q":"First statement: At the option of the export enterprise, the domestic market enterprise with a minimum investment capital of P500,000,000, and the domestic market enterprise engaged in activities classified as 'critical,' the SCIT or ED shall be granted.\nSecond statement: In no case shall Enhanced Deductions (ED) be granted simultaneously with the Special Corporate Income Tax (SCIT).","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":3,"exp":"The SCIT option for domestic market enterprises (P500 million investment or critical activities) was vetoed by the President when CREATE was signed, so only export enterprises may choose between SCIT and ED; the first statement is wrong. SCIT and ED are alternative regimes and can never be enjoyed at the same time, so the second statement is correct.","notes":["SCIT: export enterprises only; DMEs get ITH followed by ED.","The P500M and 'critical' DME SCIT provisions were vetoed.","SCIT and ED are mutually exclusive; the choice is irrevocable for the entitlement period."],"upd":"CREATE MORE kept this: SCIT remains available only to registered export enterprises, while DMEs (including high-value DMEs) are limited to ITH and ED.","key":""},{"id":"Q23-23","quiz":23,"num":23,"sec":"9","q":"Which of the following taxpayers can avail of the Special Corporate Income Tax (SCIT)?\nI - Export enterprise\nII - Domestic market enterprise with a minimum investment capital of P500,000,000\nIII - Domestic market enterprise under the Strategic Investment Priority Plan engaged in activities classified as critical","opts":["I, II and III","I and II","I and III","I only"],"ans":3,"exp":"Only registered export enterprises may avail of the 5% SCIT. The provisions extending SCIT to DMEs with P500 million investment or engaged in critical activities were vetoed, so II and III are not entitled.","notes":["SCIT: export enterprises only.","DME provisions (P500M investment, critical activities) vetoed under CREATE.","DMEs: ITH followed by ED."],"upd":"CREATE MORE did not extend SCIT to DMEs; it remains exclusive to registered export enterprises.","key":""},{"id":"Q23-24","quiz":23,"num":24,"sec":"9","q":"Effective July 1, 2020, the Special Corporate Income Tax (SCIT) is:","opts":["5% based on gross income earned, in lieu of all national and local taxes.","10% based on gross income earned, in lieu of all national and local taxes.","15% based on gross income earned, in lieu of all national and local taxes.","20% based on gross income earned, in lieu of all national and local taxes."],"ans":0,"exp":"The SCIT under CREATE is 5% of gross income earned, in lieu of all national and local taxes. It is shared 3% for the national government and 2% for the LGU where the enterprise is located, remitted directly by the RBE.","notes":["SCIT: 5% of gross income earned, in lieu of all national and local taxes.","Sharing: 3% national government, 2% LGU (paid directly to the LGU).","Gross income earned = gross sales or revenues less allowable returns, discounts and cost of sales or direct costs."],"upd":"CREATE MORE retained the 5% SCIT and clarified it covers local taxes, fees and charges; RBEs under ITH or ED pay a separate registered business enterprise local tax of up to 2% of gross income in lieu of other local taxes.","key":""},{"id":"Q23-25","quiz":23,"num":25,"sec":"9","q":"Which of the following taxpayers shall be allowed Enhanced Deductions?\nI - Export enterprise\nII - Domestic market enterprise with a minimum investment capital of P500,000,000\nIII - Domestic market enterprise under the Strategic Investment Priority Plan engaged in activities classified as critical","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Unlike SCIT, the Enhanced Deductions regime is open to both export enterprises and domestic market enterprises registered under the SIPP, so all three may avail of it after their ITH.","notes":["ED: available to export enterprises and DMEs.","SCIT: export enterprises only (compare item 23).","ED-regime RBEs pay RCIT on net income after enhanced deductions."],"upd":"CREATE MORE: RBEs under the ED regime are taxed at a reduced 20% RCIT.","key":""},{"id":"Q23-26","quiz":23,"num":26,"sec":"9","q":"Enhanced Deductions (ED) for depreciation allowance of assets acquired for the entity's production of goods and services (qualified capital expenditures) directly related to the registered enterprise's production of goods and services, other than administrative and other support services:\nI - Additional 10% for buildings\nII - Additional 20% for machinery and equipment","opts":["Both I and II","I only","Neither I nor II","II only"],"ans":0,"exp":"Under the ED regime, qualified capital expenditures get additional depreciation of 10% for buildings and 20% for machinery and equipment, on top of normal depreciation. Both statements are correct.","notes":["Additional depreciation: 10% buildings, 20% machinery and equipment.","Applies only to assets directly used in production of the registered activity."],"upd":"","key":""},{"id":"Q23-27","quiz":23,"num":27,"sec":"9","q":"Which of the following expenses shall be allowed an additional 100% Enhanced Deduction (ED)?","opts":["Labor expense incurred for the taxable year (does not include salaries, wages, benefits and other personnel costs for managerial, administrative, indirect labor and support services)","Domestic input expense incurred in the taxable year (applies to domestic inputs directly related to and actually used in the registered export project or activity)","Power expense incurred in the taxable year (applies to power utilized for the registered project or activity)","Research and development expense incurred during the year (applies to R&D directly related to the registered project or activity, limited to local expenditures for salaries of Filipino employees, consumables and payments to local R&D organizations)"],"ans":3,"exp":"Under CREATE, R&D and training expenses get an additional 100% deduction, while labor, domestic input and power expenses get an additional 50%. Hence R&D is the answer under the source. CREATE MORE, however, raised the power expense deduction to an additional 100%, so choice c is now also correct.","notes":["Additional 100%: R&D, training, and (under CREATE MORE) power.","Additional 50%: direct labor, domestic input; CREATE MORE added 50% for trade fair, exhibition and trade mission expenses.","Labor deduction excludes managerial, administrative and support personnel."],"upd":"CREATE MORE: additional deduction on power expense raised from 50% to 100%.","key":"Flawed under current law: after CREATE MORE both power expense (c) and R&D (d) carry an additional 100% deduction. Source key D kept since it remains correct."},{"id":"Q23-28","quiz":23,"num":28,"sec":"9","q":"Enhanced Deductions (ED) for reinvestment allowance to the manufacturing industry (as determined in the Strategic Investment Priority Plan):\nI - Reinvested in any of the projects or activities listed in the Strategic Investment Priority Plan\nII - Amount reinvested, up to a maximum of 50%, shall be allowed as a deduction from taxable income within a period of 5 years from the time of such reinvestment","opts":["Both I and II","I only","Neither I nor II","II only"],"ans":0,"exp":"When a manufacturing RBE reinvests its undistributed profit or surplus in any SIPP-listed project or activity, the amount reinvested, up to 50%, is deductible from taxable income within 5 years from the reinvestment. Both statements are correct.","notes":["Reinvestment allowance: up to 50% of the amount reinvested.","Deductible within 5 years from the time of reinvestment.","Reinvestment must be in a SIPP-listed project or activity."],"upd":"CREATE MORE extended the reinvestment allowance to tourism RBEs in addition to manufacturing.","key":""},{"id":"Q23-29","quiz":23,"num":29,"sec":"9","q":"Enhanced Net Operating Loss Carry-over (NOLCO):\nI - Net operating loss (NOL) of the registered project or activity during the first 3 years from the start of commercial operation\nII - Carried over as a deduction from income within 5 consecutive taxable years immediately following the year of such loss","opts":["Both I and II","I only","Neither I nor II","II only"],"ans":1,"exp":"The enhanced NOLCO covers the NOL of the registered project incurred during the first 3 years from start of commercial operation, so I is correct. Under CREATE, the loss was carried over for 5 years immediately following the year of loss, but CREATE MORE changed the period to the 5 consecutive taxable years immediately following the last year of the ITH, so II no longer states current law.","notes":["Qualifying loss: NOL of the registered project in the first 3 years of commercial operation.","CREATE MORE: carried over 5 consecutive years following the last year of the ITH (not the year of loss).","Regular NOLCO (Sec. 34(D)(3)): 3 years; 2020 and 2021 losses 5 years (Bayanihan II)."],"upd":"CREATE MORE: the enhanced NOLCO is now carried over within the 5 consecutive taxable years immediately following the last year of the ITH, instead of the 5 years following the year of loss.","key":"Source key says A. Overridden to B because CREATE MORE moved the 5-year carry-over to start after the last ITH year, so statement II is outdated."},{"id":"Q23-30","quiz":23,"num":30,"sec":"9","q":"Every registered enterprise subject to the 5% special income tax shall file a quarterly income tax return:","opts":["within sixty (60) days after the close of each of the first three (3) quarters.","within thirty (30) days after the close of each of the first three (3) quarters.","within twenty (20) days after the close of each of the first three (3) quarters.","within ten (10) days after the close of each of the first three (3) quarters."],"ans":0,"exp":"SCIT enterprises follow the corporate filing rules: a quarterly return within 60 days after the close of each of the first three quarters, and a final adjustment return for the year. The shorter periods are not the rule for income tax returns.","notes":["Quarterly ITR: within 60 days after each of the first three quarters.","Annual (final adjustment) return: 15th day of the 4th month after year-end (compare item 31)."],"upd":"","key":""},{"id":"Q23-31","quiz":23,"num":31,"sec":"9","q":"Every registered enterprise subject to the 5% special income tax shall file a final adjustment income tax return covering the entire taxable year:","opts":["not later than the fifteenth (15th) day of the fourth month following the close of its taxable year.","not later than the twentieth (20th) day of the fourth month following the close of its taxable year.","not later than the twenty-fifth (25th) day of the fourth month following the close of its taxable year.","not later than December 31 following the close of its taxable year."],"ans":0,"exp":"Like other corporations, an SCIT enterprise files its final adjustment (annual) return on or before the 15th day of the 4th month following the close of its taxable year (April 15 for calendar-year taxpayers).","notes":["Annual ITR: 15th day of the 4th month after the close of the taxable year.","Calendar-year taxpayer: April 15.","EOPT: returns may be filed with any AAB, RDO (through an RCO) or authorized tax software provider."],"upd":"","key":""},{"id":"Q23-32","quiz":23,"num":32,"sec":"9","q":"First statement: Registered business enterprises and other registered enterprises availing of tax incentives administered by the Investment Promotion Agencies and other government agencies administering tax incentives shall file with their respective IPAs or other government agencies a complete annual tax incentives report.\nSecond statement: Registered business enterprises and other registered enterprises availing of tax incentives administered by the Investment Promotion Agencies and other government agencies administering tax incentives shall file with their respective IPAs or other government agencies a complete annual benefits report.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"CREATE requires RBEs to file with their IPA both an annual tax incentives report (income-based incentives, VAT exemptions and zero-rating, customs duty exemptions, deductions, and local tax exemptions) and an annual benefits report (investment, employment, exports and imports, domestic purchases, profits and dividends, taxes paid and foregone). Both statements are correct.","notes":["Two reports to the IPA: annual tax incentives report and annual benefits report.","Benefits report covers investment, jobs, exports and imports, domestic purchases, dividends and taxes.","Copies go simultaneously to the FIRB in electronic form."],"upd":"","key":""},{"id":"Q23-33","quiz":23,"num":33,"sec":"9","q":"The complete annual tax incentives report and complete annual benefits report shall be filed within how many days from the statutory deadline for filing tax returns and payment of taxes?","opts":["15 calendar days","20 calendar days","25 calendar days","30 calendar days"],"ans":3,"exp":"RBEs file both reports with their IPA within 30 calendar days from the statutory deadline for filing the relevant tax returns and paying the taxes, with copies simultaneously submitted to the FIRB in electronic form.","notes":["RBE reports: within 30 calendar days from the statutory filing deadline.","IPAs submit their reports to the BIR within 60 calendar days (compare item 34).","Copy to the Fiscal Incentives Review Board in electronic form."],"upd":"","key":""},{"id":"Q23-34","quiz":23,"num":34,"sec":"9","q":"First statement: The Investment Promotion Agencies and other government agencies administering tax incentives shall, within 60 calendar days from the end of the statutory deadline for filing the relevant tax returns, submit to the BIR their respective annual tax incentives reports based on the list of registered business enterprises and other registered enterprises which have filed said tax incentives report.\nSecond statement: The reportorial requirement under Section 3 of RA 10963 or the TRAIN Law (Power of the Commissioner to Obtain Information, and to Summon, Examine, and Take Testimony of Persons) shall not be covered.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"The IPAs must submit their annual tax incentives reports to the BIR within 60 calendar days from the end of the statutory deadline, so the first statement is correct. The law expressly states that the reportorial requirement under Section 3 of TRAIN (which amended Sec. 5 of the NIRC on the CIR's power to obtain information) shall be covered, so the second statement is wrong.","notes":["IPAs to BIR: within 60 calendar days from the statutory deadline.","The CIR's power to obtain information (Sec. 5 NIRC, as amended by TRAIN) still applies to RBEs.","RBEs to IPAs: within 30 calendar days (compare item 33)."],"upd":"","key":""},{"id":"Q23-35","quiz":23,"num":35,"sec":"9","q":"Registered Business Enterprises (RBEs) are entitled to:\nI - VAT exemption on importation\nII - VAT zero-rating on local purchases","opts":["Both I and II","I only","Neither I nor II","II only"],"ans":0,"exp":"Title XIII grants VAT exemption on importation and VAT zero-rating on local purchases of goods and services used in the registered project. Note that these VAT incentives are for registered export enterprises; ordinary domestic market enterprises are not entitled to zero-rating on local purchases (compare item 40).","notes":["VAT incentives: exemption on importation, zero-rating on local purchases.","Beneficiaries: registered export enterprises (CREATE MORE: must have at least 70% export sales; also extended to high-value DMEs).","Must be for goods and services used in the registered project, during the registration period."],"upd":"CREATE MORE: VAT incentives cover goods and services 'directly attributable' to the registered project and are available to registered export enterprises with at least 70% export sales and to registered high-value DMEs.","key":""},{"id":"Q23-36","quiz":23,"num":36,"sec":"9","q":"Which of the following statements is/are correct?\nI - The VAT exemption on importation and VAT zero-rating on local purchases shall only apply to goods and services directly and exclusively used in the registered project or activity of export enterprises, during the period of registration of the said registered project or activity with the concerned Investment Promotion Agency (IPA).\nII - Excess input taxes attributable to zero-rated sales by VAT-registered RBEs may, at the RBE's option, be refunded or applied for a tax credit, subject to the guidelines provided under Revenue Regulations No. 13-2018, as amended.\nIII - Direct and exclusive use in the registered project or activity refers to raw materials, inventories, supplies, equipment, goods, services and other expenditures necessary for the registered project or activity without which the registered project or activity cannot be carried out.","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"Under CREATE and its rules, the VAT incentives are limited to goods and services directly and exclusively used in the registered project during the registration period (I), excess input VAT on zero-rated sales may be refunded or credited (II), and 'direct and exclusive use' means expenditures without which the project cannot be carried out (III). All three were correct under CREATE.","notes":["Excess input VAT on zero-rated sales: refund or tax credit at the RBE's option.","Incentive covers only the registered project and only during the registration period.","CREATE MORE replaced 'directly and exclusively used' with 'directly attributable'."],"upd":"CREATE MORE: the standard is now 'directly attributable', meaning goods and services incidental to and reasonably necessary for the registered project, expressly including janitorial, security, financial, consultancy, marketing and administrative services (HR, legal, accounting).","key":"Source key A kept, but statements I and III state the pre-CREATE MORE 'directly and exclusively used' standard; no choice fits current law better since every choice includes I."},{"id":"Q23-37","quiz":23,"num":37,"sec":"9","q":"Which of the following statements is/are correct?\nStatement I - Only the portion of the expense directly and exclusively used by a registered export enterprise for its registered project or activity shall qualify for VAT zero-rating on local purchases, excluding those used for administrative purposes.\nStatement II - The registered export enterprise concerned should adopt a method to best allocate goods or services purchased, e.g., for utilities, use of separate water and power meters for its registered project or activity, or any method that may determine the allocation such as area usage or ratio of utility expenses between cost of sales and administrative expenses as reflected in the prior year Audited Financial Statements.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":1,"exp":"Both statements reflect the CREATE-era rules, which excluded purchases for administrative purposes from zero-rating and required allocation between the registered project and administrative use. CREATE MORE now treats goods and services directly attributable to the registered project, including administrative services, as qualified, so statement I is wrong and the project-versus-administrative allocation in statement II is no longer required.","notes":["CREATE MORE: administrative services (HR, legal, accounting) now qualify for zero-rating.","Also expressly covered: janitorial, security, financial, consultancy, marketing and promotion services.","Old rule (RR 21-2021): administrative expenses were excluded and had to be allocated out."],"upd":"CREATE MORE: 'directly attributable' replaced 'directly and exclusively used', and administrative-operation services now qualify for VAT zero-rating on local purchases.","key":"Source key says A (pre-CREATE MORE). Overridden to B because CREATE MORE expressly includes administrative services, making statement I wrong and the project/administrative allocation in II unnecessary; D is arguable if allocation is read as still needed for non-registered activities."},{"id":"Q23-38","quiz":23,"num":38,"sec":"9","q":"If goods or services are used in both the registered project or activity and administrative purposes, and the proper allocation could not be determined, the purchase of such goods and services shall be:","opts":["subject to 12% VAT.","subject to 0% VAT.","exempt from VAT.","disregarded."],"ans":1,"exp":"Under the CREATE-era rules, mixed-use purchases that could not be allocated were subject to 12% VAT because administrative use did not qualify. CREATE MORE now treats goods and services for administrative operations as directly attributable to the registered project, so a purchase used for both the project and administration qualifies for 0% VAT when bought by a qualified registered export enterprise.","notes":["CREATE MORE: administrative use no longer disqualifies a local purchase from zero-rating.","Buyer must be a registered export enterprise (at least 70% export sales) or a registered high-value DME.","Old rule: unallocable mixed-use purchases were subject to 12% VAT."],"upd":"CREATE MORE: goods and services 'directly attributable' to the registered project, including administrative services, qualify for VAT zero-rating; the original key (12% VAT) reflects the superseded RR 21-2021 rule.","key":"Source key says A (12% VAT). Overridden to B because under CREATE MORE administrative use is directly attributable to the registered project, so the mixed-use purchase is zero-rated."},{"id":"Q23-39","quiz":23,"num":39,"sec":"9","q":"Which of the following shall be considered examples of costs that are indispensable to the project or activity (without which the project or activity cannot proceed), including expenses necessary or required to be incurred depending on the nature of the registered project or activity of the export enterprise?\nStatement I - Insurance costs required to be paid by the IPA before the facility can start operations\nStatement II - Freight costs necessary to bring the raw materials or equipment to be used in the production area\nStatement III - Telecommunication expenses of registered export enterprises engaged in IT/BPO services or other registered project or activity which cannot be carried out without the telecommunication services","opts":["I, II and III","I and II","I and III","I only"],"ans":0,"exp":"All three are examples of indispensable costs: insurance required by the IPA before operations, freight to bring materials or equipment to production, and telecommunication services without which an IT/BPO activity cannot run. Costs incurred before registration of the project with the IPA do not qualify.","notes":["Indispensable costs qualify for zero-rating: required insurance, freight, telecom for IT/BPO.","Costs incurred before IPA registration of the project are excluded.","CREATE MORE broadened coverage to anything incidental to and reasonably necessary for the project."],"upd":"CREATE MORE: the 'directly attributable' standard is broader, so these costs qualify and telecom for administrative use no longer needs to be carved out.","key":""},{"id":"Q23-40","quiz":23,"num":40,"sec":"9","q":"First statement: Registered Business Enterprises (RBEs) which are categorized as Domestic Market Enterprises (DMEs) are not entitled to VAT zero-rating on local purchases.\nSecond statement: Sale of goods or services to a registered domestic market enterprise shall be exempt from VAT.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"VAT zero-rating on local purchases is an incentive for registered export enterprises, so a DME is not entitled to it and the first statement is correct. A sale to a registered DME is an ordinary domestic sale subject to 12% VAT, not VAT-exempt, so the second statement is wrong.","notes":["Sales to a DME: 12% VAT.","Zero-rating on local purchases: export enterprises (and, under CREATE MORE, high-value DMEs).","Input VAT passed on to a VAT-exempt DME forms part of its cost."],"upd":"CREATE MORE extended VAT exemption on importation and zero-rating on local purchases to registered high-value DMEs; ordinary DMEs remain excluded.","key":""},{"id":"Q23-41","quiz":23,"num":41,"sec":"9","q":"First statement: A Domestic Market Enterprise (DME) under the 5% Gross Income Tax (GIT) or Special Corporate Income Tax (SCIT) regime, registered as a VAT-exempt entity, shall treat its revenues as VAT-exempt.\nSecond statement: If the seller is VAT-registered while enjoying ITH, the sale of goods and services to another registered export enterprise is subject to VAT at zero rate, provided the goods and services are directly and exclusively used in the latter's registered project or activity.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Per RMC 24-2022, a DME under the 5% GIT or SCIT registered as VAT-exempt treats its revenues as VAT-exempt, and the VAT passed on by its suppliers becomes part of its cost. A VAT-registered seller under ITH selling to a registered export enterprise applies 0% VAT if the goods or services are used in the buyer's registered project. Both statements are correct.","notes":["5% GIT/SCIT is in lieu of all national taxes, including VAT on the enterprise's own sales.","VAT passed on to a VAT-exempt DME is part of its cost or expense (no input VAT credit).","Sales by a VAT-registered ITH enterprise to an export enterprise: 0% if used in the buyer's registered project."],"upd":"CREATE MORE: the buyer-side test is now 'directly attributable' to the registered project rather than 'directly and exclusively used'.","key":""},{"id":"Q23-42","quiz":23,"num":42,"sec":"9","q":"If the seller is enjoying the 5% GIT incentive, the sale of goods and services, such as manufactured, assembled or processed products or IT/BPO services, to another registered export enterprise that will form part of the final export product or export service of the latter, of at least seventy percent (70%) of its total production or output:","opts":["shall be VAT-exempt.","shall be subject to 12% VAT.","shall be subject to 0% VAT.","shall be disregarded."],"ans":0,"exp":"A seller under the 5% GIT pays that tax in lieu of all national taxes, including VAT, so its qualifying sales to another registered export enterprise (forming part of the latter's export product or service, at least 70% of output) are VAT-exempt per RMC 24-2022. Zero-rating applies instead when the seller is VAT-registered and under ITH or regular income tax.","notes":["5% GIT seller: sales are VAT-exempt (tax is in lieu of all national taxes).","VAT-registered ITH seller to export enterprise: 0% VAT (compare item 41).","Indirect export threshold: at least 70% of total production or output."],"upd":"","key":""},{"id":"Q23-43","quiz":23,"num":43,"sec":"9","q":"Under the VAT treatment of the sale, transfer or disposition of previously VAT-exempt imported capital equipment, raw materials, spare parts or accessories, if the purchaser is a registered export enterprise, regardless of location, the transaction is:","opts":["subject to VAT at zero rate, provided that the same shall be directly and exclusively used in the registered project or activity of the registered export enterprise.","subject to VAT at 12%, provided that the same shall be directly and exclusively used in the registered project or activity of the registered export enterprise.","subject to VAT exemption, provided that the same shall be directly and exclusively used in the registered project or activity of the registered export enterprise.","subject to VAT at zero rate, whether or not the same shall be directly and exclusively used in the registered project or activity of the registered export enterprise."],"ans":0,"exp":"When previously VAT-exempt imported items are sold to a registered export enterprise, the sale is zero-rated as a local purchase of that enterprise, but only if the items are used in its registered project. Choice d drops this condition, and 12% or exemption do not apply to qualified sales to export enterprises.","notes":["Sale to a registered export enterprise: 0% VAT, conditioned on use in the registered project.","Location of the buyer does not matter.","Sale by a non-SCIT seller to a non-export buyer: generally 12% VAT on net book value (compare item 44)."],"upd":"CREATE MORE: the condition now reads 'directly attributable to' the registered project instead of 'directly and exclusively used'.","key":""},{"id":"Q23-44","quiz":23,"num":44,"sec":"9","q":"Under the VAT treatment of the sale, transfer or disposition of previously VAT-exempt imported capital equipment, raw materials, spare parts or accessories, if the seller is a non-registered export enterprise or a domestic market enterprise, regardless of location, and is under the Special Corporate Income Tax (5% GIT), the transaction is:","opts":["VAT-exempt.","subject to 0% VAT.","subject to 12% VAT.","disregarded."],"ans":0,"exp":"Per RMC 24-2022, a seller under the 5% SCIT/GIT is covered by a tax in lieu of all national taxes, so its sale of previously VAT-exempt imported items is VAT-exempt. If the seller is not under the 5% regime, the sale is generally subject to 12% VAT on the net book value, unless the buyer is a registered export enterprise (then zero-rated).","notes":["Seller under 5% SCIT/GIT: VAT-exempt.","Seller not under 5% regime: 12% VAT on net book value, unless the buyer is a registered export enterprise (0%).","Source: RMC 24-2022 Q&A on CREATE VAT incentives."],"upd":"","key":""},{"id":"Q23-45","quiz":23,"num":45,"sec":"9","q":"First statement: If the imported capital equipment, raw materials, spare parts or accessories will be used for a non-registered project or activity of the RBE, the corresponding VAT on importation should be paid accordingly.\nSecond statement: For partial utilization in a non-registered project or activity, the VAT on the specific capital equipment, raw materials, spare parts or accessories shall be paid in proportion to its utilization for the non-registered project or activity.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"The VAT exemption on importation covers only use in the registered project. If the imported items are used for a non-registered project, the VAT on importation must be paid; if they are used partly for it, VAT is paid in proportion to the non-registered use. Both statements are correct.","notes":["VAT exemption on importation is limited to the registered project or activity.","Full use in a non-registered activity: pay the import VAT.","Partial use: pay VAT in proportion to non-registered use."],"upd":"","key":""},{"id":"PB99-1-01","quiz":99,"num":1,"sec":"1.A","q":"First statement: One of the essential characteristics of a tax is that it is unlimited in amount.\nSecond statement: A tax is generally unlimited because it is based on the needs of the state.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"Being unlimited describes the power of taxation (plenary, comprehensive and supreme), not an essential characteristic of a tax. The essential characteristics of a tax are: an enforced contribution, generally payable in money, proportionate in character, levied on persons, property or the exercise of a right, levied by the legislature, for a public purpose. The second statement is correct: since the power rests on necessity, the amount is generally limited only by the needs of the state, subject to constitutional limits.","notes":["Tax characteristics: enforced, payable in money, proportionate, levied by the lawmaking body, for public purpose.","The POWER to tax is unlimited, plenary, comprehensive and supreme (subject to inherent and constitutional limits).","Lifeblood doctrine and necessity theory explain why the amount is based on the needs of the state."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-02","quiz":99,"num":2,"sec":"1.B","q":"First statement: A license fee is a charge imposed under the police power of the state.\nSecond statement: A penalty is imposed by the state only.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":0,"exp":"A license fee is a regulatory charge imposed under police power to cover the cost of regulation, inspection and supervision. A penalty, however, may be imposed not only by the state but also by private persons or entities (for example, contractual penalties), so the second statement is wrong.","notes":["License fee: police power, for regulation, amount limited to the cost of regulation.","Tax: taxing power, for revenue, generally no limit in amount.","Penalty: a sanction for violating a law or contract; may be imposed by the government or private parties."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-03","quiz":99,"num":3,"sec":"1.A","q":"First statement: Imposition of taxes is a legislative act.\nSecond statement: Collection of taxes is an administrative act.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":2,"exp":"Levying or imposing a tax is legislative: Congress determines the subject, rate, and manner of the tax. Collection is administrative: it is carried out by executive agencies such as the BIR and the Bureau of Customs. Both statements correctly describe the two aspects of taxation.","notes":["Aspects of taxation: levy (legislative) and collection (administrative).","The power to tax cannot be delegated, except to the President (tariff powers), to LGUs, and to administrative agencies for implementation details."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-04","quiz":99,"num":4,"sec":"1.A","q":"First statement: A state has the power to tax even if not granted by the Constitution.\nSecond statement: A state cannot exercise police power if not granted by the Constitution.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":0,"exp":"Taxation, police power and eminent domain are inherent powers of the state; they exist as attributes of sovereignty even without constitutional grant. The Constitution merely limits them. The second statement is wrong because police power, like taxation, does not depend on a constitutional grant.","notes":["All three inherent powers exist independently of the Constitution.","Constitutional tax provisions are limitations, not grants (except the grant of taxing power to LGUs, Art. X, Sec. 5)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-05","quiz":99,"num":5,"sec":"1.A","q":"First statement: There can only be a tax if there is a law imposing the tax.\nSecond statement: The power to tax is inherent.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":2,"exp":"Although the power to tax is inherent in sovereignty, it is exercised only through legislation: no tax may be collected without a law imposing it. Both statements are correct and consistent with each other.","notes":["Inherent power, but legislative in character: \"no taxation without a law.\"","Taxes are strictly construed against the government; exemptions are strictly construed against the taxpayer."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-06","quiz":99,"num":6,"sec":"1.B","q":"First statement: A tax is based on law while a debt is based on contract.\nSecond statement: A tax is also a customs duty.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":0,"exp":"A tax arises from law, while a debt generally arises from contract; this is why taxes are not subject to set-off and nonpayment of tax may lead to imprisonment. The second statement is wrong because \"tax\" is the broader term: a customs duty is a tax on imported or exported goods, but not every tax is a customs duty.","notes":["Tax vs debt: law vs contract; no set-off; imprisonment possible for tax, not for debt.","Customs duties are taxes on goods imported into or exported from the country; tax is the broader term."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-07","quiz":99,"num":7,"sec":"1.A","q":"First statement: A person cannot be imprisoned for non-payment of property tax.\nSecond statement: A law may be passed violating the uniformity of taxation.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"The constitutional bar on imprisonment covers only debt and non-payment of a poll tax (Art. III, Sec. 20); the community tax is the poll tax, and property tax is not covered. The rule of taxation must be uniform and equitable (Art. VI, Sec. 28(1)), so a law violating uniformity is unconstitutional. Both statements are incorrect.","notes":["No imprisonment for debt or non-payment of poll tax (community tax) only.","Uniformity: same tax rate on all things of the same class; classification must be reasonable."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-08","quiz":99,"num":8,"sec":"1.9","q":"First statement: The RDO is known as the alter ego of the BIR Commissioner.\nSecond statement: The BIR Commissioner is directly under the Office of the President.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"The Revenue District Officer is a subordinate official in charge of a revenue district, not the alter ego of the Commissioner. The BIR is under the supervision and control of the Department of Finance (Sec. 2, NIRC); the Commissioner reports to the Secretary of Finance, not directly to the Office of the President. Both statements are incorrect.","notes":["The BIR is under the Department of Finance; the CIR is appointed by the President.","BIR officials: Commissioner, 4 Deputy Commissioners, Regional Directors, Revenue District Officers.","Cabinet secretaries (e.g., the Secretary of Finance), not bureau officials, are the President's alter egos."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-09","quiz":99,"num":9,"sec":"1.A","q":"First statement: Provisions in the Philippine Constitution on taxation are grants of power.\nSecond statement: Due process of law in taxation under the Constitution is a grant of power.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"Because the power to tax is inherent, constitutional provisions on taxation are limitations on that power, not grants. Due process is one of those constitutional limitations. The notable exception is Art. X, Sec. 5, which grants LGUs the power to create their own sources of revenue, but the general statement remains incorrect.","notes":["Constitutional limitations: due process, equal protection, uniformity, non-impairment, no imprisonment for poll tax, religious freedom, origin of revenue bills in the House, etc.","LGU taxing power is a direct constitutional grant (Art. X, Sec. 5), subject to guidelines set by Congress."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-10","quiz":99,"num":10,"sec":"1.B","q":"First statement: An excise tax is also called a privilege tax.\nSecond statement: A tax which is neither personal nor property is an excise tax.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":2,"exp":"As to subject matter, taxes are personal (poll/capitation), property, or excise. An excise tax is imposed on the exercise of a right or privilege (such as doing business, transferring property or receiving income), so it is also called a privilege tax. Any tax that is neither personal nor property is by elimination an excise tax. Both statements are correct.","notes":["Subject matter: personal, property, excise (privilege).","Income, estate, donor's, VAT and percentage taxes are excise (privilege) taxes in the broad sense.","Do not confuse with the NIRC \"excise taxes\" on alcohol, tobacco, petroleum, etc. (Title VI)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-11","quiz":99,"num":11,"sec":"1.B","q":"First statement: Estate tax is a proportional tax.\nSecond statement: A progressive tax is a tax the rate of which is directly proportional to the tax base.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":2,"exp":"Since TRAIN (2018), estate tax is a flat 6% of the net estate, so it is a proportional tax. A progressive (graduated) tax is one whose rate increases as the tax base increases, which is what the second statement means by a rate directly proportional to (rising with) the base. Both statements are correct as keyed.","notes":["Proportional: flat rate (estate and donor's tax 6%, VAT 12%).","Progressive: rate rises as base rises (individual graduated income tax 0% to 35%).","Regressive: rate decreases as base increases (not favored; the Constitution requires Congress to evolve a progressive system)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-12","quiz":99,"num":12,"sec":"1.A","q":"First statement: Taxation without representation is not tyranny.\nSecond statement: In the exercise of taxation, the state can tax anything, at any time, and in any amount.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"The accepted maxim is \"taxation without representation is tyranny,\" meaning taxes should be imposed by the people's representatives in the legislature, so the first statement is wrong. The second statement describes the plenary, comprehensive and supreme nature of the taxing power: subject only to inherent and constitutional limitations, the state may choose the subject, time and amount of the tax.","notes":["Taxing power is unlimited, plenary, comprehensive and supreme.","It is still subject to inherent limitations (public purpose, territoriality, etc.) and constitutional limitations."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-13","quiz":99,"num":13,"sec":"1.A","q":"First statement: Taxation and the power of eminent domain may be exercised simultaneously.\nSecond statement: Taxation and police power may be exercised simultaneously.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"Taxation and police power may operate together, as when a tax is imposed both to raise revenue and to regulate or discourage an activity (for example, sin taxes on tobacco and alcohol). Taxation and eminent domain are treated as distinct: eminent domain takes specific private property for public use with just compensation, while taxation takes money from the public without direct compensation, so under the source's key they are not exercised simultaneously.","notes":["Taxation + police power together: regulatory taxes (sin taxes, luxury taxes).","Eminent domain requires just compensation; taxation's \"compensation\" is general benefits of government.","All three powers are inherent and exercised primarily by the legislature."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-14","quiz":99,"num":14,"sec":"1.A","q":"First statement: All of our tax laws are statutory laws.\nSecond statement: The non-impairment clause is a statutory law on taxation.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"Sources of tax law include not only statutes (NIRC, Tariff and Customs Code, LGC, special laws) but also the Constitution, tax treaties, local ordinances, BIR revenue regulations and court decisions, so the first statement is wrong. The non-impairment clause (Art. III, Sec. 10) is a constitutional provision, not a statutory law. Both statements are incorrect.","notes":["Sources of tax laws: Constitution, statutes, tax treaties, revenue regulations and rulings, judicial decisions, local ordinances.","Non-impairment clause: no law impairing the obligation of contracts; applies to tax exemptions granted for valuable consideration."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-15","quiz":99,"num":15,"sec":"1.B","q":"First statement: Non-payment of tax makes the business illegal.\nSecond statement: The non-payment of a license fee makes the business illegal.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"A license fee is a condition for the lawful exercise of a regulated activity, so doing business without paying it makes the business illegal. Non-payment of a tax does not make the business illegal; it only makes the taxpayer liable for the tax plus penalties and possible criminal prosecution.","notes":["License fee paid before the activity; nonpayment makes the act or business illegal.","Tax nonpayment: civil and criminal liability, but the business itself stays lawful."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-16","quiz":99,"num":16,"sec":"1.B","q":"First statement: A margin fee is a tax.\nSecond statement: A customs duty is a tax.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"The margin fee on foreign exchange transactions was held to be an exaction under police power, imposed to regulate and stabilize the currency, not a revenue measure. Customs duties, on the other hand, are taxes imposed on goods imported into or exported from the country. Only the second statement is correct.","notes":["Margin fee: police power (regulatory), not a tax.","Customs duties: taxes on imports and exports, collected by the Bureau of Customs.","Other non-tax exactions: toll (for use of property), special assessment, license fee."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-17","quiz":99,"num":17,"sec":"1.A","q":"First statement: Territoriality is one of the constitutional limitations on the power of taxation.\nSecond statement: International comity is an inherent limitation in taxation.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"Territoriality (situs of taxation) is an inherent limitation, not a constitutional one: a state may tax only persons, property and activities within its jurisdiction. International comity, which bars a state from taxing another sovereign state or its property, is likewise an inherent limitation. Only the second statement is correct.","notes":["Inherent limitations: public purpose, non-delegation, territoriality, international comity, exemption of the government.","Constitutional limitations: due process, equal protection, uniformity, non-impairment, no imprisonment for poll tax, and others."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-18","quiz":99,"num":18,"sec":"1.A","q":"First statement: Taxes may be used for sectarian purposes if allowed by an ordinance.\nSecond statement: The President can refuse to implement a tax law if it appears to be unconstitutional.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"The Constitution prohibits the appropriation or use of public money for the benefit of any church, sect or religious denomination (Art. VI, Sec. 29(2)); an ordinance cannot override the Constitution. The President must faithfully execute the laws; only the courts may declare a law unconstitutional, so the President cannot refuse to implement a tax law on that ground. Both statements are incorrect.","notes":["Public funds may not be used for sectarian purposes (Art. VI, Sec. 29(2)).","Laws are presumed constitutional until declared otherwise by the courts.","Religious property used actually, directly and exclusively for religious purposes is exempt from property tax (Art. VI, Sec. 28(3))."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-19","quiz":99,"num":19,"sec":"1.A","q":"First statement: There can be double taxation in the Philippines.\nSecond statement: Double taxation is illegal if it violates the uniformity of taxation.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":2,"exp":"The Constitution does not expressly prohibit double taxation, so it can validly exist in the Philippines (for example, indirect duplicate taxation by different taxing authorities). Direct double taxation, however, becomes objectionable and invalid when it violates constitutional limits such as uniformity or equal protection. Both statements are correct.","notes":["Direct (obnoxious) double taxation: same subject, same purpose, same taxing authority, same period, same kind of tax.","Indirect double taxation is generally allowed.","Remedies: tax treaties, foreign tax credits, deductions, exemptions."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-20","quiz":99,"num":20,"sec":"1.B","q":"First statement: A progressive system of taxation means a tax structure where the tax base increases as the tax rate increases.\nSecond statement: Tax exemption is a grant of immunity to a particular taxpayer from a tax which others are obliged to pay.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":1,"exp":"In a progressive system the tax RATE increases as the tax BASE increases; the first statement reverses the relationship. The second statement correctly defines a tax exemption: an immunity or privilege from a tax that others generally within the same class are required to pay. Only the second statement is correct.","notes":["Progressive: rate increases as the base increases.","Exemptions are strictly construed against the taxpayer.","Exemptions may be express or implied; revocable unless granted for valuable consideration."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-21","quiz":99,"num":21,"sec":"1.A","q":"First statement: Tax avoidance is a form of tax escape.\nSecond statement: Tax evasion is not punishable.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":0,"exp":"Tax avoidance (tax minimization by legal means) is one of the forms of escape from taxation, along with shifting, capitalization, transformation, exemption and evasion. Tax evasion, the use of illegal means to escape tax, is punishable (e.g., Sec. 254, attempt to evade or defeat tax). Only the first statement is correct.","notes":["Avoidance: legal (tax planning). Evasion: illegal (tax dodging).","Evasion elements: end to pay less tax, a state of mind that is evil or willful, and a course of action that is unlawful.","Sec. 254: willful attempt to evade tax is a criminal offense."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-22","quiz":99,"num":22,"sec":"1.A","q":"First statement: The power to tax may include the power to destroy.\nSecond statement: Tax penalties may be imposed in violation of the ex post facto rule.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":0,"exp":"The power to tax involves the power to destroy: it may be used to discourage or even prohibit activities (a regulatory tax), though it must not be exercised confiscatorily against legitimate businesses. The ex post facto prohibition applies to penal laws, so penalties for tax violations cannot be applied retroactively. Only the first statement is correct.","notes":["\"The power to tax involves the power to destroy\" (McCulloch v. Maryland), but not while the Supreme Court sits.","Tax laws may be retroactive if expressly provided, but PENAL provisions cannot violate the ex post facto rule."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-23","quiz":99,"num":23,"sec":"1.B","q":"First statement: A tax may be subjected to set-off or compensation.\nSecond statement: A tax ordinarily includes interest.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"Taxes are not subject to set-off or legal compensation because the government and the taxpayer are not mutually creditors and debtors, and taxes are the lifeblood of government. Taxes do not ordinarily bear interest; interest is imposed only upon deficiency or delinquency (Sec. 249). Both statements are incorrect.","notes":["General rule: no set-off of taxes against claims against the government.","Interest on taxes arises only from late payment or deficiency: 12% per annum (double the legal rate, TRAIN).","Micro and small taxpayers pay interest at 50% of the regular rate (EOPT)."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-24","quiz":99,"num":24,"sec":"1.A","q":"First statement: A tax bill may embrace more than one subject.\nSecond statement: Non-payment of a tax cannot result in criminal liability on the part of the taxpayer, only civil liability.","opts":["If only the first statement is correct.","If only the second statement is correct.","If both statements are correct.","If both statements are incorrect."],"ans":3,"exp":"Every bill passed by Congress must embrace only one subject expressed in its title (Art. VI, Sec. 26(1)), so a tax bill may not embrace more than one subject. Non-payment of tax can give rise to both civil and criminal liability (e.g., Secs. 254 and 255, NIRC). Both statements are incorrect.","notes":["One subject, one title rule applies to tax bills.","Revenue bills must originate exclusively in the House of Representatives (Art. VI, Sec. 24).","Civil and criminal liabilities are separate; paying the tax does not extinguish criminal liability."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-25","quiz":99,"num":25,"sec":"3.2-GI","q":"Pacman, a Filipino fighter, received P5,000,000 as prize money for a world professional boxing championship held in the Philippines. The event was sanctioned by the World Boxing Association. Is Pacman subject to income tax?","opts":["No, so long as the prize goes directly to the winner and not through the association.","Yes, since the national sports association did not sanction the fight.","No, because it is a prize subject to final tax.","Yes, but only on the part that exceeds the first P10,000 of total prizes for the calendar year."],"ans":1,"exp":"Sec. 32(B)(7)(d) excludes from gross income prizes and awards granted to athletes in local and international sports competitions and tournaments, whether held in the Philippines or abroad, only if sanctioned by their national sports associations. A professional bout sanctioned by the WBA, a private international body, does not meet this condition, so the prize is taxable in full. Choice C is self-contradictory (a prize subject to final tax is still taxable), and the P10,000 figure in D relates to the dividing line for the 20% final tax on prizes, not to an exemption.","notes":["Athletes' prizes are excluded only if the competition is sanctioned by their national sports association.","Other excluded prizes: for religious, charitable, scientific, educational, artistic, literary or civic achievement, if the recipient was selected without action on his part and need not render future services.","Prizes over P10,000: 20% final tax; P10,000 or less: graduated rates."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-26","quiz":99,"num":26,"sec":"3.1-IND","q":"A minimum wage earner shall be liable to pay income tax on his:","opts":["Mandatory contributions","Overtime pay","Commissions","Night differential pay"],"ans":2,"exp":"Minimum wage earners are exempt from income tax on their statutory minimum wage and on holiday pay, overtime pay, night shift differential and hazard pay (Sec. 24(A)(2)). Under TRAIN (RR 11-2018), an MWE who receives other income, such as commissions, honoraria or benefits beyond the P90,000 ceiling, is taxed on that other income while keeping the exemption on the SMW and its premiums. Mandatory SSS, PhilHealth and Pag-IBIG contributions are excluded from gross income for all employees.","notes":["MWE exempt items: SMW, holiday pay, overtime pay, night shift differential, hazard pay.","Other income of an MWE (commissions, honoraria, excess benefits) is taxable at graduated rates.","13th month pay and other benefits exempt up to P90,000."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-27","quiz":99,"num":27,"sec":"3.7","q":"Under the eFPS, a return is deemed filed with the BIR after a sequence number is generated. What is this sequence number called?","opts":["Reference Number","Confirmation Number","Acknowledgement Number","Computer-Generated Number"],"ans":0,"exp":"Under the Electronic Filing and Payment System (RR 9-2001, as amended), an electronically filed return is deemed filed upon the generation of a Filing Reference Number. The confirmation number relates to the completed electronic payment, not to the filing of the return.","notes":["eFPS: return deemed filed upon issuance of the Filing Reference Number (FRN).","E-payment through the bank generates a payment confirmation.","eFPS filers are generally given staggered filing dates depending on their industry group."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-28","quiz":99,"num":28,"sec":"3.7","q":"Where is an income tax return filed and the tax paid?","opts":["Any authorized agent bank","Revenue District Office where the taxpayer is registered","Local city treasurer where the taxpayer is domiciled","Commissioner of Internal Revenue"],"ans":0,"exp":"Under the \"file and pay anywhere\" rule of the EOPT Act (Sec. 51(B) and Sec. 56, as amended; RR 6-2024), returns may be filed and the tax paid electronically or manually with any authorized agent bank, any Revenue District Office through a Revenue Collection Officer, or an authorized tax software provider. Among the choices, \"any authorized agent bank\" states the rule; B wrongly limits the venue to the RDO of registration, and local treasurers do not collect national income tax.","notes":["EOPT file-anywhere: any AAB, any RDO (through the RCO), or authorized tax software provider.","Filing in the wrong venue is no longer penalized (EOPT).","Annual ITR of individuals: on or before April 15 of the following year."],"upd":"EOPT (RA 11976): before 2024, manual filers had to file with an AAB or RCO within the RDO where they were registered; EOPT now allows filing and payment anywhere.","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-29","quiz":99,"num":29,"sec":"3.7","q":"Which is NOT a requisite of substituted filing?","opts":["It pertains only to employees.","There must be only one employer.","The compensation tax was actually and correctly withheld and remitted to the Bureau of Internal Revenue.","It applies only to single or head of family taxpayers."],"ans":3,"exp":"Substituted filing applies to an individual earning purely compensation income from only one employer in the Philippines during the year, whose income tax has been correctly withheld (tax due equals tax withheld); the employer's annual information return (BIR Form 1604-C) then stands as the employee's ITR. Civil status is not a requisite, so a married employee may qualify. Choices A, B and C are all actual requisites.","notes":["Requisites: purely compensation income, one employer for the year, tax withheld equals tax due, employer files BIR Form 1604-C.","Not qualified: employees with two or more employers in the year (successive or concurrent), mixed income earners, and those with income not subjected to final tax.","The employee keeps BIR Form 2316 as proof of substituted filing."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-30","quiz":99,"num":30,"sec":"3.7","q":"Mr. Andes asks whether the following items of income need to be reported in his income tax return:\ni. Passive income\nii. Fringe benefits received\niii. Capital gains from sale of real property\niv. Proceeds of life insurance","opts":["All of the above must be included in the ITR.","None of the above must be included in the ITR.","Only items i and ii must be included in the ITR.","Only items i, ii and iii must be included in the ITR."],"ans":1,"exp":"Passive income subjected to final tax is no longer reported in the ITR because the final tax fully settles the liability. Fringe benefits of managerial or supervisory employees are subject to final FBT paid by the employer, so they are not reported by the employee. Capital gains on real property classified as capital assets are covered by the 6% final CGT with a separate return (BIR Form 1706), and life insurance proceeds are excluded from gross income (Sec. 32(B)(1)). None of the items goes into the ITR.","notes":["Income subjected to final tax is not included in the ITR.","Real property CGT: BIR Form 1706 within 30 days after sale.","FBT: withheld and paid by the employer (BIR Form 1603Q).","Passive income NOT subject to final tax (e.g., foreign-source dividends) is reported in the ITR."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-31","quiz":99,"num":31,"sec":"3.7","q":"Mr. Camilo Cruz asks you to file a tentative income tax return on his behalf because he is going abroad. Since his stay outside the Philippines is indefinite, he asks you until when he may amend the return to finalize it.","opts":["3 years from the date of filing.","3 years from the date required by law.","Anytime, as long as the BIR has not yet commenced its investigation of the return.","Before Mr. Cruz receives a Letter of Authority from the BIR and before the lapse of 3 years from its filing."],"ans":3,"exp":"Under Sec. 6(A), a return may be modified, changed or amended provided that no notice for audit or investigation (Letter of Authority) has been actually served on the taxpayer. Amendment is also bounded by the 3-year period within which the BIR may assess the return (Sec. 203). Both conditions are captured only by choice D; C ignores the time limit and A and B ignore the LOA condition.","notes":["Amendment allowed only before a Letter of Authority is served (Sec. 6(A)).","Assessment period: 3 years from the last day for filing or from actual filing, whichever is later.","False or fraudulent return or non-filing: 10 years from discovery."],"upd":"","key":"","src":"CPAR B99 First Preboard (Feb 2025)"},{"id":"PB99-1-32","quiz":99,"num":32,"sec":"4.2","q":"Mr. Irving Ackerman consulted you on how he can transfer all his properties to his lone son with minimum tax consequence. What will you advise him?","opts":["Sell all his properties to his son.","Incorporate and give all his stockholdings to his son.","Convert all his properties into life insurance and designate his son as irrevocable beneficiary.","Get a life insurance policy whose proceeds wil
