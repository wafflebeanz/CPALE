-04","quiz":13,"num":4,"sec":"3.3","q":"One of the following is not a requisite for deduction of bad debts:","opts":["There must be an existing indebtedness to the taxpayer and these must be valid and legally demandable.","The debt must actually be charged off the books of accounts of the taxpayer as of the end of the taxable year.","The debt must actually be ascertained worthless and uncollectible as of the end of the taxable year.","The debt must have a maturity of not more than 5 years."],"ans":3,"exp":"The law sets no maturity limit for bad debts. The requisites are: a valid and legally demandable debt owed to the taxpayer, connected with business, not between related parties under Sec. 36(B), actually ascertained worthless, and charged off within the taxable year.","notes":["Requisites: valid, demandable, business-connected debt; not between related parties; ascertained worthless and charged off in the year.","Banks and insurers: worthlessness is determined per BSP/IC rules; others need proof of collection efforts (RR 25-2002).","Income from the debt must have been reported (for receivables from income)."],"upd":"","key":""},{"id":"Q13-05","quiz":13,"num":5,"sec":"3.3","q":"One of the following is not deductible as bad debts:","opts":["Difference between the purchase price and the indebtedness, where under foreclosure of a mortgage, the mortgagee buys the mortgaged property and credits the indebtedness to the purchase price.","Worthless debts arising from unpaid wages, salaries, rents and similar items of taxable income, the income such items represent has been included in the returns of income for the year in which the deduction for bad debt is sought to be made, or in a previous year.","Difference between the amount received in distribution of assets of a bankrupt company and the amount of claims against the said company.","Difference between the amount received by a creditor of a decedent in distribution of the assets of the decedent's estate and the amount of his claim."],"ans":0,"exp":"When the mortgagee itself buys the mortgaged property at foreclosure and credits the debt against the price, the difference is not treated as a bad debt (the creditor recovers the property instead). Unpaid income items already reported in gross income, and the unrecovered part of claims against a bankrupt company or a decedent's estate, are deductible bad debts.","notes":["Receivables from income are deductible as bad debts only if the income was previously reported.","Unrecovered claims in bankruptcy or estate distribution are deductible bad debts.","A cash-basis taxpayer cannot deduct uncollected income never reported."],"upd":"","key":""},{"id":"Q13-06","quiz":13,"num":6,"sec":"3.3","q":"A purchaser of accounts receivable which cannot be collected and are consequently charged off the books as bad debts is entitled to deduct them, the amount of deduction to be based upon:","opts":["the face value of the accounts receivable.","the net realizable value of the accounts receivable.","the price paid for the accounts receivable.","the fair discounted value of the accounts receivable."],"ans":2,"exp":"The bad debt deduction cannot exceed the taxpayer's investment in the debt. A purchaser of receivables has only what it paid, so the deduction is based on the purchase price, not face value.","notes":["Bad debt deduction is limited to the taxpayer's basis (amount lent, income reported, or price paid).","Face value in excess of the price paid was never income, so it is not deductible.","Recovery in excess of basis is income."],"upd":"","key":""},{"id":"Q13-07","quiz":13,"num":7,"sec":"3.3","q":"A Certified Public Accountant uses cash basis in computing his taxable income. In 2024, he performs a professional service for a client who is unable to pay him. The unpaid professional fee of the client becomes worthless in 2025. When can the taxpayer deduct the worthless professional fee as bad debt?","opts":["2024","2025","2024 or 2025 depending on his choice","Can not be deducted in any year"],"ans":3,"exp":"A cash-basis taxpayer never includes an unpaid fee in gross income. Since the fee was never taxed, writing it off gives no deductible bad debt in any year; only income previously reported can be deducted as a bad debt.","notes":["Cash basis: income reported only when received, so uncollected fees are never deductible.","Accrual basis: fees reported as income may be deducted when worthless and charged off.","Rule: a bad debt deduction requires that the income was previously included in gross income."],"upd":"","key":""},{"id":"Q13-08","quiz":13,"num":8,"sec":"3.3","q":"It is the gradual diminution of the useful value of tangible property resulting from wear and tear and normal obsolescence. It is also applied to the amortization of intangible assets whose use in the trade or business is definitely limited in duration.","opts":["Depreciation","Depletion","Obsolescence","Bad debt"],"ans":0,"exp":"Depreciation is the gradual loss of useful value of tangible property from wear and tear and normal obsolescence (Sec. 34(F)), and the term also covers amortization of intangibles with a definitely limited useful life. Depletion refers to exhaustion of natural resources.","notes":["Depreciation methods allowed: straight-line, declining balance (up to 2x SL), sum-of-the-years'-digits, or others prescribed.","Intangibles with unlimited life (e.g., goodwill not tied to a limited period) are not amortized.","Land is not depreciable."],"upd":"","key":""},{"id":"Q13-09","quiz":13,"num":9,"sec":"3.3","q":"The basis of computing depreciation of an asset is the:","opts":["acquisition cost of the property.","fair market value of the property.","adjusted basis for computing the loss on the sale of property.","reappraised value of the property."],"ans":0,"exp":"Depreciation is a recovery of capital, so it is computed on the acquisition cost of the property. Fair market value or reappraised value is not used, since appraisal increases are unrealized and were never paid by the taxpayer.","notes":["Depreciation base: cost (plus capitalized improvements), not appraised value.","Depreciation on appraisal increase is not deductible.","Total depreciation cannot exceed cost less salvage value."],"upd":"","key":""},{"id":"Q13-10","quiz":13,"num":10,"sec":"3.3","q":"An allowance for depreciation in respect of all properties directly related to production of petroleum initially placed in service in a taxable year shall be allowed under:\nI. the straight-line.\nII. declining-balance method of depreciation at the option of the service contractor.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 34(F)(4) allows depreciation of properties directly related to petroleum production under the straight-line or declining-balance method, at the option of the service contractor. Both statements are correct.","notes":["Directly related to petroleum production: SL or declining balance, contractor's option; 10-year life or shorter as permitted by the CIR.","Not directly used in production: straight-line over 5 years.","Once chosen, the method is applied consistently."],"upd":"","key":""},{"id":"Q13-11","quiz":13,"num":11,"sec":"3.3","q":"The useful life of properties used in or related to production of petroleum shall be:","opts":["ten (10) years or such shorter life as may be permitted by the Commissioner.","ten (10) years only.","seven (7) years or such shorter life as may be permitted by the Commissioner.","five (5) years."],"ans":0,"exp":"Under Sec. 34(F)(4), properties used in or related to petroleum production have a useful life of 10 years or such shorter life as the Commissioner may permit. The 5-year life applies to properties not used directly in production.","notes":["Petroleum production properties: 10 years or shorter as permitted by the CIR.","Properties not used directly in production: 5 years, straight-line.","Mining (non-petroleum) properties follow the separate Sec. 34(F)(5) rules."],"upd":"","key":""},{"id":"Q13-12","quiz":13,"num":12,"sec":"3.3","q":"The depreciation for properties not used directly in the production of petroleum shall be:\nI. straight-line method.\nII. 5 years estimated life.","opts":["No to I and II","Yes to I and II","Yes to I only","Yes to II only"],"ans":1,"exp":"Sec. 34(F)(4) provides that properties not used directly in petroleum production are depreciated under the straight-line method over an estimated useful life of 5 years. Both are correct.","notes":["Not directly used in petroleum production: straight-line, 5 years.","Directly used: SL or declining balance, 10 years or shorter.","The option of method belongs to the service contractor only for directly used properties."],"upd":"","key":""},{"id":"Q13-13","quiz":13,"num":13,"sec":"3.3","q":"An allowance for depreciation in respect of all properties used in mining operations other than petroleum operations, shall be:","opts":["computed at the normal rate of depreciation if the expected life is ten (10) years or less.","depreciated over any number of years between five (5) years and the expected life if the latter is more than ten (10) years.","allowed as deduction from taxable income.","all of the choices."],"ans":3,"exp":"Sec. 34(F)(5) states all three: normal rate if expected life is 10 years or less; any number of years between 5 years and the expected life if the latter exceeds 10 years; and the depreciation is allowed as a deduction from taxable income. The contractor must notify the Commissioner of the rate chosen at the start of the depreciation period.","notes":["Mining (non-petroleum): life of 10 years or less uses normal rate; over 10 years may be depreciated over 5 years up to expected life.","The contractor notifies the CIR of the chosen rate at the beginning of the depreciation period.","Mining exploration and development expenditures are subject to the 25%-of-net-income cap."],"upd":"","key":""},{"id":"Q13-14","quiz":13,"num":14,"sec":"3.3","q":"It is the exhaustion of natural resources like mines, oil and gas wells due to production.","opts":["Depletion","Depreciation","Amortization","Wasting assets"],"ans":0,"exp":"Depletion is the exhaustion of natural resources (mines, oil and gas wells) as they are extracted. Depreciation relates to wear and tear of tangible property, and amortization to intangibles.","notes":["Depletion applies to natural resources such as mines and oil and gas wells (Sec. 34(G)).","Only the cost-depletion method is allowed.","Total depletion cannot exceed the capital invested."],"upd":"","key":""},{"id":"Q13-15","quiz":13,"num":15,"sec":"3.3","q":"In the case of oil and gas wells or mines, a reasonable allowance for depletion or amortization computed in accordance with what method shall be granted under rules and regulations to be prescribed by the Secretary of Finance, upon recommendation of the Commissioner?","opts":["Straight-line depletion method","Cost-depletion method","Declining-balance depletion method","Sum-of-the-years-digit method"],"ans":1,"exp":"Sec. 34(G)(1) allows depletion of oil and gas wells or mines only under the cost-depletion method. Percentage depletion and the other methods listed are not allowed.","notes":["Only cost depletion is allowed (Sec. 34(G)(1)).","Depletion cannot exceed the capital invested.","Intangible exploration and development drilling costs have separate deduction rules."],"upd":"","key":""},{"id":"Q13-16","quiz":13,"num":16,"sec":"3.3","q":"After production in commercial quantities has commenced, certain intangible exploration and development drilling costs shall be deductible:\nI. in the year incurred if such expenditures are incurred for non-producing wells and/or mines.\nII. in full in the year paid or incurred or at the election of the taxpayer, may be capitalized and amortized if such expenditures incurred are for producing wells and/or mines in the same contract area.","opts":["Yes to I only","Yes to II only","Yes to both I and II","No to both I and II"],"ans":2,"exp":"Sec. 34(G)(1) provides both rules after commercial production begins: costs for non-producing wells or mines are deductible in the year incurred, and costs for producing wells or mines in the same contract area are deductible in full when paid or incurred or, at the taxpayer's election, capitalized and amortized.","notes":["Non-producing wells/mines: deduct in the year incurred.","Producing wells/mines in the same contract area: deduct in full or elect to capitalize and amortize.","Only cost depletion is allowed for oil and gas wells and mines."],"upd":"","key":""},{"id":"Q13-17","quiz":13,"num":17,"sec":"3.3","q":"In computing taxable income from mining operations, the taxpayer may at his option, deduct:\nI. exploration and development expenditures accumulated as cost or adjusted basis for cost depletion as of date of prospecting.\nII. exploration and development expenditures paid or incurred during the taxable year.","opts":["Yes to I only","Yes to II only","No to I and II","Yes to I and II"],"ans":3,"exp":"Sec. 34(G)(2) allows the taxpayer, at his option, to deduct both accumulated exploration and development expenditures (as of the date of prospecting) and those paid or incurred during the year. The deduction cannot exceed 25% of net income from mining operations; the excess is carried forward.","notes":["Cap: 25% of net income from mining operations, computed without tax incentives.","Excess is carried forward until fully deducted.","The election to deduct is irrevocable and binding in succeeding years."],"upd":"","key":""},{"id":"Q13-18","quiz":13,"num":18,"sec":"3.3","q":"Allowable deductions for mining operation shall include:\nI. Mining, milling and marketing expenses.\nII. Depreciation of properties directly used in the mining operations.\nIII. Expenditures for the acquisition or improvement of property of a character which is subject to the allowance for depreciation.","opts":["I, II and III","I and II only","I and III only","III only"],"ans":1,"exp":"Sec. 34(G)(2) says 'allowable deductions' for mining operations include mining, milling and marketing expenses and depreciation of properties directly used in mining operations, and then expressly states the paragraph does not apply to expenditures for the acquisition or improvement of property subject to depreciation. Those capital outlays are recovered through depreciation, so statement III is excluded.","notes":["Allowable deductions for mining net income: mining, milling and marketing expenses, plus depreciation of properties directly used.","Capital expenditures for depreciable property are not deducted outright; they are depreciated.","Exploration and development expense deduction is capped at 25% of net income from mining operations."],"upd":"","key":"Source key says A. Sec. 34(G)(2) expressly excludes expenditures for the acquisition or improvement of depreciable property, so only I and II are allowable deductions (B)."},{"id":"Q13-19","quiz":13,"num":19,"sec":"3.3","q":"One of the following is not a requisite for the deductibility of charitable and other contributions:","opts":["The contribution must be actually paid or made within the taxable year","The contribution is paid or made to the Philippine Government or any political subdivision thereof or to any of the domestic corporations or associations specified in the Tax Code.","Must be evidenced by adequate records or receipts","Must be connected to the taxpayer's trade, business or practice of profession"],"ans":3,"exp":"Charitable contributions need not be connected with the taxpayer's business; that is exactly what distinguishes them from business expenses. The requisites are actual payment within the year, a qualified donee under Sec. 34(H), substantiation, and compliance with the percentage limits where applicable.","notes":["Limits: 10% of taxable income (individuals) or 5% (corporations), computed before the contribution deduction.","Full deduction: donations to government priority projects (NEDA), certain foreign institutions under treaties, and accredited NGOs meeting Sec. 34(H)(2)(c).","Pledges not yet paid are not deductible."],"upd":"","key":""},{"id":"Q13-20","quiz":13,"num":20,"sec":"3.3","q":"First statement: Donations to the Government of the Philippines or to any of its agencies or political subdivisions, including fully-owned government corporations, exclusively to finance, to provide for, or to be used in undertaking priority activities are deductible in full.\nSecond statement: Any donation which is made to the Government or to any of its agencies or political subdivisions not in accordance with the said annual priority plan shall be subject to the 5% or 10% limitations prescribed in the Tax Code.","opts":["Only the first statement is correct","Only the second statement is correct","Both statements are correct","Both statements are incorrect"],"ans":2,"exp":"Both follow Sec. 34(H)(2)(a). Donations to government for priority activities (education, health, youth and sports, human settlements, science and culture, economic development) under the NEDA priority plan are deductible in full; donations to government not in accordance with that plan are subject to the 10% (individual) or 5% (corporate) limit.","notes":["Priority plan donations to government: deductible in full.","Other donations to government for public purpose: 10%/5% limit.","Limits are based on taxable income before the contribution deduction."],"upd":"","key":""},{"id":"Q13-21","quiz":13,"num":21,"sec":"3.3","q":"Which of the following shall be deductible in full?\nI. Donations made for the use of the Government of the Philippines or any of its agencies or any political subdivision exclusively for public purpose\nII. Donations made to accredited domestic corporations or associations organized and operated exclusively for religious, charitable, scientific, youth and sports development, cultural or educational purposes or rehabilitation of veterans\nIII. Donations to foreign institutions or international organizations in pursuance of or in compliance with agreements, treaties, or commitments entered into by the Government of the Philippines and the foreign institutions or international organizations or in pursuance of special laws","opts":["I, II and III","I and II only","I only","III only"],"ans":3,"exp":"Only III is a full deduction under Sec. 34(H)(2)(b). Statements I and II describe the donees in Sec. 34(H)(1), which are subject to the 10%/5% limits; donations to government are fully deductible only if for NEDA priority activities, and donations to NGOs only if the NGO meets the Sec. 34(H)(2)(c) accreditation conditions.","notes":["Full deduction: government priority projects, foreign institutions under treaties/special laws, qualified accredited NGOs.","Limited deduction (10%/5%): government for public purpose (non-priority), accredited domestic donees for religious, charitable, etc. purposes.","Accreditation of donee institutions is through the PCNC and BIR."],"upd":"","key":""},{"id":"Q13-22","quiz":13,"num":22,"sec":"3.3","q":"To be deductible in full, certain accredited non-government organizations (NGO) or non-profit domestic corporations must meet certain requisites. One of the following is not a requisite:","opts":["Organized and operated exclusively for scientific, research, educational, character building, youth and sports development, health, social welfare, cultural and charitable purposes or a combination of these purposes.","Not later than the 15th day of the third month after the close of the taxable year in which the contributions are received, makes utilization of the contributions directly for the purpose or function for which the organization is organized and operated.","The level of administrative expense, conform with the rules and regulations to be prescribed by the Secretary of Finance, upon recommendation of the Commissioner, but in no case to exceed forty percent (40%) of the total expenses.","In the event of dissolution, its assets would be distributed to another non-profit domestic corporation organized for similar purpose or purposes, or to the State for public purpose or would be distributed by a court to another organization to be used in such manner as in the judgment of said court shall best accomplish the general purpose for which the dissolved corporation was organized."],"ans":2,"exp":"Sec. 34(H)(2)(c)(iii) caps administrative expenses at 30% of total expenses, not 40%. The other choices are the actual requisites on purpose, utilization deadline and distribution of assets on dissolution.","notes":["Administrative expenses cap: 30% of total expenses.","Utilization deadline: 15th day of the 3rd month after close of the taxable year of receipt.","Assets on dissolution go to a similar non-profit, the State, or as a court directs."],"upd":"","key":""},{"id":"Q13-23","quiz":13,"num":23,"sec":"3.3","q":"Subject to such terms and conditions as may be prescribed by the Secretary of Finance, the term 'utilization' means:\nI. Any amount in cash or in kind (including administrative expenses) paid or utilized to accomplish one or more purposes for which the accredited non-government organization was created or organized.\nII. Any amount paid to acquire an asset used (or held for use) directly in carrying out one or more purposes for which the accredited non-government organization was created or organized.","opts":["Yes to I only","Yes to II only","No to both I and II","Yes to both I and II"],"ans":3,"exp":"Sec. 34(H)(2)(c) defines utilization to include both: amounts paid (including administrative expenses) to accomplish the NGO's purposes, and amounts paid to acquire assets used directly in carrying out those purposes.","notes":["Utilization covers both program spending and acquisition of assets used directly for the purpose.","Administrative expenses count as utilization but are capped at 30% of total expenses.","Deadline: 15th day of the 3rd month after year end."],"upd":"","key":""},{"id":"Q13-24","quiz":13,"num":24,"sec":"3.3","q":"The amount of any charitable contribution of property other than money shall be based on the:","opts":["fair market value of said property.","acquisition cost of said property.","fair market value or acquisition cost of said property, whichever is lower.","fair market value or acquisition cost of said property, whichever is higher."],"ans":1,"exp":"Sec. 34(H)(3) provides that a charitable contribution of property other than money is valued at its acquisition cost. This prevents deducting unrealized appreciation that was never taxed.","notes":["Property donations: acquisition cost, not FMV (Sec. 34(H)(3)).","For donor's tax, by contrast, the gift is valued at FMV.","Donations to qualified donees are also generally exempt from donor's tax."],"upd":"","key":""},{"id":"Q13-25","quiz":13,"num":25,"sec":"3.3","q":"First statement: A taxpayer may treat research or development expenditures which are paid or incurred by him during the taxable year in connection with his trade, business or profession as ordinary and necessary expenses which are not chargeable to capital account.\nSecond statement: The expenditures so treated shall be allowed as deduction during the taxable year when paid or incurred.","opts":["Only the first statement is correct","Only the second statement is correct","Both statements are correct","Both statements are incorrect"],"ans":2,"exp":"Sec. 34(I)(1) lets a taxpayer treat R&D expenditures connected with the business as ordinary and necessary expenses not chargeable to capital account, and these are deducted in the year paid or incurred. Both statements are correct.","notes":["R&D may be expensed in the year paid or incurred (Sec. 34(I)(1)).","Alternatively, may elect to defer and amortize over at least 60 months (Sec. 34(I)(2)).","Not applicable to land, depreciable/depletable property, or expenditures to ascertain mineral deposits."],"upd":"CREATE MORE: RBEs under the Enhanced Deductions Regime may claim an additional 100% deduction on R&D expenses.","key":""},{"id":"Q13-26","quiz":13,"num":26,"sec":"3.3","q":"At the election of the taxpayer and in accordance with the rules and regulations to be prescribed by the Secretary of Finance, upon recommendation of the Commissioner, which of the following research and development expenditures may be treated as deferred expenses?","opts":["Paid or incurred by the taxpayer in connection with his trade, business or profession.","Not treated as ordinary and necessary expenses.","Chargeable to capital account but not chargeable to property of a character which is subject to depreciation or depletion.","All of the choices."],"ans":3,"exp":"Sec. 34(I)(2) lists all three conditions for deferral: the R&D expenditures are paid or incurred in connection with the business, are not treated as expenses under Sec. 34(I)(1), and are chargeable to capital account but not to depreciable or depletable property.","notes":["Deferred R&D: amortized over not less than 60 months from the month benefits are first realized.","R&D on depreciable property is recovered through depreciation instead.","The election is made per the regulations and applied consistently."],"upd":"CREATE MORE: RBEs under the Enhanced Deductions Regime may claim an additional 100% deduction on R&D expenses.","key":""},{"id":"Q13-27","quiz":13,"num":27,"sec":"3.3","q":"Research and development expenses treated as deferred expenses shall be allowed as deduction ratably distributed over a period of not less than:","opts":["60 months beginning with the month ending the taxpayer's taxable year.","60 months beginning with the month in which the taxpayer first realizes benefits from such expenditures.","30 months beginning with the month in which the taxpayer first realizes benefits from such expenditures.","6 months beginning with the month in which the taxpayer first realizes benefits from such expenditures."],"ans":1,"exp":"Under Sec. 34(I)(2)(b), deferred R&D is amortized ratably over not less than 60 months beginning with the month the taxpayer first realizes benefits from the expenditures. The start is tied to realization of benefits, not the end of the taxable year.","notes":["Deferred R&D: at least 60 months, starting when benefits are first realized.","Exclusions: land, depreciable or depletable property, and costs to ascertain mineral deposits (Sec. 34(I)(3)).","Choice between expensing and deferring belongs to the taxpayer."],"upd":"CREATE MORE: RBEs under the Enhanced Deductions Regime may claim an additional 100% deduction on R&D expenses.","key":""},{"id":"Q13-28","quiz":13,"num":28,"sec":"3.3","q":"Contributions to pension trust during the taxable year to cover the pension liability accruing during the year, shall be allowed as a deduction under:","opts":["ordinary and necessary expenses.","interest expenses.","losses","taxes."],"ans":0,"exp":"Sec. 34(J) states that contributions to a pension trust to cover the pension liability accruing during the year are allowed as a deduction under Subsection (A)(1), which is ordinary and necessary expenses.","notes":["Current service cost: deductible in full as ordinary and necessary expense.","Past service cost (excess contributions): deductible over 10 consecutive years.","The pension plan must be reasonable and actuarially sound."],"upd":"","key":""},{"id":"Q13-29","quiz":13,"num":29,"sec":"3.3","q":"An employer establishing or maintaining a pension trust to provide for the payment of reasonable pensions to his employees shall be allowed as a deduction (in addition to the contributions to such trust during the taxable year to cover the pension liability accruing during the year, allowed as a deduction under Subsection (A)(1) of this Section) a reasonable amount transferred or paid into such trust during the taxable year in excess of such contributions, but only if such amount:\nI. has not theretofore been allowed as a deduction,\nII. is apportioned in equal parts over a period of ten (10) consecutive years beginning with the year in which the transfer or payment is made.","opts":["Yes to I and II","Yes to I only","Yes to II only","No to I and II"],"ans":0,"exp":"Sec. 34(J) allows the excess contribution (past service cost) only if it has not been deducted before and is apportioned equally over 10 consecutive years starting with the year of payment. Both conditions apply.","notes":["Past service cost: 1/10 per year for 10 consecutive years.","Current service cost: deductible in the year contributed.","Retirement benefits from a qualified plan (RA 4917) may be excluded from the employee's income if requisites are met."],"upd":"","key":""},{"id":"Q13-30","quiz":13,"num":30,"sec":"3.3","q":"Which of the following may be allowed to claim OSD in lieu of the itemized deductions?","opts":["Resident citizen","Non-resident citizen","Resident alien","All the choices"],"ans":3,"exp":"Sec. 34(L) allows OSD to individuals subject to tax under Sec. 24 other than nonresident aliens, which covers resident citizens, nonresident citizens and resident aliens with business or professional income. Nonresident aliens (taxed under Sec. 25) cannot claim OSD.","notes":["OSD for individuals: 40% of gross sales or receipts (no cost of sales deduction).","Not available to nonresident aliens or to purely compensation income earners.","8% option takers do not use OSD or itemized deductions."],"upd":"","key":""},{"id":"Q13-31","quiz":13,"num":31,"sec":"3.3","q":"Which of the following may be allowed to claim OSD in lieu of the itemized deductions?","opts":["Taxable estates and trusts","Domestic corporation","Resident foreign corporation","All the choices"],"ans":3,"exp":"Under Sec. 34(L) and RR 16-2008, OSD is available to individuals (including taxable estates and trusts, which are taxed like individuals) and to domestic and resident foreign corporations. Nonresident foreign corporations are taxed on gross income, so deductions do not apply to them.","notes":["Corporate OSD: 40% of gross income (gross sales less cost of sales, plus other income).","Estates and trusts are taxed like individuals and may use OSD.","NRFCs and NRAs cannot claim OSD."],"upd":"","key":""},{"id":"Q13-32","quiz":13,"num":32,"sec":"3.3","q":"In lieu of the itemized deductions, an individual subject to tax under Section 24, other than a nonresident alien, may elect a standard deduction in an amount not exceeding:","opts":["ten percent (10%) of his gross income.","twenty percent (20%) of his gross sales.","forty percent (40%) of his gross income.","forty percent (40%) of his gross sales."],"ans":3,"exp":"For individuals, Sec. 34(L) (as amended by RA 9504) sets OSD at 40% of gross sales or gross receipts; cost of sales or services is not deducted first. The 40% of gross income base applies to corporations. The old 10% of gross income was the pre-2008 rule.","notes":["Individuals: 40% of gross sales/receipts.","Corporations: 40% of gross income.","OSD needs no substantiation of expenses, but gross sales must be supported by records."],"upd":"","key":""},{"id":"Q13-33","quiz":13,"num":33,"sec":"3.3","q":"In the case of domestic corporation or a resident foreign corporation, it may elect a standard deduction in an amount not exceeding","opts":["ten percent (10%) of its gross income.","twenty percent (20%) of its gross sales.","forty percent (40%) of its gross income.","forty percent (40%) of its gross sales."],"ans":2,"exp":"For DCs and RFCs, Sec. 34(L) sets OSD at 40% of gross income, meaning gross sales less sales returns, discounts and cost of sales, plus other taxable income. The gross sales base is for individuals only.","notes":["Corporations: 40% of gross income (after cost of sales/services).","Individuals: 40% of gross sales/receipts.","MCIT still applies to corporations on OSD, from the 4th taxable year of operations."],"upd":"","key":""},{"id":"Q13-34","quiz":13,"num":34,"sec":"3.3","q":"First statement: The items of gross income under Section 32(A) of the Tax Code, as amended, which are required to be declared in the income tax return of the taxpayer for the taxable year are part of the gross income against which the OSD may be deducted in arriving at taxable income.\nSecond statement: Passive income which have been subjected to a final tax at source shall not form part of the gross income for purposes of computing the forty percent (40%) optional standard deduction.","opts":["Both statements are correct","Only the first statement is correct","Both statements are incorrect","Only the second statement is correct"],"ans":0,"exp":"Both are correct under RR 16-2008. The OSD base is the gross income required to be declared in the return; passive income already subjected to final tax is excluded from that base because it is not reported in the regular return.","notes":["OSD base excludes income subject to final tax and income subject to CGT.","For corporations, the base is gross income after cost of sales; for individuals, gross sales/receipts.","Interest income on deposits is subject to a uniform 20% final tax under CMEPA, so it stays outside the OSD base."],"upd":"","key":""},{"id":"Q13-35","quiz":13,"num":35,"sec":"3.3","q":"First statement: The taxpayer shall signify in his income tax return his intention to elect the optional standard deduction, otherwise, he shall be considered as having availed himself of the itemized deductions.\nSecond statement: The choice of optional standard deduction when made in the return shall be irrevocable for the taxable year for which the return is made.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both are true under Sec. 34(L). Failure to signify OSD in the return means the taxpayer is deemed to have chosen itemized deductions, and once elected, OSD is irrevocable for that taxable year. Under RR 16-2008, the election is signified in the first quarterly return and carries through the year.","notes":["No election in the return = deemed itemized deductions.","Election is irrevocable for the taxable year; may change the following year.","The choice made in the first quarter return applies to the succeeding quarters and the annual return."],"upd":"","key":""},{"id":"Q14-01","quiz":14,"num":1,"sec":"3.4-3.5","q":"An accounting period of twelve (12) months ending on the last day of December is a:","opts":["Calendar year","Fiscal year","Leap year","Sum-of-the-year"],"ans":0,"exp":"A calendar year is an accounting period of 12 months ending on December 31. A fiscal year ends on the last day of any month other than December (Sec. 22(P) and (Q), NIRC). Leap year and sum-of-the-year are not accounting periods under the Tax Code.","notes":["Calendar year: 12 months ending December 31.","Fiscal year: 12 months ending on the last day of any month other than December.","Individuals must use the calendar year (Sec. 43)."],"upd":"","key":""},{"id":"Q14-02","quiz":14,"num":2,"sec":"3.4-3.5","q":"An accounting period of twelve (12) months ending on the last day of any month other than December is a:","opts":["Calendar year","Fiscal year","Leap year","Sum-of-the-year"],"ans":1,"exp":"A fiscal year is a 12-month accounting period ending on the last day of any month other than December (Sec. 22(P), NIRC). A period ending in December is a calendar year, so choice a is wrong.","notes":["Fiscal year: available to corporations and partnerships, not to individuals.","A taxpayer that keeps no books must use the calendar year.","Changing the accounting period needs prior CIR approval (Sec. 47)."],"upd":"","key":""},{"id":"Q14-03","quiz":14,"num":3,"sec":"3.4-3.5","q":"The taxable income shall be computed on the basis of the taxpayer's annual accounting period (fiscal year or calendar year) in accordance with the method of accounting regularly employed in keeping the books, but the computation shall be made in accordance with such method as in the opinion of the Commissioner clearly reflects the income:\nI. If no such method of accounting has been so employed.\nII. If the method employed does not clearly reflect the income.","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Under Sec. 43, taxable income follows the method regularly used in keeping the books. The Commissioner may impose a method that clearly reflects income in two cases: when no method has been regularly employed, and when the method used does not clearly reflect income. Both conditions are correct.","notes":["General rule: use the method regularly employed in keeping the books.","CIR may prescribe a method if none is used or the method used distorts income.","The test is whether the method clearly reflects income."],"upd":"","key":""},{"id":"Q14-04","quiz":14,"num":4,"sec":"3.4-3.5","q":"The taxable income shall be computed on the basis of the calendar year under which of the following?\nI. If the taxpayer's annual accounting period is other than a fiscal year.\nII. If the taxpayer has no annual accounting period, or does not keep books.\nIII. If the taxpayer is an individual.","opts":["I, II and III","I and II only","II only","III only"],"ans":0,"exp":"Sec. 43 requires the calendar year in all three cases: the accounting period is other than a fiscal year, the taxpayer has no annual accounting period or keeps no books, or the taxpayer is an individual. Every listed situation is therefore correct.","notes":["Individuals: always calendar year.","No books or no annual accounting period: calendar year.","Only non-individuals keeping books may adopt a fiscal year."],"upd":"","key":""},{"id":"Q14-05","quiz":14,"num":5,"sec":"3.4-3.5","q":"Which of the following statements is correct?\nI. If a taxpayer, other than an individual, changes the basis of computing net income from fiscal year to calendar year, with the approval of the Commissioner, a separate final or adjustment return shall be made for the period between the close of the last fiscal year for which a return was made and the following December 31.\nII. If the change is from calendar year to fiscal year, a separate final or adjustment return shall be made for the period between the close of the last calendar year for which a return was made and the date designated as the close of the fiscal year.\nIII. If the change is from one fiscal year to another fiscal year, a separate final or adjustment return shall be made for the period between the close of the former fiscal year and the date designated as the close of the new fiscal year.","opts":["I, II and III","I and II only","II and III only","I only"],"ans":0,"exp":"Sec. 47 covers all three changes: fiscal to calendar, calendar to fiscal, and fiscal to another fiscal year. In each case a separate final or adjustment return is filed for the short period between the close of the old period and the start of the new one, so all statements are correct.","notes":["Any change of accounting period needs prior CIR approval.","The short period is covered by a separate final or adjustment return.","Only taxpayers other than individuals may change periods."],"upd":"","key":""},{"id":"Q14-06","quiz":14,"num":6,"sec":"3.4-3.5","q":"First statement: No return can be made for a period of more than twelve months.\nSecond statement: A separate return for a fractional part of a year is required whenever there is a change, with the approval of the Commissioner, in the basis of computing the net income from one taxable year to another taxable year.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"A taxable year can never exceed 12 months, so no return may cover a longer period. When the accounting period changes with CIR approval, the gap is covered by a separate return for the fractional part of a year (Sec. 47). Both statements are correct.","notes":["Maximum return period: 12 months.","Short-period return is required on an approved change of period.","Other short periods: dissolution, death, commencement of operations mid-year."],"upd":"","key":""},{"id":"Q14-07","quiz":14,"num":7,"sec":"3.4-3.5","q":"Which of the following instances does not give rise to a short accounting period?","opts":["When the corporation is newly organized and is using a fiscal year","When a corporation is dissolved","When a corporation changes its accounting period","When the taxpayer dies"],"ans":0,"exp":"Dissolution, change of accounting period and death all cut the taxable year short, so each requires a return for less than 12 months. A newly organized corporation that adopts a fiscal year does not by itself create a short period; its first period is short only if it begins operations after the start of the chosen year. Choice a is therefore the best answer.","notes":["Dissolution: final return covers the start of the year to the date of dissolution.","Death: return covers January 1 to the date of death.","Change of period (Sec. 47): separate return for the short period."],"upd":"","key":""},{"id":"Q14-08","quiz":14,"num":8,"sec":"3.4-3.5","q":"Which one of the following is not an essential of an acceptable accounting method?","opts":["There should be a distinction between revenue and capital expenditures.","Expenses to restore property or prolong its useful life should be added to the property account or charged against depreciation.","In all cases in which production, purchase or sale of merchandise is an income-producing factor, inventories at the beginning and at the end of the accounting period should be considered.","The accounting method should adhere strictly to generally accepted accounting principles."],"ans":3,"exp":"An acceptable tax accounting method must distinguish capital from revenue expenditures, capitalize restoration costs, and use inventories where merchandise is an income-producing factor. Strict adherence to GAAP is not required; tax accounting may differ from financial accounting as long as the method clearly reflects income. Choice d is the odd one.","notes":["Test for any method: it must clearly reflect income.","Restoration or life-extending costs are capitalized, not expensed.","Inventories are required when merchandise is an income-producing factor."],"upd":"","key":""},{"id":"Q14-09","quiz":14,"num":9,"sec":"3.4-3.5","q":"Which of the following statements is correct?\nI. Income which is credited to the account of or set apart for a taxpayer and which may be withdrawn upon by him at any time is subject to tax for the year during which so credited or set apart, although not then actually reduced to possession.\nII. To constitute constructive receipt, the income must be credited to the taxpayer without any substantial limitation or restriction as to the time or manner of payment or condition upon which payment is to be made.\nIII. The doctrine of constructive receipt of income is designed to prevent the exclusion from taxable income of items, the actual receipt of which could, at the option of a taxpayer on the cash basis, be deferred or indefinitely postponed.","opts":["I, II and III","I and II only","II and III only","III only"],"ans":0,"exp":"All three statements restate the constructive receipt doctrine in the revenue regulations. Income credited or set apart and freely withdrawable is taxed when credited; it must be free of substantial restrictions; and the doctrine keeps cash-basis taxpayers from deferring income simply by not collecting it.","notes":["Constructive receipt applies mainly to cash-basis taxpayers.","Key element: available without substantial limitation or condition.","Examples: interest credited and withdrawable, matured coupons, partner's distributive share."],"upd":"","key":""},{"id":"Q14-10","quiz":14,"num":10,"sec":"3.4-3.5","q":"Which of the following is not an example of constructive receipt of income?","opts":["Partner's distributive share in the profit of a partnership.","Interest credited to the account of a taxpayer and which he may withdraw at any time.","Interest coupons which have matured.","Corporation contingently credited stock bonus, but the stock is not available to the employee until some future date."],"ans":3,"exp":"Constructive receipt requires that the income be available without substantial restriction. A stock bonus credited contingently and not available until a future date is restricted, so it is not constructively received. The partner's share (taxable whether or not distributed), freely withdrawable credited interest and matured coupons are all constructively received.","notes":["Contingent or restricted credits are not constructively received.","A partner's distributive share is taxable whether or not actually distributed.","Matured interest coupons are income even if not yet cashed."],"upd":"","key":""},{"id":"Q14-11","quiz":14,"num":11,"sec":"3.4-3.5","q":"A method of accounting which applies to a farmer who is engaged in producing crops which take more than a year from the time of planting to the time of gathering and disposing. The entire cost of producing the crop must be taken as a deduction in the year in which the gross income from the crop is realized.","opts":["Cash basis","Accrual basis","Crop basis","Installment method"],"ans":2,"exp":"The crop year basis is available to farmers whose crops take more than a year from planting to gathering and disposal. The entire cost of producing the crop is deducted in the year the income from the crop is realized, matching cost with income. Cash and accrual bases do not have this special matching rule, and the installment method concerns sales collected over time.","notes":["Crop basis: crops taking more than 1 year from planting to disposal.","Costs are deducted in the year the crop income is realized.","Farmers may otherwise use cash or accrual basis."],"upd":"","key":""},{"id":"Q14-12","quiz":14,"num":12,"sec":"3.4-3.5","q":"First statement: A taxpayer who changes the method of accounting employed in keeping his books shall secure the consent of the Commissioner before computing his income upon such new method for purposes of taxation.\nSecond statement: If for any reason the basis of reporting income subject to tax is changed, the taxpayer shall attach to his return a separate statement setting forth for the taxable year and for the preceding year the classes of items differently treated under the two systems, specifying in particular all amounts duplicated or entirely omitted as a result of such change.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements restate the revenue regulations on change of accounting method. Prior CIR consent is required before income is computed under a new method, and the return must be accompanied by a statement showing items treated differently under the two methods, including amounts duplicated or omitted.","notes":["Change of accounting METHOD: prior CIR consent required.","Attach a reconciliation statement for the current and preceding year.","Change of accounting PERIOD also requires CIR approval (Sec. 47)."],"upd":"","key":""},{"id":"Q14-13","quiz":14,"num":13,"sec":"3.4-3.5","q":"(Phil. CPA) When the gross income is reported partially in each taxable year in proportion to collections made in such period as it bears to the total contract price, this refers to the:","opts":["crop year basis method.","accrual method.","percentage of completion method.","installment sales method."],"ans":3,"exp":"Under the installment method (Sec. 49), income recognized each year equals the collections in that year multiplied by the gross profit ratio (gross profit over contract price). The percentage of completion method recognizes income based on progress of work, not collections, and the accrual method recognizes income when earned.","notes":["Income recognized = collections x (gross profit / contract price).","Percentage of completion is for long-term construction contracts.","Installment method is optional when the conditions are met."],"upd":"","key":""},{"id":"Q14-14","quiz":14,"num":14,"sec":"3.4-3.5","q":"First statement: Dealers of personal property who regularly sell or otherwise dispose of personal property on an installment plan may report under the installment method only if the initial payments do not exceed 25% of the selling price.\nSecond statement: Persons who made a casual sale or casual disposition of personal property may report income under the installment method regardless of the selling price of such personal property.","opts":["True, True","False, False","True, False","False, True"],"ans":1,"exp":"Both statements are false. Dealers who regularly sell personal property on the installment plan may use the installment method regardless of the initial payments (Sec. 49(A)). Casual sellers of personal property may use it only if the selling price exceeds P1,000 and the initial payments do not exceed 25% of the selling price (Sec. 49(B)).","notes":["Dealers of personal property: no 25% initial payment limit.","Casual sale of personal property: price above P1,000 AND initial payments not exceeding 25%.","Sale of real property: initial payments not exceeding 25%."],"upd":"","key":""},{"id":"Q14-15","quiz":14,"num":15,"sec":"3.4-3.5","q":"Which one of the following is not a condition for reporting income under the installment method by a casual seller of personal property?","opts":["The selling price of the property exceeds P1,000.","The initial payments must not exceed 25% of the selling price.","The property sold is not of a kind which would be includible in the inventory if on hand at the close of the taxable year.","The seller is a natural person."],"ans":3,"exp":"Sec. 49(B) allows a casual sale of personal property to be reported on the installment basis if the property is not inventory-type property, the price exceeds P1,000, and the initial payments do not exceed 25% of the selling price. Nothing requires the seller to be a natural person; corporations may also use the method. Choice d is the odd one.","notes":["Three conditions: non-inventory property, price above P1,000, initial payments not exceeding 25%.","Seller may be an individual or a corporation.","Inventory-type property sold regularly falls under the dealer rule instead."],"upd":"","key":""},{"id":"Q14-16","quiz":14,"num":16,"sec":"3.4-3.5","q":"First statement: Persons who sell or otherwise dispose of real property, not considered as a capital asset, the initial payments on which do not exceed twenty-five percent (25%) of the selling price may use the installment method to report the gain on the sale.\nSecond statement: An individual who sells or disposes of real property, considered as a capital asset, and is otherwise qualified to report the gain under the installment method may pay the capital gains tax in installments under rules and regulations to be promulgated by the Secretary of Finance, upon recommendation of the Commissioner.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements are true under Sec. 49(B). Sales of real property (ordinary assets) may be reported on the installment basis if the initial payments do not exceed 25% of the selling price. An individual selling real property held as a capital asset who meets the same condition may pay the 6% capital gains tax in installments, as collections are made, under BIR rules.","notes":["Real property: installment method if initial payments do not exceed 25% of selling price.","Capital asset real property of individuals: CGT (6%) may be paid in installments.","CGT base: higher of gross selling price or FMV (zonal or assessor's value)."],"upd":"","key":""},{"id":"Q14-17","quiz":14,"num":17,"sec":"3.4-3.5","q":"The payment received in cash or property, excluding evidences of indebtedness due and payable in subsequent years (e.g., promissory notes, mortgage given), by the purchaser during the taxable year in which the sale or other disposition is made.","opts":["Initial payment","Selling price","Contract price","Fair market price"],"ans":0,"exp":"Initial payments are the payments received in cash or property in the year of sale, excluding notes and other evidences of indebtedness payable in later years. They include the down payment, installments collected in the year of sale, and any excess of mortgage assumed over the seller's cost.","notes":["Initial payments = down payment + collections in year of sale + excess of mortgage assumed over cost.","Buyer's notes due in later years are excluded.","The 25% test compares initial payments to the selling price."],"upd":"","key":""},{"id":"Q14-18","quiz":14,"num":18,"sec":"3.4-3.5","q":"The total amount or price of the sale including the cash or property received and including all notes of the buyer or mortgages assumed by him.","opts":["Initial payment","Selling price","Contract price","Fair market price"],"ans":1,"exp":"The selling price is the total price of the sale: cash, property, buyer's notes and any mortgage assumed by the buyer. It is the denominator in the 25% initial payment test. The contract price is smaller when the buyer assumes a mortgage.","notes":["Selling price includes mortgage assumed by the buyer.","Initial payment test: initial payments / selling price not exceeding 25%.","Without an assumed mortgage, selling price equals contract price."],"upd":"","key":""},{"id":"Q14-19","quiz":14,"num":19,"sec":"3.4-3.5","q":"The amount which the purchaser contracts to pay the seller in cash.","opts":["Initial payment","Selling price","Contract price","Fair market price"],"ans":2,"exp":"The contract price is what the buyer actually pays the seller: selling price less any mortgage assumed, plus any excess of the mortgage over the seller's cost. It is the base of the gross profit rate used to recognize income on collections.","notes":["Contract price = selling price - mortgage assumed + excess of mortgage over cost.","Gross profit rate = gross profit / contract price.","Excess of mortgage over cost is also part of initial payments."],"upd":"","key":""},{"id":"Q14-20","quiz":14,"num":20,"sec":"3.4-3.5","q":"This method is based on the accounting formula that an increase in net worth plus non-deductible disbursements minus non-taxable receipts equals net income.","opts":["Installment method","Accrual method","Cash method","Net worth method"],"ans":3,"exp":"The net worth method is an indirect method used by the BIR to reconstruct income when books are missing or unreliable. Income equals the increase in net worth, plus non-deductible expenditures, minus non-taxable receipts. The other choices are methods of reporting income, not methods of reconstructing it.","notes":["Net worth method: used by the BIR when records are inadequate or unreliable.","Formula: increase in net worth + non-deductible disbursements - non-taxable receipts.","Unexplained increase in net worth is presumed taxable income."],"upd":"","key":""},{"id":"Q15-01","quiz":15,"num":1,"sec":"3.7","q":"A sworn statement in which the taxpayer discloses the nature and extent of his tax liability by formally making a report of his income and allowable deductions for the taxable year in the prescribed form.","opts":["Income tax return","Tax assessment","Letter of authority","Letter of intent"],"ans":0,"exp":"An income tax return is the taxpayer's sworn declaration of income, deductions and tax due for the taxable year in the prescribed BIR form. An assessment is the BIR's own determination of a deficiency, and a letter of authority authorizes a revenue officer to examine the taxpayer's books.","notes":["The return is filed under penalties of perjury.","Assessment: BIR's finding of deficiency, not the taxpayer's report.","Letter of authority: needed before a revenue officer may examine books."],"upd":"","key":""},{"id":"Q15-02","quiz":15,"num":2,"sec":"3.7","q":"Who of the following individuals shall NOT be required to file an income tax return?","opts":["Every Filipino citizen residing in the Philippines","Every Filipino citizen residing outside the Philippines, on his income from sources within the Philippines","Every alien residing in the Philippines, on income derived from sources within the Philippines","Every alien who is not a resident of the Philippines and not doing business in the Philippines"],"ans":3,"exp":"Sec. 51(A)(1) requires returns from resident citizens, nonresident citizens and resident aliens (on Philippine income), and nonresident aliens engaged in trade or business in the Philippines. A nonresident alien not engaged in trade or business is taxed at a 25% final tax withheld at source on gross Philippine income, so no return is required.","notes":["NRA not engaged in trade or business: 25% final tax on gross income, no return.","Nonresident citizens and aliens file only on Philippine-source income.","Resident citizens are taxed on worldwide income."],"upd":"","key":""},{"id":"Q15-03","quiz":15,"num":3,"sec":"3.7","q":"Who of the following individual taxpayers shall be required to file an income tax return?","opts":["An individual whose gross income does not exceed P250,000.","An individual taxpayer receiving purely compensation income, regardless of amount, from only one employer in the Philippines for the calendar year, the income tax of which has been withheld incorrectly by the said employer.","An individual whose sole income has been subjected to final withholding tax.","An individual who is exempt from income tax pursuant to the Tax Code and other laws, general or special (e.g., minimum wage earners under R.A. No. 9504 and government employees with Salary Grades 1 to 3)."],"ans":1,"exp":"Sec. 51(A)(2) excuses from filing an employee earning purely compensation from one employer only if the tax was CORRECTLY withheld. If the employer withheld incorrectly, the employee must file. The other choices describe individuals not required to file: those with income not exceeding P250,000, those whose sole income was subjected to final tax, and exempt individuals such as MWEs.","notes":["Substituted filing: BIR Form 2316 replaces the ITR for qualified employees.","Two or more employers concurrently in the year: must file.","Self-employed and professionals must file regardless of the amount of income."],"upd":"","key":""},{"id":"Q15-04","quiz":15,"num":4,"sec":"3.7","q":"Except in cases where the Commissioner otherwise permits, the return shall be filed with an authorized agent bank, Revenue District Officer, Collection Agent, or duly authorized Treasurer of the city or municipality in which such person has his:\nI. Legal residence or principal place of business in the Philippines.\nII. If there be no legal residence or place of business in the Philippines, with the Office of the Commissioner.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":1,"exp":"Under EOPT's file-anywhere rule, Sec. 51(B) now allows the return to be filed with ANY authorized agent bank, Revenue District Office through a Revenue Collection Officer, or authorized tax software provider. Filing is no longer tied to the place of legal residence or principal place of business, and the rule sending returns to the Office of the Commissioner no longer applies. Neither statement is correct.","notes":["File anywhere: any AAB, any RDO through an RCO, or authorized tax software provider.","Electronic filing and payment remain available (eFPS, eBIRForms).","The CIR may still prescribe the manner of filing."],"upd":"EOPT (RA 11976): returns may be filed and taxes paid anywhere, electronically or manually, with any AAB, RDO through an RCO, or authorized tax software provider; the old residence-based venue rule was removed.","key":""},{"id":"Q15-05","quiz":15,"num":5,"sec":"3.7","q":"When the tax due is in excess of P2,000, the taxpayer other than a corporation may elect to pay the tax in two (2) equal installments:\nI. The first installment is paid at the time the return is filed.\nII. The second installment is paid on or before July 15 following the close of the calendar year.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":2,"exp":"Sec. 56(A)(2) lets individuals whose tax due exceeds P2,000 pay in two equal installments: the first when the return is filed (April 15) and the second on or before October 15 following the close of the calendar year. The July 15 date in statement II is the old deadline, so only statement I is correct.","notes":["Installment option: individuals only, tax due over P2,000.","1st installment: upon filing (April 15); 2nd: on or before October 15.","Corporations may not pay the annual tax in installments."],"upd":"","key":""},{"id":"Q15-06","quiz":15,"num":6,"sec":"3.7","q":"An individual taxpayer has the following data for the current year: tax due P50,000; less creditable withholding tax P30,000; tax payable P20,000. The taxpayer elects to pay the tax in two (2) equal installments. How much is payable at the time the return is filed and on October 15?","opts":["Upon filing: P25,000; October 15: P25,000","Upon filing: P25,000; October 15: None","Upon filing: P20,000; October 15: None","Upon filing: None; October 15: P20,000"],"ans":3,"exp":"The tax due of P50,000 is split into two installments of P25,000. The full creditable withholding tax of P30,000 is applied to the first installment, wiping it out (nothing is payable upon filing) and leaving a P5,000 excess. The excess reduces the second installment to P20,000, payable on or before October 15.","notes":["Installments are based on tax due, then credits are applied to the first installment.","Excess credits carry over to the second installment.","Installment option requires tax due over P2,000."],"upd":"","key":""},{"id":"Q15-07","quiz":15,"num":7,"sec":"3.7","q":"The income of unmarried minors derived from property received from a living parent shall be included in the return of the parent, except:\nI. When the donor's tax has been paid on such property.\nII. When the transfer of such property is exempt from donor's tax.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 51(E) requires the income of unmarried minors from property received from a living parent to be included in the parent's return. The two exceptions are when donor's tax has been paid on the property and when the transfer is exempt from donor's tax. Both statements are correct.","notes":["Rule prevents splitting income by transferring property to minor children.","Exceptions: donor's tax paid, or transfer exempt from donor's tax.","Donor's tax: 6% of net gifts over P250,000 per calendar year."],"upd":"","key":""},{"id":"Q15-08","quiz":15,"num":8,"sec":"3.7","q":"If the taxpayer is unable to make his own return, the return may be made:\nI. By his duly authorized agent or representative; or\nII. By the guardian; or\nIII. By another person charged with the care of his person or property.","opts":["I, II and III are correct","Only I and II are correct","Only I and III are correct","Only I is correct"],"ans":0,"exp":"Sec. 51(D) allows the return of a taxpayer under disability to be made by a duly authorized agent or representative, by the guardian, or by another person charged with the care of his person or property. All three are correct.","notes":["The representative and the taxpayer are responsible for the return.","The CIR may require the taxpayer to file a new return.","Returns of estates and trusts are filed by the executor, administrator or trustee."],"upd":"","key":""},{"id":"Q15-09","quiz":15,"num":9,"sec":"3.7","q":"The first quarter income tax return of an individual taxpayer engaged in trade or business shall be filed on or before:","opts":["March 15.","April 15.","May 15.","June 15."],"ans":2,"exp":"Individuals in business or practice of profession file quarterly returns on or before May 15, August 15 and November 15 for the first three quarters (Sec. 74). April 15 is the deadline of the annual return, and March 15 is not a quarterly deadline for individuals.","notes":["Individual quarterly ITR: May 15, August 15, November 15.","Annual ITR of individuals: April 15.","Corporations: quarterly within 60 days after the close of each of the first three quarters."],"upd":"","key":""},{"id":"Q15-10","quiz":15,"num":10,"sec":"3.7","q":"This refers to the system developed and maintained by the BIR for electronically filing tax returns, including attachments, if any, and paying taxes thereon, specifically through the internet.","opts":["Manual Filing and Payment System","Electronic Filing and Payment System","Up-to-date Filing and Payment System","Advance Technological Filing and Payment System"],"ans":1,"exp":"The Electronic Filing and Payment System (EFPS) is the BIR's internet-based system for e-filing returns with attachments and e-paying taxes through AAB online facilities (RR 9-2001, as amended). The other choices are not BIR systems.","notes":["EFPS: e-filing plus e-payment via AAB internet banking.","eBIRForms: offline/online filing package for non-EFPS filers.","EFPS numbers: Filing Reference Number (filing), Confirmation Number (debit of taxpayer's account), Acknowledgment Number (credit to government account)."],"upd":"","key":""},{"id":"Q15-11","quiz":15,"num":11,"sec":"3.7","q":"This refers to the control number issued by the EFPS to acknowledge that a tax return, including attachments, has been successfully filed electronically.","opts":["Filing Reference Number","Confirmation Number","Acknowledgment Number","Taxpayer's Information Number"],"ans":0,"exp":"The Filing Reference Number is issued by the EFPS to confirm that the return was successfully e-filed. The Confirmation Number relates to the debit of the taxpayer's bank account, and the Acknowledgment Number to the crediting of the payment to the government.","notes":["EFPS numbers: Filing Reference Number (filing), Confirmation Number (debit of taxpayer's account), Acknowledgment Number (credit to government account).","FRN is issued by the BIR's EFPS, not by the bank.","Keep the FRN as proof of timely filing."],"upd":"","key":""},{"id":"Q15-12","quiz":15,"num":12,"sec":"3.7","q":"This refers to the control number issued by the authorized agent bank (AAB) to the taxpayer and the BIR to acknowledge that the taxpayer's account has been successfully debited electronically in payment of his tax liability.","opts":["Filing Reference Number","Confirmation Number","Acknowledgment Number","Taxpayer's Information Number"],"ans":1,"exp":"The Confirmation Number is issued by the AAB to the taxpayer and the BIR once the taxpayer's account has been debited for the tax payment. The Filing Reference Number concerns the filing of the return, and the Acknowledgment Number confirms that the government account was credited.","notes":["EFPS numbers: Filing Reference Number (filing), Confirmation Number (debit of taxpayer's account), Acknowledgment Number (credit to government account).","Confirmation Number: issued by the AAB to BOTH the taxpayer and the BIR.","Acknowledgment Number: issued by the AAB to the BIR only."],"upd":"","key":""},{"id":"Q15-13","quiz":15,"num":13,"sec":"3.7","q":"This refers to the control number issued by the AAB to the BIR to confirm that the tax payment has been credited to the account of the government or recognized as revenue (internal revenue tax collection) by the Bureau of the Treasury.","opts":["Filing Reference Number","Confirmation Number","Acknowledgment Number","Taxpayer's Information Number"],"ans":2,"exp":"The Acknowledgment Number is issued by the AAB to the BIR to confirm that the payment has been credited to the government's account as internal revenue collection. The Confirmation Number only confirms the debit of the taxpayer's account.","notes":["EFPS numbers: Filing Reference Number (filing), Confirmation Number (debit of taxpayer's account), Acknowledgment Number (credit to government account).","Acknowledgment Number: AAB to BIR, payment credited to the Bureau of the Treasury.","Taxpayer's Information Number is not an EFPS control number."],"upd":"","key":""},{"id":"Q15-14","quiz":15,"num":14,"sec":"3.7","q":"Who of the following taxpayers shall file their returns and pay their taxes through EFPS?\nI. Large taxpayers.\nII. The volunteering 200 or more non-large taxpayers previously identified by the BIR.","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"EFPS is mandatory for large taxpayers and for the 200 or more volunteering non-large taxpayers identified by the BIR. Both are among the mandated EFPS users, along with other groups later added by regulation.","notes":["Mandatory EFPS: large taxpayers, the 200 volunteers, top 20,000 private corporations, top 5,000 individuals.","Also: corporations with paid-up capital of P10M and above, corporations with complete computerized systems, public bidders (RR 3-2005).","Also: enterprises enjoying fiscal incentives (PEZA, BOI, other zone authorities) and government offices on withheld VAT and business taxes."],"upd":"","key":""},{"id":"Q15-15","quiz":15,"num":15,"sec":"3.7","q":"Which of the following corporations shall file their returns and pay their taxes through EFPS?","opts":["Corporations with paid-up capital of Ten Million Pesos (P10,000,000) and above","Corporations with complete computerized system","Taxpayers joining public bidding pursuant to Executive Order No. 398 as implemented by RR No. 3-2005","All of the choices"],"ans":3,"exp":"The EFPS regulations mandate EFPS for corporations with paid-up capital of P10,000,000 and above, corporations with a complete computerized system, and taxpayers joining public bidding under E.O. No. 398 (RR 3-2005). Since all three are mandated, the answer is all of the choices.","notes":["Paid-up capital threshold for mandatory EFPS: P10,000,000 and above.","Public bidders under E.O. 398 must use EFPS.","PEZA, BOI and other incentive-registered enterprises are also mandated."],"upd":"","key":""},{"id":"Q15-16","quiz":15,"num":16,"sec":"3.7","q":"First statement: For all returns that will be e-filed by large taxpayers starting August 1, 2002, e-payment of the taxes due thereon through EFPS shall become mandatory unless otherwise notified by the Commissioner of Internal Revenue.\nSecond statement: Upon receipt of a notification letter duly signed by the Commissioner of Internal Revenue, it becomes mandatory for the volunteering two hundred (200) or more non-large taxpayers, including their branches located in the computerized revenue district offices, to file their returns and pay their taxes through EFPS.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements restate the EFPS regulations. E-payment became mandatory for returns e-filed by large taxpayers starting August 1, 2002, and EFPS becomes mandatory for the 200 or more volunteering non-large taxpayers (including their branches in computerized RDOs) upon receipt of the CIR's notification letter.","notes":["Large taxpayers: mandatory e-payment of e-filed returns since August 1, 2002.","Volunteer non-large taxpayers: mandatory upon CIR notification letter.","Branches in computerized RDOs are covered."],"upd":"","key":""},{"id":"Q15-17","quiz":15,"num":17,"sec":"3.7","q":"The electronic copies of the returns in their original format e-filed by a taxpayer can be accessed by him or it via the EFPS for a period of how many months?","opts":["Two (2) months from filing thereof.","Three (3) months from filing thereof.","Four (4) months from filing thereof.","Five (5) months from filing thereof."],"ans":0,"exp":"Under the EFPS regulations, the taxpayer may access e-filed returns in their original format through EFPS for two months from filing. After that, the taxpayer must rely on its own saved or printed copies, so returns should be printed or saved promptly.","notes":["EFPS online access to e-filed returns: 2 months from filing.","Taxpayer should keep its own copies of e-filed returns.","Books and records: preserve for 5 years (EOPT)."],"upd":"","key":""},{"id":"Q15-18","quiz":15,"num":18,"sec":"3.7","q":"The paper copy of the audited financial statements shall be filed within how many days and how many copies?","opts":["Twenty-five (25) days from the date of filing of BIR Form No. 1702 and five (5) copies of the audited financial statements (FS).","Twenty (20) days from the date of filing of BIR Form No. 1702 and four (4) copies of the audited FS.","Fifteen (15) days from the date of filing of BIR Form No. 1702 and six (6) copies of the audited FS.","Fifteen (15) days from the date of filing of BIR Form No. 1702 and four (4) copies of the audited FS."],"ans":3,"exp":"Under the EFPS rules, an EFPS filer that e-files the annual corporate return (BIR Form 1702) submits the paper copies of the audited financial statements, four copies, within 15 days from the date of e-filing. The other choices misstate either the period or the number of copies.","notes":["Paper AFS of EFPS filers: within 15 days from e-filing of Form 1702, 4 copies.","The AFS and attachments are now generally submitted through the BIR's eAFS facility.","Annual corporate ITR: 15th day of the 4th month after the close of the taxable year."],"upd":"","key":""},{"id":"Q15-19","quiz":15,"num":19,"sec":"3.7","q":"First statement: For non-large taxpayers who intend to e-pay, electronic payment shall be made through the internet banking facilities of any AAB.\nSecond statement: The filing of the return ahead of the payment of the tax due thereon is still in accordance with the \"pay-as-you-file\" principle as long as the payment of the tax is made on or before the due date of the applicable tax.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements are correct. Non-large taxpayers who e-pay do so through the internet banking facilities of any AAB. Filing a return earlier than the payment does not violate the pay-as-you-file principle, provided the tax is paid on or before the due date.","notes":["Pay-as-you-file: tax is paid at the time of filing, at the latest on the due date.","E-payment is through AAB internet banking or other approved channels.","Late payment triggers surcharge and interest even if the return was filed on time."],"upd":"","key":""},{"id":"Q15-20","quiz":15,"num":20,"sec":"3.7","q":"What shall be issued by the AAB to the BIR to confirm that the tax payment has been credited to the account of the government or recognized as revenue (internal revenue tax collection) by the Bureau of the Treasury?","opts":["Filing Reference Number","Confirmation Number","Acknowledgment Number","Taxpayer's Information Number"],"ans":2,"exp":"The Acknowledgment Number is issued by the AAB to the BIR once the payment has been credited to the government's account as internal revenue collection. The Confirmation Number covers only the debit of the taxpayer's account, and the Filing Reference Number covers the filing of the return.","notes":["EFPS numbers: Filing Reference Number (filing), Confirmation Number (debit of taxpayer's account), Acknowledgment Number (credit to government account).","Acknowledgment Number: AAB to BIR only.","Confirmation Number: AAB to taxpayer and BIR."],"upd":"","key":"Same question as item 13 in the source quiz, reworded."},{"id":"Q15-21","quiz":15,"num":21,"sec":"3.7","q":"Failure to comply with the provisions on e-filing and e-payment shall be penalized under Section 275 of the Tax Code (Violation of Other Provisions of this Code or Rules and Regulations in General).\nI. Only the first and second offenses may be compromised.\nII. For the third and subsequent offenses, no compromise shall be entertained or allowed.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"The EFPS regulations penalize non-compliance under Sec. 275, the general penalty provision. Only the first and second offenses may be compromised; the third and subsequent offenses may not. Both statements are correct.","notes":["Sec. 275: general penalty for violating the Code or regulations.","Compromise allowed only for the 1st and 2nd offenses.","3rd and subsequent offenses: no compromise, criminal action may follow."],"upd":"","key":""},{"id":"Q15-22","quiz":15,"num":22,"sec":"3.9","q":"Every person subject to any internal revenue tax shall register once with the appropriate Revenue District Officer:\nI. Within ten (10) days from date of employment, or\nII. On or before the commencement of business, or\nIII. Before payment of any tax due, or\nIV. Upon filing of a return, statement or declaration as required in the Tax Code.\nWhich of the above are correct?","opts":["I, II, III and IV","I, II and III","I and III only","II and III only"],"ans":0,"exp":"Sec. 236(A) requires registration once, within 10 days from date of employment, or on or before commencement of business, or before payment of any tax due, or upon filing of a return, statement or declaration. All four timing rules are correct.","notes":["Employees: register within 10 days from date of employment.","Businesses: on or before commencement of business.","Registration is once, with the RDO having jurisdiction, electronically or in person."],"upd":"EOPT (RA 11976): registration may be done electronically or in person, and the P500 annual registration fee was abolished.","key":""},{"id":"Q15-23","quiz":15,"num":23,"sec":"3.9","q":"First statement: A person maintaining a head office, branch or facility shall register with the Revenue District Officer having jurisdiction over the head office, branch or facility.\nSecond statement: The term \"facility\" may include sales outlets, places of production, warehouses but does not include storage places.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is incorrect"],"ans":2,"exp":"Each head office, branch or facility registers with the RDO having jurisdiction over it (Sec. 236(B)). The same provision defines \"facility\" to include sales outlets, places of production, warehouses OR storage places, so the second statement, which excludes storage places, is wrong. Only the first statement is correct; choice d says the same thing in other words.","notes":["Facility includes sales outlets, places of production, warehouses and storage places.","Each branch or facility registers with the RDO having jurisdiction over it.","EOPT: registration may be done electronically or in person."],"upd":"","key":"Source key says A, but Sec. 236(B) defines \"facility\" to include sales outlets, places of production, warehouses OR storage places, so the second statement is wrong; choice d says the same thing in other words."},{"id":"Q15-24","quiz":15,"num":24,"sec":"3.9","q":"All persons subject to an internal revenue tax shall, for each sale or transfer of merchandise or for services rendered valued at how much, issue duly registered receipts or sales or commercial invoices, prepared at least in duplicate, showing the date of transaction, quantity, unit cost and description of merchandise or nature of service?","opts":["Five hundred pesos (P500.00)","Five hundred pesos (P500.00) or more","One hundred pesos","One hundred pesos or more"],"ans":1,"exp":"Sec. 237, as amended by EOPT, requires a duly registered invoice for each sale or transfer of goods or services valued at P500 or more. \"Or more\" matters: a sale of exactly P500 is covered. The P100 threshold was the TRAIN rule before EOPT.","notes":["Invoice threshold: P500 or more per sale (adjustable every 3 years).","Invoic
