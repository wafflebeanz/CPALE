<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LECPA Tax Theory Drill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#F3F6F3;
  --sheet:#FFFFFF;
  --ink:#15241F;
  --ink-2:#4A5C55;
  --ink-3:#71827B;
  --line:#CAD6CF;
  --line-2:#E2EAE5;
  --accent:#0B6B50;
  --accent-ink:#FFFFFF;
  --accent-soft:#E0F0E9;
  --good:#0B6B50;
  --good-soft:#E3F3EC;
  --bad:#B3261E;
  --bad-soft:#FBE9E7;
  --upd:#8A5A00;
  --upd-soft:#FFF3D4;
  --upd-line:#E9C877;
  --flag:#4B4F8C;
  --flag-soft:#ECEDF8;
  --shadow:0 1px 0 rgba(21,36,31,.04),0 8px 24px -12px rgba(21,36,31,.18);
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0E1513;--sheet:#15201C;--ink:#E4EDE8;--ink-2:#A9BBB3;--ink-3:#7F938A;
    --line:#2C3B35;--line-2:#202D28;--accent:#41C497;--accent-ink:#06130E;--accent-soft:#16372B;
    --good:#41C497;--good-soft:#123126;--bad:#F2877D;--bad-soft:#3A1916;
    --upd:#F0C35C;--upd-soft:#2E2410;--upd-line:#6B5419;--flag:#AEB3F2;--flag-soft:#23254A;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0E1513;--sheet:#15201C;--ink:#E4EDE8;--ink-2:#A9BBB3;--ink-3:#7F938A;
  --line:#2C3B35;--line-2:#202D28;--accent:#41C497;--accent-ink:#06130E;--accent-soft:#16372B;
  --good:#41C497;--good-soft:#123126;--bad:#F2877D;--bad-soft:#3A1916;
  --upd:#F0C35C;--upd-soft:#2E2410;--upd-line:#6B5419;--flag:#AEB3F2;--flag-soft:#23254A;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:0 96px}
.wrap{max-width:820px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;text-wrap:balance;margin:0}

/* masthead */
.mast{padding-block:28px 18px;border-bottom:2px solid var(--ink);display:grid;gap:10px}
.mast .eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;gap:12px;flex-wrap:wrap}
.mast h1{font-size:clamp(34px,6.4vw,52px);line-height:.95;text-transform:uppercase}
.mast h1 span{color:var(--accent)}
.mast p{margin:0;color:var(--ink-2);max-width:62ch}
.formline{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;border:1px solid var(--line);background:var(--line);margin-top:14px}
.formline > div{padding:8px 12px;background:var(--sheet);min-width:0}
.formline .lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.formline .val{font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}

/* tabs */
.tabs{display:flex;margin-top:18px;border-bottom:2px solid var(--ink)}
.tab{flex:0 1 auto;padding:10px 16px;border:1px solid var(--line);border-bottom:0;background:var(--paper);color:var(--ink-2);cursor:pointer;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-right:-1px}
.tab span{font-family:var(--mono);font-size:12px;margin-left:6px;color:var(--ink-3)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.8}
@media (max-width:520px){.tab{flex:1 1 0;font-size:16px;padding:9px 10px}}
/* quick drills */
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-block:22px}
.qbtn{display:grid;gap:2px;text-align:left;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);cursor:pointer}
.qbtn:hover{border-color:var(--accent)}
.qbtn b{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:.02em}
.qbtn small{color:var(--ink-2);font-size:12.5px}
.qbtn[disabled]{opacity:.5;cursor:not-allowed}
.qbtn.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qbtn.primary small{color:inherit;opacity:.85}

/* schedule */
.sched-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:8px}
.sched-head h2{font-size:24px;text-transform:uppercase}
.sched-head .tools{display:flex;gap:8px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.part{margin-top:14px;border:1px solid var(--line);background:var(--sheet)}
.part-h{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--ink);color:var(--paper)}
:root[data-theme="dark"] .part-h{background:var(--line)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .part-h{background:var(--line)}}
.part-h .code{font-family:var(--mono);font-size:12px;opacity:.8}
.part-h h3{font-size:17px;text-transform:uppercase;letter-spacing:.06em;flex:1}
.part-h .cnt{font-family:var(--mono);font-size:12px;opacity:.8}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line-2)}
.row:first-of-type{border-top:0}
.row input{width:18px;height:18px;accent-color:var(--accent)}
.row .t{display:grid;gap:4px;min-width:0}
.row .t label{font-weight:500;cursor:pointer}
.row .t label .sc{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-right:6px}
.row .meta{display:flex;gap:10px;align-items:center;font-size:12px;color:var(--ink-3);font-family:var(--mono);flex-wrap:wrap}
.bar{height:5px;background:var(--line-2);width:120px;max-width:40vw;display:flex;overflow:hidden}
.bar i{display:block;height:100%}
.bar .g{background:var(--good)}.bar .r{background:var(--bad)}
.row .go{padding:6px 12px;border:1px solid var(--accent);color:var(--accent);background:transparent;cursor:pointer;font-weight:600;font-size:13px}
.row .go:hover{background:var(--accent);color:var(--accent-ink)}
.row.empty{grid-template-columns:28px 1fr;color:var(--ink-3)}
.row.empty .t{font-style:italic}
.srcnote{margin-top:22px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}

/* start bar */
.startbar{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:2px solid var(--ink);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:5}
.startbar .in{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startbar .sum{flex:1 1 160px;font-size:13px;color:var(--ink-2)}
.startbar .sum b{color:var(--ink);font-family:var(--display);font-size:20px;font-weight:600}
.startbar select{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink)}
.btn{padding:9px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* quiz */
.qtop{position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:4;padding-block:12px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.qtop .l1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qtop .l1 .back{background:none;border:1px solid var(--line);padding:5px 10px;cursor:pointer;font-size:13px}
.qtop .l1 .where{flex:1;min-width:0;font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px}
.chip{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);background:var(--sheet);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.hot{border-color:var(--upd-line);background:var(--upd-soft);color:var(--upd)}
.prog{height:4px;background:var(--line-2)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.card{margin-top:18px;background:var(--sheet);border:1px solid var(--line);box-shadow:var(--shadow);position:relative}
.card .hdr{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.card .hdr .itm{border:1px solid var(--ink);color:var(--ink);padding:1px 6px;font-weight:600}
.card .hdr .tag{padding:1px 6px;background:var(--upd-soft);color:var(--upd);border:1px solid var(--upd-line)}
.card .hdr .tag.flag{background:var(--flag-soft);color:var(--flag);border-color:transparent}
.stem{padding:16px 16px 6px;font-size:16.5px;line-height:1.55}
.stem p{margin:0 0 8px}
.stem p.st{padding-left:12px;border-left:3px solid var(--line);color:var(--ink)}
.opts{display:grid;gap:8px;padding:10px 16px 16px}
.opt{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;text-align:left;padding:10px 12px;border:1px solid var(--line);background:var(--sheet);cursor:pointer;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--mono);font-weight:600;text-transform:lowercase;width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--ink-3);font-size:13px}
.opt .mk{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;align-self:center}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.correct .mk{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.wrong .mk{color:var(--bad)}
.opt.dim{opacity:.62}

.stamp{margin-left:auto;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.14em;text-transform:uppercase;padding:0 10px;border:2px solid currentColor;transform:rotate(-4deg);pointer-events:none;animation:stamp .28s ease-out}
.stamp.ok{color:var(--good)}.stamp.no{color:var(--bad)}
@keyframes stamp{from{transform:rotate(-4deg) scale(1.7);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp{animation:none}.prog i{transition:none}}

.reveal{border-top:1px solid var(--line);padding:14px 16px 16px;display:grid;gap:14px}
.reveal h4{margin:0 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.reveal .exp p{margin:0}
.notes ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.notes li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.notes li::before{content:"\25B8";color:var(--accent);font-size:13px;line-height:1.55}
.box{padding:10px 12px;border:1px solid var(--upd-line);background:var(--upd-soft);color:var(--ink)}
.box h4{color:var(--upd)}
.box.flag{border-color:transparent;background:var(--flag-soft)}
.box.flag h4{color:var(--flag)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.nav .hint{font-size:12px;color:var(--ink-3);font-family:var(--mono)}

/* results */
.res{margin-top:22px;display:grid;gap:18px}
.score{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px}
.score .big{font-family:var(--display);font-size:72px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
.score .of{color:var(--ink-2)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--sheet);border:1px solid var(--line)}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;vertical-align:top}
.tbl th{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.tbl td.n{font-variant-numeric:tabular-nums;font-family:var(--mono);white-space:nowrap}
.tblwrap{overflow-x:auto}
details.miss{background:var(--sheet);border:1px solid var(--line);padding:10px 12px}
details.miss + details.miss{margin-top:6px}
details.miss summary{cursor:pointer;font-weight:500}
details.miss summary .mono{font-size:12px;color:var(--ink-3);margin-right:6px}
details.miss .body{margin-top:8px;display:grid;gap:6px;font-size:14px;color:var(--ink-2)}
details.miss .body b{color:var(--good)}
.empty-msg{padding:24px;text-align:center;color:var(--ink-2);background:var(--sheet);border:1px dashed var(--line);margin-top:18px}
@media (max-width:520px){
  .formline{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:1fr 1fr}
  .row{grid-template-columns:24px 1fr}
  .row .go{grid-column:2;justify-self:start}
  .stem{font-size:15.5px}
}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div class="startbar" id="startbar" hidden>
  <div class="in">
    <div class="sum" id="selsum"></div>
    <label class="mono" for="len" style="font-size:12px;color:var(--ink-3)">Items</label>
    <select id="len"><option value="0">All</option><option value="10">10</option><option value="25" selected>25</option><option value="50">50</option></select>
    <label class="mono" for="ord" style="font-size:12px;color:var(--ink-3)">Order</label>
    <select id="ord"><option value="shuffle">Shuffle</option><option value="syllabus">Syllabus order</option></select>
    <button class="btn" id="startsel">Start drill</button>
  </div>
</div>

<script>
const BANK = [{"id":"Q01-01","quiz":1,"num":1,"sec":"4.1","q":"The gross estate of the following decedents shall include all properties wherever situated, except which one?","opts":["Resident citizen","Resident alien","Nonresident citizen","Nonresident alien"],"ans":3,"exp":"Under Sec. 85, the gross estate of a citizen (resident or nonresident) or a resident alien includes all property, real or personal, tangible or intangible, wherever situated. Only a nonresident alien decedent is taxed on property situated in the Philippines alone. Choices a to c are all taxed on worldwide property.","notes":["Citizens (resident or not) and resident aliens: worldwide gross estate.","Nonresident alien: Philippine-situs property only; Philippine intangibles may be excluded under the reciprocity rule (Sec. 104).","Standard deduction: P5,000,000 for citizens and residents; P500,000 for nonresident aliens."],"upd":"","key":""},{"id":"Q01-02","quiz":1,"num":2,"sec":"4.1","q":"The gross estate of this decedent shall only be comprised of properties situated in the Philippines.","opts":["Filipino residing in the Philippines","American residing in the Philippines","Filipino residing in the US","American residing in the US"],"ans":3,"exp":"An American residing in the US is a nonresident alien, so only Philippine-situs property is included (Sec. 85). A Filipino, wherever residing, is taxed on worldwide property as a citizen, and an American residing in the Philippines is a resident alien, who is also taxed on worldwide property.","notes":["Citizenship or residence in the Philippines means a worldwide gross estate.","A nonresident citizen (Filipino abroad) is still taxed on worldwide property.","Only the nonresident alien is limited to Philippine-situs property."],"upd":"","key":""},{"id":"Q01-03","quiz":1,"num":3,"sec":"4.1","q":"When the reciprocity rule applies, the gross estate of a nonresident alien decedent shall not include which of the following properties?","opts":["Tangible personal properties in the Philippines","Real properties in the Philippines","Intangible personal properties in the Philippines","Intangible personal properties outside the Philippines"],"ans":2,"exp":"Under Sec. 104, intangible personal property in the Philippines of a nonresident alien is excluded if the decedent's country does not tax the intangibles of Filipinos not residing there, or grants a similar exemption. Reciprocity covers only intangibles; real and tangible personal property in the Philippines remain taxable. Property outside the Philippines (choice d) is never part of a nonresident alien's gross estate in the first place, so it is not what the reciprocity rule excludes.","notes":["Reciprocity applies only to nonresident alien decedents (or donors) and only to intangible personal property.","Two alternative tests: the foreign country imposes no transfer tax on intangibles of Filipinos not residing there, or it grants a similar exemption.","Real and tangible personal property in the Philippines are always taxed, reciprocity or not."],"upd":"","key":""},{"id":"Q01-04","quiz":1,"num":4,"sec":"4.1","q":"Which of the following is not included in the decedent's gross estate?","opts":["Extent of the decedent's interest in property","Transfer in contemplation of death","Revocable transfer","Property passing under a special power of appointment"],"ans":3,"exp":"Sec. 85(D) includes only property passing under a general power of appointment, where the decedent could appoint anyone, including himself or his estate. Property passing under a special (limited) power of appointment is excluded because the decedent could appoint only a restricted class. The decedent's interest, transfers in contemplation of death and revocable transfers are all included under Sec. 85(A) to (C).","notes":["General power of appointment (exercised by will, or by a transfer in contemplation of death or with retained rights): included.","Special or limited power of appointment: not included.","Transfers for less than adequate consideration: include only the excess of FMV at death over the consideration received (Sec. 85(G))."],"upd":"","key":""},{"id":"Q01-05","quiz":1,"num":5,"sec":"4.1","q":"Which of the following proceeds of life insurance shall not be included in the decedent's gross estate?","opts":["Proceeds of life insurance where the estate of the decedent is designated as revocable beneficiary","Proceeds of life insurance where the executor of the estate is designated as an irrevocable beneficiary","Proceeds of life insurance where the administrator is designated as beneficiary","Proceeds of life insurance where the son of the decedent is designated as irrevocable beneficiary"],"ans":3,"exp":"Under Sec. 85(E), proceeds of insurance taken out by the decedent on his own life are included if the beneficiary is the estate, executor or administrator (whether the designation is revocable or irrevocable), or a third person designated revocably. Only proceeds payable to a third person irrevocably designated, such as the son in choice d, are excluded.","notes":["Estate, executor or administrator as beneficiary: always included.","Third-party beneficiary: included if revocable; excluded if irrevocable.","SSS and GSIS benefits are exempt under their special laws."],"upd":"","key":""},{"id":"Q01-06","quiz":1,"num":6,"sec":"4.1","q":"Mr. Julian Cruz procured a life insurance on his own life. He designated his estate's executor as an irrevocable beneficiary. For estate tax purposes, the proceeds of the life insurance are:","opts":["included in the gross estate of Mr. Julian Cruz because when the executor of the estate is a beneficiary, the proceeds are included in the gross estate regardless of the designation.","not included in the gross estate of Mr. Julian Cruz because the designation of the beneficiary is irrevocable.","included in the gross estate of Mr. Julian Cruz because proceeds of life insurance are always subject to estate tax.","not included in the gross estate because, as a rule, proceeds of life insurance are generally not subject to estate tax."],"ans":0,"exp":"Sec. 85(E) includes the proceeds when the estate, executor or administrator is the beneficiary, whether the designation is revocable or irrevocable. The irrevocable-designation exclusion in choice b applies only to third-party beneficiaries. Choices c and d overstate the rule: proceeds are included or excluded depending on who the beneficiary is and how the beneficiary is designated.","notes":["Irrevocability matters only for third-party beneficiaries.","An executor or administrator as beneficiary is treated the same as the estate itself.","Trap: an 'irrevocable' designation does not exclude proceeds payable to the estate, executor or administrator."],"upd":"","key":""},{"id":"Q01-07","quiz":1,"num":7,"sec":"4.1","q":"One of the following is not an intangible personal property situated in the Philippines:","opts":["Shares, obligations or bonds issued by any corporation or sociedad anonima organized or constituted in the Philippines in accordance with its laws","Shares, obligations or bonds issued by any foreign corporation 85% of the business of which is located in the Philippines","Shares, obligations or bonds issued by any foreign corporation if such shares, obligations or bonds have acquired business situs in the Philippines","Shares, obligations or bonds issued by a nonresident foreign corporation"],"ans":3,"exp":"Sec. 104 treats as situated in the Philippines the shares, obligations or bonds of a domestic corporation, of a foreign corporation with at least 85% of its business in the Philippines, or of a foreign corporation whose securities have acquired business situs here. Securities of a nonresident foreign corporation that meet none of these tests are situated abroad. Choices a to c restate Sec. 104 almost word for word.","notes":["Other Philippine-situs intangibles: franchises exercised in the Philippines and shares or rights in any partnership, business or industry established in the Philippines.","The 85% test looks at the foreign corporation's business located in the Philippines.","Situs matters mainly for nonresident aliens, who are taxed only on Philippine-situs property."],"upd":"","key":""},{"id":"Q01-08","quiz":1,"num":8,"sec":"4.1","q":"The property comprising the gross estate shall be valued based on its:","opts":["historical cost at the time of death.","adjusted cost at the time of death.","value per Schedule of Market Values at the time of death.","book value at the time of death."],"ans":2,"exp":"Sec. 88 values the gross estate at fair market value at the time of death, not at cost or book value. For real property, FMV is the higher of the BIR zonal value or the FMV in the schedule of values fixed by the provincial and city assessors, so choice c is the only choice that reflects a market value at death.","notes":["Valuation date is the date of death, not the date of filing or distribution.","Real property: higher of zonal value or assessor's FMV.","Listed shares: mean of the highest and lowest quoted prices on the date of death; unlisted shares: adjusted net asset method (RR 20-2020)."],"upd":"RA 12001 (Real Property Valuation and Assessment Reform Act, 2024): the BLGF-approved Schedule of Market Values is to become the single valuation base for real property taxation, national taxes included; until new SMVs take effect, the higher of zonal value or assessor's FMV applies.","key":""},{"id":"Q01-09","quiz":1,"num":9,"sec":"4.1","q":"A property was transferred mortis causa (to take effect upon the transferor's death). The following data were gathered from the transaction:\nValue per Schedule of Market Values, time of transfer: P500,000\nValue per Schedule of Market Values, time of death: P300,000\nConsideration received when transferred: P350,000\nHow much shall be included in the gross estate?","opts":["P500,000","P300,000","P150,000","None of the choices"],"ans":3,"exp":"Under Sec. 85(G), a transfer taking effect at death made for less than adequate and full consideration is included only to the extent of the excess of the FMV at the time of death over the consideration received. Here the FMV at death (P300,000) is less than the P350,000 consideration, so there is no excess and nothing is included. P500,000 and P150,000 wrongly use the value at the time of transfer, and P300,000 ignores the consideration received.","notes":["Amount included = FMV at death less consideration received; if the consideration equals or exceeds FMV at death, include nothing.","Always use FMV at the time of death, not at the time of transfer.","The rule covers transfers in contemplation of death, revocable transfers, transfers taking effect at death and property under a general power of appointment."],"upd":"","key":""},{"id":"Q01-10","quiz":1,"num":10,"sec":"4.1","q":"Mr. X died. He was survived by his wife and children. The couple had exclusive and common properties. The gross estate of Mr. X would include:","opts":["common and capital properties.","common and paraphernal properties.","common, capital and paraphernal properties.","common properties only."],"ans":0,"exp":"The gross estate of a married decedent includes his exclusive (capital) property and the entire common property, from which the surviving spouse's share is later deducted. Capital property is the husband's exclusive property; paraphernal property is the wife's exclusive property, which belongs to the surviving spouse and is excluded under Sec. 85(H).","notes":["Capital = husband's exclusive property; paraphernal = wife's exclusive property.","Common (conjugal or community) property is included in full, then the surviving spouse's share (1/2 of the net common property) is deducted.","The surviving spouse's exclusive property is never part of the decedent's gross estate."],"upd":"","key":""},{"id":"Q01-11","quiz":1,"num":11,"sec":"4.1","q":"In the absence of a marriage settlement, or when the regime agreed upon is void, the property relations of spouses who married on or after August 3, 1988 shall be governed by:","opts":["conjugal partnership of gains.","absolute community of property.","complete separation of property.","none of the choices."],"ans":1,"exp":"Under Art. 75 of the Family Code (effective August 3, 1988), absolute community of property governs when there is no marriage settlement or the agreed regime is void. Conjugal partnership of gains is the default only for marriages before August 3, 1988 (Civil Code), and complete separation applies only if agreed upon or ordered by the court.","notes":["Married before Aug. 3, 1988 with no settlement: conjugal partnership of gains.","Married on or after Aug. 3, 1988 with no settlement: absolute community of property.","The regime determines which properties are common and which are exclusive in the gross estate."],"upd":"","key":""},{"id":"Q01-12","quiz":1,"num":12,"sec":"4.1","q":"Properties owned before marriage and brought into the marriage are generally classified as:\nI: conjugal properties under conjugal partnership of gains.\nII: exclusive properties under absolute community of property.","opts":["Only I is correct","Only II is correct","Both I and II are correct","Both I and II are incorrect"],"ans":3,"exp":"Both are reversed. Under conjugal partnership of gains, property brought into the marriage remains the exclusive property of each spouse (Art. 109(1)), so I is wrong. Under absolute community, all property owned at the time of the marriage generally becomes community property (Art. 91), subject to the exclusions in Art. 92, so II is wrong.","notes":["ACP: everything owned at marriage or acquired after is common, except the Art. 92 exclusions (gratuitous acquisitions, items for personal and exclusive use other than jewelry, property of a spouse with legitimate descendants from a prior marriage).","CPG: only fruits and gains during the marriage are common; property brought into the marriage stays exclusive.","Property acquired by gratuitous title (inheritance, donation) during the marriage is exclusive under both regimes."],"upd":"","key":""},{"id":"Q01-13","quiz":1,"num":13,"sec":"4.1","q":"A piece of land was acquired by one of the spouses. It cannot be determined if the property was acquired using common funds, but it was clearly acquired during the marriage. How would the property be classified for estate tax purposes?","opts":["Common property because property acquired during the marriage is presumed to belong to the community, unless it is proved that it is one of those excluded","Exclusive property because only one of the spouses acquired the property and the presumption favors exclusive treatment","Common property because property acquired during the marriage is always presumed to belong to the community","Either exclusive or common depending on the source of funds used to acquire it"],"ans":0,"exp":"Property acquired during the marriage is presumed to belong to the community (Art. 93) or to the conjugal partnership (Art. 116) unless it is proved to be exclusive. Choice c is wrong because the presumption is rebuttable, not absolute; choice b reverses the presumption; and choice d fails because the source of funds cannot be determined, which is exactly when the presumption applies.","notes":["The presumption of common ownership applies under both ACP (Art. 93) and CPG (Art. 116).","The presumption is disputable: clear proof of exclusive ownership overcomes it.","Registration in the name of only one spouse does not by itself make the property exclusive."],"upd":"","key":""},{"id":"Q01-14","quiz":1,"num":14,"sec":"4.1","q":"Estate taxation is governed by the statute in force at the time:","opts":["of death of the decedent.","the executor or administrator shall have qualified.","the return is filed.","the heirs are known."],"ans":0,"exp":"Succession opens at the moment of death, so the estate tax law in force at death governs (RR 2-2003, Sec. 3). The dates of qualification of the executor, filing of the return or determination of the heirs do not change the applicable law.","notes":["A decedent who died before Jan. 1, 2018 is taxed under the pre-TRAIN graduated rates, even if the return is filed today.","Deaths on or after Jan. 1, 2018: 6% flat rate under TRAIN.","Donor's tax counterpart: the law in force when the gift is completed governs."],"upd":"","key":""},{"id":"Q01-15","quiz":1,"num":15,"sec":"4.1","q":"Who of the following shall not be subject to Philippine estate tax?","opts":["An American citizen residing in the Philippines with real and personal properties situated in the USA","A Filipino citizen residing outside the Philippines with real properties situated in the Philippines","A Filipino citizen residing in the Philippines with personal properties situated outside the Philippines","A Canadian citizen residing in Canada with intangible properties situated in the Philippines, whose country does not impose transfer taxes"],"ans":3,"exp":"The Canadian residing in Canada is a nonresident alien, taxed only on Philippine-situs property, and his Philippine intangibles are excluded under the reciprocity rule (Sec. 104) because his country does not impose transfer taxes. The resident alien (choice a), the nonresident citizen (choice b) and the resident citizen (choice c) are taxed on property wherever situated, so each is subject to Philippine estate tax.","notes":["Resident alien, resident citizen and nonresident citizen: worldwide gross estate.","Nonresident alien with only Philippine intangibles, and reciprocity applies: nothing taxable.","Reciprocity never exempts real or tangible personal property in the Philippines."],"upd":"","key":""},{"id":"Q01-16","quiz":1,"num":16,"sec":"4.1","q":"Which of the following is not included in the gross estate of a resident decedent who is under conjugal partnership of gains?","opts":["Land inherited during the marriage from the father who predeceased the decedent","Car revocably transferred by the decedent before he died to his son","Shares of stock inherited by the decedent's surviving spouse during the marriage","Jewelry purchased during the marriage using the exclusive money of the decedent"],"ans":2,"exp":"Property acquired during the marriage by gratuitous title (inheritance) is the exclusive property of the spouse who received it (Art. 109(2)), so shares inherited by the surviving spouse belong to her and are excluded. Land inherited by the decedent (choice a) and jewelry bought with his exclusive money (choice d) are his exclusive property, and the revocable transfer (choice b) is included under Sec. 85(C).","notes":["CPG exclusive property (Art. 109): brought into the marriage, acquired by gratuitous title, acquired by redemption or exchange with exclusive property, purchased with exclusive money.","The decedent's exclusive property is included; the surviving spouse's exclusive property is not.","Revocable transfers are included at FMV at death."],"upd":"","key":""},{"id":"Q01-17","quiz":1,"num":17,"sec":"4.1","q":"Mr. Octavio Paz, who is 85 years old and has some health issues, transferred his properties to his relatives to provide independent income for them. This is an example of:","opts":["Transfer with retention or reservation of certain rights","Transfer passing under a general power of appointment","Transfer in contemplation of death","Transfer not in contemplation of death"],"ans":3,"exp":"A transfer is in contemplation of death only if the thought of death is the impelling motive. Providing independent income to relatives is a motive associated with life, so the transfer is not in contemplation of death despite the transferor's age and health. No rights were reserved (choice a) and no power of appointment is involved (choice b).","notes":["Test: the dominant motive, not the transferor's age or health alone.","Life-associated motives (support of relatives, relief from managing property, rewarding services) point to a transfer not in contemplation of death, taxable instead as a gift.","A transfer in contemplation of death is included in the gross estate at FMV at death, less any consideration received."],"upd":"","key":""},{"id":"Q01-18","quiz":1,"num":18,"sec":"4.1","q":"Which of the following proceeds shall be included in the taxable gross estate?","opts":["Insurance proceeds from SSS and GSIS","Amount receivable by any beneficiary irrevocably designated in the policy by the insured","Amount receivable by any beneficiary designated in the insurance policy","Proceeds of group insurance taken out by a company for its employees"],"ans":2,"exp":"Sec. 85(E) includes amounts receivable by any beneficiary designated in the policy, except when the designation is irrevocable, so choice c states the general rule of inclusion. SSS and GSIS benefits are exempt under their special laws, proceeds payable to irrevocably designated beneficiaries are excluded, and group insurance taken out by an employer for its employees is not included.","notes":["General rule: included, unless a third-party beneficiary is irrevocably designated.","Excluded: SSS and GSIS benefits, employer group insurance, and proceeds to irrevocable third-party beneficiaries.","Under the Insurance Code, a designation is revocable unless the insured expressly waived the right to change the beneficiary."],"upd":"","key":""},{"id":"Q01-19","quiz":1,"num":19,"sec":"4.1","q":"X, decedent, owned a property valued at P1,500,000 at the time of his death. X sold the property during his lifetime to Y for P700,000 when its value was P1,200,000. X and Y agreed that the transfer of ownership would take effect after X's death. For Philippine estate tax purposes, which of the following statements is correct?","opts":["The transaction is a transfer for inadequate consideration; hence, P800,000 shall be included in the gross estate.","The transaction is a bona fide sale for adequate consideration; hence, no amount shall be included in the gross estate.","The transaction is a transfer in contemplation of death; hence, P1,500,000 shall be included in the gross estate.","The transaction is a transfer for inadequate consideration; hence, P500,000 shall be included in the gross estate."],"ans":0,"exp":"A transfer taking effect at death for less than adequate consideration (P700,000 against a P1,200,000 value) is included to the extent of the excess of FMV at death over the consideration received: P1,500,000 less P700,000 equals P800,000 (Sec. 85(G)). It is not a bona fide sale for adequate consideration (choice b), the full P1,500,000 ignores the consideration (choice c), and P500,000 wrongly uses the value at the time of transfer (choice d).","notes":["Included amount = FMV at death less consideration received.","Adequacy of consideration is judged when the transfer is made; the amount included is measured at death.","A bona fide sale for adequate and full consideration is excluded entirely."],"upd":"","key":""},{"id":"Q01-20","quiz":1,"num":20,"sec":"4.1","q":"The deductible funeral expenses shall be the actual funeral expenses (whether paid or unpaid) up to the time of interment, or an amount equal to 5% of the gross estate, whichever is lower, but in no case to exceed:","opts":["P100,000.","P200,000.","P500,000.","None."],"ans":3,"exp":"TRAIN (RA 10963) deleted funeral expenses from the allowable deductions for decedents dying on or after January 1, 2018, so no amount is deductible. The stem describes the old rule, whose cap was P200,000 (choice b); that answer applies only to estates of decedents who died before 2018.","notes":["Deleted by TRAIN: funeral, judicial and medical expenses.","Ordinary deductions retained: claims against the estate, claims against insolvent persons, unpaid mortgages, unpaid taxes, casualty losses, vanishing deduction, transfers for public use.","Special deductions: standard deduction P5,000,000, family home up to P10,000,000, and amounts received under RA 4917."],"upd":"TRAIN: funeral expenses (old rule: lower of actual or 5% of gross estate, capped at P200,000) are no longer deductible for deaths on or after January 1, 2018.","key":""},{"id":"Q01-21","quiz":1,"num":21,"sec":"4.1","q":"Which of the following taxes is not deductible from the gross estate?","opts":["Income tax paid on income received before death","Property tax accrued prior to death","Estate tax paid to a foreign country","Donor's tax accrued prior to death"],"ans":2,"exp":"Only taxes accrued as of death and still unpaid at death are deductible (Sec. 86(A)(1)(d)), such as income tax on income received before death and property or donor's tax accrued before death. Estate tax paid to a foreign country is not a deduction at all; it is claimed as a tax credit against the Philippine estate tax by citizen and resident decedents (Sec. 86(E)). Also not deductible: income tax on income received after death, property tax not yet accrued at death, and the Philippine estate tax itself.","notes":["Deductible taxes: accrued before death and unpaid at death.","Foreign estate tax: tax credit (citizens and residents only), not a deduction.","Not deductible: income tax on income received after death, property tax not yet accrued at death, the estate tax itself."],"upd":"","key":"Choice a says 'paid'; a tax already paid before death is not deductible either, so read it as income tax accrued on income received before death and unpaid at death. Source key C is kept as the intended answer."},{"id":"Q01-22","quiz":1,"num":22,"sec":"4.1","q":"Which of the following statements is incorrect? A claim against an insolvent person, which is not collectible in full:","opts":["is included in the gross estate.","is not included in the taxable net estate.","must be notarized if arising out of a debt instrument of the insolvent.","needs no preliminary filing of a case against the insolvent."],"ans":2,"exp":"The notarization requirement applies to claims against the estate (the decedent's own debts), whose debt instrument must be notarized when the debt was incurred; it is not a requisite for claims against insolvent persons. A claim against an insolvent is first included in the gross estate and then deducted (Sec. 86(A)(1)(b)), so it does not remain in the net taxable estate; the debtor's incapacity to pay must be proven, but no prior court case is required.","notes":["Claim against an insolvent person: must first be included in the gross estate; only the uncollectible portion is deductible.","Claims against the estate: debt instrument notarized at the time the debt was incurred (except loans from financial institutions where notarization is not customary).","Claims against the estate must exist at death and be contracted in good faith for adequate consideration."],"upd":"","key":""},{"id":"Q01-23","quiz":1,"num":23,"sec":"4.1","q":"First statement: In case an unpaid mortgage payable is being claimed by the estate, verification must be made as to who was the beneficiary of the loan proceeds.\nSecond statement: If the loan is found to be merely an accommodation loan where the loan proceeds went to another person, the value of the unpaid loan must be included as a receivable of the estate.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both restate the regulations on unpaid mortgages (RR 2-2003, carried into RR 12-2018). The estate must show who benefited from the loan proceeds; if the decedent merely accommodated another person, the estate has a right of reimbursement, so the unpaid loan is deducted but also included in the gross estate as a receivable, which offsets the deduction.","notes":["An unpaid mortgage is deductible only if the decedent's interest in the property is included in the gross estate at its value undiminished by the mortgage.","Accommodation loan: deduct the loan, add a receivable from the real beneficiary.","Unpaid mortgages follow the same substantiation rules as claims against the estate."],"upd":"","key":""},{"id":"Q01-24","quiz":1,"num":24,"sec":"4.1","q":"A real property owned by the decedent was acquired for P1,000,000. Its fair market value was P1,500,000 at the time of the decedent's death. The property was mortgaged for P300,000, which remained unpaid at the time of death. For estate tax purposes, what value would be included in the gross estate of the decedent?","opts":["P1,000,000","P1,200,000","P1,500,000","None of the choices"],"ans":2,"exp":"The gross estate includes the property at its full FMV at death, P1,500,000, undiminished by the mortgage (Sec. 86(A)(1)(c)). The P300,000 unpaid mortgage is claimed separately as an ordinary deduction. P1,000,000 is historical cost, and P1,200,000 wrongly nets the mortgage against the property.","notes":["Gross estate: FMV at death, not cost.","Mortgaged property goes in at full value; the unpaid mortgage is a separate deduction.","Deducting a mortgage requires the property to be included at its undiminished value."],"upd":"","key":""},{"id":"Q01-25","quiz":1,"num":25,"sec":"4.1","q":"Which of the following taxes is not deductible from the gross estate?","opts":["Income tax paid on income received before death","Property tax accrued prior to death","Estate tax paid to a foreign country","Donor's tax accrued prior to death"],"ans":2,"exp":"Only taxes accrued as of death and still unpaid at death are deductible (Sec. 86(A)(1)(d)), such as income tax on income received before death and property or donor's tax accrued before death. Estate tax paid to a foreign country is not a deduction at all; it is claimed as a tax credit against the Philippine estate tax by citizen and resident decedents (Sec. 86(E)). Also not deductible: income tax on income received after death, property tax not yet accrued at death, and the Philippine estate tax itself.","notes":["Deductible taxes: accrued before death and unpaid at death.","Foreign estate tax: tax credit (citizens and residents only), not a deduction.","Not deductible: income tax on income received after death, property tax not yet accrued at death, the estate tax itself."],"upd":"","key":"Repeat of item 21 in the source quiz."},{"id":"Q01-26","quiz":1,"num":26,"sec":"4.1","q":"One of the following is not a requisite for the deduction of losses from the gross estate:","opts":["Losses are incurred during the settlement of the estate arising from fires, storms, shipwreck, or other casualties, or from robbery, theft or embezzlement.","Losses are not compensated for by insurance or otherwise.","Losses have been claimed as a deduction for income tax purposes in an income tax return.","Losses are incurred not later than the last day for the payment of the estate tax."],"ans":2,"exp":"Sec. 86(A)(1)(e) requires that the losses NOT have been claimed as an income tax deduction, to prevent a double deduction; choice c states the opposite. The other choices are genuine requisites: casualty, theft or embezzlement losses incurred during the settlement of the estate, not compensated by insurance, and incurred not later than the last day for paying the estate tax.","notes":["Losses must arise from casualty, robbery, theft or embezzlement during the settlement of the estate.","They must not be compensated by insurance and not claimed for income tax purposes.","They must occur not later than the last day for payment of the estate tax (generally one year from death)."],"upd":"","key":""},{"id":"Q01-27","quiz":1,"num":27,"sec":"4.1","q":"(Phil. CPA Modified) The following are the requisites for the vanishing deduction to be allowable, except one.","opts":["The estate tax of the prior succession must have been finally determined and paid.","The present decedent died within five (5) years from the date of death of the prior decedent.","The property with respect to which the deduction is sought can be identified as having been received by the present decedent from the prior decedent.","The property must have formed part of the gross estate situated outside the Philippines of the prior decedent."],"ans":3,"exp":"Sec. 86(A)(2) requires that the property formed part of the prior decedent's gross estate situated IN the Philippines (or was taxed as a gift), so choice d is the wrong statement. The other choices are real requisites: the prior estate (or donor's) tax was finally determined and paid, the present decedent died within five years from the prior transfer, and the property can be identified as the one received (or property acquired in exchange for it).","notes":["Vanishing percentage: 100% within 1 year; 80% more than 1 to 2 years; 60% more than 2 to 3; 40% more than 3 to 4; 20% more than 4 to 5.","No vanishing deduction if one was already allowed on the same property in the prior estate.","Base: lower of the value in the prior estate (or gift) and the value in the present estate, less any mortgage paid by the present decedent, less a pro rata share of other deductions."],"upd":"","key":""},{"id":"Q01-28","quiz":1,"num":28,"sec":"4.1","q":"First statement: An oral transfer to the National Government exclusively for public purposes to take effect after the decedent's death is deductible from the gross estate.\nSecond statement: In the case of nonresident alien decedents, the deduction for transfers for public purposes is allowed only when the property transferred is situated in the Philippines.","opts":["True, True","False, False","True, False","False, True"],"ans":3,"exp":"The deduction under Sec. 86(A)(3) covers bequests, legacies, devises or transfers to the Government for exclusively public purposes made through a valid disposition taking effect at death, so an oral transfer does not qualify (first statement false). For a nonresident alien, only Philippine-situs property is in the gross estate, so the deduction is allowed only for transferred property situated in the Philippines (second statement true).","notes":["Transfers for public use: only to the Government of the Philippines or its political subdivisions, for exclusively public purposes.","A transfer taking effect at death must follow the formalities of a will; an oral transfer is void.","Bequests to qualified social welfare, cultural and charitable institutions are exempt under Sec. 87(D) (not more than 30% used for administration)."],"upd":"","key":""},{"id":"Q01-29","quiz":1,"num":29,"sec":"4.1","q":"The actual residential home of the decedent and his family at the time of his death has a fair market value of P15,000,000. The family home is part of the common property of the spouses. How much is the family home deduction?","opts":["P15,000,000","P10,000,000","P7,500,000","P5,000,000"],"ans":2,"exp":"The family home deduction is the FMV of the decedent's interest in the family home, up to P10,000,000 (Sec. 86(A)(4)). Because the home is common property, only the decedent's 1/2 share (P7,500,000) is deductible, which is within the cap. P10,000,000 ignores the 1/2 rule, and P5,000,000 is the standard deduction.","notes":["Family home deduction: lower of the decedent's interest in the FMV or P10,000,000.","Common family home: only 1/2 of FMV counts; exclusive family home: full FMV up to P10,000,000.","Not allowed to nonresident alien decedents; the barangay captain must certify the property as the family home."],"upd":"TRAIN: the family home cap was raised from P1,000,000 to P10,000,000 for deaths on or after January 1, 2018.","key":""},{"id":"Q01-30","quiz":1,"num":30,"sec":"4.1","q":"How much is the allowable standard deduction for a resident or citizen decedent?","opts":["Ten Million Pesos (P10,000,000)","Five Million Pesos (P5,000,000)","Three Million Pesos (P3,000,000)","One Million Pesos (P1,000,000)"],"ans":1,"exp":"Under Sec. 86(A)(5) as amended by TRAIN, citizens and residents get a P5,000,000 standard deduction without substantiation. P10,000,000 is the family home cap, and P1,000,000 was the pre-TRAIN standard deduction.","notes":["Standard deduction: P5,000,000 (citizen or resident); P500,000 (nonresident alien).","No substantiation required.","Allowed in addition to the family home and ordinary deductions."],"upd":"TRAIN: the standard deduction was raised from P1,000,000 to P5,000,000 (nonresident alien: P500,000).","key":""},{"id":"Q01-31","quiz":1,"num":31,"sec":"4.1","q":"There shall be levied, assessed, collected and paid upon the transfer of the net estate of every decedent, whether resident or nonresident of the Philippines, a tax:","opts":["at the rate of six percent (6%) based on the value of such net estate.","at the rate of six percent (6%) based on the value of such gross estate.","at the rate of five percent (5%) based on the value of such net estate.","at six percent (6%) computed on the basis of the total net estate in excess of the Two hundred fifty thousand pesos (P250,000) exempt amount."],"ans":0,"exp":"Sec. 84 as amended by TRAIN imposes a flat 6% on the value of the net estate, not the gross estate. There is no 5% rate, and the P250,000 exemption belongs to donor's tax, not estate tax.","notes":["Estate tax: 6% of the net taxable estate (after deductions and the surviving spouse's share).","Donor's tax: 6% of net gifts in excess of P250,000 per calendar year.","Estate tax is an excise on the privilege of transmitting property at death."],"upd":"TRAIN: the 6% flat rate replaced the old graduated 5% to 20% rates for deaths on or after January 1, 2018.","key":""},{"id":"Q01-32","quiz":1,"num":32,"sec":"4.1","q":"The estate of the deceased consists of registered or registrable property for which a clearance from the Bureau of Internal Revenue is required as a condition precedent for the transfer of ownership in the name of the transferee. The value of the gross estate is P150,000 and the total deductions amount to P100,000. Is an estate tax return required to be filed?","opts":["Yes, an estate tax return is required regardless of the gross value of the estate, where the said estate consists of registered or registrable property.","No, an estate tax return is required only in cases of transfers subject to the tax.","Yes, an estate tax return is required in all cases without any exception.","No, an estate tax return is required only where, although the estate is exempt from tax, the gross value of the estate exceeds two hundred thousand pesos (P200,000)."],"ans":0,"exp":"Sec. 90(A) requires an estate tax return (1) in all transfers subject to estate tax, (2) where the estate is exempt but the gross estate exceeds P5,000,000, and (3) regardless of the gross value, where the estate includes registered or registrable property (real property, motor vehicles, shares) that needs a BIR clearance for transfer. The third case applies, so a return is required even for a P150,000 estate. Choice c overstates the rule, and choice d uses the pre-TRAIN P200,000 threshold.","notes":["Return required regardless of amount if the estate has registered or registrable property that needs an eCAR for transfer.","Exempt estate with a gross value over P5,000,000: return still required.","Gross estate over P5,000,000: the return must carry a CPA's certification."],"upd":"TRAIN: the gross-value threshold for exempt estates was raised from P200,000 to P5,000,000 (choice d uses the old figure).","key":""},{"id":"Q01-33","quiz":1,"num":33,"sec":"4.1","q":"When is the time for filing the estate tax return?","opts":["Thirty (30) days from the decedent's death","Two (2) months from the decedent's death","Six (6) months from the decedent's death","One (1) year from the decedent's death"],"ans":3,"exp":"Under Sec. 90(B) as amended by TRAIN, the estate tax return is filed within one year from the decedent's death. Six months (choice c) was the pre-TRAIN period, and the two-month period (choice b) was the old deadline for the notice of death, which TRAIN abolished.","notes":["Deadline: 1 year from death; the CIR may extend filing by up to 30 days in meritorious cases.","Extension of payment: up to 5 years (judicial settlement) or 2 years (extrajudicial settlement).","Installment payment within 2 years without civil penalty and interest if the estate's cash is insufficient."],"upd":"TRAIN: the filing period was extended from 6 months to 1 year from death, and the notice of death requirement was removed.","key":""},{"id":"Q01-34","quiz":1,"num":34,"sec":"4.1","q":"Can the filing of the estate tax return be extended by the Commissioner of Internal Revenue?","opts":["Yes, the Commissioner shall have authority to grant, in meritorious cases, a reasonable extension not exceeding sixty (60) days for filing the return.","Yes, the Commissioner shall have authority to grant, in meritorious cases, a reasonable extension not exceeding thirty (30) days for filing the return.","No, the Commissioner shall no longer be authorized to grant, even in meritorious cases, a reasonable extension for filing the return under the new provisions of the Tax Code.","No, the Commissioner cannot extend the filing of the estate tax return because only the Secretary of Finance can."],"ans":1,"exp":"Sec. 90(C) authorizes the CIR, in meritorious cases, to grant a reasonable extension not exceeding 30 days for filing the return. There is no 60-day extension, TRAIN did not remove the authority, and it belongs to the CIR, not the Secretary of Finance.","notes":["Filing extension: max 30 days (CIR, meritorious cases).","Payment extension (Sec. 91(B)): up to 5 years if judicial settlement, 2 years if extrajudicial, when immediate payment would impose undue hardship.","No payment extension when the tax is assessed because of negligence, intentional disregard of rules or fraud."],"upd":"","key":""},{"id":"Q01-35","quiz":1,"num":35,"sec":"4.1","q":"First statement: Except in cases where the Commissioner of Internal Revenue otherwise permits, the estate tax return shall be filed, either electronically or manually, with any authorized agent bank, Revenue District Office through a Revenue Collection Officer, or authorized tax software provider.\nSecond statement: In the case of a resident decedent, the estate tax return shall be filed with an authorized agent bank, Revenue District Officer, Collection Officer, or duly authorized Treasurer of the city or municipality where the decedent was domiciled at the time of death.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":2,"exp":"The first statement is Sec. 90(D) as amended by EOPT (RA 11976): the return may be filed and the tax paid anywhere, electronically or manually, with any authorized agent bank, any RDO through a Revenue Collection Officer, or an authorized tax software provider. The second statement is the old venue rule tied to the decedent's domicile, which EOPT replaced, so it is no longer correct.","notes":["EOPT file anywhere: any AAB, any RDO through a Revenue Collection Officer, or an authorized tax software provider.","The same rule applies to donor's tax returns (Sec. 103(B)).","Trap: a venue tied to domicile or to a city or municipal treasurer is the pre-EOPT rule."],"upd":"EOPT: the file-anywhere rule (RA 11976, effective January 22, 2024) replaced the old rule requiring filing where the decedent was domiciled.","key":""},{"id":"Q01-36","quiz":1,"num":36,"sec":"4.1","q":"First statement: In case the available cash of the estate is insufficient to pay the total estate tax due, payment by installment shall be allowed within two (2) years from the statutory date for its payment without civil penalty and interest.\nSecond statement: In case of lapse of two years without the payment of the entire tax due, the remaining balance shall be due and demandable, subject to the applicable penalties and interest reckoned from the prescribed deadline for filing the return and payment of the estate tax.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements restate Sec. 91(C) as added by TRAIN and RR 12-2018. If the estate's available cash is insufficient, the estate tax may be paid in installments within two years from the statutory payment date without civil penalty and interest; if the two years lapse without full payment, the unpaid balance becomes due and demandable with penalties and interest counted from the original deadline.","notes":["Installment: within 2 years from the statutory due date, with no civil penalty or interest.","After 2 years: the balance is due with penalties and interest from the original deadline.","TRAIN also allows withdrawals from the decedent's bank deposits, subject to a 6% final withholding tax (Sec. 97)."],"upd":"TRAIN: introduced payment by installment (Sec. 91(C)) for estates with insufficient cash.","key":""},{"id":"Q02-01","quiz":2,"num":1,"sec":"4.2","q":"Donor's tax is not:","opts":["a property tax.","a national tax.","a direct tax.","an excise tax."],"ans":0,"exp":"Donor's tax is an excise tax on the privilege of transferring property by gift during the donor's lifetime; it is not a tax on the property itself. It is also a national tax (imposed under the NIRC and collected by the BIR) and a direct tax, since the donor who is liable for it also bears it.","notes":["Nature: excise, national, direct.","Imposed on the donor, not the donee.","The law in force when the gift is completed governs."],"upd":"","key":""},{"id":"Q02-02","quiz":2,"num":2,"sec":"4.2","q":"First statement: The gross gifts of a donor who is a citizen or resident of the Philippines include all properties wherever situated.\nSecond statement: The gross gifts of a donor who is neither a citizen nor a resident of the Philippines include only properties situated in the Philippines.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Citizens (resident or not) and resident aliens are taxed on gifts of property wherever situated, while nonresident aliens are taxed only on gifts of property situated in the Philippines (Secs. 98 and 104). Both statements are therefore true, subject to the reciprocity rule on Philippine intangibles of nonresident aliens.","notes":["Worldwide gifts: resident citizen, nonresident citizen, resident alien.","Nonresident alien donor: Philippine-situs property only; reciprocity may exempt Philippine intangibles.","Rate for all donors: 6% of net gifts over P250,000 per calendar year."],"upd":"","key":""},{"id":"Q02-03","quiz":2,"num":3,"sec":"4.2","q":"A nonresident citizen donor is taxed on his donation of properties:","opts":["situated in the Philippines only.","wherever situated.","situated outside the Philippines only.","situated in the Philippines only, subject to the rule of reciprocity."],"ans":1,"exp":"A nonresident citizen is still a citizen, so gifts of property wherever situated are subject to donor's tax. Choices a and d describe a nonresident alien donor, and choice c is never the rule.","notes":["Citizenship alone triggers worldwide taxation for donor's and estate tax.","Reciprocity applies only to nonresident aliens.","Citizens and residents may credit donor's tax paid to a foreign country, subject to limits (Sec. 101(C))."],"upd":"","key":""},{"id":"Q02-04","quiz":2,"num":4,"sec":"4.2","q":"First statement: In all cases, void donations are not subject to donor's tax.\nSecond statement: Every donation between the spouses during the marriage shall be void.","opts":["Both statements are true.","Both statements are false.","First statement is true while second statement is false.","First statement is false while second statement is true."],"ans":2,"exp":"A void donation transfers nothing, so there is no completed gift on which donor's tax can attach; the first statement is true. The second is false because Art. 87 of the Family Code voids donations between spouses during the marriage except moderate gifts on the occasion of any family rejoicing.","notes":["Art. 87: donations between spouses during the marriage are void, except moderate gifts on family rejoicing; the rule also covers couples living together without a valid marriage.","No completed gift, no donor's tax.","Trap: 'every donation' ignores the moderate-gift exception."],"upd":"","key":""},{"id":"Q02-05","quiz":2,"num":5,"sec":"4.2","q":"First statement: Donor's tax shall be levied, assessed, collected and paid upon the transfer of property by any person, resident or nonresident, as a gift.\nSecond statement: The donor's tax shall apply whether the transfer is in trust or otherwise, whether the gift is direct or indirect, and whether the property is real or personal, tangible or intangible.","opts":["True, True","False, False","True, False","False, True"],"ans":0,"exp":"Both statements quote Sec. 98(A) and (B) of the NIRC. Donor's tax reaches every gratuitous transfer by any person, resident or nonresident, whether direct or indirect, in trust or otherwise, and whether the property is real or personal, tangible or intangible.","notes":["Indirect gifts (e.g., condonation of a debt, payment of another person's obligation) are covered.","The tax applies only to completed gifts.","Real property capital assets sold below FMV are covered by capital gains tax, not treated as deemed gifts (Sec. 100)."],"upd":"","key":""},{"id":"Q02-06","quiz":2,"num":6,"sec":"4.2","q":"When the donor intends that the donation shall take effect during the lifetime of the donor, though the property shall not be delivered till after the donor's death, this shall be a:","opts":["donation mortis causa.","donation inter vivos.","donation propter nuptias.","none of the choices."],"ans":1,"exp":"Art. 729 of the Civil Code treats such a donation as inter vivos because the donor intends ownership to pass during his lifetime; postponing delivery until death does not make it mortis causa. A donation mortis causa transfers ownership only at death and must follow the formalities of a will, and a donation propter nuptias is one made by reason of marriage.","notes":["Inter vivos: takes effect during the donor's life; subject to donor's tax.","Mortis causa: takes effect at death; subject to estate tax.","The donor's intent governs, not the time of delivery."],"upd":"","key":""},{"id":"Q02-07","quiz":2,"num":7,"sec":"4.2","q":"When is the donation completed?","opts":["The moment the donor knows of the acceptance by the donee","The moment the thing donated is delivered, either actually or constructively, to the donee","Upon payment of the donor's tax","Upon execution of the deed of donation"],"ans":1,"exp":"A donation is perfected when the donor knows of the donee's acceptance (choice a), but it is completed by the actual or constructive delivery of the property to the donee (RR 2-2003, Sec. 11). Donor's tax attaches only to a completed gift; payment of the tax (choice c) and execution of the deed (choice d) do not complete it.","notes":["Perfection: donor learns of the acceptance. Completion: delivery.","The donor's tax return is due within 30 days after the gift is made (completed).","The law in force at completion governs the tax."],"upd":"","key":""},{"id":"Q02-08","quiz":2,"num":8,"sec":"4.2","q":"(Phil. CPA) The following are the requisites of a donation for purposes of the donor's tax, except one.","opts":["Capacity of the donor","Capacity of the donee","Delivery of the subject matter or gift","Donative intent"],"ans":1,"exp":"For donor's tax purposes, the requisites are capacity of the donor, donative intent, delivery (actual or constructive) of the gift, and acceptance by the donee. Capacity of the donee is not a requisite: the Civil Code allows donations to anyone not specially disqualified, and minors or incapacitated persons may accept through their parents or legal representatives (Art. 741).","notes":["Requisites: capacity of the donor, donative intent, delivery, acceptance by the donee.","The donor's capacity is determined at the time the donation is made.","A transfer without donative intent (e.g., a bona fide business transfer) is not a gift."],"upd":"","key":""},{"id":"Q02-09","quiz":2,"num":9,"sec":"4.2","q":"Which of the following donations inter vivos does not have to be made in writing?","opts":["Donation of personal (movable) property, the value of which exceeds P5,000","Donation of personal (movable) property, the value of which is P5,000","Donation of real (immovable) property, the value of which is less than P5,000","Donation of real (immovable) property, the value of which exceeds P5,000"],"ans":1,"exp":"Under Art. 748, a donation of movable property may be made orally with simultaneous delivery, unless its value exceeds P5,000, in which case the donation and acceptance must be in writing. A movable worth exactly P5,000 does not exceed the limit, so it may be oral. Donations of immovable property must always be in a public instrument regardless of value (Art. 749).","notes":["Movables over P5,000: donation and acceptance in writing.","Movables of P5,000 or less: may be oral with simultaneous delivery.","Immovables: public instrument, with acceptance in the same deed or a separate public instrument, regardless of value."],"upd":"","key":""},{"id":"Q02-10","quiz":2,"num":10,"sec":"4.2","q":"Motivated by love, Mr. D donated a car to his brothers, Mr. E and Mr. F: the naked title to Mr. E and the usufruct to Mr. F for one year. Is the transfer of the car, naked title to Mr. E and usufruct to Mr. F, a valid donation?","opts":["Yes, the transfer of the naked title to E and the usufruct to F is a valid donation, provided all the donees are living at the time of the donation.","No, the donation is not valid because it is specifically provided in the Civil Code that such a donation is not allowed.","Yes, the donation is valid provided that Mr. E agrees to the donation of the usufruct to Mr. F.","No, the donation is not valid because a right (usufruct) cannot be donated."],"ans":0,"exp":"Art. 756 of the Civil Code allows the ownership of property to be donated to one person and the usufruct to another, provided all the donees are living at the time of the donation. A usufruct can be donated (choice d is wrong), the law expressly allows the arrangement (choice b is wrong), and the naked owner's consent is not required (choice c is wrong).","notes":["Naked title and usufruct may go to different donees, as long as all are alive at the time of the donation.","The form rules still apply: a movable worth over P5,000 needs a written donation and acceptance.","Gifts to relatives and strangers are taxed alike at 6% since TRAIN."],"upd":"","key":""},{"id":"Q02-11","quiz":2,"num":11,"sec":"4.2","q":"Mrs. Jane Contreras survived her husband, who died recently. She decided to renounce her share in the conjugal partnership in favor of the heirs of her husband. She approached you to inquire whether such renunciation shall be subject to tax. What will your answer be?","opts":["The renunciation shall not be subject to any tax.","The renunciation shall be subject to estate tax.","The renunciation shall be subject to donor's tax.","The renunciation shall be subject to income tax."],"ans":2,"exp":"Renunciation by the surviving spouse of his or her share in the conjugal partnership or absolute community after the marriage is dissolved, in favor of the heirs of the deceased spouse or any other person, is a gift subject to donor's tax (RR 2-2003, Sec. 11). The share already belongs to the surviving spouse, so giving it up is her own gratuitous transfer, not part of the decedent's estate.","notes":["Renunciation of the surviving spouse's share: subject to donor's tax.","General renunciation of an inheritance by an heir (not in favor of anyone in particular): not subject to donor's tax.","Renunciation in favor of an identified heir or person: subject to donor's tax."],"upd":"","key":""},{"id":"Q02-12","quiz":2,"num":12,"sec":"4.2","q":"John transfers his car to his brother Samuel for a consideration of P400,000. The car cost P500,000. At the time of the transfer, the car has a fair market value of P300,000. John asks you whether he is required to file a donor's tax return and pay donor's tax. What will you tell him?","opts":["He has to file a donor's tax return because the transfer will be considered a transfer for insufficient consideration, since the selling price is less than the cost.","He does not have to file a return because it is a transfer for sufficient consideration; hence, no donor's tax is due.","He has to file a donor's tax return and pay donor's tax because transfers to relatives are generally subject to donor's tax.","He does not have to file a return because the BIR will not be in a position to know of the transfer, as it is done between brothers."],"ans":1,"exp":"Under Sec. 100, a deemed gift arises only when property (other than real property subject to capital gains tax) is transferred for less than adequate consideration, and the gift is the excess of FMV over the consideration. The P400,000 price exceeds the P300,000 FMV, so there is no gift and no return is needed. Cost is irrelevant (choice a), and a relationship between the parties does not turn a sale into a gift (choice c).","notes":["Deemed gift = FMV at transfer less consideration received, if positive.","Compare the price with FMV, not with cost.","Real property capital assets sold below FMV: 6% CGT on the higher of price or FMV, no donor's tax."],"upd":"","key":""},{"id":"Q02-13","quiz":2,"num":13,"sec":"4.2","q":"A sale, exchange, or other transfer of property made in the ordinary course of business (a transaction which is bona fide, at arm's length, and free from any donative intent):","opts":["will be considered as made for an adequate and full consideration in money or money's worth and not subject to donor's tax.","will not be considered as made for an adequate and full consideration in money or money's worth and subject to donor's tax.","will be considered as made for an adequate and full consideration in money or money's worth but considered a deemed gift subject to donor's tax.","will not be considered as made for an adequate and full consideration in money or money's worth and not subject to donor's tax."],"ans":0,"exp":"The TRAIN proviso in Sec. 100 treats a sale, exchange or other transfer made in the ordinary course of business (bona fide, at arm's length and free from donative intent) as made for adequate and full consideration. Such a transfer is therefore not subject to donor's tax even if the price is below FMV. Choices b to d contradict the proviso.","notes":["Bona fide, arm's length, no donative intent: no deemed gift.","Outside the ordinary course of business, the excess of FMV over consideration is a deemed gift.","Real property capital assets are covered by CGT, not donor's tax."],"upd":"TRAIN: the ordinary-course-of-business proviso was added to Sec. 100 effective January 1, 2018.","key":""},{"id":"Q02-14","quiz":2,"num":14,"sec":"4.2","q":"A client who is planning to transfer a substantial amount to his alma mater wants to know if there is a way for him not to pay any tax on the transfer. His alma mater is a non-stock, non-profit institution whose administration expenses do not exceed 30% of the gifts received. What advice will you give him?","opts":["He has to transfer the amount inter vivos because such transfer is deductible from the gross gifts.","He has to transfer the amount mortis causa because such transfer is deductible from the gross estate.","He cannot escape the payment of donor's tax because donations are always subject to donor's tax.","He can escape the payment of donor's tax by not reporting the transfer of the substantial amount to his alma mater to the BIR."],"ans":0,"exp":"Sec. 101(A)(3) exempts gifts to non-profit educational, charitable, religious, cultural or social welfare institutions, accredited NGOs, trusts, and philanthropic or research organizations, provided not more than 30% of the gifts is used for administration. The alma mater qualifies, so an inter vivos gift is excluded from taxable gifts. Choice b fails because the estate tax deduction for transfers for public use covers only transfers to the Government (Sec. 86(A)(3)); choice c is wrong because exempt gifts exist; and choice d is tax evasion.","notes":["Exempt gifts also include gifts to the National Government, its non-profit entities and political subdivisions.","The donee must be non-stock and non-profit, with no part of its net income inuring to any individual.","30% test: not more than 30% of the gifts may be used for administration purposes."],"upd":"","key":""},{"id":"Q02-15","quiz":2,"num":15,"sec":"4.2","q":"When an indebtedness is cancelled without any service rendered by the debtor in favor of the creditor, the forgiveness of debt will result in:","opts":["taxable income.","distribution of dividend.","taxable indirect donation.","taxable estate."],"ans":2,"exp":"When a creditor cancels a debt without any service from the debtor and out of generosity, the forgiveness is an indirect gift subject to donor's tax (RR 2, Sec. 50). If the debt is cancelled in exchange for services, it is compensation (taxable income), and if a corporation cancels a shareholder's debt, it may be a dividend.","notes":["Condonation for services rendered: taxable income of the debtor.","Condonation with donative intent: gift subject to donor's tax.","Corporate creditor forgiving a shareholder's debt: constructive dividend."],"upd":"","key":""},{"id":"Q02-16","quiz":2,"num":16,"sec":"4.2","q":"Which of the following is not a deduction from the gross gifts?","opts":["Unpaid mortgage on the donated property assumed by the donee","Unpaid real estate tax on the donated property assumed by the donee","Diminution of the donated property specifically provided by the donor","Unpaid donor's tax on the donated property assumed by the donee"],"ans":3,"exp":"Deductions from gross gifts include encumbrances or mortgages on the donated property assumed by the donee and diminutions of the gift specifically provided by the donor (RR 2-2003, Sec. 11); unpaid real estate tax assumed by the donee is likewise an encumbrance on the property. The donor's tax is the donor's own obligation, so its assumption by the donee is not deducted.","notes":["Deductible: mortgage or encumbrance assumed by the donee; diminution specified by the donor.","Not deductible: donor's tax, even if the donee pays it.","Exempt gifts (Sec. 101) are also excluded from taxable gifts."],"upd":"","key":""},{"id":"Q02-17","quiz":2,"num":17,"sec":"4.2","q":"The amount of the exempt dowry is to the extent of the first:","opts":["P32,000.","P25,000.","P10,000.","None."],"ans":3,"exp":"TRAIN deleted the dowry exemption from Sec. 101(A)(1), so gifts on account of marriage are now fully included in gross gifts, with only the general P250,000 annual exemption applying. P10,000 (choice c) was the pre-TRAIN exemption for gifts on account of marriage by parents to each legitimate, recognized natural or adopted child.","notes":["Current exempt amount: first P250,000 of total net gifts per calendar year, whoever the donee.","No more distinction between relatives and strangers.","Dowries now count as ordinary gifts."],"upd":"TRAIN: the P10,000 dowry exemption was repealed for gifts made on or after January 1, 2018.","key":""},{"id":"Q02-18","quiz":2,"num":18,"sec":"4.2","q":"LA Corporation donated P1,000,000 to a government agency which was created to generate profit for the government. The agency's total expenses amounted to P15,000,000, 30% of which were for administrative purposes. How much was the exempt gift?","opts":["P4,500,000","P3,000,000","P1,000,000","None of the choices"],"ans":3,"exp":"Sec. 101(A)(2) exempts gifts to the National Government, to any entity created by its agencies that is not conducted for profit, or to any political subdivision. An agency created to generate profit does not
