ate of collection.","five (5) banking days from the date of collection."],"ans":3,"exp":"Sec. 127(A) requires the stockbroker who effected the sale to collect the stock transaction tax and remit it within 5 banking days from the date of collection. Choice c is a trap: the period is counted in banking days, not calendar days.","notes":["STT remittance: within 5 banking days from collection.","Stockbrokers submit a return of the tax collected.","The seller is the one liable; the broker is the collecting agent."],"upd":"","key":""},{"id":"Q04-28","quiz":4,"num":28,"sec":"5.2","q":"Every person subject to the percentage taxes imposed shall file, either electronically or manually, a quarterly return of the amount of the person's gross sales or earnings and pay, either electronically or manually, the tax due thereon within:","opts":["twenty (20) days after the end of each taxable month.","twenty-five (25) days after the end of each taxable month.","twenty (20) days after the end of each taxable quarter.","twenty-five (25) days after the end of each taxable quarter."],"ans":3,"exp":"Sec. 128(A)(1), as amended by EOPT, requires the quarterly percentage tax return to be filed and the tax paid within 25 days after the end of each taxable quarter. Monthly filing (a, b) is no longer required for percentage taxes.","notes":["BIR Form 2551Q: within 25 days after the end of each taxable quarter.","Returns may be filed and taxes paid electronically or manually with any AAB, RDO (through a Revenue Collection Officer), or authorized tax software provider.","Specific sections with their own deadlines (e.g., Secs. 120, 125, 126, 127) are exam traps."],"upd":"EOPT: filing and payment may be done electronically or manually, anywhere (file anywhere rule).","key":""},{"id":"Q04-29","quiz":4,"num":29,"sec":"5.2","q":"Any person retiring from a business subject to percentage tax shall notify the nearest internal revenue officer, file, either electronically or manually, the person's return and pay, either electronically or manually, the tax due thereon within:","opts":["ten (10) days after closing his business.","fifteen (15) days after closing his business.","twenty (20) days after closing his business.","twenty-five (25) days after closing his business."],"ans":2,"exp":"Under Sec. 128(A)(1), a person retiring from a business subject to percentage tax must notify the nearest internal revenue officer, file the return and pay the tax within 20 days after closing the business. The 25-day period in choice d applies to regular quarterly returns, not retirement.","notes":["Retirement from business subject to percentage tax: 20 days after closing.","Regular quarterly percentage tax return: 25 days after end of quarter."],"upd":"","key":""},{"id":"Q04-30","quiz":4,"num":30,"sec":"5.2","q":"Except as the Commissioner otherwise permits, every person liable to percentage tax shall file, either electronically or manually, a consolidated return for all branches or places of business with:","opts":["an authorized agent bank.","the Revenue District Office through a Revenue Collection Officer.","an authorized tax software provider.","any of the above."],"ans":3,"exp":"Under EOPT's \"file anywhere\" rule, returns may be filed and taxes paid with any authorized agent bank, Revenue District Office through a Revenue Collection Officer, or authorized tax software provider. A consolidated return covers all branches, and any of these channels may be used.","notes":["File anywhere (EOPT): AAB, RDO through RCO, or authorized tax software provider.","One consolidated percentage tax return covers all branches.","Electronic or manual filing and payment are both allowed."],"upd":"EOPT: replaced the old rule requiring filing with the AAB or RDO having jurisdiction over the taxpayer's principal place of business.","key":""},{"id":"Q04-31","quiz":4,"num":31,"sec":"5.3","q":"A senior citizen is engaged in the sale of VATable goods. His gross annual sales, however, do not exceed the VAT threshold and he is not VAT-registered. During the first quarter of 2024, his gross sales amounted to P250,000. How much is the business tax due, if any?","opts":["P7,500","P5,000","P2,500","None, senior citizens are exempt from business taxes"],"ans":0,"exp":"RA 9994 privileges (discounts and VAT exemption) apply to a senior citizen's purchases, not to the senior citizen's own business, so being a senior citizen does not exempt him from business taxes. As a non-VAT seller below the threshold, he pays 3% percentage tax under Sec. 116: P250,000 x 3% = P7,500. Choice c (P2,500) uses the 1% CREATE rate, which ended June 30, 2023.","notes":["Senior citizen status does not exempt the senior citizen's own business sales from business tax.","Sec. 116 rate: 3% (1% only from July 1, 2020 to June 30, 2023).","If he elected the 8% income tax option, he would be exempt from the 3% percentage tax."],"upd":"","key":""},{"id":"Q05-01","quiz":5,"num":1,"sec":"7","q":"These apply to goods manufactured or produced in the Philippines for domestic sale or consumption or for any other disposition, to things imported, and to services performed in the Philippines, and are imposed in addition to the value-added tax.","opts":["Excise taxes","Income taxes","Documentary stamp taxes","Percentage taxes"],"ans":0,"exp":"Sec. 129 of the NIRC describes excise taxes as taxes on goods produced in the Philippines for domestic sale, consumption or other disposition, on things imported and (since TRAIN) on services performed in the Philippines, imposed in addition to VAT. Percentage taxes are generally imposed in lieu of VAT on non-VAT persons, DST is a tax on documents, and income tax is a tax on income, not on goods.","notes":["Excise tax is imposed IN ADDITION to VAT (Sec. 129); percentage tax is generally IN LIEU of VAT.","Excise on services: invasive cosmetic procedures at 5% of gross receipts net of VAT (Sec. 150-A, TRAIN).","Two kinds: specific tax (per physical unit) and ad valorem tax (based on value)."],"upd":"","key":""},{"id":"Q05-02","quiz":5,"num":2,"sec":"7","q":"Excise tax is:","opts":["an indirect tax.","a direct tax.","a special tax.","a proportional tax."],"ans":0,"exp":"Excise tax is an indirect tax: the law makes the manufacturer, producer or importer statutorily liable, but the burden is shifted to buyers as part of the price. A direct tax (such as income tax) is paid by the person on whom it is imposed and cannot be shifted. It is not purely proportional either, because specific taxes are fixed amounts per unit regardless of value.","notes":["Statutory taxpayer: manufacturer/producer (domestic goods) or owner/importer (imported goods).","Economic burden is passed on to the buyer or consumer.","Only ad valorem excise taxes behave like proportional taxes; specific taxes are fixed per unit."],"upd":"","key":""},{"id":"Q05-03","quiz":5,"num":3,"sec":"7","q":"Who shall be statutorily liable to pay the excise tax before removal of domestic products from the place of production?","opts":["Buyer","Seller","Consumer","None of the choices"],"ans":1,"exp":"Under Sec. 130(A), the manufacturer or producer (the seller) files the return and pays the excise tax before removal of domestic products from the place of production. The buyer and consumer may bear the tax economically because it is passed on in the price, but they are not the statutory taxpayers.","notes":["Domestic products: manufacturer or producer pays BEFORE removal from the place of production.","Imported articles: owner or importer pays before release from the customs house (Sec. 131).","Products removed without payment: the owner or person in possession is liable."],"upd":"","key":""},{"id":"Q05-04","quiz":5,"num":4,"sec":"7","q":"Excise taxes may apply to:\nI - goods manufactured or produced in the Philippines for domestic sale or consumption or for any other disposition,\nII - things imported, as well as\nIII - services rendered in the Philippines","opts":["I, II and III","I and II only","I and III only","I only"],"ans":0,"exp":"Sec. 129, as amended by TRAIN, extends excise taxes to all three: domestic goods, imported things and services performed in the Philippines. The service covered is invasive cosmetic procedures (Sec. 150-A), so any choice omitting II or III is incomplete.","notes":["Coverage: domestic goods, imported goods, and (since TRAIN) services performed in the Philippines.","The only excise on services is on invasive cosmetic procedures (5%).","Imported goods pay the same rates and bases as locally manufactured goods unless otherwise specified."],"upd":"","key":""},{"id":"Q05-05","quiz":5,"num":5,"sec":"7","q":"Statement I: Specific tax is an excise tax imposed and based on weight or volume capacity or any other physical unit of measurement.\nStatement II: Ad valorem tax is an excise tax imposed and based on the selling price or other specified value of the good.","opts":["Both statements are true","Both statements are false","Only the first statement is true","Only the second statement is true"],"ans":0,"exp":"Both are the definitions in Sec. 129. A specific tax is computed per unit (per liter, per kilogram, per pack), while an ad valorem tax is computed as a percentage of the selling price or other specified value.","notes":["Specific: per physical unit (e.g., gasoline per liter, LPG per kilogram, cigarettes per pack).","Ad valorem: based on value (e.g., automobiles, jewelry, non-essential services).","Some products carry both (cigars; distilled spirits)."],"upd":"","key":""},{"id":"Q05-06","quiz":5,"num":6,"sec":"7","q":"All the following are specific excise taxes, except:","opts":["Excise tax on cigarettes packed by hand","Excise tax on cigarettes packed by machine","Excise tax on petroleum products","Excise tax on alcoholic products"],"ans":3,"exp":"Cigarettes, whether packed by hand or by machine, pay a unitary specific tax per pack, and petroleum products pay specific taxes per liter or kilogram. Alcohol products are the exception because distilled spirits carry both an ad valorem tax (22% of the net retail price) and a specific tax per proof liter (Sec. 141), so the category is not purely specific. Wines and fermented liquors are taxed on a specific basis only.","notes":["Distilled spirits: 22% of net retail price (ad valorem) PLUS specific tax per proof liter.","Wines and fermented liquors (beer): specific tax per liter only.","Cigarettes (hand or machine packed): specific tax per pack; cigars: ad valorem plus specific."],"upd":"","key":""},{"id":"Q05-07","quiz":5,"num":7,"sec":"7","q":"All the following are ad valorem excise taxes, except:","opts":["Excise tax on cigars","Excise tax on automobiles","Excise tax on non-essential services","Excise tax on sweetened beverages"],"ans":3,"exp":"Sweetened beverages are taxed on a specific basis, per liter of volume capacity (P6 or P12 per liter, Sec. 150-B). Cigars have an ad valorem component (20% of the net retail price) plus a specific tax per cigar, automobiles are taxed at percentages of the manufacturer's or importer's selling price, and invasive cosmetic procedures are taxed at 5% of gross receipts.","notes":["Sweetened beverages: P6 per liter (caloric/non-caloric/mix) or P12 per liter (HFCS).","Automobiles (TRAIN): 4%, 10%, 20% or 50% of the net manufacturer's/importer's selling price.","Non-essential services: 5% of gross receipts, net of VAT."],"upd":"","key":""},{"id":"Q05-08","quiz":5,"num":8,"sec":"7","q":"Every person liable to pay excise tax shall file a separate return for each place of production setting forth, among others:\nI - the description and quantity or volume of products to be removed,\nII - the applicable tax base and the amount of tax due thereon.","opts":["Both I and II","Neither I nor II","I only","II only"],"ans":0,"exp":"Sec. 130(A)(1) requires a separate return for each place of production stating, among others, the description and quantity or volume of products to be removed, the applicable tax base and the amount of tax due. Both items are required contents of the return.","notes":["One return per place of production.","Contents include description, quantity/volume, tax base and tax due.","Return is filed and tax paid before removal of the products."],"upd":"","key":""},{"id":"Q05-09","quiz":5,"num":9,"sec":"7","q":"In the case of indigenous petroleum, natural gas or liquefied natural gas, the excise tax shall be paid by:","opts":["the first buyer.","the purchaser.","the transferee for local sale, barter or transfer.","any of the above."],"ans":3,"exp":"Sec. 130(A) provides that the excise tax on indigenous petroleum, natural gas or liquefied natural gas is paid by the first buyer, purchaser or transferee for local sale, barter or transfer. All three are named, so the answer is any of the above.","notes":["Indigenous petroleum/natural gas/LNG: first buyer, purchaser or transferee for local sale, barter or transfer.","Exported mineral products: owner, lessee, concessionaire or operator of the mining claim.","Locally extracted minerals: tax paid within 15 days after the end of the calendar quarter of removal."],"upd":"","key":""},{"id":"Q05-10","quiz":5,"num":10,"sec":"7","q":"First statement: On exported products, excise tax shall be paid by the owner, lessee, concessionaire or operator of the mining claim.\nSecond statement: If domestic products are removed from the place of production without the payment of the excise tax, the owner or person having possession thereof shall be liable for the tax due thereon.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both restate Sec. 130(A). For exported mineral products, the owner, lessee, concessionaire or operator of the mining claim pays the excise tax, and when domestic products are removed without payment, the owner or person in possession becomes liable.","notes":["Exported minerals: paid by the owner, lessee, concessionaire or operator of the mining claim.","Removal without payment: owner or possessor is liable.","Mineral excise is not refundable on export, except for coal and coke."],"upd":"","key":""},{"id":"Q05-11","quiz":5,"num":11,"sec":"7","q":"Unless otherwise specifically allowed, the return shall be filed and the excise tax paid by the manufacturer or producer:","opts":["before removal of domestic products from the place of production.","within 15 days after removal of domestic products from the place of production.","within 30 days after removal of domestic products from the place of production.","after the products are actually sold."],"ans":0,"exp":"Sec. 130(A)(2) sets the general rule: the return is filed and the excise tax paid before removal of domestic products from the place of production. The 15-day period applies to locally extracted natural resources (within 15 days after the end of the calendar quarter of removal), not to manufactured goods, and the tax is not deferred until actual sale.","notes":["General rule: pay BEFORE removal from the place of production.","Minerals: within 15 days after the end of the calendar quarter when removed.","Imported articles: before release from the customs house."],"upd":"","key":""},{"id":"Q05-12","quiz":5,"num":12,"sec":"7","q":"First statement: Unless otherwise provided, the price, excluding the value-added tax, at which the goods are sold at wholesale in the place of production or through their sales agents to the public shall constitute the gross selling price.\nSecond statement: If the manufacturer also sells or allows such goods to be sold at wholesale in another establishment of which he is the owner or in the profits of which he has an interest, the wholesale price in such establishment shall constitute the gross selling price.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both statements are the rules on determining the gross selling price of goods subject to ad valorem tax (Sec. 130(A)(4)). The base is the wholesale price excluding VAT, and if the manufacturer sells through another establishment it owns or has an interest in, that establishment's wholesale price is used.","notes":["Gross selling price for ad valorem excise EXCLUDES VAT.","Sales through a related establishment: use that establishment's wholesale price.","Prevents understating the tax base through related-party sales outlets."],"upd":"","key":""},{"id":"Q05-13","quiz":5,"num":13,"sec":"7","q":"When goods locally produced or manufactured are removed and actually exported without returning to the Philippines, whether so exported in their original state or as ingredients or parts of any manufactured goods or products, any excise tax paid thereon shall be:\nI - credited or refunded upon submission of the proof of actual exportation and upon receipt of the corresponding foreign exchange payment.\nII - deducted from gross income upon submission of the proof of actual exportation and upon receipt of the corresponding foreign exchange payment.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":2,"exp":"Sec. 130(D) provides that excise tax paid on goods actually exported is credited or refunded upon proof of actual exportation and receipt of the corresponding foreign exchange payment. The law grants a tax credit or refund, not a deduction from gross income, so II is wrong.","notes":["Exported goods: excise tax paid is credited or refunded (Sec. 130(D)).","Requirements: proof of actual exportation and receipt of foreign exchange payment.","Mineral products: not creditable or refundable on export, except coal and coke."],"upd":"","key":""},{"id":"Q05-14","quiz":5,"num":14,"sec":"7","q":"The excise tax on mineral products imposed under Section 151 shall not be creditable or refundable even if the mineral products are actually exported, except in the case of:","opts":["coal and coke.","copper.","gold.","chromite."],"ans":0,"exp":"Sec. 130(D) states that the excise tax on mineral products under Sec. 151 is not creditable or refundable even if exported, except for coal and coke. Copper, gold and chromite remain non-refundable on export.","notes":["Only coal and coke are excepted from the non-refundability rule on exported minerals.","Mineral excise (TRAIN): coal is taxed per metric ton; other minerals ad valorem (4% of market value).","Other exported goods: excise credited or refunded upon proof of export and forex receipt."],"upd":"","key":""},{"id":"Q05-15","quiz":5,"num":15,"sec":"7","q":"Excise taxes on imported articles shall be paid by the owner or importer to the Customs Officers, conformably with the regulations of the Department of Finance:\nI - before the release of such articles from the customs house\nII - by the person who is found in possession of articles which are exempt from excise taxes other than those legally entitled to exemption.","opts":["Both I and II are correct","Both I and II are incorrect","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 131(A) requires the owner or importer to pay excise taxes on imported articles to Customs before their release from the customs house. It also makes liable any person found in possession of articles exempt from excise tax who is not legally entitled to the exemption, so both are correct.","notes":["Imported articles: pay before release from the customs house.","Possessor of exempt articles who is not entitled to the exemption is liable.","Importations for duty-free shops of tobacco and alcohol products are still taxable."],"upd":"","key":""},{"id":"Q05-16","quiz":5,"num":16,"sec":"7","q":"First statement: The provision of any special or general law to the contrary notwithstanding, the importation of cigars and cigarettes, distilled spirits, fermented liquors and wines into the Philippines, even if destined for tax and duty-free shops, shall be subject to all applicable taxes, duties and charges, including excise taxes due thereon.\nSecond statement: Unless otherwise specified, imported articles shall be subject to the same rates and basis of excise taxes applicable to locally manufactured articles.","opts":["Both statements are correct","Both statements are incorrect","Only the first statement is correct","Only the second statement is correct"],"ans":0,"exp":"Both are found in Sec. 131(A). Tobacco and alcohol imports are taxable even if destined for tax and duty-free shops, and imported articles generally follow the same excise rates and bases as locally manufactured articles.","notes":["Cigars, cigarettes, distilled spirits, fermented liquors and wines: taxable even if for duty-free shops.","Imported goods: same excise rates and bases as local goods, unless otherwise specified.","Automobiles use the importer's selling price as the base."],"upd":"","key":""},{"id":"Q05-17","quiz":5,"num":17,"sec":"7","q":"All the following items are subject to excise tax based on per kilogram, except:","opts":["Lubricating oils and greases","Waxes and petrolatum","Liquefied petroleum gas","Kerosene"],"ans":3,"exp":"Under Sec. 148, kerosene is taxed per liter of volume capacity. Waxes and petrolatum and LPG are taxed per kilogram, and greases are taxed per kilogram (lubricating oils per liter), so kerosene is the only choice with no per-kilogram basis.","notes":["Per kilogram: waxes and petrolatum, LPG, asphalts, greases.","Per liter: lubricating oils, gasoline, kerosene, diesel, aviation fuel, bunker fuel oil, processed gas.","TRAIN rates from 2020: gasoline P10/liter, diesel P6/liter, kerosene P5/liter, LPG P3/kg."],"upd":"","key":""},{"id":"Q05-18","quiz":5,"num":18,"sec":"7","q":"All the following items are subject to excise tax based on per liter of volume capacity, except:","opts":["Sparkling wines/champagnes.","Still wines and carbonated wines.","Processed gas.","Distilled spirits."],"ans":3,"exp":"Wines (sparkling, still and carbonated) and processed gas are taxed per liter of volume capacity. Distilled spirits are taxed on a different basis: 22% of the net retail price plus a specific tax per proof liter (Sec. 141), not per plain liter of volume capacity.","notes":["Distilled spirits: ad valorem 22% of net retail price PLUS specific tax per PROOF liter.","Wines and fermented liquors: specific tax per liter of volume capacity.","Processed gas is a petroleum product taxed per liter (Sec. 148)."],"upd":"","key":""},{"id":"Q05-19","quiz":5,"num":19,"sec":"7","q":"Which of the following items is subject to both ad valorem and specific excise taxes?","opts":["Cigars","Cigarettes packed by hand","Cigarettes packed by machine","None of the choices"],"ans":0,"exp":"Under Sec. 144, cigars are subject to an ad valorem tax of 20% of the net retail price per cigar plus a specific tax per cigar. Cigarettes, whether packed by hand or by machine, are subject only to a unitary specific tax per pack.","notes":["Cigars: 20% of net retail price PLUS specific tax per cigar.","Cigarettes: specific tax per pack only (same rate for hand and machine packed).","Distilled spirits also carry both ad valorem and specific taxes."],"upd":"","key":""},{"id":"Q05-20","quiz":5,"num":20,"sec":"7","q":"Which of the following items is exempt from excise tax?","opts":["Diesel fuel oil, and similar fuel oils having more or less the same generating power","Bunker fuel oil, and similar fuel oils having more or less the same generating power","Naphtha, regular gasoline and other similar products of distillation","Petroleum products sold to international carriers of Philippine or foreign registry for their use or consumption outside the Philippines"],"ans":3,"exp":"Sec. 135(a) exempts petroleum products sold to international carriers of Philippine or foreign registry for their use or consumption outside the Philippines. Diesel, bunker fuel oil and naphtha/regular gasoline are all taxable per liter under Sec. 148.","notes":["Sec. 135 exemptions: sales to international carriers, to entities exempt under treaties or international agreements, and to entities exempt by law.","Diesel, bunker fuel oil and gasoline are taxable per liter (Sec. 148, TRAIN).","Exemption for international carriers applies only to use or consumption outside the Philippines."],"upd":"","key":""},{"id":"Q05-21","quiz":5,"num":21,"sec":"7","q":"Which of the following non-essential services is subject to excise tax?","opts":["Invasive cosmetic procedures, surgeries, and body enhancements directed solely toward improving, altering, or enhancing the patient's appearance","Procedures necessary to ameliorate a deformity arising from, or directly related to, a congenital or developmental defect or abnormality","Procedures necessary to ameliorate a personal injury resulting from an accident or trauma","Procedures necessary to ameliorate a disfiguring disease, tumor, virus or infection"],"ans":0,"exp":"Sec. 150-A (TRAIN) imposes 5% excise tax on gross receipts, net of VAT, from invasive cosmetic procedures, surgeries and body enhancements directed solely toward improving, altering or enhancing appearance. Procedures needed to correct congenital or developmental defects, injuries from accidents or trauma, or disfiguring diseases, tumors, viruses or infections are expressly excluded.","notes":["Rate: 5% of gross receipts, net of VAT.","Excluded: procedures for congenital/developmental defects, accident or trauma injuries, disfiguring diseases, tumors, viruses or infections.","Cases or treatments covered by the National Health Insurance Program are not subject to the tax."],"upd":"","key":""},{"id":"Q05-22","quiz":5,"num":22,"sec":"7","q":"Which of the following sweetened beverages shall be subject to excise tax?\nI - sweetened beverages using purely caloric sweeteners, purely non-caloric sweeteners, or a mix of caloric and non-caloric sweeteners\nII - sweetened beverages using high fructose corn syrup\nIII - sweetened beverages using purely coconut sap sugar and purely steviol glycosides","opts":["I, II and III","II and III only","I only","III only"],"ans":2,"exp":"Sec. 150-B (TRAIN) taxes sweetened beverages using purely caloric, purely non-caloric, or a mix of caloric and non-caloric sweeteners at P6 per liter, and those using purely high fructose corn syrup (HFCS) or HFCS in combination with any caloric or non-caloric sweetener at P12 per liter. Beverages using purely coconut sap sugar and purely steviol glycosides are exempt, so III is not taxable. The key picks I only, although II is also taxable (see key note).","notes":["P6 per liter: purely caloric, purely non-caloric, or mixed caloric/non-caloric sweeteners.","P12 per liter: purely HFCS or HFCS combined with any caloric or non-caloric sweetener.","Exempt: purely coconut sap sugar and purely steviol glycosides; also milk products, 3-in-1 coffee, 100% natural fruit/vegetable juices, meal replacements and medically indicated beverages."],"upd":"","key":"Flawed item: sweetened beverages using purely HFCS (or HFCS in combination) are also taxable at P12 per liter, so strictly I and II are taxable and no choice says that. C (I only) is the key's intended answer and is kept."},{"id":"Q05-23","quiz":5,"num":23,"sec":"7","q":"Which of the following automobiles shall be exempt from excise tax?\nA. Hybrid vehicles\nB. Purely electric vehicles and pick-ups","opts":["A and B","A only","B only","Neither A nor B"],"ans":2,"exp":"Under Sec. 149 as amended by TRAIN, purely electric vehicles and pick-ups are exempt from the excise tax on automobiles. Hybrid vehicles are not exempt; they pay 50% of the applicable excise tax rate, so only B is exempt.","notes":["Exempt: purely electric vehicles and pick-ups.","Hybrid vehicles: 50% of the applicable rate (TRAIN).","Rates on net selling price: up to P600,000, 4%; over P600,000 to P1M, 10%; over P1M to P4M, 20%; over P4M, 50%."],"upd":"","key":"The source key lists \"B\", which matches statement B (purely electric vehicles and pick-ups are exempt); among the lettered choices that is c (B only)."},{"id":"Q05-24","quiz":5,"num":24,"sec":"7","q":"Which of the following is classified as fermented liquor for excise tax purposes?","opts":["Whiskey","Vodka","Brandy","Lager beer"],"ans":3,"exp":"Fermented liquors under Sec. 143 include beer, lager beer, ale, porter and other fermented liquors. Whiskey, vodka and brandy are distilled spirits taxed under Sec. 141.","notes":["Fermented liquors (beer, lager, ale, porter): specific tax per liter.","Distilled spirits (whiskey, vodka, brandy, gin, rum): ad valorem plus specific per proof liter.","Wines are taxed separately under Sec. 142."],"upd":"","key":""},{"id":"Q05-25","quiz":5,"num":25,"sec":"7","q":"A tax of six pesos (P6.00) per liter of volume capacity shall be levied, assessed, and collected on which of the following?","opts":["Sweetened beverages using purely caloric sweeteners, purely non-caloric sweeteners, or a mix of caloric and non-caloric sweeteners","Sweetened beverages using purely coconut sap sugar and purely steviol glycosides","Sweetened beverages using purely high fructose corn syrup or in combination with any caloric or non-caloric sweetener","Sweetened beverages using high fructose corn syrup"],"ans":0,"exp":"Sec. 150-B imposes P6 per liter on sweetened beverages using purely caloric, purely non-caloric, or a mix of caloric and non-caloric sweeteners. Beverages with HFCS (purely or in combination) pay P12 per liter, while those using purely coconut sap sugar and purely steviol glycosides are exempt.","notes":["P6 per liter: caloric, non-caloric or mixed sweeteners.","P12 per liter: any beverage using HFCS, alone or combined.","Exempt: purely coconut sap sugar and purely steviol glycosides."],"upd":"","key":""},{"id":"Q06-01","quiz":6,"num":1,"sec":"3.1-IND","q":"Which of the following is NOT a nonresident citizen?","opts":["A citizen of the Philippines who establishes to the satisfaction of the Commissioner the fact of his physical presence abroad with a definite intention to reside therein.","A citizen of the Philippines who leaves the Philippines during the taxable year to reside abroad, either as an immigrant or for employment on a permanent basis.","A citizen of the Philippines who works and derives income from sources abroad and whose employment thereat requires him to be physically present abroad most of the time during the taxable year.","A citizen of the Philippines who goes on a business trip abroad and stays therein most of the time during the year."],"ans":3,"exp":"Sec. 22(E) defines a nonresident citizen by reference to intent to reside abroad (a), departure to reside abroad as an immigrant or permanent employee (b), or employment that requires physical presence abroad most of the year (c). A citizen on a business trip keeps his Philippine residence; the stay abroad is temporary and not required by foreign employment, so he remains a resident citizen taxed on worldwide income.","notes":["Nonresident citizens (including OCWs and seamen) are taxed only on income from Philippine sources.","Physical presence abroad 'most of the time' means at least 183 days in the taxable year for employment-based nonresidence.","A business trip or vacation abroad does not change a citizen's residence."],"upd":"","key":""},{"id":"Q06-02","quiz":6,"num":2,"sec":"3.1-IND","q":"A citizen who has been previously considered as a nonresident citizen and who arrives in the Philippines at any time during the taxable year to reside permanently in the Philippines shall likewise be treated as a nonresident citizen for the taxable year in which he arrives, with respect to his:","opts":["income derived from sources abroad until the date of his arrival in the Philippines.","income derived from sources within the Philippines.","income derived from sources abroad until the last day of the calendar year.","income derived from sources within and outside the Philippines."],"ans":0,"exp":"Under Sec. 22(E)(4), a returning nonresident citizen is still treated as a nonresident for the year of arrival only as to foreign-source income earned up to the date of arrival. From arrival onward he is a resident citizen, so foreign-source income after that date becomes taxable. Choice c wrongly extends nonresident treatment to year-end.","notes":["Foreign-source income before the arrival date: not taxable (nonresident treatment).","Foreign-source income after the arrival date: taxable (resident citizen).","Philippine-source income is taxable to both resident and nonresident citizens."],"upd":"","key":""},{"id":"Q06-03","quiz":6,"num":3,"sec":"3.1-IND","q":"Denzell Wetta, an American management expert, is hired by a Philippine corporation to assist in its organization and operation, for which he has to stay in the Philippines for 5 months. He came to the Philippines for this definite purpose, but the nature of his job may require him to extend his stay and live temporarily in the Philippines. He intends to leave the Philippines as soon as his job is done. For income tax purposes, he shall be classified as a:","opts":["resident alien.","nonresident alien engaged in trade or business.","nonresident alien not engaged in trade or business.","resident citizen."],"ans":0,"exp":"Under RR 2, Sec. 5, an alien who comes for a definite purpose which in its nature requires an extended stay, and to that end makes his home temporarily in the Philippines, is a resident alien even if he intends to return abroad eventually. His planned stay is only 5 months, but the nature of the engagement may require an extended stay, which is the test of residence. Mere transients or sojourners are the ones treated as nonresidents.","notes":["Resident alien: taxed on Philippine-source income at graduated rates.","Residence of an alien depends on intention and the nature of the stay, not a fixed day count.","An alien with no definite intention as to his stay is a transient (nonresident)."],"upd":"","key":""},{"id":"Q06-04","quiz":6,"num":4,"sec":"3.1-IND","q":"Palito Lippi, an American singer, was engaged to sing for one week at a hotel in Manila, after which he returned to the USA. For income tax purposes, he should be classified as a:","opts":["resident alien.","nonresident alien engaged in trade or business.","nonresident alien not engaged in trade or business.","resident citizen."],"ans":2,"exp":"The singer is a mere transient: he came for a short engagement with no intention to stay. A nonresident alien is deemed engaged in trade or business only if he stays in the Philippines for an aggregate of more than 180 days in the calendar year (Sec. 25(A)(1)); a one-week stay falls far short. He is therefore a nonresident alien not engaged in trade or business.","notes":["NRANETB: 25% final tax on gross income from Philippine sources (Sec. 25(B)); no deductions.","More than 180 days aggregate stay in a calendar year: deemed NRA engaged in trade or business.","NRAETB is taxed at graduated rates on Philippine-source net income."],"upd":"","key":""},{"id":"Q06-05","quiz":6,"num":5,"sec":"3.1-IND","q":"A nonresident alien individual who shall come to the Philippines and stay therein for an aggregate period of more than 180 days during the calendar year shall be deemed a 'nonresident alien doing business in the Philippines':","opts":["regardless of whether or not he is actually engaged in business in the Philippines.","only when he is actually engaged in business in the Philippines.","when his income does not come from the performance of personal services in the Philippines.","when he comes to the Philippines for a definite purpose which in its nature would require an extended stay and to that end makes his home temporarily in the Philippines, although it may be his intention at all times to return to his domicile abroad."],"ans":0,"exp":"Sec. 25(A)(1) creates a conclusive rule: an NRA who stays more than 180 days in aggregate during the calendar year is deemed doing business in the Philippines regardless of whether he actually engages in business. Choice d describes a resident alien, not a nonresident alien doing business.","notes":["The 180-day count is aggregate (not continuous) within one calendar year.","Choice d is the RR 2 test for a resident alien.","NRAETB uses graduated rates; NRANETB pays 25% final tax on gross."],"upd":"","key":""},{"id":"Q06-06","quiz":6,"num":6,"sec":"3.1-IND","q":"Which of the following individual taxpayers is taxed on income from sources within and without the Philippines?","opts":["A citizen of the Philippines residing therein.","A nonresident citizen.","An individual citizen of the Philippines who is working and deriving income abroad as an overseas contract worker.","An alien individual, whether a resident or not of the Philippines."],"ans":0,"exp":"Under Sec. 23, only a resident citizen is taxed on worldwide income. Nonresident citizens, OCWs and seamen, and all aliens (resident or not) are taxed only on income from sources within the Philippines.","notes":["Resident citizen and domestic corporation: taxable on worldwide income.","Nonresident citizen, OCW, alien: Philippine-source income only.","Foreign taxes paid by a resident citizen may be claimed as a credit or deduction (Sec. 34(C))."],"upd":"","key":""},{"id":"Q06-07","quiz":6,"num":7,"sec":"3.1-IND","q":"There shall be levied, collected and paid for each taxable year upon the entire income received by every nonresident alien individual not engaged in trade or business within the Philippines from:","opts":["all sources within the Philippines.","all sources within and without the Philippines.","all sources without the Philippines.","none of the choices."],"ans":0,"exp":"Sec. 25(B) imposes a 25% tax on the entire gross income received by an NRANETB from all sources within the Philippines. Aliens are never taxed on foreign-source income, so choices b and c are wrong.","notes":["Rate: 25% final tax on gross income, no deductions.","Capital gains on unlisted shares and real property still follow the CGT rules (15% and 6%).","Treaty rates may apply if the NRA is a resident of a treaty country."],"upd":"","key":""},{"id":"Q06-08","quiz":6,"num":8,"sec":"3.1-IND","q":"Aside from the statutory minimum wage, the following shall likewise be covered by the minimum wage earner (MWE) exemption, EXCEPT:","opts":["Hazard pay paid by the employer to MWEs who were actually assigned to danger or strife-torn areas, disease-infested places, or in distressed or isolated stations and camps, which expose them to great danger or contagion or peril to life.","Holiday pay, overtime pay, night shift differential pay.","Hazard pay paid by the employer to MWEs who were not actually assigned to danger or strife-torn areas, disease-infested places, or in distressed or isolated stations and camps, which expose them to great danger or contagion or peril to life.","None of the choices."],"ans":2,"exp":"Sec. 24(A)(2) and RR 11-2018 exempt the MWE's statutory minimum wage together with holiday pay, overtime pay, night shift differential and hazard pay. Hazard pay qualifies only if the MWE is actually assigned to the dangerous or distressed area; hazard pay given to MWEs not so assigned is ordinary taxable compensation, so c is the exception.","notes":["Exempt MWE items: SMW, holiday pay, overtime pay, night shift differential, hazard pay (actual assignment).","An MWE with other income stays exempt on the SMW and the items above; other income is taxable.","13th month pay and other benefits of an MWE are exempt up to P90,000 like any employee."],"upd":"","key":""},{"id":"Q06-09","quiz":6,"num":9,"sec":"3.1-IND","q":"Which of the following individual taxpayers falls under the medium group?","opts":["Gross sales of less than P3,000,000","Gross sales of P3,000,000 to less than P20,000,000","Gross sales of P20,000,000 to less than P1,000,000,000","Gross sales of P1,000,000,000 and above"],"ans":2,"exp":"RR 8-2024, implementing the Ease of Paying Taxes Act, classifies taxpayers by gross sales: micro (less than P3M), small (P3M to less than P20M), medium (P20M to less than P1B) and large (P1B and above). A taxpayer with gross sales of P20M to less than P1B is medium.","notes":["Micro: < P3M; small: P3M to < P20M; medium: P20M to < P1B; large: P1B and above.","Micro and small taxpayers get reduced penalties: 10% surcharge, half the interest rate, and 50% lower compromise penalties.","Micro and small taxpayers may file a simplified two-page income tax return."],"upd":"EOPT: RR 8-2024 created the micro, small, medium and large taxpayer classification (a large taxpayer may also be so classified by BIR criteria apart from gross sales).","key":""},{"id":"Q06-10","quiz":6,"num":10,"sec":"3.1-IND","q":"Gross sales for purposes of taxpayer classification shall refer to total sales revenue, net of VAT, if applicable, during the taxable year, without any deductions, but does NOT include:","opts":["business income.","compensation income earned under employer-employee relationship.","income from the conduct of trade or business.","income from the exercise of profession."],"ans":1,"exp":"Under RR 8-2024, gross sales for classification cover revenue from business or the practice of profession, net of VAT, with no deductions. Compensation income from an employer-employee relationship is not sales revenue, so it is excluded. Choices a, c and d all describe business or professional income, which is included.","notes":["Classification uses gross sales net of VAT, before any deduction.","Compensation income is excluded; a mixed-income earner is classified on business/professional sales only.","The classification affects penalties and return formats, not the income tax rates."],"upd":"EOPT: taxpayer classification under RR 8-2024.","key":""},{"id":"Q06-11","quiz":6,"num":11,"sec":"3.1-IND","q":"An individual taxpayer is allowed a personal exemption of:","opts":["P250,000.","P90,000.","P20,000.","Zero"],"ans":3,"exp":"TRAIN (RA 10963) removed the personal and additional exemptions of individuals starting 2018 and replaced them with a zero-rated first P250,000 of taxable income in the graduated table. P250,000 is the 0% bracket, not an exemption; P90,000 is the 13th month pay exclusion; P20,000 is the exemption of estates and trusts under Sec. 62.","notes":["No personal or additional exemptions for individuals since 2018.","First P250,000 of taxable income is taxed at 0%.","Estates and trusts still get a P20,000 exemption (Sec. 62)."],"upd":"TRAIN: personal and additional exemptions repealed effective January 1, 2018.","key":""},{"id":"Q06-12","quiz":6,"num":12,"sec":"3.1-IND","q":"Which of the following is an INCORRECT statement?","opts":["Married individuals, whether citizens, resident or nonresident aliens, who do not derive income purely from compensation, shall file, either electronically or manually, a return for the taxable year to include the income of both spouses.","Where it is impracticable for the spouses to file one return, each spouse may file a separate return of income but the returns so filed shall be consolidated by the Bureau for purposes of verification for the taxable year.","For married individuals, the husband and wife, subject to the provision of Section 51(D) hereof, shall compute separately their individual income tax based on their respective total taxable income.","If any income cannot be definitely attributed to or identified as income exclusively earned or realized by either of the spouses, the same shall be considered income of the husband for the purpose of determining their respective taxable income."],"ans":3,"exp":"Under Sec. 24(A)(2) and Sec. 51(D), income that cannot be definitely attributed to either spouse is divided equally between them, not assigned to the husband. Choices a, b and c restate the joint filing rule, the separate filing option with BIR consolidation, and the separate computation of tax, which are all correct.","notes":["Spouses file one return but compute their taxes separately.","Income not attributable to either spouse: divided equally.","Joint filing is required when the spouses do not derive income purely from compensation."],"upd":"","key":""},{"id":"Q06-13","quiz":6,"num":13,"sec":"3.1-IND","q":"Statement I: Individuals earning purely compensation income shall be taxed based on the graduated income tax rates.\nStatement II: Individuals earning purely compensation income exceeding P3,000,000 shall be taxed based on the graduated income tax rates or the 8% preferential rate at their option.","opts":["I and II are correct","I and II are incorrect","Only I is correct","Only II is correct"],"ans":2,"exp":"Purely compensation earners are taxed only at the graduated rates of Sec. 24(A)(2)(a). The 8% option is available only to self-employed individuals and professionals (including mixed-income earners on their business income) with gross sales/receipts and other non-operating income not exceeding P3,000,000; it never applies to compensation income, so Statement II is wrong on two counts.","notes":["Compensation income: always graduated rates.","8% option: self-employed/professionals with gross sales not exceeding P3M; mixed-income earners get no P250,000 deduction on the business portion.","Graduated table 2023 onward: 0% up to P250,000; 35% on excess over P8M."],"upd":"","key":""},{"id":"Q06-14","quiz":6,"num":14,"sec":"3.1-IND","q":"Self-employed individuals and/or professionals whose gross sales/receipts and other non-operating income do not exceed P3,000,000 shall have the option to be taxed at:\nOption A: graduated income tax rates on taxable income\nOption B: an 8% tax on gross sales/receipts and other non-operating income in excess of P250,000, in lieu of the graduated income tax rates and the percentage tax under Section 116","opts":["Either option is correct","Neither option is correct","Only option A is correct","Only option B is correct"],"ans":0,"exp":"Sec. 24(A)(2)(b) gives purely self-employed individuals and professionals within the P3,000,000 threshold the choice between the graduated rates and the 8% gross income tax. The 8% tax applies to gross sales/receipts and other non-operating income in excess of P250,000 and is in lieu of both the graduated rates and the 3% percentage tax under Sec. 116, so both options are correctly described.","notes":["The 8% election is made in the first quarter return (or first return on commencement); otherwise graduated rates apply.","Once gross sales exceed the P3M VAT threshold during the year, the 8% option is lost for that year.","The P250,000 reduction is not available to mixed-income earners."],"upd":"","key":""},{"id":"Q06-15","quiz":6,"num":15,"sec":"3.1-IND","q":"The following cannot avail of the 8% income tax rate option:\nI: A VAT-registered taxpayer, regardless of the gross sales/receipts\nII: Taxpayers who are subject to Other Percentage Taxes under Title V of the Tax Code, as amended, except those subject under Section 116\nIII: Partners of a General Professional Partnership (GPP) by virtue of their distributive share from the GPP, which is already net of costs and expenses","opts":["I, II and III","I and II only","II and III only","III only"],"ans":0,"exp":"RR 8-2018 excludes from the 8% option VAT-registered taxpayers (even if below P3M), taxpayers subject to other percentage taxes other than Sec. 116 (e.g., Sec. 117 to 127 taxes), and GPP partners on their distributive share, since that share is already net of costs and expenses. All three are disqualified.","notes":["Also excluded: purely compensation earners and those whose sales exceed P3M.","OPT under Sec. 116 is 3%; the 8% tax is in lieu of it.","A GPP partner's distributive share is taxed at graduated rates (the GPP itself is not a taxable entity)."],"upd":"","key":""},{"id":"Q06-16","quiz":6,"num":16,"sec":"3.1-IND","q":"Statement I: An estate is a taxpayer if it is under administration or judicial settlement.\nStatement II: A trust is a taxpayer if under the terms of the trust the fiduciary must accumulate the income.\nStatement III: A trust is a taxpayer if under the terms of the trust the fiduciary may accumulate or distribute the income, in his discretion.","opts":["I, II and III are correct","I and II are correct","II and III are correct","I and III are correct"],"ans":0,"exp":"Sec. 60(A) subjects to income tax the income of an estate under administration or judicial settlement and the income of a trust that is accumulated or held for future distribution, including income that the fiduciary may, in his discretion, either accumulate or distribute. All three statements are correct.","notes":["Estates and trusts are taxed like individuals (graduated rates) with a P20,000 exemption (Sec. 62).","An estate settled extrajudicially and not under administration is generally not a separate taxable entity; heirs report the income.","Income distributed or distributable to beneficiaries is deductible by the trust and taxable to the beneficiary."],"upd":"","key":""},{"id":"Q06-17","quiz":6,"num":17,"sec":"3.7","q":"The following individuals are required to file an income tax return, EXCEPT:","opts":["Every Filipino citizen residing in the Philippines.","Every Filipino citizen residing outside the Philippines, on his income from sources within the Philippines.","Every alien residing in the Philippines, on his income from sources within the Philippines.","Every nonresident alien not engaged in trade or business or exercise of profession in the Philippines."],"ans":3,"exp":"Sec. 51(A)(1) requires returns from resident citizens, nonresident citizens and resident aliens (on Philippine-source income), and nonresident aliens engaged in trade or business. An NRANETB is not required to file because his 25% tax is withheld at source as a final tax.","notes":["Not required to file (Sec. 51(A)(2)): taxable income not over P250,000, MWEs, income subject to final tax only, and employees qualified for substituted filing.","Annual ITR due April 15 of the following year.","NRANETB income is fully covered by the 25% final withholding tax."],"upd":"","key":""},{"id":"Q06-18","quiz":6,"num":18,"sec":"3.7","q":"The final adjustment (annual) income tax return of individuals shall be filed on or before:","opts":["May 15 of the succeeding year.","April 15 of the current year.","April 15 of the succeeding year.","December 15 of the current year"],"ans":2,"exp":"Sec. 51(C)(1) requires individuals to file the annual (final adjustment) income tax return on or before April 15 of the year following the taxable year. May 15 is the deadline of the first quarter return of self-employed individuals, not the annual return.","notes":["Individual quarterly returns: May 15, August 15, November 15.","Tax due over P2,000 may be paid in two equal installments: April 15 and October 15.","EOPT: returns may be filed and taxes paid with any AAB, RDO (through an RCO) or authorized tax software provider."],"upd":"","key":""},{"id":"Q06-19","quiz":6,"num":19,"sec":"3.1-IND","q":"Under R.A. No. 12214 (Capital Markets Efficiency Promotion Act, CMEPA), interest income received by an individual taxpayer (except a nonresident individual) from a depository bank under the expanded foreign currency deposit system is now subject to:","opts":["20% final tax.","15% final tax.","10% final tax.","5% final tax."],"ans":0,"exp":"CMEPA (effective July 1, 2025) applies a uniform 20% final tax to interest on currency bank deposits and similar yields, including interest earned by residents on FCDU deposits, which was previously taxed at 15%. The 15% rate still applies only to pre-CMEPA instruments grandfathered until maturity.","notes":["CMEPA: 20% final tax on peso and FCDU deposit interest of residents.","Instruments acquired before July 1, 2025 keep their old tax treatment until maturity.","Income of nonresidents from FCDU transactions remains exempt (the President vetoed its deletion)."],"upd":"CMEPA: FCDU deposit interest of residents raised from 15% to 20% for deposits made on or after July 1, 2025; earlier instruments are grandfathered until maturity, and nonresidents' income from FCDU transactions remains exempt.","key":""},{"id":"Q06-20","quiz":6,"num":20,"sec":"3.1-IND","q":"Under R.A. No. 12214 (CMEPA), interest income from long-term deposits or investments in the form of savings, common or individual trust funds, deposit substitutes, investment management accounts and other investments evidenced by certificates in such form prescribed by the Bangko Sentral ng Pilipinas (BSP) is now subject to:","opts":["20% final tax.","15% final tax.","10% final tax.","5% final tax."],"ans":0,"exp":"Before CMEPA, interest on long-term deposits or investments (maturity of 5 years or more) held by individuals was exempt, with 5%, 12% or 20% imposed only on pre-termination. CMEPA repealed the exemption, so interest on such instruments acquired on or after July 1, 2025 is subject to the uniform 20% final tax.","notes":["Long-term deposit exemption repealed for instruments acquired on or after July 1, 2025.","Long-term instruments acquired before July 1, 2025 keep their exemption until maturity.","Nonresident aliens not engaged in business and foreign corporations: 25%."],"upd":"CMEPA: repealed the long-term deposit exemption; instruments acquired before July 1, 2025 are grandfathered until maturity. Nonresidents' income from FCDU transactions stays exempt.","key":""},{"id":"Q06-21","quiz":6,"num":21,"sec":"3.1-CG","q":"Capital gains presumed to have been realized from the sale or disposition of their principal residence by natural persons shall be exempt from capital gains tax, subject to the following:\nI: The proceeds are fully utilized in acquiring or constructing a new principal residence within eighteen (18) calendar months from the date of sale or disposition.\nII: The Commissioner has been duly notified by the taxpayer within thirty (30) days from the date of sale or disposition, through the prescribed form, of the intention to avail of the tax exemption.\nIII: The tax exemption can only be availed of once every ten (10) years.","opts":["I, II and III are correct","I and II are correct","Only I is correct","Only II and III are correct"],"ans":0,"exp":"Sec. 24(D)(2) and RR 13-99 exempt the 6% CGT on the sale of a principal residence if the proceeds are fully used within 18 months to acquire or build a new principal residence, the CIR is notified within 30 days from the sale, and the exemption is availed of only once every 10 years. All three conditions are correctly stated.","notes":["The 6% CGT is placed in escrow pending proof of utilization.","Partial utilization: CGT on the unutilized portion (unutilized/GSP x higher of GSP or FMV x 6%).","Historical cost of the old residence carries over to the new residence (adjusted basis)."],"upd":"","key":""},{"id":"Q06-22","quiz":6,"num":22,"sec":"3.1-IND","q":"Under R.A. No. 10963 (TRAIN), the following special aliens are now subject to the regular income tax rates, EXCEPT:","opts":["Alien individuals employed by Regional or Area Headquarters and Regional Operating Headquarters of multinational corporations.","Alien individuals employed by Offshore Banking Units.","Alien individuals employed by Foreign Petroleum Service Contractors and Subcontractors.","Nonresident alien cinematographic film owner, lessor or distributor on his cinematographic films and similar works."],"ans":3,"exp":"TRAIN withdrew the 15% preferential rate for alien employees of RHQs/ROHQs, OBUs and petroleum service contractors, so their compensation is now taxed under the regular rates. A nonresident alien film owner, lessor or distributor is not an employee; he remains subject to a 25% final tax on gross income from Philippine sources.","notes":["Existing RHQs, ROHQs, OBUs and petroleum service contractors already availing of the 15% rate before January 1, 2018 may continue it for qualified employees (TRAIN proviso).","Special alien employees are taxed like other individuals on income from other Philippine sources.","NRANETB and nonresident film distributors: 25% final tax on gross."],"upd":"TRAIN: the 15% preferential rate for special alien employees does not apply to entities registered after January 1, 2018.","key":""},{"id":"Q06-23","quiz":6,"num":23,"sec":"3.1-IND","q":"Any income earned from all other sources within the Philippines by the alien employees of Regional or Area Headquarters and Regional Operating Headquarters of multinational companies, Offshore Banking Units, and Petroleum Service Contractors and Subcontractors shall be subject to the:","opts":["regular income tax for individuals.","fifteen percent (15%) final tax.","twenty-five percent (25%) final tax.","thirty percent (30%) final tax."],"ans":0,"exp":"Even when the 15% preferential rate applied, it covered only the salaries, wages and similar compensation received from the qualified employer. Under Sec. 25(C) to (E), income of these aliens from all other Philippine sources is subject to the pertinent regular income tax rules, not the 15% rate.","notes":["The 15% rate (where still grandfathered) covers only compensation from the qualified employer.","Other income follows the regular rules: graduated rates, final taxes on passive income, CGT on capital gains.","TRAIN ended the 15% rate for entities registered after January 1, 2018."],"upd":"","key":""},{"id":"Q06-39","quiz":6,"num":39,"sec":"3.1-IND","q":"A self-employed individual on the calendar year who opted for the 8% income tax rate files quarterly income tax returns. When is the due date of the third quarter return for 2025?","opts":["April 15, 2025","May 15, 2025","August 15, 2025","November 15, 2025"],"ans":3,"exp":"Under Sec. 74(A), individuals' quarterly income tax returns are due on May 15 (first quarter), August 15 (second quarter) and November 15 (third quarter) of the current year. The third quarter return for 2025 is therefore due November 15, 2025; the fourth quarter is covered by the annual return due April 15 of the following year.","notes":["Individual quarterly ITR: May 15, August 15, November 15.","Corporate quarterly ITR: within 60 days after the close of each of the first three quarters.","The 8% tax is computed cumulatively; prior quarters' payments are credited."],"upd":"","key":"Source key says B (May 15, 2025), which is the first quarter deadline; the source's own solution table shows November 15 for the third quarter, so D is correct."},{"id":"Q06-46","quiz":6,"num":46,"sec":"3.1-CG","q":"An individual sold her principal residence and plans to use the proceeds to build a new principal residence. Within how many months from the date of sale or disposition must the proceeds be utilized to avail of the capital gains tax exemption?","opts":["18 months","16 months","15 months","12 months"],"ans":0,"exp":"Sec. 24(D)(2) requires the proceeds to be fully utilized in acquiring or constructing a new principal residence within 18 calendar months from the date of sale or disposition. If not utilized within that period, the 6% CGT held in escrow becomes due.","notes":["Utilization period: 18 calendar months from the sale.","Notice to the CIR: within 30 days from the sale.","Availment: once every 10 years."],"upd":"","key":""},{"id":"Q06-47","quiz":6,"num":47,"sec":"3.1-CG","q":"An individual sold her principal residence and plans to use the proceeds to build a new principal residence. Within how many days must she notify the BIR of her intention to use the proceeds to avail of the capital gains tax exemption?","opts":["60 days","30 days","15 days","10 days"],"ans":1,"exp":"Under Sec. 24(D)(2) and RR 13-99, the taxpayer must notify the Commissioner, through the prescribed form, within 30 days from the date of sale or disposition of the intention to avail of the principal residence exemption.","notes":["Notice: within 30 days from the sale.","The 6% CGT on the sale is deposited in escrow until utilization is proven.","The exemption covers only the principal residence of a natural person."],"upd":"","key":""},{"id":"Q06-48","quiz":6,"num":48,"sec":"3.1-CG","q":"An individual sold her principal residence and plans to use the proceeds to build a new principal residence. The capital gains tax exemption can only be availed of once every how many years?","opts":["15 years","10 years","5 years","3 years"],"ans":1,"exp":"Sec. 24(D)(2) limits the principal residence exemption to once every 10 years. The other conditions are full utilization of the proceeds within 18 months and notice to the CIR within 30 days from the sale.","notes":["Once every 10 years.","Unutilized proceeds are subject to 6% CGT proportionately.","Basis of the new residence: historical cost of the old residence plus any additional cost."],"upd":"","key":""},{"id":"Q07-01","quiz":7,"num":1,"sec":"3.1-CORP","q":"For income tax purposes, which of the following does NOT fall under the definition of a corporation?","opts":["One-person corporation","Partnerships, no matter how created or organized","General professional partnership","Joint stock companies"],"ans":2,"exp":"Under Sec. 22(B), 'corporation' includes one-person corporations, partnerships no matter how created or organized, joint stock companies, joint accounts, associations and insurance companies. It expressly excludes general professional partnerships and qualified joint ventures or consortia for construction or energy projects. The GPP is the odd one out.","notes":["Excluded from 'corporation': GPPs and exempt joint ventures/consortia (construction projects, energy operations under government service contracts).","A GPP is not taxed; its partners pay tax on their distributive shares.","An OPC is a corporation taxed like any domestic corporation."],"upd":"","key":""},{"id":"Q07-02","quiz":7,"num":2,"sec":"3.1-CORP","q":"One of the following is a general professional partnership:","opts":["A partnership organized by a lawyer, an engineer and a CPA to provide professional advice.","A partnership organized by a group of CPAs for the common practice of accountancy.","A partnership organized by a group of CPAs for the purpose of selling real properties.","A general partnership organized by a group of engineers engaged in manufacturing of equipment."],"ans":1,"exp":"A GPP is formed by persons for the sole purpose of exercising their common profession, no part of the income being derived from engaging in any trade or business (Sec. 22(B)). CPAs practicing accountancy together qualify. Choice a mixes different professions not exercising a common profession; c and d are engaged in trade or business, so they are taxable partnerships.","notes":["GPP test: common profession, and no income from trade or business.","Partnerships engaged in business are taxed as corporations (25% or 20% RCIT).","GPP partners: distributive share taxed at graduated rates, not eligible for 8%."],"upd":"","key":""},{"id":"Q07-03","quiz":7,"num":3,"sec":"3.1-CORP","q":"Which of the following corporations shall be classified as a large corporation?","opts":["With gross sales of less than P3,000,000","With gross sales of P3,000,000 to less than P20,000,000","With gross sales of P20,000,000 to less than P1,000,000,000","With gross sales of P1,000,000,000 and above"],"ans":3,"exp":"RR 8-2024 classifies taxpayers by gross sales: micro (less than P3M), small (P3M to less than P20M), medium (P20M to less than P1B) and large (P1B and above). A corporation with gross sales of P1B and above is large.","notes":["Micro < P3M; small P3M to < P20M; medium P20M to < P1B; large P1B and above.","Taxpayers under the BIR's Large Taxpayers Service are classified as large regardless of gross sales.","Micro and small taxpayers enjoy reduced penalties and simplified returns."],"upd":"EOPT: taxpayer classification under RR 8-2024.","key":""},{"id":"Q07-04","quiz":7,"num":4,"sec":"3.1-CORP","q":"Which of the following corporations shall be taxed upon its taxable income derived during each taxable year from all sources within and without the Philippines?","opts":["Domestic corporation","Resident foreign corporation","Nonresident foreign corporation","None of the choices"],"ans":0,"exp":"A domestic corporation, organized under Philippine law, is taxed on worldwide taxable income (Sec. 27(A)). Foreign corporations, resident or not, are taxed only on income from Philippine sources.","notes":["Domestic: worldwide income; RCIT 25% (20% if net taxable income not over P5M and total assets excluding land not over P100M).","RFC: Philippine-source taxable income at 25%.","NRFC: 25% final tax on Philippine-source gross income."],"upd":"","key":""},{"id":"Q07-05","quiz":7,"num":5,"sec":"3.1-CORP","q":"Which of the following corporations shall be taxed upon its taxable income derived during each taxable year from all sources within the Philippines?","opts":["Domestic corporation","Resident foreign corporation","Nonresident foreign corporation","None of the choices"],"ans":1,"exp":"A resident foreign corporation (engaged in trade or business in the Philippines) is taxed on its taxable (net) income from Philippine sources at 25% (Sec. 28(A)(1)). A domestic corporation is taxed on worldwide income, and an NRFC is taxed on gross, not taxable, income.","notes":["RFC rate is always 25%; the 20% small-corporation rate is for domestic corporations only.","RFC branch profits remitted to the head office: 15% branch profit remittance tax.","RFC is also subject to MCIT beginning the 4th taxable year of operations."],"upd":"","key":""},{"id":"Q07-06","quiz":7,"num":6,"sec":"3.1-CORP","q":"Which of the following corporations shall be subject to final tax upon its gross income derived during each taxable year from all sources within the Philippines?","opts":["Domestic corporation","Resident foreign corporation","Nonresident foreign corporation","None of the choices"],"ans":2,"exp":"A nonresident foreign corporation, not engaged in trade or business in the Philippines, is subject to a 25% final tax on its gross income from Philippine sources, withheld by the payor (Sec. 28(B)(1)). Domestic and resident foreign corporations are taxed on net taxable income.","notes":["NRFC: 25% final tax on gross income, no deductions.","Special NRFC rates: film owners/lessors 25%, vessel lessors 4.5%, aircraft/machinery lessors 7.5%.","Treaty rates may reduce the NRFC tax."],"upd":"","key":""},{"id":"Q07-07","quiz":7,"num":7,"sec":"3.1-CORP","q":"First statement: A one-person corporation is a corporation with a single stockholder.\nSecond statement: Only a natural person, trust or an estate may form a one-person corporation.","opts":["Both statements are correct.","Both statements are incorrect.","Only the first statement is correct.","Only the second statement is correct."],"ans":0,"exp":"Under the Revised Corporation Code (RA 11232, Sec. 116), a one-person corporation has a single stockholder, and only a natural person, trust or estate may form one. For tax purposes an OPC is a domestic corporation.","notes":["Banks, quasi-banks, pre-need, trust, insurance, publicly listed companies and non-chartered GOCCs may not incorporate as OPCs.","A natural person forming an OPC must be of legal age.","OPCs are taxed at 25% or 20% RCIT like other domestic corporations."],"upd":"","key":""},{"id":"Q07-08","quiz":7,"num":8,"sec":"3.1-CORP","q":"They are constituted when a group of individuals, acting jointly, establish and operate a business enterprise under an artificial name, with an invested capital divided into transferable shares, an elected board of directors, and other corporate characteristics, but operating without formal governmental authority.","opts":["Joint stock companies","Joint accounts or cuentas en participacion","Associations","Joint ventures"],"ans":0,"exp":"This is the classic definition of a joint stock company: it has corporate features (artificial name, transferable shares, a board) but lacks formal government authority such as SEC registration. It is taxed as a corporation under Sec. 22(B).","notes":["Joint stock companies are corporations for tax purposes.","Joint account: one person shares in another's business by contributing capital.","Only exempt construction/energy joint ventures are excluded from 'corporation'."],"upd":"","key":""},{"id":"Q07-09","quiz":7,"num":9,"sec":"3.1-CORP","q":"They are constituted when one interests himself in the business of another by contributing capital thereto, and sharing in the profits or losses in the proportion agreed upon.","opts":["Joint stock companies","Joint accounts or cuentas en participacion","Associations","Joint ventures"],"ans":1,"exp":"A joint account (cuentas en participacion) exists when one person takes an interest in the business of another by contributing capital and sharing in profits or losses in an agreed proportion. It is included in the tax definition of a corporation under Sec. 22(B).","notes":["Joint accounts are taxed as corporations.","Joint stock company: corporate features without government authority.","Co-ownerships limited to preserving common property are not taxable entities."],"upd":"","key":""},{"id":"Q07-10","quiz":7,"num":10,"sec":"3.1-CORP","q":"A domestic corporation with net taxable income not exceeding P5,000,000 and total assets not exceeding P100,000,000 shall be taxed on its taxable income at what rate?","opts":["30%","25%","20%","10%"],"ans":2,"exp":"Under Sec. 27(A) as amended by CREATE, a domestic corporation with net taxable income of P5,000,000 or less and total assets of P100,000,000 or less (excluding the land on which its office, plant and equipment are situated) is taxed at 20%. All others pay 25%.","notes":["Both tests (net taxable income and total assets) must be met for 20%.","Land where the office/plant stands is excluded from total assets.","The 20% rate does not apply to resident foreign corporations or to passive income."],"upd":"CREATE: RCIT reduced from 30% to 25% (20% for qualified small domestic corporations) effective July 1, 2020.","key":""},{"id":"Q07-11","quiz":7,"num":11,"sec":"3.1-CORP","q":"A resident foreign corporation with net taxable income not exceeding P5,000,000 and total assets not exceeding P100,000,000 shall be taxed on its taxable income at what rate?","opts":["30%","25%","20%","10%"],"ans":1,"exp":"The 20% preferential rate for small corporations under CREATE applies only to domestic corporations. A resident foreign corporation is taxed at 25% of its Philippine-source taxable income regardless of its income or asset size (Sec. 28(A)(1)).","notes":["RFC: always 25% RCIT.","Domestic small corporations: 20%.","NRFC: 25% of gross income (final)."],"upd":"CREATE: RFC rate reduced from 30% to 25% effective July 1, 2020.","key":""},{"id":"Q07-12","quiz":7,"num":12,"sec":"9","q":"A registered business enterprise (RBE) under the Enhanced Deductions Regime, the taxable income of which is derived from registered projects or activities within the taxable year, shall be taxed on its taxable income at what rate?","opts":["30%","25%","20%","10%"],"ans":2,"exp":"CREATE MORE (RA 12066) set the corporate income tax of RBEs under the Enhanced Deductions Regime at 20% of taxable income from registered projects or activities, instead of the regular 25%. The RBE also claims the enhanced deductions (e.g., 100% additional deduction on power expenses).","notes":["ED regime RBE: 20% RCIT plus enhanced deductions.","Qualified export enterprises may instead choose the 5% SCIT on gross income earned in lieu of all national and local taxes.","Income from non-registered activities is taxed at the regular rate."],"upd":"CREATE MORE: RBEs under the Enhanced Deductions Regime pay 20% RCIT (instead of 25%); qualified export enterprises may opt for the 5% SCIT on gross income earned in lieu of all national and local taxes. The source stem did not name the regime; it was added for clarity.","key":""},{"id":"Q07-13","quiz":7,"num":13,"sec":"3.1-CORP","q":"Proprietary educational institutions and hospitals which are nonprofit shall pay a tax at what percent on their taxable income?","opts":["Thirty percent (30%)","Twenty-five percent (25%)","Fifteen percent (15%)","Ten percent (10%)"],"ans":3,"exp":"Sec. 27(B) imposes 10% on the taxable income of proprietary educational institutions and nonprofit hospitals, provided gross income from unrelated trade, business or activity does not exceed 50% of total gross income. If it does, the regular corporate rate applies to the entire taxable income.","notes":["10% rate; lost if unrelated gross income exceeds 50% of total gross income.","The 1% rate applied only from July 1, 2020 to June 30, 2023 (CREATE).","Nonstock, nonprofit educational institutions are exempt under the Constitution."],"upd":"CREATE: the rate was 1% from July 1, 2020 to June 30, 2023; it reverted to 10% on July 1, 2023.","key":""},{"id":"Q07-14","quiz":7,"num":14,"sec":"3.1-CORP","q":"Which of the following income is NOT from a related trade, business or activity of a domestic proprietary educational institution?","opts":["Income from the hospital where medical graduates are trained for residency.","Income from the canteen situated within the school campus.","Income from the bookstore situated within the school campus.","Income from rent of available office spaces in one of the school buildings."],"ans":3,"exp":"Related activities are those that support or are incidental to the school's educational purpose, such as a teaching hospital for residency training and on-campus canteens and bookstores serving students. Leasing office space to outsiders is an ordinary commercial activity unrelated to education.","notes":["Unrelated income counts toward the 50% test for losing the 10% rate.","Test: whether the activity is substantially related to the exercise of the educational function.","If unrelated gross income exceeds 50%, all taxable income is taxed at 25% or 20%."],"upd":"","key":""},{"id":"Q07-15","quiz":7,"num":15,"sec":"3.1-CORP","q":"A nonresident cinematographic film owner, lessor, or distributor shall pay a tax of:","opts":["twenty-five percent (25%) of its gross income from all sources within the Philippines.","seven and one-half percent (7 1/2%) of gross rentals, lease or charter fees from leases.","four and one-half percent (4 1/2%) of gross rentals or fees.","two and one-half percent (2 1/2%) of gross income from all sources within the Philippines."],"ans":0,"exp":"Sec. 28(B)(2) taxes a nonresident cinematographic film owner, lessor or distributor at 25% of gross income from Philippine sources. The 7.5% rate applies to lessors of aircraft, machinery and equipment; 4.5% to lessors of vessels; 2.5% is the rate on international carriers' Gross Philippine Billings.","notes":["Film owner/lessor/distributor: 25% of gross.","Vessel lessors (chartered by Philippine nationals, MARINA-approved): 4.5%.","Aircraft, machinery and other equipment lessors: 7.5%."],"upd":"","key":""},{"id":"Q07-16","quiz":7,"num":16,"sec":"3.1-CORP","q":"What is the minimum corporate income tax (MCIT) rate imposed upon any domestic corporation on its gross income within and without the Philippines?","opts":["Fifteen percent (15%)","Ten percent (10%)","Five percent (5%)","Two percent (2%)"],"ans":3,"exp":"Sec. 27(E) imposes MCIT at 2% of gross income on domestic corporations (and resident foreign corporations on Philippine-source gross income), beginning the 4th taxable year following commencement of operations, whenever it exceeds the regular income tax.","notes":["MCIT: 2% of gross income (1% only from July 1, 2020 to June 30, 2023).","Excess MCIT over RCIT may be carried forward and credited against RCIT for the next 3 years.","Gross income for MCIT: gross sales less sales returns, discounts, allowances and cost of goods sold."],"upd":"CREATE: MCIT was temporarily 1% from July 1, 2020 to June 30, 2023; it is 2% again from July 1, 2023.","key":""},{"id":"Q07-17","quiz":7,"num":17,"sec":"3.1-CORP","q":"A domestic corporation was registered with the BIR on January 1, 2018. In what year would the MCIT first be imposed on such corporation?","opts":["2018","2021","2022","2024"],"ans":2,"exp":"MCIT applies beginning the 4th taxable year following the year of commencement of business operations (Sec. 27(E)(1)); under RR 9-98 the year of BIR registration is treated as the year of commencement. Counting from 2018: 2019 is the 1st, 2020 the 2nd, 2021 the 3rd and 2022 the 4th taxable year following commencement, so MCIT first applies in 2022.","notes":["MCIT starts on the 4th taxable year following the year of commencement (year of BIR registration).","For 2022 the MCIT rate was 1% (CREATE temporary rate, July 2020 to June 2023).","Choice b (2021) is a common trap: it is only the 3rd year following commencement."],"upd":"","key":""},{"id":"Q07-18","quiz":7,"num":18,"sec":"3.1-CORP","q":"The MCIT shall be imposed upon a domestic corporation or a resident foreign corporation:\nI: whenever such corporation has a zero or negative taxable income;\nII: when the amount of minimum corporate income tax is greater than the normal income tax due from such corporation.","opts":["Both I and II are correct","Neither I nor II is correct","Only I is correct","Only II is correct"],"ans":0,"exp":"Sec. 27(E)(1) imposes the MCIT whenever the corporation has zero or negative taxable income, or whenever the MCIT exceeds the regular corporate income tax due. Both statements are correct; the corporation pays whichever is higher.","notes":["Compare RCIT and MCIT each year (quarterly as well); pay the higher.","MCIT may be suspended by the CIR for prolonged labor dispute, force majeure or legitimate business reverses.","Excess MCIT is creditable against RCIT in the next 3 years."],"upd":"","key":""},{"id":"Q07-19","quiz":7,"num":19,"sec":"3.1-CORP","q":"An international carrier doing business in the Philippines shall pay a tax of:","opts":["three percent (3%) on its gross receipts.","two and one-half percent (2 1/2%) on its 'Gross Philippine Billings.'","two percent (2%) on its 'Gross Philippine Billings.'","one and one-half percent (1 1/2%) on its gross receipts."],"ans":1,"exp":"Sec. 28(A)(3) taxes international air and shipping carriers doing business in the Philippines at 2.5% of Gross Philippine Billings (GPB). For air carriers, GPB is based on tickets for flights originating from the Philippines in a continuous and uninterrupted flight, wherever the ticket is sold; for shipping, on outbound passage, cargo and mail from Philippine ports.","notes":["Rate: 2.5% of GPB, subject to treaty reduction or exemption based on reciprocity.","Round trip originating in the Philippines: only the outbound leg is GPB.","Transshipment: only the Philippine-carrier portion of the flight counts."],"upd":"","key":""},{"id":"Q07-20","quiz":7,"num":20,"sec":"3.1-CORP","q":"A nonresident owner or lessor of vessels chartered by Philippine nationals shall be subject to a tax of:","opts":["twenty-five percent (25%) of its gross income from all sources within the Philippines.","seven and one-half percent (7 1/2%) of gross rentals, lease or charter fees from leases.","four and one-half percent (4 1/2%) of gross rentals, lease or charter fees from leases.","two and one-half percent (2 1/2%) of gross income from all sources within the Philippines."],"ans":2,"exp":"Sec. 28(B)(3) taxes nonresident owners or lessors of vessels chartered by Philippine nationals at 4.5% of gross rentals, lease or charter fees, provided the charter is approved by MARINA. The 7.5% rate is for nonresident lessors of aircraft, machinery and other equipment.","notes":["Vessels: 4.5% of gross rentals (MARINA-approved charters).","Aircraft, machinery and other equipment: 7.5%.","Other NRFC income: 25% of gross."],"upd":"","key":""},{"id":"Q07-21","quiz":7,"num":21,"sec":"3.1-CORP","q":"Which of the following government-owned or controlled corporations, agencies or instrumentalities shall pay such rate of tax u
